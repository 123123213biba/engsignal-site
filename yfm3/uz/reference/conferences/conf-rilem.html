        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Konferensiyalar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;материалы и конструкции: испытания, долговечность&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/conferences/conf-rilem.jpg\" alt=\"RILEM Week\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;материалы и конструкции: испытания, долговечность&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima olamiz&lt;/td&gt;\n&lt;td&gt;труды RILEM (много в открытом доступе)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-concrete.html\"&gt;Beton va bog'lovchilar&lt;/a&gt;, &lt;a href=\"concepts/spec-materials.html\"&gt;Materialshunoslik&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"konferensiya-nima\"&gt;&lt;a href=\"reference/conferences/conf-rilem.html#konferensiya-nima\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Konferensiya nima&lt;/span&gt;&lt;/a&gt;Konferensiya nima&lt;/h2&gt;\n&lt;p&gt;RILEM Week — qurilish materiallari va konstruksiyalari sohasidagi ekspertlarni birlashtiruvchi yillik xalqaro ilmiy tadbir. Konferensiya fuqarolik qurilishining kelajagini belgilovchi fundamental tadqiqotlarni muhokama qilish uchun asosiy maydon hisoblanadi. RILEM Week sement fazalarini molekulyar modellashtirishdan tortib, yirik muhandislik inshootlarining chidamliligini baholashgacha bo‘lgan materialning to‘liq hayotiy siklini qamrab oladi.&lt;/p&gt;\n&lt;h2 id=\"tashkilotchilar-va-tarix\"&gt;&lt;a href=\"reference/conferences/conf-rilem.html#tashkilotchilar-va-tarix\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tashkilotchilar va tarix&lt;/span&gt;&lt;/a&gt;Tashkilotchilar va tarix&lt;/h2&gt;\n&lt;p&gt;Tashkilotchi — RILEM (Qurilish materiallari, tizimlari va konstruksiyalari bo‘yicha laboratoriyalar va ekspertlarning xalqaro ittifoqi). Tashkilot 1947-yilda tashkil etilgan. Betonning sinish mexanikasi va materiallarning oquvchanligi bo‘yicha ishlari zamonaviy xavfsizlik standartlarining asosiga aylangan Zdenek Bajant (Zdeněk P. Bažant) kabi olimlarning ishtiroki tashkilot tarixidagi muhim bosqich bo‘ldi. Shimoli-g‘arbiy universitet professori Bajant o‘nlab yillar davomida qurilish fanida matematik modellashtirish usullarini targ‘ib qilib, RILEM ilmiy kun tartibini shakllantirgan.&lt;/p&gt;\n&lt;h2 id=\"mavzular-va-seksiyalar\"&gt;&lt;a href=\"reference/conferences/conf-rilem.html#mavzular-va-seksiyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mavzular va seksiyalar&lt;/span&gt;&lt;/a&gt;Mavzular va seksiyalar&lt;/h2&gt;\n&lt;p&gt;RILEM Week ilmiy dasturi an’anaviy ravishda bir nechta asosiy yo‘nalishlarga bo‘linadi:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Beton va bog‘lovchi moddalar: sement gidratatsiyasi, CSH-gel mikrostrukturasi va betonning agressiv muhitdagi chidamliligi.&lt;/li&gt;\n&lt;li&gt;Materialshunoslik: uglerodli aerogellar va yuqori mustahkam qotishmalarni o‘z ichiga olgan yangi kompozitlarni ishlab chiqish.&lt;/li&gt;\n&lt;li&gt;Raqamlashtirish va modellashtirish: materiallar mustahkamligini bashorat qilish uchun neyron tarmoq potensiallarini qo‘llash.&lt;/li&gt;\n&lt;li&gt;Barqaror rivojlanish: qurilish materiallari ishlab chiqarishda uglerod izini kamaytirish usullari.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"u-yerda-nimalar-paydo-boladi\"&gt;&lt;a href=\"reference/conferences/conf-rilem.html#u-yerda-nimalar-paydo-boladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;U yerda nimalar paydo bo‘ladi&lt;/span&gt;&lt;/a&gt;U yerda nimalar paydo bo‘ladi&lt;/h2&gt;\n&lt;p&gt;Konferensiyada keyinchalik yangi standartlar uchun asos bo‘ladigan natijalar taqdim etiladi. Bu yerda kriogen qoliplar yordamida murakkab qotishmalardagi g‘ovaklikka qarshi kurashish usullaridan tortib, radio yutuvchi materiallar yaratish uchun anizotrop tuzilmalardan foydalanishgacha bo‘lgan ilg‘or texnologiyalar muhokama qilinadi.&lt;/p&gt;\n&lt;h2 id=\"qanday-kuzatish-va-ishtirok-etish\"&gt;&lt;a href=\"reference/conferences/conf-rilem.html#qanday-kuzatish-va-ishtirok-etish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday kuzatish va ishtirok etish&lt;/span&gt;&lt;/a&gt;Qanday kuzatish va ishtirok etish&lt;/h2&gt;\n&lt;p&gt;Konferensiya materiallari RILEM Proceedings shaklida ochiq kirish huquqi bilan nashr etiladi. Tadqiqotchilar va muhandislar uchun bu tekshirilgan ma’lumotlarning asosiy manbaidir. Dolzarb tadqiqotlarni kuzatib borish uchun RILEM rasmiy portalini monitoring qilish tavsiya etiladi.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/conferences/conf-rilem.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Zden%C4%9Bk_P._Ba%C5%BEant\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Zdeněk P. Bažant — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Zden%C4%9Bk_Pavel_Ba%C5%BEant_ForMemRS.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Royal Society uploader, CC BY-SA 4.0&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Konferensiyalar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"материалы и конструкции: испытания, долговечность"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"RILEM Week","description":"материалы и конструкции: испытания, долговечность","vcsPath":"refere
