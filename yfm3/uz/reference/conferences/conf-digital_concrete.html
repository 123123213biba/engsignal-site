        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Konferensiyalar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;3D-печать бетоном и цифровое строительство&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;3D-печать бетоном и цифровое строительство&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima olamiz&lt;/td&gt;\n&lt;td&gt;труды&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-build.html\"&gt;Qurilish texnologiyalari&lt;/a&gt;, &lt;a href=\"concepts/spec-concrete.html\"&gt;Beton va bog'lovchilar&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"konferensiya-haqida\"&gt;&lt;a href=\"reference/conferences/conf-digital_concrete.html#konferensiya-haqida\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Konferensiya haqida&lt;/span&gt;&lt;/a&gt;Konferensiya haqida&lt;/h2&gt;\n&lt;p&gt;Digital Concrete — bu qurilishda qo‘shimcha ishlab chiqarish (3D-bosma) texnologiyalariga bag‘ishlangan xalqaro ilmiy maydon. Konferensiya tadqiqotchilar, muhandislar va materialshunoslarni betonni 3D-bosish, qurilish jarayonlarini avtomatlashtirish va yangi bog‘lovchi tarkiblarni ishlab chiqish masalalarini muhokama qilish uchun birlashtiradi. Asosiy maqsad — an’anaviy qoliplardan raqamli shakl hosil qilish boshqaruviga o‘tishdir.&lt;/p&gt;\n&lt;h2 id=\"tashkilotchilar-va-tarix\"&gt;&lt;a href=\"reference/conferences/conf-digital_concrete.html#tashkilotchilar-va-tarix\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tashkilotchilar va tarix&lt;/span&gt;&lt;/a&gt;Tashkilotchilar va tarix&lt;/h2&gt;\n&lt;p&gt;Konferensiya betonni 3D-bosish (3DCP) usullarini standartlashtirish va ilmiy asoslash zarurati tufayli tashkil etilgan. U binolar va murakkab me’moriy shakllarni qurishni avtomatlashtirishga intilayotgan akademik institutlar va sanoat hamkorlari o‘rtasida ma’lumot almashish platformasi bo‘lib xizmat qiladi.&lt;/p&gt;\n&lt;h2 id=\"mavzular-va-seksiyalar\"&gt;&lt;a href=\"reference/conferences/conf-digital_concrete.html#mavzular-va-seksiyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mavzular va seksiyalar&lt;/span&gt;&lt;/a&gt;Mavzular va seksiyalar&lt;/h2&gt;\n&lt;p&gt;Konferensiya ishi bir nechta asosiy yo‘nalishlarni qamrab oladi:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Reologiya va aralashmalar tarkibi: betonning ekstruziya uchun zarur bo‘lgan xususiyatlarini o‘rganish.&lt;/li&gt;\n&lt;li&gt;Mexanik xususiyatlar va chidamlilik: bosilgan konstruksiyalarning mustahkamligi va mikrostrukturasini tahlil qilish.&lt;/li&gt;\n&lt;li&gt;Raqamli loyihalash va modellashtirish: sement toshining xatti-harakatlarini molekulyar darajada bashorat qilish uchun neyron tarmoq potensiallaridan (masalan, CSH-MLP) foydalanish.&lt;/li&gt;\n&lt;li&gt;Robotlashtirilgan tizimlar: yumshoq robototexnika tamoyillarini qurilish texnikasiga integratsiya qilish.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"u-yerda-nimalar-taqdim-etiladi\"&gt;&lt;a href=\"reference/conferences/conf-digital_concrete.html#u-yerda-nimalar-taqdim-etiladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;U yerda nimalar taqdim etiladi&lt;/span&gt;&lt;/a&gt;U yerda nimalar taqdim etiladi&lt;/h2&gt;\n&lt;p&gt;Digital Concrete konferensiyasida qurilishga yondashuvni o‘zgartiruvchi tadqiqot natijalari taqdim etiladi:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Murakkab shakllarni chiqindisiz yaratishga imkon beruvchi olinmaydigan qoliplarni 3D-bosish usullari.&lt;/li&gt;\n&lt;li&gt;Sement gidratatsiyasini modellashtirish uchun neyron tarmoqlarni qo‘llash.&lt;/li&gt;\n&lt;li&gt;Robotlarni boshqarishdagi innovatsiyalar: murakkab harakatlar uchun bitta aktuatorni ishlatishdan tortib, boshqaruv kontrollerlarida asinxron mantiqiy tarmoqlarni qo‘llashgacha.&lt;/li&gt;\n&lt;li&gt;Sanoatning uglerod izini kamaytiradigan barqaror qurilish materiallari bo‘yicha tadqiqotlar.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"qanday-kuzatish-va-ishtirok-etish\"&gt;&lt;a href=\"reference/conferences/conf-digital_concrete.html#qanday-kuzatish-va-ishtirok-etish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday kuzatish va ishtirok etish&lt;/span&gt;&lt;/a&gt;Qanday kuzatish va ishtirok etish&lt;/h2&gt;\n&lt;p&gt;Konferensiyada ishtirok etish taqriz qilinadigan ilmiy ishlarni nashr etishni nazarda tutadi. Yangiliklarni qo‘shimcha ishlab chiqarish va materialshunoslik sohasidagi profil assotsiatsiyalarining rasmiy portallari orqali kuzatish mumkin. Konferensiya materiallari muhandis-loyihachilar uchun fundamental baza bo‘lib xizmat qiladigan to‘plamlar ko‘rinishida nashr etiladi.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"reference/conferences/conf-digital_concrete.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;Digital Concrete asosida materialshunoslik va raqamli boshqaruv sintezi yotadi. Asosiy tushuncha — «yangi yotqizilgan aralashmaning reologiyasi» bo‘lib, u betonning so‘pdan chiqish va keyingi qatlamlar og‘irligini ushlab turish qobiliyatini belgilaydi. Klassik betonlashdan farqli o‘laroq, bu yerda qotish tezligi va qatlamlararo yopishqoqlik (adgeziya) muhim ahamiyatga ega. Zamonaviy tadqiqotlar betonning makroskopik xususiyatlarini mikrostrukturali modellashtirish bilan bog‘laydi, bunda neyron tarmoqlar aralashma tarkibini optimallashtirishga yordam beradi.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/conferences/conf-digital_concrete.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/Concrete_(%D0%B0%D0%BB%D1%8C%D0%B1%D0%BE%D0%BC_Fear_Factory)\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Concrete (альбом Fear Factory) — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/ma14143800\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;3D Concrete Printing: A Systematic Review of Rheology, Mix Designs, Mechanical, Microstructural, and Durability Characteristics&lt;/a&gt; — sharh, Materials (Basel) 2021&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1089/3dp.2021.0024\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;3D Printed Formwork for Concrete: State-of-the-Art, Opportunities, Challenges, and Applications&lt;/a&gt; — sharh, 3D Print Addit Manuf 2022&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1089/3dp.2020.0331\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Additive Manufacturing of Sustainable Construction Materials and Form-finding Structures: A Review on Recent Progresses&lt;/a&gt; — sharh, 3D Print Addit Manuf 2022&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Konferensiyalar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"3D-печать бетоном и цифровое строительство"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Digital Concrete","description":"3D-печать бетоном и цифровое строительство","vcsPath":"reference/conferences/conf-digital_concrete.md"},"headings":[{"title":"Konferensiya haqida","href":"reference/conferences/conf-digital_concrete.html#konferensiya-haqida","level":2},{"title":"Tashkilotchilar va tarix","href":"reference/conferences/conf-digital_concrete.html#tashkilotchilar-va-tarix","level":2},{"title":"Mavzular va seksiyalar","href":"reference/conferences/conf-digital_concrete.html#mavzular-va-seksiyalar","level":2},{"title":"U yerda nimalar taqdim etiladi","href":"reference/conferences/conf-digital_concrete.html#u-yerda-nimalar-taqdim-etiladi","level":2},{"title":"Qanday kuzatish va ishtirok etish","href":"reference/conferences/conf-digital_concrete.html#qanday-kuzatish-va-ishtirok-etish","level":2},{"title":"Nazariya","href":"reference/conferences/conf-digital_concrete.html#nazariya","level":2},{"title":"Manbalar","href":"reference/conferences/conf-digital_concrete.html#manbalar","level":2}],"title":"Digital Concrete"},"router":{"pathname":"reference/conferences/conf-digital_concrete","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
