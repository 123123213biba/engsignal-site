            {"data":{"leading":false,"html":"&lt;p&gt;146 ta tushuncha&lt;/p&gt;\n&lt;h2 id=\"m\"&gt;&lt;a href=\"reference/glossary.html#m\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M&lt;/span&gt;&lt;/a&gt;M&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-mechanics.html\"&gt;Materiallar qarshiligi va mexanika&lt;/a&gt; — Прочность, жёсткость, устойчивость: классические задачи и свежие решения — с формулами и эпюрами.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-materials.html\"&gt;Materialshunoslik&lt;/a&gt; — Сталь, композиты, дерево, полимеры, стекло: структура → свойства → применение.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/membrannye-usiliya.html\"&gt;Membrana kuchlanishlari&lt;/a&gt; — Qobiq tekisligida ta’sir qiluvchi ichki kuchlar bo‘lib, ular konstruksiyaning egilishsiz ishlashini ta’minlaydi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/meshi.html\"&gt;Mesh&lt;/a&gt; — Obyekt yuzasini uchburchaklar to'ri sifatida yaqinlashtirish bo'lib, fayl hajmini kamaytirish uchun soddalashtirishni talab qiladi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mujoco.html\"&gt;MuJoCo&lt;/a&gt; — Tizim tomonidan yaratilgan sahnalarning tayyorligini tekshirish va simulyatsiya qilish uchun ishlatiladigan jismoniy modellashtirish muhiti.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/lite-v-zamorozhennye-formy.html\"&gt;Muzlatilgan qolipga quyish&lt;/a&gt; — Kerakli mustahkamlikka erishish uchun namlikning muzlashi hisobiga qum qolipi past haroratlarda muzlatiladigan quyish texnologiyasi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"r\"&gt;&lt;a href=\"reference/glossary.html#r\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Р&lt;/span&gt;&lt;/a&gt;Р&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-axial.html\"&gt;Растяжение и сжатие&lt;/a&gt; — Осевые нагрузки, напряжения, закон Гука.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-developables.html\"&gt;Развёртки, оригами, кириками&lt;/a&gt; — Развёртываемые поверхности, складчатые конструкции.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-robotics.html\"&gt;Роботы на стройке&lt;/a&gt; — Кирпичекладущие роботы, дроны, автоматизация.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/robot-workspace.html\"&gt;Рабочая зона робота&lt;/a&gt; — Yumshoq robotning manevr qilishi uchun mavjud bo'lgan fazo hajmi ko'rsatkichi, konstruksiya samaradorligini baholash uchun ishlatiladi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rf-mixer.html\"&gt;радиочастотный смеситель&lt;/a&gt; — Kiruvchi signallarni vaqt sohasida ko'paytiruvchi analog hisoblash tuguni, bu chastota sohasidagi chiziqli o'ralishga tengdir.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/distributed-boolean-chaos.html\"&gt;Распределенный булев хаос&lt;/a&gt; — Bitta chipda minglab mustaqil entropiya manbalarini yaratish orqali tasodifiy sonlarni hosil qilish uchun ishlatiladigan fizik hodisa.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"i\"&gt;&lt;a href=\"reference/glossary.html#i\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;И&lt;/span&gt;&lt;/a&gt;И&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-bending.html\"&gt;Изгиб и балки&lt;/a&gt; — Эпюры моментов, прогибы, балки переменного сечения.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"k\"&gt;&lt;a href=\"reference/glossary.html#k\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;К&lt;/span&gt;&lt;/a&gt;К&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-torsion.html\"&gt;Кручение&lt;/a&gt; — Валы, тонкостенные профили, депланация.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-dynamics.html\"&gt;Колебания и динамика&lt;/a&gt; — Собственные частоты, демпфирование, удар.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-composites.html\"&gt;Композиты&lt;/a&gt; — Стекло- и углепластики, FRP-арматура.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-ceramics_glass.html\"&gt;Керамика и стекло&lt;/a&gt; — Хрупкие материалы, остекление, огнеупоры.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-corrosion.html\"&gt;Коррозия&lt;/a&gt; — Ржавление арматуры, защита, ингибиторы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-masonry.html\"&gt;Каменная кладка&lt;/a&gt; — Кирпич, камень, исторические здания.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kirigami-supports.html\"&gt;киригами-опоры&lt;/a&gt; — Mikrorobot oyoqlarining sozlanuvchi tirqishli, ho'llanishni boshqaradigan va robotni menisk yordamida suvda ushlab turadigan ko'p qatlamli…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/silicon-on-insulator.html\"&gt;Кремний на изоляторе&lt;/a&gt; — Dielektrik taglik ustidagi kremniy qatlamidan iborat struktura bo'lib, nanofoton qurilmalarni yaratish uchun platforma sifatida ishlatiladi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"u\"&gt;&lt;a href=\"reference/glossary.html#u\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;У&lt;/span&gt;&lt;/a&gt;У&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-stability.html\"&gt;Устойчивость и потеря устойчивости&lt;/a&gt; — Продольный изгиб стержней, оболочек, панелей.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-fatigue_fracture.html\"&gt;Усталость и разрушение&lt;/a&gt; — Трещины, циклическая прочность, механика разрушения.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/bonding-angle.html\"&gt;угол склейки&lt;/a&gt; — Ikkita piezoelektrik qatlam orasidagi o'zaro yo'nalish burchagi, piezoelektrik koeffitsientlar belgilarini va parazit modalarni bostirishni…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"p\"&gt;&lt;a href=\"reference/glossary.html#p\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;П&lt;/span&gt;&lt;/a&gt;П&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-plates_shells.html\"&gt;Пластины и оболочки&lt;/a&gt; — Тонкостенные конструкции, мембраны, купола.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-projections.html\"&gt;Проекции и виды&lt;/a&gt; — Ортогональные, аксонометрические и перспективные проекции.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-surfaces.html\"&gt;Поверхности и пересечения&lt;/a&gt; — Линии пересечения, линейчатые поверхности, коники.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-polymers.html\"&gt;Полимеры&lt;/a&gt; — Пластики, эластомеры, герметики.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/high-density-recycled-polyurethane.html\"&gt;переработанный полиуретан высокой плотности&lt;/a&gt; — Bino massasini yengillashtirish, seysmik chidamlilik va polning issiqlik izolyatsiyasini oshirish maqsadida sement qoplamasini almashtirish…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/floating-floor.html\"&gt;плавающий пол&lt;/a&gt; — Harorat deformatsiyalarining binoning ko'taruvchi elementlariga o'tishini istisno qiluvchi pol materialini yotqizish konstruktiv yechimi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/primitive-based-sampling-stream.html\"&gt;примитивный поток&lt;/a&gt; — Puasson jarayoni va Boks-Myuller almashtirishi orqali nuqtalarni hosil qiluvchi, kichik maydonli Gauss primitivlari uchun stoxastik…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/wire-bonding-junctions.html\"&gt;Проволочные соединительные узлы&lt;/a&gt; — Aktuator segmentlarini mahalliy faollashtirish va qisqarishlarni fazoviy dasturlash imkonini beruvchi konstruktiv elementlar.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mimo-spatial-multiplexing.html\"&gt;пространственное мультиплексирование MIMO&lt;/a&gt; — Efir vaqtini qisqartirish uchun bir vaqtning o'zida bir nechta vazn oqimlarini uzatuvchi ko'p antennali texnologiya.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"c\"&gt;&lt;a href=\"reference/glossary.html#c\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C&lt;/span&gt;&lt;/a&gt;C&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-geometry.html\"&gt;Chizma geometriya va grafika&lt;/a&gt; — Проекции, поверхности, пересечения, развёртки — и то, как это живёт в CAD и вычислительной геометрии.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-cad_parametric.html\"&gt;CAD и параметрическое моделирование&lt;/a&gt; — Параметрика, NURBS, генеративный дизайн.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/c-center.html\"&gt;C-центр&lt;/a&gt; — Kremniydagi uglerod va kislorod atomlaridan tashkil topgan kompleks bo'lib, L-diapazonda yagona foton manbai sifatida xizmat qiladi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/raznost-chastot.html\"&gt;Chastotalar farqi&lt;/a&gt; — Tebranma tizimning rezonansdan og'ishini ko'rsatuvchi parametr bo'lib, ob'ektning suyuqlikdagi barqarorligini tushunish uchun muhimdir.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/csgv.html\"&gt;CSGV&lt;/a&gt; — Segmentlangan hajmlarni samarali saqlash va o'qish uchun ishlatiladigan yo'qotishsiz ma'lumotlarni siqish formati.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/csh-mlp.html\"&gt;CSH-MLP&lt;/a&gt; — Kalsiy silikat gidratining atom tuzilmalarini kvant-mexanik hisob-kitoblar aniqligida modellashtirish uchun ishlatiladigan mashinali…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"a\"&gt;&lt;a href=\"reference/glossary.html#a\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;А&lt;/span&gt;&lt;/a&gt;А&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-dg_algorithms.html\"&gt;Алгоритмы начерталки&lt;/a&gt; — Натуральная величина, метрические задачи как алгоритмы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/second-order-autocorrelation-function.html\"&gt;Автокорреляционная функция второго порядка&lt;/a&gt; — Yorug'lik manbasining kvant tabiatini tasdiqlash uchun ishlatiladigan metrika; g^(2)(0) &amp;lt; 0,5 qiymati emitentning yagona nuqson ekanligini…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/layout-agent.html\"&gt;Агент планировки&lt;/a&gt; — Ob'ektlarni aniqlashdagi geometrik xatolarni tuzatuvchi va sahna elementlari o'rtasidagi aloqalarni o'rnatuvchi tizim komponenti.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/articulation.html\"&gt;Артикуляция&lt;/a&gt; — Ob'ektning harakatlanuvchi bo'g'inlarini tavsiflash, bu jismoniy simulyatsiya uchun erkinlik darajalari va harakat chegaralarini belgilaydi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/asynchronous-logic-networks.html\"&gt;Асинхронные логические сети&lt;/a&gt; — Tashqi soat signalisiz ishlaydigan mantiqiy elementlar arxitekturasi, unda dinamika tranzistorlarning fizik kechikishlari bilan belgilanadi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"v\"&gt;&lt;a href=\"reference/glossary.html#v\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;В&lt;/span&gt;&lt;/a&gt;В&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-comp_geometry.html\"&gt;Вычислительная геометрия&lt;/a&gt; — Сетки, триангуляции, разбиения, алгоритмы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-uhpc.html\"&gt;Высокопрочный и фибробетон&lt;/a&gt; — UHPC, фибра, трещиностойкость.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/voxel.html\"&gt;Воксель&lt;/a&gt; — Segmentlangan ma'lumotlarda ob'ekt yorlig'i tayinlangan hajmli tasvir elementi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"b\"&gt;&lt;a href=\"reference/glossary.html#b\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;B&lt;/span&gt;&lt;/a&gt;B&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-concrete.html\"&gt;Beton va bog'lovchilar&lt;/a&gt; — Состав бетона и цемента: гидратация, добавки, долговечность, «зелёные» вяжущие.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-bim.html\"&gt;BIM и цифровое проектирование&lt;/a&gt; — Информационная модель здания.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/bioinspiratsiya.html\"&gt;Bio-ilhomlanish&lt;/a&gt; — Robotlarning samaradorligini oshirish uchun biologik tizimlardan konstruktiv yechimlar va boshqaruv tamoyillari o‘zlashtiriladigan…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/biomimeticheskiy-robot.html\"&gt;Biomimetik robot&lt;/a&gt; — Tuzilishi va harakatlanish prinsiplari biologik prototiplarga (hasharotlar, qushlar) taqlid qiluvchi qurilma boʻlib, u kichik miqyosda…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ogranichenie-zaprosov.html\"&gt;Bloklar so‘rovini cheklash&lt;/a&gt; — Kesh xotirasini optimallashtirish usuli bo‘lib, u tizimga faqat eng muhim ma’lumotlarni yuklash imkonini beradi va xotira resurslarini…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"h\"&gt;&lt;a href=\"reference/glossary.html#h\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Х&lt;/span&gt;&lt;/a&gt;Х&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-cement_chem.html\"&gt;Химия цемента и гидратация&lt;/a&gt; — Клинкер, C-S-H, тепловыделение, твердение.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-admixtures.html\"&gt;Химические добавки&lt;/a&gt; — Суперпластификаторы, ускорители, воздухововлекающие.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"m1\"&gt;&lt;a href=\"reference/glossary.html#m1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;М&lt;/span&gt;&lt;/a&gt;М&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-scm.html\"&gt;Минеральные добавки (SCM)&lt;/a&gt; — Зола-унос, шлак, метакаолин, стекло вместо части цемента.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-steel_structures.html\"&gt;Металлические конструкции&lt;/a&gt; — Фермы, рамы, соединения.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-bridges.html\"&gt;Мосты&lt;/a&gt; — Пролёты, вантовые и арочные системы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-fem_methods.html\"&gt;Метод конечных элементов&lt;/a&gt; — Сетки, элементы, сходимость.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-ml_surrogate.html\"&gt;Машинное обучение в расчётах&lt;/a&gt; — Суррогатные модели, PINN.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/inter-story-drift.html\"&gt;межэтажные перекосы&lt;/a&gt; — Sement qoplamasi o'rniga yengil poliuretan ishlatilganda kamayadigan bino karkasining deformatsiya parametri.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/finite-element-method.html\"&gt;Метод конечных элементов&lt;/a&gt; — Deformatsiyalanadigan qattiq jism mexanikasi masalalarini yechishning sonli usuli, modulli konstruksiyalarning kuchlanish-deformatsiya…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/second-thickness-shear-mode.html\"&gt;мода сдвига по толщине SH2&lt;/a&gt; — Qatlamlarning kristallografik o'qlarini burish va konstruktiv interferensiya hisobiga ikki qatlamli rezonatorda selektiv ravishda…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/drucker-prager-model.html\"&gt;Модель Друкера-Прагера&lt;/a&gt; — Ichki ishqalanishga ega materiallarning xatti-harakatini tavsiflovchi va oquvchanlik chegarasining gidrostatik bosimga bog'liqligini…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"g\"&gt;&lt;a href=\"reference/glossary.html#g\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Г&lt;/span&gt;&lt;/a&gt;Г&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-geopolymer.html\"&gt;Геополимеры и щелочные вяжущие&lt;/a&gt; — Бетон без портландцемента.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gaussian-stippling.html\"&gt;гауссов пунктир&lt;/a&gt; — Primitivlarni chuqurlik bo'yicha saralash zaruratini bartaraf etish uchun tartiblangan alfa-aralashtirishni ko'rinishning stoxastik…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hexagonal-lattice.html\"&gt;Гексагональная решетка&lt;/a&gt; — Statsionar holatlarni istisno qiluvchi va xaotik o'tishlarning uzluksiz generatsiyasini kafolatlaydigan mantiqiy elementlarning joylashuv…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hybrid-renderer.html\"&gt;гибридный рендерер&lt;/a&gt; — Gauss primitivlarini xiraligi va proyektiv maydoniga qarab fragmentli va primitiv tanlanma oqimlari o'rtasida moslashuvchan taqsimlaydigan…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/calcium-silicate-hydrate.html\"&gt;Гидросиликат кальция&lt;/a&gt; — Sement gidratatsiyasining asosiy mahsuloti bo'lib, sement toshining mustahkamligi va chidamliligini belgilovchi nanokristalli gel…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"d\"&gt;&lt;a href=\"reference/glossary.html#d\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Д&lt;/span&gt;&lt;/a&gt;Д&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-durability.html\"&gt;Долговечность&lt;/a&gt; — Хлориды, карбонизация, ЩСР, морозостойкость.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-timber.html\"&gt;Дерево и клеёные материалы&lt;/a&gt; — CLT, клеёный брус, деревянные небоскрёбы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-dem_particles.html\"&gt;Дискретные и частичные методы&lt;/a&gt; — DEM, SPH, моделирование гранулярных сред.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"s\"&gt;&lt;a href=\"reference/glossary.html#s\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;С&lt;/span&gt;&lt;/a&gt;С&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-steels.html\"&gt;Стали и сплавы&lt;/a&gt; — Марки, термообработка, микроструктура.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-seismic.html\"&gt;Сейсмостойкость&lt;/a&gt; — Землетрясения, изоляция, демпферы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-prefab.html\"&gt;Сборное и модульное&lt;/a&gt; — Заводские модули, узлы, монтаж.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/base-shear.html\"&gt;сдвигающая сила в основании&lt;/a&gt; — Pol massasi kamayganda pasayadigan, bino poydevoridagi seysmik kuch ko'rsatkichi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/entropy-generation-rate.html\"&gt;Скорость генерации энтропии&lt;/a&gt; — Tizimning unumdorlik ko'rsatkichi bo'lib, vaqt birligida hosil bo'lgan xaotik ma'lumotlar hajmini aks ettiradi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sintered-regolith.html\"&gt;Спеченный реголит&lt;/a&gt; — Asosiy qurilish resursi sifatida ishlatiladigan mahalliy oy materiali, fizik-mexanik xususiyatlari bo'yicha g'ovakli keramikaga yaqin.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/zl205a-alloy.html\"&gt;сплав ZL205A&lt;/a&gt; — Keng kristallanish oralig'iga ega, gaz g'ovakligi va cho'kish nuqsonlariga moyil bo'lgan quyma alyuminiy-mis qotishmasi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/shape-memory-alloy.html\"&gt;сплав с памятью формы&lt;/a&gt; — Mikrorobotning ko'taruvchi ramasidagi termik qisqarishni egilish deformatsiyasiga aylantiruvchi sun'iy sim-muskullar materiali.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"k1\"&gt;&lt;a href=\"reference/glossary.html#k1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;K&lt;/span&gt;&lt;/a&gt;K&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-structures.html\"&gt;Konstruksiyalar va binolar&lt;/a&gt; — Как стоят здания и мосты: железобетон, металл, дерево, кладка, фундаменты, сейсмика.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/k2eff.html\"&gt;k²eff&lt;/a&gt; — Elektr energiyasini akustik energiyaga aylantirish samaradorligini belgilovchi parametr; u qanchalik yuqori bo'lsa, filtrning o'tkazish…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/paletizatsiya-kesha.html\"&gt;Kesh paletizatsiyasi&lt;/a&gt; — Xotiradagi ma'lumotlarni siqish usuli bo'lib, unda to'liq qiymatlar o'rniga kichik jadval (palitra) indekslari saqlanadi, bu esa xotira…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cache-deadlock.html\"&gt;Kesh qulflanishi&lt;/a&gt; — Kesh xotirasi doimiy talab qilinadigan ma'lumotlar bilan to'lib qolishi va yangi ma'lumotlar uchun joy qolmasligi holati.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kinematika-kirigami.html\"&gt;Kirigami kinematikasi&lt;/a&gt; — Tekis varaqlardan aniq kesmalar va bukishlar orqali murakkab 3D tuzilmalarni yaratish usuli bo'lib, u ortiqcha detallarsiz geometriyani…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/visibility.html\"&gt;Kontrast&lt;/a&gt; — Korrelyatsion signalning shovqin fonidan qanchalik aniq ajralib turishini ko'rsatuvchi parametr.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/quantization.html\"&gt;Kvantlash&lt;/a&gt; — Model parametrlarining aniqligini kamaytirish orqali uning xotiradagi hajmini qisqartirish usulidir.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"zh\"&gt;&lt;a href=\"reference/glossary.html#zh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ж&lt;/span&gt;&lt;/a&gt;Ж&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-rc_structures.html\"&gt;Железобетонные конструкции&lt;/a&gt; — Плиты, колонны, преднапряжение.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"o\"&gt;&lt;a href=\"reference/glossary.html#o\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;О&lt;/span&gt;&lt;/a&gt;О&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-foundations.html\"&gt;Основания и фундаменты&lt;/a&gt; — Грунты, сваи, осадки.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-formwork.html\"&gt;Опалубка и твердение&lt;/a&gt; — Опалубка, прогрев, уход за бетоном.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/bulk-acoustic-wave-resonator.html\"&gt;объемный акустический резонатор&lt;/a&gt; — Rezonans chastotasi plyonka qalinligi bilan belgilanadigan akustik qurilma; radiochastota signallarini keng polosali filtrlash uchun…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ca-si-ratio.html\"&gt;Отношение Ca/Si&lt;/a&gt; — Kalsiy silikat gidratining mexanik xususiyatlari va tarkibiy evolyutsiyasini belgilovchi stexiometrik tarkib parametri.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"h1\"&gt;&lt;a href=\"reference/glossary.html#h1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;H&lt;/span&gt;&lt;/a&gt;H&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-fem.html\"&gt;Hisob va modellashtirish&lt;/a&gt; — Численные методы в инженерии: МКЭ, оптимизация, цифровые двойники.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/h-shaped-frame.html\"&gt;H-образная рама&lt;/a&gt; — Parvozni boshqarish, yerda emaklash va muhitlar orasida o'tish uchun shakl xotirali qotishma muskullari bilan harakatga keltiriladigan…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"t\"&gt;&lt;a href=\"reference/glossary.html#t\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Т&lt;/span&gt;&lt;/a&gt;Т&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-topopt.html\"&gt;Топологическая оптимизация&lt;/a&gt; — Форма, которую «находит» алгоритм.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/density-functional-theory.html\"&gt;Теория функционала плотности&lt;/a&gt; — Ma'lumotlarni belgilash va atom konfiguratsiyalarini optimallashtirish uchun ishda foydalaniladigan elektron tuzilmani hisoblashning…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/t6-heat-treatment.html\"&gt;термообработка T6&lt;/a&gt; — Qotishmaning cho'zilishdagi mustahkamlik chegarasini oshirish uchun qo'llaniladigan quyma buyumlarga termik ishlov berish rejimi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/path-tracing.html\"&gt;Трассировка путей&lt;/a&gt; — Vizualizatsiya aniqligi va tuzilmalarni fazoviy idrok etishni ta'minlaydigan global yoritish usuli.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"c1\"&gt;&lt;a href=\"reference/glossary.html#c1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ц&lt;/span&gt;&lt;/a&gt;Ц&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-digital_twin.html\"&gt;Цифровые двойники и мониторинг&lt;/a&gt; — Датчики на сооружениях, SHM.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cement-screed.html\"&gt;цементная стяжка&lt;/a&gt; — Zilzila paytida inersiya kuchlarini oshiradigan qo'shimcha ballast va parazit massani hosil qiluvchi an'anaviy yuqori zichlikdagi pol…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"q\"&gt;&lt;a href=\"reference/glossary.html#q\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q&lt;/span&gt;&lt;/a&gt;Q&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-build.html\"&gt;Qurilish texnologiyalari&lt;/a&gt; — Как строят сегодня: 3D-печать, модульность, BIM, роботы на площадке.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"3\"&gt;&lt;a href=\"reference/glossary.html#3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3&lt;/span&gt;&lt;/a&gt;3&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-printing_3d.html\"&gt;3D-печать в строительстве&lt;/a&gt; — Печать бетоном, межслойная прочность.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/3d-gaussian-splatting.html\"&gt;3D Gaussian Splatting&lt;/a&gt; — Chuqurlik bo'yicha saralash va tartiblangan alfa-aralashtirishdan foydalanadigan, Gauss primitivlarini rastrlash orqali real vaqt rejimida…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"a1\"&gt;&lt;a href=\"reference/glossary.html#a1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;A&lt;/span&gt;&lt;/a&gt;A&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/air-llm.html\"&gt;AIR-LLM&lt;/a&gt; — Katta til modellarining inferens arxitekturasi bo'lib, hisoblashlarni xotiradan radiochastota domeniga ko'chiradi va RF-aralashtirgichlarda…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/anizotropnoe-trenie.html\"&gt;Anizotrop ishqalanish&lt;/a&gt; — Tirnoqsimon uchli tirgaklarning bir tomonga sirpanish qarshiligi boshqa tomonga nisbatan yuqori bo'lgan va yo'naltirilgan emaklashni…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ald.html\"&gt;Atom-qatlamli cho'ktirish&lt;/a&gt; — Gaz fazasidagi reagentlar yordamida sirtda o'ta yupqa va bir xil qalinlikdagi plyonkalarni hosil qilish texnologiyasi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"d1\"&gt;&lt;a href=\"reference/glossary.html#d1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D&lt;/span&gt;&lt;/a&gt;D&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/odnotochechnye-raschety-dft.html\"&gt;DFT bir nuqtali hisob-kitoblari&lt;/a&gt; — Atomlarning koordinatalarini o'zgartirmasdan, belgilangan konfiguratsiya uchun energiya va kuchlarni hisoblashdir.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"e\"&gt;&lt;a href=\"reference/glossary.html#e\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;E&lt;/span&gt;&lt;/a&gt;E&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/elektrosmachivanie.html\"&gt;Elektro-ho'llanish&lt;/a&gt; — Robot tirgaklariga kuchlanish berilganda yuzaga keladigan va suvga sho'ng'ish uchun uning sirt tarangligini buzadigan hodisa.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/koeffitsient-elektromehanicheskoy-svyazi.html\"&gt;Elektromexanik bog'lanish koeffitsienti&lt;/a&gt; — Piezoelektrik rezonatorlarda elektr energiyasini mexanik energiyaga aylantirish samaradorligi parametri, ikki qatlamli strukturada 6 GGs…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/yavnyy-metod-explicit-v-abaqus.html\"&gt;Explicit usuli&lt;/a&gt; — Murakkab kontaktli masalalarda hisoblash barqarorligini ta’minlash uchun vaqt bo‘yicha bosqichma-bosqich hisoblash algoritmi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"f\"&gt;&lt;a href=\"reference/glossary.html#f\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;F&lt;/span&gt;&lt;/a&gt;F&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/ghost-imaging.html\"&gt;Fantom vizualizatsiya&lt;/a&gt; — Ob'ektning fazoviy tuzilishini ob'ekt bilan o'zaro ta'sir qilmaydigan tayanch nur va zondlash nuri o'rtasidagi korrelyatsion o'lchovlar…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/flop.html\"&gt;FLOP&lt;/a&gt; — Suzuvchi nuqtali operatsiya; WoQ (Weights-only Quantization) — faqat model vaznlarini kvantlash.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fotonnyy-kristall.html\"&gt;Fotonli kristal&lt;/a&gt; — Yorug'likni boshqarish va uni rezonator ichida ushlab turish imkonini beruvchi davriy nanostrukturadir.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fundamentalnaya-oblast.html\"&gt;Fundamental soha&lt;/a&gt; — Tekislikni hech qanday bo‘shliqlarsiz to‘liq qoplaydigan minimal geometrik element.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/funktsionalnaya-rekursiya.html\"&gt;Funksional rekursiya&lt;/a&gt; — Bir xil qayta konfiguratsiya qilinadigan mexanik strukturani turli mexanik vazifalar uchun ko'p marta qayta tayinlash strategiyasi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"g1\"&gt;&lt;a href=\"reference/glossary.html#g1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;G&lt;/span&gt;&lt;/a&gt;G&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/g-buffer.html\"&gt;G-Buffer&lt;/a&gt; — Har bir piksel uchun geometrik xususiyatlarni (normallar, chuqurlik, materiallar) saqlaydigan oraliq bufer bo'lib, u murakkab geometriyaga…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/general-matrix-vector-multiplication.html\"&gt;GEMV&lt;/a&gt; — Neyrotarmoqlarning mantiqiy xulosasi uchun asosiy amal bo'lib, ishda vaznlarni OFDM-kichik tashuvchilariga kodlash va analog o'ralish…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"i1\"&gt;&lt;a href=\"reference/glossary.html#i1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;I&lt;/span&gt;&lt;/a&gt;I&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/interdigital-transducer.html\"&gt;IDT&lt;/a&gt; — Sirt akustik to'lqinlarini yaratish va qayd etish uchun pyezoelektrik substratlarga purkaladigan komponent.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ihtc.html\"&gt;IHTC&lt;/a&gt; — Metallning qotishi paytida qolip va quyma chegarasidagi issiqlik almashinuvi jadalligini miqdoriy jihatdan ifodalovchi parametr.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/in-situ-resource-utilization.html\"&gt;ISRU&lt;/a&gt; — Hayotiy faoliyatni ta'minlash va qurilish uchun mahalliy yerdan tashqari resurslardan foydalanish konsepsiyasi, bu Yerdan materiallar…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"l\"&gt;&lt;a href=\"reference/glossary.html#l\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;L&lt;/span&gt;&lt;/a&gt;L&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/metod-lamberta.html\"&gt;Lambert modeli&lt;/a&gt; — Sirtning yorqinligi kuzatish burchagiga bog‘liq bo‘lmagan, yorug‘lik barcha yo‘nalishlarda bir xil tarqaladigan yoritish modelidir.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/lift-off.html\"&gt;Lift-off usuli&lt;/a&gt; — Metall qatlamini rezist ustiga yotqizib, so‘ngra rezistni eritish orqali keraksiz metallni olib tashlash texnologiyasi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/level-of-detail.html\"&gt;LOD&lt;/a&gt; — Obyektning muhimligiga qarab uning detallash darajasini o‘zgartirish usuli.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"n\"&gt;&lt;a href=\"reference/glossary.html#n\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;N&lt;/span&gt;&lt;/a&gt;N&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/ray-tracing.html\"&gt;Nur izlash&lt;/a&gt; — Radio to‘lqinlarning tarqalishini modellashtirish usuli bo‘lib, u aks etish va to‘siqlarni hisobga olgan holda real aloqa sharoitlarini…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"o1\"&gt;&lt;a href=\"reference/glossary.html#o1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;O&lt;/span&gt;&lt;/a&gt;O&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/sqc.html\"&gt;O'ta o'tkazuvchan kvant sxemasi&lt;/a&gt; — Parametrik chastota konvertatsiyasi va foton-fonon chalkash juftliklarini yaratish uchun nochiziqli element sifatida ishlatiladigan qurilma.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/obratnye-ssylki.html\"&gt;Orqaga havolalar&lt;/a&gt; — Ma'lumotlar oqimida takrorlanuvchi qiymatlarni oldingi o'rinlarga ishora qilish orqali almashtirish usuli bo'lib, u xotirani tejaydi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"p1\"&gt;&lt;a href=\"reference/glossary.html#p1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;P&lt;/span&gt;&lt;/a&gt;P&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/piezoelectric-on-piezoelectric.html\"&gt;P3F&lt;/a&gt; — Qatlamlar simmetriyasini muhandislik yo‘li bilan boshqarish orqali materialni haddan tashqari yupqalashtirmasdan kerakli akustik modlarni…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/perplexity.html\"&gt;PPL&lt;/a&gt; — Til modelining sifat ko‘rsatkichi; qiymat qanchalik past bo‘lsa, model keyingi tokenni shunchalik aniq bashorat qiladi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/faktor-parsella.html\"&gt;Purcell effekti&lt;/a&gt; — Rezonator kvant obyektining nurlanish tezligini bo‘shliqqa nisbatan necha barobar oshirishini ko‘rsatuvchi ko‘rsatkich.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"r1\"&gt;&lt;a href=\"reference/glossary.html#r1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;R&lt;/span&gt;&lt;/a&gt;R&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/ray-marching.html\"&gt;Ray marching&lt;/a&gt; — Hajmli ma’lumotlarni renderlash usuli bo‘lib, unda nur voksel setkasi bo‘ylab o‘tib, zichlik yoki rang qiymatlarini to‘playdi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rgb-d-scanning.html\"&gt;RGB-D сканирование&lt;/a&gt; — Rangli tasvir va chuqurlik ma'lumotlarini o'z ichiga olgan xona geometriyasi va ob'ektlari haqida ma'lumot olish usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/room-py.html\"&gt;Room.py&lt;/a&gt; — Simulyatorlar uchun geometriya, ob'ektlarning artikulyatsiyasi va makonning jismoniy xususiyatlarini tavsiflovchi bajariladigan fayl.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"s1\"&gt;&lt;a href=\"reference/glossary.html#s1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;S&lt;/span&gt;&lt;/a&gt;S&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/segmentatsiya.html\"&gt;Segmentatsiya&lt;/a&gt; — Raqamli tasvirni har bir element (voksel) ma'lum bir ob'ektga tegishli deb tasniflanadigan hududlarga ajratish jarayoni.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/smooth-overlap-of-atomic-positions.html\"&gt;SOAP&lt;/a&gt; — C-S-H ma'lumotlar to'plamining tarkibiy xilma-xilligi va konfiguratsion fazosini tahlil qilish uchun ishlatiladigan deskriptorlar usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/svd.html\"&gt;SVD&lt;/a&gt; — Matritsani uning eng muhim komponentlarini ajratib olish uchun qismlarga ajratish usuli.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"t1\"&gt;&lt;a href=\"reference/glossary.html#t1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;T&lt;/span&gt;&lt;/a&gt;T&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/chetyrehzvennyy-mehanizm.html\"&gt;To'rt bo'g'inli mexanizm&lt;/a&gt; — Chiziqli harakatni aylanish harakatiga aylantirib beruvchi kinematik zanjirdir.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/topologicheskoe-zatseplenie.html\"&gt;Topologik ilmoqli tizim&lt;/a&gt; — Qurilish elementlarini ulash prinsipi bo'lib, unda ular faqat o'z geometriyasi va o'zaro joylashuvi hisobiga birga ushlab turiladi, bu esa…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"u1\"&gt;&lt;a href=\"reference/glossary.html#u1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;U&lt;/span&gt;&lt;/a&gt;U&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/funktsiya-peredachi.html\"&gt;Uzatish funksiyasi&lt;/a&gt; — Raqamli ma’lumotlarni vizual xususiyatlarga (rang, shaffoflik) aylantiruvchi matematik qoida bo‘lib, u hajm ichidagi kerakli tuzilmalarni…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"v1\"&gt;&lt;a href=\"reference/glossary.html#v1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;V&lt;/span&gt;&lt;/a&gt;V&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/volcanite.html\"&gt;Volcanite&lt;/a&gt; — Oddiy uskunalarda zich segmentlangan ma'lumotlarni to'g'ridan-to'g'ri renderlash uchun ochiq kodli tizim.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vulkan.html\"&gt;Vulkan&lt;/a&gt; — GPU-da renderlash va ma'lumotlarni dekompressiyalashni apparatli tezlashtirish uchun ishlatiladigan grafik backend.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"z\"&gt;&lt;a href=\"reference/glossary.html#z\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Z&lt;/span&gt;&lt;/a&gt;Z&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/ladder-type-filter.html\"&gt;Zinapoyali filtr&lt;/a&gt; — Akustik rezonatorlar asosidagi radiochastota filtri konstruktsiyasi, uning LiNbO3 asosidagi prototiplari 18,6% nisbiy o'tkazish polosasini…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"n1\"&gt;&lt;a href=\"reference/glossary.html#n1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Н&lt;/span&gt;&lt;/a&gt;Н&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spatiotemporal-neural-reconstruction.html\"&gt;нейросетевая пространственно-временная реконструкция&lt;/a&gt; — Stoxastik shovqinni bostirish uchun joriy belgilarni va o'tgan kadrlarning tarixiy ma'lumotlarini birlashtiruvchi U-Net va MLP…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pushover-analysis.html\"&gt;нелинейный статический анализ&lt;/a&gt; — Konstruksiyaning ekspluatatsion yaroqlilik darajasi natijalari bo'yicha belgilanadigan hisob-kitob baholash usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/lithium-niobate.html\"&gt;Ниобат лития&lt;/a&gt; — Litiy niobati (LiNbO₃) — yuqori elektromexanik bog‘lanish koeffitsientiga ega bo‘lgan pyezoelektrik materialdir. U sirt akustik…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"f1\"&gt;&lt;a href=\"reference/glossary.html#f1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ф&lt;/span&gt;&lt;/a&gt;Ф&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/photonic-crystal-resonator.html\"&gt;Фотонно-кристаллический резонатор&lt;/a&gt; — Yorug'likni sindirish ko'rsatkichi davriy o'zgarib turadigan strukturada lokallashtirish orqali nurlanishni rezonansli kuchaytiruvchi…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fragment-based-sampling-stream.html\"&gt;фрагментный поток&lt;/a&gt; — Proyeksiya maydoni katta bo'lgan Gauss primitivlari kesish chegarasini hisobga olgan holda rastrlash orqali qayta ishlanadigan stoxastik…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"e1\"&gt;&lt;a href=\"reference/glossary.html#e1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Э&lt;/span&gt;&lt;/a&gt;Э&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/purcell-effect.html\"&gt;Эффект Парселла&lt;/a&gt; — Kvant emitentini kichik moda hajmli optik rezonatorga joylashtirish orqali spontan nurlanishni tezlashtirish fizik hodisasi.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"146 ta tushuncha"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Lug'at A–Z","description":"146 ta tushuncha","vcsPath":"reference/glossary.md"},"headings":[{"title":"M","href":"reference/glossary.html#m","level":2},{"title":"Р","href":"reference/glossary.html#r","level":2},{"title":"И","href":"reference/glossary.html#i","level":2},{"title":"К","href":"reference/glossary.html#k","level":2},{"title":"У","href":"reference/glossary.html#u","level":2},{"title":"П","href":"referenc
