        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"150\" cy=\"155\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"570\" cy=\"217\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · ROBOTICS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;140 мг вазндаги робот:&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ҳашаротлар муҳандисларни&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;қандай илҳомлантирди&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/bio-inspired-functional-recursion-enables-multi-mode-locomot-f1.jpg\" alt=\"Rasm 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Муҳандислар ҳаво, қуруқлик ва сувда ҳаракатлана оладиган 140 миллиграммли роботни яратишди. Ҳар бир муҳит учун алоҳида двигателлар ўрнига муаллифлар функционал рекурсия принципини қўллашди. Шакл хотирасига эга қотишмадан ясалган H-симон рама турли вазифаларни бажариш учун ўз конфигурациясини ўзгартиради.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-02/bio-inspired-functional-recursion-enables-multi-mode-locomot.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Роботнинг оғирлиги 35 мм узунликда атиги 140 мг.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/shape-memory-alloy.html\"&gt;SMA&lt;/a&gt;-мушаклар битта раманинг қанот, оёқ ва шўнғиш тизими сифатида ишлашини таъминлайди.&lt;/li&gt;\n&lt;li&gt;225 В кучланишдаги электронамланиш сув остига ўтишни фаоллаштиради.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-02/bio-inspired-functional-recursion-enables-multi-mode-locomot.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Конструкциянинг асоси диаметри 48 мкм бўлган шакл хотирасига эга қотишма (SMA) сунъий мушаклари билан бошқариладиган H-симон рамадир. Бу мушаклар композит тагликнинг нейтрал ўқидан 160 мкм масофада маҳкамланган бўлиб, иссиқлик таъсиридаги қисқаришни эгилиш деформациясига айлантиради. Куч узатишни кучайтириш учун табиий ипак билан арматуралаш қўлланилган, бу эса минимал оғирликда юқори мустаҳкамликни таъминлайди.&lt;/p&gt;\n&lt;p&gt;Тизим лапчалардаги киригами тузилмалари орқали сиртнинг намланишини бошқаради. 225 В кучланиш берилганда электронамланиш содир бўлади ва сувнинг сирт таранглигини бузиб, роботнинг сувга шўнғишига имкон беради. Сув юзасида сузиш режимида робот қанотларнинг асимметрик ҳаракати ҳисобига тортиш кучини ҳосил қилади, қуруқликда эса 8 Гц частотада 15,3 мм/с тезлик билан ҳаракатланади.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Намойиш ягона узлуксиз автоном миссия сифатида эмас, балки алоҳида функционал тестлар шаклида ўтказилди.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-02/bio-inspired-functional-recursion-enables-multi-mode-locomot.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Hasharotlar o'z tanasi va oyoq-qo'llarining mexanikasini moslashtirish orqali turli muhitlarda samarali harakatlanadi. Hasharotlar o'lchamidagi robototexnikada bunday moslashuvchanlikni qat'iy massa cheklovlari ostida takrorlash qiyin vazifa hisoblanadi. Ushbu ishda massasi 140 mg bo'lgan, parvoz qilish, havoda holatni boshqarish, yerda sudralish, suv yuzasida sirpanish va boshqariladigan sho'ng'ish qobiliyatiga ega mikrorobot taqdim etilgan. Bu imkoniyatlar yagona uzluksiz avtonom missiya sifatida emas, balki alohida ochiq konturli funksional testlar sifatida namoyish etilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;140 mg massali robot shakl xotirasi qotishmasidan tayyorlangan sun'iy mushaklar yordamida yagona transformatsiyalanuvchi ramka orqali to'rt xil harakat turini birlashtiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ko'plab aktuatorli dizaynlardan farqli o'laroq, ushbu robot «tuzilmaviy intellekt»dan foydalanadi: shakl xotirasi qotishmasidan (SMA) yasalgan sun'iy mushaklar bilan boshqariladigan yagona ko'p funksiyali karkas. Transformatsiyalanuvchi tana turli vazifalar uchun konfiguratsiyasini o'zgartiradi: assimetrik qanot qoqish parvozi uchun uzatma, &lt;a href=\"concepts/anizotropnoe-trenie.html\"&gt;anizotrop ishqalanish&lt;/a&gt; hisobiga yerda sudralish uchun chiziqli osilator va kirigami uslubidagi oyoqcha tirqishlarini sozlash uchun deformatsiyalanuvchi aktuator vazifasini bajaradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/kinematika-kirigami.html\"&gt;Kirigami kinematikasi&lt;/a&gt; — tekis varaqlardan aniq kesmalar va bukishlar orqali murakkab 3D tuzilmalarni yaratish usuli bo'lib, u ortiqcha detallarsiz geometriyani o'zgartirishga imkon beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Oyoqchalarni modulyatsiya qilish faol elektrouvlanishni amalga oshirishga imkon beradi: 225 V kuchlanish berilganda suvning sirt tarangligi uziladi, bu boshqariladigan sho'ng'ishni ta'minlaydi va yuk ko'tarish qobiliyatini robot tana massasining 1,7 barobarigacha oshiradi. Yumshoq aktuatorlar va strukturaviy mexanikani yagona platformada birlashtirish &lt;a href=\"concepts/funktsionalnaya-rekursiya.html\"&gt;funksional rekursiya&lt;/a&gt; prinsipini amalga oshiradi, bu esa yuqori funksionallikni saqlab qolgan holda massani minimallashtirish imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ish yagona uzluksiz avtonom missiyani emas, balki sinovlar doirasidagi alohida funksional imkoniyatlarni namoyish etadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Havo, quruqlik va suv muhitida harakatlana oladigan robotlarni yaratish biologik tizimlardan ilhomlangan muhim vazifadir. Hasharotlar yagona tayanch-harakat tizimidan parvoz, sudralish, suzish va sakrash uchun foydalanib, ajoyib multimodal qobiliyatlarni namoyish etadi. Ushbu ishda «funksional rekursiya» strategiyasi — bir xil qayta konfiguratsiya qilinadigan tuzilmani turli mexanik vazifalar uchun qayta tayinlash taklif etiladi. Har bir modul avtonom bo'lgan an'anaviy tizimlardan farqli o'laroq, bu yerda shakl xotirasiga ega qotishma (SMA) mushaklari bilan boshqariladigan H-simon ramka markaziy faol element vazifasini bajaradi. U parvozni boshqarish uchun qanotlar kinematikasini modulyatsiya qiladi, quruqlikda harakatlanish uchun yurishni hosil qiladi va suv-havo o'tishlari uchun kirigami-tayanchlarning namlanishini boshqaradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SMA-aktuatorli yagona morfologik ramkadan foydalanish massa cheklovlari hamda suzuvchanlik va cho'kish talablari o'rtasidagi ziddiyatni yengish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Funksional rekursiya — bu bitta jismoniy qism ish rejimiga qarab bir nechta turli funksiyalarni bajaradigan muhandislik yondashuvi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ishlab chiqilgan to'rt qanotli robotning uzunligi 35 mm va massasi 140 mg (tashqi elektronika va quvvat manbaidan tashqari). Asosiy qism qanot aktuatorlariga ulangan H-simon ramkadan iborat. Robot parvoz, 8 Gts chastotada 15,3 mm/s tezlikda quruqlikda sudralish, suv yuzasida sirpanish va boshqariladigan cho'kishni muvaffaqiyatli namoyish etdi. Boshqaruv ochiq konturda amalga oshiriladi: SMA-mushaklari orqali ramkaning deformatsiyasi kursni to'g'rilash (burilish, tangaj, yonbosh) uchun qanotlar kinematikasini o'zgartiradi va kirigami-tayanchlardagi tirqishlarni sozlaydi. Cho'kish uchun sirt tarangligini kamaytiradigan mexanik deformatsiya va elektronamlanish kombinatsiyasi qo'llaniladi. Cho'kish jarayonida qanot qoqishlari tananing holatini barqarorlashtirish uchun ishlatiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot ochiq konturda alohida rejimlarni namoyish etishga qaratilgan; teskari aloqaga ega to'liq avtonom missiya kelajakdagi ishlanmalar uchun vazifa bo'lib qolmoqda.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Multimodal lokomotsiyaga ega robotlarni yaratish uchun aktuator va yuk ko‘taruvchi tuzilmani birlashtirgan ixcham arxitektura zarur. Mualliflar H-simon ramkani faol qayta konfiguratsiya qilish uchun ipak bilan mustahkamlangan shakl xotirasi qotishmasi (SMA) asosidagi sun’iy mushakni ishlab chiqdilar. Bu yechim har bir harakat rejimi uchun alohida aktuator o‘rnatmasdan, bir xil korpusdan qanotlar kinematikasi, yerda sudralish va muhitlararo o‘tishni boshqarish uchun foydalanish imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ipak bilan mustahkamlash PDMS-inkapsulyatsiyaga nisbatan konstruksiya massasini 408% ga kamaytirish va egilish deformatsiyasini 325% ga oshirish imkonini berdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Sun’iy mushak uglerod tolasi bilan mustahkamlangan elastomer asos, shisha tolali elektr izolyatsiya qatlamlari va neytral tekislikdan 160 mkm balandlikda joylashgan SMA simlaridan (diametri 48 mkm) iborat. Deformatsiyani uzatishni kuchaytirish uchun 8,5 GPa anizotrop elastiklik moduliga ega tabiiy ipak ishlatiladi. SMA qisqarganda sim siljiydi va ipak qatlamini taranglashtiradi, bu esa qisqarishni egilishga aylantiradi (3a, b-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Fotolitografiya usuli SMA simlarini kompozit tolalarga nisbatan aniq joylashtirish imkonini beradi, bu esa bashorat qilinadigan deformatsiyani ta’minlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Differensial skanerlovchi kalorimetriya SMA faza o‘tish haroratlarini aniqladi: martensit (Mp) — 67 °C, ostenit (Ap) — 88 °C. Sinovlar davomida (n=5) o‘rtacha egilish burchagi 45° ± 3° ni, uchining siljishi esa 2,1 ± 0,2 mm ni tashkil etdi. Xarakteristikalarning to‘yinishi 70 mVt quvvatda sodir bo‘ladi. Siklik chidamlilik sinovlari 16 Gts chastotada 6000 siklgacha siljish barqaror qolishini (1,55 ± 0,3 mm) ko‘rsatdi, ammo 10⁴ sikldan keyin struktura degradatsiyasi kuzatiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;83 mVt quvvatda maksimal blokirovka qiluvchi kuchga erishiladi, ammo kuchlanish konsentratsiyasi tufayli qisqich zonasida konstruksiyaning buzilish xavfi mavjud.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Chastota xarakteristikalari issiqlik sikli (isitish/sovutish) vaqti bilan cheklangan. 70 mVt quvvatda aktivatsiya taxminan 0,17 s, sovutish esa 0,23 s ni oladi. Chastota oshishi bilan (1 dan 16 Gts gacha) to‘liq sovimaslik tufayli qoldiq issiqlik to‘planadi, bu esa boshlang‘ich pozitsiyaning siljishiga (displacement offset) olib keladi. Ushbu effektni kompensatsiya qilish uchun PWM signalining optimal ish sikli (duty cycle) 1 Gts da 7% dan 16 Gts da 19% gacha oshiriladi.&lt;/p&gt;\n&lt;p&gt;Hasharotlar ko'krak qafasining to'liq funksional robotlashtirilgan modelini yaratish murakkab vazifa bo'lib, u yengil konstruksiyada ko'plab vazifalarni alohida aktuatorlarsiz birlashtirishni talab qiladi. Asalarilarning biologik xususiyatlaridan ilhomlanib, biz sun'iy mushaklar bilan jihozlangan H-simon ramani ishlab chiqdik. Ushbu konstruksiya yuk ko'taruvchi karkas vazifasini bajaradi, qanot kinematikasini boshqaradi va yerda harakatlanish uchun moslasha oladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Sun'iy mushakli H-simon rama ko'p funksiyalilikni ta'minlaydi va 1,2 ga teng tortishish-vazn nisbatiga erishish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Aktuator sifatida elektromagnit tizimlar tanlandi, chunki ular past kuchlanishda ishlaydi va ixcham o'lchamga ega. Miniatyuralashtirilgan aktuatorlar hasharot ko'krak qafasi o'lchamlariga moslashtirilgan. 4a-rasmda ko'rsatilganidek, H-rama ikkita uzatma tizimi bilan birlashtirilgan. Transmissiyaga o'rnatilgan g'altaklar (4b-rasm) qanotlarni tekis to'rt bo'g'inli mexanizmlar orqali harakatga keltiradi, bu esa o'q bo'ylab siljishni aylanish harakatiga aylantiradi (S5-rasmga qarang).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/chetyrehzvennyy-mehanizm.html\"&gt;To'rt bo'g'inli mexanizm&lt;/a&gt; — bu chiziqli harakatni aylanish harakatiga aylantirib beruvchi kinematik zanjirdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mexanizm nuqtalariga biriktirilgan sun'iy mushaklar transmissiya geometriyasini o'zgartirib, parvoz yo'nalishini boshqarish uchun assimetrik qanot qoqishni ta'minlaydi. Aerodinamik modelga ko'ra, qanotning passiv burilishi (4c-rasm) tana vaznining 120% qismiga teng ko'taruvchi kuch hosil qiladi. Ochiq konturli parvoz sinovlari (4d-rasm, S6-rasm, S4-video) 1,2 ga teng tortishish-vazn nisbatiga erishilganini tasdiqladi.&lt;/p&gt;\n&lt;p&gt;Matematik modellar sun'iy mushaklar deformatsiyasi qanotlar kinematikasini belgilashini tasdiqlaydi. Sinusoidal quvvat manbai ostida chiziqli aktuator harakati qanot qoqish kinematikasiga aylanadi. Har bir sun'iy mushak chap yoki o'ng qanot qoqish amplitudasini mustaqil ravishda modulyatsiya qiladi. Mushak uchlari traektoriyasining kichik egriligini (&amp;lt; 5° yoy) hisobga olgan holda, siljish chiziqli boshqaruv signali sifatida yaqinlashtirildi. 48-tenglamaga ko'ra, δ_c = ± 300  mkm boshqaruv signallari qanot qoqish amplitudasini belgilaydi. Neytral holat simmetriyani ta'minlasa, yo'naltirilgan signallar asimmetriyani hosil qilib, differensial ko'tarish kuchi va burish momentini yaratadi (4f-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;± 300  mkm boshqaruv ta'siri qanot amplitudasini aniq modulyatsiya qilish imkonini beradi va manevr uchun zarur momentlarni hosil qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Robot parvozni ochiq konturda boshqarish uchun deformatsiyalanuvchi H-simon ramkadan foydalanadi. Elektromagnit g'altaklar yuqori chastotali qanot qoqishni (93 Gts) ta'minlaydi, ramka deformatsiyasi esa transmissiyaga geometrik siljish beradi (4a, b-rasm). Tangaj old va orqa qanotlar amplitudasi, yonbosh (kren) chap va o'ng qanotlar amplitudasi asimmetriyasi, burilish (yav) esa qanot qoqish tezligi va havo qarshiligi farqi orqali boshqariladi (4g–i-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ochiq konturli boshqaruv tizimi real vaqt rejimida sensorlardan qayta aloqasiz buyruqlarni bajarishini anglatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Aktuatorlarning bir tomonlama deformatsiyasi ko'tarish kuchining asimmetriyasini keltirib chiqarib, y o'qi atrofida aylanishni (tangaj) hosil qiladi. Ikki tomonlama aktuatorlarning differensial deformatsiyasi x o'qi atrofida yonbosh momentini yaratadi. Burilish uchun qanot qoqishdagi reaktiv kuchlardan foydalaniladi: mushaklarning diagonal deformatsiyasi havo qarshiligida asimmetriyani hosil qilib, z o'qi atrofida sof burish momentini keltirib chiqaradi (4i-rasm). Videoyozuvlar tahlili natijalarning takrorlanuvchanligini ko'rsatdi: 0,7 soniyada 40° tangaj, 0,6 soniyada 50° yonbosh va 1,0 soniyada 160° burilishga erishildi (4j–l-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tizimning o'tkazish qobiliyati pyezoelektrik aktuatorlarga nisbatan cheklangan, shuning uchun ish yuqori dinamik barqarorlashtirishga emas, balki boshqaruv imkoniyatini namoyish etishga qaratilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Sun'iy mushaklar bilan boshqariladigan H-simon ramani yerda harakatlanish uchun qayta ishlatish imkoniyati o'rganildi. Ko'p bo'g'inli oyoqlardan foydalanish o'rniga, tizim funksional rekursiya prinsipiga asoslanadi: parvoz paytida qanotlarni boshqaradigan struktura yerda davriy tebranishlarni hosil qiladi. 5a-rasmda ko'rsatilganidek, ramaga tirnoqsimon uchli soddalashtirilgan oyoqlar o'rnatilgan. Ular anizotrop ishqalanishga ega bo'lib, bir yo'nalishda qarshilik boshqasiga qaraganda yuqoriroq bo'lishini ta'minlaydi. Ikki sun'iy mushak ramani qarama-qarshi egib, oyoqlarning teskari fazada harakatlanishiga olib keladi. 5b-rasmdagi holatlar o'rtasidagi o'tishda, bir juft oyoq statik ishqalanish tufayli joyida qoladi, ikkinchisi esa sirpanadi. Harakat yo'nalishini boshqarish mushaklar deformatsiyasi amplitudasi va chastotasini modulyatsiya qilish orqali amalga oshiriladi. Harakat tezligi Δ X = 2δ formulasi bilan aniqlanadi, bu yerda δ — samarali siljish. Sinovlar sirt pürüzlülüğü Ra = 7,5 µ m bo'lgan qog'oz yuzasida o'tkazildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Anizotrop ishqalanish va ramani retsiprok deformatsiyasi robotga murakkab oyoq mexanizmlarisiz harakatlanish imkonini beradi.&lt;br /&gt;\n[!tip] Anizotrop ishqalanish — bu harakat yo'nalishiga qarab ishqalanish koeffitsientining o'zgarishi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Suv yuzasida harakatlanish uchun H-simon rama sozlanishi mumkin bo'lgan «kirigami» oyoqlari bilan jihozlandi. Oyoqlar PDMS substrati (200 µ m), metall elektrod (2 µ m) va PTFE qoplamasidan (15 µ m) iborat. Gidrofobik sirt va kirigami tirqishlari suv yuzasida ushlab turuvchi menisk hosil qiladi (6a-rasm). Qanotlar parvoz rejimida ishlaganda, urish tekisligining qiyaligi gorizontal tortish kuchini hosil qilib, suvda sirpanishni ta'minlaydi. 90 Hz chastotada (ikkinchi garmonika) robot 3–6,3 mm/s tezlikda harakatlanadi (6b-rasm). Yuqori tezlikdagi tasvirga olish orqali o'lchangan dinamik ko'rsatkichlar 4,3 mm/s² (0,12 BL/s²) maksimal tezlanish va 950 ms dan keyin 6,3 ± 0,4 mm/s (n = 3 urinish) maksimal tezlikni ko'rsatdi (6c-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kirigami oyoqlari va elektrouvlash integratsiyasi robotga suv yuzasida suzish va boshqariladigan cho'kish imkonini beradi.&lt;br /&gt;\n[!warning] Tajribalar laboratoriya sharoitida o'tkazilgan; kichik tanlanma (n=3) natijalarni umumlashtirishda ehtiyotkorlikni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Eksperimental tadqiqotlar davomida 0 dan 3 V gacha bo'lgan kuchlanish (V) va tezlik (mm/s) hamda tezlanish (mm/s²) o'rtasidagi bog'liqlik tahlil qilindi. Kuchlanish berilganda tezlikning –2 dan 4 mm/s gacha o'zgarishi qayd etildi, bunda &lt;a href=\"concepts/raznost-chastot.html\"&gt;chastotalar farqi&lt;/a&gt; (Hz) 2 dan 6 Gts gacha bo'lgan diapazonda tebrandi. Ushbu ko'rsatkichlar 250 mN gacha bo'lgan yuklanish (Fload) rejimlari ostida tizimning dinamik javobini baholash imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Chastotalar farqi — bu tebranma tizimning rezonansdan og'ishini ko'rsatuvchi parametr bo'lib, ob'ektning suyuqlikdagi barqarorligini tushunish uchun muhimdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ob'ektning suv yuzasiga (Water surface) cho'kish jarayonini o'rganishda x (0–10 mm) va z (0–140 mm) o'qlari bo'yicha taqsimot profillari olindi. «Oyoqlar bilan oldinga» (Feet-first settling) cho'kish rejimida tangaj (Pitch) va kren (Roll) bo'yicha orientatsiya burchaklari (Attitude) –100° dan 80° gacha o'zgarishi aniqlandi. 2δ (mm) parametri, ya'ni buzilish zonasi kengligi, ob'ektning havo-suv chegarasi bilan o'zaro ta'siri jarayonida qayd etildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;3 V gacha kuchlanish berilganda tizim tezlikning 4 mm/s gacha nazorat qilinadigan o'zgarishini ko'rsatadi, cho'kish jarayonida esa burchak og'ishlari z chuqurligiga qarab 100° gacha yetadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Robot suv yuzasida sozlanishi mumkin bo'lgan kirigami-tayanchlar yordamida harakatlanadi (6a, b-rasm). Sirpanish tezligi qanotlarning tebranish chastotalari farqiga bog'liq: 80 Gts bazaviy chastotada maksimal tezlik 6,3 ± 0,4 mm/s (n = 3) ni tashkil qiladi. Kirigami tamoyili asosida ishlangan tayanch manfiy Puasson koeffitsientiga ega: vertikal cho'zilganda u yon tomonlarga kengayadi. 2δ deformatsiya (bu yerda δ — yon siljish) sirt tarangligi hisobiga ko'tarish kuchini oshiradi va robot massasidan 1,7 barobar ko'p bo'lgan 242 ± 32 mg qo'shimcha yuk ko'tarish imkonini beradi (6e-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kirigami mexanizmi ko'tarish qobiliyatini robot massasining 170% gacha oshirib, suzuvchanlikni samarali boshqarish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Boshlang'ich holatda strukturadagi tirqishlar minimal bo'lib, gidrofob sirt va bir-birining ustiga chiqadigan menisklar suvning kirishiga to'sqinlik qiladi. Metalllashtirilgan dielektrik qatlamga kuchlanish berilganda &lt;a href=\"concepts/elektrosmachivanie.html\"&gt;elektro-ho'llanish&lt;/a&gt; (electrowetting) sodir bo'ladi: kontakt burchagi kamayadi, suv tirqishlarni to'ldiradi va robot suvga cho'kadi (6f–h-rasm). CCE matematik modeli shuni tasdiqlaydiki, yukning 70% dan ortig'i Arximed kuchi emas, balki sirt tarangligi hisobiga ushlab turiladi. 243,6 V kuchlanishda menisk balandligi h_w nolga yaqinlashadi va tayanch o'z samaradorligini yo'qotadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Elektro-ho'llanish — bu elektr maydoni ta'sirida sirtning ho'llanish xususiyatini (gidrofob holatdan gidrofil holatga) o'zgartirish jarayoni.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Suvga kirish uchun sirt tarangligi chegarasini yengib o'tish kerak. Tayanch deformatsiyasi 2δ = 1 mm bo'lganda 225 V, 2δ = 2 mm bo'lganda esa 300 V kuchlanish talab qilinadi (6j-rasm). Erkin cho'kish jarayonida robot ag'darilib ketishga moyil bo'ladi. Barqarorlikni ta'minlash uchun qanotlarning assimetrik tebranishidan foydalaniladi: bu tangaj va yonbosh burchaklarini to'g'rilab, robotning «oyoqlari bilan pastga» qo'nishini ta'minlaydi (6k–m-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Barqarorlashtirish ochiq kontur (open-loop) bo'yicha amalga oshiriladi, bu esa cho'kish paytidagi passiv beqarorlikni kompensatsiya qilish uchun qanot tebranish parametrlarini oldindan sozlashni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Grammdan yengil robotlarni yaratishda asosiy muammo shundaki, miniatyuralashtirish massani kamaytirishni talab qilsa, ko'p funksiyalilik odatda qo'shimcha aktuatorlarni talab qiladi. Ushbu ishda 140 mg massali robotda funksional rekursiya strategiyasi qo'llanildi. Uning asosi — shakl xotirasiga ega qotishma (SMA) sun'iy mushaklari o'rnatilgan H-simon ramadir. Bu yagona qayta konfiguratsiya qilinadigan tizim parvoz (ramani deformatsiyalash orqali), yerda sudralib yurish (assimetrik ishqalanish), suv yuzasida sirpanish va boshqariladigan suvga cho'kish (kirigami-tayanchlar va elektroxo'llash orqali) imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;140 mg massali robot to'rtta harakat turini birlashtiradi va alohida aktuatorlar o'rniga bitta deformatsiyalanuvchi tuzilmadan foydalanadi, bu esa funksional zichlikni oshiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Asosiy yutuq — hasharotlar qanotlari mexanizmiga o'xshash mushak-rama koordinatsiyasidir. Ramani deformatsiyalash orqali tangaj, kren va yovskash momentlari hosil qilinadi. Assimetrik ishqalanish tebranishlarni yo'naltirilgan harakatga aylantiradi. Tajribalar shuni ko'rsatdiki, 2δ = 1 mm deformatsiyada cho'kish ma'lum kuchlanishda, 2δ = 2 mm bo'lganda esa 300 V da sodir bo'ladi. Bu talab qilinadigan kuchlanish sirtning tayanch kuchiga bog'liqligini ko'rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Funksional rekursiya — bu bitta jismoniy qismning shaklini o'zgartirish orqali bir nechta vazifani bajarishi, bu esa ortiqcha mexanizmlardan qochish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;SMA mushaklarining termal inertsiyasi parvozni barqarorlashtirish tezligini cheklaydi. Elektromagnit ko'tarish mexanizmi ixchamlik uchun tanlangan, ammo pyezoelektrik aktuatorlardan kuch bo'yicha pastroq. Hozirgi tajribalar tinch suvda o'tkazilgan, to'liq avtonom «parvoz–qo'nish–sudralish–cho'kish» sikli hali amalga oshirilmagan. Kelgusi ishlar yuqori chastotali gibrid aktuatorlar va bort quvvat tizimlarini integratsiyalashga qaratilgan.&lt;/p&gt;\n&lt;p&gt;Robotning suvda turish qobiliyati kapillyarlik va elektroxo'llash (CCE) modeli bilan tahlil qilinadi. Statik holatda og'irlik, ko'tarish kuchi va sirt tarangligi muvozanatda bo'ladi. Umumiy yuk ko'tarish qobiliyati Fload quyidagicha aniqlanadi:&lt;/p&gt;\n&lt;p&gt;&lt;span class=\"yfm-latex\" data-content=\"F_%7Bload%7D%20%3D%20%5Crho%20g%20b%20(S_1%20%2B%202S_2)%20%3D%20%5Crho%20a%20b%20h_w%20g%20-%202%5Cgamma%20(a%20%2B%20b)%20%5Ccos%20%20heta\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;&lt;/p&gt;\n&lt;p&gt;Bu yerda &lt;span class=\"yfm-latex\" data-content=\"S_1%20%2B%202S_2%20%3D%20%5Cint_0%5Eh%20x%20dz%20%3D%20a%20h_w%20%2B%202(k-1)%20%5Csin%20%5Calpha\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (1-tenglama), &lt;span class=\"yfm-latex\" data-content=\"S_y%20%3D%20-2%5Cgamma%20(a%20%2B%20b)%20%5Ccos%20%20heta\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (4-tenglama) va &lt;span class=\"yfm-latex\" data-content=\"F_b%20%3D%20%5Crho%20a%20b%20h_w%20g\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (5-tenglama). Menisk cho'kish chuqurligi h kontakt geometriyasidan kelib chiqadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Model ideal gidrofob sirt va tinch suvni nazarda tutadi; to'lqinli sharoitda dinamik o'zgarishlarni hisobga olish kerak.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Menisk balandligi h_w quyidagi formula bilan aniqlanadi: &lt;span class=\"yfm-latex\" data-content=\"h_w%20%3D%20k_1%20%5Csqrt%7B2(1%20-%20%5Ccos%20%5Calpha)%20%2F%20%5Crho%20g%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, bu yerda α = θ - π/2. Bunda θ — chekka burchak (90^° &amp;lt; θ &amp;lt; 180^° gidrofoblik uchun, 0^° &amp;lt; θ &amp;lt; 90^° gidrofillik uchun), γ = 0.0728  N/m — suvning sirt taranglik koeffitsienti, &lt;span class=\"yfm-latex\" data-content=\"%5Crho\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — suv zichligi, g — erkin tushish tezlanishi. a va b parametrlari deformatsiya vaqtida manfiy Puasson koeffitsientini namoyon qiluvchi tayanch maydonchasining o‘lchamlarini belgilaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Sirt tarangligi robot ko‘tarish qobiliyatining 70% dan ortig‘ini ta’minlaydi, kirigami-mexanizmi esa statik yuk ko‘tarish qobiliyatini 1.7 barobar oshirib, 242 mg qo‘shimcha yukni ko‘tarish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tajribalar shuni tasdiqlaydiki, hasharotlar miqyosida robotning suzuvchanligi aynan sirt tarangligi bilan bog‘liq. Sun’iy mushaklar faollashganda maydoncha kengayib, kontakt chizig‘i uzunligini va proyeksion maydonni oshiradi, bu esa ham taranglikni, ham itaruvchi kuchni kuchaytiradi. Biroq, haddan tashqari kengayish deformatsiya va bo‘ylama egilishga olib keladi, bu esa meniskning uzilishiga va ko‘tarish qobiliyatining pasayishiga sabab bo‘ladi.&lt;/p&gt;\n&lt;p&gt;O‘zgaruvchan tirqishli tizimlarni tavsiflash uchun modifikatsiyalangan elektr namlash modeli qo‘llaniladi. V kuchlanish berilganda, chekka burchak θ Yung-Lippman tenglamasiga ko‘ra o‘zgaradi: &lt;span class=\"yfm-latex\" data-content=\"%5Ccos%20%20heta%20%3D%20%5Ccos%20%20heta_0%20%2B%20%5Cfrac%7B%5Cepsilon_0%20%5Cepsilon_r%7D%7B2%20%5Cgamma%20d_H%7D%20V%5E2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, bu yerda ε₀ — vakuumning dielektrik singdiruvchanligi, ε_r — nisbiy singdiruvchanlik, d_H — qoplama qalinligi. Teskari trapetsiyasimon tirqishlarda devorlarning og‘ish burchagiga α_g bog‘liq bo‘lgan kapillyar effekt yuzaga keladi. Kapillyar bosim &lt;span class=\"yfm-latex\" data-content=\"%5CDelta%20P%20%3D%202%20%5Cgamma%20%5Ccos(%20heta%20-%20%5Calpha_g)%20%2F%20W_%7Beff%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, bu yerda Weff — tirqishning samarali kengligi. Suyuqlik ko‘tarilish balandligining muvozanat sharti &lt;span class=\"yfm-latex\" data-content=\"h_g%20%3D%202%20%5Cgamma%20%5Ccos(%20heta%20-%20%5Calpha_g)%20%2F%20%5Crho%20g%20W_%7Beff%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ko‘rinishida aniqlanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Elektr namlash — bu elektr maydoni ta’sirida sirtning namlanuvchanligini (chekka burchagini) o‘zgartirish bo‘lib, u mikro-tirqishlarda suyuqlikning kapillyar ko‘tarilishini boshqarish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Sirt tarangligi kuchining vertikal tashkil etuvchisi &lt;span class=\"yfm-latex\" data-content=\"S_y%20%3D%20%5Cgamma%20L%20%5Ccos(%20heta%20-%20%5Calpha_g)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; va itaruvchi kuch &lt;span class=\"yfm-latex\" data-content=\"F_b%20%3D%20%5Crho%20g%20a%20b%20(h_w%20-%20w%20L%20%2F%202%20h_g)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; umumiy ko‘tarish qobiliyatini &lt;span class=\"yfm-latex\" data-content=\"F_%7Bload%7D%20%3D%20F_b%20-%202%20%5Cgamma%20L%20%5Ccos(%20heta%20-%20%5Calpha_g)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; belgilaydi, bu kuchlanish va tirqish geometriyasiga bevosita bog‘liq.&lt;/p&gt;\n&lt;p&gt;CCE modelini tasdiqlash uchun turli kuchlanishlar va tirqish kengliklarida vertikal qo‘llab-quvvatlash kuchi o‘lchandi. Robot bir o‘qli kuch datchigiga o‘rnatildi, o‘lchovlar 0.1  mm/s tezlikda kvazistatik yaqinlashish/ajralish usuli bilan amalga oshirildi. Har bir holat uchun uchta takroriy o‘lchov o‘tkazildi, natijalar diapazon ko‘rsatilgan holda o‘rtacha qiymatlar sifatida taqdim etildi (6i-rasm). Cho‘kish jarayoni dasturiy ravishda boshlandi: avval tirqish deformatsiyalandi, so‘ngra qo‘llab-quvvatlash kuchini manfiy qiymatgacha kamaytiruvchi kuchlanish berildi.&lt;/p&gt;\n&lt;p&gt;Struktura yaratish jarayoni diodli nasosli qattiq jismli (DPSS) lazer yordamida kirigami naqshini ablasya qilishdan boshlandi. Fokus masofasini o'zgartirish orqali elementlarning trapetsiyasimon ko'ndalang kesimi hosil qilindi. PDMS asosining sirtini aktivlashtirish uchun namuna 45° burchak ostida qiyalatildi. Shundan so'ng, &lt;a href=\"concepts/ald.html\"&gt;atom-qatlamli cho'ktirish&lt;/a&gt; (ALD) usuli bilan 10 nm qalinlikdagi Al₂O₃ adgeziya qatlami bir necha siklda, xuddi shu 45° burchak ostida yotqizildi. Keyingi bosqichda magnetronli purkash yordamida 150 nm qalinlikdagi oltin (Au) elektrod qatlami hosil qilindi. Kontakt maydonchalari yuqori aniqlikdagi dozator yordamida o'tkazuvchan kumush pastasi bilan qoplandi. Yakuniy bosqichda 15 mkm qalinlikdagi parilen-C qatlami konform qoplama sifatida yotqizildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Atom-qatlamli cho'ktirish (ALD) — bu gaz fazasidagi reagentlar yordamida sirtda o'ta yupqa va bir xil qalinlikdagi plyonkalarni hosil qilish texnologiyasi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Lazerli ablasya va 45° burchak ostida o'tkazilgan Al₂O₃ (10 nm) hamda Au (150 nm) qatlamlarini cho'ktirish jarayoni egiluvchan asosda yuqori aniqlikdagi elektrodlarni shakllantirish imkonini berdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu ish hasharotlarning harakatlanish mexanizmlari va ularning robotlashtirilgan analoglarini qamrab oluvchi bio-ilhomlantirilgan texnologiyalarning keng qamrovli tahliliga asoslanadi. Tadqiqot bazasi suv o‘lchagichlarning gidrodinamikasi, asalarilar va pashshalarning parvoz mexanizmlari, shuningdek, suv yuzasida sakrash tamoyillarini o‘rganishni o‘z ichiga oladi. Muhitlararo o‘tishga alohida e’tibor qaratilgan: parvozdan suzishga va qattiq yuzalar bo‘ylab harakatlanishga. Maqolada manevrlikni ta’minlash uchun elastomer aktuatorlar va elektrostatik yopishqoqlikdan foydalanadigan qattiq konstruksiyalar ham, yumshoq robototexnika tizimlari ham ko‘rib chiqiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot turli muhitlarda mikrorobotlarning o‘tish harakat rejimlarini tavsiflovchi 37 ta asosiy manbaga tayanib, biomimetika va robototexnika tamoyillarini birlashtiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tadqiqot metodologiyasi massasi 88 mg dan boshlab yirikroq tizimlargacha bo‘lgan mikromiqyosli robotlar haqidagi ma’lumotlar sinteziga tayanadi. Ishda parvoz, sakrash va suzishni boshqarish usullari, jumladan, yumshoq sun’iy mushaklar va elektroadgeziv mexanizmlardan foydalanish tahlil qilinadi. Xulosalarning statistik ishonchliligi eksperimental ma’lumotlarni hasharotlarga xos bo‘lgan gidrodinamika va aerodinamikaning nazariy modellari bilan taqqoslash orqali ta’minlanadi. Qo‘llaniladigan asboblar yuqori tezlikdagi harakatni qayd etish tizimlari va sirt bilan o‘zaro ta’sir kuchlarini baholash uchun datchiklarni o‘z ichiga oladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/bioinspiratsiya.html\"&gt;Bio-ilhomlanish&lt;/a&gt; — bu robotlarning samaradorligini oshirish uchun biologik tizimlardan konstruktiv yechimlar va boshqaruv tamoyillari o‘zlashtiriladigan muhandislik yondashuvi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu adabiyotlar roʻyxati 2016–2026 yillar oraligʻida biologik obʼektlardan ilhomlangan mikrorobototexnika sohasidagi ilgʻor ishlanmalarni qamrab oladi. Asosiy eʼtibor parvoz qilish, sudralish, sakrash va muhitlararo (havo-suv, yer-havo) oʻtish kabi murakkab harakat turlariga qodir koʻp funksiyali tizimlarni yaratishga qaratilgan. Asosiy tadqiqotlar toʻqnashuvlarga chidamlilikni taʼminlash uchun yumshoq aktuatorlardan foydalanish [44], hasharotlar qanotlari mexanikasini boshqarish uchun chuqur oʻqitish (deep learning) usullarini qoʻllash [41] va mustahkam bashoratli boshqaruv orqali murakkab manyovrlarni amalga oshirishni [50] oʻz ichiga oladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/biomimeticheskiy-robot.html\"&gt;Biomimetik robot&lt;/a&gt; — bu tuzilishi va harakatlanish prinsiplari biologik prototiplarga (hasharotlar, qushlar) taqlid qiluvchi qurilma boʻlib, u kichik miqyosda yuqori energiya samaradorligi va manevrchanlikka erishish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Strukturaviy elementlarni aktuator mexanizmlari bilan integratsiyalashda, masalan, origami texnologiyalaridan foydalanish orqali sezilarli yutuqlarga erishilmoqda [48]. Geometriyasi oʻzgaruvchan tizimlarning rivojlanishi robotlarga ekstremal sharoitlarda, jumladan chuqur suv muhitida moslashish imkonini beradi [49]. Tadqiqotlar, shuningdek, xavfsiz qoʻnish strategiyalari [45] va «sudralish–sakrash–planerlash» kabi uzluksiz harakat rejimlarini optimallashtirishga qaratilgan [46].&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/bio-inspired-functional-recursion-enables-multi-mode-locomot-f1.jpg\" alt=\"Rasm 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/bio-inspired-functional-recursion-enables-multi-mode-locomot-f2.jpg\" alt=\"Rasm 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/bio-inspired-functional-recursion-enables-multi-mode-locomot-f3.jpg\" alt=\"Rasm 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/bio-inspired-functional-recursion-enables-multi-mode-locomot-f4.jpg\" alt=\"Rasm 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 4&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/bio-inspired-functional-recursion-enables-multi-mode-locomot-f5.jpg\" alt=\"5-rasm. H-simon ramani deformatsiyasi va assimetrik ishqalanish orqali yerda sudralib yurish. a Oyoq va sirt o'rtasidagi\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm. H-simon ramani deformatsiyasi va assimetrik ishqalanish orqali yerda sudralib yurish. a Oyoq va sirt o'rtasidagi anizotrop ishqalanishga asoslangan sudralib yurishning mexanik prinsipi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-rasm. H-simon ramani deformatsiyasi va assimetrik ishqalanish orqali yerda sudralib yurish. a Oyoq va sirt o'rtasidagi anizotrop ishqalanishga asoslangan sudralib yurishning mexanik prinsipi. Old va orqa oyoqlar bir harakat sikli davomida yo'nalishga bog'liq ishqalanish kuchlarini boshdan kechiradi, bu esa tananing qaytma deformatsiyasini sof oldinga harakatga aylantiradi va boshqaruvni ta'minlaydi. b Bir sudralib yurish sikli davomida shakli o'zgaruvchan H-simon ramaning ikkita ekstremal deformatsiya holati. SMA tomonidan boshqariladigan navbatma-navbat egilish oyoqlarning nisbiy holatini o'zgartiradi va tananing davriy ravishda uzayishi va qisqarishini keltirib chiqaradi. c Harakatning vakillik chastotalarida to'g'ri chiziq bo'ylab sudralib yurishning kompozit tasvirlar ketma-ketligi. Robot 1-holat va 2-holat o'rtasida takroriy almashinish orqali oldinga harakatlanadi. d Bir yo'nalishli va ikki yo'nalishli H-simon rama egilishida harakat chastotasining funksiyasi sifatida sudralib yurish tezligi. Robot silliq qog'ozda 8 Gts optimal harakat chastotasida 0,46 ± 0,02 BL/s maksimal sudralib yurish tezligiga erishadi. Kichik rasmda ikkita harakat rejimi uchun ishlatiladigan H-simon ramaning tegishli deformatsiya holatlari ko'rsatilgan. e Assimetrik ishqalanish bilan sudralib yurishning kinematik modeli. Model tananing holatini, tananing yo'nalishini, oyoqlarning holatini va bir harakat sikli davomida oyoqlarning vaqt bo'yicha o'zgaruvchan siljishlarini tavsiflaydi. f Turli xil assimetrik deformatsiya kiritishlari tomonidan yaratilgan to'g'ri chiziq bo'ylab sudralib yurish, chapga burilish va o'ngga burilishni ko'rsatadigan o'lchangan trayektoriyalar. Kichik rasmda bir sudralib yurish sikli davomida oyoq va tananing vakillik tezliklari ko'rsatilgan. g Turli xil g'adir-budirlikka ega to'rtta sirtda sudralib yurishning vakillik trayektoriyalari: shisha (#1, Ra = 0,01 mkm), silliq qog'oz (#2, Ra = 7,5 mkm), balza daraxti (#3, Ra ≈ 15,3 mkm) va EPP (#4, Ra &amp;gt; 500 mkm). h Turli xil g'adir-budirlikka ega sirtlarda sudralib yurish tezligi. Xatolik chiziqlari uchta takroriy sinovdan olingan maksimal va minimal qiymatlarni ko'rsatadi. Robot silliq qog'ozda eng yuqori tezlikka erishadi, shisha va balza daraxtida tezlik pasayadi, EPPda esa deyarli to'xtab qoladi. Ma'lumotlar o'rtacha qiymat sifatida min-maks diapazoni bilan ko'rsatilgan (n = 3). Masshtab chiziqlari (c, g): 10 mm.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-02/bio-inspired-functional-recursion-enables-multi-mode-locomot.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Мультимодаллик&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;да оғирлик&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600
