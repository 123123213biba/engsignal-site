d&gt;-&lt;/td&gt;\n&lt;td&gt;8.218&lt;/td&gt;\n&lt;td&gt;3.932&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Fabric&lt;/td&gt;\n&lt;td&gt;38m20.0s&lt;/td&gt;\n&lt;td&gt;10m41.4s&lt;/td&gt;\n&lt;td&gt;49m01.4s&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;3.663&lt;/td&gt;\n&lt;td&gt;0.796&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;MouseL4&lt;/td&gt;\n&lt;td&gt;1h26m23.1s&lt;/td&gt;\n&lt;td&gt;12h12m21.8s&lt;/td&gt;\n&lt;td&gt;13h38m44.9s&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;177.108&lt;/td&gt;\n&lt;td&gt;84.029&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;H01WM&lt;/td&gt;\n&lt;td&gt;2h47m35.5s&lt;/td&gt;\n&lt;td&gt;7d12m25.8s&lt;/td&gt;\n&lt;td&gt;7d3h01.3s&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;505.080&lt;/td&gt;\n&lt;td&gt;230.897&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Ikkilamchi gzip siqilishini o'z ichiga oladi. TTFF — birinchi kadrgacha bo'lgan vaqt.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 2.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-tT2.jpg\" alt=\"Jadval 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 6.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-tT6.jpg\" alt=\"Jadval 6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 7.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-tT7.jpg\" alt=\"Jadval 7\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 8.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-tT8.jpg\" alt=\"Jadval 8\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-f1.jpg\" alt=\"1-rasm: Vizual annotatsiya. a Bizning interaktiv Volcanite ilovamiz zamonaviy yo‘qotishsiz siqish usullaridan foydalanga\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: Vizual annotatsiya. a Bizning interaktiv Volcanite ilovamiz zamonaviy yo‘qotishsiz siqish usullaridan foydalangan holda oddiy uskunalar yordamida katta segmentlangan hajmlarni vizual tadqiq qilish imkonini beradi. b Bizning grafik protsessor (GPU)…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm: Vizual annotatsiya. a Bizning interaktiv Volcanite ilovamiz zamonaviy yo‘qotishsiz siqish usullaridan foydalangan holda oddiy uskunalar yordamida katta segmentlangan hajmlarni vizual tadqiq qilish imkonini beradi. b Bizning grafik protsessor (GPU) asosidagi renderlash konveyerimiz ko‘rinadigan hajm hududlarini tezkor kirish uchun keshga dekompressiya qiladi. Ushbu konveyer turli renderlash konfiguratsiyalarini, hatto alohida voksellarni tekshirishgacha (o‘ngda) interaktiv tadqiq qilish imkonini beradi. c Renderlash har bir kadr uchun millisekundlarda amalga oshiriladigan interaktiv jarayondir. Birinchi kadrlarda dekompressiya yuki yuqoriroq bo‘ladi, ammo u tezda yo‘qoladi. d Volcanite yordamida biz 2,2 TB hajmdagi H01 inson miya po‘stlog‘i oq moddasi segmentatsiyasi hajmini Full-HD yo‘l-trassirovka yoritilishi bilan soniyasiga 66 kadr tezlikda, boshqa usullarga qaraganda ancha tezroq birinchi kadr vaqti bilan oddiy uskunada interaktiv tadqiq qila olamiz. Neuroglancerda vizualizatsiya uchun noaniq to‘rlarni yaratish bir haftadan ortiq vaqtni oladi, bizning oldindan ishlov berish tizimimiz esa tizimimizda ikki soatdan kam vaqt ichida ancha kichikroq va yo‘qotishsiz kodlashlarni yaratadi. e Volcanite’dagi soya rejimlari tezkor mahalliy soyalashdan yuqori sifatli yo‘l-trassirovkaga darhol qayta aloqa bilan o‘zgartirilishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-f2.jpg\" alt=\"Rasm 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-f3.jpg\" alt=\"3-rasm: a Volcanite (ko‘k) va VTK (sariq) yordamida voksel asosidagi renderlash uchun kadr vaqtlari, qat’iy kameradan ma\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm: a Volcanite (ko‘k) va VTK (sariq) yordamida voksel asosidagi renderlash uchun kadr vaqtlari, qat’iy kameradan mahalliy soyalash bilan (pastroq bo‘lsa yaxshi).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-rasm: a Volcanite (ko‘k) va VTK (sariq) yordamida voksel asosidagi renderlash uchun kadr vaqtlari, qat’iy kameradan mahalliy soyalash bilan (pastroq bo‘lsa yaxshi). Katta ma’lumotlar xotira cheklovlari tufayli renderlanishi mumkin emas. Neuroglancer uchun kadr vaqtlari mavjud emas. b AZBA mos keladigan perspektivalar va Volcanite va VTK’dagi kabi oddiy mahalliy soyalash bilan hamda Neuroglancer’dagi o‘xshash konfiguratsiyada renderlangan. VTK to‘g‘ridan-to‘g‘ri segmentatsiya hajmini renderlash va Neuroglancer faqat mahalliy soyalashni qo‘llab-quvvatlagani uchun, biz Volcanite’ning soyalar va bilvosita yoritishni qo‘llab-quvvatlashiga qaramay, uning mahalliy soyalashini unumdorlik o‘lchovlarida solishtiramiz. c Neuroglancer uchun qo‘llaniladigan ikkilamchi gzip siqishsiz ham, Volcanite eng kichik ma’lumotlarni saqlaydi va umumiy hisobda eng qisqa oldindan ishlov berish vaqtlariga ega.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS1.jpg\" alt=\"Rasm S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS2.jpg\" alt=\"Fig. A2: GPU xotirasini boshqarish. b δ operatsiyasi bloklar palitrasining maksimal o'lchamlarini /P/ cheklash uchun jud\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Fig. A2: GPU xotirasini boshqarish. b δ operatsiyasi bloklar palitrasining maksimal o'lchamlarini /P/ cheklash uchun juda muhimdir, bu keshni qadoqlash koeffitsientlariga ta'sir qiladi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Fig. A2: GPU xotirasini boshqarish. b δ operatsiyasi bloklar palitrasining maksimal o'lchamlarini /P/ cheklash uchun juda muhimdir, bu keshni qadoqlash koeffitsientlariga ta'sir qiladi. Bizning yangi (cheklanmagan) δ palitra dublikatlarini yo'q qiladi. c Blok so'rovlarini cheklash faqat ma'lum piksellarga (yashil) blok keshini so'rashga imkon beradi. Bu kesh byudjeti qattiq bo'lganda, resurslarni eng kam renderlangan namunalar soniga ega piksel (qizil) atrofida to'plash orqali o'lik holatlarning oldini oladi. d Soya nurlari bilan tasvirni renderlashda GPU xotirasidan foydalanish. Kichik ma'lumotlar uchun kesh 16 GiB VRAM GPU-mizdagi xotira sarfida ustunlik qiladi. Xotira samaradorligi muhim bo'lgan katta ma'lumotlar uchun bizning usulimiz xom ma'lumotlar o'lchamlariga nisbatan xotira sarfini sezilarli darajada cheklaydi. Polyamid, Fiber, H01BV, Fabric, MouseL4 va H01WM uchun biz kesh palitrasidan samarali kesh hajmini qadoqlash koeffitsienti bilan oshirish uchun foydalanamiz. Umumiy VRAM iste'moli boshqa ma'lumotlarni o'z ichiga oladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS3.jpg\" alt=\"Fig. A3: a Renderlangan kadrlarni shovqindan tozalash va kattalashtirish uchun post-protsessing konveyeri.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Fig. A3: a Renderlangan kadrlarni shovqindan tozalash va kattalashtirish uchun post-protsessing konveyeri.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Fig. A3: a Renderlangan kadrlarni shovqindan tozalash va kattalashtirish uchun post-protsessing konveyeri. Ikki almashinuvchi ping-pong buferi oldingi (kirish) va joriy (chiqish) RGBA yorqinligini (Accum.) va har bir piksel uchun namunalar sonini (SampleCnt) o'z ichiga oladi. Quyidagi hal qilish konveyeri ikkita almashinuvchi 16-bitli RGBA teksturalari va konveyer davomida o'zgarmas bo'lib qoladigan G-buffer render chiqishi bilan ishlaydi. b Jahon fazosida ma'lumotlar to'plami o'zining eng katta o'lchami bo'yicha 1 o'lchamiga qadar masshtablanadi va koordinatalar boshi atrofida markazlashtiriladi. G-buffer uchun chuqurlik qiymatlari ∥h − p∥ sifatida hisoblanadi, bu yerda p - kamera yo'nalishidagi birlik kubni o'rab turgan sferaga proyeksiyalangan birinchi sirtga tegish nuqtasi. c Renderlash arxitekturasidagi tegishli xotira buferlari va ma'lumotlar oqimi. Blok kodlashlari bir nechta katta buferlarda saqlanadi. Juda katta ma'lumotlar to'plamlari uchun bloklarning eng nozik o'lchamlari (detal) talab bo'yicha GPU-ga uzatiladi. Renderlash vaqtida ko'rinadigan bloklar GPU keshiga, ehtimol qadoqlangan formatda ochiladi. d Eng nozik LOD uchun kodlash buferlarini qurish uchun CPU konveyeri. Konveyer holatlari oq rangda, protseduralar ko'k rangda.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS6.jpg\" alt=\"Fig. A6: Tasvir (dastlabki 21 kadr, statik kamera) va soya nurlari bilan video renderlash uchun kadr vaqtlari. Yaqin rej\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Fig. A6: Tasvir (dastlabki 21 kadr, statik kamera) va soya nurlari bilan video renderlash uchun kadr vaqtlari. Yaqin rejalar uchun renderlash vaqti dastlabki dekompressiya xarajatlari keshlangandan so'ng ustunlik qiladi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS6-2.jpg\" alt=\"Rasm S6 (davomi 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S6 (davomi 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS6-3.jpg\" alt=\"Rasm S6 (davomi 3)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S6 (davomi 3)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS6-4.jpg\" alt=\"Rasm S6 (davomi 4)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S6 (davomi 4)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS6-5.jpg\" alt=\"Rasm S6 (davomi 5)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S6 (davomi 5)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS6-6.jpg\" alt=\"Rasm S6 (davomi 6)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S6 (davomi 6)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS6-7.jpg\" alt=\"Rasm S6 (davomi 7)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S6 (davomi 7)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS7.jpg\" alt=\"Fig. A7: a Soya rejimlari yorug'likning turli nur yo'llari chuqurliklari (raqamlangan) va yo'nalishlari bo'ylab o'tishin\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Fig. A7: a Soya rejimlari yorug'likning turli nur yo'llari chuqurliklari (raqamlangan) va yo'nalishlari bo'ylab o'tishini baholaydi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Fig. A7: a Soya rejimlari yorug'likning turli nur yo'llari chuqurliklari (raqamlangan) va yo'nalishlari bo'ylab o'tishini baholaydi. Mahalliy soya faqat 0-chuqurlikdagi ko'rish nurlarini (qora) kuzatadi. Ixtiyoriy ravishda, ikkilamchi soya nurlari (sariq) yorug'lik manbasiga qarab kuzatiladi. Atrof-muhit okklyuziyasi 1 yo'nalishni ixtiyoriy yo'nalishlarda (ko'k) kuzatadi. Yo'l trasirovkasi ixtiyoriy chuqurliklar (qizil) bo'ylab to'liq o'tishni baholaydi. Soya rejimlari ushbu tartibda (rangli) ko'payib borayotgan bloklar soniga kirish huquqiga ega. b 2.2 TB H01WM statsionar tasviri uchun kadr vaqtlari. Murakkabroq soya rejimlari ko'proq hajm bloklariga kirganligi sababli, renderlash unumdorligi pasayadi. c 1024 konvergentsiya kadrlaridan keyin H01WM tasvirini renderlash. Soya rejimlari darhol qayta aloqa bilan o'zgartirilishi mumkin. Mahalliy soya tez bo'lsa-da, soyalar yoki atrof-muhit okklyuziyasi tuzilmalarning vizual idrokini yaxshilaydi. Yo'l trasirovkasi eng yuqori vizual aniqlikni taklif qiladi, masalan, to'q sariq neyronlardan bilvosita yorug'lik qaytishini baholash.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS8.jpg\" alt=\"Rasm S8\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S8&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS8-2.jpg\" alt=\"Rasm S8 (davomi 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S8 (davomi 2)&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Terabaytl
