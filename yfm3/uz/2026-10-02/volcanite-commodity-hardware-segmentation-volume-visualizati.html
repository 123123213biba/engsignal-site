            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"276\" cy=\"116\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"584\" cy=\"168\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · CAD_PARAMETRIC   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Volcanite:&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;superkompyuterlarsiz&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;terabaytli ma'lumotlarni&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;vizuallashtirish&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-f1.jpg\" alt=\"1-rasm: Vizual annotatsiya. a Bizning interaktiv Volcanite ilovamiz zamonaviy yo‘qotishsiz siqish usullaridan foydalanga\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: Vizual annotatsiya. a Bizning interaktiv &lt;a href=\"concepts/volcanite.html\"&gt;Volcanite&lt;/a&gt; ilovamiz zamonaviy yo‘qotishsiz siqish usullaridan foydalangan holda oddiy uskunalar yordamida katta segmentlangan hajmlarni vizual tadqiq qilish imkonini beradi. b Bizning grafik protsessor (GPU)…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm: Vizual annotatsiya. a Bizning interaktiv Volcanite ilovamiz zamonaviy yo‘qotishsiz siqish usullaridan foydalangan holda oddiy uskunalar yordamida katta segmentlangan hajmlarni vizual tadqiq qilish imkonini beradi. b Bizning grafik protsessor (GPU) asosidagi renderlash konveyerimiz ko‘rinadigan hajm hududlarini tezkor kirish uchun keshga dekompressiya qiladi. Ushbu konveyer turli renderlash konfiguratsiyalarini, hatto alohida voksellarni tekshirishgacha (o‘ngda) interaktiv tadqiq qilish imkonini beradi. c Renderlash har bir kadr uchun millisekundlarda amalga oshiriladigan interaktiv jarayondir. Birinchi kadrlarda dekompressiya yuki yuqoriroq bo‘ladi, ammo u tezda yo‘qoladi. d Volcanite yordamida biz 2,2 TB hajmdagi H01 inson miya po‘stlog‘i oq moddasi segmentatsiyasi hajmini Full-HD yo‘l-trassirovka yoritilishi bilan soniyasiga 66 kadr tezlikda, boshqa usullarga qaraganda ancha tezroq birinchi kadr vaqti bilan oddiy uskunada interaktiv tadqiq qila olamiz. Neuroglancerda vizualizatsiya uchun noaniq to‘rlarni yaratish bir haftadan ortiq vaqtni oladi, bizning oldindan ishlov berish tizimimiz esa tizimimizda ikki soatdan kam vaqt ichida ancha kichikroq va yo‘qotishsiz kodlashlarni yaratadi. e Volcanite’dagi soya rejimlari tezkor mahalliy soyalashdan yuqori sifatli yo‘l-trassirovkaga darhol qayta aloqa bilan o‘zgartirilishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Zamonaviy tomografiya va konnektomika hajmi tufayli qayta ishlash qiyin bo‘lgan terabaytli ma'lumotlarni hosil qiladi. Mavjud usullar soddalashtirilgan setkalarga yoki taqsimlangan tizimlarga tayanadi, bu esa tafsilotlarni yashiradi. Volcanite &lt;a href=\"concepts/vulkan.html\"&gt;Vulkan&lt;/a&gt; yordamida voksellarni to‘g‘ridan-to‘g‘ri renderlashni taklif etib, oldindan tayyorgarliksiz yuqori aniqlikni ta'minlaydi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Oddiy kompyuterda 100 FPS tezlikda 500 mlrd vokselni renderlash.&lt;/li&gt;\n&lt;li&gt;Murakkab 3D-setkalarsiz to‘g‘ridan-to‘g‘ri vizuallashtirish.&lt;/li&gt;\n&lt;li&gt;Aniq tahlil uchun global yoritish va soyalarni qo‘llab-quvvatlash.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Volcanite tizimi ma'lumotlarni samarali saqlash uchun CSGV (&lt;a href=\"concepts/csgv.html\"&gt;Fast Compressed Segmentation Volumes&lt;/a&gt;) formatidan foydalanadi, bu esa ularni soniyasiga gigabayt tezlikda o‘qish imkonini beradi. Renderlash Vulkan GPU-backend orqali amalga oshiriladi, bunda ma'lumotlar talabga binoan video xotira keshiga dekompressiya qilinadi. Bu mikroskopiyada qatlamlarni tikishdagi xatolar kabi muhim nuqsonlarni yashiradigan oraliq 3D-setkalarni yaratish zaruratini yo‘q qiladi.&lt;/p&gt;\n&lt;p&gt;H01 ma'lumotlar to‘plamida (2,2 TB hajmdagi miya po‘stlog‘i qismi) tizim yo‘l izlash (path tracing) yordamida soniyasiga 66 kadr tezlikka erishdi. 32 ta yorliq bilan cheklangan va namuna olishda artefaktlarga ega VTK'dan farqli o‘laroq, Volcanite millionlab yorliqlarni va global yoritishni qo‘llab-quvvatlaydi. Ma'lumotlarni oldindan qayta ishlash ikki soatdan kam vaqtni oladi, bu Neuroglancer'da bir haftagacha davom etadigan setka yaratish jarayonidan ancha tezdir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ishlash tezligi diskdan ma'lumot o‘qish tezligiga bog‘liq va dastlabki kadrlar dekompressiya keshini to‘ldirish uchun vaqt talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Zamonaviy tasvirlash usullari har bir vokselga ob'ekt yorlig'i tayinlangan terabayt hajmidagi &lt;a href=\"concepts/segmentatsiya.html\"&gt;segmentatsiya&lt;/a&gt; hajmlarini hosil qiladi. Ularning katta hajmi tadqiqotchilarni kesmalar bo'yicha tahlil qilish yoki taxminiy to'rlar (meshes) yaratishga majbur qiladi, bu esa fazoviy kontekstni yo'qotadi. Skalyar hajmlarni renderlashning an'anaviy usullari segmentatsiya uchun mos emas, chunki ular chegaralarni aniq saqlashni va kategoriyali qiymatlar bilan ishlashni talab qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Segmentatsiya — bu raqamli tasvirni har bir element (voksel) ma'lum bir ob'ektga tegishli deb tasniflanadigan hududlarga ajratish jarayoni.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Volcanite — bu oddiy kompyuter uskunalarida katta hajmdagi segmentatsiya ma'lumotlarini to'g'ridan-to'g'ri renderlash uchun ochiq kodli tizim. Tizim siqishni hisobga olgan holda ma'lumotlarni qayta ishlash, Vulkan GPU backend va segmentatsiyaga xos renderlash usullarini birlashtiradi. Bu standart ish stoli kompyuterida 100 kadr/soniya tezlikda 0,5 trilliongacha vokselni vizualizatsiya qilish imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Volcanite to'r hosil qilmasdan (meshing) terabaytli hajmlarni interaktiv renderlashni ta'minlaydi, voksel aniqligini saqlaydi va global yoritish effektlarini qo'shadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tizim allaqachon segmentlangan ma'lumotlar bilan ishlashga mo'ljallangan va dastlabki ishlov berish bosqichlarini almashtirmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Asosiy yutuqlar qatoriga ma'lumotlarni tayyorlashning uzoq davom etadigan bosqichlaridan voz kechish va maxfiy ma'lumotlar bilan lokal ishlash imkoniyati kiradi. Loyiha olimlarga gipotezalarni tekshirish uchun «teravoksel» yorliq maydonlarini interaktiv dalillarga aylantiruvchi vositani taqdim etadi.&lt;/p&gt;\n&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;p&gt;Segmentlangan hajmlar bu har bir elementga (vokselga) obyekt yoki instansiya yorlig'i biriktirilgan 3D-to'rlardir: V: N³ → N. Ushbu uzluksiz hududlar fazoni, masalan, konnektomdagi alohida neyronlarga ajratadi. Biz Volcanite — segmentlangan hajmlarni renderlash vositasini taqdim etamiz.&lt;/p&gt;\n&lt;h4 id=\"segmentlangan-hajmlarni-renderlashning-yangi-integratsiyalashgan-muhiti\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#segmentlangan-hajmlarni-renderlashning-yangi-integratsiyalashgan-muhiti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Segmentlangan hajmlarni renderlashning yangi integratsiyalashgan muhiti&lt;/span&gt;&lt;/a&gt;Segmentlangan hajmlarni renderlashning yangi integratsiyalashgan muhiti&lt;/h4&gt;\n&lt;p&gt;1-rasmda Volcanite yordamida vizualizatsiya jarayoni ko'rsatilgan. Tizim hajmni Fast Compressed Segmentation Volumes (CSGV) formatiga siqadi, bu hozirgi kunda yo'qotishsiz siqishning eng samarali usulidir. Siqish tezligi diskdan ma'lumotlarni o'qishga bog'liq (A1-jadval), kodlash o'tkazuvchanligi soniyasiga gigabaytlarni tashkil etadi. Vizualizatsiya jarayoni to'liq GPU asosida ishlaydi (1b-rasm). CSGV ma'lumotlari video xotirada (VRAM) saqlanadi va ko'rinadigan hududlar talabga binoan keshga ochiladi. Volcanite grafik ilovasi (1a-rasm) ma'lumotlarni millisekundlik kadrlar tezligida interaktiv o'rganish imkonini beradi (1c-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Volcanite VRAM'da ma'lumotlarni saqlash va CSGV formatidan foydalanish orqali segmentlangan hajmlarni yo'qotishsiz va interaktiv renderlashni ta'minlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Katta hajmlarni faqat 2D-kesimlar yoki soddalashtirilgan 3D-to'rlar ko'rinishida ko'rsatadigan boshqa vositalardan farqli o'laroq, Volcanite ma'lumotlarni har bir vokselga kirish imkonini saqlab qolgan holda renderlaydi. Yuqori sifatli renderlash interaktiv rejimda yoki buyruq qatori interfeysi (CLI) orqali amalga oshiriladi. A1-video Mouse L4 hajmining oflayn renderini, A2-video esa Cells ma'lumotlar to'plamini interaktiv o'rganishni namoyish etadi.&lt;/p&gt;\n&lt;h4 id=\"segmentlangan-hajmlarni-renderlash-orqali-ilmiy-tushunchalar\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#segmentlangan-hajmlarni-renderlash-orqali-ilmiy-tushunchalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Segmentlangan hajmlarni renderlash orqali ilmiy tushunchalar&lt;/span&gt;&lt;/a&gt;Segmentlangan hajmlarni renderlash orqali ilmiy tushunchalar&lt;/h4&gt;\n&lt;p&gt;2d-rasmda sichqon miyasidagi qon tomirlarining 3D-renderi ko'rsatilgan. Volcanite 2D-mikroskopik kesimlarni tikishdagi xatolarni aniqlashda muhim ahamiyat kasb etdi. Voksel aniqligi tufayli har qanday nomutanosiblik tomirlardagi aniq uzilishlar sifatida ko'rinadi. Neuroglancer'da bu xatolar &lt;a href=\"concepts/meshi.html\"&gt;mesh&lt;/a&gt;'larni soddalashtirish (Igneous parametrlari) tufayli kamroq seziladi, bu esa detallarni tekislaydi va hatto kichik xatolarni butunlay yo'q qilishi mumkin. Volcanite 163 GB gacha bo'lgan ma'lumotlar to'plami bilan ishlashga qodir, ParaView kabi analoglar esa bunday masshtabda ishlay olmaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mesh — bu obyekt yuzasini uchburchaklar to'ri sifatida yaqinlashtirish bo'lib, fayl hajmini kamaytirish uchun soddalashtirishni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"segmentlangan-hajmlar-uchun-samarali-materiallar-muharriri\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#segmentlangan-hajmlar-uchun-samarali-materiallar-muharriri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Segmentlangan hajmlar uchun samarali materiallar muharriri&lt;/span&gt;&lt;/a&gt;Segmentlangan hajmlar uchun samarali materiallar muharriri&lt;/h4&gt;\n&lt;p&gt;Vizualizatsiyadagi o'tkazish funksiyalari ma'lumot qiymatlarini rang va shaffoflik kabi optik xususiyatlarga moslashtiradi. Volcanite &lt;span class=\"yfm-latex\" data-content=\"l%20%5Cin%20N\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; yorliqlarini &lt;span class=\"yfm-latex\" data-content=\"A%3A%20l%20%20o%20(a_0%2C%20...%2C%20a_%7BN-1%7D)%20%5Cin%20R%5EN\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ikkilamchi atributlariga moslashtirish imkonini beradi, bu esa hujayralardagi ozuqa moddalari zichligini vizualizatsiya qilishga yordam beradi (4c-rasm).&lt;/p&gt;\n&lt;h4 id=\"vizualizatsiyani-baholash-uchun-segmentlangan-hajmlar-toplami\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#vizualizatsiyani-baholash-uchun-segmentlangan-hajmlar-toplami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Vizualizatsiyani baholash uchun segmentlangan hajmlar to'plami&lt;/span&gt;&lt;/a&gt;Vizualizatsiyani baholash uchun segmentlangan hajmlar to'plami&lt;/h4&gt;\n&lt;p&gt;Biz o'simliklar tahlilidan tortib kompozit materiallar va neyrobiologiyagacha bo'lgan keng sohalarni qamrab oluvchi benchmark ma'lumotlar to'plamini taqdim etamiz (5a-rasm). Hajmlar 72 MB (8-bit, Fabric) dan 2 TB dan ortiq (32-bit, H01 human cortex) gacha o'zgaradi.&lt;/p&gt;\n&lt;h4 id=\"csgv-segmentatsiyalangan-hajmlarni-siqish\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#csgv-segmentatsiyalangan-hajmlarni-siqish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CSGV segmentatsiyalangan hajmlarni siqish&lt;/span&gt;&lt;/a&gt;CSGV segmentatsiyalangan hajmlarni siqish&lt;/h4&gt;\n&lt;p&gt;Volcanite renderlash konveyeri to‘liq GPU asosida ishlaydi va CSGV siqish formatidan foydalanadi. 5c-rasmda ko‘rsatilganidek, ushbu usul ma’lumotlarni yo‘qotishsiz siqishni ta’minlaydi, bu esa cheklangan video xotiraga (VRAM) ega oddiy grafik protsessorlarda terabaytli hajmlarni qayta ishlash imkonini beradi. CSGV samaradorligi ma’lumotlar to‘plamidagi yorliqlar soniga (masalan, H01WM 13 milliondan ortiq yorliqga ega) deyarli bog‘liq emas, balki bloklardagi yorliqlarning lokal zichligiga tayanadi. 8 yoki 16-bitli ma’lumotlar uchun siqish darajasi pastroq bo‘ladi, chunki ular dastlabki holatda 32-bitli ma’lumotlarga qaraganda zichroq joylashgan (5c-rasm). Volcanite preprosessingi VTK yoki Neuroglancer’ga qaraganda tezroq ishlaydi va kamroq joy egallaydi (3c-rasm, A1-jadval). Neuroglancer’dan farqli o‘laroq, CSGV ma’lumotlarni yo‘qotishsiz kodlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CSGV yo‘qotishsiz siqishni ta’minlaydi va &lt;a href=\"concepts/level-of-detail.html\"&gt;LOD&lt;/a&gt; (detallash darajasi) oqimini uzatish orqali GPU resurslarini tejaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LOD — bu obyektning muhimligiga qarab uning detallash darajasini o‘zgartirish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;CSGV hajmli bloklarni yorliqlarni nusxalash operatsiyalari oqimi sifatida kodlaydi (5b-rasm). Eng yuqori detallash darajasidagi (LOD) ma’lumotlar (umumiy hajmning 45–68%) talabga binoan GPU’ga uzatiladi. Har bir tugun (node) bir xil bolalar tugunlarini o‘tkazib yuborish uchun stop-bitni saqlaydi. Biz eski palitra havolalari operatsiyasini (chegarasi δ ≤ 16) cheksiz δ qo‘llab-quvvatlaydigan yangi variant bilan almashtirdik, bu esa dublikatlarsiz optimal palitra uzunligini yaratishga imkon beradi (A2b-rasm).&lt;/p&gt;\n&lt;h4 id=\"tasvir-va-videoni-renderlash-unumdorligi\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#tasvir-va-videoni-renderlash-unumdorligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tasvir va videoni renderlash unumdorligi&lt;/span&gt;&lt;/a&gt;Tasvir va videoni renderlash unumdorligi&lt;/h4&gt;\n&lt;p&gt;6b-rasmda H01WM ma’lumotlarini soya va statik kamera bilan renderlash vaqtlari ko‘rsatilgan. Volcanite progressiv renderlashdan foydalanadi: tasvir sifati kadrlar to‘planishi bilan yaxshilanadi. Tizim faqat ko‘rinadigan bloklarni kerakli LOD darajasida dekompressiya qiladi, bunda bir voksel ekrandagi taxminan bir pikselga to‘g‘ri keladi (1b-rasm). Kichik ma’lumotlar to‘plamlari uchun barcha bloklar eng yuqori LOD’da dekodlanadi, yirik to‘plamlar (masalan, MouseL4, H01) uchun esa qo‘polroq LOD’lar ishlatiladi. Kadrni renderlash vaqti 2–29 ms oralig‘ida barqarorlashadi. VTK’ning &lt;a href=\"concepts/ray-marching.html\"&gt;ray marching&lt;/a&gt; algoritmlariga nisbatan Volcanite sezilarli darajada yuqori unumdorlikni ko‘rsatadi (3a-rasm). Kamera harakati davomida (6c-rasm) dekompressiya yuki barqaror qoladi va interaktiv kadrlar tezligini ta’minlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Renderlash tezligi apparat ta’minotiga bog‘liq; kamera keskin harakatlanganda dekoderga yuklama vaqtincha oshishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"volcanite-soya-tushirish-rejimlari\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#volcanite-soya-tushirish-rejimlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Volcanite soya tushirish rejimlari&lt;/span&gt;&lt;/a&gt;Volcanite soya tushirish rejimlari&lt;/h4&gt;\n&lt;p&gt;Volcanite tizimi to‘rtta soya tushirish rejimini qo‘llab-quvvatlaydi (1e-rasm). Ular lokal sirt aks ettirish modelidan tortib, to‘liq global yoritish (path tracing)gacha bo‘lgan diapazonni qamrab oladi. A7c-rasmda ko‘rsatilganidek, soya va atrof-muhit okklyuziyasi (ambient occlusion) fazoviy tuzilmalarni idrok etishni sezilarli darajada yaxshilaydi. Path tracing eng yuqori vizual sifatni ta’minlasa-da, renderlash vaqti 5,5 barobargacha oshadi (A2-jadval). Chuqur yo‘l kuzatuvi (A7a-rasm) ko‘proq ma’lumot bloklariga murojaat qilishni talab qiladi. Kamera harakatsiz bo‘lsa ham, tasvirni tekislash (anti-aliasing) uchun tasodifiy nurlar har bir kadrda yangi ma’lumotlarni talab qiladi. Rejimlar o‘rtasida almashinish darhol amalga oshiriladi, bu esa tezkor tadqiqot va yuqori sifatli vizualizatsiya o‘rtasida moslashuvchanlikni ta’minlaydi (A2-video). Neuroglancer yoki VTK/ParaView kabi vositalardan farqli o‘laroq, Volcanite fazoviy idrokni chuqurroq ta’minlaydi (2a va 3b-rasmlar).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Path tracing eng yuqori sifatni beradi, ammo renderlash vaqtini 5,5 barobargacha oshiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"gpu-asosidagi-renderlash-konveyeri\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#gpu-asosidagi-renderlash-konveyeri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GPU asosidagi renderlash konveyeri&lt;/span&gt;&lt;/a&gt;GPU asosidagi renderlash konveyeri&lt;/h4&gt;\n&lt;p&gt;Renderlash konveyeri (6a-rasm) to‘liq GPUda amalga oshiriladi, bu kadr ichidagi CPU sinxronizatsiyasini yo‘q qiladi va kechikishlarni kamaytiradi. Keshni boshqarish to‘rt bosqichdan iborat: so‘rov (Request), xotira ajratish (Provision), bloklarni tayinlash (Assign) va parallel dekompressiya (Decompress). Renderlash bosqichi (Render) voksel setkasi orqali nurlar marshrutini (ray marching) hisoblaydi (1b va A7a-rasmlar). Butun hajm GPU VRAM'ida saqlanganligi sababli, CPU va GPU o‘rtasidagi ma’lumotlar oqimi deyarli yo‘q qilinadi. Keshni boshqarish atomar operatsiyalardan foydalanadi va hatto terabaytli ma’lumotlar bilan ishlaganda ham kadr vaqtiga sezilarli ta’sir ko‘rsatmaydi (6b va 6c-rasmlar). Asosiy yuk dekompressiya va renderlash bosqichlariga to‘g‘ri keladi. VTK yoki Neuroglancer'dan farqli o‘laroq, Volcanite foydalanuvchi o‘zaro ta’sirida minimal kechikishni kafolatlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ray marching — bu hajmli ma’lumotlarni renderlash usuli bo‘lib, unda nur voksel setkasi bo‘ylab o‘tib, zichlik yoki rang qiymatlarini to‘playdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Jadval 1.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-tT1.jpg\" alt=\"Jadval 1\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"kombinatsiyalangan-upsampling-va-shovqinni-kamaytirish-filtri\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#kombinatsiyalangan-upsampling-va-shovqinni-kamaytirish-filtri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kombinatsiyalangan upsampling va shovqinni kamaytirish filtri&lt;/span&gt;&lt;/a&gt;Kombinatsiyalangan upsampling va shovqinni kamaytirish filtri&lt;/h4&gt;\n&lt;p&gt;Post-processing unumdorligi piksel interpolatsiyasiga bog‘liq. Kam namunalar bo‘lganda shovqin qo‘shni sirt nuqtalari bilan aralashtirish orqali tozalanadi (A1f-rasm). Ixtiyoriy subsampling (1/4, 1/16 yoki 1/64 piksel renderlash) tezlikni oshiradi, bo‘shliqlar esa eng yaqin qo‘shni ma’lumotlari bilan to‘ldiriladi (A1e-rasm). Biz «à-trous» filtrini [16] modifikatsiya qildik: oraliq natijalarni saqlash o‘rniga, ranglarni to‘g‘ridan-to‘g‘ri buferlarda (Denoise A/B) to‘playmiz, bu xotira sarfini kamaytiradi. Upsampling shovqinni kamaytirish jarayoniga integratsiya qilingan. Biz segmentlangan hajmlar uchun filtr og‘irliklarini optimallashtirdik va G-bufer sxemasidan (A1b-rasm) foydalandik. Hisoblash tez (A1d-rasm), xotira sarfi minimal (uchta rasm o‘lchamidagi tekstura) va kamera harakatlanganda yuqori sifatli tasvirni beradi. Kamera statik holatga kelgach, filtrlash asta-sekin kamayib, xolis tasvirga yaqinlashadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Subsampling ishlatilganda vaqtinchalik artefaktlar paydo bo‘lishi mumkin, ular yetarli namunalar to‘plangach yo‘qoladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"gpu-xotirasidan-foydalanishni-optimallashtirish\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#gpu-xotirasidan-foydalanishni-optimallashtirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GPU xotirasidan foydalanishni optimallashtirish&lt;/span&gt;&lt;/a&gt;GPU xotirasidan foydalanishni optimallashtirish&lt;/h4&gt;\n&lt;p&gt;A2d-rasmda yaqinlashtirilgan tasvirlarni renderlash uchun sarflangan umumiy VRAM hajmi keltirilgan. Kichik hajmdagi ma'lumotlar uchun CSGV siqish algoritmi tufayli VRAM iste'molida kesh xotirasi ustunlik qiladi. Katta hajmdagi ma'lumotlar uchun esa siqilgan hajm ham VRAM cheklovlariga yaqinlashadi. Biz qo'llagan optimallashtirish usullari tufayli renderlash jarayoni tizimimizning 16 GiB VRAM chegarasidan oshmaydi. Masalan, H01WM ma'lumotlar to'plami uchun eng past LOD (detallash darajasi) oqimini uzatish CSGV xotirasini 65,7% ga kamaytiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Optimallashtirish H01WM uchun VRAM sarfini 65,7% ga qisqartirib, 16 GiB limit doirasida ishlashni ta'minladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bloklarni qadoqlangan palitrali formatga ochish (dekompressiya) qadoqlash koeffitsienti hisobiga bir xil miqdordagi voksel uchun kichikroq keshdan foydalanish imkonini beradi (A2a-rasm). Bunda kesh bloklar palitrasiga to'g'ridan-to'g'ri kirish imkonini beruvchi indekslarni saqlaydi, bu esa keshning foydali hajmini bir necha barobar oshiradi (A2d-rasmdagi «Packing» va A3-jadvaldagi VRAM ko'rsatkichlari). Agar kesh buferi barcha bloklarni joylashtirish uchun yetarli bo'lmasa, tizim avtomatik ravishda blok so'rovlarini ekran piksellarining kichik qismi bilan cheklaydi (A2c-rasm). Bu tasvirning to'liq shakllanishi uchun ko'proq kadrlar talab qilsa-da, keshning «qulflanishi» (deadlock) oldini oladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/cache-deadlock.html\"&gt;Kesh qulflanishi&lt;/a&gt; (cache deadlock) — kesh xotirasi doimiy talab qilinadigan ma'lumotlar bilan to'lib qolishi va yangi ma'lumotlar uchun joy qolmasligi holati.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Volcanite TB hajmdagi ma'lumotlarni yuqori sifatda va tezkor javob bilan renderlaydi. VTK kabi barcha ma'lumotlarni VRAM'da saqlashni talab qiladigan boshqa rendererlardan farqli o'laroq (3a-rasm), bizning usulimiz oddiy uskunalar yordamida katta hajmdagi segmentlangan hajmlarni interaktiv tahlil qilish imkonini beradi, bu esa yangi gipotezalarni tekshirishda juda muhimdir.&lt;/p&gt;\n&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;h4 id=\"volcanite-usulining-afzalliklari\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#volcanite-usulining-afzalliklari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Volcanite usulining afzalliklari&lt;/span&gt;&lt;/a&gt;Volcanite usulining afzalliklari&lt;/h4&gt;\n&lt;p&gt;Volcanite zich segmentatsiyalarni vizuallashtirishga tubdan yangicha yondashuvni taklif etadi. U segmentatsiyalarni skalyar maydonlar yoki oldindan hisoblangan sirtlar sifatida emas, balki voksel chegaralariga sezgir bo'lgan kategoriyali ma'lumotlar sifatida qabul qiladi. Bu oddiy uskunalar yordamida teravoksel miqyosidagi hajmlarni interaktiv render qilish imkonini beradi va voksel darajasidagi aniqlikni saqlaydi. Tizim mesh (to'r) generatsiyasini talab qilmaydi, bu esa segmentatsiya natijalarini olishdan vizual tahlilgacha bo'lgan vaqtni qisqartiradi. CSGV (Categorical Segmentation Grid Volume) formatidan foydalanish ma'lumotlarni yo'qotishsiz siqish va renderlash uchun tezlashtirish strukturasini ta'minlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Volcanite segmentatsiyadan vizuallashtirishgacha bo'lgan jarayonni qisqartiradi, bu esa teravoksel hajmlarini mesh yaratmasdan standart kompyuterlarda tahlil qilish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CSGV — bu segmentatsiya belgilarini voksel sifatida saqlaydigan format bo'lib, u murakkab tuzilmalarni tahlil qilish uchun muhim bo'lgan kategoriyali tabiat va chegaralarni saqlab qoladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Neyron tarmoqlar yoki qon tomir tizimlari kabi zich ob'ektli vazifalarda voksel aniqligidagi renderlash va global yoritish xatolarni, shuningdek, kesmalar yoki soddalashtirilgan 3D modellarda ko'rinmaydigan segmentatsiya nuqsonlarini aniqlashga yordam beradi. Ma'lumotlar bilan mahalliy ishlash imkoniyati hamkorlikni osonlashtiradi va maxfiy ma'lumotlar bilan ishlashda xavfsizlikni ta'minlaydi. Usul universal bo'lib, tadqiqot sohasidan qat'i nazar, bir necha belgidan tortib millionlab ob'ektlargacha bo'lgan ma'lumotlar uchun mos keladi.&lt;/p&gt;\n&lt;h4 id=\"mavjud-usullar-bilan-solishtirish\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#mavjud-usullar-bilan-solishtirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mavjud usullar bilan solishtirish&lt;/span&gt;&lt;/a&gt;Mavjud usullar bilan solishtirish&lt;/h4&gt;\n&lt;p&gt;Volcanite miqyos, aniqlik va iteratsiya tezligi o'rtasidagi muvozanatni optimallashtiradi. Kesmalarga asoslangan ko'rish vositalari aniq, ammo 3D kontekstga ega emas, meshga asoslangan usullar esa murakkab oldindan ishlov berishni talab qiladi va mayda detallarni yashirishi mumkin. Oqimli tizimlar petabaytli ma'lumotlar uchun zarur, ammo ular ko'pincha ko'rish sohasini cheklaydi. Volcanite esa yuqori aniqlikdagi tekshiruv va tezkor mahalliy javob berish orqali ularni to'ldiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Hozirgi realizatsiya teravoksel diapazoni bilan cheklangan; petabaytli ma'lumotlar bilan ishlash uchun CPU yoki masofaviy serverlardan oqimli yuklash mexanizmlari talab qilinadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tizimning hozirgi versiyasi zamonaviy biologik rekonstruksiyalarning aksariyatini qamrab oladigan teravoksel hajmlarini samarali qayta ishlaydi. Kelgusida GPU kesh va dinamik ma'lumotlarni yuklashni joriy etish orqali aniqlikni yo'qotmasdan voksel segmentatsiyalari bilan to'g'ridan-to'g'ri o'zaro ta'sirni saqlab qolish rejalashtirilgan.&lt;/p&gt;\n&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"baholash-muhitini-sozlash\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#baholash-muhitini-sozlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Baholash muhitini sozlash&lt;/span&gt;&lt;/a&gt;Baholash muhitini sozlash&lt;/h4&gt;\n&lt;p&gt;Rendering unumdorligi standart uskunada sinovdan o'tkazildi: AMD Ryzen 7 5800X protsessori, 48 GiB DDR4 operativ xotira va 16 GiB VRAMga ega RTX 4070 Ti Super grafik kartasi. Tizim Ubuntu 24.04 operatsion tizimida, grafik protsessorning sobit chastotasida ishladi. Kirish ma'lumotlari Lexar NM790 4 TB NVMe diskidan o'qildi, natijalar esa Samsung EVO 970 1 TB NVMe diskiga saqlandi. Barcha ma'lumotlarni yuklab olish, Volcanite'ni headless rejimda ishga tushirish va grafiklar yaratish uchun Python skriptlari taqdim etiladi.&lt;/p&gt;\n&lt;h4 id=\"siqish-va-rendering-parametrlari\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#siqish-va-rendering-parametrlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Siqish va rendering parametrlari&lt;/span&gt;&lt;/a&gt;Siqish va rendering parametrlari&lt;/h4&gt;\n&lt;p&gt;CSGV blokining standart o'lchami b = 32 qilib belgilandi, katta hajmdagi ma'lumotlar (MouseL4, H01BV, H01WM, Fabric) uchun esa b = 64 ishlatiladi. Fiber va Polyamid kabi ma'lumotlar to'plami uchun kesh talablarini qondirish maqsadida voksellarni ixcham formatga dekompressiya qilish (cache paletting) usuli qo'llaniladi. H01WM hajmi VRAM sig'imidan oshib ketganligi sababli, uning eng yuqori LOD darajasidagi bloklari faqat talab bo'yicha GPUga uzatiladi. Cells, MouseL4S, MouseL4, Liconn va H01WM uchun cheksiz palitra havolalari yoqilgan, qolganlari uchun esa o'chirilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/paletizatsiya-kesha.html\"&gt;Kesh paletizatsiyasi&lt;/a&gt; — bu xotirani tejash uchun takrorlanuvchi voksel qiymatlarini palitra havolalari bilan almashtirish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Barcha tasvirlar 1920×1080 pikselli ruxsatda, har bir piksel uchun bitta nur bilan renderlanadi. Tasvir sifatini baholash uchun statik kamera va vaqtinchalik supersampling (temporal supersampling) yordamida 1024 ta kadr, video baholash uchun esa fokus nuqtasi atrofida aylanuvchi kamera bilan 600 ta kadr renderlanadi.&lt;/p&gt;\n&lt;h4 id=\"vtk-va-neuroglancer-bilan-taqqoslash\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#vtk-va-neuroglancer-bilan-taqqoslash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;VTK va Neuroglancer bilan taqqoslash&lt;/span&gt;&lt;/a&gt;VTK va Neuroglancer bilan taqqoslash&lt;/h4&gt;\n&lt;p&gt;Taqqoslash VTK v9.5.0 bilan amalga oshirildi. VTK kulrang tusli hajmlar uchun mo'ljallanganligi sababli, segmentlangan ma'lumotlar uchun sirtni ajratib olish yoki 32 tagacha kategoriyali yorliqlarni qo'llab-quvvatlovchi vokselli rendering ishlatiladi. Biz VTK'ning GPU asosidagi vokselli renderingidan foydalandik va Volcanite material konfiguratsiyalarini shaffoflik transfer funksiyalariga o'tkazdik. VTK'da nur qadami 0,5 voksel qilib belgilandi. Neuroglancer baholashlari uchun ma'lumotlar 64×64×64 o'lchamli chunk formatiga o'tkazildi. Neuroglancer mijoz-server arxitekturasida ishlagani va ma'lumotlarni oqim bilan yuklagani uchun, unda kadr vaqtini o'lchash imkonsiz deb topildi.&lt;/p&gt;\n&lt;h4 id=\"segmentlangan-hajmlarni-siqish\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#segmentlangan-hajmlarni-siqish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Segmentlangan hajmlarni siqish&lt;/span&gt;&lt;/a&gt;Segmentlangan hajmlarni siqish&lt;/h4&gt;\n&lt;p&gt;Vizualizatorimizda katta hajmdagi segmentlangan ma'lumotlarni (V: N³ → N) bitta GPU tizimida qayta ishlash uchun yo'qotishsiz siqish usuli qo'llaniladi. GPU xotirasi cheklanganligi sababli, biz CSGV blokli ko'p darajali kodlashdan foydalanamiz. Asl algoritmga kiritilgan o'zgarishlar qatoriga faqat yorliqlar palitrasini kiritish va o'qish operatsiyalarini qoldirib, qolganlarini o'chirish imkoniyati kiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/obratnye-ssylki.html\"&gt;Orqaga havolalar&lt;/a&gt; (back references) — bu ma'lumotlar oqimida takrorlanuvchi qiymatlarni oldingi o'rinlarga ishora qilish orqali almashtirish usuli bo'lib, u xotirani tejaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz ixtiyoriy uzunlikdagi orqaga havolalarni joriy qildik. Operatsiya kodidan so'ng 4-bitli element o'qiladi: 3 ta kichik bit δ qiymatining bir qismini, oxirgi bit esa keyingi element borligini bildiradi. δ qiymati &lt;span class=\"yfm-latex\" data-content=\"%5Cdelta%20%5Cleftarrow%20(%5Cdelta%20%5Cll%203)%20%5Cmid%20(%20ext%7Bentry%7D%20%5C%26%20111_2)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; formulasi bo'yicha yangilanadi. Bu 32-bitli yorliqlar dublikatlarini yo'qotish imkonini beradi. 64³ o'lchamli blok uchun nazariy maksimal qiymat 7 ta 4-bitli elementni (28 bit) tashkil etadi, bu 32-bitli dublikatdan samaraliroq. Siqish CPU'da OpenMP yordamida parallel bajariladi.&lt;/p&gt;\n&lt;h4 id=\"volcanite-renderlash\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#volcanite-renderlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Volcanite renderlash&lt;/span&gt;&lt;/a&gt;Volcanite renderlash&lt;/h4&gt;\n&lt;p&gt;Siqilgan hajm GPU xotirasiga yuklanadi va renderlash jarayonida kerakli qismlari dekodlanadi. Renderlash nurlarni yo'naltirish (ray marching) usuli bilan amalga oshiriladi, bunda har bir voksell bir birlik hajmga ega. Har bir piksel uchun nur hajm bo'ylab o'tib, yorliqlarni o'qiydi (Rasm A7a). Sirt materiallari yorliqlar asosida aniqlanadi (Rasm 4a).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-f4.jpg\" alt=\"4-rasm: a Voksellarga ranglarni tayinlash namunasi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm: a Voksellarga ranglarni tayinlash namunasi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-rasm: a Voksellarga ranglarni tayinlash namunasi. Oltita vokselning yorliqlari har biri ikkita atributga (yosh va tur) mos keladi. Filtr atributi belgilangan diapazonga tushadigan birinchi material voksellarga tayinlanadi. Boshqa atribut diapazoni ranglar xaritasidan ranglarni tayinlash uchun ishlatilishi mumkin. b Hajmlar xotirada vokselni atributlarga samarali moslashtirish uchun ketma-ket ID qiymatlarini saqlash uchun oldindan qayta ishlanadi. d Transfer funksiyasi muharriri yorliq atributlari intervallari asosida soyalash materiallarini belgilaydi. Har bir material uchun filtr atributlari intervali qaysi voksel yorliqlari uchun dolzarbligini belgilaydi. Ushbu yorliqlar uchun atribut xususiyatining qiymatlari turli ranglarga moslashtirilishi mumkin. c Uchta material bilan hujayralarni renderlash: qon tomirlari qizil rangda, o‘&lt;a href=\"concepts/shape-memory-alloy.html\"&gt;sma&lt;/a&gt; hujayralarining ozuqaviy zichligi viridis ranglar xaritasi bilan ko‘rsatilgan, ECM kulrang rangda kesib olingan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"soya-tushirish-rejimlari\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#soya-tushirish-rejimlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Soya tushirish rejimlari&lt;/span&gt;&lt;/a&gt;Soya tushirish rejimlari&lt;/h4&gt;\n&lt;p&gt;Soya tushirish rejimi sirt bilan to'qnashuvdan keyin nurlarning davom etishini belgilaydi. Hisob-kitob renderlash tenglamasiga asoslanadi:&lt;br /&gt;\n&lt;span class=\"yfm-latex\" data-content=\"L_o(x%2C%20%5Comega_o)%20%3D%20L_e(x%2C%20%5Comega_o)%20%2B%20%5Cint_%7B%5COmega%5E%2B%7D%20f(x%2C%20%5Comega_i%2C%20%5Comega_o)%20L_i(x%2C%20%5Comega_i)%20%5Ccos%20%20heta_i%20d%5Comega_i\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;&lt;/p&gt;\n&lt;p&gt;Rejimlar (tezdan sekinga):&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Simple Local Shading: L_i doimiy deb qabul qilinadi, qo'shimcha nurlar kuzatilmaydi.&lt;/li&gt;\n&lt;li&gt;One Shadow Ray: yorug'lik manbasiga bitta nur yo'naltirib, soya bor-yo'qligi tekshiriladi.&lt;/li&gt;\n&lt;li&gt;Ambient Occlusion: atrof-muhit soyasini yaqinlashtirish uchun tasodifiy yo'nalishda bitta nur otiladi.&lt;/li&gt;\n&lt;li&gt;Path Tracing: Monte-Karlo usuli bilan to'liq renderlash tenglamasini baholaydi, bilvosita yoritishni hisobga oladi. Rekursiya nur hajm tashqarisiga chiqqanda yoki chuqurlik chegarasiga yetganda to'xtaydi.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"shaffoflik\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#shaffoflik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Shaffoflik&lt;/span&gt;&lt;/a&gt;Shaffoflik&lt;/h4&gt;\n&lt;p&gt;Setkali 3D segmentatsiya usullaridan farqli o‘laroq, bizning voksel asosidagi renderlashimiz har doim hajmiy hududlar va sirtlarni kameradan eng yaqinidan eng uzoqigacha bo‘lgan tartibda o‘tadi. Bu yarim shaffof sirtlarning kompozitsiyasi kommutativ bo‘lmasa ham, renderlashda yarim shaffoflikni integratsiya qilish imkonini beradi (masalan, A6-rasmdagi Mouse BA). Foydalanuvchilar yorliq materiallariga σ shaffoflik koeffitsientini belgilashlari mumkin. Agar nur yarim shaffof materialga kirsa, u o‘z yo‘nalishini o‘zgartirmaydi, balki Lambert mahalliy sirt soyalash modelining hissasini to‘plangan yorqinlikka qo‘shadi va nurning o‘tkazuvchanligini σ ga kamaytiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/metod-lamberta.html\"&gt;Lambert modeli&lt;/a&gt; — sirtning yorqinligi kuzatish burchagiga bog‘liq bo‘lmagan, yorug‘lik barcha yo‘nalishlarda bir xil tarqaladigan yoritish modelidir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz nur yo‘llari bo‘ylab ketma-ket sirtlar orasidagi bo‘lakli bir jinsli hajmlar uchun emissiya-yutilish modelini sinab ko‘rdik, ammo faqat sirtlardan foydalanish samaraliroq vizualizatsiyani ta’minlashini aniqladik. Kelajakda biz soyalashni turli BRDF funksiyalari bilan kengaytirishni va yorug‘lik transportini yaxshilashni rejalashtirmoqdamiz.&lt;/p&gt;\n&lt;h4 id=\"raymarching\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#raymarching\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Raymarching&lt;/span&gt;&lt;/a&gt;Raymarching&lt;/h4&gt;\n&lt;p&gt;Biz nur yo‘li bo‘ylab voksellarni va ularning tegishli yorliqlarini aniqlash uchun Raymarching usulidan foydalanamiz. Renderlovchi LOD (detallashtirish darajasi) ni shunday tanlaydiki, bitta g‘isht vokseli tasvir tekisligidagi taxminan bitta pikselga to‘g‘ri keladi. Voksel ichidagi yorliqlar doimiy bo‘lgani uchun biz ko‘p o‘lchamli raqamli differensial analizator (DDA) o‘tish usulini qo‘llaymiz. Katta hajmlar uchun raqamli barqarorlikni ta’minlash maqsadida biz pozitsiyani dekompozitsiya qilamiz: butun sonli vektor &lt;span class=\"yfm-latex\" data-content=\"voxel%20%5Cin%20%5Cmathbb%7BN%7D%5E3\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; voksel indeksini, suzuvchi nuqtali vektor &lt;span class=\"yfm-latex\" data-content=\"vpos%20%5Cin%20%5Cmathbb%7BR%7D%5E3\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; esa voksel ichidagi pozitsiyani [0, 1)³ oralig‘ida saqlaydi.&lt;/p&gt;\n&lt;p&gt;GPU (SIMT arxitekturasi) uchun ish oqimini optimallashtirishda modulo operatoridan foydalaniladi. Nur yo‘lini kuzatishda 32 tagacha qaytish bilan «rus ruletkasi» usuli qo‘llaniladi. Aliasingni yo‘qotish uchun vaqtinchalik silliqlash (temporal anti-aliasing) amalga oshiriladi: nurlarning sub-piksel siljishlari Blackman-Harris filtri asosida tebratiladi. Segmentatsiya hajmlarida klassik Mip-mapping (chiziqli filtrlanish) imkonsiz bo‘lgani uchun, biz CSGV ierarxiyasidan foydalanamiz, bu yerda qo‘polroq darajalarda o‘rtacha qiymat emas, balki qiymatlar modasi to‘planadi.&lt;/p&gt;\n&lt;h4 id=\"post-processing\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#post-processing\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Post-processing&lt;/span&gt;&lt;/a&gt;Post-processing&lt;/h4&gt;\n&lt;p&gt;Ambient Occlusion yoki Path Tracing bilan dastlabki kadrlardagi shovqin ierarxik veyvlet shovqinni kamaytiruvchi (denoiser) usul yordamida kamaytiriladi. Agar GPU unumdorligi cheklangan bo‘lsa, renderlash har bir kadr uchun piksellarning kichik qismida bajariladi va yetishmayotgan qiymatlar upsampling orqali to‘ldiriladi (A1e-rasm). Jarayon hisoblash shaderlari konveyeri orqali amalga oshiriladi. Kirish ma’lumotlari sifatida rang va shaffoflik (RGBA) to‘plovchi buferlari hamda filtratsiyani boshqarish uchun G-bufer ishlatiladi. Yakuniy bosqichda ton mapping, yorqinlik, &lt;a href=\"concepts/visibility.html\"&gt;kontrast&lt;/a&gt;, gamma tuzatish va fon bilan aralashtirish amalga oshiriladi.&lt;/p&gt;\n&lt;h4 id=\"g-buffer\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#g-buffer\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;G-Buffer&lt;/span&gt;&lt;/a&gt;G-Buffer&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"concepts/g-buffer.html\"&gt;G-Buffer&lt;/a&gt; renderlash bosqichida yoziladi va faqat oxirgi kadr uchun har bir pikselga 48 bit ma'lumotni o'z ichiga oladi. Sirt bilan birinchi o'zaro ta'sir nuqtasi uchun quyidagilar saqlanadi (A1b-rasm): sirt normali (3 bit, oltita diskret yo'nalishdan biri), kvantlangan chuqurlik (13 bit, ma'lumotlar to'plamini qamrab oluvchi sferagacha bo'lgan masofa, A3b-rasm) va material hamda albedo rangini aniqlash uchun 32 bitli yorliq. 011 normali sirt yo'qligini, 111 esa piksel hali render qilinmaganligini bildiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;G-Buffer — bu har bir piksel uchun geometrik xususiyatlarni (normallar, chuqurlik, materiallar) saqlaydigan oraliq bufer bo'lib, u murakkab geometriyaga qayta murojaat qilmasdan post-ishlov berish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"denoising\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#denoising\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Denoising&lt;/span&gt;&lt;/a&gt;Denoising&lt;/h4&gt;\n&lt;p&gt;Renderlash har bir kadrda har bir piksel uchun ko'pi bilan bitta namunani to'playdi. Shovqinni kamaytirish uchun «A-trous» filtri (A1f-rasm) qo'llaniladi, u qirralarni saqlagan holda ranglarni xiralashtiradi. Har bir i iteratsiyada piksel oldingi natijaning 3×3 yoki 5×5 o'lchamli maydoni bilan ishlaydi (A1c-rasm), qadam 2^i ga teng, bu 3 ta iteratsiyadan so'ng 15×15 qamrov maydonini hosil qiladi (A1a-rasm). Xotirani tejash uchun yuqoriga qarab o'tish (up-pass) ishlatilmaydi. Pikselning i+1 iteratsiyadagi qiymati: &lt;span class=\"yfm-latex\" data-content=\"c_%7Bi%2B1%7D(p)%20%3D%20%5Cfrac%7B1%7D%7Bk%7D%20%5Csum_%7Bq%7D%20h_i(q)%20%5Ccdot%20w(q%2C%20p)%20%5Ccdot%20c_i(q)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; formulasi bilan hisoblanadi. Bu yerda h — Gauss filtri (1, 2, 1)⊗(1, 2, 1), w esa G-Buffer farqlariga (normallar, chuqurlik va HSV rang) asoslangan og'irlik koeffitsiyentidir. Agar n_p va n_q normallari mos kelmasa, w=0. Aks holda, &lt;span class=\"yfm-latex\" data-content=\"w%20%3D%20e%5E%7B-%5Clangle%20%5Crho_%5CDelta%2C%20%5Crho_%5CDelta%20%5Crangle%7D%20%5Ccdot%20e%5E%7B-%2Fd_p-d_q%2F%2F%5Cphi_d%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; bo'lib, bu yerda &lt;span class=\"yfm-latex\" data-content=\"%5Cphi_d\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — voksel o'lchami, &lt;span class=\"yfm-latex\" data-content=\"%5Cphi_%5Crho%3D8\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; esa albedo farqlarining ta'sirini boshqaradi.&lt;/p&gt;\n&lt;h4 id=\"upsampling\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#upsampling\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Upsampling&lt;/span&gt;&lt;/a&gt;Upsampling&lt;/h4&gt;\n&lt;p&gt;Ishlash tezligini oshirish uchun renderlash ruxsati 1/4, 1/16 yoki 1/64 gacha kamaytirilishi mumkin. Bo'shliqlar denoiserning ierarxik to'planishiga integratsiya qilingan oddiy upsampling usuli bilan to'ldiriladi (A1e-rasm). Renderlanmagan piksellar (111 normali) uchun buferlar eng yaqin renderlangan qo'shnisigacha bo'lgan 2D siljishni saqlaydi. Har bir i bosqichida 2^i masofadagi qo'shni q qidiriladi. Yakuniy siljish &lt;span class=\"yfm-latex\" data-content=\"o_p%20%5Cleftarrow%20%5Cmin_%7Blength%7D%20%5Bo_p%2C%20o_q%20%2B%20(q%20-%20p)%5D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; sifatida yangilanadi. Natija Voronoy diagrammalari uchun Jump-Flood algoritmini eslatadi. Stratifikatsiyalangan tanlash har bir 2², 4² yoki 8² piksel blokida bitta piksel renderlanishini ta'minlaydi, bloklar ketma-ketligi esa ko'k shovqin (blue-noise) bilan siljitiladi (A1e-rasm).&lt;/p&gt;\n&lt;h4 id=\"volcanite-application\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#volcanite-application\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Volcanite application&lt;/span&gt;&lt;/a&gt;Volcanite application&lt;/h4&gt;\n&lt;p&gt;Grafik interfeysdan (GUI) tashqari, Volcanite vazifalarni avtomatlashtirish uchun CLI orqali yoki grafik qobiqsiz tizimlarda barcha parametrlarga to'liq kirish huquqi bilan ishlashi mumkin (1-rasm).&lt;/p&gt;\n&lt;h4 id=\"materiallar-muharriri-va-uzatish-funksiyalari\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#materiallar-muharriri-va-uzatish-funksiyalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Materiallar muharriri va uzatish funksiyalari&lt;/span&gt;&lt;/a&gt;Materiallar muharriri va uzatish funksiyalari&lt;/h4&gt;\n&lt;p&gt;Ilovaning o‘ng qismidagi grafik interfeys (1a-rasm) materiallar muharririni o‘z ichiga oladi, u belgilarni (labels) optik xususiyatlarga moslashtirish uchun uzatish funksiyalarini boshqaradi. Tizim ko‘p darajali xaritalashdan foydalanadi (4a-rasm): materiallar atributlarni minimal va maksimal qiymatlar bo‘yicha filtrlash orqali tayinlanadi. Masalan, [5.2, 27] diapazonidagi barcha belgilar chap materialga tayinlanishi mumkin (4d-rasm). Har bir belgi uchun ro‘yxatdan mos keladigan birinchi material tanlanadi. Bu material rang, shaffoflik va emissiyani belgilaydi. Ranglar doimiy bo‘lishi yoki [48, 69] ranglar xaritasi asosida berilishi mumkin. Ikkinchi holda, filtrdan mustaqil bo‘lgan ikkilamchi vizualizatsiya atributi ishlatiladi (4d-rasmdagi Attribute). Qiymatlar xaritaga chiziqli tarzda o‘tkaziladi, bunda diapazonni cheklash (Clamp), takrorlash (Repeat) yoki tasodifiy tayinlash (Random) imkoniyatlari mavjud.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/funktsiya-peredachi.html\"&gt;Uzatish funksiyasi&lt;/a&gt; — bu raqamli ma’lumotlarni vizual xususiyatlarga (rang, shaffoflik) aylantiruvchi matematik qoida bo‘lib, u hajm ichidagi kerakli tuzilmalarni ajratib ko‘rsatishga imkon beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Belgilar atributlari A_i: N → R CPU tomonida SQLite3 ma’lumotlar bazasida saqlanadi, bu SQL so‘rovlari orqali hosilaviy atributlarni yaratishga imkon beradi. A₀(l) = l atributi har doim mavjud. Volcanite, shuningdek, har bir belgi uchun geometrik atributlarni (hajm, sirt maydoni) hisoblaydi. Atributlar GPUga suzuvchi nuqtali (floating point) buferlar sifatida uzatiladi. Belgilar soni voksellar sonidan ancha kam bo‘lgani uchun bu samarali hisoblanadi. Atributlar bilan ishlashda indekslar uzluksizligini ta’minlash uchun oldindan ishlov berish amalga oshiriladi: voksellar 3D Morton egri chizig‘i bo‘ylab [50] aylanib o‘tiladi va belgilar o‘sib boruvchi indekslar bilan almashtiriladi. Bu xaritalash asl belgilarni tiklash uchun bazada saqlanadi.&lt;/p&gt;\n&lt;h4 id=\"buyruqlar-satri-interfeysi-cli\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#buyruqlar-satri-interfeysi-cli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Buyruqlar satri interfeysi (CLI)&lt;/span&gt;&lt;/a&gt;Buyruqlar satri interfeysi (CLI)&lt;/h4&gt;\n&lt;p&gt;Volcanite CLI orqali headless-rejimni qo‘llab-quvvatlaydi. Buyruqlar satri barcha funksiyalarni, jumladan hajmlarni siqish/dekompressiya qilish va renderlashni boshqarish imkonini beradi. CLI grafik qobiqsiz serverlarda ishlashga va bash yoki Python skriptlariga integratsiya qilishga imkon beradi.&lt;/p&gt;\n&lt;h4 id=\"gpu-renderlash-konveyeri\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#gpu-renderlash-konveyeri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GPU renderlash konveyeri&lt;/span&gt;&lt;/a&gt;GPU renderlash konveyeri&lt;/h4&gt;\n&lt;p&gt;Volcanite Vulkan API yordamida C++ tilida amalga oshirilgan. Hajmlarni siqish CPUda OpenMP [56] bilan, renderlash va dekodlash esa GLSL shaderlarida bajariladi. Shaderlar ma’lum bir siqilgan hajm uchun «on-the-fly» kompilyatsiya qilinadi, bu esa parametrlarni (blok o‘lchamlari, kesh, CSGV operatsiyalari) kompilyatsiya vaqtidagi konstantalar sifatida uzatish imkonini beradi. Bu keraksiz kod yo‘llarini chiqarib tashlaydi va GPU registrlari samaradorligini oshiradi. Renderer bloklar keshi (brick cache) dan foydalanadi, u yerga ko‘rinadigan CSGV ma’lumotlari ochiladi. Keshni boshqarish oqimni (streaming) moslashtiradi va ko‘rinadigan bloklarni buferning bo‘sh kataklariga tayinlaydi (6a-rasm). Ikki bosqichli jarayon joriy etilgan: dekompressiya va tayinlashni ajratish, hamda «A-trous» filtri orqali shovqinni kamaytirish va upsampling.&lt;/p&gt;\n&lt;p&gt;Renderlash jarayoni: nurlar hajm bo‘ylab o‘tib, dekodlangan bloklarga murojaat qiladi yoki yangilarini ko‘rinadigan deb belgilaydi. Ko‘rinadigan belgilari bo‘lmagan bloklar o‘tkazib yuboriladi. So‘rov bosqichi (request) har bir blok uchun bitta oqimda bajarilib, yangi bloklar uchun so‘rovlar stekini shakllantiradi. Asosiy usullardan farqli o‘laroq, LOD (detallash darajasi) hisobi renderlash bosqichidan keyingi kadrning so‘rov bosqichiga o‘tkazilgan, bu esa kamera harakatlanganda kechikishlar va artefaktlarni yo‘qotadi. Ta’minlash bosqichi (provision) keshda joy borligini tekshiradi; xotira yetishmasa, buferdagi indeks atomik tarzda oshiriladi. Shundan so‘ng, tayinlash bosqichi (assign) bloklarni kataklarga biriktiradi, dekodlash bosqichi (decode) esa ularni ochadi. Barqaror rejimda renderlashdan tashqari bosqichlarning bajarilish vaqti 2 ms dan kam.&lt;/p&gt;\n&lt;h4 id=\"xotirani-boshqarish\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#xotirani-boshqarish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xotirani boshqarish&lt;/span&gt;&lt;/a&gt;Xotirani boshqarish&lt;/h4&gt;\n&lt;p&gt;Segmentatsiya hajmlari ko'pincha iste'molchi GPU'larining VRAM chegaralaridan oshib ketadi. Masalan, 2048³ hajmli 32-bitli belgilar 32 GiB xotirani egallaydi. Biz xotira sarfini kamaytirish uchun CSGV siqish va CPU'dan GPU'ga ma'lumotlarni oqimlashdan foydalanamiz. Bloklar (bricks) faqat so'rov bo'yicha keshga dekodlanadi. Renderlovchi kameradan uzoqlashgan sari pastroq LOD'dagi bloklarni so'raydi, bu har bir LOD darajasida kesh hajmini 8 barobar kamaytiradi. Shunga qaramay, VRAM sarfi yuqori bo'lib qoladi (Rasm A3c). Agar ma'lumotlar VRAM'ga sig'masa, kesh hajmi qisqartiriladi.&lt;/p&gt;\n&lt;h4 id=\"kodlash-buferlarini-optimallashtirish\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#kodlash-buferlarini-optimallashtirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kodlash buferlarini optimallashtirish&lt;/span&gt;&lt;/a&gt;Kodlash buferlarini optimallashtirish&lt;/h4&gt;\n&lt;p&gt;1–3% siqish nisbati bilan ko'pgina CSGV hajmlari VRAM'ga sig'adi. 32-bitli indekslash (16 GiB limit) va API cheklovlarini (4 GiB) chetlab o'tish uchun biz bloklarni bir nechta buferlarga taqsimlaymiz. &lt;span class=\"yfm-latex\" data-content=\"%5Ceta\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — maqsadli bufer hajmidan oshib ketadigan bloklar soni, indekslar esa &lt;span class=\"yfm-latex\" data-content=\"%5Clfloor%20bi%20%2F%20%5Ceta%20%5Crfloor\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; sifatida xaritalanadi. Vulkan buffer device address kengaytmasi GPU'ga bufer turidan qat'i nazar dekompressiya qilish imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kesh paletizatsiyasi — bu xotiradagi ma'lumotlarni siqish usuli bo'lib, unda to'liq qiymatlar o'rniga kichik jadval (palitra) indekslari saqlanadi, bu esa xotira sig'imini oshiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;CPU'dan GPU'ga oqimlash uchun eng detallangan LOD alohida saqlanadi (Rasm A3c), qo'polroq LOD'lar (xotiraning 32–55%, Rasm 5c) to'liq yuklanadi. Detallangan bloklar Detail Requests buferi orqali so'raladi. Asinxron konveyer ma'lumotlarni bir necha kadr davomida GPU buferiga ko'chiradi. Kesh paletizatsiyasi uchun biz &lt;span class=\"yfm-latex\" data-content=\"I%20%3D%20%5Clceil%20%5Clog_2(%2FP%2F_%7Bmax%7D)%20%5Crceil\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; bitdan foydalanib, har bir 32-bitli kesh yozuviga &lt;span class=\"yfm-latex\" data-content=\"%5Clfloor%2032%20%2F%20I%20%5Crfloor\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ta yozuvni joylashtiramiz (Rasm A2a).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-f5.jpg\" alt=\"5-rasm: a Vizualizatsiyalarni baholash uchun turli xususiyatlarga ega segmentlangan hajmlar to‘plamimiz.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm: a Vizualizatsiyalarni baholash uchun turli xususiyatlarga ega segmentlangan hajmlar to‘plamimiz.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-rasm: a Vizualizatsiyalarni baholash uchun turli xususiyatlarga ega segmentlangan hajmlar to‘plamimiz. Konnektom (CONN) tahlili asosiy dastur bo‘lsa-da, ko‘plab sohalar segmentlangan hajmlardan foydalanadi. b Bizning CSGV formatimiz segmentlangan hajmlarni blokli kodlashlar to‘plami sifatida siqadi. Har bir blok uni ko‘p o‘lchamli to‘r shaklida qayta tiklaydigan mustaqil operatsiyalar oqimi bilan kodlanadi. Kichik operatsiya kodlari tugunlarga o‘z yorlig‘ini qo‘shni yoki ota-ona to‘r tugunidan yoki blokning 32-bitli yorliqlar palitrasidan nusxalashni buyuradi. c Bu ma’lumotlar to‘plamlarining xotira sarfini sezilarli darajada kamaytiradi, o‘rtacha har bir voksel uchun 1 bitdan (bit/voksel) ancha kam joy talab qiladi. Volcanite buni to‘liq GPU asosidagi vizualizatsiya konveyeri uchun GPU VRAM’ida TB hajmdagi hajmlarni saqlash uchun ishlatadi. Eng yuqori detallar darajasini (LOD) kodlash CSGV’da renderlash vaqtida faqat talab bo‘yicha GPU’ga oqim sifatida uzatish uchun ajratilishi mumkin. Ushbu LOD detallarining nisbiy hajmi Detail% sifatida berilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"keshni-defragmantatsiya-qilish\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#keshni-defragmantatsiya-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Keshni defragmantatsiya qilish&lt;/span&gt;&lt;/a&gt;Keshni defragmantatsiya qilish&lt;/h4&gt;\n&lt;p&gt;Kesh hududlari ma'lum bir LOD'ga qat'iy bog'langan, bu esa fragmentatsiyaga olib kelishi mumkin. Kesh to'lib ketganda, biz uni to'liq tozalaymiz (Rasm 6a). LOD o'zgarganda, agar bo'sh joylar steki (1 048 576 blok sig'imi) to'la bo'lsa, biz hududni stekka qaytarmasdan LOD'ni majburiy almashtiramiz, bu esa keyingi defragmantatsiyagacha \"o'lik\" joy hosil qiladi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-f6.jpg\" alt=\"6-rasm: a Volcanite renderlash konveyeri.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-rasm: a Volcanite renderlash konveyeri.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;6-rasm: a Volcanite renderlash konveyeri. Har bir bosqich alohida shader jo‘natishidir. Blok keshini boshqarish bir necha bosqichga bo‘lingan (qarang: soya atlasi oqimi (52) va (60)): Request endi talab qilinmaydigan bloklarning kesh hududlarini bo‘sh LOD steklariga bo‘shatadi. Provision agar bo‘sh stek barcha blok so‘rovlarini bajarish uchun yetarli bo‘lmasa, kesh buferining orqa qismidan yangi elementlarni ajratadi. Assign yangi so‘ralgan bloklarni bo‘sh kesh hududlariga tayinlaydi, shundan so‘ng Decode ularni keshga dekompressiya qiladi. Render har bir piksel uchun bitta nur trassirovkasi oqimini bajaradi, ranglarni tuzish uchun keshdagi bloklarga kiradi va barcha ko‘rinadigan bloklarni so‘raydi. Resolve birlashtirilgan shovqinni kamaytirish va yuqori namuna olish uchun bizning A-trous filtrini qayta-qayta bajaradi. b 16 GiB GPU’da statsionar kamera bilan 927 GB (xom) Mouse L4 hajmini renderlash uchun kadr vaqtlari. Dastlabki dekompressiya talabi yuqori, chunki keshlar dastlab bo‘sh bo‘ladi. Keyingi kadrlar renderlash hisobiga ustunlik qiladi. c Soyalar bilan animatsiya (kamera Mouse L4 atrofida aylanadi va yaqinlashadi) uchun kadr vaqtlari. Keyingi kadrlar ma’lumotlarga yuqoriroq aniqlikda kiradi, bu esa qimmatroq dekompressiya va renderlashga olib keladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"brickrequestlimitation\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#brickrequestlimitation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Brickrequestlimitation&lt;/span&gt;&lt;/a&gt;Brickrequestlimitation&lt;/h4&gt;\n&lt;p&gt;Kesh xotirasi barcha kerakli bloklarni (bricks) talab qilingan detallik darajalarida (LOD) saqlay olishi shart. Agar kesh to‘lib qolsa, renderlash jarayonida muammolar yuzaga keladi. Biz buni &lt;a href=\"concepts/ogranichenie-zaprosov.html\"&gt;bloklar so‘rovini cheklash&lt;/a&gt; orqali hal qilamiz: renderlovchi faqat tasvirning ma’lum bir qismidagi piksellarga (A2c-rasmdagi yashil hudud) bloklarni so‘rashga ruxsat beradi. Bu kesh resurslarini kichikroq nur to‘plamiga jamlaydi. Ushbu hududdan tashqaridagi piksellar uchun kerak bo‘lgan bloklar keshdan chiqarib tashlanadi. Cheklov mexanizmi piksellardagi namunalar (samples) sonining minimal va maksimal qiymatlari o‘rtasidagi farq belgilangan chegaradan oshganda avtomatik ishga tushadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Bloklar so‘rovini cheklash — bu kesh xotirasini optimallashtirish usuli bo‘lib, u tizimga faqat eng muhim ma’lumotlarni yuklash imkonini beradi va xotira resurslarini tejaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;A7a-rasmda ko‘rsatilishicha, nur yo‘li chuqurligi (path depth) ortishi bilan bloklarga murojaatlar soni ham ko‘payadi. Birlamchi nurlar uchun (chuqurlik ≤ 1) ta’sir kam, ammo uzoq yo‘lli nurlar uchun tizim bitta namuna uchun butun blokni ochishni talab qilishi mumkin. Biz so‘rovlar uchun chuqurlik chegarasini sukut bo‘yicha 1 ga o‘rnatamiz. Agar dekodlanmagan blokga murojaat qilinsa, tizim eng qo‘pol LOD darajasidagi ma’lumotdan foydalanadi, bu esa bilvosita yoritishdagi xatolikni minimal darajada ushlab turadi.&lt;/p&gt;\n&lt;h4 id=\"randomnumbergeneration\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#randomnumbergeneration\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Randomnumbergeneration&lt;/span&gt;&lt;/a&gt;Randomnumbergeneration&lt;/h4&gt;\n&lt;p&gt;Renderlashda tasodifiy sonlar nurlarning yo‘nalishini va anti-aliasing uchun sub-piksel siljishlarini belgilaydi. Kesh bir kadr kechikish bilan ishlagani sababli (6a-rasm), har bir kadrda tasodifiy sonlarning o‘zgarishi hali dekodlanmagan bloklarga murojaatni keltirib chiqarishi mumkin. Buni oldini olish uchun biz har bir piksel oqimi uchun deterministik tasodifiy sonlar generatoridan foydalanamiz. U shu vaqtgacha to‘plangan namunalar soni bilan initsializatsiya qilinadi. Bu pikselning ma’lumotlar tayyor bo‘lgunga qadar aynan bir xil nur yo‘lini hisoblashini ta’minlaydi. Tizim qotib qolmasligi uchun har 256 kadrda holat o‘zgartiriladi. Initsializatsiya shovqinni optimallashtirish uchun 32x32 o‘lchamli \"blue noise\" patternga asoslanadi. Generator sifatida 2D PCG-xesh ishlatiladi. Piksel p uchun yakuniy initsializatsiya qiymati: PCG2D(blueNoise32×32(p), (28⌊f / 256⌋) ⊕ s), bu yerda ⊕ — bitli XOR amali.&lt;/p&gt;\n&lt;h4 id=\"renderlash-unumdorligini-tahlil-qilish\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#renderlash-unumdorligini-tahlil-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Renderlash unumdorligini tahlil qilish&lt;/span&gt;&lt;/a&gt;Renderlash unumdorligini tahlil qilish&lt;/h4&gt;\n&lt;p&gt;Vizualizatsiya usullarining samaradorligini baholash 14 ta turli xil datasetlar (Polyamid, Fabric, MouseBA, Cells, Battery, AZBA, H01BV, H01WM, Plant, Liconn, Fiber, MouseL4S, Fabricval va MouseL4) yordamida amalga oshirildi. Har bir obyekt uchun to‘rtta soya tushirish texnikasi: local, shadow, ao (ambient occlusion) va pt (path tracing) tahlil qilindi. Sinovlar statik kamera (static camera) va harakatlanuvchi kamera (moving camera) rejimlarida o‘tkazildi. Asosiy ko‘rsatkichlar sifatida kadrni renderlash vaqti (ms) va statistik qiymatlar (min, med, max) olindi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ambient Occlusion (AO) va Path Tracing (PT) — bu yorug‘likning geometriya bilan o‘zaro ta’sirini hisobga oluvchi global yoritish usullari bo‘lib, ular lokal soyalashga qaraganda ancha ko‘p hisoblash resurslarini talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Statik kamera uchun renderlash vaqti 1.2 ms (Battery, local) dan 238.64 ms (H01BV, pt) gacha o‘zgardi. Harakatlanuvchi kamera rejimida median vaqt ko‘rsatkichlari pastroq bo‘lsa-da, murakkab sahnalarda (masalan, H01BV) PT usuli bilan renderlash vaqti 174.72 ms gacha yetdi. Soya tushirish usullari o‘rtasidagi farq shuni ko‘rsatadiki, lokal soyalashdan PT ga o‘tish obyekt geometriyasining murakkabligiga qarab tizim yuklamasini 3–10 barobarga oshiradi.&lt;/p&gt;\n&lt;h4 id=\"keshlash-va-xotirani-optimallashtirish\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#keshlash-va-xotirani-optimallashtirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Keshlash va xotirani optimallashtirish&lt;/span&gt;&lt;/a&gt;Keshlash va xotirani optimallashtirish&lt;/h4&gt;\n&lt;p&gt;Bundan tashqari, keshdan foydalanish (Cache Paletting) va ma’lumotlarni qadoqlash (Packing Factor) samaradorligi baholandi. Keshlashdan foydalanish xotira hajmini (Cache Used [MB]) sezilarli darajada qisqartirish imkonini berdi. Masalan, Polyamid dataseti uchun kesh yoqilganda xotira hajmi 4134.7 MB dan 516.84 MB gacha kamaydi. Ma’lumotlarni qadoqlash koeffitsiyenti 1.68 (Battery) dan 20.5 (Fiber) gacha o‘zgardi. Piksel uchun namunalar soni (SPP) 1014 dan 1023 gacha diapazonda saqlandi, bu esa turli unumdorlik sozlamalarida tasvir sifatining barqarorligini ta’minlaydi.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 3.&lt;/strong&gt; Siqish koeffitsientini taqqoslash&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Kategoriya&lt;/th&gt;\n&lt;th&gt;Siqish koeffitsienti [%] (Stop-bitlarsiz)&lt;/th&gt;\n&lt;th&gt;Siqish koeffitsienti [%] (Stop-bitlar bilan)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Fabricval&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Battery&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 4.&lt;/strong&gt; Siqish koeffitsientini taqqoslash&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Kategoriya&lt;/th&gt;\n&lt;th&gt;Siqish koeffitsienti [%] (Stop-bitlarsiz)&lt;/th&gt;\n&lt;th&gt;Siqish koeffitsienti [%] (Stop-bitlar bilan)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;AZBA&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Plant&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 5.&lt;/strong&gt; Siqish koeffitsientini taqqoslash&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Kategoriya&lt;/th&gt;\n&lt;th&gt;Siqish koeffitsienti [%] (Stop-bitlarsiz)&lt;/th&gt;\n&lt;th&gt;Siqish koeffitsienti [%] (Stop-bitlar bilan)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;MouseL4S&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;MouseBA&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;strong&gt;Jadval S1.&lt;/strong&gt; Volcanite, VTK (C++ API) va Neuroglancer uchun dastlabki ishlov berish vaqtlari va diskdagi fayl hajmlari&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Ma'lumotlar to'plami&lt;/th&gt;\n&lt;th&gt;Siqish (s)&lt;/th&gt;\n&lt;th&gt;Fayl kiritish/chiqarish (s)&lt;/th&gt;\n&lt;th&gt;Jami kiritish/chiqarish bilan (s)&lt;/th&gt;\n&lt;th&gt;TTFF (s)&lt;/th&gt;\n&lt;th&gt;Hajmi (Direct) (GB)&lt;/th&gt;\n&lt;th&gt;Hajmi (gzip) (GB)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Volcanite&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt
