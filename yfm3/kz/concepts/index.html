            {"data":{"leading":false,"html":"&lt;p&gt;Шығарылымдардағы мақалалардан алынған ұғымдар: әрқайсысына жеке мақала — бұл не, зерттеушілер ол туралы қалай жазады, немен байланысты және қай жерде кездеседі.&lt;/p&gt;\n&lt;p&gt;147 ұғым.&lt;/p&gt;\n&lt;h2 id=\"mamandykh\"&gt;&lt;a href=\"concepts/index.html#mamandykh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мамандық&lt;/span&gt;&lt;/a&gt;Мамандық&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-mechanics.html\"&gt;Материалдар кедергісі және механика&lt;/a&gt; — Прочность, жёсткость, устойчивость: классические задачи и свежие решения — с формулами и эпюрами.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-geometry.html\"&gt;Сызба геометрия және графика&lt;/a&gt; — Проекции, поверхности, пересечения, развёртки — и то, как это живёт в CAD и вычислительной геометрии.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-concrete.html\"&gt;Бетон және байланыстырғыштар&lt;/a&gt; — Состав бетона и цемента: гидратация, добавки, долговечность, «зелёные» вяжущие.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-materials.html\"&gt;Материалтану&lt;/a&gt; — Сталь, композиты, дерево, полимеры, стекло: структура → свойства → применение.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-structures.html\"&gt;Конструкциялар және ғимараттар&lt;/a&gt; — Как стоят здания и мосты: железобетон, металл, дерево, кладка, фундаменты, сейсмика.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-fem.html\"&gt;Есептеу және модельдеу&lt;/a&gt; — Численные методы в инженерии: МКЭ, оптимизация, цифровые двойники.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-build.html\"&gt;Құрылыс технологиялары&lt;/a&gt; — Как строят сегодня: 3D-печать, модульность, BIM, роботы на площадке.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"process\"&gt;&lt;a href=\"concepts/index.html#process\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Процесс&lt;/span&gt;&lt;/a&gt;Процесс&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-axial.html\"&gt;Растяжение и сжатие&lt;/a&gt; — Осевые нагрузки, напряжения, закон Гука.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-bending.html\"&gt;Изгиб и балки&lt;/a&gt; — Эпюры моментов, прогибы, балки переменного сечения.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-torsion.html\"&gt;Кручение&lt;/a&gt; — Валы, тонкостенные профили, депланация.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-stability.html\"&gt;Устойчивость и потеря устойчивости&lt;/a&gt; — Продольный изгиб стержней, оболочек, панелей.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-fatigue_fracture.html\"&gt;Усталость и разрушение&lt;/a&gt; — Трещины, циклическая прочность, механика разрушения.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-plates_shells.html\"&gt;Пластины и оболочки&lt;/a&gt; — Тонкостенные конструкции, мембраны, купола.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-dynamics.html\"&gt;Колебания и динамика&lt;/a&gt; — Собственные частоты, демпфирование, удар.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-projections.html\"&gt;Проекции и виды&lt;/a&gt; — Ортогональные, аксонометрические и перспективные проекции.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-surfaces.html\"&gt;Поверхности и пересечения&lt;/a&gt; — Линии пересечения, линейчатые поверхности, коники.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-dg_algorithms.html\"&gt;Алгоритмы начерталки&lt;/a&gt; — Натуральная величина, метрические задачи как алгоритмы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-developables.html\"&gt;Развёртки, оригами, кириками&lt;/a&gt; — Развёртываемые поверхности, складчатые конструкции.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-cad_parametric.html\"&gt;CAD и параметрическое моделирование&lt;/a&gt; — Параметрика, NURBS, генеративный дизайн.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-comp_geometry.html\"&gt;Вычислительная геометрия&lt;/a&gt; — Сетки, триангуляции, разбиения, алгоритмы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-cement_chem.html\"&gt;Химия цемента и гидратация&lt;/a&gt; — Клинкер, C-S-H, тепловыделение, твердение.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-scm.html\"&gt;Минеральные добавки (SCM)&lt;/a&gt; — Зола-унос, шлак, метакаолин, стекло вместо части цемента.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-admixtures.html\"&gt;Химические добавки&lt;/a&gt; — Суперпластификаторы, ускорители, воздухововлекающие.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-uhpc.html\"&gt;Высокопрочный и фибробетон&lt;/a&gt; — UHPC, фибра, трещиностойкость.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-geopolymer.html\"&gt;Геополимеры и щелочные вяжущие&lt;/a&gt; — Бетон без портландцемента.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-durability.html\"&gt;Долговечность&lt;/a&gt; — Хлориды, карбонизация, ЩСР, морозостойкость.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-steels.html\"&gt;Стали и сплавы&lt;/a&gt; — Марки, термообработка, микроструктура.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-composites.html\"&gt;Композиты&lt;/a&gt; — Стекло- и углепластики, FRP-арматура.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-timber.html\"&gt;Дерево и клеёные материалы&lt;/a&gt; — CLT, клеёный брус, деревянные небоскрёбы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-polymers.html\"&gt;Полимеры&lt;/a&gt; — Пластики, эластомеры, герметики.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-ceramics_glass.html\"&gt;Керамика и стекло&lt;/a&gt; — Хрупкие материалы, остекление, огнеупоры.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-corrosion.html\"&gt;Коррозия&lt;/a&gt; — Ржавление арматуры, защита, ингибиторы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-rc_structures.html\"&gt;Железобетонные конструкции&lt;/a&gt; — Плиты, колонны, преднапряжение.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-steel_structures.html\"&gt;Металлические конструкции&lt;/a&gt; — Фермы, рамы, соединения.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-masonry.html\"&gt;Каменная кладка&lt;/a&gt; — Кирпич, камень, исторические здания.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-bridges.html\"&gt;Мосты&lt;/a&gt; — Пролёты, вантовые и арочные системы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-foundations.html\"&gt;Основания и фундаменты&lt;/a&gt; — Грунты, сваи, осадки.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-seismic.html\"&gt;Сейсмостойкость&lt;/a&gt; — Землетрясения, изоляция, демпферы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-fem_methods.html\"&gt;Метод конечных элементов&lt;/a&gt; — Сетки, элементы, сходимость.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-topopt.html\"&gt;Топологическая оптимизация&lt;/a&gt; — Форма, которую «находит» алгоритм.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-dem_particles.html\"&gt;Дискретные и частичные методы&lt;/a&gt; — DEM, SPH, моделирование гранулярных сред.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-digital_twin.html\"&gt;Цифровые двойники и мониторинг&lt;/a&gt; — Датчики на сооружениях, SHM.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-ml_surrogate.html\"&gt;Машинное обучение в расчётах&lt;/a&gt; — Суррогатные модели, PINN.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-printing_3d.html\"&gt;3D-печать в строительстве&lt;/a&gt; — Печать бетоном, межслойная прочность.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-prefab.html\"&gt;Сборное и модульное&lt;/a&gt; — Заводские модули, узлы, монтаж.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-bim.html\"&gt;BIM и цифровое проектирование&lt;/a&gt; — Информационная модель здания.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-robotics.html\"&gt;Роботы на стройке&lt;/a&gt; — Кирпичекладущие роботы, дроны, автоматизация.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-formwork.html\"&gt;Опалубка и твердение&lt;/a&gt; — Опалубка, прогрев, уход за бетоном.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"termin\"&gt;&lt;a href=\"concepts/index.html#termin\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Термин&lt;/span&gt;&lt;/a&gt;Термин&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/c-center.html\"&gt;C-центр&lt;/a&gt; — Кремнийдегі көміртегі мен оттегі атомдарынан тұратын кешен, L-диапазонындағы жалғыз фотон көзі ретінде қызмет етеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/csgv.html\"&gt;CSGV&lt;/a&gt; — Сегменттелген көлемдерді тиімді сақтау және оқу үшін қолданылатын шығынсыз деректерді сығу форматы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/odnotochechnye-raschety-dft.html\"&gt;DFT бір нүктелі есептеулері&lt;/a&gt; — Атомдардың координаттарын өзгертпестен, белгіленген конфигурация үшін энергия мен күштерді есептеу.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/yavnyy-metod-explicit-v-abaqus.html\"&gt;Explicit әдісі&lt;/a&gt; — Күрделі түйісу есептерінде есептеу тұрақтылығын сақтау үшін уақыт бойынша кезең-кезеңімен есептейтін алгоритм.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/flop.html\"&gt;FLOP&lt;/a&gt; — Өзгермелі нүктелі операция; WoQ (Weights-only Quantization) — тек модель салмақтарын кванттау.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/g-buffer.html\"&gt;G-Buffer&lt;/a&gt; — Әр пиксельдің геометриялық қасиеттерін (нормальдар, тереңдік, материалдар) сақтайтын аралық буфер, ол күрделі геометрияға қайта жүгінбей-ақ…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gaussian-predstavlenie.html\"&gt;Gaussian-көрінісі&lt;/a&gt; — 3D көріністі 3D-гауссиандар жиынтығы ретінде көрсету әдісі, олар рендеринг кезінде кескін жазықтығына проекцияланады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/general-matrix-vector-multiplication.html\"&gt;GEMV&lt;/a&gt; — Нейрожелілердің логикалық қорытындысының негізгі операциясы, жұмыста салмақтарды OFDM-ішкі тасымалдаушыларына кодтау және аналогтық оралу…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ihtc.html\"&gt;IHTC&lt;/a&gt; — Металдың қатаюы кезінде қалып пен құйма шекарасындағы жылу алмасу қарқындылығын сандық түрде сипаттайтын параметр.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/in-situ-resource-utilization.html\"&gt;ISRU&lt;/a&gt; — Тіршілікті қамтамасыз ету және құрылыс үшін жергілікті жерден тыс ресурстарды пайдалану тұжырымдамасы, бұл Жерден материалдарды жеткізуді…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/k2eff.html\"&gt;k²eff&lt;/a&gt; — Электр энергиясын акустикалық энергияға түрлендіру тиімділігін анықтайтын параметр; ол неғұрлым жоғары болса, сүзгінің өткізу жолағы…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/lift-off.html\"&gt;Lift-off әдісі&lt;/a&gt; — Металды резист қабатының үстіне жалатып, кейін резистті еріту арқылы артық металды алып тастау технологиясы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/level-of-detail.html\"&gt;LOD&lt;/a&gt; — Объектінің маңыздылығына қарай оның детальдау деңгейін өзгерту әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/piezoelectric-on-piezoelectric.html\"&gt;P3F&lt;/a&gt; — Қабаттар симметриясын инженерлік жолмен басқару арқылы материалды тым жұқартпастан қажетті акустикалық модтарды тиімді қоздыруға мүмкіндік…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/perplexity.html\"&gt;PPL&lt;/a&gt; — Тілдік модельдің сапа көрсеткіші; мән неғұрлым төмен болса, модель келесі токенді соғұрлым дәл болжайды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ray-marching.html\"&gt;Ray marching&lt;/a&gt; — Көлемді деректерді рендерингтеу әдісі, мұнда сәуле воксельдік тор бойымен өтіп, тығыздық немесе түс мәндерін жинақтайды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/svd.html\"&gt;SVD&lt;/a&gt; — Матрицаны оның ең маңызды компоненттерін бөліп алу үшін бөлшектеу әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/anizotropnoe-trenie.html\"&gt;Анизотропты үйкеліс&lt;/a&gt; — Тырнақ тәрізді ұштары бар тіректердің бір бағыттағы сырғу кедергісі екінші бағыттан жоғары болатын және бағытталған жорғалауды қамтамасыз…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/articulation.html\"&gt;Артикуляция&lt;/a&gt; — Физикалық модельдеу үшін еркіндік дәрежелері мен қозғалыс шектерін анықтайтын нысанның қозғалмалы қосылыстарының сипаттамасы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sqc.html\"&gt;Асқын өткізгіш кванттық схема&lt;/a&gt; — Параметрлік жиілікті түрлендіру және фотон-фонон шатасқан жұптарын генерациялау үшін сызықтық емес элемент ретінде қолданылатын құрылғы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ald.html\"&gt;Атомдық-қабаттық тұндыру&lt;/a&gt; — Беткі қабатта өте жұқа және біркелкі пленкаларды қалыптастыруға мүмкіндік беретін жоғары технологиялық әдіс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/biomimeticheskiy-robot.html\"&gt;Биомиметикалық робот&lt;/a&gt; — Құрылымы мен қозғалыс принциптері биологиялық прототиптерге (жәндіктер, құстар) еліктейтін құрылғы, бұл шағын масштабта жоғары энергия…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/bioinspiratsiya.html\"&gt;Биошабыттану&lt;/a&gt; — Роботтардың тиімділігін арттыру үшін биологиялық жүйелерден конструктивтік шешімдер мен басқару принциптері алынатын инженерлік тәсіл.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/voxel.html\"&gt;Воксель&lt;/a&gt; — Сегменттелген деректерде нысан белгісі тағайындалатын көлемдік кескін элементі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/raznost-chastot.html\"&gt;Жиіліктер айырмашылығы&lt;/a&gt; — Тербелмелі жүйенің резонанстан ауытқуын сипаттайтын параметр, бұл объектінің сұйықтықтағы тұрақтылығын түсіну үшін өте маңызды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/quantization.html\"&gt;Кванттау&lt;/a&gt; — Модель параметрлерінің дәлдігін төмендету арқылы оның жадтағы көлемін азайту әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/obratnye-ssylki.html\"&gt;Кері сілтемелер&lt;/a&gt; — Деректер ағынындағы қайталанатын мәндерді алдыңғы орындарға сілтеме жасау арқылы алмастыру әдісі, бұл жадты үнемдеуге көмектеседі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kinematika-kirigami.html\"&gt;Киригами кинематикасы&lt;/a&gt; — Тегіс парақтардан дәл кесу және бүгу арқылы күрделі 3D құрылымдарды жасау әдісі, бұл артық бөлшектерсіз геометрияны өзгертуге мүмкіндік…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/visibility.html\"&gt;Контраст&lt;/a&gt; — Корреляциялық сигналдың шуыл фонынан қаншалықты анық бөлініп тұратынын көрсететін параметр.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/paletizatsiya-kesha.html\"&gt;Кэш палетизациясы&lt;/a&gt; — Жадтағы деректерді сығу әдісі, мұнда толық мәндердің орнына шағын кесте (палитра) индекстері сақталады, бұл жад сыйымдылығын арттырады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cache-deadlock.html\"&gt;Кэштің құлыптануы&lt;/a&gt; — Кэш жады үнемі талап етілетін деректермен толып қалып, жаңа деректер үшін орын қалмауы жағдайы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/metod-lamberta.html\"&gt;Ламберт моделі&lt;/a&gt; — Беттің жарықтылығы бақылау бұрышына байланысты емес, жарық барлық бағытта біркелкі таралатын жарықтандыру моделі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/membrannye-usiliya.html\"&gt;Мембраналық күштер&lt;/a&gt; — Қабықша жазықтығында әсер ететін ішкі күштер, олар құрылымның иілусіз жұмыс істеуін қамтамасыз етеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/lite-v-zamorozhennye-formy.html\"&gt;Мұздатылған қалыпқа құю&lt;/a&gt; — Ылғалдың қатуы арқылы қажетті беріктікке жету үшін құм қалыбы төмен температурада мұздатылатын құю технологиясы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/faktor-parsella.html\"&gt;Парселл эффектісі&lt;/a&gt; — Резонатордың кванттық нысанның сәулелену жылдамдығын бос кеңістікке қарағанда қанша есе арттыратынын көрсететін көрсеткіш.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/floating-floor.html\"&gt;плавающий пол&lt;/a&gt; — Температуралық деформациялардың ғимараттың жүк көтергіш элементтеріне берілуін болдырмайтын еден материалын төсеудің конструктивті шешімі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ladder-type-filter.html\"&gt;Сатылы сүзгі&lt;/a&gt; — Акустикалық резонаторлар негізіндегі радиожиілікті сүзгі құрылымы, оның LiNbO3 негізіндегі прототиптері 18,6% салыстырмалы өткізу жолағын…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/segmentatsiya.html\"&gt;Сегментация&lt;/a&gt; — Сандық кескінді әрбір элемент (воксель) белгілі бір объектіге жатады деп жіктелетін аймақтарға бөлу процесі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ogranichenie-zaprosov.html\"&gt;Сұраныстарды шектеу&lt;/a&gt; — Жад ресурстарын оңтайландыру әдісі, ол жүйеге тек ағымдағы кадр үшін маңызды деректерді кэште ұстауға мүмкіндік береді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ray-tracing.html\"&gt;Сәулелерді қадағалау&lt;/a&gt; — Радиотолқындардың таралуын модельдеу әдісі, ол шағылысулар мен кедергілерді ескере отырып, нақты байланыс жағдайларын жоғары дәлдікпен…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/funktsiya-peredachi.html\"&gt;Тасымалдау функциясы&lt;/a&gt; — Сандық деректерді визуалды сипаттамаларға (түс, мөлдірлік) айналдыратын математикалық ереже, ол көлем ішіндегі қажетті құрылымдарды бөліп…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/topologicheskoe-zatseplenie.html\"&gt;Топологиялық ілінісу&lt;/a&gt; — Құрылыс элементтерін қосу принципі, онда олар тек өз геометриясы мен өзара орналасуының арқасында бірге ұсталады, бұл бекіткіштерге деген…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/meshi.html\"&gt;Тор&lt;/a&gt; — Нысан бетін үшбұрыштар торы ретінде жақындату болып табылады, файл көлемін азайту үшін жеңілдетуді талап етеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/chetyrehzvennyy-mehanizm.html\"&gt;Төрт буынды механизм&lt;/a&gt; — Сызықтық қозғалысты айналмалы қозғалысқа айналдырып беретін кинематикалық тізбек.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ghost-imaging.html\"&gt;Фантомды визуализация&lt;/a&gt; — Объектімен өзара әрекеттеспейтін тірек сәуле мен зондтаушы сәуле арасындағы корреляциялық өлшеулер арқылы объектінің кеңістіктік құрылымын…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fotonnyy-kristall.html\"&gt;Фотондық кристал&lt;/a&gt; — Жарықты басқаруға және оны резонатор ішінде ұстап тұруға мүмкіндік беретін периодты наноқұрылым.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/funktsionalnaya-rekursiya.html\"&gt;Функционалдық рекурсия&lt;/a&gt; — Әртүрлі механикалық тапсырмаларды орындау үшін бір ғана қайта конфигурацияланатын механикалық құрылымды қайта тағайындау стратегиясы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/elektrosmachivanie.html\"&gt;Электро-сулану&lt;/a&gt; — Робот тіректеріне кернеу берілгенде пайда болатын және бату үшін судың беттік керілуін бұзатын құбылыс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/koeffitsient-elektromehanicheskoy-svyazi.html\"&gt;Электромеханикалық байланыс коэффициенті&lt;/a&gt; — Пьезоэлектрлік резонаторларда электр энергиясын механикалық энергияға түрлендіру тиімділігінің параметрі, екі қабатты құрылымда 6 ГГц…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fundamentalnaya-oblast.html\"&gt;Іргелі аймақ&lt;/a&gt; — Жазықтықты ешқандай бос орынсыз толық жабатын минималды геометриялық элемент.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"aedis\"&gt;&lt;a href=\"concepts/index.html#aedis\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдіс&lt;/span&gt;&lt;/a&gt;Әдіс&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/3d-gaussian-splatting.html\"&gt;3D Gaussian Splatting&lt;/a&gt; — Тереңдік бойынша сұрыптауды және реттелген альфа-араластыруды қолдана отырып, Гаусс примитивтерін растрлеу арқылы нақты уақытта жаңа…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/air-llm.html\"&gt;AIR-LLM&lt;/a&gt; — Есептеулерді жадтан радиожиілік доменіне көшіретін және РЖ-араластырғыштарда аналогтық көбейтуді орындайтын үлкен тілдік модельдердің…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rgb-d-scanning.html\"&gt;RGB-D сканирование&lt;/a&gt; — Түсті кескін мен тереңдік туралы ақпаратты қамтитын бөлме геометриясы мен нысандар туралы деректерді алу әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/smooth-overlap-of-atomic-positions.html\"&gt;SOAP&lt;/a&gt; — C-S-H деректер жиынтығының құрылымдық әртүрлілігі мен конфигурациялық кеңістігін талдау үшін қолданылатын дескрипторлар әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/asynchronous-logic-networks.html\"&gt;Асинхронные логические сети&lt;/a&gt; — Сыртқы тактілік сигналсыз жұмыс істейтін логикалық элементтер архитектурасы, мұнда динамика транзисторлардың физикалық кідірістерімен…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gaussian-stippling.html\"&gt;гауссов пунктир&lt;/a&gt; — Примитивтерді тереңдігі бойынша сұрыптау қажеттілігін жою үшін реттелген альфа-араластыруды көрінудің стохастикалық іріктеуімен…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hexagonal-lattice.html\"&gt;Гексагональная решетка&lt;/a&gt; — Стационарлық күйлерді жоққа шығаратын және хаотикалық ауысулардың үздіксіз генерациясына кепілдік беретін логикалық элементтердің орналасу…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/finite-element-method.html\"&gt;Метод конечных элементов&lt;/a&gt; — Деформацияланатын қатты дене механикасы есептерін шешудің сандық әдісі, модульдік конструкциялардың кернеу-деформациялық күйін және…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/drucker-prager-model.html\"&gt;Модель Друкера-Прагера&lt;/a&gt; — Ішкі үйкелісі бар материалдардың мінез-құлқын сипаттайтын және аққыштық шегінің гидростатикалық қысымға тәуелділігін ескеретін…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spatiotemporal-neural-reconstruction.html\"&gt;нейросетевая пространственно-временная реконструкция&lt;/a&gt; — Стохастикалық шуды басу үшін ағымдағы белгілер мен өткен кадрлардың тарихи деректерін біріктіретін U-Net және MLP архитектурасына…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pushover-analysis.html\"&gt;нелинейный статический анализ&lt;/a&gt; — Нәтижелері бойынша конструкцияның пайдалануға жарамдылық деңгейі анықталатын есептік бағалау әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/primitive-based-sampling-stream.html\"&gt;примитивный поток&lt;/a&gt; — Пуассон процесі және Бокс-Мюллер түрлендіруі арқылы нүктелерді жасауды жүзеге асыратын кіші ауданды гауссиандарға арналған стохастикалық…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mimo-spatial-multiplexing.html\"&gt;пространственное мультиплексирование MIMO&lt;/a&gt; — Эфир уақытын қысқарту үшін бір мезгілде бірнеше салмақ ағындарын тарататын көп антенналы технология.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/density-functional-theory.html\"&gt;Теория функционала плотности&lt;/a&gt; — Деректерді белгілеу және атомдық конфигурацияларды оңтайландыру үшін жұмыста қолданылатын электрондық құрылымды есептеудің…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/t6-heat-treatment.html\"&gt;термообработка T6&lt;/a&gt; — Қорытпаның созылу беріктігі шегін арттыру үшін қолданылатын құймаларды термиялық өңдеу режимі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/path-tracing.html\"&gt;Трассировка путей&lt;/a&gt; — Визуализация дәлдігі мен құрылымдарды кеңістіктік қабылдауды қамтамасыз ететін жаһандық жарықтандыру әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fragment-based-sampling-stream.html\"&gt;фрагментный поток&lt;/a&gt; — Проекциялық ауданы үлкен гауссиандар кесіп тастау шегін ескере отырып, растрлеу арқылы өңделетін стохастикалық іріктеу ағыны.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"zat\"&gt;&lt;a href=\"concepts/index.html#zat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зат&lt;/span&gt;&lt;/a&gt;Зат&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/calcium-silicate-hydrate.html\"&gt;Гидросиликат кальция&lt;/a&gt; — Цемент гидратациясының негізгі өнімі, цемент тасының беріктігі мен төзімділігін анықтайтын нанокристалды гель.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/zl205a-alloy.html\"&gt;сплав ZL205A&lt;/a&gt; — Газды кеуектілікке және шөгу ақауларына бейім, кең кристалдану аралығы бар құймалы алюминий-мыс қорытпасы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"material\"&gt;&lt;a href=\"concepts/index.html#material\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Материал&lt;/span&gt;&lt;/a&gt;Материал&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/silicon-on-insulator.html\"&gt;Кремний на изоляторе&lt;/a&gt; — Нанофотоникалық құрылғыларды жасау үшін платформа ретінде қолданылатын диэлектрлік негіздегі кремний қабатынан тұратын құрылым.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/lithium-niobate.html\"&gt;Ниобат лития&lt;/a&gt; — Литий ниобаты (LiNbO₃) — электромеханикалық байланыс коэффициенті жоғары пьезоэлектрлік материал. Ол беттік акустикалық толқындарды…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/high-density-recycled-polyurethane.html\"&gt;переработанный полиуретан высокой плотности&lt;/a&gt; — Ғимараттың салмағын азайту, сейсмикалық төзімділікті және еденнің жылу оқшаулауын арттыру мақсатында цемент төсемін ауыстыру үшін…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sintered-regolith.html\"&gt;Спеченный реголит&lt;/a&gt; — Негізгі құрылыс ресурсы ретінде пайдаланылатын жергілікті ай материалы, физикалық-механикалық қасиеттері бойынша кеуекті керамикаға жақын.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/shape-memory-alloy.html\"&gt;сплав с памятью формы&lt;/a&gt; — Микророботтың көтергіш жақтауының термиялық жиырылуын иілу деформациясына айналдыратын сым тәрізді жасанды бұлшықеттер материалы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cement-screed.html\"&gt;цементная стяжка&lt;/a&gt; — Жер сілкінісі кезінде инерциялық күштерді арттыратын қосымша балласт пен паразиттік салмақ тудыратын жоғары тығыздықтағы дәстүрлі еден…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"khural\"&gt;&lt;a href=\"concepts/index.html#khural\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Құрал&lt;/span&gt;&lt;/a&gt;Құрал&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/csh-mlp.html\"&gt;CSH-MLP&lt;/a&gt; — Кальций силикат гидратының атомдық құрылымдарын кванттық-механикалық есептеулер дәлдігімен модельдеу үшін қолданылатын машиналық оқыту…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/h-shaped-frame.html\"&gt;H-образная рама&lt;/a&gt; — Ұшуды басқару, жерде жорғалау және орталар арасында ауысу үшін пішін жады бар қорытпа бұлшықеттерімен қозғалысқа келтірілетін роботтың…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/interdigital-transducer.html\"&gt;IDT&lt;/a&gt; — Беттік акустикалық толқындарды генерациялау және тіркеу үшін пьезоэлектрлік субстраттарға жалатылатын компонент.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mujoco.html\"&gt;MuJoCo&lt;/a&gt; — Жүйе жасаған сахналардың дайындығын тексеру және модельдеу үшін қолданылатын физикалық модельдеу ортасы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/room-py.html\"&gt;Room.py&lt;/a&gt; — Симуляторлар үшін геометрияны, нысандардың артикуляциясын және кеңістіктің физикалық қасиеттерін сипаттайтын орындалатын файл.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/volcanite.html\"&gt;Volcanite&lt;/a&gt; — Қарапайым жабдықта тығыз сегменттелген деректерді тікелей рендерингтеуге арналған ашық бастапқы коды бар жүйе.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vulkan.html\"&gt;Vulkan&lt;/a&gt; — GPU-да рендеринг пен деректерді декомпрессиялауды аппараттық жеделдету үшін қолданылатын графикалық бэкенд.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/layout-agent.html\"&gt;Агент планировки&lt;/a&gt; — Нысандарды анықтаудағы геометриялық қателерді түзететін және сахна элементтері арасындағы байланыстарды орнататын жүйе құрамдасы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hybrid-renderer.html\"&gt;гибридный рендерер&lt;/a&gt; — Гауссиандарды бұлдырлығы мен проективті ауданына қарай фрагменттік және примитивтік іріктеу ағындары арасында бейімді түрде бөлетін…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kirigami-supports.html\"&gt;киригами-опоры&lt;/a&gt; — Сулануды басқаратын және роботты мениск арқылы суда ұстап тұратын, саңылаулары реттелетін микроробот аяқтарының көпқабатты құрылымдары.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/bulk-acoustic-wave-resonator.html\"&gt;объемный акустический резонатор&lt;/a&gt; — Резонанстық жиілігі қабықшаның қалыңдығымен анықталатын акустикалық құрылғы; радиожиілік сигналдарын кең жолақты сүзу үшін қолданылады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/wire-bonding-junctions.html\"&gt;Проволочные соединительные узлы&lt;/a&gt; — Актуатор сегменттерін жергілікті белсендіруге және қысқаруларды кеңістіктік бағдарламалауға мүмкіндік беретін конструкциялық элементтер.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rf-mixer.html\"&gt;радиочастотный смеситель&lt;/a&gt; — Кіріс сигналдарын уақыт аймағында көбейтетін аналогтық есептеу түйіні, бұл жиілік аймағындағы сызықтық оралуға баламалы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/photonic-crystal-resonator.html\"&gt;Фотонно-кристаллический резонатор&lt;/a&gt; — Жарықтың сыну көрсеткіші периодты түрде өзгеретін құрылымда жарықты локализациялау арқылы сәулеленуді резонанстық күшейтетін…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"khubylys\"&gt;&lt;a href=\"concepts/index.html#khubylys\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Құбылыс&lt;/span&gt;&lt;/a&gt;Құбылыс&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/second-thickness-shear-mode.html\"&gt;мода сдвига по толщине SH2&lt;/a&gt; — Қабаттардың кристаллографиялық осьтерін бұру және конструктивті интерференция есебінен екі қабатты резонаторда селективті түрде…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/distributed-boolean-chaos.html\"&gt;Распределенный булев хаос&lt;/a&gt; — Бір чипте мыңдаған тәуелсіз энтропия көздерін құру арқылы кездейсоқ сандарды генерациялау үшін қолданылатын физикалық құбылыс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/purcell-effect.html\"&gt;Эффект Парселла&lt;/a&gt; — Кванттық эмитентті кіші модалық көлемді оптикалық резонаторға орналастыру арқылы спонтанды сәулеленуді жеделдету физикалық құбылысы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"metrika\"&gt;&lt;a href=\"concepts/index.html#metrika\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Метрика&lt;/span&gt;&lt;/a&gt;Метрика&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/second-order-autocorrelation-function.html\"&gt;Автокорреляционная функция второго порядка&lt;/a&gt; — Жарық көзінің кванттық табиғатын растау үшін қолданылатын метрика; g^(2)(0) &amp;lt; 0,5 мәні эмитенттің жалғыз ақау екенін дәлелдейді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/inter-story-drift.html\"&gt;межэтажные перекосы&lt;/a&gt; — Цемент төсемінің орнына жеңіл полиуретанды қолданған кезде азаятын ғимарат қаңқасының деформациялық параметрі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ca-si-ratio.html\"&gt;Отношение Ca/Si&lt;/a&gt; — Кальций силикат гидратының механикалық қасиеттері мен құрылымдық эволюциясын анықтайтын стехиометриялық құрам параметрі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/robot-workspace.html\"&gt;Рабочая зона робота&lt;/a&gt; — Жұмсақ роботтың маневр жасауына қолжетімді кеңістік көлемінің көрсеткіші, конструкцияның тиімділігін бағалау үшін қолданылады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/base-shear.html\"&gt;сдвигающая сила в основании&lt;/a&gt; — Еден массасы азайған кезде төмендейтін, ғимарат негізіндегі сейсмикалық күштік сипаттама.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/entropy-generation-rate.html\"&gt;Скорость генерации энтропии&lt;/a&gt; — Жүйенің өнімділік көрсеткіші, уақыт бірлігінде генерацияланатын хаотикалық деректер көлемін көрсетеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/bonding-angle.html\"&gt;угол склейки&lt;/a&gt; — Екі пьезоэлектрлік қабат арасындағы өзара бағдарлану бұрышы, пьезоэлектрлік коэффициенттердің таңбаларын және паразит модаларды басуды…&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Шығарылымдардағы мақалалардан алынған ұғымдар: әрқайсысына жеке мақала — бұл не, зерттеушілер ол туралы қалай жазады, немен байланысты және қай жерде кездеседі."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Ұғымдар","description":"Шығарылымдардағы мақалалардан алынған ұғымдар: әрқайсысына жеке мақала — бұл не, зерттеушілер ол туралы қалай жазады, немен байланысты және қай жерде кездеседі.","vcsPath":"concepts/index.md"},"headings":[{"title":"Мамандық","href":"concepts/index.html#mamandykh","level":2},{"title":"Процесс","href":"concepts/index.html#process","level":2},{"title":"Термин","href":"concepts/index.html#termin","level":2},{"title":"Әдіс","href":"concepts/index.html#aedis","level":2},{"title":"Зат","href":"concepts/index.html#zat","level":2},{"title":"Материал","href":"concepts/index.html#material","level":2},{"title":"Құрал","href":"concepts/index.html#khural","level":2},{"title":"Құбылыс","href":"concepts/index.html#khubylys","level":2},{"title":"Метрика","href":"concepts/index.html#metrika","level":2}],"title":"Ұғымдар"},"router":{"pathname":"concepts/index","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
