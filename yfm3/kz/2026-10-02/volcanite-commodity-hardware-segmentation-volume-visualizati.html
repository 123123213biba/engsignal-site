            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"276\" cy=\"116\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"584\" cy=\"168\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · CAD_PARAMETRIC   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Volcanite:&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;суперкомпьютерлерсіз&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;терабайттық деректерді&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;визуализациялау&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-f1.jpg\" alt=\"1-сурет: Визуалды аннотация. a Біздің интерактивті Volcanite қосымшамыз заманауи жоғалтусыз сығу әдістерін қолдана отыры\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: Визуалды аннотация. a Біздің интерактивті &lt;a href=\"concepts/volcanite.html\"&gt;Volcanite&lt;/a&gt; қосымшамыз заманауи жоғалтусыз сығу әдістерін қолдана отырып, қарапайым жабдықта үлкен сегменттелген көлемдерді визуалды зерттеуге мүмкіндік береді. b Біздің графикалық процессор (GPU) негізіндегі…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет: Визуалды аннотация. a Біздің интерактивті Volcanite қосымшамыз заманауи жоғалтусыз сығу әдістерін қолдана отырып, қарапайым жабдықта үлкен сегменттелген көлемдерді визуалды зерттеуге мүмкіндік береді. b Біздің графикалық процессор (GPU) негізіндегі рендеринг конвейеріміз көрінетін көлем аймақтарын жылдам қол жеткізу үшін кэшке декомпрессиялайды. Бұл конвейер әртүрлі рендеринг конфигурацияларын, тіпті жеке вокселдерді зерттеуге дейін (оң жақта) интерактивті түрде зерттеуге мүмкіндік береді. c Рендеринг әр кадр үшін миллисекундтармен өлшенетін интерактивті процесс. Алғашқы кадрларда декомпрессия жүктемесі жоғары болады, бірақ ол тез жоғалады. d Volcanite көмегімен біз 2,2 ТБ көлеміндегі H01 адам миының ақ затының &lt;a href=\"concepts/segmentatsiya.html\"&gt;сегментация&lt;/a&gt; көлемін Full-HD сәулелік трассировкамен секундына 66 кадр жылдамдығымен, басқа әдістерге қарағанда әлдеқайда жылдам бірінші кадр уақытымен қарапайым жабдықта интерактивті түрде зерттей аламыз. Neuroglancer-де визуализация үшін дәл емес торларды жасау бір аптадан астам уақытты алады, ал біздің алдын ала өңдеу жүйеміз екі сағаттан аз уақыт ішінде әлдеқайда кішірек және жоғалтусыз кодтауларды жасайды. e Volcanite-дегі көлеңке режимдерін жылдам жергілікті көлеңкелеуден жоғары сапалы сәулелік трассировкаға жедел кері байланыспен ауыстыруға болады.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Заманауи томография мен коннектомика көлеміне байланысты өңдеу қиын терабайттық деректерді тудырады. Қолданыстағы әдістер жеңілдетілген торларға немесе бөлінген жүйелерге сүйенеді, бұл маңызды бөлшектерді жасырады. Volcanite &lt;a href=\"concepts/vulkan.html\"&gt;Vulkan&lt;/a&gt; көмегімен воксельдерді тікелей рендерингтеуді ұсынады, бұл алдын ала дайындықсыз жоғары дәлдікті қамтамасыз етеді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Қарапайым ДК-де 100 FPS жылдамдықта 500 млрд воксельді рендерингтеу.&lt;/li&gt;\n&lt;li&gt;Күрделі 3D-торларсыз тікелей визуализациялау.&lt;/li&gt;\n&lt;li&gt;Дәл талдау үшін жаһандық жарықтандыру мен көлеңкелерді қолдау.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Volcanite жүйесі деректерді тиімді сақтау үшін CSGV (&lt;a href=\"concepts/csgv.html\"&gt;Fast Compressed Segmentation Volumes&lt;/a&gt;) пішімін пайдаланады, бұл оларды секундына гигабайт жылдамдықпен оқуға мүмкіндік береді. Рендеринг Vulkan GPU-бэкенді арқылы жүзеге асырылады, мұнда деректер сұраныс бойынша бейне жад кэшіне декомпрессияланады. Бұл микроскопиядағы қабаттарды тігудегі қателіктер сияқты маңызды ақауларды жасыратын аралық 3D-торларды құру қажеттілігін жояды.&lt;/p&gt;\n&lt;p&gt;H01 деректер жиынтығында (2,2 ТБ көлеміндегі ми қыртысының бөлігі) жүйе трассировканы пайдалана отырып, секундына 66 кадр жылдамдыққа жетті. 32 белгімен шектелген және таңдау кезінде артефактілері бар VTK-дан айырмашылығы, Volcanite миллиондаған белгілерді және жаһандық жарықтандыруды қолдайды. Деректерді алдын ала өңдеу екі сағаттан аз уақытты алады, бұл Neuroglancer-де бір аптаға дейін созылатын &lt;a href=\"concepts/meshi.html\"&gt;тор&lt;/a&gt; құру процесінен әлдеқайда жылдам.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Өнімділік дискіні оқу жылдамдығына байланысты және алғашқы кадрлар декомпрессия кэшін толтыру үшін уақытты қажет етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Заманауи бейнелеу әдістері әр воксельге объект белгісі тағайындалған терабайттық сегментация көлемдерін жасайды. Олардың үлкен көлемі зерттеушілерді кесінділер бойынша талдау немесе жуықталған торлар (meshes) құруға мәжбүр етеді, бұл кеңістіктік контекстті жоғалтады. Скалярлық көлемдерді рендерингтеудің дәстүрлі әдістері сегментация үшін жарамсыз, өйткені олар шекараларды дәл сақтауды және категориялық мәндермен жұмыс істеуді талап етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сегментация — бұл сандық кескінді әрбір элемент (&lt;a href=\"concepts/voxel.html\"&gt;воксель&lt;/a&gt;) белгілі бір объектіге жатады деп жіктелетін аймақтарға бөлу процесі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Volcanite — бұл қарапайым компьютерлік жабдықта үлкен көлемдегі сегментация деректерін тікелей рендерингтеуге арналған ашық бастапқы кодты жүйе. Жүйе сығымдауды ескере отырып деректерді өңдеуді, Vulkan GPU backend-ін және сегментацияға арналған рендеринг әдістерін біріктіреді. Бұл стандартты жұмыс үстелі компьютерінде 100 кадр/секунд жылдамдықпен 0,5 триллионға дейін воксельді визуализациялауға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Volcanite тор құрмастан (meshing) терабайттық көлемдерді интерактивті рендерингтеуді қамтамасыз етеді, воксель дәлдігін сақтайды және жаһандық жарықтандыру эффектілерін қосады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жүйе алдын ала сегменттелген деректермен жұмыс істеуге арналған және бастапқы өңдеу кезеңдерін алмастырмайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Негізгі жетістіктер қатарына деректерді дайындаудың ұзақ кезеңдерінен бас тарту және құпия деректермен жергілікті жұмыс істеу мүмкіндігі кіреді. Жоба ғалымдарға гипотезаларды тексеру үшін «теравоксельдік» белгілер өрістерін интерактивті дәлелдерге айналдыратын құралды ұсынады.&lt;/p&gt;\n&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;p&gt;Сегменттелген көлемдер бұл әрбір элементке (воксельге) нысан немесе дана белгісі тағайындалған 3D-торлар: V: N³ → N. Бұл үзіліссіз аймақтар кеңістікті, мысалы, коннектомдағы жеке нейрондарға бөледі. Біз Volcanite — сегменттелген көлемдерді рендерингтеу құралын ұсынамыз.&lt;/p&gt;\n&lt;h4 id=\"segmenttelgen-koelemderdi-renderingteuding-zhanga-integraciyalanghan-ortasy\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#segmenttelgen-koelemderdi-renderingteuding-zhanga-integraciyalanghan-ortasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сегменттелген көлемдерді рендерингтеудің жаңа интеграцияланған ортасы&lt;/span&gt;&lt;/a&gt;Сегменттелген көлемдерді рендерингтеудің жаңа интеграцияланған ортасы&lt;/h4&gt;\n&lt;p&gt;1-суретте Volcanite көмегімен визуализация процесі көрсетілген. Жүйе көлемді Fast Compressed Segmentation Volumes (CSGV) форматына сығады, бұл қазіргі таңда жоғалтусыз сығудың ең тиімді әдісі. Сығу жылдамдығы дискіден деректерді оқуға байланысты (A1-кесте), кодтау өткізу қабілеті секундына гигабайттарды құрайды. Визуализация процесі толығымен GPU негізінде жұмыс істейді (1b-сурет). CSGV деректері бейне жадында (VRAM) сақталады және көрінетін аймақтар сұраныс бойынша кэшке ашылады. Volcanite графикалық қосымшасы (1a-сурет) деректерді миллисекундтық кадр жиілігінде интерактивті зерттеуге мүмкіндік береді (1c-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Volcanite VRAM-да деректерді сақтау және CSGV форматын пайдалану арқылы сегменттелген көлемдерді жоғалтусыз және интерактивті рендерингтеуді қамтамасыз етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Үлкен көлемдерді тек 2D-кесінділер немесе жеңілдетілген 3D-торлар түрінде көрсететін басқа құралдардан айырмашылығы, Volcanite деректерді әрбір воксельге қол жеткізу мүмкіндігін сақтай отырып рендерингтейді. Жоғары сапалы рендеринг интерактивті режимде немесе пәрмен жолы интерфейсі (CLI) арқылы жүзеге асырылады. A1-видео Mouse L4 көлемінің офлайн рендерін, ал A2-видео Cells деректер жиынын интерактивті зерттеуді көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"segmenttelgen-koelemderdi-renderingteu-arkhyly-ghylymi-tuesinikter\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#segmenttelgen-koelemderdi-renderingteu-arkhyly-ghylymi-tuesinikter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сегменттелген көлемдерді рендерингтеу арқылы ғылыми түсініктер&lt;/span&gt;&lt;/a&gt;Сегменттелген көлемдерді рендерингтеу арқылы ғылыми түсініктер&lt;/h4&gt;\n&lt;p&gt;2d-суретте тышқан миындағы қан тамырларының 3D-рендері көрсетілген. Volcanite 2D-микроскопиялық кесінділерді тігудегі қателерді анықтауда маңызды рөл атқарды. Воксель дәлдігінің арқасында кез келген сәйкессіздік тамырлардағы айқын үзілістер ретінде көрінеді. Neuroglancer-де бұл қателер торларды (mesh) жеңілдету (Igneous параметрлері) салдарынан азырақ байқалады, бұл детальдарды тегістейді және тіпті ұсақ қателерді толығымен жоюы мүмкін. Volcanite 163 ГБ дейінгі деректер жиынымен жұмыс істеуге қабілетті, ал ParaView сияқты аналогтар мұндай ауқымда жұмыс істей алмайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тор (mesh) — бұл нысан бетін үшбұрыштар торы ретінде жақындату болып табылады, файл көлемін азайту үшін жеңілдетуді талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"segmenttelgen-koelemderge-arnalghan-tiimdi-materialdar-redaktory\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#segmenttelgen-koelemderge-arnalghan-tiimdi-materialdar-redaktory\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сегменттелген көлемдерге арналған тиімді материалдар редакторы&lt;/span&gt;&lt;/a&gt;Сегменттелген көлемдерге арналған тиімді материалдар редакторы&lt;/h4&gt;\n&lt;p&gt;Визуализациядағы өткізу функциялары деректер мәндерін түс және мөлдірлік сияқты оптикалық қасиеттерге сәйкестендіреді. Volcanite &lt;span class=\"yfm-latex\" data-content=\"l%20%5Cin%20N\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; белгілерін &lt;span class=\"yfm-latex\" data-content=\"A%3A%20l%20%20o%20(a_0%2C%20...%2C%20a_%7BN-1%7D)%20%5Cin%20R%5EN\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; қосымша атрибуттарына сәйкестендіруге мүмкіндік береді, бұл жасушалардағы қоректік заттардың тығыздығын визуализациялауға көмектеседі (4c-сурет).&lt;/p&gt;\n&lt;h4 id=\"vizualizaciyany-baghalau-ueshin-segmenttelgen-koelemder-zhinaghy\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#vizualizaciyany-baghalau-ueshin-segmenttelgen-koelemder-zhinaghy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Визуализацияны бағалау үшін сегменттелген көлемдер жинағы&lt;/span&gt;&lt;/a&gt;Визуализацияны бағалау үшін сегменттелген көлемдер жинағы&lt;/h4&gt;\n&lt;p&gt;Біз өсімдіктерді талдаудан бастап композиттік материалдар мен нейробиологияға дейінгі кең салаларды қамтитын бенчмарк деректер жиынын ұсынамыз (5a-сурет). Көлемдер 72 МБ (8-бит, Fabric) мен 2 ТБ-дан астам (32-бит, H01 human cortex) аралығында өзгереді.&lt;/p&gt;\n&lt;h4 id=\"csgv-segmenttelgen-koelemderdi-syghu\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#csgv-segmenttelgen-koelemderdi-syghu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CSGV сегменттелген көлемдерді сығу&lt;/span&gt;&lt;/a&gt;CSGV сегменттелген көлемдерді сығу&lt;/h4&gt;\n&lt;p&gt;Volcanite рендеринг конвейері толығымен GPU негізінде жұмыс істейді және CSGV сығу форматын қолданады. 5c-суретте көрсетілгендей, бұл әдіс деректерді жоғалтусыз сығуды қамтамасыз етеді, бұл шектеулі видео жады (VRAM) бар қарапайым графикалық процессорларда терабайттық көлемдерді өңдеуге мүмкіндік береді. CSGV тиімділігі деректер жиынындағы белгілер санына (мысалы, H01WM 13 миллионнан астам белгіге ие) дерлік тәуелді емес, ол блоктардағы белгілердің жергілікті тығыздығына негізделеді. 8 немесе 16-биттік деректер үшін сығу коэффициенті төменірек, себебі олар бастапқыда 32-биттік деректерге қарағанда тығызырақ орналасқан (5c-сурет). Volcanite препроцессингі VTK немесе Neuroglancer-ге қарағанда әлдеқайда жылдам және аз орын алады (3c-сурет, A1-кесте). Neuroglancer-ден айырмашылығы, CSGV деректерді жоғалтусыз кодтайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CSGV жоғалтусыз сығуды қамтамасыз етеді және &lt;a href=\"concepts/level-of-detail.html\"&gt;LOD&lt;/a&gt; (детальдау деңгейі) ағынын беру арқылы GPU ресурстарын үнемдейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LOD — бұл объектінің маңыздылығына қарай оның детальдау деңгейін өзгерту әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;CSGV көлемдік блоктарды белгілерді көшіру операцияларының ағыны ретінде кодтайды (5b-сурет). Ең жоғары детальдау деңгейіндегі (LOD) деректер (жалпы көлемнің 45–68%) сұраныс бойынша GPU-ға беріледі. Әрбір түйін (node) біркелкі бала түйіндерді өткізіп жіберу үшін stop-бит сақтайды. Біз ескі палитра сілтемелері операциясын (шекарасы δ ≤ 16) шексіз δ-ны қолдайтын жаңа нұсқамен алмастырдық, бұл дубликатсыз оңтайлы палитра ұзындығын жасауға мүмкіндік береді (A2b-сурет).&lt;/p&gt;\n&lt;h4 id=\"keskin-men-bejneni-renderiu-oenimdiligi\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#keskin-men-bejneni-renderiu-oenimdiligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кескін мен бейнені рендериу өнімділігі&lt;/span&gt;&lt;/a&gt;Кескін мен бейнені рендериу өнімділігі&lt;/h4&gt;\n&lt;p&gt;6b-суретте H01WM деректерін көлеңке және статикалық камерамен рендериу уақыттары көрсетілген. Volcanite прогрессивті рендерингті қолданады: кескін сапасы кадрлар жинақталған сайын жақсарады. Жүйе тек көрінетін блоктарды қажетті LOD деңгейінде декомпрессиялайды, мұнда бір воксель экрандағы шамамен бір пиксельге сәйкес келеді (1b-сурет). Кішігірім деректер жиыны үшін барлық блоктар ең жоғары LOD-да декодталады, ал ірі жиындар (мысалы, MouseL4, H01) үшін дөрекірек LOD-лар қолданылады. Кадрды рендериу уақыты 2–29 мс аралығында тұрақталады. VTK-ның &lt;a href=\"concepts/ray-marching.html\"&gt;ray marching&lt;/a&gt; алгоритмдеріне қарағанда Volcanite айтарлықтай жоғары өнімділікті көрсетеді (3a-сурет). Камера қозғалысы кезінде (6c-сурет) декомпрессия жүктемесі тұрақты болып қалады және интерактивті кадр жиілігін қамтамасыз етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Рендериу жылдамдығы аппараттық қамтамасыз етуге байланысты; камера күрт қозғалғанда декодерге жүктеме уақытша артуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"volcanite-koelengkeleu-rezhimderi\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#volcanite-koelengkeleu-rezhimderi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Volcanite көлеңкелеу режимдері&lt;/span&gt;&lt;/a&gt;Volcanite көлеңкелеу режимдері&lt;/h4&gt;\n&lt;p&gt;Volcanite жүйесі төрт көлеңкелеу режимін қолдайды (1e-сурет). Олар жергілікті бетті шағылыстыру моделінен бастап, толық жаһандық жарықтандыруға (&lt;a href=\"concepts/path-tracing.html\"&gt;path tracing&lt;/a&gt;) дейінгі диапазонда жұмыс істейді. A7c-суретте көрсетілгендей, көлеңке мен қоршаған орта окклюзиясын (ambient occlusion) қолдану кеңістіктік құрылымдарды қабылдауды айтарлықтай жақсартады. Path tracing ең жоғары визуалды сапаны қамтамасыз еткенімен, рендеринг уақыты 5,5 есеге дейін артады (A2-кесте). Терең жолдарды қадағалау (A7a-сурет) көбірек деректер блоктарына жүгінуді талап етеді. Камера қозғалмаса да, кескінді тегістеу (anti-aliasing) үшін кездейсоқ сәулелер әр кадрда жаңа деректерді сұрайды. Режимдер арасында ауысу лезде жүзеге асады, бұл жылдам зерттеу мен жоғары сапалы визуализация арасындағы икемділікті қамтамасыз етеді (A2-видео). Neuroglancer немесе VTK/ParaView сияқты құралдардан айырмашылығы, Volcanite кеңістіктік қабылдауды тереңірек қамтамасыз етеді (2a және 3b-суреттер).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Path tracing ең жоғары сапаны береді, бірақ рендеринг уақытын 5,5 есеге дейін арттырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"gpu-negizindegi-rendering-konvejeri\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#gpu-negizindegi-rendering-konvejeri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GPU негізіндегі рендеринг конвейері&lt;/span&gt;&lt;/a&gt;GPU негізіндегі рендеринг конвейері&lt;/h4&gt;\n&lt;p&gt;Рендеринг конвейері (6a-сурет) толығымен GPU-да жүзеге асады, бұл кадр ішіндегі CPU синхронизациясын жойып, кідірістерді азайтады. Кэшті басқару төрт кезеңнен тұрады: сұраныс (Request), жад бөлу (Provision), блоктарды тағайындау (Assign) және параллель декомпрессия (Decompress). Рендеринг кезеңі (Render) воксельдік тор арқылы сәулелер маршрутын (ray marching) есептейді (1b және A7a-суреттер). Барлық көлем GPU VRAM-ында сақталғандықтан, CPU мен GPU арасындағы деректер ағыны іс жүзінде жойылады. Кэшті басқару атомарлы операцияларды қолданады және терабайттық деректермен жұмыс істегенде де кадр уақытына елеулі әсер етпейді (6b және 6c-суреттер). Негізгі жүктеме декомпрессия мен рендеринг кезеңдеріне түседі. VTK немесе Neuroglancer-ден айырмашылығы, Volcanite пайдаланушы өзара әрекеттесуінде минималды кідірісті кепілдейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ray marching — бұл көлемді деректерді рендерингтеу әдісі, мұнда сәуле воксельдік тор бойымен өтіп, тығыздық немесе түс мәндерін жинақтайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Кесте 1.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-tT1.jpg\" alt=\"Кесте 1\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"kombinaciyalanghan-upsampling-zhaene-shudy-azajtu-suezgisi\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#kombinaciyalanghan-upsampling-zhaene-shudy-azajtu-suezgisi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Комбинацияланған upsampling және шуды азайту сүзгісі&lt;/span&gt;&lt;/a&gt;Комбинацияланған upsampling және шуды азайту сүзгісі&lt;/h4&gt;\n&lt;p&gt;Пост-процессинг өнімділігі пиксельдік интерполяцияға байланысты. Үлгілер аз болғанда шу көршілес бет нүктелерімен араластыру арқылы тазартылады (A1f-сурет). Қосымша субсемплинг (1/4, 1/16 немесе 1/64 пиксельді рендеринг) жылдамдықты арттырады, ал бос орындар ең жақын көрші деректерімен толтырылады (A1e-сурет). Біз «à-trous» сүзгісін [16] модификацияладық: аралық нәтижелерді сақтаудың орнына, түстерді тікелей буферлерде (Denoise A/B) жинақтаймыз, бұл жад шығынын азайтады. Upsampling шуды азайту процесіне интеграцияланған. Біз сегменттелген көлемдер үшін сүзгі салмақтарын оңтайландырдық және G-буфер схемасын (A1b-сурет) қолдандық. Есептеу жылдам (A1d-сурет), жад шығыны минималды (үш сурет өлшеміндегі текстура) және камера қозғалғанда жоғары сапалы кескінді береді. Камера статикалық күйге келгенде, сүзу біртіндеп азайып, бейтарап кескінге жақындайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Субсемплинг қолданылғанда уақытша артефактілер пайда болуы мүмкін, олар жеткілікті үлгілер жинақталғаннан кейін жойылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"gpu-zhadyn-pajdalanudy-ongtajlandyru\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#gpu-zhadyn-pajdalanudy-ongtajlandyru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GPU жадын пайдалануды оңтайландыру&lt;/span&gt;&lt;/a&gt;GPU жадын пайдалануды оңтайландыру&lt;/h4&gt;\n&lt;p&gt;A2d-суретте жақыннан көрсетілген кескіндерді рендерлеу үшін жұмсалатын жалпы VRAM көлемі берілген. Шағын көлемдегі деректер үшін CSGV сығу алгоритміне байланысты VRAM шығынында кэш жады басым болады. Ал үлкен көлемдегі деректер үшін сығылған көлемнің өзі VRAM шектеулеріне жақындайды. Біз енгізген оңтайландыру әдістері арқылы рендерлеу процесі жүйеміздің 16 GiB VRAM шегінен аспайды. Атап айтқанда, H01WM деректер жиыны үшін ең төменгі LOD (деталдау деңгейі) ағынын жіберу CSGV жадын 65,7%-ға қысқартады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оңтайландыру H01WM үшін VRAM шығынын 65,7%-ға азайтып, 16 GiB шегінде жұмыс істеуді қамтамасыз етті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Блоктарды қапталған палитралық форматқа ашу (декомпрессия) қаптау коэффициенті есебінен бірдей воксель саны үшін кішірек кэшті пайдалануға мүмкіндік береді (A2a-сурет). Бұл ретте кэш блоктар палитрасына тікелей қол жеткізуге мүмкіндік беретін индекстерді сақтайды, бұл кэштің пайдалы көлемін бірнеше есе арттырады (A2d-суреттегі «Packing» және A3-кестедегі VRAM көрсеткіштері). Егер кэш буфері барлық блоктарды орналастыру үшін жеткіліксіз болса, жүйе автоматты түрде блок сұраныстарын экран пиксельдерінің шағын бөлігімен шектейді (A2c-сурет). Бұл кескіннің толық қалыптасуы үшін көбірек кадр талап етсе де, кэштің «құлыптануының» (deadlock) алдын алады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/cache-deadlock.html\"&gt;Кэштің құлыптануы&lt;/a&gt; (cache deadlock) — кэш жады үнемі талап етілетін деректермен толып қалып, жаңа деректер үшін орын қалмауы жағдайы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Volcanite TB көлеміндегі деректерді жоғары сапада және жедел жауап беру жылдамдығымен рендерлейді. Барлық деректерді VRAM-да сақтауды талап ететін VTK сияқты басқа рендерерлерден айырмашылығы (3a-сурет), біздің әдіс қарапайым жабдықтардың көмегімен үлкен көлемдегі сегменттелген деректерді интерактивті талдауға мүмкіндік береді, бұл жаңа гипотезаларды тексеруде өте маңызды.&lt;/p&gt;\n&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;h4 id=\"volcanite-aedisining-artykhshylykhtary\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#volcanite-aedisining-artykhshylykhtary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Volcanite әдісінің артықшылықтары&lt;/span&gt;&lt;/a&gt;Volcanite әдісінің артықшылықтары&lt;/h4&gt;\n&lt;p&gt;Volcanite тығыз сегментацияларды визуализациялауға түбегейлі жаңа көзқарасты ұсынады. Ол сегментацияларды скалярлық өрістер немесе алдын ала есептелген беттер ретінде емес, воксел шекараларына сезімтал категориялық деректер ретінде қарастырады. Бұл қарапайым жабдықта теравоксельдік көлемдерді интерактивті рендерлеуге мүмкіндік береді және воксел деңгейіндегі дәлдікті сақтайды. Жүйе тор (mesh) генерациясын қажет етпейді, бұл сегментация нәтижелерін алудан визуальды талдауға дейінгі уақытты қысқартады. CSGV (Categorical Segmentation Grid Volume) форматын қолдану деректерді сапасын жоғалтпай сығуды және рендерлеуді жеделдету құрылымын қамтамасыз етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Volcanite сегментациядан визуализацияға дейінгі жолды қысқартып, теравоксельдік көлемдерді тор құрмай-ақ стандартты компьютерлерде талдауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CSGV — сегментация белгілерін воксел ретінде сақтайтын формат, ол күрделі құрылымдарды талдау үшін маңызды категориялық табиғат пен шекараларды сақтайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Нейрондық желілер немесе қан тамырлары жүйелері сияқты тығыз объектілі тапсырмаларда вокселдік дәлдіктегі рендерлеу және жаһандық жарықтандыру қателерді, сондай-ақ кесінділерде немесе жеңілдетілген 3D модельдерде көрінбейтін сегментация ақауларын анықтауға көмектеседі. Деректермен жергілікті жұмыс істеу мүмкіндігі ынтымақтастықты жеңілдетеді және құпия деректермен жұмыс істеу кезінде қауіпсіздікті қамтамасыз етеді. Әдіс әмбебап және зерттеу саласына қарамастан, бірнеше белгіден бастап миллиондаған объектілерге дейінгі деректер үшін жарамды.&lt;/p&gt;\n&lt;h4 id=\"kholdanystaghy-aedistermen-salystyru\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#kholdanystaghy-aedistermen-salystyru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қолданыстағы әдістермен салыстыру&lt;/span&gt;&lt;/a&gt;Қолданыстағы әдістермен салыстыру&lt;/h4&gt;\n&lt;p&gt;Volcanite ауқым, дәлдік және итерация жылдамдығы арасындағы тепе-теңдікті оңтайландырады. Кесінділерге негізделген көру құралдары дәл, бірақ 3D контексті жоқ, ал торға негізделген әдістер күрделі алдын ала өңдеуді талап етеді және ұсақ бөлшектерді жасырып қоюы мүмкін. Ағындық жүйелер петабайттық деректер үшін қажет, бірақ олар көбінесе көру аймағын шектейді. Volcanite жоғары дәлдіктегі тексеру және жылдам жергілікті жауап беру арқылы оларды толықтырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ағымдағы реализация теравоксельдік диапазонмен шектелген; петабайттық деректермен жұмыс істеу үшін CPU немесе қашықтағы серверлерден ағындық жүктеу механизмдері қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жүйенің қазіргі нұсқасы заманауи биологиялық реконструкциялардың көпшілігін қамтитын теравоксельдік көлемдерді тиімді өңдейді. Болашақта GPU кэшін және динамикалық деректерді жүктеуді енгізу арқылы дәлдікті жоғалтпай вокселдік сегментациялармен тікелей өзара әрекеттесуді сақтап қалу жоспарланған.&lt;/p&gt;\n&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"baghalau-ortasyn-baptau\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#baghalau-ortasyn-baptau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бағалау ортасын баптау&lt;/span&gt;&lt;/a&gt;Бағалау ортасын баптау&lt;/h4&gt;\n&lt;p&gt;Рендеринг өнімділігі стандартты жабдықта сыналды: AMD Ryzen 7 5800X процессоры, 48 ГБ DDR4 жедел жады және 16 ГБ VRAM бар RTX 4070 Ti Super графикалық картасы. Жүйе Ubuntu 24.04 ортасында, графикалық процессордың тұрақты жиілігінде жұмыс істеді. Кіріс деректері Lexar NM790 4 ТБ NVMe дискісінен оқылды, нәтижелер Samsung EVO 970 1 ТБ NVMe дискісіне сақталды. Барлық деректерді жүктеу, Volcanite-ті headless режимінде іске қосу және графиктер жасау үшін Python скрипттері ұсынылады.&lt;/p&gt;\n&lt;h4 id=\"syghu-zhaene-rendering-parametrleri\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#syghu-zhaene-rendering-parametrleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сығу және рендеринг параметрлері&lt;/span&gt;&lt;/a&gt;Сығу және рендеринг параметрлері&lt;/h4&gt;\n&lt;p&gt;CSGV блогының әдепкі өлшемі b = 32 деп белгіленді, ал үлкен деректер жиыны (MouseL4, H01BV, H01WM, Fabric) үшін b = 64 қолданылады. Fiber және Polyamid сияқты жиындар үшін кэш талаптарын қанағаттандыру мақсатында вокселдерді ықшам форматқа декомпрессиялау (cache paletting) әдісі қолданылады. H01WM көлемі VRAM сыйымдылығынан асқандықтан, оның ең жоғары LOD деңгейіндегі блоктары тек сұраныс бойынша GPU-ға жіберіледі. Cells, MouseL4S, MouseL4, Liconn және H01WM үшін шексіз палитралық сілтемелер қосылған, қалғандары үшін өшірілген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/paletizatsiya-kesha.html\"&gt;Кэш палетизациясы&lt;/a&gt; — бұл жадты үнемдеу үшін қайталанатын воксел мәндерін палитралық сілтемелермен алмастыру әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Барлық кескіндер 1920×1080 рұқсатында, әр пиксель үшін бір сәулемен рендерленеді. Кескін сапасын бағалау үшін статикалық камера және уақытша суперсэмплинг (temporal supersampling) көмегімен 1024 кадр, ал видеоны бағалау үшін фокус нүктесі айналасында қозғалатын камерамен 600 кадр рендерленеді.&lt;/p&gt;\n&lt;h4 id=\"vtk-zhaene-neuroglancer-men-salystyru\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#vtk-zhaene-neuroglancer-men-salystyru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;VTK және Neuroglancer-мен салыстыру&lt;/span&gt;&lt;/a&gt;VTK және Neuroglancer-мен салыстыру&lt;/h4&gt;\n&lt;p&gt;Салыстыру VTK v9.5.0 нұсқасымен жүргізілді. VTK сұр реңкті көлемдерге арналғандықтан, сегменттелген деректер үшін бетті бөліп алу немесе 32 санаттық белгіні қолдайтын вокселдік рендеринг қолданылады. Біз VTK-ның GPU негізіндегі вокселдік рендерингін пайдаланып, Volcanite материал конфигурацияларын мөлдірлік трансфер функцияларына аудардық. VTK-да сәуле қадамы 0,5 воксел деп белгіленді. Neuroglancer бағалаулары үшін деректер 64×64×64 өлшемді чанк форматына ауыстырылды. Neuroglancer клиент-сервер архитектурасында жұмыс істейтіндіктен және деректерді ағынмен жүктейтіндіктен, онда кадр уақытын өлшеу мүмкін емес деп танылды.&lt;/p&gt;\n&lt;h4 id=\"segmenttelgen-koelemderdi-syghu\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#segmenttelgen-koelemderdi-syghu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сегменттелген көлемдерді сығу&lt;/span&gt;&lt;/a&gt;Сегменттелген көлемдерді сығу&lt;/h4&gt;\n&lt;p&gt;Біздің визуализаторда ірі ауқымды сегменттелген көлемдерді (V: N³ → N) бір GPU жүйесінде өңдеу үшін деректерді жоғалтусыз сығу қолданылады. GPU жады шектеулі болғандықтан, біз CSGV блоктық көп деңгейлі кодтауды қолданамыз. Біз бастапқы алгоритмге өзгерістер енгіздік: белгілер палитрасын енгізу және оқу операцияларынан басқа барлық операцияларды өшіру мүмкіндігі қосылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/obratnye-ssylki.html\"&gt;Кері сілтемелер&lt;/a&gt; (back references) — бұл деректер ағынындағы қайталанатын мәндерді алдыңғы орындарға сілтеме жасау арқылы алмастыру әдісі, бұл жадты үнемдеуге көмектеседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз ерікті ұзындықтағы кері сілтемелерді енгіздік. Операция кодынан кейін 4-биттік элемент оқылады: 3 кіші бит δ мәнінің бір бөлігін, соңғы бит келесі элементтің бар екенін білдіреді. δ мәні &lt;span class=\"yfm-latex\" data-content=\"%5Cdelta%20%5Cleftarrow%20(%5Cdelta%20%5Cll%203)%20%5Cmid%20(%20ext%7Bentry%7D%20%5C%26%20111_2)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; формуласы бойынша жаңартылады. Бұл 32-биттік белгілердің дубликаттарын жоюға мүмкіндік береді. 64³ өлшемді блок үшін теориялық максимум 7 дана 4-биттік элементті (28 бит) құрайды, бұл 32-биттік дубликатты енгізгеннен тиімдірек. Сығу CPU-да OpenMP көмегімен параллель орындалады.&lt;/p&gt;\n&lt;h4 id=\"volcanite-renderleu\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#volcanite-renderleu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Volcanite рендерлеу&lt;/span&gt;&lt;/a&gt;Volcanite рендерлеу&lt;/h4&gt;\n&lt;p&gt;Сығылған көлем GPU жадына жүктеледі және рендерлеу кезінде қажетті бөліктері декодталады. Рендерлеу сәулелерді бағыттау (ray marching) әдісімен жүзеге асырылады, мұнда әр воксель бір бірлік көлемге ие. Әр пиксель үшін сәуле көлем арқылы өтіп, белгілерді оқиды (Сурет A7a). Беттік материалдар белгілер негізінде анықталады (Сурет 4a).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-f4.jpg\" alt=\"4-сурет: a Вокселдерге түстерді тағайындау үлгісі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет: a Вокселдерге түстерді тағайындау үлгісі.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-сурет: a Вокселдерге түстерді тағайындау үлгісі. Алты вокселдің белгілері әрқайсысы екі атрибутқа (жасы және түрі) сәйкес келеді. Сүзгі атрибуты белгіленген диапазонға түсетін бірінші материал вокселге тағайындалады. Басқа атрибут диапазоны түстер картасынан түстерді тағайындау үшін қолданылуы мүмкін. b Көлемдер жадта вокселді атрибуттарға тиімді сәйкестендіру үшін дәйекті ID мәндерін сақтау үшін алдын ала өңделеді. d Тасымалдау функциясының редакторы белгі атрибуттарының интервалдары негізінде көлеңкелеу материалдарын белгілейді. Әрбір материал үшін сүзгі атрибуттарының интервалы қай воксел белгілері үшін өзекті екенін анықтайды. Осы белгілер үшін атрибут қасиетінің мәндері әртүрлі түстерге сәйкестендірілуі мүмкін. c Үш материалмен жасушаларды рендерингтеу: қан тамырлары қызыл түспен, ісік жасушаларының қоректік тығыздығы viridis түстер картасымен көрсетілген, ECM сұр түспен кесілген.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"koelengkeleu-rezhimderi\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#koelengkeleu-rezhimderi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Көлеңкелеу режимдері&lt;/span&gt;&lt;/a&gt;Көлеңкелеу режимдері&lt;/h4&gt;\n&lt;p&gt;Көлеңкелеу режимі бетпен соқтығысқаннан кейін сәулелердің әрі қарай таралуын анықтайды. Есептеу рендерлеу теңдеуіне негізделген:&lt;br /&gt;\n&lt;span class=\"yfm-latex\" data-content=\"L_o(x%2C%20%5Comega_o)%20%3D%20L_e(x%2C%20%5Comega_o)%20%2B%20%5Cint_%7B%5COmega%5E%2B%7D%20f(x%2C%20%5Comega_i%2C%20%5Comega_o)%20L_i(x%2C%20%5Comega_i)%20%5Ccos%20%20heta_i%20d%5Comega_i\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;&lt;/p&gt;\n&lt;p&gt;Режимдер (жылдамнан баяуға қарай):&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Simple Local Shading: L_i тұрақты деп қабылданады, қосымша сәулелер қадағаланбайды.&lt;/li&gt;\n&lt;li&gt;One Shadow Ray: жарық көзіне бір сәуле бағыттап, көлеңкенің бар-жоғы тексеріледі.&lt;/li&gt;\n&lt;li&gt;Ambient Occlusion: қоршаған ортаның көлеңкесін жуықтау үшін кездейсоқ бағытта бір сәуле жіберіледі.&lt;/li&gt;\n&lt;li&gt;Path Tracing: Монте-Карло әдісімен толық рендерлеу теңдеуін бағалайды, жанама жарықтандыруды ескереді. Рекурсия сәуле көлемнен шыққанда немесе тереңдік шегіне жеткенде тоқтайды.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"moeldirlik\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#moeldirlik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мөлдірлік&lt;/span&gt;&lt;/a&gt;Мөлдірлік&lt;/h4&gt;\n&lt;p&gt;Торлы 3D сегментация әдістерінен айырмашылығы, біздің вокселдік рендерингіміз көлемдік аймақтар мен беттерді камерадан ең жақын нүктеден ең алыс нүктеге дейінгі ретпен өтеді. Бұл жартылай мөлдір беттердің композициясы коммутативті болмаса да, рендерингте мөлдірлікті интеграциялауға мүмкіндік береді (мысалы, A6 суретіндегі Mouse BA). Пайдаланушылар белгіленген материалдарға σ мөлдірлік коэффициентін тағайындай алады. Сәуле жартылай мөлдір материалға түскенде, ол бағытын өзгертпейді, бірақ жинақталған жарықтылыққа Ламберт беттік көлеңкелеу моделінің үлесін қосады және сәуленің өткізгіштігін σ шамасына азайтады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/metod-lamberta.html\"&gt;Ламберт моделі&lt;/a&gt; — беттің жарықтылығы бақылау бұрышына байланысты емес, жарық барлық бағытта біркелкі таралатын жарықтандыру моделі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз сәуле жолындағы қатарлас беттер арасындағы біртекті көлемдер үшін эмиссия-сіңіру моделін сынап көрдік, бірақ тек беттерді қолдану тиімдірек визуализация беретінін анықтадық. Болашақта көлеңкелеуді әртүрлі BRDF функцияларымен кеңейту және жарық тасымалдау моделін, соның ішінде толық көптік шашырауды жақсарту жоспарлануда.&lt;/p&gt;\n&lt;h4 id=\"saeulelik-marshing-raymarching\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#saeulelik-marshing-raymarching\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сәулелік маршинг (Raymarching)&lt;/span&gt;&lt;/a&gt;Сәулелік маршинг (Raymarching)&lt;/h4&gt;\n&lt;p&gt;Сәуле жолы бойындағы вокселдер мен олардың белгілерін анықтау үшін Raymarching әдісі қолданылады. Рендерер LOD (деталдау деңгейін) бір кірпіш вокселі кескін жазықтығындағы шамамен бір пиксельге сәйкес келетіндей етіп таңдайды. Воксел ішіндегі белгілер тұрақты болғандықтан, біз көп деңгейлі сандық дифференциалды анализатор (DDA) әдісін қолданамыз. Үлкен көлемдер үшін сандық тұрақтылықты қамтамасыз ету мақсатында біз позицияны декомпозициялаймыз: бүтін сандық вектор &lt;span class=\"yfm-latex\" data-content=\"voxel%20%5Cin%20%5Cmathbb%7BN%7D%5E3\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; воксел индексін, ал өзгермелі нүктелі вектор &lt;span class=\"yfm-latex\" data-content=\"vpos%20%5Cin%20%5Cmathbb%7BR%7D%5E3\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; воксел ішіндегі [0, 1)³ диапазонындағы позицияны сақтайды.&lt;/p&gt;\n&lt;p&gt;GPU (SIMT архитектурасы) үшін жұмыс ағынын оңтайландыруда modulo операторы қолданылады. Сәуле жолын қадағалауда 32-ге дейінгі қайтарылуы бар «орыс рулеткасы» әдісі қолданылады. Алиасингті жою үшін уақытша тегістеу (temporal anti-aliasing) жүзеге асырылады: сәулелердің суб-пиксельдік ығысулары Blackman-Harris сүзгісі негізінде дірілдетіледі. Сегментация көлемдерінде классикалық Mip-mapping (сызықтық сүзу) мүмкін емес болғандықтан, біз CSGV иерархиясын қолданамыз, мұнда дөрекі деңгейлерде орташа мән емес, мәндер модасы жинақталады.&lt;/p&gt;\n&lt;h4 id=\"post-oengdeu\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#post-oengdeu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пост-өңдеу&lt;/span&gt;&lt;/a&gt;Пост-өңдеу&lt;/h4&gt;\n&lt;p&gt;Ambient Occlusion немесе Path Tracing кезіндегі бастапқы кадрлардағы шу иерархиялық вейвлет-сүзгі (denoiser) көмегімен азайтылады. Егер GPU өнімділігі шектеулі болса, рендеринг әр кадр үшін пикселдердің бір бөлігінде орындалады, ал жетіспейтін мәндер upsampling арқылы толтырылады (A1e суреті). Процесс есептеу шейдерлерінің конвейері арқылы жүзеге асырылады. Кіріс деректері ретінде түс пен мөлдірлік (RGBA) жинақтаушы буферлері және сүзуді басқаруға арналған G-буфер қолданылады. Соңғы кезеңде тон-маппинг, жарықтылық, &lt;a href=\"concepts/visibility.html\"&gt;контраст&lt;/a&gt;, гамма түзету және фонмен араластыру орындалады.&lt;/p&gt;\n&lt;h4 id=\"g-bufer\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#g-bufer\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;G-буфер&lt;/span&gt;&lt;/a&gt;G-буфер&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"concepts/g-buffer.html\"&gt;G-Buffer&lt;/a&gt; рендеринг кезеңінде жазылады және әр пиксель үшін 48 биттік деректерді қамтиды. Бетпен алғашқы әрекеттесу нүктесі үшін мыналар сақталады (A1b-сурет): бет нормалі (3 бит, алты дискретті бағыттың бірі), квантталған тереңдік (13 бит, деректер жиынын қамтитын сфераға дейінгі қашықтық, A3b-сурет) және материал мен альбедо түсін анықтауға арналған 32 биттік белгі. 011 нормалі беттің жоқтығын, ал 111 пиксельдің әлі рендерленбегенін білдіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;G-Buffer — бұл әр пиксельдің геометриялық қасиеттерін (нормальдар, тереңдік, материалдар) сақтайтын аралық буфер, ол күрделі геометрияға қайта жүгінбей-ақ пост-өңдеу жасауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"shuudy-basu-denoising\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#shuudy-basu-denoising\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шууды басу (Denoising)&lt;/span&gt;&lt;/a&gt;Шууды басу (Denoising)&lt;/h4&gt;\n&lt;p&gt;Рендеринг әр кадрда әр пиксель үшін ең көбі бір үлгіні жинақтайды. Шуды азайту үшін «A-trous» сүзгісі (A1f-сурет) қолданылады, ол жиектерді сақтай отырып, түстерді бұлдыратады. Әрбір i итерациясында пиксель алдыңғы нәтиженің 3×3 немесе 5×5 аймағымен жұмыс істейді (A1c-сурет), қадамы 2^i-ге тең, бұл 3 итерациядан кейін 15×15 қамту аймағын құрайды (A1a-сурет). Жадты үнемдеу үшін жоғары қарай өту (up-pass) қолданылмайды. Пиксельдің i+1 итерациясындағы мәні: &lt;span class=\"yfm-latex\" data-content=\"c_%7Bi%2B1%7D(p)%20%3D%20%5Cfrac%7B1%7D%7Bk%7D%20%5Csum_%7Bq%7D%20h_i(q)%20%5Ccdot%20w(q%2C%20p)%20%5Ccdot%20c_i(q)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; формуласымен есептеледі. Мұнда h — Гаусс сүзгісі (1, 2, 1)⊗(1, 2, 1), w — G-Buffer айырмашылықтарына (нормальдар, тереңдік және HSV түс) негізделген салмақ коэффициенті. Егер n_p және n_q нормальдары сәйкес келмесе, w=0. Әйтпесе, &lt;span class=\"yfm-latex\" data-content=\"w%20%3D%20e%5E%7B-%5Clangle%20%5Crho_%5CDelta%2C%20%5Crho_%5CDelta%20%5Crangle%7D%20%5Ccdot%20e%5E%7B-%2Fd_p-d_q%2F%2F%5Cphi_d%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; болып табылады, мұнда &lt;span class=\"yfm-latex\" data-content=\"%5Cphi_d\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — воксель өлшемі, &lt;span class=\"yfm-latex\" data-content=\"%5Cphi_%5Crho%3D8\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; альбедо айырмашылықтарының әсерін басқарады.&lt;/p&gt;\n&lt;h4 id=\"diskretizaciya-zhiiligin-arttyru-upsampling\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#diskretizaciya-zhiiligin-arttyru-upsampling\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дискретизация жиілігін арттыру (Upsampling)&lt;/span&gt;&lt;/a&gt;Дискретизация жиілігін арттыру (Upsampling)&lt;/h4&gt;\n&lt;p&gt;Өнімділікті арттыру үшін рендеринг ажыратымдылығын 1/4, 1/16 немесе 1/64-ке дейін төмендетуге болады. Бос орындар денойзердің иерархиялық жинақталуына біріктірілген қарапайым upsampling әдісімен толтырылады (A1e-сурет). Рендерленбеген пикселдер (111 нормалі) үшін буферлер ең жақын рендерленген көршіге дейінгі 2D ығысуды сақтайды. Әр i кезеңінде 2^i қашықтықтағы көрші q ізделеді. Соңғы ығысу &lt;span class=\"yfm-latex\" data-content=\"o_p%20%5Cleftarrow%20%5Cmin_%7Blength%7D%20%5Bo_p%2C%20o_q%20%2B%20(q%20-%20p)%5D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ретінде жаңартылады. Нәтиже Вороной диаграммалары үшін Jump-Flood алгоритмін еске салады. Стратификацияланған таңдау әр 2², 4² немесе 8² пиксель блогында бір пиксельдің рендерленуін қамтамасыз етеді, блоктар тізбегі көк шумен (blue-noise) ығыстырылады (A1e-сурет).&lt;/p&gt;\n&lt;h4 id=\"vulkanitti-kholdanu\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#vulkanitti-kholdanu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вулканитті қолдану&lt;/span&gt;&lt;/a&gt;Вулканитті қолдану&lt;/h4&gt;\n&lt;p&gt;Графикалық интерфейстен (GUI) бөлек, Volcanite тапсырмаларды автоматтандыру үшін CLI арқылы немесе графикалық қабықшасыз жүйелерде барлық параметрлерге толық қолжетімділікпен жұмыс істей алады (1-сурет).&lt;/p&gt;\n&lt;h4 id=\"materialdar-redaktory-zhaene-tasymaldau-funkciyalary\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#materialdar-redaktory-zhaene-tasymaldau-funkciyalary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Материалдар редакторы және тасымалдау функциялары&lt;/span&gt;&lt;/a&gt;Материалдар редакторы және тасымалдау функциялары&lt;/h4&gt;\n&lt;p&gt;Қолданбаның оң жақ бөлігіндегі графикалық интерфейс (1a-сурет) материалдар редакторын қамтиды, ол белгілерді (labels) оптикалық қасиеттерге сәйкестендіру үшін тасымалдау функцияларын басқарады. Жүйе көп деңгейлі карталауды қолданады (4a-сурет): материалдар атрибуттарды минималды және максималды мәндер бойынша сүзу арқылы тағайындалады. Мысалы, [5.2, 27] диапазонындағы барлық белгілер сол жақ материалға тағайындалуы мүмкін (4d-сурет). Әр белгі үшін тізімнен сәйкес келетін бірінші материал таңдалады. Бұл материал түсті, мөлдірлікті және эмиссияны анықтайды. Түстер тұрақты болуы немесе [48, 69] түстер картасы негізінде берілуі мүмкін. Екінші жағдайда, сүзгіден тәуелсіз қосымша визуализация атрибуты қолданылады (4d-суреттегі Attribute). Мәндер картаға сызықтық түрде ауыстырылады, мұнда диапазонды шектеу (Clamp), қайталау (Repeat) немесе кездейсоқ тағайындау (Random) мүмкіндіктері бар.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/funktsiya-peredachi.html\"&gt;Тасымалдау функциясы&lt;/a&gt; — бұл сандық деректерді визуалды сипаттамаларға (түс, мөлдірлік) айналдыратын математикалық ереже, ол көлем ішіндегі қажетті құрылымдарды бөліп көрсетуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Белгілер атрибуттары A_i: N → R CPU жағында SQLite3 деректер базасында сақталады, бұл SQL сұраулары арқылы туынды атрибуттарды жасауға мүмкіндік береді. A₀(l) = l атрибуты әрқашан қолжетімді. Volcanite сонымен қатар әр белгі үшін геометриялық атрибуттарды (көлем, бет ауданы) есептейді. Атрибуттар GPU-ға өзгермелі нүктелі (floating point) буферлер ретінде жіберіледі. Белгілер саны воксельдер санынан әлдеқайда аз болғандықтан, бұл тиімді. Атрибуттармен жұмыс істеуде индекстердің үздіксіздігін қамтамасыз ету үшін алдын ала өңдеу жүргізіледі: воксельдер 3D Morton қисығы бойымен [50] айналып өтіледі және белгілер өсіп келе жатқан индекстермен ауыстырылады. Бұл карталау бастапқы белгілерді қалпына келтіру үшін базада сақталады.&lt;/p&gt;\n&lt;h4 id=\"paermen-zholy-interfejsi-cli\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#paermen-zholy-interfejsi-cli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пәрмен жолы интерфейсі (CLI)&lt;/span&gt;&lt;/a&gt;Пәрмен жолы интерфейсі (CLI)&lt;/h4&gt;\n&lt;p&gt;Volcanite CLI арқылы headless-режимді қолдайды. Пәрмен жолы барлық функцияларды, соның ішінде көлемдерді сығу/декомпрессиялау және рендерингті басқаруға мүмкіндік береді. CLI графикалық қабықшасыз серверлерде жұмыс істеуге және bash немесе Python скрипттеріне интеграциялауға мүмкіндік береді.&lt;/p&gt;\n&lt;h4 id=\"gpu-rendering-konvejeri\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#gpu-rendering-konvejeri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GPU рендеринг конвейері&lt;/span&gt;&lt;/a&gt;GPU рендеринг конвейері&lt;/h4&gt;\n&lt;p&gt;Volcanite Vulkan API көмегімен C++ тілінде жүзеге асырылған. Көлемдерді сығу CPU-да OpenMP [56] арқылы, ал рендеринг пен декодтау GLSL шейдерлерінде орындалады. Шейдерлер белгілі бір сығылған көлем үшін «on-the-fly» компиляцияланады, бұл параметрлерді (блок өлшемдері, кэш, CSGV операциялары) компиляция уақытындағы константалар ретінде жіберуге мүмкіндік береді. Бұл қажетсіз код жолдарын алып тастайды және GPU регистрлерінің тиімділігін арттырады. Рендерер блоктар кэшін (brick cache) қолданады, оған көрінетін CSGV деректері ашылады. Кэшті басқару ағынды (streaming) бейімдейді және көрінетін блоктарды буфердің бос ұяшықтарына тағайындайды (6a-сурет). Екі сатылы процесс енгізілген: декомпрессия мен тағайындауды бөлу, сондай-ақ «A-trous» сүзгісі арқылы шуды азайту және upsampling.&lt;/p&gt;\n&lt;p&gt;Рендеринг процесі: сәулелер көлем бойымен өтіп, декодталған блоктарға жүгінеді немесе жаңаларын көрінетін деп белгілейді. Көрінетін белгілері жоқ блоктар өткізіп жіберіледі. Сұрау сатысы (request) әр блок үшін бір ағында орындалып, жаңа блоктар үшін сұраулар стекін қалыптастырады. Негізгі әдістерден айырмашылығы, LOD (деталдау деңгейі) есебі рендеринг сатысынан келесі кадрдың сұрау сатысына ауыстырылған, бұл камера қозғалғанда кідірістер мен артефактілерді жояды. Қамтамасыз ету сатысы (provision) кэште орын бар-жоғын тексереді; жады жетіспесе, буфердегі индекс атомдық түрде ұлғайтылады. Содан кейін, тағайындау сатысы (assign) блоктарды ұяшықтарға бекітеді, ал декодтау сатысы (decode) оларды ашады. Тұрақты режимде рендерингтен басқа сатылардың орындалу уақыты 2 мс-тен аз.&lt;/p&gt;\n&lt;h4 id=\"zhadty-baskharu\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#zhadty-baskharu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жадты басқару&lt;/span&gt;&lt;/a&gt;Жадты басқару&lt;/h4&gt;\n&lt;p&gt;Сегментация көлемдері көбінесе тұтынушылық GPU-лардың VRAM шектеулерінен асып түседі. Мысалы, 2048³ көлеміндегі 32-биттік белгілер 32 ГиБ жадты алады. Жадты үнемдеу үшін біз CSGV сығуын және CPU-дан GPU-ға деректерді ағындық жіберуді қолданамыз. Блоктар (bricks) сұраныс бойынша ғана кэшке декодталады. Рендерер камерадан алыстаған сайын төменірек LOD-тағы блоктарды сұрайды, бұл кэш көлемін әр LOD деңгейінде 8 есе азайтады. Дегенмен, VRAM шығыны жоғары болып қалады (A3c суреті). Егер деректер VRAM-ға сыймаса, кэш көлемі мәжбүрлі түрде қысқартылады.&lt;/p&gt;\n&lt;h4 id=\"kodtau-buferlerin-ongtajlandyru\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#kodtau-buferlerin-ongtajlandyru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кодтау буферлерін оңтайландыру&lt;/span&gt;&lt;/a&gt;Кодтау буферлерін оңтайландыру&lt;/h4&gt;\n&lt;p&gt;1–3% сығу коэффициентімен CSGV көлемдерінің көпшілігі VRAM-ға сыяды. 32-биттік индекстеу (16 ГиБ лимиті) және API шектеулерін (4 ГиБ) айналып өту үшін біз блоктарды бірнеше буферге таратамыз. &lt;span class=\"yfm-latex\" data-content=\"%5Ceta\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — мақсатты буфер көлемінен асатын блоктар саны, ал индекстер &lt;span class=\"yfm-latex\" data-content=\"%5Clfloor%20bi%20%2F%20%5Ceta%20%5Crfloor\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ретінде карталанады. Vulkan buffer device address кеңейтімі GPU-ға буфер түріне қарамастан декомпрессия жасауға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Кэш палеттизациясы — бұл жадтағы деректерді сығу әдісі, мұнда толық мәндердің орнына шағын кесте (палитра) индекстері сақталады, бұл жад сыйымдылығын арттырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;CPU-дан GPU-ға ағындық жіберу үшін ең егжей-тегжейлі LOD бөлек сақталады (A3c суреті), ал ірірек LOD-тар (жадтың 32–55%, 5c суреті) толығымен жүктеледі. Егжей-тегжейлі блоктар Detail Requests буфері арқылы сұралады. Асинхронды конвейер деректерді бірнеше кадр ішінде GPU буферіне көшіреді. Кэш палеттизациясы үшін біз &lt;span class=\"yfm-latex\" data-content=\"I%20%3D%20%5Clceil%20%5Clog_2(%2FP%2F_%7Bmax%7D)%20%5Crceil\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; битті қолданып, әр 32-биттік кэш жазбасына &lt;span class=\"yfm-latex\" data-content=\"%5Clfloor%2032%20%2F%20I%20%5Crfloor\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; жазбаны орналастырамыз (A2a суреті).&lt;/p&gt;\n&lt;h4 id=\"keshti-defragmentaciyalau\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#keshti-defragmentaciyalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кэшті дефрагментациялау&lt;/span&gt;&lt;/a&gt;Кэшті дефрагментациялау&lt;/h4&gt;\n&lt;p&gt;Кэш аймақтары белгілі бір LOD-қа қатаң бекітілген, бұл фрагментацияға әкелуі мүмкін. Кэш толған кезде біз оны толығымен тазалаймыз (6a суреті). LOD өзгерген кезде, егер бос орындар стегі (1 048 576 блок сыйымдылығы) толы болса, біз аймақты стекке қайтармастан LOD-ты мәжбүрлі түрде ауыстырамыз, бұл келесі дефрагментацияға дейін «өлі» орынды тудырады.&lt;/p&gt;\n&lt;h4 id=\"bloktargha-suranysty-shekteu-brick-request-limitation\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#bloktargha-suranysty-shekteu-brick-request-limitation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Блоктарға сұранысты шектеу (Brick request limitation)&lt;/span&gt;&lt;/a&gt;Блоктарға сұранысты шектеу (Brick request limitation)&lt;/h4&gt;\n&lt;p&gt;Кэш жадының тиімділігі барлық қажетті блоктарды (bricks) талап етілетін бөлшектеу деңгейлерінде (LOD) ұстап тұру қабілетіне байланысты. Егер кэш сұраныстардың көптігінен толып кетсе, қақтығыс туындайды. Бұл мәселені шешу үшін &lt;a href=\"concepts/ogranichenie-zaprosov.html\"&gt;сұраныстарды шектеу&lt;/a&gt; әдісі қолданылады: рендерер тек пикселдердің шектеулі аймағына (A2c-суреттегі жасыл аймақ) ғана блоктарды сұрауға рұқсат береді, бұл кэш ресурстарын сәулелердің кішірек жиынына шоғырландырады. Осы аймақтан тыс пикселдерге қажет блоктар кэштен босатылады. Механизм пикселдегі таңдамалар (samples) санының минималды және максималды мәндері арасындағы айырмашылық шекті мәннен асқанда автоматты түрде іске қосылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сұраныстарды шектеу — бұл жад ресурстарын оңтайландыру әдісі, ол жүйеге тек ағымдағы кадр үшін маңызды деректерді кэште ұстауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;A7a-суретте сәуле жолының тереңдігі артқан сайын блоктарға қатынау саны артатыны көрсетілген. Бастапқы сәулелер үшін (тереңдігі ≤ 1) әсері шектеулі, бірақ ұзын сәуле жолдары үшін жүйе бір ғана таңдама үшін толық блоктарды декомпрессиялауды талап етуі мүмкін. Сондықтан біз сұраныстардың тереңдігін әдепкі бойынша 1-ге дейін шектейміз. Егер декодталмаған блокқа қатынау орын алса, жүйе ең ірі LOD деңгейіндегі белгіні пайдаланады, бұл жанама жарықтандырудағы қателікті азайтады.&lt;/p&gt;\n&lt;h4 id=\"kezdejsokh-sandardy-generaciyalau\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#kezdejsokh-sandardy-generaciyalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кездейсоқ сандарды генерациялау&lt;/span&gt;&lt;/a&gt;Кездейсоқ сандарды генерациялау&lt;/h4&gt;\n&lt;p&gt;Рендерлеу кезінде кездейсоқ сандар сәуле бағыттарын және анти-алиасинг үшін суб-пикселдік ығысуларды анықтайды. Кэштің бір кадрлық кідірісі болғандықтан (6a-сурет), кездейсоқ сандардың өзгеруі әлі декодталмаған блоктарға қатынауға әкелуі мүмкін. Мұны болдырмау үшін біз әрбір пиксел ағыны үшін детерминирленген кездейсоқ сандар генераторын қолданамыз, ол сол пиксел үшін жинақталған жарамды таңдамалар санымен инициализацияланады. Бұл пикселдің деректер қолжетімді болғанға дейін дәл сол сәуле жолын есептеуін қамтамасыз етеді. Жүйенің қатып қалуын болдырмау үшін күй әр 256 кадр сайын өзгертіліп отырады. Инициализация шуды оңтайландыру үшін 32x32 blue noise паттерніне негізделген. Генератор ретінде 2D PCG-хэштеу қолданылады. Пиксел p үшін f кадрдан кейінгі бастапқы мән: PCG2D(blueNoise32×32(p), (28⌊f / 256⌋) ⊕ s), мұндағы ⊕ — биттік XOR операциясы.&lt;/p&gt;\n&lt;h4 id=\"renderleu-oenimdiligin-taldau\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#renderleu-oenimdiligin-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Рендерлеу өнімділігін талдау&lt;/span&gt;&lt;/a&gt;Рендерлеу өнімділігін талдау&lt;/h4&gt;\n&lt;p&gt;Визуализация әдістерінің тиімділігін бағалау 14 түрлі деректер жиынтығы (Polyamid, Fabric, MouseBA, Cells, Battery, AZBA, H01BV, H01WM, Plant, Liconn, Fiber, MouseL4S, Fabricval және MouseL4) көмегімен жүргізілді. Әрбір нысан үшін көлеңкелеудің төрт техникасы: local, shadow, ao (ambient occlusion) және pt (path tracing) талданды. Сынақтар статикалық камера (static camera) және қозғалыстағы камера (moving camera) режимдерінде өткізілді. Негізгі көрсеткіштер ретінде кадрды рендерлеу уақыты (мс) және статистикалық мәндер (min, med, max) алынды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ambient Occlusion (AO) және Path Tracing (PT) — бұл жарықтың геометриямен өзара әрекеттесуін ескеретін жаһандық жарықтандыру әдістері, олар жергілікті көлеңкелеуге қарағанда әлдеқайда көп есептеу ресурстарын талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Статикалық камера үшін рендерлеу уақыты 1.2 мс (Battery, local) пен 238.64 мс (H01BV, pt) аралығында өзгерді. Қозғалыстағы камера режимінде медиандық уақыт көрсеткіштері төменірек болғанымен, күрделі көріністерде (мысалы, H01BV) PT әдісімен рендерлеу уақыты 174.72 мс-ке жетті. Көлеңкелеу әдістері арасындағы айырмашылық жергілікті көлеңкелеуден PT-ге ауысу нысан геометриясының күрделілігіне байланысты жүйе жүктемесін 3–10 есе арттыратынын көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"keshteu-zhaene-zhadty-ongtajlandyru\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#keshteu-zhaene-zhadty-ongtajlandyru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кэштеу және жадты оңтайландыру&lt;/span&gt;&lt;/a&gt;Кэштеу және жадты оңтайландыру&lt;/h4&gt;\n&lt;p&gt;Сонымен қатар, кэшті пайдалану (Cache Paletting) және деректерді орау (Packing Factor) тиімділігі бағаланды. Кэштеуді пайдалану жад көлемін (Cache Used [MB]) айтарлықтай қысқартуға мүмкіндік берді. Мысалы, Polyamid деректер жиынтығы үшін кэш қосылған кезде жад көлемі 4134.7 МБ-тан 516.84 МБ-қа дейін азайды. Деректерді орау коэффициенті 1.68 (Battery) мен 20.5 (Fiber) аралығында өзгерді. Пиксельге шаққандағы сынамалар саны (SPP) 1014 пен 1023 аралығында сақталды, бұл әртүрлі өнімділік параметрлерінде кескін сапасының тұрақтылығын қамтамасыз етеді.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 3.&lt;/strong&gt; Сығу коэффициентін салыстыру&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Санат&lt;/th&gt;\n&lt;th&gt;Сығу коэффициенті [%] (Стоп-битсіз)&lt;/th&gt;\n&lt;th&gt;Сығу коэффициенті [%] (Стоп-битпен)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Fabricval&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Battery&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 4.&lt;/strong&gt; Сығу коэффициентін салыстыру&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Санат&lt;/th&gt;\n&lt;th&gt;Сығу коэффициенті [%] (Стоп-битсіз)&lt;/th&gt;\n&lt;th&gt;Сығу коэффициенті [%] (Стоп-битпен)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;AZBA&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Plant&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 5.&lt;/strong&gt; Сығу коэффициентін салыстыру&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Санат&lt;/th&gt;\n&lt;th&gt;Сығу коэффициенті [%] (Стоп-битсіз)&lt;/th&gt;\n&lt;th&gt;Сығу коэффициенті [%] (Стоп-битпен)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;MouseL4S&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;MouseBA&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;strong&gt;Кесте S1.&lt;/strong&gt; Volcanite, VTK (C++ API) және Neuroglancer үшін алдын ала өңдеу уақыттары мен дискідегі файл ө
