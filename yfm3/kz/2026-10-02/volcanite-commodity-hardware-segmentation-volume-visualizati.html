mg src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-tT7.jpg\" alt=\"Кесте 7\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 8.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-tT8.jpg\" alt=\"Кесте 8\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-f1.jpg\" alt=\"1-сурет: Визуалды аннотация. a Біздің интерактивті Volcanite қосымшамыз заманауи жоғалтусыз сығу әдістерін қолдана отыры\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: Визуалды аннотация. a Біздің интерактивті Volcanite қосымшамыз заманауи жоғалтусыз сығу әдістерін қолдана отырып, қарапайым жабдықта үлкен сегменттелген көлемдерді визуалды зерттеуге мүмкіндік береді. b Біздің графикалық процессор (GPU) негізіндегі…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет: Визуалды аннотация. a Біздің интерактивті Volcanite қосымшамыз заманауи жоғалтусыз сығу әдістерін қолдана отырып, қарапайым жабдықта үлкен сегменттелген көлемдерді визуалды зерттеуге мүмкіндік береді. b Біздің графикалық процессор (GPU) негізіндегі рендеринг конвейеріміз көрінетін көлем аймақтарын жылдам қол жеткізу үшін кэшке декомпрессиялайды. Бұл конвейер әртүрлі рендеринг конфигурацияларын, тіпті жеке вокселдерді зерттеуге дейін (оң жақта) интерактивті түрде зерттеуге мүмкіндік береді. c Рендеринг әр кадр үшін миллисекундтармен өлшенетін интерактивті процесс. Алғашқы кадрларда декомпрессия жүктемесі жоғары болады, бірақ ол тез жоғалады. d Volcanite көмегімен біз 2,2 ТБ көлеміндегі H01 адам миының ақ затының сегментация көлемін Full-HD сәулелік трассировкамен секундына 66 кадр жылдамдығымен, басқа әдістерге қарағанда әлдеқайда жылдам бірінші кадр уақытымен қарапайым жабдықта интерактивті түрде зерттей аламыз. Neuroglancer-де визуализация үшін дәл емес торларды жасау бір аптадан астам уақытты алады, ал біздің алдын ала өңдеу жүйеміз екі сағаттан аз уақыт ішінде әлдеқайда кішірек және жоғалтусыз кодтауларды жасайды. e Volcanite-дегі көлеңке режимдерін жылдам жергілікті көлеңкелеуден жоғары сапалы сәулелік трассировкаға жедел кері байланыспен ауыстыруға болады.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-f2.jpg\" alt=\"Сурет 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-f3.jpg\" alt=\"3-сурет: a Volcanite (көк) және VTK (сары) көмегімен вокселдік рендеринг үшін кадр уақыттары, бекітілген камерадан жергі\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет: a Volcanite (көк) және VTK (сары) көмегімен вокселдік рендеринг үшін кадр уақыттары, бекітілген камерадан жергілікті көлеңкелеумен (төменірек болса жақсы).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-сурет: a Volcanite (көк) және VTK (сары) көмегімен вокселдік рендеринг үшін кадр уақыттары, бекітілген камерадан жергілікті көлеңкелеумен (төменірек болса жақсы). Үлкен деректер жад шектеулеріне байланысты рендерлене алмайды. Neuroglancer үшін кадр уақыттары қолжетімді емес. b AZBA сәйкес келетін перспективалармен және Volcanite мен VTK-дағыдай қарапайым жергілікті көлеңкелеумен, сондай-ақ Neuroglancer-дегі ұқсас конфигурацияда рендерленген. VTK тікелей сегментация көлемін рендерингі және Neuroglancer тек жергілікті көлеңкелеуді қолдайтындықтан, біз Volcanite-тің көлеңкелер мен жанама жарықтандыруды қолдауына қарамастан, оның жергілікті көлеңкелеуін өнімділік өлшемдерінде салыстырамыз. c Neuroglancer үшін қолданылатын қосымша gzip сығуынсыз да, Volcanite ең аз деректерді сақтайды және жалпы алғанда ең қысқа алдын ала өңдеу уақыттарына ие.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-f5.jpg\" alt=\"5-сурет: a Визуализацияларды бағалау үшін әртүрлі қасиеттері бар сегменттелген көлемдер топтамамыз.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет: a Визуализацияларды бағалау үшін әртүрлі қасиеттері бар сегменттелген көлемдер топтамамыз.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-сурет: a Визуализацияларды бағалау үшін әртүрлі қасиеттері бар сегменттелген көлемдер топтамамыз. Коннектом (CONN) талдауы негізгі қолданба болғанымен, көптеген салалар сегменттелген көлемдерді пайдаланады. b Біздің CSGV форматымыз сегменттелген көлемдерді блоктарды кодтау жиынтығы ретінде сығады. Әрбір блок оны көп өлшемді тор түрінде қайта қалпына келтіретін тәуелсіз операциялар ағынымен кодталады. Кіші операция кодтары түйіндерге өз белгісін көрші немесе ата-аналық тор түйінінен немесе блоктың 32-биттік белгілер палитрасынан көшіруді бұйырады. c Бұл деректер жиынтығының жад шығынын айтарлықтай азайтады, орташа есеппен әр воксел үшін 1 биттен (бит/воксел) әлдеқайда аз орын талап етеді. Volcanite мұны толық GPU негізіндегі визуализация конвейері үшін GPU VRAM-ында ТБ көлеміндегі көлемдерді сақтау үшін пайдаланады. Ең жоғары бөлшектеу деңгейін (LOD) кодтау CSGV-де рендеринг кезінде тек сұраныс бойынша GPU-ға ағын ретінде жіберу үшін бөлінуі мүмкін. Осы LOD бөлшектерінің салыстырмалы көлемі Detail% ретінде берілген.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-f6.jpg\" alt=\"6-сурет: a Volcanite рендеринг конвейері.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-сурет: a Volcanite рендеринг конвейері.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;6-сурет: a Volcanite рендеринг конвейері. Әрбір кезең бөлек шейдер жіберуі болып табылады. Блок кэшін басқару бірнеше кезеңге бөлінген (қар. көлеңке атласы ағыны (52) және (60)): Request енді сұралмайтын блоктардың кэш аймақтарын бос LOD стектеріне босатады. Provision егер бос стек барлық блок сұраныстарын орындау үшін жеткіліксіз болса, кэш буферінің артқы жағынан жаңа элементтерді бөледі. Assign жаңа сұралған блоктарды бос кэш аймақтарына тағайындайды, содан кейін Decode оларды кэшке декомпрессиялайды. Render әр пиксель үшін бір сәулелік трассировка ағынын орындайды, түстерді құрастыру үшін кэштегі блоктарға кіреді және барлық көрінетін блоктарды сұрайды. Resolve біріктірілген шуды азайту және жоғары үлгілеу үшін біздің A-trous сүзгімізді қайта-қайта орындайды. b 16 GiB GPU-да стационарлық камерамен 927 ГБ (шикі) Mouse L4 көлемін рендерингтеу үшін кадр уақыттары. Бастапқы декомпрессия сұранысы жоғары, өйткені кэштер бастапқыда бос болады. Кейінгі кадрлар рендеринг есебінен басым болады. c Көлеңкелермен анимация (камера Mouse L4 айналасында айналады және жақындайды) үшін кадр уақыттары. Кейінгі кадрлар деректерге жоғарырақ дәлдікте кіреді, бұл қымбатырақ декомпрессия мен рендерингке әкеледі.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS1.jpg\" alt=\"Сурет S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS2.jpg\" alt=\"Сурет A2: GPU жадын басқару. b δ операциясы блоктар палитрасының максималды өлшемдерін /P/ шектеу үшін өте маңызды, бұл \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет A2: GPU жадын басқару. b δ операциясы блоктар палитрасының максималды өлшемдерін /P/ шектеу үшін өте маңызды, бұл кэшті орау коэффициенттеріне әсер етеді.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Сурет A2: GPU жадын басқару. b δ операциясы блоктар палитрасының максималды өлшемдерін /P/ шектеу үшін өте маңызды, бұл кэшті орау коэффициенттеріне әсер етеді. Біздің жаңа (шектеусіз) δ палитраның дубликаттарын жояды. c Блок сұраныстарын шектеу тек белгілі бір пикселдерге (жасыл) блок кэшіне сұраныс жасауға мүмкіндік береді. Бұл кэш бюджеті тығыз болған кезде, ресурстарды ең аз рендерленген үлгілері бар пиксел (қызыл) айналасында шоғырландыру арқылы өлі күйлердің алдын алады. d Көлеңке сәулелерімен кескінді рендерлеу кезінде GPU жадын пайдалану. Шағын деректер үшін кэш 16 GiB VRAM GPU-ымыздағы жадты тұтынуда басым болады. Жад тиімділігі маңызды болатын үлкен деректер үшін біздің әдіс шикі деректер өлшемдерімен салыстырғанда жадты тұтынуды айтарлықтай шектейді. Polyamid, Fiber, H01BV, Fabric, MouseL4 және H01WM үшін біз кэш палитрасын орау коэффициентімен тиімді кэш өлшемін арттыру үшін қолданамыз. Жалпы VRAM тұтынуы басқа деректерді қамтиды.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS3.jpg\" alt=\"Сурет A3: a Рендерленген кадрларды шудан тазарту және үлкейту үшін пост-процессинг конвейері.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет A3: a Рендерленген кадрларды шудан тазарту және үлкейту үшін пост-процессинг конвейері.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Сурет A3: a Рендерленген кадрларды шудан тазарту және үлкейту үшін пост-процессинг конвейері. Екі алмасып тұратын ping-pong буфері алдыңғы (кіріс) және ағымдағы (шығыс) RGBA жарықтығын (Accum.) және әр пиксел үшін үлгілер санын (SampleCnt) қамтиды. Келесі шешу конвейері екі алмасып тұратын 16-биттік RGBA текстураларымен және конвейер бойы өзгеріссіз қалатын G-buffer рендер шығысымен жұмыс істейді. b Әлемдік кеңістікте деректер жинағы өзінің ең үлкен өлшемі бойынша 1 өлшеміне дейін масштабталады және координаттар басы айналасында орталықтандырылады. G-buffer үшін тереңдік мәндері ∥h − p∥ ретінде есептеледі, мұнда p - камера бағытындағы бірлік кубты қоршап тұрған сфераға проекцияланған бірінші бетке тию нүктесі. c Рендерлеу архитектурасындағы тиісті жад буферлері және деректер ағыны. Блок кодтаулары бірнеше үлкен буферлерде сақталады. Өте үлкен деректер жинақтары үшін блоктардың ең жіңішке өлшемдері (деталь) сұраныс бойынша GPU-ға жіберіледі. Рендерлеу кезінде көрінетін блоктар GPU кэшіне, мүмкін оралған форматта ашылады. d Ең жіңішке LOD үшін кодтау буферлерін құруға арналған CPU конвейері. Конвейер күйлері ақ түсте, процедуралар көк түсте.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS6.jpg\" alt=\"Сурет A6: Кескінді (алғашқы 21 кадр, статикалық камера) және көлеңке сәулелерімен видеоны рендерлеуге арналған кадр уақы\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет A6: Кескінді (алғашқы 21 кадр, статикалық камера) және көлеңке сәулелерімен видеоны рендерлеуге арналған кадр уақыттары. Жақын жоспарлар үшін рендерлеу уақыты бастапқы декомпрессия шығындары кэштелгеннен кейін басым болады.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS6-2.jpg\" alt=\"Сурет S6 (жалғасы 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S6 (жалғасы 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS6-3.jpg\" alt=\"Сурет S6 (жалғасы 3)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S6 (жалғасы 3)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS6-4.jpg\" alt=\"Сурет S6 (жалғасы 4)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S6 (жалғасы 4)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS6-5.jpg\" alt=\"Сурет S6 (жалғасы 5)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S6 (жалғасы 5)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS6-6.jpg\" alt=\"Сурет S6 (жалғасы 6)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S6 (жалғасы 6)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS6-7.jpg\" alt=\"Сурет S6 (жалғасы 7)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S6 (жалғасы 7)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS7.jpg\" alt=\"Сурет A7: a Көлеңке режимдері жарықтың әртүрлі сәуле жолдарының тереңдігі (нөмірленген) және бағыттары бойынша өтуін бағ\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет A7: a Көлеңке режимдері жарықтың әртүрлі сәуле жолдарының тереңдігі (нөмірленген) және бағыттары бойынша өтуін бағалайды.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Сурет A7: a Көлеңке режимдері жарықтың әртүрлі сәуле жолдарының тереңдігі (нөмірленген) және бағыттары бойынша өтуін бағалайды. Жергілікті көлеңке тек 0-тереңдіктегі көру сәулелерін (қара) қадағалайды. Қосымша ретінде, екінші реттік көлеңке сәулелері (сары) жарық көзіне қарай қадағаланады. Қоршаған орта окклюзиясы 1 бағытты ерікті бағыттарда (көк) қадағалайды. Жол трассировкасы ерікті тереңдіктер (қызыл) бойынша толық өтуді бағалайды. Көлеңке режимдері осы тәртіпте (түрлі-түсті) көбейіп бара жатқан блоктар санына қол жеткізе алады. b 2.2 TB H01WM стационарлық кескіні үшін кадр уақыттары. Күрделірек көлеңке режимдері көбірек көлем блоктарына кіргендіктен, рендерлеу өнімділігі төмендейді. c 1024 конвергенция кадрларынан кейін H01WM кескінін рендерлеу. Көлеңке режимдерін дереу кері байланыспен өзгертуге болады. Жергілікті көлеңке жылдам болғанымен, көлеңкелер немесе қоршаған орта окклюзиясы құрылымдардың визуалды қабылдауын жақсартады. Жол трассировкасы ең жоғары визуалды дәлдікті ұсынады, мысалы, қызғылт сары нейрондардан жанама жарық қайтуын бағалау.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS8.jpg\" alt=\"Сурет S8\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S8&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS8-2.jpg\" alt=\"Сурет S8 (жалғасы 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S8 (жалғасы 2)&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Терабайттық&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;деректерді&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;талдау&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қиындығы&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&
