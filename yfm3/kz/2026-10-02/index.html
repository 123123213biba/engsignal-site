onge-sio2-aerogel-composites-with-anisotropic.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/l-band-single-photon-generation-from-a-cavity-coupled-silico-card.jpg"},"content":{"title":"Кремний C-орталықтары: L-диапазонындағы кванттық желілер үшін жаңа стандарт","text":"&lt;p&gt;Ғалымдар кремнийдегі жалғыз C-орталықты бөліп алды, бұл телекоммуникациялық толқындарда масштабталатын кванттық байланысқа жол ашады.&lt;/p&gt;\n","links":[{"url":"2026-10-02/l-band-single-photon-generation-from-a-cavity-coupled-silico.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/machine-learning-potential-for-calcium-silicate-hydrates-wit-card.jpg"},"content":{"title":"Цементтің цифрлық егізі: нейрондық желілер бетон беріктігін қалай болжайды","text":"&lt;p&gt;Ғалымдар CSH-MLP жасады — бұл цементтің мінез-құлқын кванттық физика дәлдігімен модельдейтін нейрондық желілік әлеует.&lt;/p&gt;\n","links":[{"url":"2026-10-02/machine-learning-potential-for-calcium-silicate-hydrates-wit.html","text":"Оқу","arrow":true,"theme":"normal"}]}}]}],"links":[]},"meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Шығарылым 2026-10-02","vcsPath":"2026-10-02/index.yaml"},"title":"Шығарылым 2026-10-02"},"router":{"pathname":"2026-10-02/index","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
