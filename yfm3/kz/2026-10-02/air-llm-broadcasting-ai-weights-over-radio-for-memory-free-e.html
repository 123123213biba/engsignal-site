        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"262\" cy=\"86\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"498\" cy=\"240\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · OTHER   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;AIR-LLM: жад пен жүктеусіз&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;нейрондық желілерді іске&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;қосу&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-f2.jpg\" alt=\"Сурет 2. Әр раундта GEMV операциясының 𝐴 ішкі көбейтіндісін (IP) (немесе нақты мәнді болса 2𝐴) орындайтын AIR-LLM RF есе\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 2. Әр раундта &lt;a href=\"concepts/general-matrix-vector-multiplication.html\"&gt;GEMV&lt;/a&gt; операциясының 𝐴 ішкі көбейтіндісін (IP) (немесе нақты мәнді болса 2𝐴) орындайтын &lt;a href=\"concepts/air-llm.html\"&gt;AIR-LLM&lt;/a&gt; RF есептеу қозғалтқышына шолу.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Сурет 2. Әр раундта GEMV операциясының 𝐴 ішкі көбейтіндісін (IP) (немесе нақты мәнді болса 2𝐴) орындайтын AIR-LLM RF есептеу қозғалтқышына шолу. Орталық радиостанция бұл IP салмақтарын пайдаланушыға арналған алдын ала кодтаусыз өзінің 𝐴 антеннасы арқылы таратады. Содан кейін әрбір шеткі құрылғы қабылданған 𝐴 салмақ толқын пішіндерін өзінің GEMV кірісімен бірге 𝐶 калибрлеу блоктарына береді, олардың прекодерлері мен посткодерлері &lt;a href=\"concepts/svd.html\"&gt;SVD&lt;/a&gt; негізіндегі бастапқы баптау және ALS негізіндегі дәл баптау арқылы сол пайдаланушының өз арнасынан алынады. 𝐶 блоктарының шығыстарын қосындылау осы раундтың GEMV шығысын береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;AIR-LLM нейрондық желі есептеулерін жергілікті жадтан радиожиілік доменіне ауыстырады. Орталық станция модель салмақтарын OFDM сигналдары арқылы таратады, ал пайдаланушы құрылғысы қарапайым RF-миксер көмегімен матрицалық-векторлық көбейтуді (GEMV) орындайды. Бұл деректерді оқуға кететін энергияны үнемдеп, жады шектеулі құрылғыларда LLM-ді іске қосуға мүмкіндік береді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Есептеулер миксерлер арқылы аналогтық RF-доменде орындалады&lt;/li&gt;\n&lt;li&gt;FP16 есептеулеріне қарағанда 157,7 есе энергия үнемдеу&lt;/li&gt;\n&lt;li&gt;Масштабтау: бір тарату шексіз пайдаланушыға қызмет етеді&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;AIR-LLM негізінде радиожиілік миксерін (&lt;a href=\"concepts/rf-mixer.html\"&gt;RF mixer&lt;/a&gt;) есептеу түйіні ретінде пайдалану жатыр. Миксер сигналдарды уақыт доменінде аналогтық түрде көбейтеді, бұл жиілік доменіндегі сызықтық конволюцияға эквивалентті. GEMV (General Matrix-Vector Multiplication) операциясын жүзеге асыру үшін модель салмақтары OFDM-тасымалдаушыларына кодталады, ал активтендірулер жергілікті осциллятор арқылы беріледі. Нәтижесінде шығыс сигналының ортаңғы тасымалдаушысы векторлардың скалярлық көбейтіндісін қамтиды, бұл барлық аралық деректерді цифрландырмай-ақ нәтижені алуға мүмкіндік береді.&lt;/p&gt;\n&lt;p&gt;Масштабтау үшін жүйе MIMO-мультиплекстеуді (Multiple-Input Multiple-Output) қолданады және бір уақытта бірнеше салмақ ағынын таратады. Арнаны калибрлеу прекодер мен посткодер жұбы арқылы жүзеге асырылады, бұл клиент жағындағы есептеу шығындарын азайтады. NVIDIA Sionna &lt;a href=\"concepts/ray-tracing.html\"&gt;сәулелерді қадағалау&lt;/a&gt; (ray-tracing) көмегімен LLaMA-3.1-8B моделінде өткізілген сынақтарда бұл әдіс FP16-мен салыстырғанда энергия шығынын 157,7 есе азайтып, 20 пайдаланушы үшін тарату уақытын 104,1 есе қысқартты.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу NVIDIA Sionna арналарын модельдеуге және бір типті RF-миксер профиліне негізделген, бұл нақты ортадағы кедергілерді толық қамтымайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Қазіргі заманғы үлкен тілдік модельдер (LLM) бұлтты инфрақұрылымдардан перифериялық құрылғыларға белсенді түрде ауысуда. Алайда, мұндай құрылғылар көбінесе жадтың жетіспеушілігі немесе модель салмақтарын жүктеу кезіндегі жоғары энергия шығыны сияқты шектеулерге тап болады. Авторлар мынадай сұрақ қояды: LLM инференсін салмақтарды жергілікті сақтамай немесе алдын ала жүктемей, оларды «әуе арқылы» қабылдап, нақты уақыт режимінде өңдеу мүмкін бе?&lt;/p&gt;\n&lt;p&gt;AIR-LLM тұжырымдамасы ұсынылған, ол орталық радиотораптан (мысалы, 5G базалық станциясы) және перифериялық пайдаланушыдан тұрады. Радиоторап модель салмақтарын эфирге таратады, ал пайдаланушы құрылғысы радиожиілік (РЖ) араластырғыштарды пайдалана отырып, тікелей РЖ доменінде жалпы матрицалық-векторлық көбейту (GEMV) операциясын орындайды. Деректерді тасымалдау уақытын оңтайландыру үшін MIMO кеңістіктік мультиплекстеу және сымсыз арнаны калибрлеу үшін энергияны үнемдейтін прекодер-посткодер жұбы қолданылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AIR-LLM салмақтарды сақтамай-ақ инференсті орындауға мүмкіндік береді, FP16 базалық деңгейімен салыстырғанда 157,7 есе энергияны үнемдейді және 20 пайдаланушымен жұмыс істегенде тасымалдау уақытын 104,1 есе қысқартады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GEMV (General Matrix-Vector Multiplication) — бұл нейрондық желілер жұмысының негізі болып табылатын математикалық операция, мұнда салмақтар матрицасы кіріс векторына көбейтіледі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жүйе NVIDIA Sionna симуляторының көмегімен екі қалалық сценарийде, нақты РЖ араластырғыштардың сипаттамаларын ескере отырып сыналды. LLaMA-3.1-8B моделімен жұмыс істегенде WikiText-2 деректер жиынындағы перплексияның деградациясы небәрі 4,0%-ды құрады. Жүйе ауқымды, себебі орталық радиоторап пайдаланушыларды сәйкестендіруді талап етпейді, бұл қамту аймағындағы шексіз абоненттерге қызмет көрсетуге мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нәтижелер NVIDIA Sionna ортасындағы симуляциялар мен РЖ араластырғыштардың профильдеуіне негізделген, бұл нақты аппараттық жабдықтағы жұмыс жағдайларынан өзгеше болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;h4 id=\"llm-di-shetki-khurylghylargha-engizu\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#llm-di-shetki-khurylghylargha-engizu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;LLM-ді шеткі құрылғыларға енгізу&lt;/span&gt;&lt;/a&gt;LLM-ді шеткі құрылғыларға енгізу&lt;/h4&gt;\n&lt;p&gt;Бүгінгі таңда триллиондаған шеткі құрылғылар денсаулықты бақылау, сөзді тану және автономды көлік жүргізу сияқты қолданбалар үшін машиналық оқыту әдістерін белсенді қолдануда. Үлкен тілдік модельдер (LLM) табиғи тілді түсіну мен өңдеуде бірегей мүмкіндіктер береді, алайда оларды шеткі құрылғыларда пайдалану негізінен бұлттық есептеулерге тәуелді. Бұл деректердің құпиялылығы мен сигналдарды берудегі кідірістерге қатысты мәселелерді туындатады. Негізгі кедергі — модельдердің үлкен көлемі: мысалы, LLaMA-3.1-8B моделі FP16 форматында 16 ГБ, ал 4-биттік кванттаудан (WoQ) кейін де 4 ГБ жадты қажет етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LLM-ді шеткі құрылғыларда орналастырудың басты қиындығы — жад көлемінің жеткіліксіздігі және салмақ коэффициенттерін жадтан есептеу блогына тасымалдауға кететін жоғары энергия шығыны.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Кванттау (&lt;a href=\"concepts/quantization.html\"&gt;quantization&lt;/a&gt;) — модель параметрлерінің дәлдігін төмендету арқылы оның жадтағы көлемін азайту әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;LLM-де қорытынды шығару (inference) процесі жадтың өткізу қабілетімен шектелген: бір салмақты оқу тек екі өзгермелі нүктелі операцияны (FLOPs) қамтамасыз етеді. Нәтижесінде, деректерді тасымалдауға кететін энергия есептеу процесінің өзіне қарағанда әлдеқайда жоғары. Жад ішіндегі есептеулер (ReRAM, PCM, SRAM) немесе эфир арқылы есептеулер (over-the-air) сияқты әдістер аппараттық шектеулерге (мысалы, 128×128 кроссбарлар) байланысты қазіргі LLM-дер үшін тиімсіз.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қолданыстағы аппараттық шешімдер (мысалы, 128×128 кроссбарлар) матрицалық есептеулердің көлемін шектеп тастайды, бұл өсіп келе жатқан LLM архитектуралары үшін жарамсыз.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз қолданыстағы 5G желілерінің мүмкіндіктерін пайдалануды ұсынамыз. 5G базалық станциясы арқылы салмақ коэффициенттерін барлық пайдаланушыларға бір уақытта хабар тарату (broadcasting) арқылы жеткізуге болады. Есептеулер үшін біз қабылдағыштарда бар пассивті радиожиілікті (RF) араластырғыштарды қолданатын RF-есептеу әдісін ұсынамыз. Бұл сигнал келген сәтте есептеуді аналогтық түрде аяқтауға мүмкіндік береді, осылайша салмақтарды цифрландыру немесе жергілікті жадта сақтау қажеттілігі жойылады.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 1.&lt;/strong&gt; AIR-LLM мен қолданыстағы шеткі есептеу парадигмаларын салыстыру&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;1&lt;/th&gt;\n&lt;th&gt;2&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;2&lt;/td&gt;\n&lt;td&gt;2&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h4 id=\"air-llm-esepteu-paradigmasy\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#air-llm-esepteu-paradigmasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AIR-LLM есептеу парадигмасы&lt;/span&gt;&lt;/a&gt;AIR-LLM есептеу парадигмасы&lt;/h4&gt;\n&lt;p&gt;AIR-LLM — бұл LLM инференсіне арналған архитектура, мұнда орталық радиостанция (мысалы, 5G мұнарасы) модель салмақтарын OFDM сигналының жиілік спектріне кодтап, таратады. Қамту аймағындағы кез келген құрылғы бұл сигналды қабылдап, есептеулерді тікелей өзінің радиожиілік (RF) трактында орындайды. Негізгі элемент — RF-араластырғыш (mixer), ол сигналдарды уақыт доменінде көбейтеді, бұл жиілік доменіндегі сызықтық конволюцияға эквивалентті. Жергілікті осцилляторға активтену сигналы берілгенде, салмақтар спектрінің активтену спектрімен конволюциясы жүреді, ал нәтиженің орталық ішкі тасымалдаушысы (subcarrier) салмақтар мен активтену векторларының скалярлық көбейтіндісін береді. Парадигмаларды салыстыру 1-кестеде көрсетілген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AIR-LLM RF-араластырғыштарды пайдаланып, GEMV операцияларын тікелей радиоарнада орындайды, бұл жергілікті жадқа жүгіну қажеттілігін жояды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жүйе A × A MIMO кеңістіктік мультиплексирлеуін пайдаланып, бір уақытта A салмақ ағынын таратады, бұл эфир уақытын A есе қысқартады. Арнаны компенсациялау үшін C блокты калибрлеу қолданылады, бұл матрица инверсиясынан әлдеқайда арзан. AIR-LLM пайдаланушылармен «қол алысуды» (handshake) немесе SNR-ге қарай модуляция схемасын (MCS) бейімдеуді талап етпейді, өйткені есептеулер термиялық шуға төзімді. Париж және Мюнхен сценарийлерінде 1B-ден 70B параметрге дейінгі модельдерде (LLaMA-3.1-8B) дәлдіктің (&lt;a href=\"concepts/perplexity.html\"&gt;PPL&lt;/a&gt;) төмендеуі небәрі 4.0% құрады. Бір токенге кететін энергия қашықтағы жадтағы FP16/4-биттік салмақтармен салыстырғанда 157.7/40.4 есе, ал жергілікті жадтан алумен салыстырғанда 51.5/13.9 есе азайды. Эфир уақыты 104.1/26.0 есе қысқарды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GEMV (General Matrix-Vector Multiplication) — нейрондық желілердегі негізгі операция, мұнда салмақтар матрицасы активтену векторына көбейтіледі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ofdm-zhaene-mimo-arna-modeli\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#ofdm-zhaene-mimo-arna-modeli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;OFDM және MIMO арна моделі&lt;/span&gt;&lt;/a&gt;OFDM және MIMO арна моделі&lt;/h4&gt;\n&lt;p&gt;Сигналдар Nfft FFT өлшемі мен B жолағы бар OFDM негізінде құрылған, мұнда ішкі тасымалдаушылар аралығы Δ f = B/Nfft. A_t × A_r MIMO жүйесінде таратылатын сигнал &lt;span class=\"yfm-latex\" data-content=\"S_t%20%5Cin%20%5Cmathbb%7BC%7D%5E%7BA_t%20%20imes%20N_%7B%20ext%7Bfft%7D%7D%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; және қабылданған сигнал &lt;span class=\"yfm-latex\" data-content=\"S_r%20%5Cin%20%5Cmathbb%7BC%7D%5E%7BA_r%20%20imes%20N_%7B%20ext%7Bfft%7D%7D%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; арна &lt;span class=\"yfm-latex\" data-content=\"H%20%5Cin%20%5Cmathbb%7BC%7D%5E%7BA_t%20%20imes%20A_r%20%20imes%20N_%7B%20ext%7Bfft%7D%7D%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; арқылы байланысқан. Қабылданған сигнал (1) формуласымен анықталады:&lt;br /&gt;\n&lt;span class=\"yfm-latex\" data-content=\"S_r%5Ba_r%2C%20k%5D%20%3D%20%5Csum_%7Ba_t%3D0%7D%5E%7BA_t-1%7D%20H%5Ba_t%2C%20a_r%2C%20k%5D%20%5Ccdot%20S_t%5Ba_t%2C%20k%5D%20%2B%20%5Cfrac%7B%5Csigma%7D%7B%5Csqrt%7BN_%7B%20ext%7Bfft%7D%7D%7D%7D%20%5Ccdot%20N\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;&lt;br /&gt;\nмұнда σ² — AWGN шу қуаты. Қабылдаушы жағында сигналды қалпына келтіру үшін (2) псевдо-кері матрица қолданылады, бұл 8A_t A_r Nfft өзгермелі нүктелі операцияны талап етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Арна инверсиясы арқылы сигналды қалпына келтіру құрылғы жағында айтарлықтай есептеу ресурстарын талап етеді, бұл үлкен MIMO өлшемдерінде тиімділікті шектейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"keshendi-maendi-syzykhtykh-konvolyuciya\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#keshendi-maendi-syzykhtykh-konvolyuciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кешенді мәнді сызықтық конволюция&lt;/span&gt;&lt;/a&gt;Кешенді мәнді сызықтық конволюция&lt;/h4&gt;\n&lt;p&gt;Радиожиілік (РЖ) араластырғыш Δ f қадамы бар екі кіріс сигналы арасында кешенді мәнді сызықтық конволюцияны (∗) орындауға мүмкіндік береді. FFT өлшемі (Nfft) бірдей деп алсақ, кіріс сигналы &lt;span class=\"yfm-latex\" data-content=\"X%20%5Cin%20%5Cmathbb%7BC%7D%5E%7BN_%7B%20ext%7Bfft%7D%7D%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; және салмақ сигналы &lt;span class=\"yfm-latex\" data-content=\"W%20%5Cin%20%5Cmathbb%7BC%7D%5E%7BN_%7B%20ext%7Bfft%7D%7D%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (3)-формула бойынша &lt;span class=\"yfm-latex\" data-content=\"Y%20%5Cin%20%5Cmathbb%7BC%7D%5E%7B2N_%7B%20ext%7Bfft%7D%7D-1%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; шығыс сигналын құрайды: &lt;span class=\"yfm-latex\" data-content=\"Y%5Bk%5D%20%3D%20(W%20*%20X)%5Bk%5D%20%3D%20%5Csum_%7Bk'%7D%20W%5Bk'%5D%20%5Ccdot%20X%5Bk-k'%5D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;РЖ-араластырғыш конволюция операциясын аппараттық деңгейде орындап, кешенді сигналдарды тиімді өңдейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"gemv/ip-ueshin-syzykhtykh-konvolyuciyany-kholdanu\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#gemv/ip-ueshin-syzykhtykh-konvolyuciyany-kholdanu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GEMV/IP үшін сызықтық конволюцияны қолдану&lt;/span&gt;&lt;/a&gt;GEMV/IP үшін сызықтық конволюцияны қолдану&lt;/h4&gt;\n&lt;p&gt;ML қорытындылау негізінде жатқан Y = W · X (&lt;span class=\"yfm-latex\" data-content=\"W%20%5Cin%20%5Cmathbb%7BR%7D%5E%7BM%20%20imes%20N%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"X%20%5Cin%20%5Cmathbb%7BR%7D%5EN\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;) матрица-вектор көбейтіндісі (GEMV) M тәуелсіз скалярлық көбейтіндіге (IP) бөлінеді. (3)-конволюция кешенді болғандықтан, бір сигнал жұбы екі IP-ді тасымалдай алады. W матрицасының m және m' жолдары үшін Nfft = N болғанда, кіріс сигналы X тікелей беріледі, ал салмақ сигналы Wm,m'[k] = W[m, N-1-k] + j · W[m', N-1-k] (4) түрінде кодталады. (5)-формулаға сәйкес, орталық ішкі тасымалдаушы Y[N-1] нәтижені Y[m] + j · Y[m'] ретінде сақтайды. Қалған 2N-2 ішкі тасымалдаушылар Δ f жолақты төмен жиілікті сүзгі (ТЖС) арқылы кесіледі. Бұл АЦП энергия шығынын азайтады, себебі тек бір ішкі тасымалдаушыны цифрлау жеткілікті. Барлығы &lt;span class=\"yfm-latex\" data-content=\"%5Clceil%20M%2F2%20%5Crceil\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; салмақ сигналы қажет.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GEMV — бұл матрицаны векторға көбейту операциясы; мұнда ол есептеу жылдамдығын арттыру үшін аналогтық радио сигналға «оралады».&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"rzh-esepteu-khozghaltkhyshy\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#rzh-esepteu-khozghaltkhyshy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;РЖ есептеу қозғалтқышы&lt;/span&gt;&lt;/a&gt;РЖ есептеу қозғалтқышы&lt;/h4&gt;\n&lt;p&gt;AIR-LLM архитектурасы (2-сурет) MIMO жүйесін пайдаланады, мұнда эфирге таратылатын салмақтар арнасы аналогтық GEMV үшін бейімделген пре-кодер және пост-кодер жұбымен калибрленеді.&lt;/p&gt;\n&lt;h4 id=\"maeseleni-tuzhyrymdau\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#maeseleni-tuzhyrymdau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мәселені тұжырымдау&lt;/span&gt;&lt;/a&gt;Мәселені тұжырымдау&lt;/h4&gt;\n&lt;p&gt;Біз A × A MIMO жүйесін қарастырамыз. Бұл A санына дейінгі параллель кеңістіктік ағындарды қолдайды, бұл бір циклде 2A скалярлық көбейтіндіні орындауға мүмкіндік береді. GEMV &lt;span class=\"yfm-latex\" data-content=\"%5Clceil%20M%2F(2A)%20%5Crceil\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; циклді талап етеді.&lt;/p&gt;\n&lt;h4 id=\"kalibrleu-blogyn-zhobalau\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#kalibrleu-blogyn-zhobalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Калибрлеу блогын жобалау&lt;/span&gt;&lt;/a&gt;Калибрлеу блогын жобалау&lt;/h4&gt;\n&lt;p&gt;Калибрлеу блогы (3-сурет) мыналарды орындайды: (i) x сигналын цифрлық пре-кодтау және IFFT, (ii) аналогтық A жолға дубликаттау, (iii) W' сигналдарымен араластыру және сүзу, (iv) цифрлық пост-кодтау.&lt;/p&gt;\n&lt;h4 id=\"ishki-tasymaldaushylardy-kalibrleu-ueshin-pre-kodtau\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#ishki-tasymaldaushylardy-kalibrleu-ueshin-pre-kodtau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ішкі тасымалдаушыларды калибрлеу үшін пре-кодтау&lt;/span&gt;&lt;/a&gt;Ішкі тасымалдаушыларды калибрлеу үшін пре-кодтау&lt;/h4&gt;\n&lt;p&gt;Пре-кодер &lt;span class=\"yfm-latex\" data-content=\"P_%7B%20ext%7Bpre%7D%7D%20%5Cin%20%5Cmathbb%7BC%7D%5E%7BN_%7B%20ext%7Bfft%7D%7D%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; арнаның біркелкі емес жиіліктік жауабын өтейді. x'[k] = x[k] · Ppre[k] (6) сигналы пре-кодермен элемент бойынша көбейтіледі.&lt;/p&gt;\n&lt;h4 id=\"analogtykh-pre-kodtalghan-konvolyuciya\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#analogtykh-pre-kodtalghan-konvolyuciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Аналогтық пре-кодталған конволюция&lt;/span&gt;&lt;/a&gt;Аналогтық пре-кодталған конволюция&lt;/h4&gt;\n&lt;p&gt;x' сигналы A РЖ-араластырғышына беріледі, олар параллель конволюцияны орындайды: &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7By%7D_a%20%3D%20w'_a%7B%7D%5E%20op%20%5Ccdot%20x'\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (7).&lt;/p&gt;\n&lt;h4 id=\"antennalardy-kalibrleu-ueshin-post-kodtau\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#antennalardy-kalibrleu-ueshin-post-kodtau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Антенналарды калибрлеу үшін пост-кодтау&lt;/span&gt;&lt;/a&gt;Антенналарды калибрлеу үшін пост-кодтау&lt;/h4&gt;\n&lt;p&gt;Пост-кодер &lt;span class=\"yfm-latex\" data-content=\"P_%7B%20ext%7Bpost%7D%7D%20%5Cin%20%5Cmathbb%7BC%7D%5E%7BA%20%20imes%20A%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; антеннааралық кедергілерді жояды: &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7By%7D'_a%20%3D%20%5Csum_%7Ba'%3D0%7D%5E%7BA-1%7D%20P_%7B%20ext%7Bpost%7D%7D%5Ba%2C%20a'%5D%20%5Ccdot%20%5Chat%7By%7D_%7Ba'%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (8).&lt;/p&gt;\n&lt;h4 id=\"kalibrleu-bloktary-arasyndaghy-yntymakhtastykh\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#kalibrleu-bloktary-arasyndaghy-yntymakhtastykh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Калибрлеу блоктары арасындағы ынтымақтастық&lt;/span&gt;&lt;/a&gt;Калибрлеу блоктары арасындағы ынтымақтастық&lt;/h4&gt;\n&lt;p&gt;Әртүрлі Ppre және Ppost бар C калибрлеу блогы қолданылады. Соңғы шығыс &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7By%7D''_a%20%3D%20%5Csum_%7Bc%3D0%7D%5E%7BC-1%7D%20%5Chat%7By%7D'_%7Bc%2Ca%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (9) барлық блоктар нәтижелерін жинақтайды.&lt;/p&gt;\n&lt;h4 id=\"prekoder-men-postkoderdi-ongtajlandyru\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#prekoder-men-postkoderdi-ongtajlandyru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Прекодер мен посткодерді оңтайландыру&lt;/span&gt;&lt;/a&gt;Прекодер мен посткодерді оңтайландыру&lt;/h4&gt;\n&lt;p&gt;AIR-LLM-нің басты мақсаты — соңғы шығыс сигналы &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7By%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; мен нақты сигнал y арасындағы орташа квадраттық қатені (MSE) азайту. Ол үшін Ppre прекодері мен Ppost посткодері барлық калибрлеу блоктары бойынша бірлесіп оңтайландырылады. OPT-Orig есебі былайша тұжырымдалады:&lt;/p&gt;\n&lt;p&gt;&lt;span class=\"yfm-latex\" data-content=\"P%5E%7B%5Cstar%7D_%7Bpre%7D%2C%20P%5E%7B%5Cstar%7D_%7Bpost%7D%20%3D%20%5Carg%20%5Cmin_%7BP_%7Bpre%7D%2C%20P_%7Bpost%7D%7D%20%5Cmathbb%7BE%7D_%7Bx%2C%20W%7D%20%5Cleft%5B%20%5Cfrac%7B1%7D%7BA%7D%20%5Csum_%7Ba%3D0%7D%5E%7BA-1%7D%20%5C%2F%20%5Chat%7By%7D_a%20-%20y_a%20%5C%2F%5E2%20%5Cright%5D%20%5Cquad%20(10)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оңтайландыру тек арна сипаттамаларына тәуелді қатені азайтуға бағытталған, бұл қымбат онлайн оқытуды қажет етпейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;W және x мәндері алдын ала белгісіз болғандықтан, OPT-Orig-ті тікелей шешу қиын. Алайда, мақсатты функция (W, x)-ке қатысты билинейлі болғандықтан, ол тек бірінші және екінші реттік статистикаға тәуелді. Жоғары SNR (сигнал-шу қатынасы) жағдайында есеп OPT-Chan түріне келтіріледі:&lt;/p&gt;\n&lt;p&gt;&lt;span class=\"yfm-latex\" data-content=\"P%5E%7B%5Cstar%7D_%7Bpre%7D%2C%20P%5E%7B%5Cstar%7D_%7Bpost%7D%20%3D%20%5Carg%20%5Cmin_%7BP_%7Bpre%7D%2C%20P_%7Bpost%7D%7D%20%5Csum_%7Bk%3D0%7D%5E%7BN_%7Bfft%7D-1%7D%20%5Csum_%7Bc%3D0%7D%5E%7BC-1%7D%20%5C%2F%20P_%7Bpre%7D%5Bc%2C%20k%5D%20%5Ccdot%20P_%7Bpost%7D%5Bc%2C%20%3A%2C%20%3A%5D%20%5Ccdot%20H%5B%3A%2C%20%3A%2C%20k%5D%5ET%20-%20I_A%20%5C%2F%5E2%20%5Cquad%20(12)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;&lt;/p&gt;\n&lt;p&gt;Мұнда I_A — A × A өлшемді бірлік матрица. Мақсат — әрбір ішкі тасымалдаушы үшін арна әсерін нөлге теңестіру.&lt;/p&gt;\n&lt;h4 id=\"1-khadam-initializaciya-ueshin-zhuykhtau\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#1-khadam-initializaciya-ueshin-zhuykhtau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1-қадам: инитиализация үшін жуықтау&lt;/span&gt;&lt;/a&gt;1-қадам: инитиализация үшін жуықтау&lt;/h4&gt;\n&lt;p&gt;OPT-Chan-ды шешу үшін екі кезеңді тәсіл қолданылады. Алдымен OPT-Approx жуықтауы қолданылады, онда арна амплитудаларының салмақтық әсері ескерілмейді:&lt;/p&gt;\n&lt;p&gt;&lt;span class=\"yfm-latex\" data-content=\"P%5E%7B(0)%7D_%7Bpre%7D%2C%20%20ilde%7BP%7D%5E%7B(0)%7D_%7Bpost%7D%20%3D%20%5Carg%20%5Cmin_%7B%20ilde%7BP%7D_%7Bpost%7D%2C%20%20ilde%7BP%7D_%7Bpre%7D%7D%20%5C%2F%20%20ilde%7BP%7D_%7Bpost%7D%20%5Ccdot%20P_%7Bpre%7D%20-%20%20ilde%7BH%7D%5E%7B-1%7D%20%5C%2F%5E2%20%5Cquad%20(13)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SVD (сингулярлық мәндер декомпозициясы) — матрицаны оның ең маңызды компоненттерін бөліп алу үшін бөлшектеу әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мұнда  ildePpost — C × A² өлшемді «тегістелген» посткодер. Эккарт-Янг-Мирский теоремасына сәйкес, есеп  ildeH⁻¹ матрицасының SVD көмегімен шешіледі.&lt;/p&gt;\n&lt;h4 id=\"2-khadam-iteraciyalykh-nakhtylau-als\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#2-khadam-iteraciyalykh-nakhtylau-als\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2-қадам: итерациялық нақтылау (ALS)&lt;/span&gt;&lt;/a&gt;2-қадам: итерациялық нақтылау (ALS)&lt;/h4&gt;\n&lt;p&gt;P⁽⁰⁾ инитиализациясынан бастап, ALS (alternating least squares) әдісі қолданылады: алдымен Ppost бекітіліп, Ppre оңтайландырылады, содан кейін керісінше. Бұл процесс бірнеше итерацияда жинақталады.&lt;/p&gt;\n&lt;h4 id=\"zhueje-tiimdiligin-taldau\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#zhueje-tiimdiligin-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жүйе тиімділігін талдау&lt;/span&gt;&lt;/a&gt;Жүйе тиімділігін талдау&lt;/h4&gt;\n&lt;p&gt;AIR-LLM тиімділігі арна уақыты мен энергия шығынымен өлшенеді. Арна уақыты A антенналар санына және B өткізу қабілетіне кері пропорционал. AIR-LLM пайдаланушылар үшін сигналдарды бейімдемейді, бұл оны хабар тарату (broadcasting) үшін өте тиімді етеді.&lt;/p&gt;\n&lt;h4 id=\"energiyany-taldau\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#energiyany-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Энергияны талдау&lt;/span&gt;&lt;/a&gt;Энергияны талдау&lt;/h4&gt;\n&lt;p&gt;Энергия тиімділігі аппараттық компоненттер шығындарын амортизациялау арқылы жүзеге асады. RF миксері мен төмен жиілікті сүзгі (LPF) кіріс өлшемін бір ішкі тасымалдаушыға дейін қысқартады, бұл ADC жүктемесін азайтады. Прекодтау және IFFT әрбір GEMV үшін бір рет орындалады, ал олардың құны M шығыс көлемі бойынша бөлінеді.&lt;/p&gt;\n&lt;h4 id=\"esepteu-daeldigi,-efir-uakhyty-zhaene-energiya-arasyndaghy-ymyra\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#esepteu-daeldigi,-efir-uakhyty-zhaene-energiya-arasyndaghy-ymyra\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Есептеу дәлдігі, эфир уақыты және энергия арасындағы ымыра&lt;/span&gt;&lt;/a&gt;Есептеу дәлдігі, эфир уақыты және энергия арасындағы ымыра&lt;/h4&gt;\n&lt;p&gt;Калибрлеу блоктарының саны C — бұл үш көрсеткішті байланыстыратын негізгі параметр. OPT-Chan арналарды C дәрежелі жуықтаумен калибрлейді: C артқан сайын қалдық қателік азайып, дәлдік артады, бірақ көбірек антенналар A қажет болады. Энергия тұрғысынан әрбір шығын C-ге сызықтық тәуелді. Сондықтан A-ны арттыру эфир уақытын қысқартады, бірақ энергия шығынын көбейтеді. C мәні мақсатты дәлдікке жету үшін минималды болуы тиіс.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;C-ны таңдау — бұл дәлдік пен энергия шығыны арасындағы тепе-теңдікті сақтау.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"iske-asyru\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#iske-asyru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Іске асыру&lt;/span&gt;&lt;/a&gt;Іске асыру&lt;/h4&gt;\n&lt;p&gt;AIR-LLM нақты қалалық ортада сәулелерді қадағалау (ray-tracing) симуляторы және нақты РЖ араластырғыштың бұрмалануы негізінде сыналды.&lt;/p&gt;\n&lt;h4 id=\"sionna-arkhyly-arnany-modeldeu\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#sionna-arkhyly-arnany-modeldeu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sionna арқылы арнаны модельдеу&lt;/span&gt;&lt;/a&gt;Sionna арқылы арнаны модельдеу&lt;/h4&gt;\n&lt;p&gt;Орталық радио мен құрылғылар арасындағы арна NVIDIA Sionna (v2.0.1) ортасында модельденеді. Симулятор қала моделіне 10⁷ сәуле бағыттап, шағылысу мен дифракцияны ескереді. Бұл H арнасын қалыптастырады. 4-суретте (a) және (b) Париж (LOS тікелей көрінісі бар) және Мюнхен (көп жолды таралу, LOS жоқ) қалалары мысалға алынған.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сәулелерді қадағалау (ray-tracing) — радиотолқындардың кедергілерге соғылып таралуын физикалық модельдеу әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ortalykh-radio-konfiguraciyasy\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#ortalykh-radio-konfiguraciyasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Орталық радио конфигурациясы&lt;/span&gt;&lt;/a&gt;Орталық радио конфигурациясы&lt;/h4&gt;\n&lt;p&gt;Станция 10 м биіктікте орналасқан. Ол A=4 антеннаны (1,7 м қашықтықта) пайдаланады. Сигнал 3,5 ГГц жиілікте, 100 МГц жолақта таратылады. Әр антенна үшін қуат 50 дБм, қамту радиусы 100 м.&lt;/p&gt;\n&lt;h4 id=\"khurylghy-konfiguraciyasy\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#khurylghy-konfiguraciyasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Құрылғы конфигурациясы&lt;/span&gt;&lt;/a&gt;Құрылғы конфигурациясы&lt;/h4&gt;\n&lt;p&gt;100 құрылғы 1,5 м биіктікте кездейсоқ орналастырылған. Әрқайсысында C=8 калибрлеу блогы бар. Шу коэффициенті 4 дБ (-90 дБм шу шегі). Арнадағы жоғалтулар (PL) &lt;span class=\"yfm-latex\" data-content=\"-10%20%5Clog_%7B10%7D(E%5B%2FH%2F%5E2%5D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ретінде бағаланады.&lt;/p&gt;\n&lt;h4 id=\"rzh-aralastyrghyshty-profildeu\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#rzh-aralastyrghyshty-profildeu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;РЖ араластырғышты профильдеу&lt;/span&gt;&lt;/a&gt;РЖ араластырғышты профильдеу&lt;/h4&gt;\n&lt;p&gt;ZEM-4300+ араластырғышының бұрмалануы USRP X310 радиостанциялары көмегімен сымды стендте өлшенді. Шудың жоқтығына байланысты қателіктер тек араластырғыштың өзіне тән бұрмалануларға байланысты. Әр РЖ қуаты үшін ең жақсы тиімді биттер саны (ENOB) табылды.&lt;/p&gt;\n&lt;h4 id=\"gemv-benchmarki\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#gemv-benchmarki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GEMV бенчмаркі&lt;/span&gt;&lt;/a&gt;GEMV бенчмаркі&lt;/h4&gt;\n&lt;p&gt;Дәлдік ENOB-пен өлшенеді. 5-сурет (a) 100 пайдаланушы үшін ENOB-тың PL-ге тәуелділігін көрсетеді. Парижде (орташа PL 84,0 дБ) медиандық ENOB 3,97 битті (1,58–5,69 бит диапазоны), Мюнхенде (91,4 дБ) 2,91 битті (0,53–5,33 бит) құрады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ENOB тек PL-ге ғана тәуелді емес: 89–91 дБ PL аралығында дәлдік 2,01-ден 5,33 битке дейін өзгереді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;5-сурет (b) тарату қуатының (30-70 дБм) әсерін көрсетеді. Дәлдік әр 10 дБ үшін шамамен 1 битке өседі және кейін қанығады. Мюнхен мысалында, қуат 30 дБм-нен 60 дБм-ге дейін артқанда дәлдік 1,20-дан 3,55 битке дейін өсті, ал 70 дБм-де 3,87 битке жетті.&lt;/p&gt;\n&lt;h4 id=\"esepteu-daeldigi,-energiya-zhaene-efir-uakhytynyng-tepe-tengdigi\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#esepteu-daeldigi,-energiya-zhaene-efir-uakhytynyng-tepe-tengdigi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Есептеу дәлдігі, энергия және эфир уақытының тепе-теңдігі&lt;/span&gt;&lt;/a&gt;Есептеу дәлдігі, энергия және эфир уақытының тепе-теңдігі&lt;/h4&gt;\n&lt;p&gt;WISE жүйесінен айырмашылығы, A=C=1 болғанда AIR-LLM GEMV операциясының эфир уақытын қысқарту үшін MIMO қолданады, бұл уақыт антенна санына кері пропорционал (1/A). Алайда, арнаны компенсациялау үшін көбірек калибрлеу бірліктері C қажет, бұл энергия шығынын C-ге пропорционал арттырады. 6(a)-суретте Париждегі M=2A және N=4,096 болатын GEMV үшін осы компромисс көрсетілген. A-ны 2-ден 32-ге дейін арттыру уақыт бойынша 32 есе ұтыс береді. A=4 болғанда дәлдік (ENOB) 0,55 биттен (C=1) 3,97 битке (C=8) және 5,07 битке (C=10) дейін өседі; C-ні одан әрі арттыру энергия шығынын 1,5 есе көбейтіп, небәрі 0,43 бит пайда береді. 6(b)-суретте белгілі бір ENOB-қа жету үшін минималды энергия шығыны көрсетілген: 3 бит үшін шығындар 1,02×-ден 9,60×-ге дейін, 4 бит үшін A-ны 2-ден 32-ге дейін арттырғанда 1,54×-ден 13,59×-ге дейін өзгереді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Антенна саны A-ның артуы тарату уақытын қысқартады, бірақ арнаны C параметрі арқылы компенсациялау үшін энергия шығынын экспоненциалды арттырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"gemv-koelemin-masshtabtau\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#gemv-koelemin-masshtabtau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GEMV көлемін масштабтау&lt;/span&gt;&lt;/a&gt;GEMV көлемін масштабтау&lt;/h4&gt;\n&lt;p&gt;7(a)-суретте GEMV-ді N=M=2⁰-ден 2¹⁴-ке дейін масштабтау көрсетілген. N=M=2³-ке дейін дәлдік тұрақты (Парижде 5,58–5,75 бит), кейін көп сатылы есептеулерде ол 3,99–4,51 битке дейін төмендейді. 7(b)-суретте &lt;a href=\"concepts/flop.html\"&gt;FLOP&lt;/a&gt; үшін энергия шығыны FP16-мен салыстырылады. FP16 және WoQ (W4A16/W3A16) әдістерінде энергия тиімділігі тұрақты болса, AIR-LLM-де ол тапсырма масштабымен бірге өседі. Кіші GEMV-лерде цифрлық өңдеу, ал үлкендерінде DAC (сандық-аналогтық түрлендіргіш) шектеуші фактор болып табылады. Аналогтық жүйелерде басым болатын ADC (аналогтық-сандық түрлендіргіш) энергия шығыны мұнда N төмендету коэффициентінің арқасында нөлге жуық.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;FLOP — өзгермелі нүктелі операция; WoQ (Weights-only Quantization) — тек модель салмақтарын кванттау.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"llm-bojynsha-benchmarking\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#llm-bojynsha-benchmarking\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;LLM бойынша бенчмаркинг&lt;/span&gt;&lt;/a&gt;LLM бойынша бенчмаркинг&lt;/h4&gt;\n&lt;p&gt;Біз барлық салмақтар мен активтендіру GEMV-лері AIR-LLM арқылы аналогтық тәсілмен орындалатын толық LLM-дердің жұмысын сынақтан өткіздік.&lt;/p&gt;\n&lt;h4 id=\"wikitext-2-degi-perpleksiya-ppl\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#wikitext-2-degi-perpleksiya-ppl\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;WikiText-2-дегі перплексия (PPL)&lt;/span&gt;&lt;/a&gt;WikiText-2-дегі перплексия (PPL)&lt;/h4&gt;\n&lt;p&gt;2-кестеде 9 модель (LLaMA-3.2, LLaMA-3.1, LLaMA-2, Mistral-7B, Gemma-4) үшін 2048 тізбек ұзындығындағы PPL көрсетілген. Парижде (~4 бит дәлдік) AIR-LLM 9 модельдің 7-уінде ең үздік WoQ әдістерінен және 9-дың 4-уінде ең үздік аналогтық әдістерден озып түседі. Мюнхенде (~3 бит дәлдік) нәтижелер ұқсас. Бұл AIR-LLM-дегі шу мен бұрмалаулар LLM қорытындысына әсер етпейтінін растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бағалау белгілі параметрлі ENOB-ы бар арнайы байланыс арналары (Париж/Мюнхен) жағдайында өткізілді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"token-ueshin-energiya-shyghyny\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#token-ueshin-energiya-shyghyny\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Токен үшін энергия шығыны&lt;/span&gt;&lt;/a&gt;Токен үшін энергия шығыны&lt;/h4&gt;\n&lt;p&gt;8-суретте токен үшін энергия шығыны бейнеленген. LLaMA-3.1-8B моделінде AIR-LLM қашықтағы FP16-ға қарағанда 157,7 есе және қашықтағы W4A16-ға қарағанда 40,4 есе аз энергия жұмсайды. Жергілікті FP16 және W4A16-ға қарағанда ұтыс сәйкесінше 51,5× және 13,9× құрайды. Үнемдеу деректерді тасымалдау операцияларын алып тастау және ADC-нің тиімді жұмысының есебінен жүзеге асады.&lt;/p&gt;\n&lt;h4 id=\"tokenge-ketetin-efir-uakhyty\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#tokenge-ketetin-efir-uakhyty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Токенге кететін эфир уақыты&lt;/span&gt;&lt;/a&gt;Токенге кететін эфир уақыты&lt;/h4&gt;\n&lt;p&gt;9-суретте тоғыз LLM үшін AIR-LLM және екі қашықтағы базалық модельдің сымсыз арнаны пайдалану уақыты көрсетілген. Уақыт LLaMA-3.1-8B-дағы қашықтағы FP16-ға қатысты қалыпқа келтірілген. LLaMA-3.1-8B-да AIR-LLM FP16-ға қарағанда 5,11 есе және W4A16-ға қарағанда 1,28 есе аз уақыт алады. Бұл коэффициенттер барлық тоғыз модель үшін тұрақты, себебі тарату уақыты салмақтар санына пропорционал. Бір пайдаланушылық сценарийде W4A16-ға жақындық арнаның физикалық шектеулерімен түсіндіріледі: уақыт өткізу қабілеті B және антенналар саны A бойынша сызықтық масштабталады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AIR-LLM арна уақыты бойынша тұрақты артықшылыққа ие: FP16-дан 5,11 есе және W4A16-дан 1,28 есе жылдам.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Кесте 2.&lt;/strong&gt; Париж бен Мюнхендегі таңдалған пайдаланушылар үшін AIR-LLM-нің WikiText-2 PPL көрсеткіші, FP16, WoQ және аналогтық есептеу базалық желілерімен салыстырғанда&lt;/p&gt;\n&lt;table&gt;\n&lt; td&gt;\n&lt;td&gt;5.92&lt;/td&gt;\n&lt;td&gt;5.14&lt;/td&gt;\n&lt;td&gt;5.59&lt;/td&gt;\n&lt;td&gt;11.55&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;AIR-LLM @ Munich&lt;/td&gt;\n&lt;td&gt;12.20&lt;/td&gt;\n&lt;td&gt;8.92&lt;/td&gt;\n&lt;td&gt;7.37&lt;/td&gt;\n&lt;td&gt;4.99&lt;/td&gt;\n&lt;td&gt;6.47&lt;/td&gt;\n&lt;td&gt;5.12&lt;/td&gt;\n&lt;td&gt;5.78&lt;/td&gt;\n&lt;td&gt;10.17&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;†: 3.1-70B&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"tizbek-uzyndyghy-bojynsha-ppl\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#tizbek-uzyndyghy-bojynsha-ppl\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тізбек ұзындығы бойынша PPL&lt;/span&gt;&lt;/a&gt;Тізбек ұзындығы бойынша PPL&lt;/h4&gt;\n&lt;p&gt;3-кестеде тізбек ұзындығы 256-дан 16 384 токенге дейін өзгергендегі PPL көрсеткіші берілген. Контекст өскен сайын PPL төмендейді. AIR-LLM мен FP16 арасындағы алшақтық қысқарып, 2048 токеннен жоғары мәндерде Париж үшін 4,0% және Мюнхен үшін 17,3% шамасында тұрақталады. Бұл AIR-LLM-де есептеу қателігінің жинақталмайтынын көрсетеді. Әр токен үшін энергия мен уақыт тұрақты болып қалады, себебі олар токендер санына емес, қабат салмақтарын ағындық таратуға байланысты.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бағалау LLaMA-3.1-8B модельдері негізінде жүргізілді; нәтижелер басқа архитектуралар үшін өзгеше болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zhuejelik-faktorlardyng-aeseri\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#zhuejelik-faktorlardyng-aeseri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жүйелік факторлардың әсері&lt;/span&gt;&lt;/a&gt;Жүйелік факторлардың әсері&lt;/h4&gt;\n&lt;p&gt;Біз тарату қуатының, антенналар (A) және калибрлеу блоктарының (C) санын талдадық. 4-кестеде көрсетілгендей, Парижде 35 дБм қуатта PPL FP16-дан 9,1% жоғары, ал 60 дБм-де 3,8%-ды құрайды. Мюнхенде дәлдік жылу шуымен шектелген: PPL 60 дБм-де 8,8%-ға дейін жақсарады.&lt;/p&gt;\n&lt;p&gt;5-кестеде A мен C-нің әсері көрсетілген. A=4 болғанда PPL 8 блоктан кейін, ал A=8 болғанда 32 блоктан кейін тұрақталады. Тәжірибеде жақсы дәлдікке жету үшін A²/2 калибрлеу блогы жеткілікті, бұл энергияны 50%-ға үнемдейді. 6-кестеде 0,915 ГГц (ISM) және 28 ГГц (mmWave) диапазондары үшін нәтижелер берілген. 0,915 ГГц-те нәтижелер 3,5 ГГц-пен салыстырмалы (PPL айырмашылығы 0,42-ге дейін), ал 28 ГГц-те көп сәулелі таралудың сиректігіне байланысты Мюнхен пайдаланушысы үшін нәтижелер жарамсыз (PPL &amp;gt; 10²).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PPL (Perplexity) — тілдік модельдің сапа көрсеткіші; мән неғұрлым төмен болса, модель келесі токенді соғұрлым дәл болжайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"shetki-pajdalanushylar-ueshin-ppl\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#shetki-pajdalanushylar-ueshin-ppl\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шеткі пайдаланушылар үшін PPL&lt;/span&gt;&lt;/a&gt;Шеткі пайдаланушылар үшін PPL&lt;/h4&gt;\n&lt;p&gt;10-суретте Парижде (PL 70.0–99.9 дБ) және Мюнхенде (68.6–105.0 дБ) пайдаланушылардың орналасуы көрсетілген. LLaMA-3.1-8B моделі үшін AIR-LLM көмегімен орташа PPL Парижде 6.52 (W4A16 үшін 6.65), ал Мюнхенде 7.23 (W3A16 үшін 8.24) болды. 70-80% жағдайда AIR-LLM базалық әдістерден асып түседі. Париждегі бір пайдаланушыда PPL 255.27-ге дейін өсті, себебі көп сәулелі компоненттердің аздығынан H арна матрицасы дерлік ерекше (singular) болып қалды. Бұл мәселе H-ны жақсарту үшін A антенналар санын азайту арқылы шешіледі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AIR-LLM күрделі байланыс арналарында да сандық аналогтарға қарағанда төменірек PPL көрсеткішін қамтамасыз етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"energiya-tutynu\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#energiya-tutynu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Энергия тұтыну&lt;/span&gt;&lt;/a&gt;Энергия тұтыну&lt;/h4&gt;\n&lt;p&gt;AIR-LLM-нің әр токен үшін энергия тұтынуы (11(b)-сурет) тұрақты және арна жағдайларына тәуелді емес. Парижде AIR-LLM қашықтағы FP16/W4A16-ға қарағанда 160.5×/41.1×, ал жергілікті шешімдерге қарағанда 51.5×/13.9× аз энергия жұмсайды. Мюнхенде де ұқсас нәтижелер байқалған. Байланыс әдістерінен айырмашылығы, AIR-LLM пайдаланушының орналасуына қарамастан тиімді жұмыс істейді.&lt;/p&gt;\n&lt;h4 id=\"efir-uakhyty\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#efir-uakhyty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эфир уақыты&lt;/span&gt;&lt;/a&gt;Эфир уақыты&lt;/h4&gt;\n&lt;p&gt;12-суретте көрсетілгендей, U пайдаланушыға қызмет көрсету кезінде AIR-LLM үшін эфир уақыты өзгеріссіз қалады, өйткені салмақтар хабар тарату (broadcast) арқылы жіберіледі. Қарапайым әдістер (unicast) шығындарды сызықтық түрде арттырса, AIR-LLM 20 пайдаланушы үшін FP16/W4A16-ға қарағанда 104.1×/26.0× аз уақыт жұмсайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Хабар тарату (broadcast) әдісі деректерді барлық пайдаланушылар үшін бір уақытта жіберуге мүмкіндік береді, бұл желі жүктемесін азайтады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"llm-uedetkishteri-bojynsha-zhumystar\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#llm-uedetkishteri-bojynsha-zhumystar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;LLM үдеткіштері бойынша жұмыстар&lt;/span&gt;&lt;/a&gt;LLM үдеткіштері бойынша жұмыстар&lt;/h4&gt;\n&lt;p&gt;Дәстүрлі тәсілдер салмақтарды сығуға немесе есептеуді жадқа жақындатуға негізделген. Олардың барлығы салмақтардың құрылғыда сақталуын талап етеді. AIR-LLM болса салмақтарды жергілікті сақтамайды, сигнал қабылданып жатқан кезде RF/аналогтық доменде тікелей есептейді.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 3.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-tT3.jpg\" alt=\"Кесте 3\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"ml-ueshin-analogtykh-esepteu\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#ml-ueshin-analogtykh-esepteu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ML үшін аналогтық есептеу&lt;/span&gt;&lt;/a&gt;ML үшін аналогтық есептеу&lt;/h4&gt;\n&lt;p&gt;Аналогтық жүйелер (ReRAM, фотоника) сандық арифметика шектеулерінен қашып, физикалық заңдар (Ом/Кирхгоф) негізінде жұмыс істейді. AIR-LLM бұл идеяны дамытып, қабылдағыштың RF-араластырғыштарын (mixer) пайдаланады. Жүйе жиілікке тәуелді кедергілерді жою үшін A \times A MIMO қозғалтқышын қолданады.&lt;/p&gt;\n&lt;h4 id=\"shetki-khurylghylarda-llm-ornalastyru\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#shetki-khurylghylarda-llm-ornalastyru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шеткі құрылғыларда LLM орналастыру&lt;/span&gt;&lt;/a&gt;Шеткі құрылғыларда LLM орналастыру&lt;/h4&gt;\n&lt;p&gt;Мобильді құрылғыларда жад пен есептеу қуаты шектеулі. Қолданыстағы әдістер құрылғыны артық жүктейді немесе серверге тәуелді болып қалады. AIR-LLM болса салмақтарды орталық радиостанцияда сақтайды және хабар тарату арқылы жібереді, нәтижесінде әр құрылғы есептеуді жергілікті орындап, жеткізу шығындарын бөліседі.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 4.&lt;/strong&gt; ThePPLofAIR-LLMinParisandMunichover different central radio broadcasting power.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-tT4.jpg\" alt=\"Кесте 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 5.&lt;/strong&gt; The PPL of AIR-LLM in Paris and Munich at 𝐴= {4, 8} with a varying number of calibration units, 𝐶.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-tT5.jpg\" alt=\"Кесте 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 6.&lt;/strong&gt; ThePPLofAIR-LLMatISM(0.915 GHz)and mmWave (28 GHz) bands with different (𝐴,𝐶) combinations. Figure 10. The broadcasting of LLaMA-3.1-8B to the 20 users with WikiText-2 PPL labeled in Paris (a) and Munich (b).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-tT6.jpg\" alt=\"Кесте 6\" /&gt;&lt;/p&gt;\n&lt;h3 id=\"khorytyndy\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды&lt;/span&gt;&lt;/a&gt;Қорытынды&lt;/h3&gt;\n&lt;p&gt;&lt;strong&gt;Кесте S8.&lt;/strong&gt; Over six commonsense-reasoning benchmarks, the zero-shot accuracy (%) of LLaMA-3.1-8B by AIR-LLM on the selected users of Paris and Munich vs. the FP16, WoQ, and analog computing baselines.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-tTS8.jpg\" alt=\"Кесте S8\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте S9.&lt;/strong&gt; The WikiText-2 PPL of LLaMA-3.1-8B when the weight signal is repeated 1 to 16 times and averaged, with ∞as the distortion floor.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-tTS9.jpg\" alt=\"Кесте S9\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте S10.&lt;/strong&gt; Tab. 4 repeated at the ISM (0.915 GHz) and mmWave (28 GHz) bands, each read against its own regulatory ceiling.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-tTS10.jpg\" alt=\"Кесте S10\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 7.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-tT7.jpg\" alt=\"Кесте 7\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте S11.&lt;/strong&gt; Tab. 5 repeated at the ISM and mmWave bands, each at the transmit power where it saturates in Tab. A10.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-tTS11.jpg\" alt=\"Кесте S11\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"air-llm-arhitekturasyn-aezirleu-khorytyndysy\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#air-llm-arhitekturasyn-aezirleu-khorytyndysy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AIR-LLM архитектурасын әзірлеу қорытындысы&lt;/span&gt;&lt;/a&gt;AIR-LLM архитектурасын әзірлеу қорытындысы&lt;/h4&gt;\n&lt;p&gt;Бұл жұмыста шеткі құрылғыларда (edge devices) үлкен тілдік модельдерді (LLM) инференс жасауға арналған AIR-LLM архитектурасы ұсынылған. Әзірлеменің негізгі мақсаты — жад шектеулерінен ада, пайдаланушылар үшін масштабталатын және энергияны үнемдейтін жүйені құру. Негізгі техникалық шешім ретінде MIMO кеңістіктік мультиплекстеуі пайдаланылды, бұл модель салмақтарын бір уақытта бірнеше ағынмен жіберуге мүмкіндік береді және осы арқылы эфир уақытын (airtime) күрт қысқартады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AIR-LLM архитектурасы MIMO-мультиплекстеу және прекодер–посткодерді оңтайландыру есебінен энергия шығыны мен тарату уақытын дәлдіктің минималды жоғалуымен бірнеше есе азайтады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сымсыз арнада тиімді жұмыс істеуді қамтамасыз ету үшін шеткі құрылғы жағында байланыс арнасын автоматты түрде калибрлейтін «прекодер–посткодер» жұбы әзірленді. Тиімділікті бағалау NVIDIA Sionna ортасында сәулелерді қадағалау (ray-tracing) көмегімен модельденген арналар және нақты радиожиілік (РЖ) араластырғышын профильдеу негізінде жүзеге асырылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сәулелерді қадағалау (ray-tracing) — бұл радиотолқындардың таралуын модельдеу әдісі, ол шағылысулар мен кедергілерді ескере отырып, нақты байланыс жағдайларын жоғары дәлдікпен симуляциялайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Нәтижелер көрсеткендей, AIR-LLM FP16 базалық моделіне қарағанда PPL (перплексия) көрсеткішінде өте аз ауытқуды көрсетеді. Сонымен қатар, әр токен үшін энергия шығыны мен деректерді тарату уақыты еселеп қысқарады. Бұл архитектура жаңа буынның интеллектуалды шеткі жүйелері үшін іргетас қалайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Өнімділікті бағалау NVIDIA Sionna симуляциялары мен жекелеген РЖ компоненттерін профильдеуге негізделген, бұл күрделі аппараттық прототиптерде қосымша тексеруді талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-f2.jpg\" alt=\"Сурет 2. Әр раундта GEMV операциясының 𝐴 ішкі көбейтіндісін (IP) (немесе нақты мәнді болса 2𝐴) орындайтын AIR-LLM RF есе\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 2. Әр раундта GEMV операциясының 𝐴 ішкі көбейтіндісін (IP) (немесе нақты мәнді болса 2𝐴) орындайтын AIR-LLM RF есептеу қозғалтқышына шолу.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Сурет 2. Әр раундта GEMV операциясының 𝐴 ішкі көбейтіндісін (IP) (немесе нақты мәнді болса 2𝐴) орындайтын AIR-LLM RF есептеу қозғалтқышына шолу. Орталық радиостанция бұл IP салмақтарын пайдаланушыға арналған алдын ала кодтаусыз өзінің 𝐴 антеннасы арқылы таратады. Содан кейін әрбір шеткі құрылғы қабылданған 𝐴 салмақ толқын пішіндерін өзінің GEMV кірісімен бірге 𝐶 калибрлеу блоктарына береді, олардың прекодерлері мен посткодерлері SVD негізіндегі бастапқы баптау және ALS негізіндегі дәл баптау арқылы сол пайдаланушының өз арнасынан алынады. 𝐶 блоктарының шығыстарын қосындылау осы раундтың GEMV шығысын береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-f3.jpg\" alt=\"Сурет 3. Калибрлеу блогының егжей-тегжейлі архитектурасы және оның қабылданған салмақ векторы w′ 𝑎 мен прекодталған кірі\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 3. Калибрлеу блогының егжей-тегжейлі архитектурасы және оның қабылданған салмақ векторы w′ 𝑎 мен прекодталған кіріс векторы x′ арасындағы ішкі көбейтіндіні өңдеуі.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-f4.jpg\" alt=\"Сурет 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 4&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-f6.jpg\" alt=\"Сурет 6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 6&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-f8.jpg\" alt=\"Сурет 8. Тоғыз LLM бойынша AIR-LLM-нің токенге шаққандағы нормаланған энергиясы төрт базалық шешіммен салыстырғанда.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 8. Тоғыз LLM бойынша AIR-LLM-нің токенге шаққандағы нормаланған энергиясы төрт базалық шешіммен салыстырғанда.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-f10.jpg\" alt=\"Сурет 10\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 10&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-f12.jpg\" alt=\"Сурет 12\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 12&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-fS1.jpg\" alt=\"Сурет A1. 𝐴 = 4 және 𝐶 = 8 болғанда таңдалған пайдаланушыларда OPT-Chan-ның екі кадамы не беретіні: шешімнің төрт кезеңі\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет A1. 𝐴 = 4 және 𝐶 = 8 болғанда таңдалған пайдаланушыларда OPT-Chan-ның екі кадамы не беретіні: шешімнің төрт кезеңіндегі y-ге қатысты ˆy (a, b), сондай-ақ әрбір ALS итерациясындағы (17) шығыны мен оның ENOB мәні (c, d).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-fS4.jpg\" alt=\"Сурет S4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S4&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-fS6.jpg\" alt=\"Сурет A6. Париж (a) мен Мюнхендегі (b) 10-суреттегі 20 пайдаланушы, олардың әрқайсысы PL, GEMV ENOB және WikiText-2 PPL \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет A6. Париж (a) мен Мюнхендегі (b) 10-суреттегі 20 пайдаланушы, олардың әрқайсысы PL, GEMV ENOB және WikiText-2 PPL мәндерімен белгіленген.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu- ath stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;GEMV-ді&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тікелей RF-&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;миксерде&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;орындау&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Салмақтарды&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сақтамай LLM-&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ді іске қосу&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт әлі рецензиядан өтпеген. Қорытындылар алдын ала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#derekkoez\" class=\"yfm-anch
