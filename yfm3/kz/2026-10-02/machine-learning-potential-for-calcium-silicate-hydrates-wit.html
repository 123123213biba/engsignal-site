            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"165\" cy=\"140\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"635\" cy=\"252\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · CEMENT_CHEM   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Цементтің цифрлық егізі:&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;нейрондық желілер бетон&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;беріктігін қалай болжайды&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;Кальций силикат гидраты (&lt;a href=\"concepts/calcium-silicate-hydrate.html\"&gt;C-S-H&lt;/a&gt;) — цемент тасының негізгі құрамдас бөлігі, оның күрделі құрылымы ондаған жылдар бойы модельдеу үшін жұмбақ болып келді. Жаңа &lt;a href=\"concepts/csh-mlp.html\"&gt;CSH-MLP&lt;/a&gt; әдісі тығыздық функционалы теориясы (&lt;a href=\"concepts/density-functional-theory.html\"&gt;DFT&lt;/a&gt;) арқылы алынған 50 000-нан астам конфигурацияны талдау үшін машиналық оқытуды қолданады. Бұл бетонның беріктігі мен төзімділігін қолданыстағы аналогтарға қарағанда 30 есе жылдам модельдеуге мүмкіндік береді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-02/machine-learning-potential-for-calcium-silicate-hydrates-wit.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;CSH-MLP 50 000+ DFT дәлдігіндегі конфигурацияларда оқытылған.&lt;/li&gt;\n&lt;li&gt;ReaxFF-пен салыстырғанда есептеу жылдамдығы 30 есе жоғары.&lt;/li&gt;\n&lt;li&gt;Ca/Si қатынасының 0,83-тен 2,5-ке дейінгі диапазоны.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-02/machine-learning-potential-for-calcium-silicate-hydrates-wit.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;C-S-H модельдеудегі басты мәселе — оның наноөлшемді біртекті еместігі және аморфты табиғаты. ClayFF немесе ReaxFF сияқты дәстүрлі күш өрістері не химиялық реактивтілікті ескермейді, не өте үлкен есептеу қуатын талап етеді. Әзірленген CSH-MLP 1890 оңтайландырылған DFT құрылымдары, 9450 бұрмаланған конфигурациялар және 39 057 молекулалық-динамикалық траекториялар негізінде оқытылды.&lt;/p&gt;\n&lt;p&gt;Модель Ca/Si қатынасының кең диапазонын (0,83-тен 2,5-ке дейін) қамтиды, бұл серпімділік модульдерін және жоғары қысым кезіндегі мінез-құлықты дәл болжауға мүмкіндік береді. SOAP (&lt;a href=\"concepts/smooth-overlap-of-atomic-positions.html\"&gt;Smooth Overlap of Atomic Positions&lt;/a&gt;) әдісі арқылы құрылымды талдау нейрондық желінің C-S-H конфигурацияларының барлық әртүрлілігін сәтті қамтығанын растады. Нәтижесінде, CSH-MLP есептеулерді айтарлықтай жылдамдата отырып, DFT-мен салыстырмалы дәлдікті қамтамасыз етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель оқыту үшін пайдаланылған деректер жиынтығымен шектелген және таңдамада жоқ экстремалды жағдайларда дәлдігін жоғалтуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-02/machine-learning-potential-for-calcium-silicate-hydrates-wit.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Цемент — шығу тегі 2000 жылдан астам уақытқа созылатын және 200 жылдан астам уақыт бұрын өнеркәсіптік деңгейде дамыған материал, адамзат ең көп өндіретін материал болып табылады. Алайда, ол жаһандық көміртегі шығарындыларының негізгі көздерінің бірі болып табылады, бұл жалпы көлемнің шамамен 8%-ын құрайды. Цементтің қоршаған ортаға әсерін азайту және инфрақұрылымға деген өсіп келе жатқан сұранысты қанағаттандыру оның әртүрлі масштабтағы сипаттамаларын терең, болжамды түсінуді талап етеді. Гидратталған цемент қамырындағы орталық байланыстырушы фаза — кальций силикат гидраты (C–S–H), ол құрамы мен жергілікті ретсіздігі әртүрлі нанокристалды және рентген-аморфты гель болып табылады. Ол цемент материалдарының когезиясы, беріктігі мен төзімділігі үшін негізгі жауапты элемент. Оның маңызды рөліне қарамастан, C–S–H-тың атомдық деңгейдегі құрылымы мен механикалық мінез-құлқы оның гетерогенді химиясы мен нашар анықталған кристалдылығына байланысты белгісіз болып қалуда.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Атомистикалық модельдеу, атап айтқанда молекулалық динамика (МД) және ab initio есептеулері цементтің құрылымдық, механикалық және термодинамикалық қасиеттерін түсінуде, сондай-ақ эксперименттік бақылауларды толықтыратын атомдық деңгейдегі орналасулар, ақаулар құрылымы және гидраттану динамикасы туралы маңызды ақпарат беруде баға жетпес екенін дәлелдеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ab initio әдістері (мысалы, тығыздық функционалының теориясы, DFT) жоғары дәлдікті ұсынады және қасиеттерді болжау үшін эталон болып саналады, бірақ олардың есептеу құны шағын жүйелермен шектеледі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Классикалық МД модельдеулері үлкенірек кеңістіктік және уақытша масштабтарға мүмкіндік береді, бірақ олардың сенімділігі күш өрістерінің сапасына байланысты, олардың әрқайсысының өзіндік кемшіліктері бар.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Кванттық механикалық модельдеулердің кеңістіктік және уақытша шектеулерін олардың дәлдігін сақтай отырып еңсеру үшін машиналық оқыту потенциалдары (MLP) қуатты балама ретінде пайда болды. MLP наносекундтық уақыт аралығында үлкен және ретсіз жүйелерді модельдеуді дәстүрлі ab initio әдістеріне қарағанда әлдеқайда арзан бағамен жүзеге асыруға мүмкіндік береді. Бұл зерттеуде біз Ca/Si қатынастарының, ақаулар топологияларының және гидраттану күйлерінің кең ауқымын қамтитын C–S–H атомдық құрылымының деректер жиынын құру үшін деректерді генерациялау стратегиясын ұсынамыз. C–S–H деректер жиынына негізделген C–S–H үшін дәл және жалпылама MLP — CSH-MLP-ті үйретеміз және оның дәлдігін ab initio модельдеулерімен және бұрын әзірленген күш өрістерімен салыстыру арқылы тексереміз. Бұл жұмыстың негізгі жетістігі C–S–H деректер жиынының әртүрлілігінде және CSH-MLP-тің құрамдық және құрылымдық жалпыламалығында жатыр.&lt;/p&gt;\n&lt;p&gt;Ұсынылған CSH-MLP тек C–S–H-тың механикалық қасиеттері мен құрылымдық ерекшеліктерін болжауда жоғары дәлдікті көрсетіп қана қоймай, сонымен қатар 700-ге жуық жеке құрам бойынша стехиометриялық жалпыламалыққа, үлкен көлемдегі жүйелерге масштабталуға және зерттелмеген құрылымдарға экстраполяциялау қабілетіне ие. Маңыздысы, CSH-MLP жоғары қысымды рентген сәулелерінің дифракциялық өлшемдері мен ақауларға негізделген C–S–H модельдері арасындағы ұзақ уақыттан бері бар қайшылықтарды жояды. Біз CSH-MLP-тің ReaxFF-ке қарағанда шамамен 30 есе жылдам есептеу жылдамдығына қол жеткізетінін көрсетеміз, бұл цемент материалдарын DFT-ге жақын дәлдікпен ауқымды модельдеуге мүмкіндік береді.&lt;/p&gt;\n&lt;p&gt;Дәл және жалпылама машиналық оқыту потенциалы (MLP) оқу деректер жиынының сапасы мен әртүрлілігіне байланысты. Алайда, бүгінгі күнге дейін цементтің нанокристалды табиғаты, гетерогенді құрамы және динамикалық химиялық ортасы салдарынан эксперименттік жолмен алынған атомдық құрылымдарды қамтитын жалпыға ортақ деректер базасы жоқ. Бұл олқылықты толтыру үшін біз C–S–H құрылымдарының ерекше сипаттамаларын қамтитын DFT-мен белгіленген деректер жиынын құру үшін деректерді генерациялау стратегиясын әзірледік. Стратегия төрт кезеңді қамтиды: (i) модель құру және артықтықты бақылау, (ii) құрылымды оңтайландыру, (iii) тепе-тең емес деректерді кеңейту және (iv) &lt;a href=\"concepts/odnotochechnye-raschety-dft.html\"&gt;DFT бір нүктелі есептеулері&lt;/a&gt; (1-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;DFT бір нүктелі есептеулері — бұл атомдардың координаттарын өзгертпестен, белгіленген конфигурация үшін энергия мен күштерді есептеу.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бірінші кезеңде pyCSH бағдарламасының көмегімен шамамен 500 000 C–S–H суперұяшығы жасалды және сұрыптау процесі оларды 688 құрамды қамтитын 1926 тәуелсіз құрылымға қысқартты. Екінші кезеңде таңдалған модельдер NVT және NPT ансамбльдері астында МД модельдеулері арқылы тепе-теңдікке келтірілді және кейіннен DFT деңгейінде оңтайландырылды. Бұл барлығы 1890 конфигурацияға әкелді. Үшінші кезеңде құрылымдық бұзылулар (9450 нұсқа) және 100 МД тепе-теңдік траекторияларынан (39 057 конфигурация) құрылымдарды жинауды қамтитын екі кезеңді кеңейту стратегиясы қабылданды. Барлық конфигурациялар жоғары дәлдіктегі DFT есептеулерімен белгіленді және қорытынды C–S–H деректер жиынын құрады.&lt;/p&gt;\n&lt;p&gt;C–S–H деректер жиынындағы құрылымдық әртүрлілік SOAP саусақ ізі әдісімен анықталды және құрылымдық ерекшеліктер PCA өлшемін азайту алгоритмі арқылы екі өлшемді жазықтыққа проекцияланды. 2-сурет әртүрлі кіші жиындар бойынша ішкі құрылымдық ақпаратты көрсетеді. Нәтижелер дисперсияның жоғары деңгейін көрсетеді, бұл ұсынылған сұрыптау әдісінің конфигурациялық кеңістіктің кең спектрін қамтудағы тиімділігін растайды. Сонымен қатар, Ca/Si және 2H/Si қатынастары деректер жиынының құрылымдық параметрлеріне айтарлықтай әсер етеді. Ca/Si және 2H/Si-дің синхронды өсу тенденциясы эксперименттік нәтижелермен жақсы сәйкес келеді.&lt;/p&gt;\n&lt;p&gt;CSH-MLP-тің дәлдігі MLP болжаған атомдық энергия мен күштерді DFT көмегімен есептелгендерімен салыстыру арқылы тексерілді. 3-сурет оқу және тест деректер жиындары үшін MLP және DFT нәтижелері арасындағы күшті сызықтық корреляцияны көрсетеді. Атомдық энергиялар үшін орташа квадраттық қателер (RMSE) оқу және тест жиындары үшін сәйкесінше 1,18 және 1,50 мэВ/атомды құрайды. Атомдық күштер үшін RMSE мәндері сәйкесінше 0,092 және 0,102 эВ/Å-ді құрайды. Бұл мәндер қолданыстағы MLP-лер үшін қателік диапазонының төменгі бөлігінде орналасқан, бұл CSH-MLP-тің жоғары дәлдігі мен сенімділігін растайды.&lt;/p&gt;\n&lt;p&gt;Тоберморит құрылымдары мен C–S–H моделінің &lt;a href=\"concepts/meshi.html\"&gt;тор&lt;/a&gt; тұрақтылары MLMD және DFT модельдеулері арқылы оңтайландырылды және нәтижелер бұрын әзірленген күш өрістерімен салыстырылды (1-кесте). C–S–H benchmark моделі үшін CSH-MLP небәрі 0,23% максималды ауытқумен және 0,14% орташа алшақтықпен жоғары нәтиже көрсетеді және басқа күш өрістерінен айтарлықтай озып тұр. Бұл нәтижелер CSH-MLP-тің нанокристалды C–S–H-қа ұқсас фазалардың құрылымдық сипаттамаларын дәл қайталаудағы тамаша қабілетін көрсетеді.&lt;/p&gt;\n&lt;p&gt;Динамикалық қасиеттерді бағалау үшін біз DFT оңтайландырылған C–S–H моделі үшін ClayFF, ReaxFF, csh_cp және CSH-MLP астында әртүрлі атом түрлерінің орташа квадраттық ығысуын (MSD) есептедік (6a–d-сурет). CSH-MLP-тің MSD тербелістері csh_cp-ге қарағанда дәйекті және тұрақты, бұл CSH-MLP потенциалы астында C–S–H-тың термиялық тербелістері әлсіз екенін көрсетеді. Бұл нәтижелер CSH-MLP-тің бұрын әзірленген цементке негізделген MLP-лерден жоғары дәлдік пен тұрақтылыққа қол жеткізгенін растайды.&lt;/p&gt;\n&lt;p&gt;7a,b-сурет CSH-MLP және csh_cp болжаған C–S–H benchmark моделінің серпімділік тензорын және олардың DFT-ден ауытқуларын көрсетеді. csh_cp-мен салыстырғанда, CSH-MLP DFT-мен көбірек сәйкес келетінін көрсетеді. Серпімділік тензорының қалыпты компоненттерін талдау C–S–H-тың механикалық жауабындағы айқын монотонды емес тенденцияны ашады. Ca/Si 1,3-тен 1,5-ке дейін өскенде, C₁₁, C₂₂ және C₃₃ сәйкесінше 99,12-ден 105,94 ГПа-ға дейін, 96,71-ден 100,02 ГПа-ға дейін және 60,39-дан 76,04 ГПа-ға дейін өседі; Ca/Si-дің одан әрі өсуімен олар сәйкесінше 95,15, 91,46 және 68,44 ГПа-ға дейін түседі. Біздің модельдеулеріміз бұл мінез-құлықты атомдық деңгейде түсіндіріп береді және эксперименттік бақылауларды C–S–H-тың құрылымдық эволюциясымен байланыстырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-02/machine-learning-potential-for-calcium-silicate-hydrates-wit.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fi
