        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференциялар&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;материалы и конструкции: испытания, долговечность&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/conferences/conf-rilem.jpg\" alt=\"RILEM Week\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Не туралы&lt;/td&gt;\n&lt;td&gt;материалы и конструкции: испытания, долговечность&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Не аламыз&lt;/td&gt;\n&lt;td&gt;труды RILEM (много в открытом доступе)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-concrete.html\"&gt;Бетон және байланыстырғыштар&lt;/a&gt;, &lt;a href=\"concepts/spec-materials.html\"&gt;Материалтану&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"bul-khandaj-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-rilem.html#bul-khandaj-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қандай конференция&lt;/span&gt;&lt;/a&gt;Бұл қандай конференция&lt;/h2&gt;\n&lt;p&gt;RILEM Week — құрылыс материалдары мен конструкциялары саласындағы сарапшыларды біріктіретін жыл сайынғы халықаралық ғылыми іс-шара. Конференция азаматтық құрылыстың болашағын айқындайтын іргелі зерттеулерді талқылау үшін негізгі алаң болып табылады. RILEM Week материалдың толық өмірлік циклін: цемент фазаларын молекулалық модельдеуден бастап, ірі инженерлік құрылыстардың төзімділігін бағалауға дейін қамтиды.&lt;/p&gt;\n&lt;h2 id=\"ujymdastyrushylar-zhaene-tarihy\"&gt;&lt;a href=\"reference/conferences/conf-rilem.html#ujymdastyrushylar-zhaene-tarihy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ұйымдастырушылар және тарихы&lt;/span&gt;&lt;/a&gt;Ұйымдастырушылар және тарихы&lt;/h2&gt;\n&lt;p&gt;Ұйымдастырушы — RILEM (Құрылыс материалдары, жүйелері мен конструкциялары бойынша зертханалар мен сарапшылардың халықаралық одағы). Ұйым 1947 жылы құрылған. Бетонның сыну механикасы мен материалдардың аққыштығы бойынша жұмыстары қазіргі заманғы қауіпсіздік стандарттарының негізіне айналған Зденек Бажант (Zdeněk P. Bažant) сияқты ғалымдардың қатысуы ұйым тарихындағы маңызды кезең болды. Солтүстік-батыс университетінің профессоры Бажант ондаған жылдар бойы құрылыс ғылымында математикалық модельдеу әдістерін ілгерілете отырып, RILEM-нің ғылыми күн тәртібін қалыптастырды.&lt;/p&gt;\n&lt;h2 id=\"takhyryptar-men-sekciyalar\"&gt;&lt;a href=\"reference/conferences/conf-rilem.html#takhyryptar-men-sekciyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тақырыптар мен секциялар&lt;/span&gt;&lt;/a&gt;Тақырыптар мен секциялар&lt;/h2&gt;\n&lt;p&gt;RILEM Week ғылыми бағдарламасы дәстүрлі түрде бірнеше негізгі бағытқа бөлінеді:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Бетон және байланыстырғыш заттар: цемент гидратациясын, CSH-гель микроқұрылымын және бетонның агрессивті ортадағы төзімділігін зерттеу.&lt;/li&gt;\n&lt;li&gt;Материалтану: көміртекті аэрогельдер мен жоғары берік қорытпаларды қоса алғанда, жаңа композиттерді әзірлеу.&lt;/li&gt;\n&lt;li&gt;Цифрландыру және модельдеу: материалдардың беріктігін болжау үшін нейрондық желілік потенциалдарды қолдану.&lt;/li&gt;\n&lt;li&gt;Тұрақты даму: құрылыс материалдарын өндіру кезінде көміртегі ізін азайту әдістері.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"onda-ne-pajda-bolady\"&gt;&lt;a href=\"reference/conferences/conf-rilem.html#onda-ne-pajda-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Онда не пайда болады&lt;/span&gt;&lt;/a&gt;Онда не пайда болады&lt;/h2&gt;\n&lt;p&gt;Конференцияда кейіннен жаңа стандарттар үшін негіз болатын нәтижелер ұсынылады. Мұнда криогендік қалыптардың көмегімен күрделі қорытпалардағы кеуектілікпен күресу әдістерінен бастап, радио толқындарды жұтатын материалдар жасау үшін анизотропты құрылымдарды пайдалануға дейінгі озық технологиялар талқыланады.&lt;/p&gt;\n&lt;h2 id=\"khalaj-bakhylaugha-zhaene-khatysugha-bolady\"&gt;&lt;a href=\"reference/conferences/conf-rilem.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалай бақылауға және қатысуға болады&lt;/span&gt;&lt;/a&gt;Қалай бақылауға және қатысуға болады&lt;/h2&gt;\n&lt;p&gt;Конференция материалдары RILEM Proceedings түрінде ашық қолжетімділікпен жарияланады. Зерттеушілер мен инженерлер үшін бұл тексерілген деректердің негізгі көзі болып табылады. Өзекті зерттеулерді бақылап отыру үшін RILEM ресми порталына мониторинг жүргізу ұсынылады.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/conferences/conf-rilem.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Zden%C4%9Bk_P._Ba%C5%BEant\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Zdeněk P. Bažant — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Zden%C4%9Bk_Pavel_Ba%C5%BEant_ForMemRS.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Royal Society uploader, CC BY-SA 4.0&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференциялар&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"материалы и конструкции: испытания, долговечность"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"RILEM Week","description":"материалы и конструкции: испытания, долговечность","vcsPath":"reference/conferences/conf-rilem.md"},"headings":[{"title":"Бұл қандай конференция","href
