        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференциялар&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;вычислительная механика, МКЭ&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/conferences/conf-eccomas.jpg\" alt=\"ECCOMAS / WCCM\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Не туралы&lt;/td&gt;\n&lt;td&gt;вычислительная механика, МКЭ&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Не аламыз&lt;/td&gt;\n&lt;td&gt;аннотации докладов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-fem.html\"&gt;Есептеу және модельдеу&lt;/a&gt;, &lt;a href=\"concepts/spec-mechanics.html\"&gt;Материалдар кедергісі және механика&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"bul-khandaj-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-eccomas.html#bul-khandaj-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қандай конференция&lt;/span&gt;&lt;/a&gt;Бұл қандай конференция&lt;/h2&gt;\n&lt;p&gt;ECCOMAS (European Community on Computational Methods in Applied Sciences) және WCCM (World Congress on Computational Mechanics) — есептеу механикасымен айналысатын ғалымдар мен инженерлерді біріктіретін ірі халықаралық алаңдар. Конференциялар Ай базаларынан бастап кванттық микропроцессорларға дейінгі күрделі жүйелердің мінез-құлқын болжауға мүмкіндік беретін озық сандық модельдеу әдістерін ұсыну орны болып табылады.&lt;/p&gt;\n&lt;h2 id=\"ujymdastyrushylar-zhaene-tarihy\"&gt;&lt;a href=\"reference/conferences/conf-eccomas.html#ujymdastyrushylar-zhaene-tarihy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ұйымдастырушылар және тарихы&lt;/span&gt;&lt;/a&gt;Ұйымдастырушылар және тарихы&lt;/h2&gt;\n&lt;p&gt;ECCOMAS — қолданбалы ғылымдар саласындағы қызметті үйлестіретін еуропалық ғылыми ұйым. WCCM болса IACM (International Association for Computational Mechanics) қамқорлығымен өткізіледі. Бұл іс-шаралар бірнеше жылда бір рет өткізіліп, математикалық модельдеу және физикалық процестерді алгоритмдеу бойынша тәжірибе алмасу үшін мыңдаған мамандарды жинайды.&lt;/p&gt;\n&lt;h2 id=\"takhyryptar-men-sekciyalar\"&gt;&lt;a href=\"reference/conferences/conf-eccomas.html#takhyryptar-men-sekciyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тақырыптар мен секциялар&lt;/span&gt;&lt;/a&gt;Тақырыптар мен секциялар&lt;/h2&gt;\n&lt;p&gt;Конференциялардың негізгі назары шекті элементтер әдісіне (ШЭӘ) және оның дамуына бағытталған. Секциялар күрделі геометриялық домендер үшін торлар жасаудан (mesh generation) бастап, бөлмелердің цифрлық егіздерін әзірлеуге дейінгі кең ауқымды қамтиды. Топологиялық оңтайландыру, орталардың өзара әрекеттесуі және физикалық құбылыстарды масштабтау мәселелері талқыланады.&lt;/p&gt;\n&lt;h2 id=\"onda-ne-pajda-bolady\"&gt;&lt;a href=\"reference/conferences/conf-eccomas.html#onda-ne-pajda-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Онда не пайда болады&lt;/span&gt;&lt;/a&gt;Онда не пайда болады&lt;/h2&gt;\n&lt;p&gt;Конференцияларда жобалауға деген көзқарасты өзгертетін зерттеулер ұсынылады. Мысалы, реголиттен құрылыс салу үшін топологиялық ілмек әдістері, RGB-D сканерлерін симуляция кодына айналдыру алгоритмдері және фотондар мен фонондардың микро-масштабтағы өзара әрекеттесуін модельдеу сияқты тақырыптар қарастырылады.&lt;/p&gt;\n&lt;h2 id=\"khalaj-bakhylaugha-zhaene-khatysugha-bolady\"&gt;&lt;a href=\"reference/conferences/conf-eccomas.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалай бақылауға және қатысуға болады&lt;/span&gt;&lt;/a&gt;Қалай бақылауға және қатысуға болады&lt;/h2&gt;\n&lt;p&gt;Конференцияларға қатысу үшін рецензиядан өтетін баяндамалар аннотацияларын жариялау талап етіледі. Жаңалықтарды ECCOMAS және IACM ресми порталдары арқылы бақылауға болады. Бұл өз инженерлік тәжірибесіне заманауи есептеу әдістерін енгізгісі келетін мамандар үшін негізгі дереккөз болып табылады.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"reference/conferences/conf-eccomas.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Есептеу механикасының негізі үздіксіз кеңістікті дискреттеуден тұрады. Шекті элементтер әдісі (ШЭӘ) күрделі геометрияны қарапайым ұяшықтарға (симплекстерге) бөліп, тор құрайды. Тордың сапасы есептеулердің дәлдігін анықтайды: жүйені артық деректермен жүктемей, маңызды аймақтарда жеткілікті ұсақ ұяшықтарды жасау маңызды. Бұл материалдар кедергісі және механикамен тікелей байланысты: есептеулер табиғи сынақтарды цифрлық модельдеумен алмастыруға мүмкіндік береді.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/conferences/conf-eccomas.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Mesh_generation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Mesh generation — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Example_finite_element_mesh,_for_illustrating_the_concept.png\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: SamitchSandia, CC BY-SA 4.0&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференциялар&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"вычислительная механика, МКЭ"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"ECCOMAS / WCCM","description":"вычислительная механика, МКЭ","vcsPath":"reference/conferences/conf-eccomas.md"},"headings":[{"title":"Бұл қандай конференция","href":"reference/conferences/conf-eccomas.html#bul-khandaj-konferenciya","level":2},{"title":"Ұйымдастырушылар және тарихы","href":"reference/conferences/conf-eccomas.html#ujymdastyrushylar-zhaene-tarihy","level":2},{"title":"Тақырыптар мен секциялар","href":"reference/conferences/conf-eccomas.html#takhyryptar-men-sekciyalar","level":2},{"title":"Онда не пайда болады","href":"reference/conferences/conf-eccomas.html#onda-ne-pajda-bolady","level":2},{"title":"Қалай бақылауға және қатысуға болады","href":"reference/conferences/conf-eccomas.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady","level":2},{"title":"Теория","href":"reference/conferences/conf-eccomas.html#teoriya","level":2},{"title":"Дереккөздер","href":"reference/conferences/conf-eccomas.html#derekkoezder","level":2}],"title":"ECCOMAS / WCCM"},"router":{"pathname":"reference/conferences/conf-eccomas","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
