        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"247\" cy=\"78\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"653\" cy=\"258\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · PLATES_SHELLS   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Мембраналық сенсорлар өз&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;көрсеткіштерін полимер&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;механикасы арқылы тексеруді&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;үйренді&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-f1.jpg\" alt=\"Сурет 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Газ датчиктері зертханадан тыс қолданылғанда қоспаның нақты концентрациясы белгісіз болатындықтан, өлшеу дәлдігін тексеру күрделі мәселе. Инженерлер газ құрамын бағалаумен қатар, сенсордың механикалық реакциясын қатар жаңғыртатын динамикалық инверсия моделін ұсынды. Сорбция кинетикасы мен полимер мембранасының тұтқыр-серпімділік теңдеулері жүйеге өзін-өзі тексеру қасиетін берді. 12 арналы MSS массивіндегі сынақтар алгоритмнің жеке арнадағы сезгіштік ауытқуларын дәл анықтайтынын көрсетті.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;12 арналы MSS жүйесі су мен этанолды сорбция кинетикасы мен SLS серпімділік теңдеулері арқылы ажыратады.&lt;/li&gt;\n&lt;li&gt;Кинетика және механика шектеулері нейрожеліге MDMM әдісімен автоматты түрде енгізілген.&lt;/li&gt;\n&lt;li&gt;Сенсор ақаулары мен нөлдік дрейф синтезделген кернеудің нақты сигналмен сәйкессіздігі арқылы әшкереленеді.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Зерттеу негізіне беттік механикалық кернеуді тіркейтін мембраналық сенсорлар массиві (MSS) алынды, ол 12 тәуелсіз химиялық сезгіш жабыны бар үш чиптен құралған. Су мен этанол булары сіңірілгенде жұқа қабық көлемдік ұлғаюға ұшырап, аз деформациялар кезінде &lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon%20%3D%20(v%2F3)C_f\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; өсім береді, мұндағы &lt;span class=\"yfm-latex\" data-content=\"v\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — сорбаттың меншікті көлемі, ал &lt;span class=\"yfm-latex\" data-content=\"C_f\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — қабықтағы газ концентрациясы. Қабықтың кернеулі-деформациялық күйі стандартты сызықты тұтқыр-серпімді дене (SLS) теңдеуімен сипатталады: $ au_r E_U (d\\varepsilon/dt) + E_R \\varepsilon =  au_r (d\\sigma/dt) + \\sigma$, мұнда &lt;span class=\"yfm-latex\" data-content=\"E_U\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — лездік серпімділік модулі, &lt;span class=\"yfm-latex\" data-content=\"E_R\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — релаксацияланған модуль, $ au_r$ — механикалық релаксация уақыты.&lt;/p&gt;\n&lt;p&gt;Кері есеп TCN уақыттық конволюция желісі мен көпқабатты перцептрон (MLP) арқылы жүзеге асырылып, &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_g\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; газ концентрациясын, жасырын фазадағы &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_f\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; күйін және жаңғыртылған &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Csigma%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; механикалық кернеуін есептейді. Оқыту үдерісі түрлендірілген дифференциалдық көбейткіштер әдісімен (MDMM) орындалды, бұл ретте сорбция &lt;span class=\"yfm-latex\" data-content=\"R_1\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; және серпімділік &lt;span class=\"yfm-latex\" data-content=\"R_2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; физикалық қалдықтары қатаң шектеу ретінде сақталады. Егер арналардың бірінде дрейф немесе ақау пайда болса, есептелген &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Csigma%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; нақты өлшенген &lt;span class=\"yfm-latex\" data-content=\"%5Csigma\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; сигналынан ажырап, ақауды сыртқы калибрлеусіз жедел табады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жұмыс зертханалық деңгейдегі су мен этанолдың екі компонентті қоспасында сыналған, өндірістік күрделі газдардағы тиімділігі қосымша зерттеуді талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Газ сенсорларының массивтері өздерінің жауап беру үлгілері (response patterns) негізінде газ қоспаларының құрамын бағалауға мүмкіндік береді. Мұндай жүйелерді зертханадан тыс жерде пайдалану кезіндегі басты мәселе — газдардың нақты концентрациясының белгісіздігі, бұл нәтижелердің сенімділігін тексеруді қиындатады. Авторлар физикалық шектеулері бар нейрондық желіні (physics-constrained neural network) әзірледі, ол уақыт өте келе өзгеретін газ концентрацияларын бағалайды және сенсор сигналдарын бір мезгілде қалпына келтіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Физикалық шектеулері бар нейрондық желі — бұл машиналық оқыту моделі, оған физика заңдары (бұл жағдайда сорбция және механика теңдеулері) енгізілген, бұл модельге шындыққа қайшы нәтижелерді шығаруға жол бермейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Әдіс он екі арналы мембраналық типтегі беттік кернеу сенсорларының массивінде сыналды. Тәжірибе барысында жүйе уақыт өте келе өзгеретін су-этанол қоспаларының әсеріне ұшырады.&lt;/p&gt;\n&lt;p&gt;Модель қоспаның екі компоненті үшін де концентрация профильдерін бастапқы сигналдар негізінде сәтті қалпына келтірді. Зерттеушілер бір арнадағы жасанды ығысулар (offsets) мен сезімталдықтың өзгеруі өлшенген және қалпына келтірілген сигналдар арасындағы сәйкессіздіктер арқылы анықталатынын көрсетті. Сонымен қатар, өлшеу жазбаларының бір бөлігін жою немесе ауыстыру жағдайлары сорбция және механика теңдеулерінің бұзылуы арқылы анықталды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әзірленген әдіс бір ғана өлшеу негізінде автоматты түрде өзін-өзі тексеру мүмкіндігімен көп компонентті газдарды нақты уақыт режимінде талдауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу әдістің зертханалық қондырғыдағы демонстрациясы болып табылады; алгоритмді бақылауға келмейтін шу деңгейі жоғары далалық жағдайларға қолдану қосымша тексеруді талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Кварцтық кристалды микротаразылар, беттік акустикалық толқын құрылғылары және мембраналық беттік кернеу датчиктері (MSS) сияқты химиялық сенсорлар зертханадан күнделікті қолданысқа енуде. Қоршаған ортаны бақылау немесе тыныс алу арқылы денсаулықты тексеру сияқты салаларда датчиктер үздіксіз жұмыс істеуі керек, бұл жиі калибрлеуге мүмкіндік бермейді. Дәстүрлі әдістер сенсордың динамикалық жауабын статикалық белгілерге дейін қысқартады, бұл калибрлеуді жеңілдеткенімен, кинетикалық ақпаратты жоғалтады. Бұл жұмыста сенсор статикалық түрлендіргіш емес, динамикалық жүйе ретінде қарастырылады, мұнда сигнал газ бен рецепторлық қабат арасындағы өзара әрекеттесудің уақыт бойынша жазбасы болып табылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ұсынылған әдіс сенсордың динамикалық жауабын пайдалана отырып, нақты уақыт режимінде газ концентрациясын бағалауға және сыртқы эталондарсыз деректердің сенімділігін тексеруге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Динамикалық өлшеулердегі негізгі мәселе — әсер ету тарихына тәуелділік (жад эффектісі) және көп компонентті қоспаларды ажыратудың күрделілігі. Авторлар «шектелген динамикалық инверсия» (constrained dynamical inversion) тәсілін қолданады. Бұл модельде нейрондық желі кері есепті шешеді және ол сорбция мен тұтқыр-серпімді релаксация теңдеулеріне [20] қатаң бағынуы тиіс.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Шектелген динамикалық инверсия — бұл жүйенің кіріс параметрлерін (газ концентрациясын) физика заңдарына (сорбция кинетикасы) бағынатын нейрондық желі арқылы қалпына келтіру әдісі, ол физикалық тұрғыдан мүмкін емес нәтижелерді жоққа шығарады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Алгоритм келесідей жұмыс істейді: нейрондық желі «шикі» көп арналы сигналды қабылдайды және бір уақытта үш шаманы есептейді: газ фазасындағы концентрация &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_g\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, пленканың жасырын күйі &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_f\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; және сигналдың өзін реконструкциялау &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Csigma%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Барлық үш параметр физикалық теңдеулермен байланысты болғандықтан, өлшенген σ сигнал мен реконструкцияланған &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Csigma%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; арасындағы сәйкестік ішкі тексеру критерийі ретінде қызмет етеді (1-сурет). Егер арна зақымдалған болса, реконструкция кіріс деректеріне сәйкес келмей қалады, бұл ақаулықты анықтауға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әдіс 12 арналы MSS массивінде су мен этанол қоспаларының әсерімен сыналған; басқа типтегі газдарға немесе әртүрлі физикалық жағдайларға ауыстыру қосымша тексеруді талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторлар ұсынылған жүйе концентрация траекторияларын қалпына келтіріп қана қоймай, аномалияларды дербес анықтайтынын көрсете отырып, химиялық талдауды үлгілерді тану міндетінен жүйе күйін логикалық қорытындылау міндетіне айналдырады.&lt;/p&gt;\n&lt;p&gt;Реконструкция моделі (1c-сурет) кіріс деректер ретінде көп арналы уақытша сигналдарды σ(t) қабылдайды. Уақытша конволюциялық нейрондық желі (TCN) уақытша белгілерді кодтайды, ал ортақ көп қабатты перцептрон (MLP) оларды әр уақыт қадамында үш шығысқа декодтайды: болжамды газ фазасының концентрациясы &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_g\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, рецепторлық пленкалардың ішкі күйін білдіретін пленка фазасының концентрациясы &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_f\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; және өлшенген сигналдың өзін реконструкциялау &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Csigma%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TCN (уақытша конволюциялық желі) — бұл уақыт бойынша тізбектерді талдауға арналған нейрондық желі архитектурасы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл үш шығыс сезу процесінің басқарушы теңдеулері арқылы өзара байланысқан, олар оқыту кезінде шектеу ретінде қолданылады. Сорбция кинетикасы газ молекулаларының рецепторлық пленкаға сіңуін анықтайды:&lt;/p&gt;\n&lt;p&gt;\\frac{d\\hat{C}_f}{dt} = \\frac{1}{ au_s} (K_p\\hat{C}_g - \\hat{C}_f)&lt;/p&gt;\n&lt;p&gt;мұндағы τ_s — сорбцияның уақыт тұрақтысы, K_p — бөліну коэффициенті. Сіңу пленканың ісінуіне әкеледі және кіші деформация болжамында пайда болған деформация &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Cvarepsilon%7D%20%3D%20(v%2F3)%5Chat%7BC%7D_f\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; тең, мұндағы v — сорбцияланған заттың меншікті көлемі. Механикалық жауап стандартты сызықтық қатты дене (SLS) моделімен басқарылады:&lt;/p&gt;\n&lt;p&gt;au_r E_U \\frac{d\\varepsilon}{dt} + E_R\\varepsilon =  au_r \\frac{d\\sigma}{dt} + \\sigma (2)&lt;/p&gt;\n&lt;p&gt;Мұнда E_U және E_R — сәйкесінше релаксацияланбаған және релаксацияланған серпімділік модульдері, τ_r — механикалық релаксацияның уақыт тұрақтысы. Бұл теңдеулер C_g → C_f → σ тізбекті тәуелділігін орнатады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;R₁ және R₂ физикалық шектеулері концентрациялар мен механикалық жауапты байланыстырып, модельдің барлық шығыстары арасындағы өзара сәйкестікті қамтамасыз етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Оқыту барысында теңдеулер тікелей шешілмейді, тек R₁ және R₂ қалдықтары (3 және 4-теңдеулер) ретінде енгізіледі. Авторлар қалдықтарды шығын функциясына бекітілген салмақтармен қосудың орнына, модификацияланған дифференциалды мультипликаторлар әдісін (MDMM) қолданады. Бұл алгоритмге мультипликаторларды автоматты түрде бейімдеуге және Лагранж функциясының ершік нүктесін табуға мүмкіндік береді, бұл физикалық заңдардың қатаң орындалуын қамтамасыз етеді. Осылайша, желі &lt;span class=\"yfm-latex\" data-content=\"L_%7BCg%7D%20%3D%20MSE(C_g%2C%20%5Chat%7BC%7D_g)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; және &lt;span class=\"yfm-latex\" data-content=\"L_V%20%3D%20MSE(%5Csigma%2C%20%5Chat%7B%5Csigma%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; деректер қателерін минималдайды, бұл ретте қалдықтар минималды деңгейде қалуы шарт. Пленка фазасындағы &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_f\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; концентрациясы ешқандай тікелей эксперименталды бақылаусыз, тек осы физикалық шектеулер арқылы анықталады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;MDMM әдісі өте маңызды, себебі ол модельді физикалық процестерге қатаң бағынуға мәжбүрлейді, бұл сигналды реконструкциялауды деректердің тұтастығын тексеру үшін тәуелсіз құрал ретінде пайдалануға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Зерттеу ұсынылған модельдің көп арналы сенсорлардың «шикі» сигналдары негізінде газдардың динамикалық концентрациясын қалпына келтіру қабілетін бағалайды. Эксперименттік қондырғы 12 мембраналық беттік керілу датчигінен тұрады, олар әртүрлі сорбциялық және тұтқыр-серпімді жауаптарды қамтамасыз ету үшін 12 түрлі рецепторлық қабатпен қапталған. Сынақ қоспасы ретінде азот (N₂) арқылы барботаждалған су мен этанол булары пайдаланылды. Су буы газ талдауындағы негізгі кедергі келтіруші фактор болғандықтан, модель оның үлесін этанолмен тең дәрежеде есепке алады. Сигналдар пішіні тікбұрышты, ара тісті, кері ара тісті және Гаусс үлестірімі түрінде өзгертілді. Деректер жиынтығы оқыту үшін 150 және сынақ үшін 50 тізбекті қамтиды, олар синхронды (ортақ толқын пішіні) және асинхронды (тәуелсіз толқын пішіндері) режимдерге бөлінген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Шикі» сигналдар әдісі деректерді алдын ала сүзгіден өткізбей немесе шуды өтемей, тікелей датчиктерден өңдеуді көздейді, бұл модельден физикалық жауаптарды жоғары дәлдікпен түсіндіруді талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;2a, b-суреттерде көрсетілгендей, модель концентрациялардың уақытша құрылымын, соның ішінде шыңдар мен сигнал пішіндерін дәл қайта жасайды. Ең үлкен ауытқулар күрт өзгеретін шекараларда байқалады, мұнда концентрацияның жылдам өзгеруі сенсордың сорбциялық жауап беру жылдамдығынан асып түседі. Бұл калибрлеу үшін жиі қолданылатын тікбұрышты импульстердің динамикалық реконструкция үшін оңтайлы болмауы мүмкін екенін көрсетеді. 2c, d-суреттерге сәйкес, қателік синхронды режимде ±2% және асинхронды режимде ±5% шамасында болып, 25%-дан жоғары концентрацияларда жүйелі ауытқу байқалады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель белгіленген толқын пішініне тәуелсіз газ концентрациясының динамикасын 5%-ға дейінгі дәлдікпен қалпына келтіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нәтижелер бақыланатын қоспалары бар зертханалық модельде алынған; күтпеген шуы бар нақты жағдайларға көшіру қосымша тексеруді талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;3-суретте әртүрлі уақыт терезелерінде (толық, жартылай және ширек ұзындықта) газ концентрацияларының, пленка фазасы күйлерінің және сенсор жауабының бірлескен реконструкциясы көрсетілген. Модель кіріс терезелері қысқарған кезде де нәтижелердің үйлесімділігін сақтайды, бұл алгоритмнің тұрақтылығын растайды.&lt;/p&gt;\n&lt;p&gt;3a,b-суреттерде толық кіріс ұзындығындағы өкілдік тест тізбегі үшін реконструкция көрсетілген. Қайта құрылған &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Csigma%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; сигналы барлық арналар бойынша өлшенген кіріс сигналын дәл қадағалайды. Есептелген пленка концентрациялары &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_f\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; газ фазасындағы &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_g\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; концентрацияларына қатысты уақытша кідірісті көрсетеді, бұл (1)-теңдеумен белгіленген шекті сорбция уақытын көрсетеді. Заттар үшін сипаттамалық уақыт айырмашылықтары оқыту барысында алынған сорбция параметрлеріне сәйкес келеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель тиімді түрде серпімді жауапқа дейін қысқарады, өйткені модульдер қатынасы E_U/E_R бірлікке жақындайды және сорбция уақытының константасы τ_s жылдам концентрация өзгерістерін сүзеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Зерттелген тұтқыр-серпімді (viscoelastic) параметрлер дегенерацияны көрсетеді: E_U/E_R модульдер қатынасы барлық арналар бойынша бірлікке жақын. Тұтқыр-серпімді модель қазіргі жағдайда серпімді модель сияқты жұмыс істейді, өйткені τ_s сорбция уақытының константасы жылдам өтпелі процестерді сүзіп, тұтқыр-серпімді релаксацияны анықтауға мүмкіндік бермейді. Дегенмен, тұтқыр-серпімді шектеу &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_f%20%20o%20%5Chat%7B%5Csigma%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; жолында уақытша тегістікті қамтамасыз ету үшін маңызды. Кіріс терезесі толық ұзындықтың 1/2 (3c,d-сурет) немесе 1/4 (3e,f-сурет) бөлігіне дейін қысқартылғанда, траекториялар орталық бөлікте дәлдігін сақтайды, бұл әдістің кіріс ұзақтығына тәуелсіздігін растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қалдық (residual) — бұл модель болжамы мен нақты деректер арасындағы айырмашылық, ол сыртқы эталонсыз жүйенің сәйкестігін көрсететін индикатор болып табылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторлар қайта құрылған сигнал мен физикалық қалдықтар сенсорлардағы ауытқуларды екі түрлі басқарылатын бұзылыстар арқылы анықтай алатынын тексереді.&lt;/p&gt;\n&lt;p&gt;Әр тест үшін бір арна кездейсоқ таңдалады (4a-сурет) және z-нормаланған кеңістікте бұзылыстар енгізіледі: (i) ығысу (offset) σ'_j → σ'_j + δ, мұнда &lt;span class=\"yfm-latex\" data-content=\"%5Cdelta%20%5Cin%20%5B0%2C%201%5D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (4b-сурет) және (ii) масштабтау (scale) σ'_j → α σ'_j, мұнда &lt;span class=\"yfm-latex\" data-content=\"%5Calpha%20%5Cin%20%5B0.2%2C%201%5D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (4d-сурет). Бұл бұзылыстар сенсорлардың типтік ақауларын: рецепторлардың ластануын, термиялық ығысуды немесе күшейту қателерін имитациялайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель бұзылған сигналды оқытылған көптүрлілікке (manifold) проекциялайды, сондықтан &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Csigma%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; мен σ арасындағы сәйкессіздік қателікті есептелетін индикаторға айналдырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;4c,e-суреттер бұзылыстар кезінде &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_g\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; мен &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_f\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; тұрақты қалатынын, ал &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Csigma%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; бұзылған кірістен ауытқитынын көрсетеді. Сәйкессіздікті сандық бағалау үшін &lt;span class=\"yfm-latex\" data-content=\"I_%7B%5Csigma%7D%20%3D%20%20ext%7BMSE%7D(%5Csigma%2C%20%5Chat%7B%5Csigma%7D)%20%3D%20%5Cfrac%7B1%7D%7BN%7D%20%5Csum_%7Bt%3D1%7D%5EN%20(%5Csigma_i%20-%20%5Chat%7B%5Csigma%7D_i)%5E2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; көрсеткіші енгізіледі. 4g-суретте көрсетілгендей, Iσ ығысу артқан сайын сызықтық түрде өседі. Масштабтау үшін (4h-сурет) жылдам өсу және кейінгі қанығу байқалады. Әдіс ақаулы арнаны анықтауға мүмкіндік береді, өйткені оның Iσ мәні басқа арналарға қарағанда айтарлықтай жоғары.&lt;/p&gt;\n&lt;p&gt;Сигнал амплитудасының өзгеруі Iσ метрикасы арқылы оңай анықталады, алайда кейбір аномалиялар сигнал деңгейінде байқалмауы мүмкін. Мұны көрсету үшін авторлар «сегментті өшіру» (deletionsplice) әдісін қолданды: тесттік тізбектен уақытша фрагмент алынып тасталып, қалған бөліктері біріктіріледі (Сурет 5a). Мұндай үзілістер деректер буфері толып кеткенде немесе датчик қайта іске қосылғанда орын алады. Сигнал мәндері оқыту таратылымына сәйкес келетіндіктен, модель &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Csigma%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;-ны қатесіз қалпына келтіреді және Iσ базалық деңгейде қалады (Сурет 5b).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-f5.jpg\" alt=\"Сурет 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 5&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;R₁ және R₂ физикалық қалдықтары сигнал статистикасы арқылы анықтау мүмкін емес деректер үзілістерін табуға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Алайда, модель шығыстары негізінде есептелген R₁ (сорбция) және R₂ (вискоэластикалық) физикалық қалдықтары үзіліс нүктесінде күрт өседі (Сурет 5c). Уақытша үздіксіздіктің бұзылуы (1)–(2) теңдеулеріне қайшы келеді және бұл қалдықтар арқылы анықталады. Тесттік жиынтық бойынша жылу карталары (heatmaps) бұл «ыстық нүктелердің» тұрақты екенін растайды (Сурет 5d).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Физикалық қалдық — бұл модель болжамының жүйенің негізгі физикалық заңдылықтарынан ауытқу дәрежесі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;«Сегментті алмастыру» (substitution splice) тестінде 70–90 с аралығы басқа жазбадағы сәйкес бөлікпен алмастырылады (Сурет 5e). Барлық деректер шынайы болғанымен, жалғану нүктелерінде динамикалық үзілістер пайда болады. Бұл жағдайда Iσ орташа есеппен 7%-дан аз өседі, бұл базалық шу шегінде қалады, ал R₁ және R₂ екі өңдеу орнын да нақты көрсетеді (Сурет 5f). Осылайша, физикалық сәйкестік тек статистикалық әдістермен анықтау мүмкін емес деректерді қолдан жасау әрекеттерін әшкерелейді.&lt;/p&gt;\n&lt;p&gt;Тәжірибелер Iσ және R₁/R₂ әртүрлі аномалия түрлеріне жауап беретінін көрсетеді. Сигнал ығысқанда немесе масштабталғанда Iσ өседі, ал R₁ және R₂ тұрақты қалады, себебі модель бұзылған кірісті ішкі динамиканы бұзбай оқытылған көптүрлілікке (manifold) проекциялайды. Үзілістер (splice) кезінде жағдай керісінше: Iσ үзілісті көрмейді, ал физикалық қалдықтар оны тікелей анықтайды. Олар бірге көп деңгейлі диагностиканы құрайды: Iσ жаһандық таратылым ығысуларын, ал R₁ және R₂ динамиканың жергілікті бұзылуларын тіркейді.&lt;/p&gt;\n&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;p&gt;Біз көп арналы датчик сигналдары негізінде газ қоспаларының уақыт бойынша өзгеретін концентрацияларын қалпына келтіретін шектелген динамикалық инверсия жүйесін ұсындық. Жүйе белгіленген толқын пішінін, алдын ала анықталған кіріс ұзақтығын немесе тепе-теңдік белгілерін талап етпейді. Модель синхронды және асинхронды араласу жағдайында концентрация траекторияларын тұрақты қалпына келтіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель датчик жауабын &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Csigma%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; және концентрацияларды &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_g\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; бір мезгілде қалпына келтіру арқылы өздігінен тексеру функциясын жүзеге асырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Өздігінен тексеру екі әдіспен орындалады: сигнал сәйкессіздігінің көрсеткіші Iσ (жаһандық ауытқуларды анықтайды) және физикалық қалдықтар R₁ мен R₂ (жергілікті динамикалық бұзушылықтарды тіркейді). Бұл әдістер эталондық деректерсіз қателіктерді анықтауға мүмкіндік береді.&lt;/p&gt;\n&lt;h4 id=\"diagnostika-zhaene-derekterding-tutastyghy\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#diagnostika-zhaene-derekterding-tutastyghy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Диагностика және деректердің тұтастығы&lt;/span&gt;&lt;/a&gt;Диагностика және деректердің тұтастығы&lt;/h4&gt;\n&lt;p&gt;Эксперименттер диагностикалық құралдар қателіктің себебіне емес, физикалық сәйкессіздік класына жауап беретінін көрсетті. Мысалы, арнадағы ығысу датчиктің ластануынан немесе оқу тізбегіндегі қателіктен туындауы мүмкін. Жүйе мәселені локализациялайды, бірақ себебін анықтау сыртқы контекстті талап етеді. Техникалық қызмет көрсетуде Iσ датчик сезімталдығының төмендеуін анықтау үшін қызмет етеді. Деректердің тұтастығын тексеруде физикалық қалдықтар деректерді өшіру және ауыстыру жағдайларын сәтті анықтады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жүйе толық аутентификация жүйесі емес, бірақ қосымша жабдықсыз физикалық негізделген тексеруді қосады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"shekteuler-men-perspektivalar\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#shekteuler-men-perspektivalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер мен перспективалар&lt;/span&gt;&lt;/a&gt;Шектеулер мен перспективалар&lt;/h4&gt;\n&lt;p&gt;Ағымдағы тәжірибелер тек су мен этанолдың бинарлы қоспаларымен шектелген. Теориялық тұрғыдан күрделірек қоспаларға көшу мүмкін, бірақ белгілі бір арналар саны үшін қанша газ компонентін анықтауға болатыны ашық сұрақ болып қала береді. Қазіргі жағдайда (EU/ER ≈ 1) SLS моделі серпімді жауапқа теңеседі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Физикалық қалдықтар — бұл модель болжамы мен нақты өлшем арасындағы айырмашылық, ол физикалық заңдылықтардың бұзылуын көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Модель оқу деректері аясындағы динамиканы дұрыс сипаттайды деп болжанады. Егер нақты динамика өзгерсе, физикалық қалдықтар Iσ өзгермей тұрып артуы мүмкін. Сондай-ақ, жүйе физикалық заңдарға толық сәйкес келетін жалған жазбаларды (мысалы, алдын ала жазылған таза деректерді қайта ойнату) анықтай алмайды. Болашақта күрделірек қоспалар мен автоматтандырылған шешім қабылдау хаттамаларын интеграциялау жоспарланған.&lt;/p&gt;\n&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"51-sensorlykh-massiv-zhaene-eksperimenttik-oelsheuler\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#51-sensorlykh-massiv-zhaene-eksperimenttik-oelsheuler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5.1 Сенсорлық массив және эксперименттік өлшеулер&lt;/span&gt;&lt;/a&gt;5.1 Сенсорлық массив және эксперименттік өлшеулер&lt;/h4&gt;\n&lt;p&gt;Сенсорлық массив үшін он екі түрлі полимерлі рецептормен қапталған MSS чиптері қолданылды: PVF, PS, PCL, PMMA, CAB, TENAX, P4MS, PSF, PVP, PVC, PMVE және PBA. Полимерлер N,N-диметилформамид (DMF) немесе 1,1,2,2-тетрахлорэтанда (TCE) ерітіліп, IJHBS-300 саптамасы бар струйлы принтер (LaboJet-500SP) көмегімен чиптерге жағылды. Еріткіш 60 °C температурада буланып, үлгілер 24 сағат бойы бөлме температурасында кептірілді. Өлшеу камерасына үш төрт арналы чип орнатылды. Сенсор сигналдары 100 Гц жиілікте жазылып, талдау үшін 20 Гц-ке дейін төмендетілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Струйлы бүрку (inkjet spotting) — полимер ерітіндісін сенсор бетіне микродозалармен дәл тарату әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"52-gaz-beru-hattamalary\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#52-gaz-beru-hattamalary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5.2 Газ беру хаттамалары&lt;/span&gt;&lt;/a&gt;5.2 Газ беру хаттамалары&lt;/h4&gt;\n&lt;p&gt;Су және этанол буларының динамикалық бинарлы қоспалары үш массалық шығын реттегіші (MFC) және тасымалдаушы газ ретінде азот (N2) көмегімен жасалды. Қоспа құрамы төрт түрлі толқын пішіні (тікбұрышты, ара тісті, кері ара тісті және Гаусс) бойынша реттелді. Әр өлшеу циклі 240 с созылды: тазарту (20 с), белсенді инъекция (120 с) және қорытынды тазарту (100 с). Екі режим қолданылды: синхронды және асинхронды араластыру. Оқыту жиынтығы 150, тест жиынтығы 50 тізбектен тұрады. Деректер 160 с (3200 уақыт қадамы) дейін қысқартылды.&lt;/p&gt;\n&lt;h4 id=\"53-fizikagha-negizdelgen-model\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#53-fizikagha-negizdelgen-model\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5.3 Физикаға негізделген модель&lt;/span&gt;&lt;/a&gt;5.3 Физикаға негізделген модель&lt;/h4&gt;\n&lt;p&gt;Динамика екі кезеңнен тұрады. Сорбция кинетикасы (1-теңдеу) масса алмасуды τ_s және K_p параметрлерімен сипаттайды. Механикалық жауап стандартты сызықтық қатты дене моделіне (2-теңдеу) негізделеді және &lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon%20%3D%20(v%2F3)%20C_f\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; қатынасы арқылы пленка концентрациясымен байланысады. n сенсор мен g газ үшін әр жұпқа τ_s, K_p және әр сенсорға вискоэластикалық параметрлер (τ_r, E_U, E_R) жеке оқытылатын шамалар болып табылады.&lt;/p&gt;\n&lt;h4 id=\"54-nejrondykh-zheli-arhitekturasy\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#54-nejrondykh-zheli-arhitekturasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5.4 Нейрондық желі архитектурасы&lt;/span&gt;&lt;/a&gt;5.4 Нейрондық желі архитектурасы&lt;/h4&gt;\n&lt;p&gt;Модель 11 қабатты каузалды емес уақытша конволюциялық желіден (TCN) тұрады (кеңейту факторлары &lt;span class=\"yfm-latex\" data-content=\"2%5E0%2C%20%5Cdots%2C%202%5E%7B10%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, ядро өлшемі 3, 64 арна). Рецептивті өріс 4095 уақыт қадамын қамтиды. TCN шығысы 512 нейронды екі жасырын қабаты бар ортақ MLP арқылы декодталады және &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_g%2C%20%5Chat%7BC%7D_f%2C%20%5Chat%7B%5Csigma%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; болжау үшін 128 нейронды үш шығыс блогына қосылады. Әр қабаттан кейін dropout (p=0.1) қолданылады.&lt;/p&gt;\n&lt;h4 id=\"55-okhytu-makhsattary-men-shekteuler\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#55-okhytu-makhsattary-men-shekteuler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5.5 Оқыту мақсаттары мен шектеулер&lt;/span&gt;&lt;/a&gt;5.5 Оқыту мақсаттары мен шектеулер&lt;/h4&gt;\n&lt;p&gt;Мақсатты функция — сигналды реконструкциялау &lt;span class=\"yfm-latex\" data-content=\"L_V%20%3D%20MSE(V%2C%20%5Chat%7BV%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; және концентрацияны болжау &lt;span class=\"yfm-latex\" data-content=\"L_%7BCg%7D%20%3D%20MSE(C_g%2C%20%5Chat%7BC%7D_g)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; қателерінің қосындысы. Физикалық қалдықтар R₁, R₂ және E_U/E_R ≥ 1 шектеуі модификацияланған дифференциалды мультипликаторлар әдісі (MDMM) арқылы енгізіледі. Оңтайландыру Adan алгоритмі және ReduceLROnPlateau кестесі (бастапқы жылдамдық 10⁻³, минималды 10⁻⁵) көмегімен жүзеге асырылады. Оқыту 800 эпоха шыдамдылық шегінде тоқтатылады.&lt;/p&gt;\n&lt;h4 id=\"56-perturbaciya-eksperimentteri\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#56-perturbaciya-eksperimentteri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5.6 Пертурбация эксперименттері&lt;/span&gt;&lt;/a&gt;5.6 Пертурбация эксперименттері&lt;/h4&gt;\n&lt;p&gt;Оқытудан кейін желі параметрлері қатырылады. Жаһандық пертурбациялар: ығысу (базис дрейфін имитациялау үшін &lt;span class=\"yfm-latex\" data-content=\"%5Cdelta%20%5Cin%20%5B0%2C%201%5D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; қосу) және масштабтау (сезімталдықтың деградациясын имитациялау үшін &lt;span class=\"yfm-latex\" data-content=\"%5Calpha%20%5Cin%20%5B0.2%2C%201%5D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; көбейту). Сплайс-пертурбациялар: уақытша сегментті өшіру және орын алмастыру (70–90 с сегментін басқа тізбекпен алмастыру), бұл жазбаларды өңдеуді имитациялайды.&lt;/p&gt;\n&lt;h4 id=\"57-baghalau-metrikalary\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#57-baghalau-metrikalary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5.7 Бағалау метрикалары&lt;/span&gt;&lt;/a&gt;5.7 Бағалау метрикалары&lt;/h4&gt;\n&lt;p&gt;Концентрацияны реконструкциялау дәлдігі барлық тесттік тізбектер бойынша қалпына келтірілген және нақты концентрация траекториялары арасындағы орташа квадраттық қателік (RMSE) пен детерминация коэффициенті (R²) арқылы бағаланады. Сигналдың сәйкессіздігі Iσ (5-теңдеу) әр арна үшін өлшенген кіріс сигналы мен реконструкцияланған сигнал арасындағы орташа квадраттық қателікті сандық түрде анықтайды. Физикалық қалдықтар R₁ және R₂ (3–4-теңдеулер) әр траектория бойымен нүктелі түрде бағаланады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RMSE қалпына келтірілген мәндердің нақты мәндерден орташа ауытқуын көрсетеді, ал R² модель түсіндіре алатын дисперсия үлесін сипаттайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Арналар бойынша RMSE, R² мәндері және қателіктердің кумулятивті таралуы 5-қосымша жазбада берілген.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 1.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-tT1.jpg\" alt=\"Кесте 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-f1.jpg\" alt=\"Сурет 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-f2.jpg\" alt=\"Сурет 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-f3.jpg\" alt=\"Сурет 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-f4.jpg\" alt=\"Сурет 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 4&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS2.jpg\" alt=\"S2-сурет. Әртүрлі кездейсоқ бастапқы мәндері бар бес тәуелсіз іске қосу нәтижелері бойынша физикалық модель үшін оқыту ж\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S2-сурет. Әртүрлі кездейсоқ бастапқы мәндері бар бес тәуелсіз іске қосу нәтижелері бойынша физикалық модель үшін оқыту және валидациялау шығындарының қисықтары.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;S2-сурет. Әртүрлі кездейсоқ бастапқы мәндері бар бес тәуелсіз іске қосу нәтижелері бойынша физикалық модель үшін оқыту және валидациялау шығындарының қисықтары. Тұтас сызықтар: медиана; штрихталған аймақтар: минимум мен максимум аралығы. Жоғарғы қатар: жалпы шығындар, LC концентрация шығындары және LV сигналды реконструкциялау шығындары. Төменгі қатар: R2 1 (сорбция) және R2 2 (вязкосерпімділік) физикалық қалдықтарының квадраттары.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS3.jpg\" alt=\"S3-сурет. Эксперименттік қондырғының сызбасы. MFC-1 және MFC-2 сәйкесінше этанол мен суы бар барботерлер арқылы N2 өткіз\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S3-сурет. Эксперименттік қондырғының сызбасы. MFC-1 және MFC-2 сәйкесінше этанол мен суы бар барботерлер арқылы N2 өткізеді. MFC-3 сұйылтуға арналған N2-ні қамтамасыз етеді. Газ қоспасы 12 арналы MSS матрицасы бар датчик ұяшығына беріледі.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS4.jpg\" alt=\"S4-сурет. MFC-ны басқару үшін қолданылатын толқын пішінінің төрт түрі: тікбұрышты, ара тісті, кері ара тісті және Гаусс \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S4-сурет. MFC-ны басқару үшін қолданылатын толқын пішінінің төрт түрі: тікбұрышты, ара тісті, кері ара тісті және Гаусс пішіні.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS5.jpg\" alt=\"S5-сурет. Синхронды (жоғарғы) және асинхронды (төменгі) араластыру кезіндегі газ фазасындағы Cg концентрациясының репрез\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S5-сурет. Синхронды (жоғарғы) және асинхронды (төменгі) араластыру кезіндегі газ фазасындағы Cg концентрациясының репрезентативті профильдері. Синхронды режимде екі компонент те бірдей толқын пішініне ие; асинхронды режимде әр компонент тәуелсіз толқын пішінін ұстанады.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS6.jpg\" alt=\"S6-сурет. S5-суреттегі концентрация профильдеріне сәйкес келетін синхронды (жоғарғы) және асинхронды (төменгі) араластыр\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S6-сурет. S5-суреттегі концентрация профильдеріне сәйкес келетін синхронды (жоғарғы) және асинхронды (төменгі) араластыру кезіндегі 12 арналы датчиктің репрезентативті шығыс сигналдары.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS7.jpg\" alt=\"S7-сур. Бес тәуелсіз оқыту циклі бойынша жинақталған әрбір датчик арнасы үшін қалпына келтірілген физикалық параметрлер \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S7-сур. Бес тәуелсіз оқыту циклі бойынша жинақталған әрбір датчик арнасы үшін қалпына келтірілген физикалық параметрлер (орташа ± стандартты ауытқу).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;S7-сур. Бес тәуелсіз оқыту циклі бойынша жинақталған әрбір датчик арнасы үшін қалпына келтірілген физикалық параметрлер (орташа ± стандартты ауытқу). Жоғарыда: этанол мен су үшін сорбцияның уақыт тұрақтысы 𝜏𝑠. Ортада: модульдер қатынасы 𝐸𝑈/𝐸𝑅. Төменде: механикалық релаксацияның уақыт тұрақтысы 𝜏𝑟.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS8.jpg\" alt=\"S8-сур. Үш модель нұсқасы бойынша репрезентативті тест тізбегін реконструкциялау.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S8-сур. Үш модель нұсқасы бойынша репрезентативті тест тізбегін реконструкциялау.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;S8-сур. Үш модель нұсқасы бойынша репрезентативті тест тізбегін реконструкциялау. Жоғарғы қатар: этанол мен су үшін нақты деректердің (тұтас сызық) үстіне салынған 𝐶𝑔 болжамдары (үзік сызық). Ортаңғы қатар: бір репрезентативті арна (PVF) үшін кіріс деректеріне қатысты реконструкцияланған ̂𝜎 сигналы. Төменгі қатар: екі газ түрі үшін үлдір фазасындағы концентрацияның өзгеруі Δ𝐶𝑓 = 𝐶𝑓(𝑡) − 𝐶𝑓(0).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS9.jpg\" alt=\"S9-сур. 50 қалыпты тест тізбегіндегі өзін-өзі тексеру метрикаларының ядролық тығыздық бағалаулары.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S9-сур. 50 қалыпты тест тізбегіндегі өзін-өзі тексеру метрикаларының ядролық тығыздық бағалаулары.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;S9-сур. 50 қалыпты тест тізбегіндегі өзін-өзі тексеру метрикаларының ядролық тығыздық бағалаулары. Солда: сигналдың сәйкессіздігі 𝐼𝜎. Ортада: орташа сорбциялық қалдық /ℛ1/. Оңда: орташа тұтқыр-серпімді қалдық /ℛ2/. Мәндер әрбір тізбектегі әрбір арна үшін есептелген (әр модель үшін 600 мән).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS10.jpg\" alt=\"S10-сур. 12 датчик арнасының әрқайсысы үшін аддитивті ығысу шамасының функциясы ретіндегі сигнал сәйкессіздігі 𝐼𝜎. Кіріс\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S10-сур. 12 датчик арнасының әрқайсысы үшін аддитивті ығысу шамасының функциясы ретіндегі сигнал сәйкессіздігі 𝐼𝜎. Кірістірілген сурет: ығысу = 0 болғандағы KDE таралуы әр модель үшін базалық 𝐼𝜎 деңгейін көрсетеді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS11.jpg\" alt=\"S11-сур. 12 датчик арнасының әрқайсысы үшін мультипликативті масштабтау коэффициентінің функциясы ретіндегі сигнал сәйке\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S11-сур. 12 датчик арнасының әрқайсысы үшін мультипликативті масштабтау коэффициентінің функциясы ретіндегі сигнал сәйкессіздігі 𝐼𝜎. Кірістірілген сурет: масштабтау коэффициенті = 1 болғандағы KDE таралуы әр модель үшін базалық 𝐼𝜎 деңгейін көрсетеді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS12.jpg\" alt=\"S12-сур. Кіріс бұзылыстары кезіндегі ℛ1 сорбциялық қалдық шамасы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S12-сур. Кіріс бұзылыстары кезіндегі ℛ1 сорбциялық қалдық шамасы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;S12-сур. Кіріс бұзылыстары кезіндегі ℛ1 сорбциялық қалдық шамасы. (a, c) ℛ1 орташа мәнінің ығысу (a) және күшейту (c) бұзылыс шамасының функциясы ретіндегі көрсеткіші. Штрихталған аймақтар стандартты ауытқуды білдіреді. (b, d) Ығысу (b) және күшейту (d) шарттары үшін таңдалған бұзылыс шамаларындағы ℛ1 таралуы. Күлгін түс: бұзылған арна; сұр: бұзылмаған арналар; қою сұр: базалық деңгей (бұзылыссыз).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS13.jpg\" alt=\"S13-сур. Кіріс бұзылыстары кезіндегі ℛ2 тұтқыр-серпімді қалдық шамасы, құрылымы S12-суретке ұқсас. ℛ2 𝐼𝜎-ның монотонды ө\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S13-сур. Кіріс бұзылыстары кезіндегі ℛ2 тұтқыр-серпімді қалдық шамасы, құрылымы S12-суретке ұқсас. ℛ2 𝐼𝜎-ның монотонды өсуінен айырмашылығы, екі бұзылыс түрінде де салыстырмалы түрде тұрақты болып қалады.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS14.jpg\" alt=\"S14-сур. 𝐼𝜎 және физикалық қалдық шамалардың өзара толықтырғыштығын көрсететін тізбектен фрагментті жою.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S14-сур. 𝐼𝜎 және физикалық қалдық шамалардың өзара толықтырғыштығын көрсететін тізбектен фрагментті жою.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;S14-сур. 𝐼𝜎 және физикалық қалдық шамалардың өзара толықтырғыштығын көрсететін тізбектен фрагментті жою. Сол жақ баған: жойылған фрагменті бар тізбек (t=85 с кезінде 100 нүкте жойылған, қызыл штрихталған сызық). Оң жақ баған: қалыпты эталондық тізбек (қызыл штрихталған жолақ жойылған сегментті көрсетеді). Жоғарыдан төмен қарай жолдар: кіріс сигналы, қайта құрылған 𝜎, уақытқа тәуелді 𝐼𝜎(𝑡), қайта құрылған ̂𝐶𝑔, ℛ1 сорбциялық қалдық шамасы және ℛ2 тұтқыр-серпімді қалдық шамасы. t=0 кезіндегі KDE таралуы қалыпты тест деректері бойынша базалық таралуды көрсетеді. Үзіліс нүктесі ℛ1 және ℛ2-де күрт секірістерді тудырады, бірақ 𝐼𝜎-да айтарлықтай өзгерістер тудырмайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS15.jpg\" alt=\"S15-сур. Тізбек фрагментін алмастыру үшін модельдің өкілдік шығыс деректері. 70–90 с сегменті басқа тест тізбегінің сәйк\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S15-сур. Тізбек фрагментін алмастыру үшін модельдің өкілдік шығыс деректері. 70–90 с сегменті басқа тест тізбегінің сәйкес сегментімен алмастырылған; штрихталған сызықтар екі түйісу нүктесін белгілейді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS16.jpg\" alt=\"S16-сур. Жою (жоғарғы жол) және алмастыру (төменгі жол) үшін арна бойынша түйісуді анықтау статистикасы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S16-сур. Жою (жоғарғы жол) және алмастыру (төменгі жол) үшін арна бойынша түйісуді анықтау статистикасы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;S16-сур. Жою (жоғарғы жол) және алмастыру (төменгі жол) үшін арна бойынша түйісуді анықтау статистикасы. Қораптар 50 тест тізбегі бойынша түйісу(лер)ден ±1 с аралығындағы ең жоғары абсолютті қалдықтың таралуын көрсетеді, ℛ1 сорбциялық қалдық шамасы (екі газ бойынша максимум, сол жақ баған) және ℛ2 тұтқыр-серпімді қалдық шамасы (оң жақ баған) үшін. Сұр ромбтар әрбір жазбаның қалған бөлігі бойынша абсолютті қалдықтың 99-перцентилінің медианасын белгілейді. Ескертпе: логарифмдік шкала.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS17.jpg\" alt=\"S17-сурет. Тесттік жиынтық бойынша этанол мен су концентрациясын реконструкциялаудың орташа квадраттық қателігі (RMSE). \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S17-сурет. Тесттік жиынтық бойынша этанол мен су концентрациясын реконструкциялаудың орташа квадраттық қателігі (RMSE). Асинхронды араластыру (сол жақта) және синхронды араластыру (оң жақта). Қателік сызықтары стандартты ауытқуды көрсетеді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS18.jpg\" alt=\"S18-сурет. 12 сенсорлық арнаның әрқайсысы үшін реконструкцияланған сигналдың кумулятивті орташа квадраттық қателігі (RMS\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S18-сурет. 12 сенсорлық арнаның әрқайсысы үшін реконструкцияланған сигналдың кумулятивті орташа квадраттық қателігі (RMSE). Асинхронды араластыру (сол жақта) және синхронды араластыру (оң жақта). Қателік сызықтары стандартты ауытқуды көрсетеді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS19.jpg\" alt=\"S19-сурет. 12 сенсорлық арна бойынша реконструкцияланған сигнал үшін R² таралуы. Асинхронды араластыру (сол жақта) және \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S19-сурет. 12 сенсорлық арна бойынша реконструкцияланған сигнал үшін R² таралуы. Асинхронды араластыру (сол жақта) және синхронды араластыру (оң жақта). Скрипка диаграммалары толық таралуды көрсетеді; маркерлер экстремалды мәндерді белгілейді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS20.jpg\" alt=\"S20-сурет. Таңбасы өзгертілген кіріс сигналы (барлық арналар −1-ге көбейтілген). Жоғарыдан төмен қарай қатарлар: кіріс с\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S20-сурет. Таңбасы өзгертілген кіріс сигналы (барлық арналар −1-ге көбейтілген). Жоғарыдан төмен қарай қатарлар: кіріс сигналы, реконструкцияланған Cg, кіріс сигналына қатысты реконструкцияланған 𝜎 және бір репрезентативті арна (PVF) үшін ΔCf.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Датчиктердің&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;калибрлеусіз&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;алдауы&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Полимерлер&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;механикасына&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сүйенген TCN&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\"
