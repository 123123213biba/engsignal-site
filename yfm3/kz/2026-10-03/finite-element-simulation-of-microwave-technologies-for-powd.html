            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"247\" cy=\"83\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"693\" cy=\"245\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · PRINTING_3D   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Лазер орнына микротолқын:&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;металл мен керамиканы&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;көлемді басып шығару&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd-f1.jpg\" alt=\"1-сурет: Қазіргі және ұсынылатын AM (аддитивті өндіріс) жүйелерінің мысалдары.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: Қазіргі және ұсынылатын AM (аддитивті өндіріс) жүйелерінің мысалдары.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет: Қазіргі және ұсынылатын AM (аддитивті өндіріс) жүйелерінің мысалдары. a) Металл ұнтақтарына арналған лазерлік PBF (ұнтақты қабатты синтездеу) графикасы (39). b) Фотосезімтал шайырлар мен оптикалық жиіліктерді пайдаланатын VAM (көлемдік аддитивті өндіріс) жүйесінің сызбасы. DLP проекторы уақытқа тәуелді кескіндерді бір ось бойымен жасау үшін параксиалды көздерден алынған айнымалы дифракция мен интерференцияны пайдаланады, ал айналмалы платформа екі өлшемді кескін жазықтығын үш өлшемді пішіндерге дейін кеңейтуге мүмкіндік береді. Сурет «Volumetric additive manufacturing via tomographic reconstruction» (30) мақаласынан. AAAS рұқсатымен бейімделген. c) Мукерджи және басқалар (34) ұсынған микротолқынды VAM жүйесі, b) тармағындағы оптикалық жүйеге балама. Антенналар саны жеткілікті болғанда, антенналық массив электр өрісінің қарқындылығын толық бақылайды және айналмалы платформасыз VAM-ға қол жеткізуге мүмкіндік береді. Сурет «Towards microwave volumetric additive manufacturing: Generation of a computational multi-physics model for localized curing» (34) мақаласынан. Elsevier рұқсатымен бейімделген. d) Ұсынылған микротолқынды VAM жүйесінің графикасы. Диэлектрлік қабырғалармен (жасыл) ұсталып тұрған ұнтақ көлемін (көк) қамтитын толқын өткізгіш (қызғылт сары) жүйеге микротолқынды энергияны енгізеді. Құрылғының кіріс көлденең модаларына тәуелді табиғи электромагниттік модалары өріс қарқындылығы ең жоғары болатын ұнтақ аймақтарын таңдап балқытады. e) Архитектуралық 3D &lt;a href=\"concepts/meshi.html\"&gt;тор&lt;/a&gt; ұяшықтарын таңдау. Бұл жұмыс 1 мм шамасындағы ұяшықтары бар торларға назар аударады. Сурет «Architected cellular materials: A review on their mechanical properties towards fatigue-tolerant design and fabrication» (40) мақаласынан. Elsevier рұқсатымен бейімделген.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Дәстүрлі 3D басып шығару қабаттап синтездеу жылдамдығымен және материалдар түрімен шектелген. Зерттеушілер керамика мен металдармен жұмыс істеуге мүмкіндік беретін микротолқынды көлемді басып шығару (VAM) әдісін ұсынды. Шекті элементтерді модельдеу арқылы ұнтақ қабатының ішінде термиялық торлар жасайтын құрылғылар жобаланды.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Керамика мен металдарды басып шығару үшін 8–40 ГГц микротолқынды сәулелену.&lt;/li&gt;\n&lt;li&gt;100 кВт қуатта ~1 мм өлшемді термиялық торларды қалыптастыру.&lt;/li&gt;\n&lt;li&gt;Термиялық өрістерді оңтайландыру үшін шекті элементтерді модельдеу.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Жұмыста COMSOL Multiphysics ортасында шекті элементтер талдауы (FEM) арқылы құрылғылардың үш түрі: сызықтық резонатор, қиылысқан интерферометр және шекаралық жылытқыш модельденді. Ұнтақтармен жұмыс істеу кезіндегі есептеу күрделілігін жеңу үшін тиімді орта жуықтауы қолданылды, мұнда бөлшек өлшемі толқын ұзындығынан (8–40 ГГц диапазоны) әлдеқайда кіші болса, материал біртекті көлем ретінде қарастырылады.&lt;/p&gt;\n&lt;p&gt;Нәтижелер жиілік пен қуатты (шамамен 100 кВт) дәл басқару арқылы 1 мм шамасындағы тор ұяшығы бар термиялық түйіндерді қалыптастыруға болатынын көрсетеді. Резонаторлар мен интерферометрлер керамикалық және композиттік ұнтақтарда 3D торларды синтездеуді қамтамасыз етеді, ал шекаралық жылытқыштар таза металдардан қуыс қабықшаларды басып шығаруға мүмкіндік береді. Микротолқынды сәулеленуді пайдалану мөлдір фотополимерлі шайырларға деген қажеттілікті жояды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу теориялық сипатқа ие; Пашеннің бұзылу эффектілері мен құрылғыларды жасаудағы нақты ақаулар ескерілмеген.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Көлемді қосымша өндіріс (VAM) — бұл дәстүрлі 3D-басып шығаруға қарағанда өндіріс уақытын қысқартатын және күрделі геометриялық пішіндерді жасауға мүмкіндік беретін перспективалы технология. Қазіргі VAM жүйелері тек фотополимерленетін шайырлармен шектелген, бұл олардың өнеркәсіпте қолданылуын шектейді. Бұл жұмыста керамика, металл немесе композиттік ұнтақ шикізатымен үйлесімді микротолқынды VAM жүйелерін шекті элементтер әдісімен (FEM) модельдеу нәтижелері ұсынылған.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Шекті элементтер әдісі (FEM) — бұл күрделі инженерлік нысандарды кішігірім элементтерге бөліп, олардағы температура мен кернеудің таралуын талдау үшін қолданылатын сандық әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Зерттеу құрылғылардың үш түрін қамтиды: сызықтық резонатор, қиылысқан интерферометр және шекаралық жылытқыш. Олардың әрқайсысы ұнтақ материалдардың бір немесе бірнеше түрін өңдеуге әлеуетті мүмкіндік береді. Модельдеу көрсеткендей, кіріс жиілігін, қуатты және толқын өткізгіштің көлденең модтарын дәл басқару арқылы материалдың белгілі бір аймақтарын таңдамалы түрде қыздыратын жылу торларын жасауға болады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Кіріс қуаты 100 кВт шамасында болғанда, өлшемі шамамен 1 мм болатын жылу торларын қалыптастыру мүмкіндігі анықталды, бұл оптикалық әдістер үшін жарамсыз материалдарды қосымша өндіріске жол ашады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нәтижелер тек компьютерлік модельдеу негізінде алынған; ұсынылған жүйелердің нақты қондырғылардағы эксперименттік сынағы жүргізілмеген.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;h4 id=\"khosymsha-oendiristing-zamanaui-aedisteri\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#khosymsha-oendiristing-zamanaui-aedisteri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қосымша өндірістің заманауи әдістері&lt;/span&gt;&lt;/a&gt;Қосымша өндірістің заманауи әдістері&lt;/h4&gt;\n&lt;p&gt;Қосымша өндіріс (AM) күрделі геометриялық бөлшектерді жасауда шығындар мен қалдықтарды азайтуға мүмкіндік береді. Стереолитография (SLA) және цифрлық жарық проекциясы (DLP) сияқты дәстүрлі технологиялар шайыр қабатына 2D кескіндерді проекциялау арқылы қабаттап құрады. Бұл әдістер жарық түсетін шағын көлем мен қабаттардың механикалық қозғалысы салдарынан төмен жылдамдықпен шектелген. Металдар үшін ұнтақ қабатын балқыту (PBF) 0,1 л/сағ, байланыстырғыш затты бүрку (binder jetting) 1000 л/сағ-қа дейін және бағытталған энергияны шөктіру (DED) 0,5 л/сағ жылдамдықта жұмыс істейді. Алайда, бүрку әдісі синтерлеу кезіндегі қысқару және деформациялармен байланысты мәселелерге ие, ал PBF және DED баяу жұмыс істейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Дәстүрлі AM әдістері төмен жылдамдықпен (SLA, DLP, PBF, DED) немесе дәлдік мәселелерімен (binder jetting) шектелген.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"koelemdik-khosymsha-oendiris-vam\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#koelemdik-khosymsha-oendiris-vam\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Көлемдік қосымша өндіріс (VAM)&lt;/span&gt;&lt;/a&gt;Көлемдік қосымша өндіріс (VAM)&lt;/h4&gt;\n&lt;p&gt;Балама әдіс — көлемдік қосымша өндіріс (VAM), мұнда материалдың бүкіл көлемі 1b-суретте көрсетілгендей, лазер сәулелерінің интерференциясы арқылы бір уақытта қатайтылады. Бұл тірек құрылымдарға деген қажеттілікті жояды. VAM-ның негізгі шектеуі — мөлдір фотосезімтал шайырларды пайдалану қажеттілігі; жарықтың шашырауы толтырылған композиттермен жұмыс істеуге кедергі келтіреді. Микротолқынды сәулеленуді пайдалану (1c-сурет) мөлдір емес материалдармен жұмыс істеуге мүмкіндік береді, өйткені микротолқындар микробөлшектерде аз шашырайды. Бұл жұмыста шайырсыз ұнтақ орталар үшін микротолқынды VAM мүмкіндіктері омикалық және дипольдік қыздыру арқылы зерттеледі (1d-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VAM — қабаттап құрудан айырмашылығы, бөлшектің бүкіл көлемін «бірден» басып шығару әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"arhitekturalykh-materialdar\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#arhitekturalykh-materialdar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Архитектуралық материалдар&lt;/span&gt;&lt;/a&gt;Архитектуралық материалдар&lt;/h4&gt;\n&lt;p&gt;Толқын өткізгіштердің табиғи электромагниттік режимдері архитектуралық материалдарды өндіруде талап етілетін периодты торларды жасауға мүмкіндік береді. Бұлар түйіндер мен өзектерден тұратын кеуекті құрылымдар болып, жоғары қаттылық пен беріктік көрсеткіштеріне ие. Олар аэроғарыш өнеркәсібі мен медицинада қолданылады, өйткені олар топологияны оңтайландыруға және бұйым массасын азайтуға мүмкіндік береді. Жұмыста керамика негізіндегі материалдардан мұндай торларды және металл қабықшаларды жылдам әрі энергияны үнемдейтін өндіру үшін резонаторлар мен толқын өткізгіш жүйелерін интеграциялау ұсынылады (1e-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тұжырымдаманы негіздеу (proof of concept) үшін сандық талдау болып табылады, нәтижелерді нақты өндірістік қондырғыларға көшіру эксперименттік тексеруді талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"2-zertteu-aukhymy\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#2-zertteu-aukhymy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. Зерттеу ауқымы&lt;/span&gt;&lt;/a&gt;2. Зерттеу ауқымы&lt;/h4&gt;\n&lt;p&gt;Бұл жұмыс ұнтақ шикізаттарын пайдалана отырып, микротолқынды аддитивті өндірістің (VAM) концепциясын талдауға және оның техникалық мүмкіндіктерін бағалауға арналған. Шекті элементтер әдісін (FEM) қолдана отырып, авторлар құрылғылардың үш архитектурасын зерттейді: 1) ішкі өрісті күшейту мен тұрақты толқындарды пайдаланатын сызықтық резонатор; 2) толқын ұзындығынан кіші өлшемдерге қол жеткізу үшін интерференцияны қолданатын қиылысқан интерферометр; 3) металл ұнтақтарымен үйлесімділікті кеңейтуге арналған шекаралық жылытқыш.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу үш құрылғы архитектурасын бағалайды, оларды энергияны тұтынуды азайту, өрнектердің икемділігін арттыру және материалдар спектрін кеңейту үшін оңтайландырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сызықтық резонатор өрісті күшейту есебінен қуатқа деген талапты азайтуға бағытталған, бірақ басып шығару геометриясын резонанстық модалар жиынтығымен шектейді. Қиылысқан интерферометр өрістің күшеюінен бас тартып, өрнектер еркіндігін қамтамасыз етеді, бұл неғұрлым нәзік бөлшектерді алу үшін кіріс модалары мен фазаларының ерікті комбинацияларын пайдалануға мүмкіндік береді. Шекаралық жылытқыш көлемді түрде қыздыру мүмкін емес металл ұнтақтарымен жұмыс істеуге арналған, бұл тек іші қуыс қабықшалы құрылымдарды басып шығарумен шектеледі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Шекті элементтер әдісі (FEM) — күрделі физикалық жүйелерді ұсақ элементтерге бөлу арқылы өрістер мен температураның таралуын есептеудің сандық әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Зерттеу 8 ГГц пен 40 ГГц аралығындағы аса жоғары жиілікті (SHF) және миллиметрлік толқындар диапазонына бағытталған. Бұл диапазон толқын ұзындығы миллиметрлік ауқымда болғандықтан таңдалды, бұл микрон өлшемді ұнтақтарда шашырауды болдырмайды. Бұл ұнтақ шикізатының электромагниттік және жылулық қасиеттерін анықтау үшін тиімді орта жақындауын қолдануға мүмкіндік береді. Материалдар диэлектрлік керамикамен, металдармен және олардың композиттерімен шектелген; жартылай өткізгіштер олардың температураға тәуелділігі және эмпирикалық деректердің жетіспеушілігіне байланысты зерттеуден шығарылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модельдеу идеалдандырылған шарттармен шектелген: жартылай өткізгіштер қарастырылмайды және жүйелер қауіпсіздікті қамтамасыз ету үшін толығымен өткізгіш қабаттар ішінде локализацияланған модалармен жұмыс істейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"syzykhtykh-rezonator\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#syzykhtykh-rezonator\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сызықтық резонатор&lt;/span&gt;&lt;/a&gt;Сызықтық резонатор&lt;/h4&gt;\n&lt;p&gt;Сызықтық резонатор — толқын өткізгішке орнатылған Фабри-Перо типті резонатор құрылымы. Құрылғы жұтылу деңгейі төмен немесе орташа диэлектрлік ұнтақтарда электр өрісінің қарқындылығынан 3D торларды қалыптастыратын тұрақты толқындарды тудырады. Бұл толқын өткізгіш шекараларымен индукцияланған көлденең модалар мен Фабри-Перо шекараларымен туындаған бойлық модалардың үйлесімі арқылы жүзеге асады. Бұл әдіс керамикалық және композиттік ұнтақтардан негізгі торлы құрылымдарды тікелей басып шығаруға мүмкіндік береді, мұнда құрылымдар резонанстық модалар жиынтығының суперпозициясымен шектеледі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сызықтық резонатор 3D-торларды қалыптастыру үшін толқын өткізгіш және бойлық модаларды пайдаланады әрі жылулық деформацияны болдырмау үшін 200 кВт-тан 1 МВт-қа дейінгі қуатты қажет етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Құрылғы сызбасы (Сурет 3a) таралған Брэгг рефлекторларын (DBR) және ұнтақ салынған камераны қамтиды. Әрбір DBR айнасы ауа саңылауларымен бөлінген жоғары тазалықтағы алюминий оксиді қабаттарынан (ε_r = 9,7,  anδ = 10⁻⁴, 10 ГГц орталық тоқтату диапазоны) тұрады. Ұнтақ ретінде балқытылған кварц (fused silica) таңдалды, өйткені оның диэлектрлік өтімділігінің температураға тәуелділігі төмен (α ≈ 5 \times 10⁻⁵) және диэлектрлік шығындар тангенсі ( anδ ≈ 10⁻³) кварц пен алюминий оксидіне қарағанда бір есе жоғары. Бөлме температурасындағы салыстырмалы диэлектрлік өтімділік 3,8-ге тең.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd-f3.jpg\" alt=\"3-сурет: Таза балқытылған кварц шикізаты бар сызықтық резонатор моделінің сызбасы мен модельдеуі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет: Таза балқытылған кварц шикізаты бар сызықтық резонатор моделінің сызбасы мен модельдеуі.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-сурет: Таза балқытылған кварц шикізаты бар сызықтық резонатор моделінің сызбасы мен модельдеуі. a) Резонатор компоненттерін көрсететін жүйе диаграммасы. 1-порт — белсенді кіріс порты, 2-порт — қабылдағыш порт. b) a) тармағындағы RF және термиялық модельдеу үшін жасалған тетраэдрлік тор профилі. Әрбір аймақ үшін тор өлшеміндегі айырмашылық қабаттар арасындағы ε′ мәндерінің әртүрлілігінен туындайды. c) Есептелген электр өрісі профилінің уақытқа тәуелді y = 0 кезіндегі екі өлшемді қимасы. 250 кВт кіріс қуаты пайдаланылды. d) c) тармағындағыдай жазықтықтағы электромагниттік қыздырудан туындайтын температураның таралуы. Қыздыру әр қадамда электр өрісінің профилін жаңарту үшін барлығы 250 мс ішінде 0,1 мс қадамдармен есептелді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Таралған Брэгг рефлекторы (DBR) — бұл белгілі бір жиіліктегі электромагниттік толқындарды тиімді шағылыстыратын, сыну көрсеткіші әртүрлі материалдардың кезектесіп орналасқан қабаттарынан тұратын құрылым.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ұнтақпен толтырылған қуыстың ұзындығы 97,3 мм. DBR айналарына өрістің енуін ескере отырып, резонатордың тиімді оптикалық ұзындығы 9,825 ГГц резонанстық жиілікте 6λ_g ≈ 99,9 мм-ді құрайды, мұнда λ_g — толқын өткізгіштегі толқын ұзындығы. Айырмашылық әрбір айнада 1,3 мм өрістің енуіне сәйкес келеді. Кварцтың диэлектрлік өтімділігінің температураға тәуелділігі балқу температурасы T_m = 1986 К (1713 °C) дейінгі сызықтық экстраполяция арқылы модельденеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель кварцтың балқу температурасына дейінгі диэлектрлік қасиеттерінің сызықтық экстраполяциясына негізделген, өйткені эксперименттік деректер жеткіліксіз, бұл нәтижелердегі белгісіздіктің негізгі көзі болып табылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"shekti-elementter-taldauynyng-parametrleri-zhaene-temperaturalykh-dinamika\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#shekti-elementter-taldauynyng-parametrleri-zhaene-temperaturalykh-dinamika\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шекті элементтер талдауының параметрлері және температуралық динамика&lt;/span&gt;&lt;/a&gt;Шекті элементтер талдауының параметрлері және температуралық динамика&lt;/h4&gt;\n&lt;p&gt;Сандық модельдеу үшін біртекті емес тор (Сурет 3b) құрылды, оның ажыратымдылығы алюминий оксиді қабаттары мен ауа саңылаулары арасында айтарлықтай өзгешеленеді. Уақыт қадамы 0,1 мс болып белгіленді. TE₁₀ негізгі режиміндегі микротолқындар белсенді порт арқылы енгізіліп, қабылдағыш портта тіркелді. Модельдеу нәтижелері (Сурет 3c, 3d) резонатордың тұрақты толқындарының түйіндерінде 8,33 мм қадаммен қызуды көрсетеді, бұл λ_g/2 мәніне тең (мұндағы λ_g — ұнтақпен толтырылған толқын өткізгіштегі толқын ұзындығы).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Үш кезеңді DBR жүйесін пайдалану 250 мс ішінде 250 кВт кіріс қуатымен Tmax = 1215 К (942 °C) температураға жетуге мүмкіндік береді, ал айналарсыз жүйе тек 393 К (120 °C) дейін ғана қызады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;DBR (Distributed Bragg Reflector) — электромагниттік толқындар үшін жоғары тиімді айна қызметін атқаратын, сыну көрсеткіштері әртүрлі қабаттардан тұратын құрылым.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"temperaturalykh-suezu-zhaene-sapa-koefficientin-ongtajlandyru\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#temperaturalykh-suezu-zhaene-sapa-koefficientin-ongtajlandyru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Температуралық сүзу және сапа коэффициентін оңтайландыру&lt;/span&gt;&lt;/a&gt;Температуралық сүзу және сапа коэффициентін оңтайландыру&lt;/h4&gt;\n&lt;p&gt;Құрылғы температуралық сүзу эффектісін көрсетеді: ортаның диэлектрлік өтімділігі температурамен бірге артып, фазаны өзгертеді және резонаторды резонанс күйінен шығарады. Бұл Tmax мәнін шектейді. 1% техникалық көміртекті қосу (бөлме температурасында тиімді &lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon'_%7Beff%7D%20%3D%203%2C75\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; және  anδeff = 0,02) бұл мінез-құлықты растады: Tmax = 1198 К (925 °C) мәніне қол жеткізілді, бірақ қуат шығыны 210 кВт-қа дейін төмендеді (Сурет 4a).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd-f4.jpg\" alt=\"4-сурет: 250 мс ішінде қол жеткізілетін максималды ішкі температураны және 3D температуралық тордың қалыптасуын зерттеу.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет: 250 мс ішінде қол жеткізілетін максималды ішкі температураны және 3D температуралық тордың қалыптасуын зерттеу.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-сурет: 250 мс ішінде қол жеткізілетін максималды ішкі температураны және 3D температуралық тордың қалыптасуын зерттеу. a) Тиімді ортаның шығын тангенсінің қыздыру қисығына әсері, таза балқытылған кварцты (tanδ = 0,001) 1% техникалық көміртегі композитімен (tanδ = 0,02) салыстыру. b) Резонатордың Q-факторының қыздыру қисығына әсері; Q = 18, 75 және 890 Q-факторлары әр айна үшін сәйкесінше нөл, бір және үш алюминий оксиді/ауа кезеңдеріне сәйкес келеді. c) Бір қабатты резонатор ішіндегі 3D торды көрсетеді және минималды бойлық және көлденең қашықтықтарды 2,1 мм және 5,1 мм деп анықтайды. d) Көлемдегі максималды температура нүктесін (Tmax = 443 К (170 °C)) қиып өтетін температураның x-z қимасын бейнелейді, бойлық торды егжей-тегжейлі көрсетеді. e) Осы құрылғыдан алынған архитектуралық материалдың рендерін бейнелейді. Қолданылған жылу алмасуы бар импульстік қыздыру тізбектерін пайдалана отырып, термиялық түйіндер көлденең мода профилімен анықталған тіректермен бір-бірінің үстіне шығатын профильге дейін кеңейеді және текше (немесе тікбұрышты) тор құрылымына дейін синтезделеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Фабри-Перо резонаторларының сапа коэффициентін (Q) талдау (Сурет 4b) Q = 75 мәні өрісті күшейту мен резонанс сызығының ені арасындағы тепе-теңдік үшін оңтайлы екенін көрсетеді. Q мәні жоғары болғанда, есептелген температуралар кремний диоксидінің балқу температурасынан асып кетеді, бұл модельді физикалық тұрғыдан орынсыз етеді. 36 ГГц жиілігінде TE₃₂ режимін пайдалану үш өлшемді термиялық торларды қалыптастыруға мүмкіндік береді (Сурет 4c, 4d), бұл керамикалық құрылымдарды детерминирленген басып шығару жолдарын ашады (Сурет 4e).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модельдеу сызықтық диэлектрлік өтімділік моделіне негізделген; материалдың балқу температурасынан жоғары температураларда нәтижелер эксперименталды тексеруді қажет етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"koeldeneng-interferometr\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#koeldeneng-interferometr\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Көлденең интерферометр&lt;/span&gt;&lt;/a&gt;Көлденең интерферометр&lt;/h4&gt;\n&lt;p&gt;Көлденең интерферометр конструкциясы екі WR-90 толқын өткізгішінің L-тәрізді қосылысынан тұрады. Олардың қиылысу аймағында алюминий оксидінен жасалған екі жұқа қабырғамен шектелген кремний диоксидінің ұнтағы ұсталады. Жүйе екі перпендикуляр кірістен келетін толқындардың интерференциясы есебінен үш өлшемді торларды қалыптастырады, бұл төрт көзді антенналық торға ұқсас. Сызықтық резонатордан айырмашылығы, бұл схема кіріс параметрлерін еркін белгілеуге мүмкіндік береді және өріс профилін басқаруда икемділікті қамтамасыз етеді, дегенмен ол өрісті іштей күшейту және моданы тұрақтандыру артықшылығын жоғалтады. Жүйе геометриясы, соның ішінде өріс сингулярлықтарының алдын алу үшін бұрыштарды дөңгелектеу 5a және 5b-суреттерде көрсетілген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Көлденең интерферометр — екі түрлі көзден келетін толқындардың үсті-үстіне түсуі арқылы электромагниттік өрістің интерференциялық көрінісін қалыптастыратын құрылғы, ол ұнтақ ішіндегі энергияның таралуын икемді басқаруға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Модельдеу TE₃₂ модасы үшін 1 және 2-порттарға микротолқынды сәулелену берілгенде жүзеге асырылды. Есептеу 0,1 мс қадаммен 100 мс ұзақтықты қамтыды. Ұнтақ аймағындағы электромагниттік өріс қызу барысында диэлектрлік өтімділіктің температураға тәуелділігіне байланысты айтарлықтай өзгерді, бұл интерференциялық көріністің ығысуына әкелді. 5c және 5d-суреттерде процесс соңына қарай электр өрісі мен температура профильдері арасындағы елеулі алшақтық көрсетілген. Мода тұрақсыздығына қарамастан, 1,86 мм қадамды торды және әр портта 100 кВт қуатта Tmax = 1232 К (959 °C) максималды температураны қалыптастыруға қол жеткізілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жүйе қызу барысында өріс профилінің динамикалық өзгеруіне қарамастан, 1,86 мм қадамды және Tmax = 1232 К болатын тұрақты әрі болжамды торды қалыптастыруды қамтамасыз етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тәжірибелік қиындық мынада: кіріс параметрлері (жиілік, фаза) мен түпкілікті жылу өрісі арасындағы байланыс интуитивті емес. Басып шығару процесінде бұл кері есепті шешу үшін Герчберг-Сэкстон алгоритмі сияқты әдістерді қолдануға болады. Материалдың ε_r(T) диэлектрлік өтімділігінің өзгеруіне қатысты жүйе жауабының стохастикалығын бағалау үшін 0-ден 10⁻² К⁻¹ дейінгі пропорционалдық коэффициенттері α бар модельдеулер жүргізілді. TE₁₀ модасы үшін нәтижелер (6a-сурет) α-ның жоғары мәндерінде өрістің қатты өзгеретінін көрсетеді, бірақ түпкілікті температуралық таралу ұқсас геометриялық профильді сақтайды. Өріс стохастикалығы жылу дағының аздап кеңеюіне және Tmax-тың төмендеуіне әкеледі, бұл нақты тәжірибелерде туындауы мүмкін ауытқуларды көрсетеді, бірақ бұл модельді жарамсыз етпейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модельдеу қызу барысында өріс стохастикалығы максималды температураны төмендетуі мүмкін екенін көрсетеді, сондықтан процесті дәл басқару үшін кері есепті алдын ала сандық түрде шешу талап етіледі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жүйенің негізгі артықшылығы — интерференцияны басқару арқылы ішкі құрылымды реттеу мүмкіндігі. Мысалы, порттардағы жиіліктерді сканерлеу кубтық торларды жасауға мүмкіндік береді (6b және 6c-суреттер). Мұндай құрылымдар керамикалық жылу алмастырғыштарда, каталитикалық тасымалдағыштарда және сүзгілерде қолданылуы мүмкін, бұл материалдың механикалық және жылулық қасиеттерін дәл басқаруды қамтамасыз етеді.&lt;/p&gt;\n&lt;h4 id=\"syrtkhy-shekaralykh-khyzdyrghysh\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#syrtkhy-shekaralykh-khyzdyrghysh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сыртқы шекаралық қыздырғыш&lt;/span&gt;&lt;/a&gt;Сыртқы шекаралық қыздырғыш&lt;/h4&gt;\n&lt;p&gt;Алдыңғы әдістер тек диэлектрлік ұнтақтармен шектелген болатын. Таза металл ұнтақтарымен жұмыс істеу үшін сыртқы шекаралық қыздырғыш ұсынылды, мұнда ұнтақ толқын өткізгіштің шекаралық шарты ретінде әрекет етеді және индукцияланған құйынды токтар арқылы қызады. Бұл әдіс металл қабықшаларды басып шығаруға мүмкіндік береді, бұл процесс 3D басып шығарудан гөрі құю әдісіне жақын. Құрылғының сызбасы 7a-суретте көрсетілген: аспап ұнтақ ваннасына орналастырылады, осылайша диэлектрлік блоктың барлық беттері металлмен жанасады. Кіріс қуаты металл пластинадан шағылысып, тұрақты толқынды қалыптастырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Құйынды токтар — айнымалы магнит өрісінің әсерінен өткізгіште пайда болатын электр тогы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Электромагниттік модельде металл ұнтағы мыстың импеданстық шекарасы, ал толқын өткізгіштер вольфрамның импеданстық шекарасы ретінде модельденді. Вольфрамның көлемдік жылу сыйымдылығы жоғары болғандықтан, ол мысқа қарағанда баяу қызады. Вольфрамның балқу температурасы T_m = 3695 K (3422^°C) мыстың температурасынан (T_m = 1358 K, 1085^°C) әлдеқайда жоғары, бұл толқын өткізгіштің балқып кетуіне жол бермейді. Диэлектрлік блок жоғары тазалықтағы кварцтан жасалған ( anδ = 10⁻⁴, α = 10⁻⁴ K⁻¹). Модель 1 МВт кіріс қуатында, TE₁₀ режимінде 1500 мс уақыт ішінде 1 мс қадаммен есептелді.&lt;/p&gt;\n&lt;h4 id=\"modeldeu-naetizheleri\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#modeldeu-naetizheleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Модельдеу нәтижелері&lt;/span&gt;&lt;/a&gt;Модельдеу нәтижелері&lt;/h4&gt;\n&lt;p&gt;Электр өрісінің таралуы (7c-сурет) қыздыру процесінде жоғары тұрақтылықты көрсетеді, өйткені тері қабатының тереңдігі (skin depth) іс жүзінде өзгермейді. Бұл ішкі қабырғалар бойымен тұрақты қыздыру профилін қамтамасыз етеді (7d-сурет), мұнда максималды температура Tmax = 789 K (516^°C) мәніне жетеді. Металдардың жоғары жылу өткізгіштігі жылудың таралуын болдырмау үшін өте жоғары кіріс қуатын талап етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тұрақты электромагниттік режим 789 K (516^°C) дейін біркелкі қызуды қамтамасыз етеді, бұл металл ұнтағын синтездеуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель теориялық сипатта; металдардың жоғары жылу өткізгіштігі тәжірибеде өте үлкен қуатты қажет етуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қысқа уақыт қыздырғанда жұқа қабырғалы тікбұрышты тор (7e-сурет), ал ұзақ уақыт қыздырғанда тұтас түтікше түзіледі. Қабырға қалыңдығы қуат пен уақыт арқылы реттеледі. Әдіс жұқа қабырғалы корпустар мен толқын өткізгіштерді өндіру үшін тиімді болуы мүмкін.&lt;/p&gt;\n&lt;h3 id=\"khorytyndy\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды&lt;/span&gt;&lt;/a&gt;Қорытынды&lt;/h3&gt;\n&lt;h4 id=\"khorytyndy-zhaene-perspektivalar\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#khorytyndy-zhaene-perspektivalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды және перспективалар&lt;/span&gt;&lt;/a&gt;Қорытынды және перспективалар&lt;/h4&gt;\n&lt;p&gt;Жұмыста микротолқынды көлемді аддитивті өндірістің (VAM) үш архитектурасының: сызықтық Фабри-Перо резонаторы, қиылысатын интерферометр және сыртқы шекаралық жылытқыштың имитациялық модельдеу нәтижелері ұсынылған. Әрбір жүйе оптикалық VAM әдістерімен үйлеспейтін материалдармен жұмыс істеуге мүмкіндік береді. Сызықтық резонатор көлденең және бойлық модалардың өзара әрекеттесуі арқылы диэлектрлік ұнтақтарда детерминирленген термиялық торларды қалыптастырады. Жүйе температураға негізделген өрісті сүзумен шектелген, бұл қыздыру жылдамдығын төмендеткенімен, электр өрістерінің геометриялық өзгеруінен тордың бұрмалануына жол бермейді. Қиылысатын интерферометр күрделі интерференциялық өрнектерді қамтамасыз етеді, бірақ модальды тұрақтылықты азайтады. Сыртқы шекаралық жылытқыш толқын өткізгіш шекараларында омикалық қыздыру арқылы таза металл ұнтақтарын пайдалануға мүмкіндік береді, бірақ геометрияны тек қуыс қабықшалармен шектейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әзірленген жүйелер 200 кВт-тан 1 МВт-қа дейінгі микротолқынды қуатты пайдалана отырып, керамикалық, металл және композиттік материалдарды басып шығаруға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Модельдеу материалдың тығыздалуы басталғанға дейінгі процесті қамтиды. Балқу кезінде диэлектрлік өтімділік пен диэлектрлік шығын тангенсі өзгереді, бұл ағымдағы сызықтық модельде ескерілмеген, себебі жоғары температуралық деректер тапшы. Тығыздалу процесінде осы параметрлерді өлшеу болашақ эксперименттер үшін ең маңызды материалдық кіріс дерегі болып табылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модельдеу процестің бастапқы сатысымен шектелген; жоғары температурадағы материалдардың қасиеттері туралы жуықталған модельдер сандық болжамдарда белгісіздік тудырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Эксперименталды іске асыру Canon E3718 клистронының (ұзындығы 3,5 м, массасы 1250 кг) параметрлерімен салыстырылатын жоғары қуаттарды (200 кВт – 1 МВт) талап етеді. Қуатқа деген талаптарды жоғары шығын тангенсі бар композиттік ұнтақтарды қолдану арқылы азайтуға болады. Модельдердегі жуықтауларға қарамастан, қиылысатын интерферометр үшін сезімталдықты талдау термиялық тордың пішіні α өтімділік коэффициентінің 10⁻³–10⁻² диапазонындағы ауытқуларына төзімді екенін көрсетті.&lt;/p&gt;\n&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"shekti-elementter-aedisimen-sandykh-modeldeu\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#shekti-elementter-aedisimen-sandykh-modeldeu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шекті элементтер әдісімен сандық модельдеу&lt;/span&gt;&lt;/a&gt;Шекті элементтер әдісімен сандық модельдеу&lt;/h4&gt;\n&lt;p&gt;Модельдеу COMSOL Multiphysics ортасында RF және жылу алмасу модульдерін қолдану арқылы орындалады. Электромагниттік процестер мен жылу динамикасының уақыт шкаласындағы айырмашылығына байланысты құрама жиіліктік-өтпелі әдіс қолданылады. Алдымен электромагниттік өрістің модальді қасиеттері жиілік доменінде бағаланады, олар кейіннен уақыт доменіндегі жылу алмасу талдауы үшін жылу көзі ретінде пайдаланылады. Есептеу алгоритмі әр қадамда электромагниттік және жылулық күйлердің өзара әсерін ескеретін итерациялық циклді талап етеді, ол Сурет 2a)-да көрсетілген.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd-f2.jpg\" alt=\"2-сурет: a) Жиіліктік-өтпелі процесті модельдеудің блок-схемасы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет: a) Жиіліктік-өтпелі процесті модельдеудің блок-схемасы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-сурет: a) Жиіліктік-өтпелі процесті модельдеудің блок-схемасы. «Температураға тәуелді материал қасиеттерін есептеу» мен «Соңғы уақыт қадамы» арасындағы итеративті цикл пайдаланушының инициализациясынсыз бір COMSOL модельдеуі ішінде аяқталу үшін автоматтандырылған. b) Бөлме температурасында 10 ГГц жиіліктегі тиімді диэлектрлік өтімділікке қарсы диэлектрлік шығын тангенсінің материал қасиеттері кестесі. Материалдар керамика/шыны, полимерлер және композиттерге топтастырылған. Керамика (алюминий оксиді (59, 60), кварц (61), балқытылған кварц (62, 59), боросиликатты шыны (62, 63) және магний оксиді (MgO) (64)) және полимерлер (политетрафторэтилен (PTFE) (62, 61), полиимид (65), сұйық кристалды полимерлер (LCP) (66) және FR4 (67)) үшін деректер эксперименттік мәліметтерден алынған. Назар аударарлығы, MgO 80 К (−193 °C) температурасында алынған деректер болғандықтан ауытқу болып табылады. Композиттер балқытылған кварц пен техникалық көміртегі (CB) қоспасы үшін Бруггеманның тиімді орта жуықтауы арқылы есептелген, мұнда берілген пайыз техникалық көміртегінің көлемдік үлесін білдіреді. Металдар/өткізгіштер ескерілмеген, себебі тиісті қасиеттер өте жоғары (/εr/, tanδ ≫ 1) және бұл материалдарды диэлектрлік өтімділікпен емес, өткізгіштікпен көрсеткен дұрыс.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тиімді орта жуықтауы әдісі ұнтақтардың күрделі гетерогенді құрылымын, егер бөлшектердің өлшемі микротолқынды сәулеленудің толқын ұзындығынан едәуір кіші болса, эквивалентті тұтас ортамен алмастыруға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Есептеу тиімділігін арттыру үшін тиімді орта жуықтауы қолданылады. Ұнтақ тәрізді материалдар түйіршіктер деңгейінде біртекті емес болғандықтан, тікелей модельдеу өте көп есептеу қуатын талап етер еді. Бұл әдіс ұнтақтарды біртұтас көлемді материал ретінде қарастыруға мүмкіндік береді. Бұл біртекті ұнтақтарға да, материалдар қоспасына да қатысты, бұл шикізат қасиеттерін жобалауға мүмкіндік береді (Сурет 2b). Материал қасиеттері температураға тәуелді болғандықтан, жылу көзі динамикалық түрде қайта есептеледі.&lt;/p&gt;\n&lt;p&gt;Барлық симуляцияларда максималды ұяшық өлшемі λ/10 болатын еркін тетраэдрлік тор және толқын өткізгіш қабырғаларында омдық шығындарды ескеру үшін импеданстық шекаралық шарттар қолданылады. Физикалық дұрыстықты қамтамасыз ету үшін уақыт қадамы диэлектрлік өтімділіктің &lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon_r\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; өзгеруі бір қадамда 0,1%-дан аспайтындай етіп таңдалады. Жинақталуды тексеру (convergence testing) температуралық профильдердің тор мен уақыт қадамына тәуелсіз екенін растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жылу диффузиясы қыздыру уақытын шектейді: тор құрылымын сақтау үшін диффузия ұзындығы &lt;span class=\"yfm-latex\" data-content=\"%5Csqrt%7B4%5Ckappa%20t%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; түйіндер арасындағы қашықтықтан едәуір кіші болуы керек.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Балқытылған кварц үшін температура өткізгіштік коэффициенті κ ≈ 7 × 10⁻⁷  м²с⁻¹ болғанда, 250 мс ішінде диффузия ұзындығы 0,84 мм-ді құрайды, бұл антинодтар арасындағы қашықтықтан бір есе кіші. Бұл қыздыру уақыты мен қуатын шектейді: егер уақытты 10 есе арттырып, қуатты 10 есе азайтса, тор құрылымының орнына біркелкі қызған блок пайда болады.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd-f1.jpg\" alt=\"1-сурет: Қазіргі және ұсынылатын AM (аддитивті өндіріс) жүйелерінің мысалдары.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: Қазіргі және ұсынылатын AM (аддитивті өндіріс) жүйелерінің мысалдары.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет: Қазіргі және ұсынылатын AM (аддитивті өндіріс) жүйелерінің мысалдары. a) Металл ұнтақтарына арналған лазерлік PBF (ұнтақты қабатты синтездеу) графикасы (39). b) Фотосезімтал шайырлар мен оптикалық жиіліктерді пайдаланатын VAM (көлемдік аддитивті өндіріс) жүйесінің сызбасы. DLP проекторы уақытқа тәуелді кескіндерді бір ось бойымен жасау үшін параксиалды көздерден алынған айнымалы дифракция мен интерференцияны пайдаланады, ал айналмалы платформа екі өлшемді кескін жазықтығын үш өлшемді пішіндерге дейін кеңейтуге мүмкіндік береді. Сурет «Volumetric additive manufacturing via tomographic reconstruction» (30) мақаласынан. AAAS рұқсатымен бейімделген. c) Мукерджи және басқалар (34) ұсынған микротолқынды VAM жүйесі, b) тармағындағы оптикалық жүйеге балама. Антенналар саны жеткілікті болғанда, антенналық массив электр өрісінің қарқындылығын толық бақылайды және айналмалы платформасыз VAM-ға қол жеткізуге мүмкіндік береді. Сурет «Towards microwave volumetric additive manufacturing: Generation of a computational multi-physics model for localized curing» (34) мақаласынан. Elsevier рұқсатымен бейімделген. d) Ұсынылған микротолқынды VAM жүйесінің графикасы. Диэлектрлік қабырғалармен (жасыл) ұсталып тұрған ұнтақ көлемін (көк) қамтитын толқын өткізгіш (қызғылт сары) жүйеге микротолқынды энергияны енгізеді. Құрылғының кіріс көлденең модаларына тәуелді табиғи электромагниттік модалары өріс қарқындылығы ең жоғары болатын ұнтақ аймақтарын таңдап балқытады. e) Архитектуралық 3D тор ұяшықтарын таңдау. Бұл жұмыс 1 мм шамасындағы ұяшықтары бар торларға назар аударады. Сурет «Architected cellular materials: A review on their mechanical properties towards fatigue-tolerant design and fabrication» (40) мақаласынан. Elsevier рұқсатымен бейімделген.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd-f5.jpg\" alt=\"5-сурет: TE32 кіріс модасы үшін айқаспалы интерферометр моделінің сызбасы мен модельдеуі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет: TE32 кіріс модасы үшін айқаспалы интерферометр моделінің сызбасы мен модельдеуі.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-сурет: TE32 кіріс модасы үшін айқаспалы интерферометр моделінің сызбасы мен модельдеуі. a) Жүйе диаграммасы, ішкі бөлігінде кіріс модасы көрсетілген. a және b өлшемдері WR-90 (a = 0,9 дюйм × b = 0,4 дюйм) толқын өткізгіш кірісіне сәйкес келеді. b) a) тармағындағы сызбаның көлденең қимасының егжей-тегжейлі көрінісі. Диэлектрлік аймақ — сіңіруші ұнтақ, жіңішке сары қабырғалар алюминий оксидін білдіреді. 1-порт және 2-порт белсенді кіріс порттары болып табылады. c) 100 мс кезінде есептелген электр өрісі профилінің y = 0 кезіндегі екі өлшемді қимасы. d) c) тармағындағыдай жазықтықтағы электромагниттік қыздырудан туындайтын температураның таралуы. Қыздыру әр қадамда электромагниттік мода профилін қайта есептеу арқылы 0,1 мс қадамдармен есептелді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd-f6.jpg\" alt=\"6-сурет: Айқас интерферометр үшін жиіліктік сыпыруларды пайдалана отырып, сезімталдықты зерттеу және құрылғының идеалды \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-сурет: Айқас интерферометр үшін жиіліктік сыпыруларды пайдалана отырып, сезімталдықты зерттеу және құрылғының идеалды шығысы (кірістірілген суретте көрсетілген).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;6-сурет: Айқас интерферометр үшін жиіліктік сыпыруларды пайдалана отырып, сезімталдықты зерттеу және құрылғының идеалды шығысы (кірістірілген суретте көрсетілген). a) Қыздыру профилінің сызықтық өткізгіштіктің температуралық коэффициенті α-ға сезімталдығын зерттеу. Әрбір симуляцияда электр өрісінің тұрақтылығын және түзілген термиялық профильді модельдеу үшін 50 мс ішінде TE10 режимі қолданылды. b) Осы құрылғыдан алынған идеалды текше тірек негізіндегі элементар ұяшықтың рендері. c) Әр порттағы тәуелсіз жиіліктік сыпырулар арқылы балқыту (sintering) жолымен қалыптасқан құрылғы шығысының реалистік рендері. Бөлінген бөлімдер (қызыл, жасыл, сары) әртүрлі кіріс жиіліктерінде түзілген тәуелсіз термиялық түйіндерден балқытылған аймақтарды белгілейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd-f7.jpg\" alt=\"7-сурет: Сыртқы шекаралық қыздырғыш моделінің сызбасы мен симуляциясы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-сурет: Сыртқы шекаралық қыздырғыш моделінің сызбасы мен симуляциясы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;7-сурет: Сыртқы шекаралық қыздырғыш моделінің сызбасы мен симуляциясы. a) Рефлектор жүйесін көрсететін жүйе диаграммасы. Кірістірілген суретте металл ұнтағының диэлектрлік блок айналасында шекаралық шартты қалай мәжбүрлейтіні және толқын өткізгіш ретінде тиімді жұмыс істейтіні көрсетілген. Диэлектрлік блоктың ұзындығы 10 ГГц жиілікте кремний диоксидіндегі өрісті барынша күшейту үшін оңтайландырылған. b) a) тармағындағы РЖ және термиялық симуляция үшін жасалған тетраэдрлік тор профилі. Жасыл көрсеткілер толқын өткізгіш материалы (вольфрам) үшін, ал қызыл көрсеткілер ұнтақ материалы (мыс) үшін импеданстық шекаралық шарттарды көрсетеді. c) y = 0 және t = 1500 мс кезіндегі электр өрісі профилінің екі өлшемді қимасы. 1 МВт кіріс қуаты пайдаланылды. d) Шекаралық (ұнтақ) қабырға бойындағы электромагниттік қыздырудан туындаған температураның таралуы. Қыздыру 1 мс қадаммен есептелді. e) TE20 кіріс режимі және қысқа қыздыру уақытымен осы құрылғы арқылы өндірілген мыс қабықшаның рендері.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қабаттап басып&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;шығару&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;баяулығы&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ұнтақтардағы&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;СВЧ өрістерін&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;модельдеу&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;1 мм термиялық&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;торлардың&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қалыптасуы&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;металл мен&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;керамиканы&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жылдам басып&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;шығару&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт әлі рецензиядан өтпеген. Қорытындылар алдын ала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Препринт лицензиясы&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;arXiv&lt;/td&gt;\n&lt;td&gt;printing_3d&lt;/td&gt;\n&lt;td&gt;arxiv&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторлар: Brendan Mackey, Levi Smith, Bosco Yu&lt;/p&gt;\n&lt;h3 id=\"derekkoezder\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hi
