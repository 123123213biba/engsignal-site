        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференции&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;материалы и конструкции: испытания, долговечность&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/conferences/conf-rilem.jpg\" alt=\"RILEM Week\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;О чём&lt;/td&gt;\n&lt;td&gt;материалы и конструкции: испытания, долговечность&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Что берём&lt;/td&gt;\n&lt;td&gt;труды RILEM (много в открытом доступе)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-concrete.html\"&gt;Бетон и вяжущие&lt;/a&gt;, &lt;a href=\"concepts/spec-materials.html\"&gt;Материаловедение&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chto-eto-za-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-rilem.html#chto-eto-za-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что это за конференция&lt;/span&gt;&lt;/a&gt;Что это за конференция&lt;/h2&gt;\n&lt;p&gt;RILEM Week — это ежегодное международное научное событие, объединяющее экспертов в области строительных материалов и конструкций. Конференция служит основной площадкой для обсуждения фундаментальных исследований, которые определяют будущее гражданского строительства. В отличие от узкоспециализированных симпозиумов, RILEM Week охватывает полный цикл жизни материала: от молекулярного моделирования цементных фаз до оценки долговечности крупномасштабных инженерных сооружений.&lt;/p&gt;\n&lt;h2 id=\"organizatory-i-istoriya\"&gt;&lt;a href=\"reference/conferences/conf-rilem.html#organizatory-i-istoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Организаторы и история&lt;/span&gt;&lt;/a&gt;Организаторы и история&lt;/h2&gt;\n&lt;p&gt;Организатором выступает RILEM (International Union of Laboratories and Experts in Construction Materials, Systems and Structures). Организация была основана в 1947 году и с тех пор координирует работу лабораторий по всему миру. Важной вехой в истории организации стало участие таких ученых, как Зденек Бажант (Zdeněk P. Bažant), чьи работы по механике разрушения бетона и ползучести материалов легли в основу современных стандартов безопасности. Бажант, профессор Северо-Западного университета, десятилетиями формировал научную повестку RILEM, продвигая методы математического моделирования в строительной науке.&lt;/p&gt;\n&lt;h2 id=\"temy-i-sekcii\"&gt;&lt;a href=\"reference/conferences/conf-rilem.html#temy-i-sekcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Темы и секции&lt;/span&gt;&lt;/a&gt;Темы и секции&lt;/h2&gt;\n&lt;p&gt;Научная программа RILEM Week традиционно делится на несколько ключевых направлений:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Бетон и вяжущие: изучение гидратации цемента, микроструктуры CSH-геля и долговечности бетона в агрессивных средах.&lt;/li&gt;\n&lt;li&gt;Материаловедение: разработка новых композитов, включая углеродные аэрогели и высокопрочные сплавы.&lt;/li&gt;\n&lt;li&gt;Цифровизация и моделирование: применение нейросетевых потенциалов для предсказания прочности материалов, аналогично тому, как CSH-MLP моделирует поведение цемента с квантовой точностью.&lt;/li&gt;\n&lt;li&gt;Устойчивое развитие: методы снижения углеродного следа при производстве строительных материалов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"chto-tam-poyavlyaetsya\"&gt;&lt;a href=\"reference/conferences/conf-rilem.html#chto-tam-poyavlyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что там появляется&lt;/span&gt;&lt;/a&gt;Что там появляется&lt;/h2&gt;\n&lt;p&gt;На конференции представляются результаты, которые позже становятся основой для новых ГОСТов и международных стандартов. Здесь обсуждаются прорывные технологии: от методов борьбы с пористостью в сложных сплавах с помощью криогенных форм до использования анизотропных структур для создания радиопоглощающих материалов. Участники представляют не только теоретические выкладки, но и результаты натурных испытаний, подтверждающие работоспособность новых составов в реальных условиях эксплуатации.&lt;/p&gt;\n&lt;h2 id=\"kak-sledit-i-uchastvovat\"&gt;&lt;a href=\"reference/conferences/conf-rilem.html#kak-sledit-i-uchastvovat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как следить и участвовать&lt;/span&gt;&lt;/a&gt;Как следить и участвовать&lt;/h2&gt;\n&lt;p&gt;Материалы конференции публикуются в открытом доступе в виде трудов (RILEM Proceedings). Для исследователей и инженеров это основной источник верифицированных данных. Чтобы следить за актуальными исследованиями, рекомендуется мониторить официальный портал RILEM, где публикуются анонсы предстоящих недель и отчеты рабочих групп. Участие возможно как в формате представления собственного доклада, так и в качестве слушателя, что позволяет быть в курсе последних достижений в области материаловедения и механики конструкций.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/conferences/conf-rilem.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Zden%C4%9Bk_P._Ba%C5%BEant\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Zdeněk P. Bažant — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Zden%C4%9Bk_Pavel_Ba%C5%BEant_ForMemRS.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Royal Society uploader, CC BY-SA 4.0&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференции&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"материалы и конструкции: испытания, долговечность"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"RILEM Week","description":"материалы и конструкции: испытания, долговечность","vcsPath":"reference/conferences/conf-rilem.md"},"headings":[{"title":"Что это за конференция","href":"reference/conferences/conf-rilem.html#chto-eto-za-konferenciya","level":2},{"title":"Организаторы и история","href":"reference/conferences/conf-rilem.html#organizatory-i-istoriya","level":2},{"title":"Темы и секции","href":"reference/conferences/conf-rilem.html#temy-i-sekcii","level":2},{"title":"Что там появляется","href":"reference/conferences/conf-rilem.html#chto-tam-poyavlyaetsya","level":2},{"title":"Как следить и участвовать","href":"reference/conferences/conf-rilem.html#kak-sledit-i-uchastvovat","level":2},{"title":"Источники","href":"reference/conferences/conf-rilem.html#istochniki","level":2}],"title":"RILEM Week"},"router":{"pathname":"reference/conferences/conf-rilem","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
