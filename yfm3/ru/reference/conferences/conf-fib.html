        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференции&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Международная федерация по бетону: железобетонные конструкции&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/conferences/conf-fib.jpg\" alt=\"fib Symposium / Congress\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;О чём&lt;/td&gt;\n&lt;td&gt;Международная федерация по бетону: железобетонные конструкции&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Что берём&lt;/td&gt;\n&lt;td&gt;программы, труды&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-concrete.html\"&gt;Бетон и вяжущие&lt;/a&gt;, &lt;a href=\"concepts/spec-structures.html\"&gt;Конструкции и здания&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chto-eto-za-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-fib.html#chto-eto-za-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что это за конференция&lt;/span&gt;&lt;/a&gt;Что это за конференция&lt;/h2&gt;\n&lt;p&gt;fib Symposium / Congress — это ключевое международное событие, организуемое Международной федерацией по бетону (International Federation for Structural Concrete). Конференция служит главной площадкой для обмена знаниями между учеными, инженерами-конструкторами и производителями строительных материалов. Основная цель мероприятий — трансформация теоретических исследований в области бетона и железобетона в практические инженерные решения, повышающие безопасность и долговечность зданий.&lt;/p&gt;\n&lt;h2 id=\"organizatory-i-istoriya\"&gt;&lt;a href=\"reference/conferences/conf-fib.html#organizatory-i-istoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Организаторы и история&lt;/span&gt;&lt;/a&gt;Организаторы и история&lt;/h2&gt;\n&lt;p&gt;Организатором выступает федерация fib, объединяющая национальные группы специалистов со всего мира. История организации восходит к слиянию двух крупных объединений (CEB и FIP) в 1998 году. С тех пор федерация регулярно проводит симпозиумы и конгрессы, которые стали эталоном для профессионального сообщества. Важно отметить, что деятельность fib сосредоточена исключительно на строительной науке и технологиях бетона; она не имеет отношения к политическим движениям или организациям, использующим схожие аббревиатуры в иных контекстах.&lt;/p&gt;\n&lt;h2 id=\"temy-i-sekcii\"&gt;&lt;a href=\"reference/conferences/conf-fib.html#temy-i-sekcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Темы и секции&lt;/span&gt;&lt;/a&gt;Темы и секции&lt;/h2&gt;\n&lt;p&gt;Программа конференций охватывает широкий спектр вопросов: от фундаментальной химии цементного камня до проектирования сложных высотных конструкций. Ключевые секции обычно включают:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Новые материалы и вяжущие: исследования в области экологичных смесей и долговечности.&lt;/li&gt;\n&lt;li&gt;Сейсмостойкое строительство: методы снижения нагрузки на каркас, например, использование полиуретановых стяжек для облегчения конструкций.&lt;/li&gt;\n&lt;li&gt;Цифровизация и моделирование: применение нейросетевых потенциалов (таких как CSH-MLP) для предсказания прочности бетона на молекулярном уровне.&lt;/li&gt;\n&lt;li&gt;Устойчивое развитие: снижение углеродного следа при производстве бетона.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"chto-tam-poyavlyaetsya\"&gt;&lt;a href=\"reference/conferences/conf-fib.html#chto-tam-poyavlyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что там появляется&lt;/span&gt;&lt;/a&gt;Что там появляется&lt;/h2&gt;\n&lt;p&gt;На симпозиумах fib впервые представляются результаты исследований, которые позже становятся отраслевыми стандартами. Например, здесь обсуждаются способы замены тяжелых строительных материалов на облегченные полимерные аналоги, что позволяет снизить сейсмическую нагрузку на 20% без необходимости усиления несущих конструкций. Также здесь презентуются методы машинного обучения для анализа цементных композитов, позволяющие моделировать поведение материалов с точностью, сопоставимой с квантовой физикой. Эти данные позволяют инженерам точнее рассчитывать запасы прочности и оптимизировать расход материалов.&lt;/p&gt;\n&lt;h2 id=\"kak-sledit-i-uchastvovat\"&gt;&lt;a href=\"reference/conferences/conf-fib.html#kak-sledit-i-uchastvovat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как следить и участвовать&lt;/span&gt;&lt;/a&gt;Как следить и участвовать&lt;/h2&gt;\n&lt;p&gt;Для участия в конференциях необходимо следить за официальным календарем fib. Публикации трудов (proceedings) доступны в специализированных базах данных. Исследователи могут подавать тезисы своих работ для рецензирования и последующего выступления в рамках профильных секций. Для специалистов, не участвующих напрямую, изучение материалов конференций является лучшим способом быть в курсе актуальных трендов в области материаловедения и проектирования конструкций.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/conferences/conf-fib.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Brazilian_Integralist_Front\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Brazilian Integralist Front — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Frente_Integralista_Brasileira_logo.png\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Morgadofelipen, Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференции&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Международная федерация по бетону: железобетонные конструкции"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"fib Symposium / Congress","description":"Международная федерация по бетону: железобетонные конструкции","vcsPath":"reference/conferences/conf-fib.md"},"headings":[{"title":"Что это за конференция","href":"reference/conferences/conf-fib.html#chto-eto-za-konferenciya","level":2},{"title":"Организаторы и история","href":"reference/conferences/conf-fib.html#organizatory-i-istoriya","level":2},{"title":"Темы и секции","href":"reference/conferences/conf-fib.html#temy-i-sekcii","level":2},{"title":"Что там появляется","href":"reference/conferences/conf-fib.html#chto-tam-poyavlyaetsya","level":2},{"title":"Как следить и участвовать","href":"reference/conferences/conf-fib.html#kak-sledit-i-uchastvovat","level":2},{"title":"Источники","href":"reference/conferences/conf-fib.html#istochniki","level":2}],"title":"fib Symposium / Congress"},"router":{"pathname":"reference/conferences/conf-fib","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
