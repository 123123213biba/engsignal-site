        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;em&gt;Инструкция&lt;/em&gt; · 2026-10-03&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Ваш карманный квантовый микроскоп уже здесь: превращаем макрообъекты в микросхемы без потери нервных клеток.&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"naznachenie\"&gt;&lt;a href=\"instructions/ins-mechanics-correlation-imaging-via-hybrid-entanglem.html#naznachenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Назначение&lt;/span&gt;&lt;/a&gt;Назначение&lt;/h2&gt;\n&lt;p&gt;Средство предназначено для визуализации объектов, которые «слишком большие для чипа, но слишком важные для игнорирования». Основано на статье «Квантовая оптика на стероидах: как сжать макрообъект до размеров чипа».&lt;/p&gt;\n&lt;h2 id=\"sostav\"&gt;&lt;a href=\"instructions/ins-mechanics-correlation-imaging-via-hybrid-entanglem.html#sostav\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Состав&lt;/span&gt;&lt;/a&gt;Состав&lt;/h2&gt;\n&lt;p&gt;В составе: гибридная запутанность, щепотка поверхностных акустических фононов и фотоны в идеальной физической форме. Разница длин волн в пять порядков прилагается в качестве связующего звена.&lt;/p&gt;\n&lt;h2 id=\"sposob-primeneniya\"&gt;&lt;a href=\"instructions/ins-mechanics-correlation-imaging-via-hybrid-entanglem.html#sposob-primeneniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Способ применения&lt;/span&gt;&lt;/a&gt;Способ применения&lt;/h2&gt;\n&lt;p&gt;Приложите квантовую систему к объекту. Используйте диапазон масштабирования от 10⁻⁸ до 10⁶ раз. Если объект не сжимается, проверьте, не забыли ли вы активировать акустические фононы. Система работает как телескоп, если нужно рассмотреть звезды, и как микроскоп, если нужно найти совесть в расчетах сопромата.&lt;/p&gt;\n&lt;h2 id=\"pobochnye-effekty\"&gt;&lt;a href=\"instructions/ins-mechanics-correlation-imaging-via-hybrid-entanglem.html#pobochnye-effekty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Побочные эффекты&lt;/span&gt;&lt;/a&gt;Побочные эффекты&lt;/h2&gt;\n&lt;p&gt;Возможно внезапное осознание ничтожности макромира перед мощью квантовой механики. При чрезмерном увеличении возможен легкий головокружительный эффект от масштабирования в миллион раз. Если вы начали видеть фононы невооруженным глазом — пора сделать перерыв на кофе.&lt;/p&gt;\n&lt;h2 id=\"protivopokazaniya\"&gt;&lt;a href=\"instructions/ins-mechanics-correlation-imaging-via-hybrid-entanglem.html#protivopokazaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Противопоказания&lt;/span&gt;&lt;/a&gt;Противопоказания&lt;/h2&gt;\n&lt;p&gt;Не рекомендуется использовать лицам, которые до сих пор пытаются доказать, что сопромат — это «просто палки и веревки». Также противопоказано при попытке сжать начальника до размеров микрочипа — квантовая запутанность не несет ответственности за последствия.&lt;/p&gt;\n&lt;h2 id=\"usloviya-hraneniya\"&gt;&lt;a href=\"instructions/ins-mechanics-correlation-imaging-via-hybrid-entanglem.html#usloviya-hraneniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Условия хранения&lt;/span&gt;&lt;/a&gt;Условия хранения&lt;/h2&gt;\n&lt;p&gt;Хранить в сухом, защищенном от макроскопических помех месте. Беречь от прямого воздействия здравого смысла, так как квантовая оптика его не признает. Использовать при комнатной температуре, если вы не планируете превратить лабораторию в сверхпроводящий объект.&lt;/p&gt;\n&lt;h2 id=\"osnovano-na-statyah\"&gt;&lt;a href=\"instructions/ins-mechanics-correlation-imaging-via-hybrid-entanglem.html#osnovano-na-statyah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Основано на статьях&lt;/span&gt;&lt;/a&gt;Основано на статьях&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/correlation-imaging-via-hybrid-entanglement-between-microwav.html\"&gt;Квантовая оптика на стероидах: как сжать макрообъект до размеров чипа&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Концепции: &lt;a href=\"concepts/spec-mechanics.html\"&gt;Сопромат и механика&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Ваш карманный квантовый микроскоп уже здесь: превращаем макрообъекты в микросхемы без потери нервных клеток."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Инструкция: как сжать Вселенную до размеров чипа","description":"Ваш карманный квантовый микроскоп уже здесь: превращаем макрообъекты в микросхемы без потери нервных клеток.","vcsPath":"instructions/ins-mechanics-correlation-imaging-via-hybrid-entanglem.md"},"headings":[{"title":"Назначение","href":"instructions/ins-mechanics-correlation-imaging-via-hybrid-entanglem.html#naznachenie","level":2},{"title":"Состав","href":"instructions/ins-mechanics-correlation-imaging-via-hybrid-entanglem.html#sostav","level":2},{"title":"Способ применения","href":"instructions/ins-mechanics-correlation-imaging-via-hybrid-entanglem.html#sposob-primeneniya","level":2},{"title":"Побочные эффекты","href":"instructions/ins-mechanics-correlation-imaging-via-hybrid-entanglem.html#pobochnye-effekty","level":2},{"title":"Противопоказания","href":"instructions/ins-mechanics-correlation-imaging-via-hybrid-entanglem.html#protivopokazaniya","level":2},{"title":"Условия хранения","href":"instructions/ins-mechanics-correlation-imaging-via-hybrid-entanglem.html#usloviya-hraneniya","level":2},{"title":"Основано на статьях","href":"instructions/ins-mechanics-correlation-imaging-via-hybrid-entanglem.html#osnovano-na-statyah","level":2}],"title":"Инструкция: как сжать Вселенную до размеров чипа"},"router":{"pathname":"instructions/ins-me
