        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"247\" cy=\"78\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"653\" cy=\"258\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · PLATES_SHELLS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Мембранные сенсоры научились&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;проверять свои показания&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;через механику полимеров&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-f1.jpg\" alt=\"Рис. 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;При работе газовых датчиков вне лаборатории истинная концентрация газов неизвестна, поэтому оценить точность измерений в реальном времени крайне сложно. Инженеры создали нейросетевую архитектуру динамической инверсии, которая не просто распознает компоненты, а одновременно восстанавливает механический отклик сенсора. Физические ограничения кинетики сорбции и вязкоупругости полимерных мембран позволили системе самостоятельно верифицировать сигнал. В тестах с 12-канальным массивом датчиков алгоритм успешно выявил искусственные сбои и дрейф чувствительности отдельного канала.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Массив из 12 MSS-каналов разделяет пары воды и этанола за счет динамики сорбции и вязкоупругости SLS-модели.&lt;/li&gt;\n&lt;li&gt;Физические невязки кинетики и механики наложены через метод множителей MDMM без ручного подбора весов функций потерь.&lt;/li&gt;\n&lt;li&gt;Аномалии и сдвиги чувствительности в канале выявляются расхождением синтезированного напряжения с измеренным сигналом.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;В основе измерительной системы лежит массив мембранных датчиков поверхностного механического напряжения (MSS), состоящий из трех четырехканальных чипов (всего 12 каналов) с различными рецепторными полимерными покрытиями. При сорбции паров воды и этанола молекулы внедряются в пленку, вызывая ее объемное набухание и деформацию при малых перемещениях &lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon%20%3D%20(v%2F3)C_f\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, где &lt;span class=\"yfm-latex\" data-content=\"v\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — удельный объем сорбата, а &lt;span class=\"yfm-latex\" data-content=\"C_f\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — концентрация в пленке. Напряженно-деформированное состояние рецептора описывается моделью стандартного линейного вязкоупругого тела (SLS): $ au_r E_U (d\\varepsilon/dt) + E_R \\varepsilon =  au_r (d\\sigma/dt) + \\sigma$, связывающей мгновенный нерелаксированный модуль &lt;span class=\"yfm-latex\" data-content=\"E_U\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, длительный релаксированный модуль &lt;span class=\"yfm-latex\" data-content=\"E_R\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; и время механической релаксации $ au_r$.&lt;/p&gt;\n&lt;p&gt;Обратная задача решается с помощью временной сверточной сети (TCN) и многослойного перцептрона (MLP), выдающих газовые концентрации &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_g\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, скрытые фазовые концентрации &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_f\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; и реконструированное поверхностное напряжение &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Csigma%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Обучение проводилось с применением модифицированного метода дифференциальных множителей (MDMM), при котором невязки кинетики сорбции &lt;span class=\"yfm-latex\" data-content=\"R_1%20%3D%20d%5Chat%7BC%7D_f%2Fdt%20-%20%20au_s%5E%7B-1%7D(K_p%20%5Chat%7BC%7D_g%20-%20%5Chat%7BC%7D_f)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; и вязкоупругости &lt;span class=\"yfm-latex\" data-content=\"R_2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; выступают жесткими ограничениями в седловой точке Лагранжиана. Если на одном из каналов возникает аппаратурный сбой, дрейф нуля или искажение чувствительности, синтезированное напряжение &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Csigma%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; расходится с измеренным сигналом &lt;span class=\"yfm-latex\" data-content=\"%5Csigma\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, что мгновенно локализует неисправность без эталонной калибровки.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование выполнено в лабораторных условиях на модельной бинарной смеси вода–этанол, поэтому поведение модели при наличии неучтенных фоновых газов сложного состава пока не изучено.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Массивы газовых сенсоров позволяют оценивать состав газовых смесей на основе паттернов их отклика. Основная проблема при эксплуатации таких систем вне лабораторных условий заключается в отсутствии эталонных данных о реальной концентрации газов, что затрудняет проверку достоверности результатов. Авторы разработали нейронную сеть с физическими ограничениями (physics-constrained neural network), которая одновременно оценивает динамически меняющиеся концентрации газов и реконструирует соответствующие сигналы сенсоров.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нейронная сеть с физическими ограничениями — это модель машинного обучения, в которую встроены законы физики (в данном случае уравнения сорбции и механики), что не позволяет ей выдавать результаты, противоречащие реальности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Метод был протестирован на двенадцатиканальном массиве мембранных сенсоров поверхностного напряжения. В ходе эксперимента система подвергалась воздействию смесей воды и этанола с изменяющейся во времени концентрацией.&lt;/p&gt;\n&lt;p&gt;Модель успешно реконструировала профили концентрации обоих компонентов смеси на основе первичных сигналов. Исследователи продемонстрировали, что искусственно внесенные смещения (offsets) и изменения чувствительности в одном из каналов обнаруживаются благодаря расхождениям между измеренными и реконструированными сигналами. Кроме того, удаление или подмена фрагментов данных измерений выявлялись системой через нарушение уравнений сорбции и механики.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Разработанный метод позволяет проводить анализ многокомпонентных газовых смесей в реальном времени с автоматической самопроверкой на основе единственного измерения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование является демонстрацией метода на лабораторной установке; применимость алгоритма к полевым условиям с высоким уровнем неконтролируемого шума требует дополнительной проверки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Химические сенсоры, такие как кварцевые микровесы, устройства на поверхностных акустических волнах и мембранные датчики поверхностного напряжения (MSS), всё чаще выходят из лабораторий в повседневную эксплуатацию. В условиях непрерывной работы, например при мониторинге качества воздуха или скрининге дыхания, возможность частой калибровки ограничена. Традиционные методы сводят динамический отклик сенсора к статическим признакам, что упрощает обработку, но теряет информацию о кинетике процессов. Данная работа предлагает рассматривать сенсор не как статический преобразователь, а как динамическую систему, где сигнал является записью взаимодействия газа с рецепторным слоем.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Предложенный метод позволяет оценивать концентрацию газов в реальном времени, используя динамический отклик сенсора, и проверять достоверность данных без внешнего эталона.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Основная проблема динамических измерений — зависимость от истории воздействия (эффект памяти) и сложность разделения многокомпонентных смесей. Авторы применяют подход «ограниченной динамической инверсии» (constrained dynamical inversion). В этой модели нейронная сеть решает обратную задачу, будучи жестко связанной уравнениями сорбции и вязкоупругой релаксации [20].&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ограниченная динамическая инверсия — это метод восстановления входных параметров системы (концентрации газа) через нейросеть, которая обязана подчиняться законам физики (кинетике сорбции), что исключает получение физически невозможных результатов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Алгоритм работает следующим образом: нейросеть получает на вход «сырой» многоканальный сигнал и одновременно вычисляет три величины: концентрацию газа в фазе &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_g\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, скрытое состояние пленки &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_f\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; и реконструкцию самого сигнала &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Csigma%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Поскольку все три параметра связаны физическими уравнениями, соответствие между измеренным сигналом σ и реконструированным &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Csigma%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; служит внутренним критерием проверки (Рис. 1). Если канал поврежден, реконструкция перестает совпадать с входными данными, что позволяет локализовать неисправность.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-f1.jpg\" alt=\"Рис. 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод был протестирован на 12-канальной матрице MSS при воздействии смесей воды и этанола; перенос на другие типы газов или иные физические условия требует дополнительной верификации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторы демонстрируют, что предложенная система не только восстанавливает траектории концентраций, но и самостоятельно выявляет аномалии, превращая химический анализ из задачи распознавания образов в задачу логического вывода состояний системы.&lt;/p&gt;\n&lt;p&gt;Модель реконструкции (Рис. 1c) использует многоканальные временные сигналы σ(t) в качестве входных данных. Временная сверточная нейронная сеть (TCN) извлекает временные признаки, а общий многослойный перцептрон (MLP) декодирует их в три выходных потока для каждого шага времени: прогнозируемые концентрации газа &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_g\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, концентрации в фазе пленки &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_f\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, отражающие внутреннее состояние рецепторных пленок, и реконструкцию самого измеренного сигнала &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Csigma%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TCN (временная сверточная сеть) — это архитектура нейросети, специально разработанная для анализа последовательностей, где каждый элемент зависит от предыдущих во времени.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Эти три выхода связаны физическими уравнениями процесса сенсорики, которые выступают в роли ограничений при обучении. Кинетика сорбции описывает поглощение молекул газа пленкой:&lt;/p&gt;\n&lt;p&gt;\\frac{d\\hat{C}_f}{dt} = \\frac{1}{ au_s} (K_p\\hat{C}_g - \\hat{C}_f)&lt;/p&gt;\n&lt;p&gt;где τ_s — постоянная времени сорбции, а K_p — коэффициент распределения. Набухание пленки при поглощении газа создает деформацию &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Cvarepsilon%7D%20%3D%20(v%2F3)%5Chat%7BC%7D_f\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, где v — удельный объем сорбированного вещества. Механический отклик описывается моделью стандартного линейного тела (SLS):&lt;/p&gt;\n&lt;p&gt;au_r E_U \\frac{d\\varepsilon}{dt} + E_R\\varepsilon =  au_r \\frac{d\\sigma}{dt} + \\sigma (2)&lt;/p&gt;\n&lt;p&gt;Здесь E_U и E_R — нерелаксированный и релаксированный модули упругости, а τ_r — постоянная времени механической релаксации. Эти уравнения задают последовательную зависимость C_g → C_f → σ.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Физические ограничения R₁ и R₂ связывают концентрации и механический отклик, обеспечивая взаимную согласованность всех выходов модели.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В процессе обучения уравнения не решаются напрямую, а вводятся как невязки R₁ и R₂ (уравнения 3 и 4). Вместо классического добавления невязок в функцию потерь с фиксированными весами, авторы используют метод модифицированных дифференциальных множителей (MDMM). Это позволяет алгоритму автоматически адаптировать множители и находить седловую точку Лагранжиана, обеспечивая строгое выполнение физических законов. Таким образом, сеть минимизирует ошибки данных &lt;span class=\"yfm-latex\" data-content=\"L_%7BCg%7D%20%3D%20MSE(C_g%2C%20%5Chat%7BC%7D_g)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; и &lt;span class=\"yfm-latex\" data-content=\"L_V%20%3D%20MSE(%5Csigma%2C%20%5Chat%7B%5Csigma%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; при условии, что невязки остаются минимальными. Концентрация в фазе пленки &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_f\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; определяется исключительно этими физическими ограничениями без прямого экспериментального контроля.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод MDMM критически важен, так как он заставляет модель строго соблюдать физику процесса, что позволяет использовать реконструкцию сигнала как независимый инструмент проверки целостности данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Исследование оценивает способность предложенной модели восстанавливать динамические концентрации газов по «сырым» сигналам многоканальных сенсоров. Экспериментальная установка включала массив из 12 мембранных датчиков поверхностного напряжения, покрытых 12 различными рецепторными слоями для обеспечения уникальных сорбционных и вязкоупругих откликов. В качестве тестовой смеси использовались пары воды и этанола, генерируемые барботированием азота (N₂). Выбор воды обусловлен её ролью основного мешающего фактора в газоанализе; модель учитывает её вклад наравне с этанолом. Использовались различные формы сигналов: прямоугольные, пилообразные, обратно-пилообразные и гауссовы. Набор данных включал 150 последовательностей для обучения и 50 для тестирования, разделенных на синхронный (общая форма волны) и асинхронный (независимые формы) режимы.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод «сырых» сигналов предполагает обработку данных непосредственно с датчиков без предварительной фильтрации или компенсации помех, что требует от модели высокой точности интерпретации физических откликов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Как показано на Рис. 2a, b, модель точно воспроизводит временную структуру концентраций, включая пики и формы сигналов. Наибольшие отклонения наблюдаются на резких фронтах (ступенчатых изменениях), где скорость изменения концентрации превышает инерционность сорбционного отклика сенсора. Это указывает на то, что прямоугольные импульсы, часто используемые для калибровки, могут быть неоптимальны для динамической реконструкции. Согласно Рис. 2c, d, погрешность составляет около ±2% для синхронного и ±5% для асинхронного режимов, с систематическим отклонением при концентрациях выше 25%.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-f2.jpg\" alt=\"Рис. 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 2&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель успешно восстанавливает динамику концентраций газов с точностью до 5% без привязки к фиксированной форме входного сигнала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Результаты получены на лабораторной модели с контролируемыми смесями; перенос на реальные условия с непредсказуемыми помехами требует дополнительной проверки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;На Рис. 3 демонстрируется совместная реконструкция концентраций газа, состояний фаз пленки и отклика сенсора при различных временных окнах (полное, половинное, четвертное). Модель сохраняет согласованность результатов даже при сокращении длительности входных окон, что подтверждает устойчивость алгоритма.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-f3.jpg\" alt=\"Рис. 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;На Рис. 3a,b показана реконструкция для репрезентативной тестовой последовательности при полной длине входных данных. Восстановленный сигнал &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Csigma%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; точно повторяет измеренный входной сигнал по всем каналам. Вычисленные концентрации в пленке &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_f\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; демонстрируют временную задержку относительно концентраций в газовой фазе &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_g\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, что отражает конечное время сорбции, заданное уравнением (1). Различия в характерных временах для разных веществ согласуются с параметрами сорбции, полученными в ходе обучения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель эффективно сводится к упругому отклику, так как отношение модулей E_U/E_R стремится к единице, а постоянная времени сорбции τ_s отфильтровывает быстрые изменения концентрации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Выученные вязкоупругие параметры показывают вырождение: отношение модулей E_U/E_R близко к единице по всем каналам. Вязкоупругая модель в данных условиях фактически работает как упругая, так как постоянная времени сорбции τ_s отфильтровывает быстрые переходные процессы, не позволяя зафиксировать вязкоупругую релаксацию. Тем не менее, вязкоупругое ограничение важно для обеспечения временной гладкости пути &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_f%20%20o%20%5Chat%7B%5Csigma%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. При сокращении окна входных данных до 1/2 (Рис. 3c,d) или 1/4 (Рис. 3e,f) от полной длины, траектории сохраняют точность в центральной области, что подтверждает независимость метода от длительности входного сигнала.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Невязка (residual) — это разница между предсказанием модели и реальными данными, которая служит индикатором согласованности системы без необходимости во внешнем эталоне.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторы проверяют, способны ли восстановленный сигнал и физические невязки выявлять аномалии в работе датчиков при двух типах контролируемых возмущений.&lt;/p&gt;\n&lt;p&gt;Для каждого теста случайно выбирается один канал (Рис. 4a), в котором задаются возмущения в z-нормированном пространстве: (i) смещение (offset) σ'_j → σ'_j + δ, где &lt;span class=\"yfm-latex\" data-content=\"%5Cdelta%20%5Cin%20%5B0%2C%201%5D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (Рис. 4b), и (ii) масштабирование (scale) σ'_j → α σ'_j, где &lt;span class=\"yfm-latex\" data-content=\"%5Calpha%20%5Cin%20%5B0.2%2C%201%5D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (Рис. 4d). Эти возмущения имитируют типичные отказы: загрязнение рецепторов, дрейф температуры или ошибки усиления.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-f4.jpg\" alt=\"Рис. 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 4&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель проецирует искаженный сигнал на выученное многообразие, поэтому несоответствие между &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Csigma%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; и σ становится вычислимым индикатором ошибки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Рис. 4c,e показывает, что при возмущениях &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_g\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; и &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_f\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; остаются стабильными, тогда как &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Csigma%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; отклоняется от искаженного входа. Для количественной оценки вводится показатель несоответствия &lt;span class=\"yfm-latex\" data-content=\"I_%7B%5Csigma%7D%20%3D%20%20ext%7BMSE%7D(%5Csigma%2C%20%5Chat%7B%5Csigma%7D)%20%3D%20%5Cfrac%7B1%7D%7BN%7D%20%5Csum_%7Bt%3D1%7D%5EN%20(%5Csigma_i%20-%20%5Chat%7B%5Csigma%7D_i)%5E2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Как видно на Рис. 4g, Iσ растет линейно при увеличении смещения. Для масштабирования (Рис. 4h) наблюдается быстрый рост с последующим насыщением. Метод позволяет локализовать неисправный канал, так как значение Iσ для него значительно выше, чем для остальных.&lt;/p&gt;\n&lt;p&gt;Глобальные возмущения сигнала меняют его амплитуду, что легко фиксируется метрикой Iσ. Однако существует класс аномалий, которые остаются незамеченными на уровне анализа самого сигнала. Для демонстрации этого авторы создали «удаление сегмента» (deletionsplice): временной фрагмент удаляется из тестовой последовательности, а оставшиеся части соединяются (Рис. 5a). Такие разрывы возникают в реальности при переполнении буферов или перезапуске регистратора данных. Поскольку значения сигнала по обе стороны от разрыва соответствуют обучающей выборке, входные данные выглядят статистически нормальными. Модель восстанавливает &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Csigma%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; без видимых искажений, а Iσ остается на базовом уровне (Рис. 5b).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-f5.jpg\" alt=\"Рис. 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 5&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Физические невязки R₁ и R₂ позволяют обнаружить разрывы данных, которые не фиксируются стандартным анализом амплитуды сигнала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Однако физические невязки R₁ (сорбция) и R₂ (вязкоупругость), вычисленные на основе выходов модели, демонстрируют резкие пики в точке разрыва (Рис. 5c). Нарушение временной непрерывности противоречит уравнениям (1)–(2), что и приводит к росту невязки. Тепловые карты невязок по всему тестовому набору подтверждают, что метод стабильно выявляет такие «горячие точки» (Рис. 5d).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Физическая невязка — это мера отклонения предсказания модели от фундаментальных законов физики, заложенных в уравнениях системы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Более строгий тест — «замена сегмента» (substitution splice), где фрагмент 70–90 с заменяется аналогичным отрезком из другой записи (Рис. 5e). Все данные здесь являются реальными, а статистические характеристики сегмента соответствуют окружению. Тем не менее, в точках стыка возникают динамические разрывы. В этом случае Iσ увеличивается в среднем менее чем на 7%, что не выходит за пределы базового шума, тогда как R₁ и R₂ четко указывают на оба места редактирования (Рис. 5f). Таким образом, физическая согласованность обеспечивает защиту от подделки данных, которую невозможно обнаружить только статистическими методами.&lt;/p&gt;\n&lt;p&gt;Эксперименты показывают, что Iσ и R₁/R₂ реагируют на разные типы аномалий. При смещении или масштабировании сигнала Iσ растет, а R₁ и R₂ остаются стабильными, так как модель проецирует искаженный вход на изученное многообразие без нарушения внутренней динамики. При разрывах (splice) ситуация обратная: Iσ «слеп» к нарушениям, а физические невязки фиксируют их напрямую. Вместе они образуют многоуровневую диагностику: Iσ отмечает глобальные сдвиги распределения, а R₁ и R₂ — локальные нарушения динамики.&lt;/p&gt;\n&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;p&gt;Представленная модель динамической инверсии позволяет восстанавливать временные профили концентраций многокомпонентных газовых смесей по сигналам многоканальных датчиков. Система работает без необходимости фиксированной формы волны, заданной длительности входного сигнала или извлечения признаков равновесия. Алгоритм обеспечивает стабильную реконструкцию траекторий концентраций как при синхронном, так и при асинхронном смешивании газов, сохраняя устойчивость при варьировании длины входного окна.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель объединяет реконструкцию отклика датчика &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Csigma%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; и концентраций &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_g\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, что позволяет системе выполнять самопроверку в процессе вывода.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Самопроверка осуществляется через два механизма: показатель несоответствия сигнала Iσ, выявляющий глобальные сдвиги распределения, и физические остатки R₁ и R₂, фиксирующие локальные динамические нарушения. Комбинация этих методов позволяет обнаруживать широкий спектр ошибок без доступа к эталонным данным. Система превращает переходные процессы в полезную информацию, а помехи — в оцениваемые состояния.&lt;/p&gt;\n&lt;h4 id=\"diagnostika-i-celostnost-dannyh\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#diagnostika-i-celostnost-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Диагностика и целостность данных&lt;/span&gt;&lt;/a&gt;Диагностика и целостность данных&lt;/h4&gt;\n&lt;p&gt;Эксперименты с возмущениями показали, что диагностические инструменты реагируют на физические несоответствия, а не на их причины. Например, смещение в канале может быть вызвано загрязнением рецептора или ошибкой считывающего устройства, а разрыв в данных — перезапуском логгера или редактированием записи. Система локализует проблему, однако определение её первопричины требует внешнего контекста. Для обслуживания оборудования Iσ служит индикатором дрейфа и потери чувствительности конкретного канала. В задачах проверки целостности физические остатки успешно выявили удаление и подмену данных, включая случаи, когда все выборки состояли из подлинных значений.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Система не является полноценным инструментом аутентификации данных, но добавляет физически обоснованную проверку без внедрения дополнительного оборудования.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ogranicheniya-i-perspektivy\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#ogranicheniya-i-perspektivy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и перспективы&lt;/span&gt;&lt;/a&gt;Ограничения и перспективы&lt;/h4&gt;\n&lt;p&gt;Текущие эксперименты ограничены бинарными смесями воды и этанола. Хотя теоретически расширение до тройных смесей (вода–метанол–этанол) возможно, вопрос о предельном количестве компонентов для заданного числа каналов остается открытым. Модель SLS при текущих условиях (EU/ER ≈ 1) сводится к упругому отклику, сохраняя при этом роль в обеспечении временной согласованности.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Физические остатки — это разница между предсказанным моделью поведением системы и реально измеренными данными, указывающая на нарушение физических законов процесса.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Система предполагает, что уравнения динамики адекватно описывают процесс в рамках обучающей выборки. Если реальная динамика изменится, физические остатки могут возрасти без изменения Iσ. Также система не обнаружит подделку, которая идеально соответствует физическим уравнениям (например, воспроизведение ранее записанных чистых данных), или манипуляции до достижения газа датчиком, такие как разбавление пробы. В будущем планируется переход к более сложным смесям и интеграция пороговых значений Iσ в автоматизированные протоколы принятия решений.&lt;/p&gt;\n&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;h4 id=\"51-sensornaya-matrica-i-eksperimentalnye-izmereniya\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#51-sensornaya-matrica-i-eksperimentalnye-izmereniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5.1 Сенсорная матрица и экспериментальные измерения&lt;/span&gt;&lt;/a&gt;5.1 Сенсорная матрица и экспериментальные измерения&lt;/h4&gt;\n&lt;p&gt;Для создания массива датчиков использовались чипы MSS, покрытые двенадцатью различными полимерными рецепторами: PVF, PS, PCL, PMMA, CAB, TENAX, P4MS, PSF, PVP, PVC, PMVE и PBA. Полимеры растворялись в N,N-диметилформамиде (DMF) или 1,1,2,2-тетрахлорэтане (TCE) и наносились на чипы с помощью струйного принтера (LaboJet-500SP) с соплом IJHBS-300. После нанесения растворитель испарялся при 60 °C, а образцы сушились при комнатной температуре в течение 24 часов. В измерительную ячейку помещались три четырехканальных чипа. Сигналы считывались с частотой 100 Гц и для анализа понижались до 20 Гц.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Струйная печать (inkjet spotting) — метод прецизионного нанесения микродоз полимерного раствора на поверхность сенсора для создания однородного чувствительного слоя.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"52-protokoly-podachi-gaza\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#52-protokoly-podachi-gaza\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5.2 Протоколы подачи газа&lt;/span&gt;&lt;/a&gt;5.2 Протоколы подачи газа&lt;/h4&gt;\n&lt;p&gt;Динамические бинарные смеси паров воды и этанола создавались с использованием трех контроллеров массового расхода (MFC) с азотом (N2) в качестве газа-носителя. Состав смеси регулировался по четырем формам волны: прямоугольной, пилообразной, обратной пилообразной и гауссовой. Каждый цикл измерения длился 240 с: продувка (20 с), активная подача (120 с) с 4–5 сегментами по 10–20 с и финальная продувка (100 с). Использовались два режима: синхронное смешивание (оба MFC следуют одной форме) и асинхронное (независимые формы). Обучающая выборка составила 150 последовательностей, тестовая — 50. Данные обрезались до 160 с (3200 временных шагов).&lt;/p&gt;\n&lt;h4 id=\"53-fiziko-matematicheskaya-model\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#53-fiziko-matematicheskaya-model\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5.3 Физико-математическая модель&lt;/span&gt;&lt;/a&gt;5.3 Физико-математическая модель&lt;/h4&gt;\n&lt;p&gt;Динамика процесса описывается двумя этапами. Кинетика сорбции (ур. 1) определяет перенос массы из газовой фазы в пленку, используя константу времени сорбции τ_s и коэффициент распределения K_p. Механический отклик следует модели стандартного линейного тела (ур. 2), связанной с концентрацией в пленке через соотношение малых деформаций &lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon%20%3D%20(v%2F3)%20C_f\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Для массива из n датчиков и g газов параметры τ_s и K_p индивидуальны для каждой пары газ-сенсор, а параметры вязкоупругости (τ_r, E_U, E_R) — для каждого сенсора. Все параметры являются обучаемыми.&lt;/p&gt;\n&lt;h4 id=\"54-arhitektura-nejronnoj-seti\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#54-arhitektura-nejronnoj-seti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5.4 Архитектура нейронной сети&lt;/span&gt;&lt;/a&gt;5.4 Архитектура нейронной сети&lt;/h4&gt;\n&lt;p&gt;Модель включает энкодер на основе некаузальной темпоральной сверточной сети (TCN) с 11 слоями (факторы расширения &lt;span class=\"yfm-latex\" data-content=\"2%5E0%2C%20%5Cdots%2C%202%5E%7B10%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, размер ядра 3, 64 канала). Рецептивное поле составляет 4095 шагов, что перекрывает всю длину входа. Выход TCN декодируется общим многослойным перцептроном (MLP) с двумя скрытыми слоями по 512 нейренов, соединенным с тремя выходными блоками (по 128 нейронов) для прогнозирования &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_g%2C%20%5Chat%7BC%7D_f\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; и &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Csigma%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. После каждого скрытого слоя применяется dropout (p=0.1).&lt;/p&gt;\n&lt;h4 id=\"55-celi-obucheniya-i-ogranicheniya\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#55-celi-obucheniya-i-ogranicheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5.5 Цели обучения и ограничения&lt;/span&gt;&lt;/a&gt;5.5 Цели обучения и ограничения&lt;/h4&gt;\n&lt;p&gt;Целевая функция — взвешенная сумма ошибки реконструкции сигнала &lt;span class=\"yfm-latex\" data-content=\"L_V%20%3D%20MSE(V%2C%20%5Chat%7BV%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; и ошибки прогноза концентрации &lt;span class=\"yfm-latex\" data-content=\"L_%7BCg%7D%20%3D%20MSE(C_g%2C%20%5Chat%7BC%7D_g)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Физические остатки R₁, R₂ и ограничение E_U/E_R ≥ 1 вводятся как «мягкие» ограничения через метод модифицированных дифференциальных множителей (MDMM). Оптимизация выполняется алгоритмом Adan с планировщиком ReduceLROnPlateau (начальная скорость 10⁻³, минимальная 10⁻⁵). Обучение прекращается при достижении лимита терпения в 800 эпох.&lt;/p&gt;\n&lt;h4 id=\"56-eksperimenty-s-vozmusheniyami\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#56-eksperimenty-s-vozmusheniyami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5.6 Эксперименты с возмущениями&lt;/span&gt;&lt;/a&gt;5.6 Эксперименты с возмущениями&lt;/h4&gt;\n&lt;p&gt;После обучения параметры сети замораживаются для тестирования устойчивости к сбоям. Глобальные возмущения включают: смещение (добавление &lt;span class=\"yfm-latex\" data-content=\"%5Cdelta%20%5Cin%20%5B0%2C%201%5D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; к сигналу, имитация дрейфа базы) и масштабирование (умножение на &lt;span class=\"yfm-latex\" data-content=\"%5Calpha%20%5Cin%20%5B0.2%2C%201%5D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, имитация деградации чувствительности). Сплайс-возмущения включают удаление временного сегмента (с последующей склейкой) и подстановку (замена сегмента 70–90 с на данные из другой последовательности), что имитирует редактирование записей.&lt;/p&gt;\n&lt;h4 id=\"57-metriki-ocenki\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#57-metriki-ocenki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5.7 Метрики оценки&lt;/span&gt;&lt;/a&gt;5.7 Метрики оценки&lt;/h4&gt;\n&lt;p&gt;Точность реконструкции концентрации оценивается с помощью среднеквадратичной ошибки (RMSE) и коэффициента детерминации (R²), вычисляемых между восстановленными и эталонными траекториями концентрации для всех тестовых последовательностей. Несогласованность сигнала Iσ (уравнение 5) количественно определяет среднеквадратичную ошибку между измеренным входным сигналом и реконструированным сигналом для каждого канала. Физические невязки R₁ и R₂ (уравнения 3–4) оцениваются по точкам вдоль каждой траектории.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RMSE показывает среднее отклонение восстановленных значений от реальных, а R² отражает долю дисперсии, которую модель способна объяснить.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Поканальные значения RMSE, R² и кумулятивные распределения ошибок представлены в Дополнительной заметке 5.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 1.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-tT1.jpg\" alt=\"Таблица 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS2.jpg\" alt=\"Рис. S2. Кривые потерь при обучении и валидации для физической модели по результатам пяти независимых запусков с различн\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S2. Кривые потерь при обучении и валидации для физической модели по результатам пяти независимых запусков с различными случайными начальными значениями.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. S2. Кривые потерь при обучении и валидации для физической модели по результатам пяти независимых запусков с различными случайными начальными значениями. Сплошные линии: медиана; заштрихованные области: диапазон от минимума до максимума. Верхний ряд: общие потери, потери концентрации LC и потери при реконструкции сигнала LV. Нижний ряд: квадраты физических невязок R2 1 (сорбция) и R2 2 (вязкоупругость).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS3.jpg\" alt=\"Рис. S3. Схема экспериментальной установки. MFC-1 и MFC-2 подают N2 через барботеры, содержащие этанол и воду соответств\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S3. Схема экспериментальной установки. MFC-1 и MFC-2 подают N2 через барботеры, содержащие этанол и воду соответственно. MFC-3 обеспечивает подачу N2 для разбавления. Газовая смесь подается в ячейку датчика, содержащую 12-канальную матрицу MSS.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS4.jpg\" alt=\"Рис. S4. Четыре типа формы волны, используемые для управления MFC: прямоугольная, пилообразная, обратно-пилообразная и г\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S4. Четыре типа формы волны, используемые для управления MFC: прямоугольная, пилообразная, обратно-пилообразная и гауссовская.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS5.jpg\" alt=\"Рис. S5. Репрезентативные профили концентрации в газовой фазе Cg при синхронном (верхний график) и асинхронном (нижний г\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S5. Репрезентативные профили концентрации в газовой фазе Cg при синхронном (верхний график) и асинхронном (нижний график) смешивании. В синхронном режиме оба компонента имеют одинаковую форму волны; в асинхронном режиме каждый компонент следует независимой форме волны.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS6.jpg\" alt=\"Рис. S6. Репрезентативные выходные сигналы 12-канального датчика при синхронном (верхний график) и асинхронном (нижний г\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S6. Репрезентативные выходные сигналы 12-канального датчика при синхронном (верхний график) и асинхронном (нижний график) смешивании, соответствующие профилям концентрации на рис. S5.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS7.jpg\" alt=\"Рис. S7. Восстановленные физические параметры для каждого канала датчика, агрегированные по пяти независимым циклам обуч\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S7. Восстановленные физические параметры для каждого канала датчика, агрегированные по пяти независимым циклам обучения (среднее ± стандартное отклонение).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. S7. Восстановленные физические параметры для каждого канала датчика, агрегированные по пяти независимым циклам обучения (среднее ± стандартное отклонение). Вверху: постоянная времени сорбции 𝜏𝑠 для этанола и воды. В центре: отношение модулей 𝐸𝑈/𝐸𝑅. Внизу: постоянная времени механической релаксации 𝜏𝑟.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS8.jpg\" alt=\"Рис. S8. Реконструкция репрезентативной тестовой последовательности тремя вариантами модели.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S8. Реконструкция репрезентативной тестовой последовательности тремя вариантами модели.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. S8. Реконструкция репрезентативной тестовой последовательности тремя вариантами модели. Верхний ряд: предсказания 𝐶𝑔 (пунктир), наложенные на фактические данные (сплошная линия) для этанола и воды. Средний ряд: реконструированный сигнал ̂𝜎 в зависимости от входных данных для одного репрезентативного канала (PVF). Нижний ряд: изменение концентрации в фазе пленки Δ𝐶𝑓 = 𝐶𝑓(𝑡) − 𝐶𝑓(0) для обоих газообразных веществ.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS9.jpg\" alt=\"Рис. S9. Оценки ядерной плотности метрик самопроверки на 50 нормальных тестовых последовательностях.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S9. Оценки ядерной плотности метрик самопроверки на 50 нормальных тестовых последовательностях.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. S9. Оценки ядерной плотности метрик самопроверки на 50 нормальных тестовых последовательностях. Слева: несогласованность сигнала 𝐼𝜎. В центре: средний остаток сорбции /ℛ1/. Справа: средний вязкоупругий остаток /ℛ2/. Значения вычислены для каждого канала в каждой последовательности (600 значений на модель).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS10.jpg\" alt=\"Рис. S10. Несогласованность сигнала 𝐼𝜎 как функция величины аддитивного смещения для каждого из 12 каналов датчиков. Вре\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S10. Несогласованность сигнала 𝐼𝜎 как функция величины аддитивного смещения для каждого из 12 каналов датчиков. Врезка: распределения KDE при смещении = 0 показывают базовый уровень 𝐼𝜎 для каждой модели.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS11.jpg\" alt=\"Рис. S11. Несогласованность сигнала 𝐼𝜎 как функция мультипликативного масштабного коэффициента для каждого из 12 каналов\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S11. Несогласованность сигнала 𝐼𝜎 как функция мультипликативного масштабного коэффициента для каждого из 12 каналов датчиков. Врезка: распределения KDE при масштабном коэффициенте = 1 показывают базовый уровень 𝐼𝜎 для каждой модели.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS12.jpg\" alt=\"Рис. S12. Остаточная величина сорбции ℛ1 при входных возмущениях.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S12. Остаточная величина сорбции ℛ1 при входных возмущениях.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. S12. Остаточная величина сорбции ℛ1 при входных возмущениях. (a, c) Среднее значение ℛ1 как функция величины возмущения смещения (a) и усиления (c). Заштрихованные области указывают стандартное отклонение. (b, d) Распределение ℛ1 при выбранных величинах возмущения для условий смещения (b) и усиления (d). Фиолетовый цвет: возмущенный канал; серый: невозмущенные каналы; темно-серый: базовый уровень (без возмущения).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS13.jpg\" alt=\"Рис. S13. Остаточная величина вязкоупругости ℛ2 при входных возмущениях, структура аналогична рис. S12. ℛ2 остается отно\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S13. Остаточная величина вязкоупругости ℛ2 при входных возмущениях, структура аналогична рис. S12. ℛ2 остается относительно стабильной при обоих типах возмущений, в отличие от монотонного роста 𝐼𝜎.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS14.jpg\" alt=\"Рис. S14. Удаление фрагмента последовательности, демонстрирующее взаимодополняемость 𝐼𝜎 и физических остаточных величин.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S14. Удаление фрагмента последовательности, демонстрирующее взаимодополняемость 𝐼𝜎 и физических остаточных величин.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. S14. Удаление фрагмента последовательности, демонстрирующее взаимодополняемость 𝐼𝜎 и физических остаточных величин. Левый столбец: последовательность с удаленным фрагментом (100 точек удалено при 𝑡=85 с, красная пунктирная линия). Правый столбец: нормальная эталонная последовательность (красная заштрихованная полоса указывает удаленный сегмент). Строки сверху вниз: входной сигнал, реконструированное 𝜎, временная зависимость 𝐼𝜎(𝑡), реконструированное ̂𝐶𝑔, остаточная величина сорбции ℛ1 и остаточная величина вязкоупругости ℛ2. Распределения KDE на врезке при 𝑡=0 показывают базовые распределения по нормальным тестовым данным. Точка разрыва вызывает резкие скачки в ℛ1 и ℛ2, но не вызывает заметных изменений в 𝐼𝜎.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS15.jpg\" alt=\"Рис. S15. Репрезентативные выходные данные модели для замены фрагмента последовательности. Сегмент 70–90 с заменен соотв\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S15. Репрезентативные выходные данные модели для замены фрагмента последовательности. Сегмент 70–90 с заменен соответствующим сегментом другой тестовой последовательности; пунктирные линии отмечают два стыка.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS16.jpg\" alt=\"Рис. S16. Статистика обнаружения стыков по каналам для удалений (верхний ряд) и замен (нижний ряд).\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S16. Статистика обнаружения стыков по каналам для удалений (верхний ряд) и замен (нижний ряд).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. S16. Статистика обнаружения стыков по каналам для удалений (верхний ряд) и замен (нижний ряд). Ящики показывают распределение по 50 тестовым последовательностям пикового абсолютного остатка в пределах ±1 с от стыка(ов) для остаточной величины сорбции ℛ1 (максимум по двум газам, левый столбец) и остаточной величины вязкоупругости ℛ2 (правый столбец). Серые ромбы отмечают медиану по последовательностям 99-го процентиля абсолютного остатка по остальной части каждой записи. Примечание: логарифмическая шкала.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS17.jpg\" alt=\"Рис. S17. Среднеквадратичная ошибка (RMSE) реконструкции концентрации этанола и воды для тестовой выборки. Асинхронное с\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S17. Среднеквадратичная ошибка (RMSE) реконструкции концентрации этанола и воды для тестовой выборки. Асинхронное смешивание (слева) и синхронное смешивание (справа). Погрешности соответствуют стандартному отклонению.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS18.jpg\" alt=\"Рис. S18. Кумулятивная среднеквадратичная ошибка (RMSE) реконструированного сигнала для каждого из 12 сенсорных каналов.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S18. Кумулятивная среднеквадратичная ошибка (RMSE) реконструированного сигнала для каждого из 12 сенсорных каналов. Асинхронное смешивание (слева) и синхронное смешивание (справа). Погрешности соответствуют стандартному отклонению.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS19.jpg\" alt=\"Рис. S19. Распределение коэффициента детерминации (R²) для реконструированного сигнала по 12 сенсорным каналам. Асинхрон\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S19. Распределение коэффициента детерминации (R²) для реконструированного сигнала по 12 сенсорным каналам. Асинхронное смешивание (слева) и синхронное смешивание (справа). Скрипичные диаграммы отображают полное распределение; маркеры указывают на экстремальные значения.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS20.jpg\" alt=\"Рис. S20. Входной сигнал с инвертированным знаком (все каналы умножены на −1). Ряды сверху вниз: входной сигнал, реконст\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S20. Входной сигнал с инвертированным знаком (все каналы умножены на −1). Ряды сверху вниз: входной сигнал, реконструированная концентрация Cg, реконструированное значение 𝜎 в сравнении с входным и ΔCf для одного репрезентативного канала (PVF).&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Дрейф и сбои&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;датчиков без&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;калибровки&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;TCN с&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ограничениями&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;механики&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;полимеров&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Разделение&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;газов и самоди&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;агностика&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Автономный&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мониторинг тех&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;нологических&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сред&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт не проходил рецензирование. Выводы предварительные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;the
