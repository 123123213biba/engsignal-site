            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"262\" cy=\"86\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"498\" cy=\"240\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · OTHER   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;AIR-LLM: как запускать&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;нейросети без памяти и&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;загрузки весов&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-f2.jpg\" alt=\"Рисунок 2. Обзор радиочастотного вычислительного движка AIR-LLM, который выполняет 𝐴 внутренних произведений (IP) операц\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2. Обзор радиочастотного вычислительного движка &lt;a href=\"concepts/air-llm.html\"&gt;AIR-LLM&lt;/a&gt;, который выполняет 𝐴 внутренних произведений (IP) операции &lt;a href=\"concepts/general-matrix-vector-multiplication.html\"&gt;GEMV&lt;/a&gt; за один раунд (или 2𝐴, если они вещественные).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 2. Обзор радиочастотного вычислительного движка AIR-LLM, который выполняет 𝐴 внутренних произведений (IP) операции GEMV за один раунд (или 2𝐴, если они вещественные). Центральная радиостанция передает веса этих IP через свои 𝐴 антенн без предварительного кодирования под конкретного пользователя. Затем каждое краевое устройство подает 𝐴 полученных волновых форм весов вместе со своим собственным входом GEMV на 𝐶 блоков калибровки, чьи прекодеры и посткодеры получены из собственного канала этого пользователя с помощью инициализации на основе &lt;a href=\"concepts/svd.html\"&gt;SVD&lt;/a&gt; и точной настройки на основе ALS. Суммирование выходов 𝐶 блоков дает выход GEMV данного раунда.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;AIR-LLM переносит вычисления нейросетей из локальной памяти в радиочастотный домен. Центральная станция транслирует веса модели через OFDM-сигналы, а устройство пользователя выполняет матрично-векторное умножение (GEMV) с помощью обычного RF-смесителя. Это позволяет запускать LLM на устройствах с минимальным объемом памяти, исключая энергозатраты на чтение данных.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Вычисления выполняются в аналоговом RF-домене через смесители&lt;/li&gt;\n&lt;li&gt;Экономия энергии до 157,7 раз по сравнению с FP16-вычислениями&lt;/li&gt;\n&lt;li&gt;Масштабируемость: одна трансляция обслуживает неограниченное число пользователей&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;В основе AIR-LLM лежит использование радиочастотного смесителя (RF mixer) как вычислительного узла. &lt;a href=\"concepts/rf-mixer.html\"&gt;Смеситель&lt;/a&gt; выполняет аналоговое умножение сигналов во временной области, что эквивалентно линейной свертке в частотной области. Для реализации операции GEMV (General Matrix-Vector Multiplication) веса модели кодируются в OFDM-поднесущие, а активации подаются через локальный осциллятор. В результате средняя поднесущая выходного сигнала содержит скалярное произведение векторов, что позволяет извлекать результат без оцифровки всех промежуточных данных.&lt;/p&gt;\n&lt;p&gt;Для масштабируемости система применяет &lt;a href=\"concepts/mimo-spatial-multiplexing.html\"&gt;MIMO-мультиплексирование&lt;/a&gt; (Multiple-Input Multiple-Output), передавая несколько потоков весов одновременно. Калибровка канала осуществляется парой прекодер-посткодер, что минимизирует вычислительные затраты на стороне клиента. При тестировании на модели LLaMA-3.1-8B с использованием трассировки лучей NVIDIA Sionna, метод показал снижение энергопотребления в 157,7 раза по сравнению с FP16 и сокращение времени передачи (airtime) в 104,1 раза для 20 пользователей.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование основано на симуляции каналов NVIDIA Sionna и профилировании одного типа RF-смесителя, что не учитывает все помехи реальной среды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Современные большие языковые модели (LLM) активно переходят из облачных инфраструктур на периферийные устройства. Однако такие устройства часто сталкиваются с ограничениями: нехваткой памяти для хранения весов моделей или чрезмерным энергопотреблением при их загрузке. Авторы задаются вопросом: возможно ли выполнение инференса LLM без локального хранения или предварительной загрузки весов, получая их «по воздуху» и обрабатывая в режиме реального времени?&lt;/p&gt;\n&lt;p&gt;Представлена концепция AIR-LLM — архитектура инференса, состоящая из центрального радиоузла (например, базовой станции 5G) и периферийного пользователя. Радиоузел транслирует веса модели в эфир, а пользовательское устройство выполняет операцию общего матрично-векторного умножения (GEMV) непосредственно в радиочастотном (РЧ) домене с использованием РЧ-смесителей. Для оптимизации времени передачи данных используется пространственное мультиплексирование MIMO и энергоэффективная пара прекодер-посткодер для калибровки беспроводного канала.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AIR-LLM позволяет выполнять инференс без хранения весов, обеспечивая экономию энергии до 157,7 раз по сравнению с FP16 и сокращая время передачи данных в 104,1 раза при работе с 20 пользователями.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GEMV (General Matrix-Vector Multiplication) — это базовая математическая операция, лежащая в основе работы нейронных сетей, где матрица весов умножается на входной вектор.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Система была протестирована с использованием симулятора NVIDIA Sionna для моделирования каналов в двух городских сценариях с учетом характеристик реальных РЧ-смесителей. При работе с моделью LLaMA-3.1-8B деградация перплексии на наборе данных WikiText-2 составила всего 4,0%. Система масштабируема, так как центральный радиоузел не требует идентификации конкретных пользователей, что позволяет обслуживать неограниченное число абонентов в зоне покрытия.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Результаты получены на основе симуляций в среде NVIDIA Sionna и профилирования характеристик РЧ-смесителей, что может отличаться от работы в условиях реального аппаратного развертывания.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;h4 id=\"vnedrenie-llm-na-periferijnye-ustrojstva\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#vnedrenie-llm-na-periferijnye-ustrojstva\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Внедрение LLM на периферийные устройства&lt;/span&gt;&lt;/a&gt;Внедрение LLM на периферийные устройства&lt;/h4&gt;\n&lt;p&gt;Современные периферийные устройства активно внедряют методы машинного обучения для задач мониторинга здоровья, распознавания речи и автономного вождения. Большие языковые модели (LLM) открывают новые возможности для обработки естественного языка, однако их использование на периферии ограничено облачными вычислениями. Это создает проблемы с конфиденциальностью данных и задержками при передаче сигналов, особенно при масштабировании сети. Основным препятствием является огромный размер моделей: например, LLaMA-3.1-8B требует 16 ГБ памяти в формате FP16 и 4 ГБ даже после 4-битного квантования весов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Основная проблема развертывания LLM на периферии заключается в нехватке памяти и чрезмерных энергозатратах на передачу весов из памяти в вычислительный блок.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Квантование (&lt;a href=\"concepts/quantization.html\"&gt;quantization&lt;/a&gt;) — это метод сжатия модели путем снижения точности представления весов (например, с 16 бит до 4 бит), что уменьшает объем занимаемой памяти.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Процесс вывода LLM ограничен пропускной способностью памяти: на одну операцию считывания веса приходится всего две операции с плавающей запятой (FLOPs). В результате энергопотребление при перемещении данных значительно превышает затраты на сами вычисления. Существующие подходы, такие как вычисления в памяти (ReRAM, PCM, SRAM) или беспроводные вычисления (over-the-air), ограничены фиксированным размером матрично-векторного умножения (GEMV), например, кроссбарами 128×128, что не соответствует масштабам современных LLM.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Существующие аппаратные решения для вычислений в памяти имеют жестко заданные ограничения по размеру матриц, что делает их неэффективными для растущих архитектур LLM.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мы предлагаем использовать возможности существующих сетей 5G для широковещательной передачи весов модели, что позволяет обслуживать всех пользователей в зоне покрытия одним сигналом. Для выполнения вычислений мы применяем радиочастотные (RF) вычисления с использованием пассивных RF-смесителей, уже имеющихся в приемниках. Это позволяет выполнять вычисления в аналоговом виде сразу при получении сигнала, исключая необходимость оцифровки и хранения весов в локальной памяти.&lt;/p&gt;\n&lt;h4 id=\"vychislitelnaya-paradigma-air-llm\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#vychislitelnaya-paradigma-air-llm\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вычислительная парадигма AIR-LLM&lt;/span&gt;&lt;/a&gt;Вычислительная парадигма AIR-LLM&lt;/h4&gt;\n&lt;p&gt;AIR-LLM представляет собой архитектуру для инференса LLM, где центральная радиостанция (например, 5G-вышка) кодирует веса модели в частотный спектр OFDM-сигнала и транслирует его. Любое устройство в зоне покрытия принимает этот сигнал и выполняет вычисления непосредственно в своем радиочастотном (RF) тракте. Ключевым элементом является RF-смеситель, который перемножает входные сигналы во временной области, что эквивалентно линейной свертке в частотной. При подаче на локальный осциллятор сигнала с активациями, спектр весов свертывается со спектром активаций, а центральная поднесущая результата представляет собой скалярное произведение векторов весов и активаций. Сравнение с другими парадигмами приведено в Таблице 1.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 1.&lt;/strong&gt; Сравнение AIR-LLM и существующих парадигм периферийных вычислений&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;1&lt;/th&gt;\n&lt;th&gt;2&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;2&lt;/td&gt;\n&lt;td&gt;2&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AIR-LLM использует RF-смесители для выполнения операций GEMV (умножение матрицы на вектор) непосредственно в радиоканале, исключая необходимость обращения к локальной памяти.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Система использует пространственное мультиплексирование MIMO A × A, передавая A потоков весов одновременно, что сокращает время эфира в A раз. Для компенсации канала применяется калибровка с C блоками, что значительно дешевле инверсии матрицы. AIR-LLM не требует «рукопожатий» с пользователями и адаптации схемы модуляции (MCS) под SNR, так как вычисления устойчивы к тепловому шуму. В ходе тестирования на моделях от 1B до 70B параметров (сценарии Париж и Мюнхен) для LLaMA-3.1-8B падение точности (&lt;a href=\"concepts/perplexity.html\"&gt;PPL&lt;/a&gt;) составило всего 4.0%. Энергопотребление на токен снизилось в 157.7/40.4 раза по сравнению с FP16/4-битными весами при удаленном хранении и в 51.5/13.9 раза при сравнении с локальным доступом к памяти. Время эфира сократилось в 104.1/26.0 раза.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GEMV (General Matrix-Vector Multiplication) — базовая операция в нейросетях, где матрица весов умножается на вектор активаций.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"model-kanala-ofdm-i-mimo\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#model-kanala-ofdm-i-mimo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Модель канала OFDM и MIMO&lt;/span&gt;&lt;/a&gt;Модель канала OFDM и MIMO&lt;/h4&gt;\n&lt;p&gt;Сигналы базируются на OFDM с размером БПФ Nfft и полосой B, где разнос поднесущих Δ f = B/Nfft. В системе MIMO A_t × A_r передаваемый сигнал &lt;span class=\"yfm-latex\" data-content=\"S_t%20%5Cin%20%5Cmathbb%7BC%7D%5E%7BA_t%20%20imes%20N_%7B%20ext%7Bfft%7D%7D%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; и принятый &lt;span class=\"yfm-latex\" data-content=\"S_r%20%5Cin%20%5Cmathbb%7BC%7D%5E%7BA_r%20%20imes%20N_%7B%20ext%7Bfft%7D%7D%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; связаны каналом &lt;span class=\"yfm-latex\" data-content=\"H%20%5Cin%20%5Cmathbb%7BC%7D%5E%7BA_t%20%20imes%20A_r%20%20imes%20N_%7B%20ext%7Bfft%7D%7D%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Принятый сигнал определяется формулой (1):&lt;br /&gt;\n&lt;span class=\"yfm-latex\" data-content=\"S_r%5Ba_r%2C%20k%5D%20%3D%20%5Csum_%7Ba_t%3D0%7D%5E%7BA_t-1%7D%20H%5Ba_t%2C%20a_r%2C%20k%5D%20%5Ccdot%20S_t%5Ba_t%2C%20k%5D%20%2B%20%5Cfrac%7B%5Csigma%7D%7B%5Csqrt%7BN_%7B%20ext%7Bfft%7D%7D%7D%7D%20%5Ccdot%20N\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;&lt;br /&gt;\nгде σ² — мощность шума AWGN. Для восстановления сигнала на стороне приемника используется псевдообратная матрица (2), требующая 8A_t A_r Nfft операций с плавающей запятой.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Восстановление сигнала через инверсию канала требует значительных вычислительных затрат на стороне устройства, что ограничивает эффективность при больших размерностях MIMO.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kompleksnoznachnaya-linejnaya-svertka\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#kompleksnoznachnaya-linejnaya-svertka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Комплекснозначная линейная свертка&lt;/span&gt;&lt;/a&gt;Комплекснозначная линейная свертка&lt;/h4&gt;\n&lt;p&gt;Радиочастотный (РЧ) смеситель позволяет выполнять аналоговую линейную свертку (обозначается ∗) для двух входных сигналов с одинаковым разносом поднесущих Δ f. При условии идентичного размера БПФ (Nfft), входной сигнал активации &lt;span class=\"yfm-latex\" data-content=\"X%20%5Cin%20%5Cmathbb%7BC%7D%5E%7BN_%7B%20ext%7Bfft%7D%7D%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; и весовой сигнал &lt;span class=\"yfm-latex\" data-content=\"W%20%5Cin%20%5Cmathbb%7BC%7D%5E%7BN_%7B%20ext%7Bfft%7D%7D%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; формируют выходной сигнал &lt;span class=\"yfm-latex\" data-content=\"Y%20%5Cin%20%5Cmathbb%7BC%7D%5E%7B2N_%7B%20ext%7Bfft%7D%7D-1%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; согласно формуле (3): &lt;span class=\"yfm-latex\" data-content=\"Y%5Bk%5D%20%3D%20(W%20*%20X)%5Bk%5D%20%3D%20%5Csum_%7Bk'%7D%20W%5Bk'%5D%20%5Ccdot%20X%5Bk-k'%5D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;РЧ-смеситель аппаратно реализует операцию свертки, что позволяет эффективно обрабатывать комплексные сигналы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ispolzovanie-linejnoj-svertki-dlya-gemv/ip\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#ispolzovanie-linejnoj-svertki-dlya-gemv/ip\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Использование линейной свертки для GEMV/IP&lt;/span&gt;&lt;/a&gt;Использование линейной свертки для GEMV/IP&lt;/h4&gt;\n&lt;p&gt;Для вычисления матрично-векторного произведения (GEMV) Y = W · X (&lt;span class=\"yfm-latex\" data-content=\"W%20%5Cin%20%5Cmathbb%7BR%7D%5E%7BM%20%20imes%20N%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"X%20%5Cin%20%5Cmathbb%7BR%7D%5EN\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;), которое лежит в основе логического вывода ИИ, задача сводится к M независимым скалярным произведениям (IP). Поскольку свертка (3) комплексная, одна пара сигналов может нести два IP. Для строк m и m' матрицы W при Nfft = N входной сигнал X подается напрямую, а весовой сигнал Wm,m' кодирует две строки в вещественной и мнимой частях (в обратном порядке поднесущих): X[k] = X[k], Wm,m'[k] = W[m, N-1-k] + j · W[m', N-1-k] (4). Согласно (5), центральная поднесущая Y[N-1] содержит результат Y[m] + j · Y[m']. Остальные 2N-2 поднесущих отсекаются фильтром нижних частот (ФНЧ) с полосой Δ f. Это экономит энергию АЦП, так как требуется оцифровка только одной поднесущей. Всего требуется &lt;span class=\"yfm-latex\" data-content=\"%5Clceil%20M%2F2%20%5Crceil\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; весовых сигналов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GEMV — это стандартная операция умножения матрицы на вектор; здесь она «упаковывается» в аналоговый радиосигнал для ускорения вычислений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"vychislitelnyj-rch-dvizhok\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#vychislitelnyj-rch-dvizhok\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вычислительный РЧ-движок&lt;/span&gt;&lt;/a&gt;Вычислительный РЧ-движок&lt;/h4&gt;\n&lt;p&gt;Архитектура AIR-LLM (Рис. 2) использует MIMO-систему, где канал вещания весов калибруется парой прекодера и посткодера, адаптированных под аналоговый GEMV.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-f2.jpg\" alt=\"Рисунок 2. Обзор радиочастотного вычислительного движка AIR-LLM, который выполняет 𝐴 внутренних произведений (IP) операц\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2. Обзор радиочастотного вычислительного движка AIR-LLM, который выполняет 𝐴 внутренних произведений (IP) операции GEMV за один раунд (или 2𝐴, если они вещественные).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 2. Обзор радиочастотного вычислительного движка AIR-LLM, который выполняет 𝐴 внутренних произведений (IP) операции GEMV за один раунд (или 2𝐴, если они вещественные). Центральная радиостанция передает веса этих IP через свои 𝐴 антенн без предварительного кодирования под конкретного пользователя. Затем каждое краевое устройство подает 𝐴 полученных волновых форм весов вместе со своим собственным входом GEMV на 𝐶 блоков калибровки, чьи прекодеры и посткодеры получены из собственного канала этого пользователя с помощью инициализации на основе SVD и точной настройки на основе ALS. Суммирование выходов 𝐶 блоков дает выход GEMV данного раунда.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"postanovka-zadachi\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#postanovka-zadachi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Постановка задачи&lt;/span&gt;&lt;/a&gt;Постановка задачи&lt;/h4&gt;\n&lt;p&gt;Мы рассматриваем A × A MIMO-систему. Поддерживается до A параллельных пространственных потоков, что позволяет выполнять 2A скалярных произведений за один цикл. GEMV требует &lt;span class=\"yfm-latex\" data-content=\"%5Clceil%20M%2F(2A)%20%5Crceil\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; циклов. Весовые сигналы &lt;span class=\"yfm-latex\" data-content=\"W%20%3D%20%5C%7Bw_a%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; и вход x имеют Nfft = N поднесущих.&lt;/p&gt;\n&lt;h4 id=\"proektirovanie-bloka-kalibrovki\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#proektirovanie-bloka-kalibrovki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Проектирование блока калибровки&lt;/span&gt;&lt;/a&gt;Проектирование блока калибровки&lt;/h4&gt;\n&lt;p&gt;Блок калибровки (Рис. 3) выполняет: (i) цифровое прекодирование и IFFT сигнала x, (ii) аналоговое дублирование на A путей, (iii) смешивание с принятыми сигналами W' и фильтрацию, (iv) цифровое посткодирование.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-f3.jpg\" alt=\"Рисунок 3. Подробная архитектура блока калибровки и обработка им скалярного произведения полученного вектора весов w′ 𝑎 \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3. Подробная архитектура блока калибровки и обработка им скалярного произведения полученного вектора весов w′ 𝑎 и прекодированного входного вектора x′.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"prekodirovanie-dlya-kalibrovki-podnesushih\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#prekodirovanie-dlya-kalibrovki-podnesushih\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Прекодирование для калибровки поднесущих&lt;/span&gt;&lt;/a&gt;Прекодирование для калибровки поднесущих&lt;/h4&gt;\n&lt;p&gt;Прекодер &lt;span class=\"yfm-latex\" data-content=\"P_%7B%20ext%7Bpre%7D%7D%20%5Cin%20%5Cmathbb%7BC%7D%5E%7BN_%7B%20ext%7Bfft%7D%7D%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; компенсирует неравномерность частотной характеристики канала. Сигнал x'[k] = x[k] · Ppre[k] (6) умножается на прекодер поэлементно.&lt;/p&gt;\n&lt;h4 id=\"analogovaya-prekodirovannaya-svertka\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#analogovaya-prekodirovannaya-svertka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Аналоговая прекодированная свертка&lt;/span&gt;&lt;/a&gt;Аналоговая прекодированная свертка&lt;/h4&gt;\n&lt;p&gt;Сигнал x' подается на A РЧ-смесителей, выполняющих параллельные свертки: &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7By%7D_a%20%3D%20w'_a%7B%7D%5E%20op%20%5Ccdot%20x'\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (7).&lt;/p&gt;\n&lt;h4 id=\"postkodirovanie-dlya-kalibrovki-antenn\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#postkodirovanie-dlya-kalibrovki-antenn\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Посткодирование для калибровки антенн&lt;/span&gt;&lt;/a&gt;Посткодирование для калибровки антенн&lt;/h4&gt;\n&lt;p&gt;Посткодер &lt;span class=\"yfm-latex\" data-content=\"P_%7B%20ext%7Bpost%7D%7D%20%5Cin%20%5Cmathbb%7BC%7D%5E%7BA%20%20imes%20A%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; устраняет межантенные помехи: &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7By%7D'_a%20%3D%20%5Csum_%7Ba'%3D0%7D%5E%7BA-1%7D%20P_%7B%20ext%7Bpost%7D%7D%5Ba%2C%20a'%5D%20%5Ccdot%20%5Chat%7By%7D_%7Ba'%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (8).&lt;/p&gt;\n&lt;h4 id=\"kooperaciya-blokov-kalibrovki\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#kooperaciya-blokov-kalibrovki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кооперация блоков калибровки&lt;/span&gt;&lt;/a&gt;Кооперация блоков калибровки&lt;/h4&gt;\n&lt;p&gt;Используется C блоков калибровки с разными Ppre и Ppost. Итоговый выход &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7By%7D''_a%20%3D%20%5Csum_%7Bc%3D0%7D%5E%7BC-1%7D%20%5Chat%7By%7D'_%7Bc%2Ca%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (9) суммирует результаты всех блоков.&lt;/p&gt;\n&lt;h4 id=\"optimizaciya-prekodera-i-postkodera\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#optimizaciya-prekodera-i-postkodera\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оптимизация прекодера и посткодера&lt;/span&gt;&lt;/a&gt;Оптимизация прекодера и посткодера&lt;/h4&gt;\n&lt;p&gt;Основная задача AIR-LLM — минимизация среднеквадратичной ошибки (MSE) между выходным сигналом &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7By%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; и эталонным сигналом y. Для этого совместно оптимизируются прекодер Ppre и посткодер Ppost для всех калибровочных блоков. Исходная задача (OPT-Orig) формулируется как:&lt;/p&gt;\n&lt;p&gt;&lt;span class=\"yfm-latex\" data-content=\"P%5E%7B%5Cstar%7D_%7Bpre%7D%2C%20P%5E%7B%5Cstar%7D_%7Bpost%7D%20%3D%20%5Carg%20%5Cmin_%7BP_%7Bpre%7D%2C%20P_%7Bpost%7D%7D%20%5Cmathbb%7BE%7D_%7Bx%2C%20W%7D%20%5Cleft%5B%20%5Cfrac%7B1%7D%7BA%7D%20%5Csum_%7Ba%3D0%7D%5E%7BA-1%7D%20%5C%2F%20%5Chat%7By%7D_a%20-%20y_a%20%5C%2F%5E2%20%5Cright%5D%20%5Cquad%20(10)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оптимизация сводится к минимизации ошибки, зависящей только от характеристик канала, что позволяет избежать дорогостоящего онлайн-обучения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Прямое решение OPT-Orig невозможно из-за неизвестности весов W и входных данных x на периферийном устройстве. Однако, так как целевая функция билинейна относительно (W, x), она зависит только от статистик первого и второго порядков. Предполагая, что W и x имеют нулевое среднее, взаимно независимы и работают в режиме высокого отношения сигнал/шум (SNR), задача упрощается до OPT-Chan:&lt;/p&gt;\n&lt;p&gt;&lt;span class=\"yfm-latex\" data-content=\"P%5E%7B%5Cstar%7D_%7Bpre%7D%2C%20P%5E%7B%5Cstar%7D_%7Bpost%7D%20%3D%20%5Carg%20%5Cmin_%7BP_%7Bpre%7D%2C%20P_%7Bpost%7D%7D%20%5Csum_%7Bk%3D0%7D%5E%7BN_%7Bfft%7D-1%7D%20%5Csum_%7Bc%3D0%7D%5E%7BC-1%7D%20%5C%2F%20P_%7Bpre%7D%5Bc%2C%20k%5D%20%5Ccdot%20P_%7Bpost%7D%5Bc%2C%20%3A%2C%20%3A%5D%20%5Ccdot%20H%5B%3A%2C%20%3A%2C%20k%5D%5ET%20-%20I_A%20%5C%2F%5E2%20%5Cquad%20(12)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;&lt;/p&gt;\n&lt;p&gt;где I_A — единичная матрица A × A. Суть в том, чтобы пары прекодер-посткодер обнуляли влияние канала H для каждой поднесущей.&lt;/p&gt;\n&lt;h4 id=\"shag-1-approksimaciya-dlya-inicializacii\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#shag-1-approksimaciya-dlya-inicializacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шаг 1: аппроксимация для инициализации&lt;/span&gt;&lt;/a&gt;Шаг 1: аппроксимация для инициализации&lt;/h4&gt;\n&lt;p&gt;Для решения OPT-Chan используется двухэтапный подход. Сначала применяется аппроксимация (OPT-Approx), где отбрасывается весовое влияние амплитуд канала:&lt;/p&gt;\n&lt;p&gt;&lt;span class=\"yfm-latex\" data-content=\"P%5E%7B(0)%7D_%7Bpre%7D%2C%20%20ilde%7BP%7D%5E%7B(0)%7D_%7Bpost%7D%20%3D%20%5Carg%20%5Cmin_%7B%20ilde%7BP%7D_%7Bpost%7D%2C%20%20ilde%7BP%7D_%7Bpre%7D%7D%20%5C%2F%20%20ilde%7BP%7D_%7Bpost%7D%20%5Ccdot%20P_%7Bpre%7D%20-%20%20ilde%7BH%7D%5E%7B-1%7D%20%5C%2F%5E2%20%5Cquad%20(13)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SVD (сингулярное разложение) — метод разложения матрицы на составляющие, позволяющий выделить наиболее значимые компоненты данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Здесь  ildePpost — это «сплющенный» посткодер размерности C × A². Согласно теореме Эккарта-Янга-Мирского, задача решается через SVD матрицы  ildeH⁻¹ с сохранением C наибольших сингулярных чисел.&lt;/p&gt;\n&lt;h4 id=\"shag-2-iteracionnoe-utochnenie-als\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#shag-2-iteracionnoe-utochnenie-als\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шаг 2: итерационное уточнение (ALS)&lt;/span&gt;&lt;/a&gt;Шаг 2: итерационное уточнение (ALS)&lt;/h4&gt;\n&lt;p&gt;Начиная с инициализации P⁽⁰⁾, выполняется метод попеременных наименьших квадратов (ALS): сначала фиксируется Ppost и оптимизируется Ppre (линейная задача для каждой поднесущей), затем фиксируется Ppre и оптимизируется Ppost (для каждой антенны). Метод сходится за несколько итераций.&lt;/p&gt;\n&lt;h4 id=\"analiz-effektivnosti-sistemy\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#analiz-effektivnosti-sistemy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ эффективности системы&lt;/span&gt;&lt;/a&gt;Анализ эффективности системы&lt;/h4&gt;\n&lt;p&gt;Эффективность AIR-LLM оценивается по времени использования канала (airtime) и энергопотреблению. Время использования обратно пропорционально числу антенн A и полосе пропускания B. Важно, что AIR-LLM не адаптирует сигналы под каждого пользователя, что делает его идеальным для широковещания: при передаче весов для U пользователей время на одного пользователя сокращается как 1/U.&lt;/p&gt;\n&lt;h4 id=\"energeticheskij-analiz\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#energeticheskij-analiz\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Энергетический анализ&lt;/span&gt;&lt;/a&gt;Энергетический анализ&lt;/h4&gt;\n&lt;p&gt;Энергоэффективность достигается за счет амортизации затрат на аппаратные компоненты. Смеситель RF и фильтр нижних частот (LPF) сжимают входную размерность до одной поднесущей с коэффициентом N, что снижает нагрузку на АЦП. Прекодирование и IFFT выполняются один раз на весь GEMV, а их стоимость распределяется по размеру выхода M.&lt;/p&gt;\n&lt;h4 id=\"kompromiss-mezhdu-tochnostyu-vychislenij,-efirnym-vremenem-i-energiej\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#kompromiss-mezhdu-tochnostyu-vychislenij,-efirnym-vremenem-i-energiej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Компромисс между точностью вычислений, эфирным временем и энергией&lt;/span&gt;&lt;/a&gt;Компромисс между точностью вычислений, эфирным временем и энергией&lt;/h4&gt;\n&lt;p&gt;Количество калибровочных блоков C является ключевым параметром, связывающим точность, время передачи и энергопотребление. OPT-Chan выполняет калибровку канала с использованием аппроксимации ранга C: увеличение C снижает остаточную ошибку, повышая точность, однако требует большего числа антенн A. С точки зрения энергии, каждый параметр потребления растет линейно относительно C. Таким образом, увеличение A сокращает эфирное время, но повышает энергозатраты, поэтому C должно быть минимально возможным для достижения целевой точности.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Выбор C — это баланс: минимальное значение C обеспечивает необходимую точность при ограничении энергопотребления.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"realizaciya\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#realizaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Реализация&lt;/span&gt;&lt;/a&gt;Реализация&lt;/h4&gt;\n&lt;p&gt;AIR-LLM тестируется в условиях городских сценариев с помощью симулятора трассировки лучей и на основе искажений реального радиочастотного (РЧ) смесителя.&lt;/p&gt;\n&lt;h4 id=\"modelirovanie-kanala-cherez-sionna\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#modelirovanie-kanala-cherez-sionna\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Моделирование канала через Sionna&lt;/span&gt;&lt;/a&gt;Моделирование канала через Sionna&lt;/h4&gt;\n&lt;p&gt;Канал связи между центральной радиостанцией и периферийными устройствами моделируется в среде NVIDIA Sionna (v2.0.1). Симулятор выпускает 10⁷ лучей в цифровой двойник городской среды, учитывая отражения, преломления и дифракцию. Это позволяет получить реалистичный канал H для передачи весовых коэффициентов W. Как показано на Рис. 4(a) и (b), рассматриваются два сценария: площадь Шарля де Голля в Париже (открытое пространство, наличие прямой видимости LOS) и центр Мюнхена (плотная застройка, многолучевое распространение, частое отсутствие LOS).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-f4.jpg\" alt=\"Рис. 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 4&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/ray-tracing.html\"&gt;Трассировка лучей&lt;/a&gt; (ray-tracing) — метод моделирования распространения радиоволн, имитирующий физическое поведение сигналов при столкновении с препятствиями.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"konfiguraciya-centralnoj-radiostancii\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#konfiguraciya-centralnoj-radiostancii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Конфигурация центральной радиостанции&lt;/span&gt;&lt;/a&gt;Конфигурация центральной радиостанции&lt;/h4&gt;\n&lt;p&gt;Станция расположена на высоте 10 м. Она использует A антенн (A=4 по умолчанию) с ортогональной поляризацией и шагом 1,7 м. Весовой сигнал передается в диапазоне CBRS (3,5 ГГц) с полосой 100 МГц. Мощность на антенну составляет 50 дБм, радиус покрытия — 100 м.&lt;/p&gt;\n&lt;h4 id=\"konfiguraciya-periferijnyh-ustrojstv\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#konfiguraciya-periferijnyh-ustrojstv\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Конфигурация периферийных устройств&lt;/span&gt;&lt;/a&gt;Конфигурация периферийных устройств&lt;/h4&gt;\n&lt;p&gt;В зоне покрытия случайным образом размещаются 100 устройств на высоте 1,5 м. Каждое устройство оснащено антенной решеткой с шагом 4,3 см (полволны) и C=8 калибровочными блоками. Коэффициент шума устройств принят за 4 дБ (шумовой порог -90 дБм при 100 МГц). Потери в канале (PL) оцениваются как &lt;span class=\"yfm-latex\" data-content=\"-10%20%5Clog_%7B10%7D(E%5B%2FH%2F%5E2%5D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;.&lt;/p&gt;\n&lt;h4 id=\"profilirovanie-rch-smesitelya\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#profilirovanie-rch-smesitelya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Профилирование РЧ-смесителя&lt;/span&gt;&lt;/a&gt;Профилирование РЧ-смесителя&lt;/h4&gt;\n&lt;p&gt;Искажения смесителя ZEM-4300+ измерялись на проводном стенде с использованием радиостанций USRP X310. Поскольку соединение проводное, шум пренебрежимо мал, и ошибки вычислений обусловлены только искажениями смесителя. Для каждой мощности на РЧ-порту подбиралась мощность на порту гетеродина (LO) для достижения наилучшего эффективного числа бит (ENOB).&lt;/p&gt;\n&lt;h4 id=\"benchmarking-gemv\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#benchmarking-gemv\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бенчмаркинг GEMV&lt;/span&gt;&lt;/a&gt;Бенчмаркинг GEMV&lt;/h4&gt;\n&lt;p&gt;Точность вычислений измеряется через ENOB. На Рис. 5(a) показана зависимость ENOB от потерь в канале (PL) для 100 пользователей. В Париже (медианные потери 84,0 дБ) медианный ENOB составил 3,97 бит (диапазон 1,58–5,69 бит). В Мюнхене (медианные потери 91,4 дБ) — 2,91 бит (диапазон 0,53–5,33 бит). Точность зависит не только от PL, но и от распределения мощности по компонентам многолучевости.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ENOB не является константой для заданного PL: при одинаковых потерях 89–91 дБ разброс точности составляет от 2,01 до 5,33 бит.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;На Рис. 5(b) показано влияние мощности передачи (от 30 до 70 дБм). Точность растет примерно на 1 бит на каждые 10 дБ мощности, а затем выходит на плато. Например, в Мюнхене точность растет с 1,20 бит (30 дБм) до 3,55 бит (60 дБм), достигая лишь 3,87 бит при 70 дБм из-за ограничений калибровки и неидеальности смесителя.&lt;/p&gt;\n&lt;h4 id=\"balans-tochnosti-vychislenij,-energopotrebleniya-i-efirnogo-vremeni\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#balans-tochnosti-vychislenij,-energopotrebleniya-i-efirnogo-vremeni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Баланс точности вычислений, энергопотребления и эфирного времени&lt;/span&gt;&lt;/a&gt;Баланс точности вычислений, энергопотребления и эфирного времени&lt;/h4&gt;\n&lt;p&gt;В отличие от WISE, система AIR-LLM при A=C=1 использует MIMO для сокращения эфирного времени операции GEMV, которое обратно пропорционально числу антенн 1/A. Однако для компенсации канала требуется больше калибровочных единиц C, что увеличивает энергозатраты пропорционально C. На Рис. 6(a) показан этот компромисс для GEMV с M=2A и N=4,096 в Париже. При увеличении A от 2 до 32 выигрыш по времени достигает 32-кратного значения. При A=4 точность (ENOB) растет с 0,55 бит (C=1) до 3,97 бит (C=8) и 5,07 бит (C=10); дальнейшее увеличение C дает лишь 0,43 бит прироста при росте энергозатрат в 1,5 раза. Рис. 6(b) демонстрирует минимальную энергию для достижения заданного ENOB относительно WISE: для 3 бит затраты составляют от 1,02× до 9,60×, а для 4 бит — от 1,54× до 13,59× при росте A от 2 до 32. Это означает, что при увеличении A для сохранения точности требуется больше энергии.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-f6.jpg\" alt=\"Рис. 6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 6&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Увеличение числа антенн A сокращает время передачи, но требует экспоненциального роста энергии для компенсации канала через параметр C.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"masshtabirovanie-razmera-gemv\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#masshtabirovanie-razmera-gemv\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Масштабирование размера GEMV&lt;/span&gt;&lt;/a&gt;Масштабирование размера GEMV&lt;/h4&gt;\n&lt;p&gt;На Рис. 7(a) показано масштабирование GEMV от N=M=2⁰ до 2¹⁴. До N=M=2³ точность стабильна (5,58–5,75 бит в Париже), далее при многораундовых вычислениях она падает до 3,99–4,51 бит. Рис. 7(b) сравнивает энергию на &lt;a href=\"concepts/flop.html\"&gt;FLOP&lt;/a&gt; с FP16. В то время как для FP16 и методов WoQ (W4A16/W3A16) энергоэффективность константна, у AIR-LLM она растет с масштабом задачи. На малых GEMV ограничением выступает цифровая обработка, а на больших — ЦАП, чья стоимость на FLOP постоянна. Энергозатраты АЦП, доминирующие в аналоговых системах, здесь почти нулевые из-за коэффициента понижающей дискретизации N.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;FLOP — операция с плавающей запятой; WoQ (Weights-only Quantization) — квантование только весов модели.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"benchmarking-na-llm\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#benchmarking-na-llm\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бенчмаркинг на LLM&lt;/span&gt;&lt;/a&gt;Бенчмаркинг на LLM&lt;/h4&gt;\n&lt;p&gt;Мы протестировали работу полных LLM, где все GEMV весов и активаций выполняются аналоговым способом через AIR-LLM.&lt;/p&gt;\n&lt;h4 id=\"perpleksiya-ppl-na-wikitext-2\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#perpleksiya-ppl-na-wikitext-2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Перплексия (PPL) на WikiText-2&lt;/span&gt;&lt;/a&gt;Перплексия (PPL) на WikiText-2&lt;/h4&gt;\n&lt;p&gt;В Таблице 2 представлена PPL для 9 моделей (LLaMA-3.2, LLaMA-3.1, LLaMA-2, Mistral-7B, Gemma-4) при длине последовательности 2048. В Париже (точность ~4 бит) AIR-LLM превосходит лучшие методы WoQ на 7 из 9 моделей и лучшие аналоговые методы на 4 из 9, оставаясь в пределах 5,6% от них на остальных. В Мюнхене (точность ~3 бит) результаты аналогичны. Это подтверждает, что шумы и искажения AIR-LLM не препятствуют качественному выводу LLM.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 2.&lt;/strong&gt; WikiText-2 PPL для AIR-LLM на выбранных пользователях в Париже и Мюнхене в сравнении с FP16, WoQ и аналоговыми вычислительными базовыми линиями&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Точность&lt;/th&gt;\n&lt;th&gt;Метод&lt;/th&gt;\n&lt;th&gt;LLaMA-3 (3.2-1B)&lt;/th&gt;\n&lt;th&gt;LLaMA-3 (3.2-3B)&lt;/th&gt;\n&lt;th&gt;LLaMA-3 (3.1-8B)&lt;/th&gt;\n&lt;th&gt;LLaMA-3 (3.1-70B†)&lt;/th&gt;\n&lt;th&gt;LLaMA-2 (7B)&lt;/th&gt;\n&lt;th&gt;LLaMA-2 (13B)&lt;/th&gt;\n&lt;th&gt;Mistral (7B)&lt;/th&gt;\n&lt;th&gt;Gemma-4 (7B)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;E2B&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;FP16&lt;/td&gt;\n&lt;td&gt;9.77&lt;/td&gt;\n&lt;td&gt;7.82&lt;/td&gt;\n&lt;td&gt;6.24&lt;/td&gt;\n&lt;td&gt;2.81&lt;/td&gt;\n&lt;td&gt;5.47&lt;/td&gt;\n&lt;td&gt;4.88&lt;/td&gt;\n&lt;td&gt;5.25&lt;/td&gt;\n&lt;td&gt;8.24&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;E4B&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;RTN&lt;/td&gt;\n&lt;td&gt;11.71&lt;/td&gt;\n&lt;td&gt;8.49&lt;/td&gt;\n&lt;td&gt;6.83&lt;/td&gt;\n&lt;td&gt;3.35&lt;/td&gt;\n&lt;td&gt;5.72&lt;/td&gt;\n&lt;td&gt;4.98&lt;/td&gt;\n&lt;td&gt;5.42&lt;/td&gt;\n&lt;td&gt;10.60&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;GPTQ&lt;/td&gt;\n&lt;td&gt;10.63&lt;/td&gt;\n&lt;td&gt;8.78&lt;/td&gt;\n&lt;td&gt;6.65&lt;/td&gt;\n&lt;td&gt;3.37&lt;/td&gt;\n&lt;td&gt;5.62&lt;/td&gt;\n&lt;td&gt;4.99&lt;/td&gt;\n&lt;td&gt;5.38&lt;/td&gt;\n&lt;td&gt;8.95&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;AWQ&lt;/td&gt;\n&lt;td&gt;10.95&lt;/td&gt;\n&lt;td&gt;8.29&lt;/td&gt;\n&lt;td&gt;6.66&lt;/td&gt;\n&lt;td&gt;3.27&lt;/td&gt;\n&lt;td&gt;5.60&lt;/td&gt;\n&lt;td&gt;4.97&lt;/td&gt;\n&lt;td&gt;5.37&lt;/td&gt;\n&lt;td&gt;9.57&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;ENOB 4&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;AWGN&lt;/td&gt;\n&lt;td&gt;12.28&lt;/td&gt;\n&lt;td&gt;8.75&lt;/td&gt;\n&lt;td&gt;7.11&lt;/td&gt;\n&lt;td&gt;4.30&lt;/td&gt;\n&lt;td&gt;40.94&lt;/td&gt;\n&lt;td&gt;5.06&lt;/td&gt;\n&lt;td&gt;16.31&lt;/td&gt;\n&lt;td&gt;9.51&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;HyFlexPIM&lt;/td&gt;\n&lt;td&gt;10.45&lt;/td&gt;\n&lt;td&gt;8.11&lt;/td&gt;\n&lt;td&gt;6.48&lt;/td&gt;\n&lt;td&gt;3.04&lt;/td&gt;\n&lt;td&gt;5.56&lt;/td&gt;\n&lt;td&gt;4.93&lt;/td&gt;\n&lt;td&gt;5.32&lt;/td&gt;\n&lt;td&gt;8.82&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;AIR-LLM @ Paris&lt;/td&gt;\n&lt;td&gt;10.41&lt;/td&gt;\n&lt;td&gt;8.08&lt;/td&gt;\n&lt;td&gt;6.49&lt;/td&gt;\n&lt;td&gt;3.21&lt;/td&gt;\n&lt;td&gt;5.82&lt;/td&gt;\n&lt;td&gt;4.96&lt;/td&gt;\n&lt;td&gt;5.45&lt;/td&gt;\n&lt;td&gt;8.77&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;W3A16&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;RTN&lt;/td&gt;\n&lt;td&gt;34.82&lt;/td&gt;\n&lt;td&gt;13.25&lt;/td&gt;\n&lt;td&gt;10.86&lt;/td&gt;\n&lt;td&gt;5.24&lt;/td&gt;\n&lt;td&gt;6.66&lt;/td&gt;\n&lt;td&gt;5.52&lt;/td&gt;\n&lt;td&gt;6.15&lt;/td&gt;\n&lt;td&gt;264.35&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;GPTQ&lt;/td&gt;\n&lt;td&gt;16.46&lt;/td&gt;\n&lt;td&gt;15.21&lt;/td&gt;\n&lt;td&gt;8.24&lt;/td&gt;\n&lt;td&gt;5.33&lt;/td&gt;\n&lt;td&gt;6.42&lt;/td&gt;\n&lt;td&gt;5.44&lt;/td&gt;\n&lt;td&gt;5.89&lt;/td&gt;\n&lt;td&gt;11.79&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;AWQ&lt;/td&gt;\n&lt;td&gt;18.38&lt;/td&gt;\n&lt;td&gt;10.62&lt;/td&gt;\n&lt;td&gt;8.28&lt;/td&gt;\n&lt;td&gt;4.80&lt;/td&gt;\n&lt;td&gt;6.27&lt;/td&gt;\n&lt;td&gt;5.35&lt;/td&gt;\n&lt;td&gt;5.93&lt;/td&gt;\n&lt;td&gt;17.92&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;ENOB 3&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;AWGN&lt;/td&gt;\n&lt;td&gt;72.87&lt;/td&gt;\n&lt;td&gt;18.76&lt;/td&gt;\n&lt;td&gt;26.51&lt;/td&gt;\n&lt;td&gt;24.40&lt;/td&gt;\n&lt;td&gt;515.84&lt;/td&gt;\n&lt;td&gt;6.31&lt;/td&gt;\n&lt;td&gt;332.53&lt;/td&gt;\n&lt;td&gt;13.11&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;HyFlexPIM&lt;/td&gt;\n&lt;td&gt;13.45&lt;/td&gt;\n&lt;td&gt;9.35&lt;/td&gt;\n&lt;td&gt;7.25&lt;/td&gt;\n&lt;td&gt;3.90&lt;/td&gt;\n&lt;td&gt;5.92&lt;/td&gt;\n&lt;td&gt;5.14&lt;/td&gt;\n&lt;td&gt;5.59&lt;/td&gt;\n&lt;td&gt;11.55&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;AIR-LLM @ Munich&lt;/td&gt;\n&lt;td&gt;12.20&lt;/td&gt;\n&lt;td&gt;8.92&lt;/td&gt;\n&lt;td&gt;7.37&lt;/td&gt;\n&lt;td&gt;4.99&lt;/td&gt;\n&lt;td&gt;6.47&lt;/td&gt;\n&lt;td&gt;5.12&lt;/td&gt;\n&lt;td&gt;5.78&lt;/td&gt;\n&lt;td&gt;10.17&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;†: 3.1-70B&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оценка проводилась в условиях специфических каналов связи (Париж/Мюнхен) с заданными параметрами ENOB.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"energopotreblenie-na-token\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#energopotreblenie-na-token\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Энергопотребление на токен&lt;/span&gt;&lt;/a&gt;Энергопотребление на токен&lt;/h4&gt;\n&lt;p&gt;Рис. 8 иллюстрирует энергозатраты на токен. На модели LLaMA-3.1-8B система AIR-LLM потребляет в 157,7 раз меньше энергии, чем удаленный FP16, и в 40,4 раза меньше, чем удаленный W4A16. По сравнению с локальными FP16 и W4A16 выигрыш составляет 51,5× и 13,9× соответственно. Экономия достигается за счет исключения энергозатратных операций перемещения данных и эффективной работы АЦП.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-f8.jpg\" alt=\"Рисунок 8. Нормированная энергия на токен AIR-LLM в сравнении с четырьмя базовыми решениями для девяти моделей LLM.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 8. Нормированная энергия на токен AIR-LLM в сравнении с четырьмя базовыми решениями для девяти моделей LLM.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"efirnoe-vremya-na-token\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#efirnoe-vremya-na-token\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эфирное время на токен&lt;/span&gt;&lt;/a&gt;Эфирное время на токен&lt;/h4&gt;\n&lt;p&gt;На Рис. 9 представлено время использования беспроводного канала на один токен для AIR-LLM и двух удаленных базовых моделей на девяти LLM. Время нормализовано относительно удаленного FP16 на LLaMA-3.1-8B. Для LLaMA-3.1-8B AIR-LLM требует в 5,11 раза меньше времени, чем FP16, и в 1,28 раза меньше, чем W4A16. Эти коэффициенты остаются постоянными для всех девяти моделей, так как время передачи пропорционально количеству весов. В сценарии с одним пользователем близость к W4A16 обусловлена физическими ограничениями канала: время линейно масштабируется с полосой пропускания B и числом антенн A. Разница в SNR нивелируется при квантовании базовой модели до ширины весов, обеспечивающей схожую с AIR-LLM метрику PPL.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AIR-LLM демонстрирует стабильное преимущество по времени канала: в 5,11 раза быстрее FP16 и в 1,28 раза быстрее W4A16.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"perpleksiya-ppl-po-dline-posledovatelnosti\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#perpleksiya-ppl-po-dline-posledovatelnosti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Перплексия (PPL) по длине последовательности&lt;/span&gt;&lt;/a&gt;Перплексия (PPL) по длине последовательности&lt;/h4&gt;\n&lt;p&gt;В Таблице 3 показано изменение PPL при длине последовательности от 256 до 16 384 токенов. PPL для FP16 и AIR-LLM снижается по мере роста контекста. Разрыв между AIR-LLM и FP16 сокращается, стабилизируясь на уровне около 4,0% для Парижа и 17,3% для Мюнхена при длине свыше 2048 токенов. Это доказывает отсутствие накопления вычислительной ошибки AIR-LLM вдоль контекста. Энергопотребление и время на токен остаются неизменными, так как они зависят от потоковой передачи весов слоя, а не от количества токенов.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 3.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-tT3.jpg\" alt=\"Таблица 3\" /&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оценка проводилась на моделях LLaMA-3.1-8B; результаты могут варьироваться при использовании других архитектур.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"vliyanie-sistemnyh-faktorov\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#vliyanie-sistemnyh-faktorov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Влияние системных факторов&lt;/span&gt;&lt;/a&gt;Влияние системных факторов&lt;/h4&gt;\n&lt;p&gt;Мы проанализировали влияние мощности передачи, числа антенн (A) и калибровочных блоков (C). В Таблице 4 показано, что в Париже при 35 дБм PPL составляет 9,1% выше FP16, а при 60 дБм — 3,8%, что указывает на влияние несовершенства RF-смесителей. В Мюнхене точность ограничена тепловым шумом: PPL резко улучшается до 8,8% только при 60 дБм.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 4.&lt;/strong&gt; ThePPLofAIR-LLMinParisandMunichover different central radio broadcasting power.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-tT4.jpg\" alt=\"Таблица 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;В Таблице 5 представлено влияние A и C. При A=4 PPL стабилизируется при 8 блоках, при A=8 — при 32 блоках. На практике достаточно A²/2 калибровочных блоков для достижения приемлемой точности, что экономит около 50% энергии. В Таблице 6 приведены результаты для диапазонов 0,915 ГГц (ISM) и 28 ГГц (mmWave). В 0,915 ГГц результаты сопоставимы с 3,5 ГГц (разница в PPL до 0,42), тогда как в 28 ГГц из-за разреженности многолучевого распространения пользователь в Мюнхене не может получить корректные данные (PPL &amp;gt; 10²).&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 5.&lt;/strong&gt; The PPL of AIR-LLM in Paris and Munich at 𝐴= {4, 8} with a varying number of calibration units, 𝐶.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-tT5.jpg\" alt=\"Таблица 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 6.&lt;/strong&gt; ThePPLofAIR-LLMatISM(0.915 GHz)and mmWave (28 GHz) bands with different (𝐴,𝐶) combinations. Figure 10. The broadcasting of LLaMA-3.1-8B to the 20 users with WikiText-2 PPL labeled in Paris (a) and Munich (b).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-tT6.jpg\" alt=\"Таблица 6\" /&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PPL (Perplexity) — метрика качества языковой модели; чем ниже значение, тем лучше модель предсказывает следующий токен.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ppl-dlya-granichnyh-polzovatelej\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#ppl-dlya-granichnyh-polzovatelej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PPL для граничных пользователей&lt;/span&gt;&lt;/a&gt;PPL для граничных пользователей&lt;/h4&gt;\n&lt;p&gt;На Рис. 10 показано распределение пользователей в Париже (PL 70.0–99.9 дБ) и Мюнхене (68.6–105.0 дБ). Медианное значение PPL для AIR-LLM на модели LLaMA-3.1-8B в Париже составило 6.52 (против 6.65 у W4A16), а в Мюнхене — 7.23 (против 8.24 у W3A16). В 70–80% случаев AIR-LLM превосходит базовые методы. Исключением стал один пользователь в Париже с PPL 255.27: из-за малого числа многолучевых компонент матрица канала H оказалась почти вырожденной. Проблема решается переходом на меньшее число антенн A для улучшения обусловленности H.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-f10.jpg\" alt=\"Рис. 10\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 10&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AIR-LLM обеспечивает более низкий PPL, чем цифровые аналоги, даже в условиях сложных каналов связи.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"energopotreblenie\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#energopotreblenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Энергопотребление&lt;/span&gt;&lt;/a&gt;Энергопотребление&lt;/h4&gt;\n&lt;p&gt;Энергопотребление на токен (Рис. 11(b)) у AIR-LLM стабильно и не зависит от условий канала. В Париже AIR-LLM потребляет в 160.5×/41.1× меньше энергии, чем удаленные FP16/W4A16, и в 51.5×/13.9× меньше локальных решений. Аналогичные показатели наблюдаются в Мюнхене. В отличие от коммуникационных методов, зависящих от качества связи каждого пользователя, AIR-LLM сохраняет эффективность независимо от позиции абонента.&lt;/p&gt;\n&lt;h4 id=\"efirnoe-vremya\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#efirnoe-vremya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эфирное время&lt;/span&gt;&lt;/a&gt;Эфирное время&lt;/h4&gt;\n&lt;p&gt;Рис. 12 демонстрирует, что при обслуживании U пользователей время передачи (airtime) для AIR-LLM остается константой, так как веса транслируются широковещательно. В то время как обычные методы (unicast) линейно масштабируют затраты времени (U \times время одного пользователя), AIR-LLM требует в 104.1×/26.0× меньше эфирного времени, чем FP16/W4A16 при 20 пользователях.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-f12.jpg\" alt=\"Рис. 12\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 12&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Широковещательная передача (broadcast) позволяет передавать данные один раз для всех пользователей в зоне покрытия, исключая линейный рост нагрузки на сеть.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"svyazannye-raboty-uskoriteli-llm\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#svyazannye-raboty-uskoriteli-llm\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные работы: ускорители LLM&lt;/span&gt;&lt;/a&gt;Связанные работы: ускорители LLM&lt;/h4&gt;\n&lt;p&gt;Традиционные подходы к LLM делятся на два типа: сжатие весов (квантование) с оптимизацией вычислений и перенос вычислений ближе к памяти (KV-кэш). Все они предполагают, что веса уже хранятся на устройстве. AIR-LLM меняет парадигму: веса не хранятся локально, а вычисляются «на лету» в RF/аналоговом домене при приеме сигнала.&lt;/p&gt;\n&lt;h4 id=\"analogovye-vychisleniya-dlya-ml\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#analogovye-vychisleniya-dlya-ml\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Аналоговые вычисления для ML&lt;/span&gt;&lt;/a&gt;Аналоговые вычисления для ML&lt;/h4&gt;\n&lt;p&gt;Аналоговые системы (ReRAM, фотоника) выполняют операции через физические законы (законы Ома/Кирхгофа), избегая ограничений цифровой арифметики. AIR-LLM развивает эту идею, используя RF-смесители приемника для перемножения весовых сигналов с входными данными. Система использует A \times A MIMO-движок для подавления частотно-селективных помех.&lt;/p&gt;\n&lt;h4 id=\"razvertyvanie-llm-na-periferii\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#razvertyvanie-llm-na-periferii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Развертывание LLM на периферии&lt;/span&gt;&lt;/a&gt;Развертывание LLM на периферии&lt;/h4&gt;\n&lt;p&gt;Ограничением мобильных устройств является не только вычислительная мощность, но и память. Существующие методы (прунинг, потоковая передача) либо перегружают устройство, либо требуют передачи запросов на сервер, что неэффективно при массовом обслуживании. AIR-LLM дезагрегирует хранение весов, перенося их на центральную радиостанцию, и использует широковещательную передачу, при которой каждый клиент выполняет вычисления локально, распределяя стоимость доставки весов на всех пользователей.&lt;/p&gt;\n&lt;h3 id=\"zaklyuchenie\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#zaklyuchenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заключение&lt;/span&gt;&lt;/a&gt;Заключение&lt;/h3&gt;\n&lt;p&gt;&lt;strong&gt;Таблица S8.&lt;/strong&gt; Over six commonsense-reasoning benchmarks, the zero-shot accuracy (%) of LLaMA-3.1-8B by AIR-LLM on the selected users of Paris and Munich vs. the FP16, WoQ, and analog computing baselines.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-tTS8.jpg\" alt=\"Таблица S8\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица S9.&lt;/strong&gt; The WikiText-2 PPL of LLaMA-3.1-8B when the weight signal is repeated 1 to 16 times and averaged, with ∞as the distortion floor.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-tTS9.jpg\" alt=\"Таблица S9\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица S10.&lt;/strong&gt; Tab. 4 repeated at the ISM (0.915 GHz) and mmWave (28 GHz) bands, each read against its own regulatory ceiling.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-tTS10.jpg\" alt=\"Таблица S10\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 7.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-tT7.jpg\" alt=\"Таблица 7\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица S11.&lt;/strong&gt; Tab. 5 repeated at the ISM and mmWave bands, each at the transmit power where it saturates in Tab. A10.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-tTS11.jpg\" alt=\"Таблица S11\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"itogi-razrabotki-arhitektury-air-llm\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#itogi-razrabotki-arhitektury-air-llm\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Итоги разработки архитектуры AIR-LLM&lt;/span&gt;&lt;/a&gt;Итоги разработки архитектуры AIR-LLM&lt;/h4&gt;\n&lt;p&gt;В данной работе представлена архитектура AIR-LLM, предназначенная для инференса больших языковых моделей (LLM) на периферийных устройствах. Основная цель разработки — создание системы, свободной от ограничений памяти, масштабируемой для конечных пользователей и энергоэффективной. Ключевым техническим решением стало использование пространственного мультиплексирования MIMO, которое позволяет передавать несколько потоков весов модели одновременно, тем самым радикально сокращая время эфира (airtime).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Архитектура AIR-LLM за счет MIMO-мультиплексирования и оптимизации прекодера-посткодера снижает энергопотребление и время передачи на порядки при минимальной потере точности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для обеспечения эффективной работы в беспроводном канале была разработана пара «прекодер–посткодер», которая автоматически калибрует канал связи на стороне периферийного устройства. Оценка эффективности проводилась на основе моделирования каналов с использованием трассировки лучей в среде NVIDIA Sionna, а также путем профилирования реального радиочастотного (РЧ) смесителя.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Трассировка лучей (ray-tracing) — это метод моделирования распространения радиоволн, который учитывает отражения и препятствия, обеспечивая высокую точность симуляции реальных условий связи.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Результаты показывают, что AIR-LLM демонстрирует лишь незначительное отклонение в показателе PPL (перплексии) по сравнению с базовой моделью FP16. При этом энергозатраты на один токен и время передачи данных сокращаются на порядки. Данная архитектура закладывает фундамент для нового поколения интеллектуальных периферийных систем.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оценка производительности основана на симуляциях NVIDIA Sionna и профилировании отдельных РЧ-компонентов, что требует дальнейшей верификации на комплексных аппаратных прототипах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-fS1.jpg\" alt=\"Рисунок A1. Что дают два шага OPT-Chan для выбранных пользователей при 𝐴 = 4 и 𝐶 = 8: ˆy относительно y на четырех этапа\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок A1. Что дают два шага OPT-Chan для выбранных пользователей при 𝐴 = 4 и 𝐶 = 8: ˆy относительно y на четырех этапах решения (a, b), а также функция потерь (17) и ее ENOB за каждую итерацию ALS (c, d).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-fS4.jpg\" alt=\"Рис. S4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S4&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-fS6.jpg\" alt=\"Рисунок A6. 20 пользователей из Рис. 10 в Париже (a) и Мюнхене (b), каждый из которых помечен своими значениями PL, GEMV\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок A6. 20 пользователей из Рис. 10 в Париже (a) и Мюнхене (b), каждый из которых помечен своими значениями PL, GEMV ENOB и PPL на WikiText-2.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Дефицит памяти&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;и энергии на&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;edge-&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;устройствах&lt;/text&gt;&lt;path strok
