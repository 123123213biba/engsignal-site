        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"247\" cy=\"83\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"693\" cy=\"245\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · PRINTING_3D   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Lazer o'rniga mikroto'lqin:&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;metall va keramika uchun&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;hajmli 3D bosib chiqarish&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd-f1.jpg\" alt=\"1-rasm: Mavjud va taklif etilayotgan AM tizimlarining misollari.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: Mavjud va taklif etilayotgan AM tizimlarining misollari.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm: Mavjud va taklif etilayotgan AM tizimlarining misollari. a) Metall kukunlari uchun lazerli PBF (chang qatlami sintezi) grafikasi (39). b) Fotosensitiv qatronlar va optik chastotalardan foydalanadigan VAM (hajmiy qo‘shimcha ishlab chiqarish) tizimining sxemasi. DLP proyektori vaqtga bog‘liq tasvirlarni bitta o‘q bo‘ylab yaratish uchun paraksial manbalardan o‘zgaruvchan difraksiya va interferensiyadan foydalanadi, aylanuvchi platforma esa ikki o‘lchovli tasvir tekisligini uch o‘lchovli shakllarga kengaytirish imkonini beradi. Rasm “Volumetric additive manufacturing via tomographic reconstruction” (30) maqolasidan. AAAS ruxsati bilan moslashtirilgan. c) Mukherjee va boshqalar (34) tomonidan taklif etilgan mikroto‘lqinli VAM tizimi, b) bandidagi optik tizimga ekvivalent. Antennalar soni yetarli bo‘lganda, antenna massivi elektr maydoni intensivligini to‘liq nazorat qiladi va aylanuvchi platformasiz VAMga erishish imkonini beradi. Rasm “Towards microwave volumetric additive manufacturing: Generation of a computational multi-physics model for localized curing” (34) maqolasidan. Elsevier ruxsati bilan moslashtirilgan. d) Taklif etilgan mikroto‘lqinli VAM tizimining grafikasi. Dielektrik devorlar (yashil) bilan ushlab turilgan kukun hajmini (ko‘k) o‘z ichiga olgan to‘lqin uzatgich (to‘q sariq) tizimga mikroto‘lqinli energiya kiritadi. Qurilmaning kirish ko‘ndalang modalariga bog‘liq bo‘lgan tabiiy elektromagnit modalari maydon intensivligi eng yuqori bo‘lgan kukun hududlarini tanlab eritadi. e) Arxitekturali 3D panjara katakchalarini tanlash. Ushbu ish 1 mm atrofidagi katakchalarga ega panjaralarga qaratilgan. Rasm “Architected cellular materials: A review on their mechanical properties towards fatigue-tolerant design and fabrication” (40) maqolasidan. Elsevier ruxsati bilan moslashtirilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;An'anaviy 3D bosib chiqarish qatlamma-qatlam sintez tezligi va materiallar turi bilan cheklangan. Tadqiqotchilar keramika va metallar bilan ishlash imkonini beruvchi mikroto'lqinli hajmli bosib chiqarish (VAM) usulini taklif qilishdi. Chekli elementlar modellashtirishi orqali kukun qatlami ichida termal panjaralar hosil qiluvchi qurilmalar loyihalashtirildi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Keramika va metallarni chop etish uchun 8–40 GGs mikroto'lqinli nurlanish.&lt;/li&gt;\n&lt;li&gt;100 kVt quvvatda ~1 mm o'lchamli termal panjaralarni shakllantirish.&lt;/li&gt;\n&lt;li&gt;Termal maydonlarni optimallashtirish uchun chekli elementlar modellashtirishi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Ishda COMSOL Multiphysics muhitida chekli elementlar tahlili (FEM) yordamida uch turdagi qurilmalar: chiziqli rezonator, kesishgan interferometr va chegaraviy isitgich modellashtirildi. Kukunlar bilan ishlashdagi hisoblash murakkabligini yengish uchun samarali muhit yaqinlashuvi qo'llanildi, bunda zarracha o'lchami to'lqin uzunligidan (8–40 GGs diapazoni) ancha kichik bo'lsa, material bir jinsli hajm sifatida qaraladi.&lt;/p&gt;\n&lt;p&gt;Natijalar shuni ko'rsatadiki, chastota va quvvatni (taxminan 100 kVt) aniq boshqarish orqali 1 mm atrofida katak o'lchamiga ega termal tugunlarni hosil qilish mumkin. Rezonatorlar va interferometrlar keramika va kompozit kukunlarda 3D panjaralarni sinterlashni ta'minlaydi, chegaraviy isitgichlar esa sof metallardan ichi bo'sh qobiqlarni chop etish imkonini beradi. Mikroto'lqinli nurlanishdan foydalanish shaffof fotopolimer qatronlarga bo'lgan ehtiyojni yo'qotadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot nazariy xarakterga ega; Pashen buzilishi effektlari va qurilmalarni ishlab chiqarishdagi real nuqsonlar hisobga olinmagan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Hajmiy qoʻshimcha ishlab chiqarish (VAM) — bu anʼanaviy 3D-bosib chiqarishga nisbatan ishlab chiqarish vaqtini qisqartiradigan va murakkab geometrik shakllarni yaratish imkonini beruvchi istiqbolli texnologiya. Hozirgi VAM tizimlari faqat fotopolimerlanuvchi smolalar bilan cheklangan, bu esa ularning sanoatdagi qoʻllanilishini cheklaydi. Ushbu ishda keramika, metall yoki kompozit kukunli xomashyo bilan mos keluvchi mikrotoʻlqinli VAM tizimlarining chekli elementlar usuli (FEM) yordamida modellashtirilgan natijalari taqdim etilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Chekli elementlar usuli (FEM) — bu murakkab muhandislik obyektlarini kichik elementlarga boʻlib, ulardagi harorat va kuchlanish taqsimotini tahlil qilish uchun qoʻllanadigan raqamli usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tadqiqot uchta qurilma turini qamrab oladi: chiziqli rezonator, kesishgan interferometr va chegaraviy isitgich. Ularning har biri bir yoki bir nechta turdagi kukunli materiallarni qayta ishlash uchun potentsial imkoniyatlarga ega. Modellashtirish shuni koʻrsatdiki, kirish chastotasi, quvvat va toʻlqin uzatgichning koʻndalang modlarini aniq boshqarish orqali materialning maʼlum hududlarini tanlab qizdiradigan issiqlik panjaralarini yaratish mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kirish quvvati 100 kVt tartibida boʻlganda, oʻlchami taxminan 1 mm boʻlgan issiqlik panjaralarini shakllantirish mumkinligi aniqlandi, bu optik usullar uchun mos boʻlmagan materiallarni qoʻshimcha ishlab chiqarishga yoʻl ochadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Natijalar faqat kompyuter modellashtirish asosida olingan; taklif etilgan tizimlarning haqiqiy qurilmalarda eksperimental sinovi oʻtkazilmagan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;h4 id=\"zamonaviy-qoshimcha-ishlab-chiqarish-usullari\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#zamonaviy-qoshimcha-ishlab-chiqarish-usullari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Zamonaviy qoʻshimcha ishlab chiqarish usullari&lt;/span&gt;&lt;/a&gt;Zamonaviy qoʻshimcha ishlab chiqarish usullari&lt;/h4&gt;\n&lt;p&gt;Qoʻshimcha ishlab chiqarish (AM) murakkab geometriyali detallarni yaratishda xarajatlar va chiqindilarni kamaytirish imkonini beradi. Stereolitografiya (SLA) va raqamli yorugʻlik proyeksiyasi (DLP) kabi anʼanaviy texnologiyalar qatron qatlamiga 2D tasvirlarni proyeksiyalash orqali qatlamma-qatlam quriladi. Bu usullar yorugʻlik tushadigan kichik hajm va qatlamlarning mexanik harakati tufayli past tezlik bilan cheklangan. Metallar uchun kukun qatlamini eritish (PBF) 0,1 l/soat, bogʻlovchi moddani purkash (binder jetting) 1000 l/soatgacha va yoʻnaltirilgan energiya choʻktirish (DED) 0,5 l/soat tezlikda ishlaydi. Biroq, purkash usuli sinterlashdagi qisqarish va deformatsiyalar bilan bogʻliq muammolarga ega, PBF va DED esa sekin ishlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Anʼanaviy AM usullari past tezlik (SLA, DLP, PBF, DED) yoki aniqlikdagi muammolar (binder jetting) bilan cheklangan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"hajmli-qoshimcha-ishlab-chiqarish-vam\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#hajmli-qoshimcha-ishlab-chiqarish-vam\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Hajmli qoʻshimcha ishlab chiqarish (VAM)&lt;/span&gt;&lt;/a&gt;Hajmli qoʻshimcha ishlab chiqarish (VAM)&lt;/h4&gt;\n&lt;p&gt;Muqobil usul — hajmli qoʻshimcha ishlab chiqarish (VAM) boʻlib, unda butun material hajmi 1b-rasmda koʻrsatilganidek, lazer nurlarining interferensiyasi yordamida bir vaqtning oʻzida qotiriladi. Bu tayanch tuzilmalarga boʻlgan ehtiyojni yoʻq qiladi. VAMning asosiy cheklovi shaffof fotosensitiv qatronlardan foydalanish zarurati; yorugʻlikning sochilishi toʻldirilgan kompozitlar bilan ishlashga toʻsqinlik qiladi. Mikrotoʻlqinli nurlanishdan foydalanish (1c-rasm) noaniq materiallar bilan ishlash imkonini beradi, chunki mikrotoʻlqinlar mikrozarralarda kamroq sochiladi. Ushbu ishda qatronlarsiz kukunli muhitlar uchun mikrotoʻlqinli VAM imkoniyatlari, omik va dipol isitish yordamida oʻrganiladi (1d-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VAM — qatlamma-qatlam qurishdan farqli oʻlaroq, detalning butun hajmini «bir zumda» chop etish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"arxitektura-materiallari\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#arxitektura-materiallari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Arxitektura materiallari&lt;/span&gt;&lt;/a&gt;Arxitektura materiallari&lt;/h4&gt;\n&lt;p&gt;Toʻlqin uzatgichlarning tabiiy elektromagnit rejimlari arxitektura materiallarini ishlab chiqarishda talab qilinadigan davriy panjaralarni yaratishga imkon beradi. Bular tugunlar va sterjenlardan tashkil topgan gʻovak tuzilmalar boʻlib, yuqori qattiqlik va mustahkamlik koʻrsatkichlariga ega. Ular aerokosmik sanoat va tibbiyotda qoʻllaniladi, chunki ular topologiyani optimallashtirish va buyum massasini kamaytirish imkonini beradi. Ishda keramika asosidagi materiallardan bunday panjaralarni va metall qobiqlarni tez va energiya tejamkor ishlab chiqarish uchun rezonatorlar va toʻlqin uzatgich tizimlarini integratsiya qilish taklif etiladi (1e-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot konsepsiyani asoslash (proof of concept) uchun raqamli tahlil hisoblanadi, natijalarni real ishlab chiqarish qurilmalariga oʻtkazish eksperimental tekshiruvni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"2-tadqiqot-doirasi\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#2-tadqiqot-doirasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. Tadqiqot doirasi&lt;/span&gt;&lt;/a&gt;2. Tadqiqot doirasi&lt;/h4&gt;\n&lt;p&gt;Ushbu ish kukunli xomashyolardan foydalangan holda mikroto‘lqinli qo‘shimcha ishlab chiqarish (VAM) konsepsiyasini tahlil qilish va uning texnik imkoniyatlarini baholashga bag‘ishlangan. Chekli elementlar usuli (FEM) yordamida mualliflar uchta qurilma arxitekturasini o‘rganadilar: 1) ichki maydonni kuchaytirish va turg‘un to‘lqinlardan foydalanadigan chiziqli resonator; 2) to‘lqin uzunligidan kichikroq o‘lchamlarga erishish uchun interferensiyani qo‘llaydigan kesishgan interferometr; 3) muayyan geometriyalar uchun metall kukunlari bilan moslikni kengaytirishga mo‘ljallangan chegaraviy isitgich.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot uchta qurilma arxitekturasini baholaydi, ularni energiya sarfini kamaytirish, naqshlar moslashuvchanligini oshirish va materiallar spektrini kengaytirish uchun optimallashtiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Chiziqli resonator maydonni kuchaytirish hisobiga quvvat talabini kamaytirishga qaratilgan, ammo bosib chiqarish geometriyasini rezonansli modalar to‘plami bilan cheklaydi. Kesishgan interferometr maydon kuchayishidan voz kechib, naqshlar erkinligini ta’minlaydi, bu esa yanada nozik detallarni olish uchun kirish modalari va fazalarining ixtiyoriy kombinatsiyalaridan foydalanish imkonini beradi. Chegaraviy isitgich hajmiy isitib bo‘lmaydigan metall kukunlari bilan ishlashga mo‘ljallangan bo‘lib, bu faqat ichi bo‘sh qobiq tuzilmalarini bosib chiqarish bilan cheklanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Chekli elementlar usuli (FEM) — bu murakkab fizik tizimlarni mayda elementlarga bo‘lish orqali maydonlar va harorat taqsimotini hisoblashning raqamli usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tadqiqot 8 GGs dan 40 GGs gacha bo‘lgan o‘ta yuqori chastotali (SHF) va millimetrli to‘lqinlar diapazoniga qaratilgan. Bu diapazon to‘lqin uzunligi millimetrli miqyosda bo‘lgani uchun tanlangan, bu mikron o‘lchamli kukunlarda sochilishni oldini oladi. Bu kukun xomashyosining elektromagnit va issiqlik xossalarini aniqlash uchun samarali muhit yaqinlashuvini qo‘llash imkonini beradi. Materiallar dielektrik keramika, metallar va ularning kompozitlari bilan cheklangan; yarimo‘tkazgichlar ularning haroratga bog‘liqligi va empirik ma’lumotlarning yetishmasligi sababli chiqarib tashlangan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Modellashtirish ideallashtirilgan sharoitlar bilan cheklangan: yarimo‘tkazgichlar ko‘rib chiqilmaydi va tizimlar xavfsizlikni ta’minlash uchun to‘liq o‘tkazuvchi qatlamlar ichida lokalizatsiya qilingan modalar bilan ishlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"chiziqli-rezonator\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#chiziqli-rezonator\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Chiziqli rezonator&lt;/span&gt;&lt;/a&gt;Chiziqli rezonator&lt;/h4&gt;\n&lt;p&gt;Chiziqli rezonator — bu toʻlqin oʻtkazgichga oʻrnatilgan Fabri-Pero tipidagi rezonator konstruktsiyasidir. Qurilma past va oʻrtacha yutilish darajasiga ega dielektrik kukunlarda elektr maydon intensivligining 3D panjaralarini hosil qiluvchi turgʻun toʻlqinlarni yaratadi. Bu toʻlqin oʻtkazgich chegaralari tomonidan induksiyalangan koʻndalang modalar va Fabri-Pero chegaralari tomonidan hosil qilingan boʻylama modalarning birikmasi orqali amalga oshiriladi. Bu usul keramika va kompozit kukunlardan asosiy panjarali tuzilmalarni toʻgʻridan-toʻgʻri chop etish imkonini beradi, bunda tuzilmalar rezonans moda toʻplamlarining superpozitsiyasi bilan cheklanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Chiziqli rezonator 3D-panjaralarni hosil qilish uchun toʻlqin oʻtkazgich va boʻylama modalardan foydalanadi hamda issiqlik deformatsiyasini oldini olish uchun 200 kVt dan 1 MVt gacha quvvat talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Qurilma sxemasi (Rasm 3a) taqsimlangan Bregg reflektorlari (DBR) va kukun solingan kamerani oʻz ichiga oladi. Har bir DBR koʻzgusi havo boʻshliqlari bilan ajratilgan yuqori tozalikdagi alyuminiy oksidi qatlamlaridan (ε_r = 9,7,  anδ = 10⁻⁴, 10 GGs markaziy toʻxtatish diapazoni) iborat. Kukun sifatida eritilgan kvars (fused silica) tanlangan, chunki uning dielektrik oʻtkazuvchanligining haroratga bogʻliqligi past (α ≈ 5 \times 10⁻⁵) va dielektrik yoʻqotishlar tangensi ( anδ ≈ 10⁻³) kvars va alyuminiy oksidiga nisbatan bir pogʻona yuqori. Xona haroratida nisbiy dielektrik oʻtkazuvchanlik 3,8 ga teng.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd-f3.jpg\" alt=\"3-rasm: Sof eritilgan kvars xomashyosi bilan chiziqli rezonator modelining sxemasi va modellashtirilishi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm: Sof eritilgan kvars xomashyosi bilan chiziqli rezonator modelining sxemasi va modellashtirilishi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-rasm: Sof eritilgan kvars xomashyosi bilan chiziqli rezonator modelining sxemasi va modellashtirilishi. a) Rezonator komponentlarini ko‘rsatuvchi tizim diagrammasi. 1-port faol kirish porti, 2-port esa qabul qiluvchi portdir. b) a) bandidagi RF va termal modellashtirish uchun yaratilgan tetraedral to‘r profili. Har bir hudud uchun to‘r o‘lchamidagi farq qatlamlar orasidagi ε′ qiymatlarining turlicha bo‘lishidan kelib chiqadi. c) Hisoblangan elektr maydoni profilining vaqtga bog‘liq holda y = 0 dagi ikki o‘lchovli kesimi. 250 kVt kirish quvvati ishlatilgan. d) c) bandidagi bir xil tekislikda elektromagnit isitishdan kelib chiqadigan harorat taqsimoti. Isitish har bir qadamda elektr maydoni profilini yangilash uchun jami 250 ms davomida 0,1 ms qadamlar bilan hisoblangan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Taqsimlangan Bregg reflektori (DBR) — bu maʼlum chastotadagi elektromagnit toʻlqinlarni samarali qaytaruvchi, har xil sindirish koʻrsatkichiga ega materiallarning almashinuvchi qatlamlaridan iborat tuzilma.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Kukun bilan toʻldirilgan boʻshliq uzunligi 97,3 mm. DBR koʻzgulariga maydonning kirib borishini hisobga olgan holda, rezonatorning samarali optik uzunligi 9,825 GGs rezonans chastotasida 6λ_g ≈ 99,9 mm ni tashkil qiladi, bu yerda λ_g — toʻlqin oʻtkazgichdagi toʻlqin uzunligi. Farq har bir koʻzguda 1,3 mm maydon kirib borishiga toʻgʻri keladi. Kvarsning dielektrik oʻtkazuvchanligining haroratga bogʻliqligi erish harorati T_m = 1986 K (1713 °C) gacha chiziqli ekstrapolyatsiya orqali modellashtiriladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Model kvarsning erish haroratigacha boʻlgan dielektrik xossalarining chiziqli ekstrapolyatsiyasiga asoslanadi, chunki eksperimental maʼlumotlar yetarli emas, bu esa natijalardagi noaniqlikning asosiy manbasidir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"chekli-elementlar-tahlili-parametrlari-va-harorat-dinamikasi\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#chekli-elementlar-tahlili-parametrlari-va-harorat-dinamikasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Chekli elementlar tahlili parametrlari va harorat dinamikasi&lt;/span&gt;&lt;/a&gt;Chekli elementlar tahlili parametrlari va harorat dinamikasi&lt;/h4&gt;\n&lt;p&gt;Sonli modellashtirish uchun notekis to‘r (Rasm 3b) yaratildi, uning o‘lchamlari alyuminiy oksidi qatlamlari va havo bo‘shliqlari o‘rtasida sezilarli darajada farq qiladi. Vaqt qadami 0,1 ms etib belgilandi. TE₁₀ asosiy rejimdagi mikroto‘lqinlar faol port orqali kiritildi va qabul qiluvchi portda qayd etildi. Modellashtirish natijalari (Rasm 3c, 3d) rezonatorning turg‘un to‘lqinlari tugunlarida 8,33 mm qadam bilan qizishni ko‘rsatadi, bu λ_g/2 ga teng (bu yerda λ_g — kukun bilan to‘ldirilgan to‘lqin uzatgichdagi to‘lqin uzunligi).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Uch davrli DBR tizimidan foydalanish 250 ms ichida 250 kVt kirish quvvati bilan Tmax = 1215 K (942 °C) haroratga erishish imkonini beradi, ko‘zgularsiz tizim esa atigi 393 K (120 °C) gacha qiziydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;DBR (Distributed Bragg Reflector) — bu elektromagnit to‘lqinlar uchun yuqori samarali ko‘zgu vazifasini bajaruvchi, turlicha sindirish ko‘rsatkichiga ega qatlamlardan iborat tizim.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"haroratli-filtrlash-va-sifat-koeffitsientini-optimallashtirish\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#haroratli-filtrlash-va-sifat-koeffitsientini-optimallashtirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Haroratli filtrlash va sifat koeffitsientini optimallashtirish&lt;/span&gt;&lt;/a&gt;Haroratli filtrlash va sifat koeffitsientini optimallashtirish&lt;/h4&gt;\n&lt;p&gt;Qurilma haroratli filtrlash effektini namoyon qiladi: muhitning dielektrik o‘tkazuvchanligi harorat bilan birga oshib boradi, bu fazani o‘zgartiradi va rezonatorni rezonans holatidan chiqaradi. Bu Tmax ni cheklaydi. 1% texnik uglerod qo‘shilishi (xona haroratida samarali &lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon'_%7Beff%7D%20%3D%203%2C75\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; va  anδeff = 0,02) bu xatti-harakatni tasdiqladi: Tmax = 1198 K (925 °C) ga erishildi, lekin quvvat sarfi 210 kVt gacha kamaydi (Rasm 4a).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd-f4.jpg\" alt=\"4-rasm: 250 ms davomida maksimal erishiladigan ichki harorat va 3D harorat panjarasi shakllanishini tekshirish.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm: 250 ms davomida maksimal erishiladigan ichki harorat va 3D harorat panjarasi shakllanishini tekshirish.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-rasm: 250 ms davomida maksimal erishiladigan ichki harorat va 3D harorat panjarasi shakllanishini tekshirish. a) Sof eritilgan kvarsni (tanδ = 0,001) 1% texnik uglerodli kompozit (tanδ = 0,02) bilan solishtirgan holda, samarali muhit yo‘qotish tangensining isitish egri chizig‘iga ta’siri. b) Rezonator Q-faktorining isitish egri chizig‘iga ta’siri; Q = 18, 75 va 890 bo‘lgan Q-faktorlar mos ravishda har bir ko‘zgu uchun nol, bir va uchta alyuminiy oksidi/havo davrlariga to‘g‘ri keladi. c) Bir qatlamli rezonator ichidagi 3D panjarani ko‘rsatadi va minimal bo‘ylama va ko‘ndalang masofalarni 2,1 mm va 5,1 mm deb belgilaydi. d) Hajmdagi maksimal harorat nuqtasini (Tmax = 443 K (170 °C)) kesib o‘tuvchi haroratning x-z kesimini tasvirlaydi, bo‘ylama panjarani batafsil ko‘rsatadi. e) Ushbu qurilmadan olingan arxitekturali materialning renderini tasvirlaydi. Qo‘llanilgan issiqlik almashinuvi bilan impulsli isitish ketma-ketliklaridan foydalangan holda, termal tugunlar ko‘ndalang moda profili bilan belgilangan tirgaklar bilan bir-birining ustiga chiqadigan profilgacha kengayadi va kubik (yoki to‘rtburchak) panjara tuzilishiga sinterlanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Fabri-Pero rezonatorlarining sifat koeffitsienti (Q) tahlili (Rasm 4b) shuni ko‘rsatadiki, Q = 75 maydonni kuchaytirish va rezonans chizig‘i kengligi o‘rtasidagi muvozanat uchun optimaldir. Yuqoriroq Q qiymatlarida hisoblangan haroratlar kremniy dioksidining erish nuqtasidan oshib ketadi, bu modelni fizik jihatdan noo‘rin qiladi. 36 GGs chastotada TE₃₂ rejimidan foydalanish uch o‘lchovli termal panjaralarni shakllantirishga imkon beradi (Rasm 4c, 4d), bu esa keramik tuzilmalarni deterministik chop etish yo‘llarini ochadi (Rasm 4e).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Modellashtirish chiziqli dielektrik o‘tkazuvchanlik modeliga asoslangan; materialning erish nuqtasidan yuqori haroratlarda natijalar eksperimental tekshiruvni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kondalang-interferometr\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#kondalang-interferometr\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Koʻndalang interferometr&lt;/span&gt;&lt;/a&gt;Koʻndalang interferometr&lt;/h4&gt;\n&lt;p&gt;Koʻndalang interferometr konstruksiyasi ikkita WR-90 toʻlqin oʻtkazgichining L-simon birikmasidan iborat. Ularning kesishish zonasida kremniy dioksidi kukuni ushlab turiladi va u alyuminiy oksididan yasalgan ikkita yupqa devor bilan chegaralanadi. Tizim ikkita perpendikulyar kirishdan kelayotgan toʻlqinlarning interferensiyasi hisobiga uch oʻlchamli panjaralarni hosil qiladi, bu toʻrtta manbali antenna panjarasiga oʻxshaydi. Chiziqli rezonatordan farqli oʻlaroq, ushbu sxema kirish parametrlarini ixtiyoriy belgilash imkonini beradi va maydon profilini boshqarishda moslashuvchanlikni taʼminlaydi, garchi u maydonni ichki kuchaytirish va modani barqarorlashtirish afzalligini yoʻqotsa ham. Tizim geometriyasi, shu jumladan maydon singulyarliklarining oldini olish uchun burchaklardagi yaxlitlashlar 5a va 5b-rasmlarda keltirilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Koʻndalang interferometr — ikkita turli manbadan kelayotgan toʻlqinlarning ustma-ust tushishi orqali elektromagnit maydonning interferensiya manzarasini shakllantiruvchi qurilma boʻlib, u kukun ichidagi energiya taqsimotini moslashuvchan boshqarish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Modellashtirish TE₃₂ modasi uchun 1 va 2-portlarga mikrotoʻlqinli nurlanish berilganda amalga oshirildi. Hisob-kitob 0,1 ms qadam bilan 100 ms davomiylikni qamrab oldi. Kukun zonasidagi elektromagnit maydon qizish jarayonida dielektrik oʻtkazuvchanlikning haroratga bogʻliqligi tufayli sezilarli darajada oʻzgardi, bu esa interferensiya manzarasining siljishiga olib keldi. 5c va 5d-rasmlarda jarayon oxiriga kelib elektr maydoni va harorat profillari oʻrtasidagi sezilarli tafovut koʻrsatilgan. Moda beqarorligiga qaramay, 1,86 mm qadamli panjarani va har bir portda 100 kVt quvvatda Tmax = 1232 K (959 °C) maksimal haroratni hosil qilishga erishildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tizim qizish jarayonida maydon profilining dinamik oʻzgarishiga qaramay, 1,86 mm qadamli va Tmax = 1232 K boʻlgan barqaror va bashorat qilinadigan panjarani shakllantirishni taʼminlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Amaliy qiyinchilik shundaki, kirish parametrlari (chastota, faza) va yakuniy issiqlik maydoni oʻrtasidagi bogʻliqlik intuitiv emas. Chop etish jarayonida ushbu teskari masalani hal qilish uchun Gerchberg-Saxton algoritmi kabi usullardan foydalanish mumkin. Materialning ε_r(T) dielektrik oʻtkazuvchanligi oʻzgarishiga nisbatan tizim javobining stoxastikligini baholash uchun 0 dan 10⁻² K⁻¹ gacha boʻlgan proporsionallik koeffitsiyentlari α bilan simulyatsiyalar oʻtkazildi. TE₁₀ modasi uchun natijalar (6a-rasm) shuni koʻrsatadiki, α ning yuqori qiymatlarida maydon kuchli oʻzgaradi, biroq yakuniy harorat taqsimoti oʻxshash geometrik profilni saqlab qoladi. Maydon stoxastikligi issiqlik dogʻining biroz kengayishiga va Tmax ning pasayishiga olib keladi, bu real tajribalarda yuzaga kelishi mumkin boʻlgan chetlanishlarni koʻrsatadi, ammo bu modelni yaroqsiz qilmaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Modellashtirish shuni koʻrsatadiki, qizish jarayonida maydon stoxastikligi maksimal haroratni pasaytirishi mumkin, shuning uchun jarayonni aniq boshqarish uchun teskari masalani oldindan raqamli hal qilish talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tizimning asosiy afzalligi — interferensiyani boshqarish orqali ichki strukturani sozlash imkoniyati. Masalan, portlardagi chastotalarni skanerlash kubik panjaralarni yaratish imkonini beradi (6b va 6c-rasmlar). Bunday tuzilmalar keramika issiqlik almashinuvchilari, katalitik tashuvchilar va filtrlarda qoʻllanilishi mumkin, bu esa materialning mexanik va issiqlik xususiyatlarini nozik boshqarishni taʼminlaydi.&lt;/p&gt;\n&lt;h4 id=\"tashqi-chegaraviy-isitgich\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#tashqi-chegaraviy-isitgich\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tashqi chegaraviy isitgich&lt;/span&gt;&lt;/a&gt;Tashqi chegaraviy isitgich&lt;/h4&gt;\n&lt;p&gt;Oldingi usullar faqat dielektrik kukunlar bilan cheklangan edi. Sof metall kukunlari bilan ishlash uchun tashqi chegaraviy isitgich taklif etildi, bunda kukun to‘lqin o‘tkazgichning chegaraviy sharti vazifasini bajaradi va induksiyalangan girdobli toklar (eddy currents) hisobiga qiziydi. Bu usul metall qobiqlarni chop etish imkonini beradi, bu esa 3D bosib chiqarishdan ko‘ra quyish jarayoniga yaqinroqdir. Qurilma sxemasi 7a-rasmda ko‘rsatilgan: asbob kukunli vannaga joylashtiriladi, shunda dielektrik blokning barcha yuzlari metall bilan kontaktda bo‘ladi. Kirish quvvati metall plastinkadan qaytib, turg‘un to‘lqinni hosil qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Girdobli toklar — o‘zgaruvchan magnit maydon ta’sirida o‘tkazgichda hosil bo‘ladigan elektr toklaridir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Elektromagnit modelda metall kukuni misning impedans chegarasi, to‘lqin o‘tkazgichlar esa volframning impedans chegarasi sifatida modellashtirilgan. Volframning hajmiy issiqlik sig‘imi yuqoriligi sababli u misga nisbatan sekinroq qiziydi. Volframning erish harorati T_m = 3695 K (3422^°C) misnikidan (T_m = 1358 K, 1085^°C) ancha yuqori, bu esa to‘lqin o‘tkazgichning erib ketishini oldini oladi. Dielektrik blok yuqori tozalikdagi kvarsdan tayyorlangan ( anδ = 10⁻⁴, α = 10⁻⁴ K⁻¹). Model 1 MVt kirish quvvatida, TE₁₀ rejimida 1500 ms davomida 1 ms qadam bilan hisoblandi.&lt;/p&gt;\n&lt;h4 id=\"modellashtirish-natijalari\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#modellashtirish-natijalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Modellashtirish natijalari&lt;/span&gt;&lt;/a&gt;Modellashtirish natijalari&lt;/h4&gt;\n&lt;p&gt;Elektr maydonining taqsimlanishi (7c-rasm) isitish jarayonida yuqori barqarorlikni ko‘rsatadi, chunki terining chuqurligi (skin depth) deyarli o‘zgarmaydi. Bu ichki devorlar bo‘ylab barqaror isitish profilini ta’minlaydi (7d-rasm), bunda maksimal harorat Tmax = 789 K (516^°C) ga yetadi. Metallarning yuqori issiqlik o‘tkazuvchanligi issiqlik yo‘qotilishini oldini olish uchun juda yuqori kirish quvvatini talab qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Barqaror elektromagnit rejim 789 K (516^°C) gacha bir tekis qizishni ta’minlaydi, bu esa metall kukunini sinterlash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Model nazariy hisoblanadi; metallarning yuqori issiqlik o‘tkazuvchanligi amaliyotda juda katta quvvat talab qilishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Qisqa vaqt davomida isitilganda yupqa devorli to‘rtburchak panjara (7e-rasm), uzoq vaqt davomida esa yaxlit naycha hosil bo‘ladi. Devor qalinligi quvvat va vaqt bilan boshqariladi. Usul yupqa devorli korpuslar va to‘lqin o‘tkazgichlar ishlab chiqarish uchun samarali bo‘lishi mumkin.&lt;/p&gt;\n&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;h4 id=\"xulosa-va-istiqbollar\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#xulosa-va-istiqbollar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa va istiqbollar&lt;/span&gt;&lt;/a&gt;Xulosa va istiqbollar&lt;/h4&gt;\n&lt;p&gt;Ushbu ishda mikrotoʻlqinli hajmiy qoʻshimcha ishlab chiqarish (VAM) arxitekturasining uchta turi: chiziqli Fabri-Pero rezonatori, kesishuvchi interferometr va tashqi chegaraviy isitgich simulyatsiyalari taqdim etilgan. Har bir tizim optik VAM usullariga mos kelmaydigan xomashyolar bilan ishlash imkonini beradi. Chiziqli rezonator koʻndalang va boʻylama modalar oʻzaro taʼsiri orqali dielektrik kukunlarda deterministik termal panjaralarni hosil qiladi. Tizim haroratga asoslangan maydon filtrlanishi bilan cheklangan, bu isitish tezligini pasaytirsa-da, elektr maydonlarining geometrik oʻzgarishi natijasida panjara buzilishining oldini oladi. Kesishuvchi interferometr murakkab interferensiya naqshlarini hosil qiladi, ammo modal barqarorlikni pasaytiradi. Tashqi chegaraviy isitgich toʻlqin oʻtkazgich chegaralarida omik isitish orqali sof metall kukunlari bilan ishlashga imkon beradi, biroq geometriyani faqat ichi boʻsh qobiqlar bilan cheklaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ishlab chiqilgan tizimlar 200 kVt dan 1 MVt gacha boʻlgan mikrotoʻlqinli quvvat yordamida keramika, metall va kompozit materiallarni chop etish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Simulyatsiyalar zichlanish boshlanishigacha boʻlgan jarayonni qamrab oladi. Eritish jarayonida dielektrik oʻtkazuvchanlik va dielektrik yoʻqotishlar tangensi oʻzgaradi, bu esa hozirgi chiziqli modelda hisobga olinmagan, chunki yuqori haroratli maʼlumotlar yetarli emas. Zichlanish jarayonida ushbu parametrlarni oʻlchash kelajakdagi tajribalar uchun eng muhim material maʼlumotidir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Model faqat jarayonning boshlangʻich bosqichini qamrab oladi; yuqori haroratlarda material xossalarining taxminiy modellari miqdoriy bashoratlarda noaniqlik keltirib chiqaradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Eksperimental amalga oshirish yuqori quvvatlarni (200 kVt – 1 MVt) talab qiladi, bu Canon E3718 klistroni (uzunligi 3,5 m, massasi 1250 kg) parametrlari bilan taqqoslanadi. Quvvat talablarini yuqori yoʻqotish tangensiga ega kompozit kukunlar yordamida kamaytirish mumkin. Modellardagi taxminlarga qaramay, kesishuvchi interferometr uchun sezgirlik tahlili shuni koʻrsatdiki, termal panjara shakli α oʻtkazuvchanlik koeffitsiyentining 10⁻³–10⁻² diapazonidagi oʻzgarishlariga chidamli.&lt;/p&gt;\n&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"chekli-elementlar-usulida-raqamli-modellashtirish\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#chekli-elementlar-usulida-raqamli-modellashtirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Chekli elementlar usulida raqamli modellashtirish&lt;/span&gt;&lt;/a&gt;Chekli elementlar usulida raqamli modellashtirish&lt;/h4&gt;\n&lt;p&gt;Modellashtirish COMSOL Multiphysics muhitida RF va issiqlik uzatish modullari yordamida amalga oshiriladi. Elektromagnit jarayonlar va issiqlik dinamikasi oʻrtasidagi vaqt shkalalarining farqi tufayli kombinatsiyalangan chastotali-oʻtish usuli qoʻllanadi. Dastlab elektromagnit maydonning modal xossalari chastota sohasida baholanadi, ular keyinchalik vaqt sohasidagi issiqlik uzatish tahlili uchun issiqlik manbalari sifatida ishlatiladi. Hisoblash algoritmi, elektromagnit va issiqlik holatlarining har bir qadamdagi oʻzaro taʼsirini hisobga oluvchi iteratsion siklni talab qiladi va u Rasm 2a) da keltirilgan.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd-f2.jpg\" alt=\"2-rasm: a) Chastotali-o‘tish jarayonini modellashtirish oqim sxemasi. “Haroratga bog‘liq material xossalarini hisoblash”\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm: a) Chastotali-o‘tish jarayonini modellashtirish oqim sxemasi. “Haroratga bog‘liq material xossalarini hisoblash”dan “Yakuniy vaqt qadami”gacha bo‘lgan iterativ sikl foydalanuvchi initsializatsiyasisiz bitta COMSOL modellashtirishi ichida bajarilishi…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-rasm: a) Chastotali-o‘tish jarayonini modellashtirish oqim sxemasi. “Haroratga bog‘liq material xossalarini hisoblash”dan “Yakuniy vaqt qadami”gacha bo‘lgan iterativ sikl foydalanuvchi initsializatsiyasisiz bitta COMSOL modellashtirishi ichida bajarilishi uchun avtomatlashtirilgan. b) Xona haroratida 10 GGs chastotalarda samarali dielektrik o‘tkazuvchanlikka qarshi yo‘qotish tangensi material xossalari jadvali. Materiallar keramika/shisha, polimerlar va kompozitlarga guruhlangan. Keramika (alyuminiy oksidi (59, 60), kvars (61), eritilgan kvars (62, 59), borosilikat shisha (62, 63) va magniy oksidi (MgO) (64)) va polimerlar (politetrafloroetilen (PTFE) (62, 61), poliimid (65), suyuq kristalli polimerlar (LCP) (66) va FR4 (67)) uchun ma’lumotlar eksperimental ma’lumotlardan olingan. E’tiborli jihati, MgO ma’lumotlari 80 K (−193 °C) da olinganligi sababli chetlanish hisoblanadi. Kompozitlar eritilgan kvars va texnik uglerod (CB) aralashmasi uchun Bruggeman samarali muhit yaqinlashuvi yordamida hisoblangan, bunda berilgan foiz texnik uglerodning hajmiy ulushini ifodalaydi. Metallar/o‘tkazgichlar hisobga olinmagan, chunki tegishli xossalar juda yuqori (/εr/, tanδ ≫ 1) va bu materiallarni dielektrik o‘tkazuvchanlik emas, balki o‘tkazuvchanlik orqali ifodalash maqsadga muvofiqdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Samarali muhit yaqinlashuvi usuli kukunlarning murakkab geterogen tuzilishini, agar zarrachalar oʻlchami mikrotoʻlqin toʻlqin uzunligidan sezilarli darajada kichik boʻlsa, ekvivalent yaxlit muhit bilan almashtirish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Hisoblash samaradorligini oshirish uchun samarali muhit yaqinlashuvi qoʻllanadi. Kukunsimon materiallar donachalar darajasida bir jinsli boʻlmaganligi sababli, toʻgʻridan-toʻgʻri modellashtirish haddan tashqari koʻp hisoblash quvvatini talab qilgan boʻlardi. Bu usul kukunlarni yagona hajmli material sifatida koʻrib chiqish imkonini beradi. Bu ham bir jinsli kukunlarga, ham materiallar aralashmasiga tegishli boʻlib, xomashyo xossalarini loyihalash imkonini beradi (Rasm 2b). Material xossalari haroratga bogʻliq boʻlgani uchun, issiqlik manbai dinamik tarzda qayta hisoblab chiqiladi.&lt;/p&gt;\n&lt;p&gt;Barcha simulyatsiyalarda maksimal katak oʻlchami λ/10 boʻlgan erkin tetraedral toʻr va toʻlqin oʻtkazgich devorlarida ommaviy yoʻqotishlarni hisobga olish uchun impedans chegaraviy shartlari qoʻllanadi. Jismoniy toʻgʻrilikni taʼminlash uchun vaqt qadami shunday tanlanadiki, dielektrik oʻtkazuvchanlikning &lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon_r\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; oʻzgarishi bir qadamda 0,1% dan oshmaydi. Yaqinlashishni tekshirish (convergence testing) harorat profillarining toʻr va vaqt qadamiga bogʻliq emasligini tasdiqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Issiqlik diffuziyasi isitish vaqtini cheklaydi: panjara tuzilishini saqlab qolish uchun diffuziya uzunligi &lt;span class=\"yfm-latex\" data-content=\"%5Csqrt%7B4%5Ckappa%20t%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; tugunlar orasidagi masofadan sezilarli darajada kichik boʻlishi kerak.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Erigan kvars uchun harorat oʻtkazuvchanlik koeffitsiyenti κ ≈ 7 × 10⁻⁷  m²s⁻¹ boʻlganda, 250 ms ichida diffuziya uzunligi 0,84 mm ni tashkil qiladi, bu antinodlar orasidagi masofadan bir barobar kichikdir. Bu isitish vaqti va quvvatini cheklaydi: agar vaqt 10 barobar oshirilib, quvvat 10 barobar kamaytirilsa, panjara tuzilishi oʻrniga bir xil qizigan blok hosil boʻladi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd-f1.jpg\" alt=\"1-rasm: Mavjud va taklif etilayotgan AM tizimlarining misollari.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: Mavjud va taklif etilayotgan AM tizimlarining misollari.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm: Mavjud va taklif etilayotgan AM tizimlarining misollari. a) Metall kukunlari uchun lazerli PBF (chang qatlami sintezi) grafikasi (39). b) Fotosensitiv qatronlar va optik chastotalardan foydalanadigan VAM (hajmiy qo‘shimcha ishlab chiqarish) tizimining sxemasi. DLP proyektori vaqtga bog‘liq tasvirlarni bitta o‘q bo‘ylab yaratish uchun paraksial manbalardan o‘zgaruvchan difraksiya va interferensiyadan foydalanadi, aylanuvchi platforma esa ikki o‘lchovli tasvir tekisligini uch o‘lchovli shakllarga kengaytirish imkonini beradi. Rasm “Volumetric additive manufacturing via tomographic reconstruction” (30) maqolasidan. AAAS ruxsati bilan moslashtirilgan. c) Mukherjee va boshqalar (34) tomonidan taklif etilgan mikroto‘lqinli VAM tizimi, b) bandidagi optik tizimga ekvivalent. Antennalar soni yetarli bo‘lganda, antenna massivi elektr maydoni intensivligini to‘liq nazorat qiladi va aylanuvchi platformasiz VAMga erishish imkonini beradi. Rasm “Towards microwave volumetric additive manufacturing: Generation of a computational multi-physics model for localized curing” (34) maqolasidan. Elsevier ruxsati bilan moslashtirilgan. d) Taklif etilgan mikroto‘lqinli VAM tizimining grafikasi. Dielektrik devorlar (yashil) bilan ushlab turilgan kukun hajmini (ko‘k) o‘z ichiga olgan to‘lqin uzatgich (to‘q sariq) tizimga mikroto‘lqinli energiya kiritadi. Qurilmaning kirish ko‘ndalang modalariga bog‘liq bo‘lgan tabiiy elektromagnit modalari maydon intensivligi eng yuqori bo‘lgan kukun hududlarini tanlab eritadi. e) Arxitekturali 3D panjara katakchalarini tanlash. Ushbu ish 1 mm atrofidagi katakchalarga ega panjaralarga qaratilgan. Rasm “Architected cellular materials: A review on their mechanical properties towards fatigue-tolerant design and fabrication” (40) maqolasidan. Elsevier ruxsati bilan moslashtirilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd-f5.jpg\" alt=\"5-rasm: TE32 kirish modasi uchun o‘zaro interferometr modelining sxemasi va modellashtirilishi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm: TE32 kirish modasi uchun o‘zaro interferometr modelining sxemasi va modellashtirilishi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-rasm: TE32 kirish modasi uchun o‘zaro interferometr modelining sxemasi va modellashtirilishi. a) Tizim diagrammasi, ichki qismda kirish modasi ko‘rsatilgan. a va b o‘lchamlari WR-90 (a = 0,9 dyuym × b = 0,4 dyuym) to‘lqin uzatgich kirishiga mos keladi. b) a) bandidagi sxemaning ko‘ndalang kesim detallari. Dielektrik hudud — yutuvchi kukun, ingichka sariq devorlar alyuminiy oksidini ifodalaydi. 1-port va 2-port faol kirish portlaridir. c) 100 ms da hisoblangan elektr maydoni profilining y = 0 dagi ikki o‘lchovli kesimi. d) c) bandidagi bir xil tekislikda elektromagnit isitishdan kelib chiqadigan harorat taqsimoti. Isitish har bir qadamda elektromagnit moda profilini qayta hisoblash bilan 0,1 ms qadamlar bilan hisoblangan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd-f6.jpg\" alt=\"6-rasm: Oʻzaro interferometr uchun chastotali supurishlardan foydalangan holda sezgirlikni oʻrganish va qurilmaning idea\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-rasm: Oʻzaro interferometr uchun chastotali supurishlardan foydalangan holda sezgirlikni oʻrganish va qurilmaning ideal chiqishi (ichki oynada koʻrsatilgan).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;6-rasm: Oʻzaro interferometr uchun chastotali supurishlardan foydalangan holda sezgirlikni oʻrganish va qurilmaning ideal chiqishi (ichki oynada koʻrsatilgan). a) Isitish profilining chiziqli oʻtkazuvchanlik harorat koeffitsiyenti α ga sezgirligini oʻrganish. Har bir simulyatsiyada elektr maydon barqarorligi va hosil boʻlgan termal profilni modellashtirish uchun 50 ms davomida TE10 rejimi ishlatilgan. b) Ushbu qurilmadan olingan ideal kubik tayanchli elementar katakning renderi. c) Har bir portda mustaqil chastotali supurishlar orqali sinterlash yoʻli bilan hosil qilingan qurilma chiqishining realistik renderi. Ajratilgan qismlar (qizil, yashil, sariq) turli kirish chastotalarida hosil boʻlgan mustaqil termal tugunlardan sinterlangan hududlarni belgilaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd-f7.jpg\" alt=\"7-rasm: Tashqi chegaraviy isitgich modelining sxemasi va simulyatsiyasi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-rasm: Tashqi chegaraviy isitgich modelining sxemasi va simulyatsiyasi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;7-rasm: Tashqi chegaraviy isitgich modelining sxemasi va simulyatsiyasi. a) Reflektor tizimini koʻrsatuvchi tizim diagrammasi. Ichki oynada metall kukunining dielektrik blok atrofida qanday chegaraviy shartni majburlashi va toʻlqin oʻtkazgich sifatida samarali ishlashi koʻrsatilgan. Dielektrik blokning uzunligi 10 GGs chastotada kremniy dioksidida maydonni maksimal darajada kuchaytirish uchun optimallashtirilgan. b) a) bandidagi RF va termal simulyatsiya uchun yaratilgan tetraedral toʻr profili. Yashil strelkalar toʻlqin oʻtkazgich materiali (volfram) uchun, qizil strelkalar esa kukun materiali (mis) uchun impedans chegaraviy shartlarini koʻrsatadi. c) y = 0 va t = 1500 ms holatidagi elektr maydon profilining ikki oʻlchovli kesimi. 1 MVt kirish quvvati ishlatilgan. d) Chegaraviy (kukun) devori boʻylab elektromagnit isitish natijasida hosil boʻlgan harorat taqsimoti. Isitish 1 ms qadamlar bilan hisoblangan. e) TE20 kirish rejimi va qisqa isitish vaqti bilan ushbu qurilma tomonidan ishlab chiqarilgan mis qobiqning renderi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;qatlamli bosib&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;chiqarish&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;sekinligi&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;kukunlarda&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;SVCH&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;maydonlarini m&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;odellashtirish&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;NATIJA&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;1 mm termal&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;panjaralar&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;hosil bo'lishi&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170
