        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"251\" cy=\"170\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"629\" cy=\"183\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · STEELS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Muzlatilgan qum va vakuum&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;murakkab alyuminiy&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;quymalarini qanday qutqaradi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-f1.jpg\" alt=\"Muzlatilgan qum qolip modelida haroratni yig'ishning prinsipial sxemasi. (a) Qurilmaning old ko'rinishi. (b) Qurilmaning\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Muzlatilgan qum qolip modelida haroratni yig'ishning prinsipial sxemasi. (a) Qurilmaning old ko'rinishi. (b) Qurilmaning kesim ko'rinishi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"concepts/zl205a-alloy.html\"&gt;ZL205A&lt;/a&gt; qotishmasini quyish keng kristallanish oralig‘i va past oquvchanlik tufayli qiyin kechadi. Muzlatilgan qum qoliplari bilan birgalikda manfiy bosimni qo‘llash issiqlik almashinuvini keskin yaxshilaydi. Bu yechim nozik devorli detallarda mayda donali struktura va nuqsonsiz natijani ta’minlaydi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Optimal &lt;a href=\"concepts/ihtc.html\"&gt;IHTC&lt;/a&gt; 236 Vt/(m²·K) 6% namlik va -40 °C da erishildi.&lt;/li&gt;\n&lt;li&gt;T6 ishlovidan keyin mustahkamlik 478,5 MPa va cho‘zilish 7,4% ni tashkil etdi.&lt;/li&gt;\n&lt;li&gt;Usul diametri 180 mm bo‘lgan nozik devorli detallardagi nuqsonlarni yo‘qotadi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tadqiqot ZL205A (AlCu5MnTiCdV) qotishmasiga qaratilgan bo‘lib, u gaz g‘ovakliligi va qisqarish nuqsonlariga moyil. «Qolip-quymalar» chegarasidagi issiqlik almashinuvini tahlil qilish uchun 10 Gts chastotada yozib oluvchi yettita K-tipli termojuft ma’lumotlari asosida teskari issiqlik o‘tkazuvchanlik usuli qo‘llanildi. Jarayonning optimal parametrlari — qolip namligi 6% va muzlatish harorati -40 °C — o‘rtacha issiqlik uzatish koeffitsiyentini (IHTC) 236 Vt/(m²·K) gacha yetkazdi.&lt;/p&gt;\n&lt;p&gt;Bu ko‘rsatkich oddiy muzlatilgan qoliplarga qaraganda 2,8 barobar, vakuumli qatronli qum qoliplariga qaraganda esa 1,6 barobar yuqoridir. Issiqlikni chiqarib olish intensivligining oshishi donalarning maydalanishiga va gazlarning samarali chiqib ketishiga yordam beradi. Natijada, cho‘zilishdagi mustahkamlik quyma holatda 200,6 MPa va T6 termik ishlovidan keyin 478,5 MPa ga yetadi, bu esa 3 mm devor qalinligidagi detallarni quyish imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot kichik hajmdagi laboratoriya namunalari bilan cheklangan va yirik sanoat quymalari uchun jarayonning masshtablanishini hisobga olmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Quyma alyuminiy qotishmalari aerokosmik uskunalarida keng qo'llaniladi, asosan samolyot korpuslari, dvigatel tizimlari va boshqaruv tizimlari uchun tarkibiy qismlar sifatida xizmat qiladi, bu yerda yengillik va yuqori mustahkamlik xususiyatlari juda muhimdir. Aerokosmik ishlab chiqarishda eng keng tarqalgan qotishmalar ZL1×× va ZL2×× seriyalari bo'lib, ular umumiy iste'molning 95% dan ortig'ini tashkil qiladi. Ushbu qotishmalar odatda qum qoliplariga quyish, kokilga quyish va investitsion quyish usullari yordamida hosil qilinadi, ko'pincha yuqori samarali alyuminiy qotishma quymalarini olish uchun past bosimli va elektromagnit quyish kabi maxsus quyish texnikalari bilan birlashtiriladi. Biroq, alyuminiy qotishmalari yuqori haroratlarda gazni yutish va oksidlanishga juda moyil bo'lib, bu quyma mahsulotlarda ko'plab qotish nuqsonlariga va hosildorlikning pasayishiga olib keladi. Shu bilan birga, texnologiyaning rivojlanishi bilan sanoat ishlab chiqarishi alyuminiy qotishmalarini tayyorlash, qayta ishlash va ishlash ko'rsatkichlariga tobora qat'iy talablarni qo'ymoqda. Shu nuqtai nazardan, qotish jarayonida keng qotish intervallariga ega bo'lgan qotishmalarning qotish xatti-harakatlarini real vaqt rejimida tartibga solish, ularning mikro tuzilishini yanada samaraliroq tozalash, tarkibiy nuqsonlarni bartaraf etish va mexanik xususiyatlarini oshirish dolzarb masala va diqqat markaziga aylandi. Bu bunday qotishmalarning yakuniy shaklga yaqin (near-net shaping) shakllanishini yanada ta'minlaydi, quyishdan keyingi ishlov berishni kamaytiradi, material chiqindilarini minimallashtiradi, xarajatlarni pasaytiradi hamda ishlash talablariga muvofiqligini ta'minlagan holda materialdan foydalanish va ishlab chiqarish samaradorligini oshiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Asosiy muammo nuqsonlarni minimallashtirish va quymalarning sifatini oshirish uchun keng kristallanish intervaliga ega qotishmalarning qotish jarayonini boshqarish zaruratidir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;1970-yillarda Britaniyaning Booth va British Oxygen Company kompaniyalari quyish jarayonida kriogen texnologiyani qo'lladilar va &lt;a href=\"concepts/lite-v-zamorozhennye-formy.html\"&gt;muzlatilgan qolipga quyish&lt;/a&gt; jarayonini ixtiro qildilar. Olingan qolip ma'lum bir mustahkamlikka erishish uchun past haroratlarda muzlatilgan va natijada hosil bo'lgan qum qolipi an'anaviy qum qolipiga quyishda ishlatiladiganlarga asosan bir xil edi. Moore va boshq. muzlatilgan qum qoliplaridagi o'tkazuvchanlikning o'zgarish qonuniyatlarini o'rgandilar va qo'polroq qum zarralari qolipning yaxshiroq yakuniy o'tkazuvchanligiga olib kelishini aniqladilar. Nagoya sanoat texnologiyalari tadqiqot instituti qolip harorati va mustahkamligi o'rtasidagi bog'liqlikni solishtirish uchun muzlatish jarayonida qoliplardagi namlikning dinamik xatti-harakatlarini o'rgandi. Ular, shuningdek, muzlatilgan quyish uchun yordamchi bog'lovchi sifatida ferrosilitsiy kukunidan foydalanish minimal deformatsiyaga olib kelishini aniqladilar. Bundan tashqari, ular sovutgich sarfini kamaytiradigan va qolipni bir xilda mustahkamlashga imkon beradigan siqib quyish usulini ishlab chiqdilar. 2008-yilda S. Tada muzlatilgan qum qoliplarining siqilish kuchiga ta'sir qiluvchi omillarni o'rgandi. Muzlatilgan qum qoliplarini ishlab chiqarish uchun suvli eritmalar o'rniga kremniy kolloid eritmalaridan foydalangan holda, qoliplar hatto erigan holatda ham ma'lum bir siqilish kuchini saqlab qolishi aniqlandi. 2015-yilda Shan va boshq. muzlatilgan qum qoliplari uchun raqamli shablonsiz kesish usulini taklif qildilar. Bu usul qum qolipiga quyish uchun bog'lovchi sifatida toza suvdan foydalanadi, bunda qum zarralari tegishli miqdordagi suv bilan aralashtiriladi va muzlatilgan qum blankasini hosil qilish uchun past haroratli muhitda muzlatiladi. Keyin muzlatilgan qum qolipi ayiruvchi ishlab chiqarish tamoyillariga asoslangan raqamli shablonsiz kesish uskunalari yordamida shaklga keltiriladi. Liang va boshq. turli haroratlarda turli xil suv tarkibiga ega muzlatilgan qum qoliplarining issiqlik o'tkazuvchanligini o'lchash uchun termal zond usulidan foydalandilar va muzlatilgan qum qoliplarining issiqlik o'tkazuvchanligini baholash uchun hajmiy aralashtirish modelini o'rnatdilar.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Muzlatilgan qolipga quyish — bu qum aralashmasi suv bilan muzlatilib, mustahkamlik beriladigan usul bo'lib, u kimyoviy bog'lovchilarsiz aniq qoliplarni olish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Muzlatilgan qolipga quyish texnologiyasi bo'yicha hozirgi tadqiqotlar asosan shakllantirish jarayoniga va oddiy shakldagi quymalarning mikro tuzilmalari va xususiyatlarini solishtirishga qaratilgan. Biroq, muzlatilgan qolipga quyish jarayonida turli qotishma tizimlari bilan bog'liq asosiy muammolarni hal qiladigan ishlar nisbatan kam. Ko'pgina eksperimental namunalar alyuminiy-kremniy seriyali qotishmalarga asoslangan, shu bilan birga suyuqligi past va qotish nuqsonlariga yuqori sezuvchanlikka ega bo'lgan alyuminiy-mis seriyali qotishmalar kabi qotishmalar bo'yicha tadqiqotlar kamligicha qolmoqda. Salbiy bosim yordamida quyish sohasidagi hozirgi tadqiqotlar, ham mamlakat ichida, ham xalqaro miqyosda, asosan ikkita texnikaga qaratilgan: V-jarayon va yo'qoladigan modelga quyish (LGM). Mahalliy quyish kompaniyasi bir xil qotishga erishish uchun yuqori oqimli tez quyishni qabul qildi va natijada quyish vakuum darajasi −0,04 MPa, ushlab turish vakuum darajasi −0,03 MPa, ushlab turish vaqti 15 daqiqa va quyma izolyatsiya vaqti 8 soat kabi asosiy jarayon parametrlarini aniqladi. Bu yondashuv quymalardagi sovuq tutashuv va issiq yorilish kabi muammolarni tubdan hal qildi. Senthil va boshq. turli quyish usullari ostida qotish jarayoni va qotishmalarning xatti-harakatlari bo'yicha qiyosiy tadqiqotlar o'tkazdilar. Ular V-jarayon an'anaviy qum qolipiga quyish va bosim ostida quyish bilan bog'liq asosiy kamchiliklarni samarali ravishda bartaraf etishini, shu bilan birga qotishmaning to'ldirish qobiliyatini oshirishi va quymalarning sirtini yaxshilashini aniqladilar. Gao va boshq. katta va o'rta yarim yopiq quymalarni LGM usulida quyishda qolipning qulashi va qolip devorining kengayishi kabi umumiy nuqsonlarni hal qildilar. Ular ushbu nuqsonlar yuzaga keladigan ishlab chiqarish bosqichlarini va ularning tub sabablarini tahlil qildilar, so'ngra tegishli yaxshilash choralarini ishlab chiqdilar. Amaliy natijalar shuni ko'rsatdiki, qolipni to'ldirish vaqtida yarim yopiq komponentlarning yuqori tekisligini 45° burchak ostida qiya qilish qumni yaxshiroq to'ldirish va siqishni osonlashtiradi. Bundan tashqari, tashqi vakuum quvurlarini o'rnatish va quyish vaqtida ham ichki, ham tashqi tomondan vakuum qo'llash qolip bo'shlig'ining ichida va tashqarisida muvozanatli salbiy bosimni ta'minlaydi, shu bilan quymalarning sifat koeffitsientini oshiradi. Zhang va boshq. traktor transmissiyasi korpusining tuzilishini va LGM ning jarayon moslashuvchanligini tahlil qildilar. Tizimli tadqiqot va ishlanmalar orqali ular korpus uchun LGM jarayonini muvaffaqiyatli o'rnatdilar, bu umumiy ishlab chiqarish xarajatlarini kamaytirish uchun katta ahamiyatga ega. Liang va boshq. volan korpuslari kabi mahsulotlarni LGM usulida quyishda oson yuzaga keladigan qum kuyishi, gaz g'ovakliligi va qum yuvilishi kabi nuqsonlarni o'rgandilar. Modelni yig'ish jarayonini sozlash, quyish tizimini optimallashtirish, ventilyatsiya va shlak tutgichlar tartibini qayta loyihalash hamda kirish joylari pozitsiyasining ratsionalligini yaxshilash orqali, amaliy ishlab chiqarish sharoitlari bilan birgalikda, u tegishli mahsulotlardagi quyish nuqsonlarini bartaraf etish choralarini taklif qildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mavjud tadqiqotlarning aksariyati oddiy shakllar va Al-Si qotishmalari bilan cheklangan, bu esa natijalarni keng qotish intervaliga ega murakkab Al-Cu qotishmalariga tatbiq etishni qiyinlashtiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;LGM va V-jarayon bo'yicha hozirgi tadqiqotlar asosan qolip yasash jarayonlari va jarayon parametrlarini nazorat qilishga qaratilgan. Ushbu usullar ishlab chiqarish samaradorligini oshirish, quyish aniqligini yaxshilash va xarajatlarni ma'lum darajada kamaytirish kabi afzalliklarni taklif etadi. Biroq, bir qator murakkab hal etilmagan muammolar qolmoqda, bu ularning kengroq qo'llanilishini cheklaydi. 1950-yillardan beri tadqiqotchilar interfeys issiqlik uzatish koeffitsienti (IHTC) metall qotishi paytida harorat maydonining evolyutsiyasiga sezilarli ta'sir ko'rsatishini va shu bilan quymalarning mikro tuzilishi va xususiyatlariga ta'sir qilishini tan olishgan. Oukach va boshq. harorat-vaqt egri chiziqlarini yozib olish uchun quyma va qolip ichidagi belgilangan joylarga termojuftlarni joylashtirdilar. Ushbu ma'lumotlarga asoslanib, ular quyma/qolip interfeysidagi harorat gradientini hisobladilar va h = q / (Tis - Tim) formulasi yordamida vaqt o'tishi bilan IHTC o'zgarishini chiqardilar, bu IHTC ning birinchi eksperimental aniqlanishini belgiladi. Han, Singh va boshq. metall qotish jarayonlari bilan kompyuter texnologiyalarini birlashtirib, qotish mexanizmlarini tahlil qilish va qolip/quyma interfeysida IHTC ning vaqtinchalik o'zgarishini o'rganish uchun Beck teskari algoritmidan foydalandilar. Motoyama va boshq. hamda Woodbury va boshq. qum qoliplari va alyuminiy qotishma quymalari o'rtasidagi interfeysda IHTC ni o'rgandilar, uning qiymatlarini turli hisoblash usullari orqali oldilar. So'nggi yillarda mahalliy olimlar IHTC ni aniqlash sohasida sezilarli yutuqlarga erishdilar. Xu va boshq. qotish jarayoniga yopishqoqlik kabi jarayon omillarining ta'sirini o'rgandilar va IHTC va yopishqoqlik o'rtasidagi bog'liqlikni tahlil qildilar. Ularning natijalari shuni ko'rsatdiki, yuqori yopishqoqlik qolip/quyma interfeysida kengroq havo bo'shlig'i qatlamiga olib keladi, bu pastroq IHTC ga mos keladi. Ko'plab tadqiqot guruhlari, shuningdek, Zhu va boshq., Sui va boshq., Zhang va boshq., Wang va boshq. va Cao va boshq. kabi qotish paytida IHTC qanday rivojlanishi bo'yicha eksperimental tahlillar orqali muhim natijalarni taqdim etdilar. Hozirgi vaqtda IHTC ning teskari hisobi qum qolipiga quyish, kokilga quyish va past bosimli quyish kabi turli quyish jarayonlariga qo'llanilgan. Yaqinda Dong va boshq. chekli farqlar usulini konjugat gradient va zarrachalar to'dasi optimallashtirish algoritmlari bilan birlashtirib, muzlatilgan qum qolipi/ZL101 qotishmasi interfeysida IHTC ni aniqladilar, bu 4–5 og'irlik foizidagi suv miqdori IHTC evolyutsiya egri chiziqlarining ikki xil turini keltirib chiqarishini ko'rsatdi; xuddi shu guruh A356 qotishi paytida muzlatilgan qum qolipi-eritma IHTC ni baholash uchun teskari issiqlik o'tkazuvchanlik modelini ishlab chiqdi, dastlabki muzlatish harorati, suv miqdori va qoliplash qumining ta'sirini miqdoriy baholadi. Qiu va boshq. halqali alyuminiy quymalarning tashqi qolipi va ichki o'zagi uchun IHTC ning teskari modelini o'rnatdilar, bu quyma/o'zak IHTC har doim quyma/qolip qiymatidan yuqori ekanligini va asosan interfeys bo'shlig'i bilan boshqarilishini ko'rsatdi. Shu bilan birga, Shi va boshq. muzlatilgan qum qoliplari uchun kriogen gradient hosil qilish texnikasini ishlab chiqdilar va volan korpusi quymalari uchun CT8 o'lchamli aniqligiga erishgan optimal formulalar oynasini (qum hajmi 106–212 mkm, suv miqdori 4–5 og'irlik foizi, muzlatish harorati −25 °C dan past) aniqladilar. Biroq, muzlatilgan qum qoliplari bo'yicha mavjud IHTC tadqiqotlari Al-Si qotishmalarining atmosfera qotishi bilan cheklangan; hali ham quyish paytida salbiy bosimli muhitning IHTC va issiqlik uzatish xatti-harakatlariga ta'siri, shuningdek, ZL205A kabi keng qotish intervaliga ega Al-Cu qotishmalari bo'yicha tadqiqotlar haqida xabar berilmagan. Qotish mikro tuzilishining morfologiyasi va miqyosi to'g'ridan-to'g'ri metall-qolip interfeysi issiqlik uzatish intensivligi bilan boshqarilganligi sababli, bu odatda IHTC bilan tavsiflanadi, interfeys issiqlik uzatish va qotish tuzilishi o'rtasidagi miqdoriy bog'liqlik tobora ko'proq e'tiborni tortmoqda. Yang va boshq. qum qolipiga quyilgan Al-5Cu-0.38Mg-0.32Mn-0.1Ag qotishmasidan qilingan silindr kallaklarini o'rgandilar va pozitsiyaga bog'liq sovutish tezligi teng o'qli donalarni 116 mkm dan 62 mkm gacha tozalashini, oquvchanlik chegaralari 140 dan 159 MPa gacha o'zgarishini aniqladilar, bu don hajmi va mexanik ishlashni aniqlashda sovutish tezligining dominant rolini tasdiqlaydi. Mao va boshq. Al-7Si-0.6Mg qotishmalari uchun yuqori sovutish tezligi yadrolanishning o'ta sovishini va yadrolanish tezligini oshirishini, shu bilan donalarni tozalashini va bir vaqtning o'zida mustahkamlik va egiluvchanlikni yaxshilashini ko'rsatdilar. Ushbu natijalar shuni ko'rsatadiki, interfeys issiqlik uzatishni kuchaytirish issiqlikni olib tashlashni tezlashtiradi, qotishning o'ta sovishini oshiradi, donalarni tozalaydi va gaz g'ovakligini bostiradi, bu ushbu ishda ko'rib chiqilgan «jarayon-issiqlik-mikro tuzilish-xususiyat» munosabatlarining mexanistik asosini tashkil qiladi. Shuning uchun, ushbu tadqiqot keng qotish intervali, yomon suyuqlik va ko'plab qotish muammolari bilan tavsiflangan Al-Cu asosidagi qotishma vakili bo'lgan ZL205A alyuminiy qotishmasiga qaratilgan.&lt;/p&gt;\n&lt;p&gt;Uch xil shakllantirish usulidan foydalangan holda qiyosiy tadqiqot o'tkaziladi: atmosfera bosimida an'anaviy qatronli qum qolipiga quyish, atmosfera bosimida muzlatilgan qum qolipiga quyish va salbiy bosim sharoitida muzlatilgan qum qolipiga quyish. Bundan tashqari, salbiy bosimli muzlatilgan qum qolipiga quyish jarayoni uchun turli xil suv tarkibiga va dastlabki muzlatish haroratiga ega qum qoliplaridan foydalangan holda qiyosiy tahlil o'tkaziladi. Maqsad ZL205A alyuminiy qotishmasining turli jarayonlar va muzlatilgan qum qolipi parametrlari ostida qotish xatti-harakatlarini va mikro tuzilishi va xususiyatlarining evolyutsiyasini aniqlashdir. Ushbu tadqiqotning aniq maqsadlari quyidagilardir: (1) teskari issiqlik o'tkazuvchanlik tahlilidan foydalangan holda turli qolip/bosim sharoitlarida vaqtga bog'liq IHTC evolyutsiyasini miqdoriy aniqlash; (2) IHTC kattaligi, qotish tezligi, donni tozalash va g'ovaklikni bostirish o'rtasidagi mexanistik bog'liqlikni o'rnatish; va (3) ZL205A ni salbiy bosim ostida quyish uchun optimal muzlatilgan qum qolipi parametrlarini (namlik miqdori va dastlabki muzlatish harorati) aniqlash, bu yuqori sifatli yupqa devorli komponentlarni ishlab chiqarishga imkon beradi.&lt;/p&gt;\n&lt;p&gt;Ushbu tadqiqotda haroratni yig'ish uchun 150 mm × 150 mm × 150 mm o'lchamdagi muzlatilgan qum qolipi ishlab chiqilgan. Qolip bo'shlig'i 40 mm diametrga va 100 mm balandlikka ega edi. Harorat ma'lumotlari ko'p kanalli harorat yozuvchisi (MIK-4000D, CHN, Hangzhou Meikong Automation Technology Co., Ltd., Xanchjou, Xitoy) va yettita K-tipli termojuft (Hangzhou Meikong Automation Technology Co., Ltd., Xanchjou, Xitoy) yordamida 10 Gts yozib olish chastotasi bilan to'plangan. Eritmaning haroratini aniq o'lchashni ta'minlash uchun T1 va T7 deb belgilangan ikkita termojuft eritmaning markaziga joylashtirilgan. Qo'shimcha termojuftlar eritmaning tashqi chetidan 5 mm, 10 mm, 15 mm, 20 mm va 25 mm masofada joylashtirilgan va mos ravishda T2 dan T6 gacha belgilangan, 1-rasmda ko'rsatilganidek. Quymadan radial issiqlik tarqalishini rag'batlantirish va eksenel issiqlik yo'qotilishini minimallashtirish uchun qolip bo'shlig'ining pastki qismiga issiqlik izolyatsiyasi paxtasi joylashtirilgan. Bundan tashqari, vertikal yo'nalishda termal izolyatsiyani ta'minlash uchun yuqori qismga quyish kosasi va izolyatsiya paxtasi joylashtirilgan. 1-rasm Muzlatilgan qum qolipi modelida haroratni yig'ishning sxematik diagrammasi. (a) Qurilmaning old ko'rinishi. (b) Qurilmaning kesim ko'rinishi. K-tipli termojuftlar eksperimentlardan oldin aniq etalon termometr (aniqlik ±0,5 °C) yordamida −50 °C dan 900 °C gacha bo'lgan harorat oralig'ida kalibrlangan; kengaytirilgan o'lchov noaniqligi ±1,5 °C (k = 2) edi. Qolip ichidagi termojuft pozitsiyalari qumni siqish paytida siljish 1-rasmda ko'rsatilgan nominal pozitsiyalardan ±1 mm dan kamroq bo'lishini tekshirish uchun muzlatilgandan so'ng qurbonlik qolipini kesish orqali tasdiqlangan. Salbiy bosim yordamida o'tkazilgan eksperimentlar uchun bosim-vaqt profili har bir eksperiment davomida kalibrlangan bosim o'lchagich (Anhui Zhenglan Instrument Co., Ltd., Chuzhou, Anhui, Xitoy; diapazon: 0 dan −0,1 MPa gacha, ruxsat: 0,001 MPa) yordamida nazorat qilingan. Vakuum quyish va qotish ketma-ketligi davomida −0,03 ± 0,002 MPa darajasida saqlangan. Qolipni o'rab turgan po'lat otishma qatlami mexanik yordam ko'rsatdi va kichik issiqlik izolyatsiyasi effektiga hissa qo'shdi; ammo, barcha salbiy bosim eksperimentlarida bir xil po'lat otishma qatlami konfiguratsiyasi ishlatilganligi sababli, uning samarali IHTC ga hissasi o'lchangan h(t) qiymatlariga kiritilgan va sharoitlar o'rtasidagi nisbiy taqqoslashlarga ta'sir qilmaydi. Shunga qaramay, po'lat otishma qatlami va PE muhrlash tizimi faqat vakuum yordamida konfiguratsiyada mavjud bo'lganligi sababli, ularning mumkin bo'lgan termal hissasi atmosfera va salbiy bosim sharoitlari mutlaq qiymatlarda solishtirilganda ushbu tadqiqotning cheklovi sifatida tan olinadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;IHTC (interfeys issiqlik uzatish koeffitsienti) — bu issiqlikning quymadan qolipga qanchalik samarali o'tishini ko'rsatadigan ko'rsatkich; qiymat qanchalik yuqori bo'lsa, sovutish shunchalik tez va donalar shunchalik mayda bo'ladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-f1.jpg\" alt=\"Muzlatilgan qum qolip modelida haroratni yig'ishning prinsipial sxemasi. (a) Qurilmaning old ko'rinishi. (b) Qurilmaning\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Muzlatilgan qum qolip modelida haroratni yig'ishning prinsipial sxemasi. (a) Qurilmaning old ko'rinishi. (b) Qurilmaning kesim ko'rinishi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-f2.jpg\" alt=\"Turli texnologik parametrlar ostida fazalararo issiqlik uzatish koeffitsiyenti.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Turli texnologik parametrlar ostida fazalararo issiqlik uzatish koeffitsiyenti.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Turli texnologik parametrlar ostida fazalararo issiqlik uzatish koeffitsiyenti. (a) Atmosfera va manfiy bosim ostida smolali qum qolipining IHTC koeffitsiyenti. (b) Atmosfera bosimida quyishda turli namlik miqdoriga ega muzlatilgan qum qoliplarining IHTC koeffitsiyenti. (c) Manfiy bosimli quyishda −40 °C haroratda turli namlik miqdoriga ega muzlatilgan qum qoliplarining IHTC koeffitsiyenti. (d) Manfiy bosimli quyishda turli haroratlarda 6 massa % namlikka ega muzlatilgan qum qoliplarining IHTC koeffitsiyenti.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-f3.jpg\" alt=\"Smolali qum qoliplaridan foydalangan holda turli quyish jarayonlari uchun harorat egri chiziqlarining qiyosiy tahlili. (\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Smolali qum qoliplaridan foydalangan holda turli quyish jarayonlari uchun harorat egri chiziqlarining qiyosiy tahlili. (a) Atmosfera bosimi ostida quyish. (b) Manfiy bosim ostida quyish.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-f4.jpg\" alt=\"Turli parametrlarga ega muzlatilgan qum qoliplarini atmosfera bosimida quyish uchun haroratni o'lchash egri chiziqlarini\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Turli parametrlarga ega muzlatilgan qum qoliplarini atmosfera bosimida quyish uchun haroratni o'lchash egri chiziqlarining qiyosiy tahlili.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Turli parametrlarga ega muzlatilgan qum qoliplarini atmosfera bosimida quyish uchun haroratni o'lchash egri chiziqlarining qiyosiy tahlili. (a) Suv miqdori 2 massa %, boshlang'ich muzlash harorati −40 °C. (b) Suv miqdori 4 massa %, boshlang'ich muzlash harorati −40 °C. (c) Suv miqdori 6 massa %, boshlang'ich muzlash harorati −40 °C.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-f5.jpg\" alt=\"Turli parametrlarga ega muzlatilgan qum qoliplarini manfiy bosim ostida quyish uchun haroratni o'lchash egri chiziqlari.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Turli parametrlarga ega muzlatilgan qum qoliplarini manfiy bosim ostida quyish uchun haroratni o'lchash egri chiziqlari.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Turli parametrlarga ega muzlatilgan qum qoliplarini manfiy bosim ostida quyish uchun haroratni o'lchash egri chiziqlari. (a) Suv miqdori 2 massa %, boshlang'ich muzlash harorati −20 °C. (b) Suv miqdori 4 massa %, boshlang'ich muzlash harorati −20 °C. (c) Suv miqdori 6 massa %, boshlang'ich muzlash harorati −20 °C. (d) Suv miqdori 2 massa %, boshlang'ich muzlash harorati −30 °C. (e) Namlik miqdori 4 massa %, boshlang'ich muzlash harorati −30 °C. (f) Namlik miqdori 6 massa %, boshlang'ich muzlash harorati −30 °C. (g) Suv miqdori 2 massa %, boshlang'ich muzlash harorati −40 °C. (h) Suv miqdori 4 massa %, boshlang'ich muzlash harorati −40 °C. (i) Suv miqdori 6 massa %, boshlang'ich muzlash harorati −40 °C.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-f6.jpg\" alt=\"Turli xil quyish jarayonlarining mikro tuzilishi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Turli xil quyish jarayonlarining mikro tuzilishi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Turli xil quyish jarayonlarining mikro tuzilishi. (a) Qatronli qum qolipida normal bosim ostida quyish; (b) qatronli qum qolipida manfiy bosim ostida quyish; (c) 6 og'irlik % namlik, −40 °C haroratda muzlatilgan qum qolipida normal bosim ostida quyish; (d) 6 og'irlik % namlik, −40 °C haroratda muzlatilgan qum qolipida manfiy bosim ostida quyish; (e) 6 og'irlik % namlik, −20 °C haroratda muzlatilgan qum qolipida manfiy bosim ostida quyish; (f) 6 og'irlik % namlik, −30 °C haroratda muzlatilgan qum qolipida manfiy bosim ostida quyish; (g) 4 og'irlik % namlik, −40 °C haroratda muzlatilgan qum qolipida manfiy bosim ostida quyish; (h) 2 og'irlik % namlik, −40 °C haroratda muzlatilgan qum qolipida manfiy bosim ostida quyish.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-f7.jpg\" alt=\"Turli xil texnologik sharoitlarda qotishmaning mexanik xossalari\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Turli xil texnologik sharoitlarda qotishmaning mexanik xossalari&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Turli xil texnologik sharoitlarda qotishmaning mexanik xossalari: (a) quyma holatdagi cho'zilish kuchi; (b) quyma holatdagi uzayish; (c) issiqlik bilan ishlov berilgandan keyingi cho'zilish kuchi; (d) issiqlik bilan ishlov berilgandan keyingi uzayish. (Eslatma: 1 qatronli qum, atmosfera bosimi; 2 qatronli qum va manfiy bosim; 3 6 og'irlik %, −40 °C muzlash harorati va atmosfera bosimi; 4 6 og'irlik %, −40 °C muzlash harorati va manfiy bosim ostida quyishni bildiradi).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-f8.jpg\" alt=\"Turli jarayonlar orqali ishlab chiqarilgan quyma detallarning cho'zilish yoriqlari yuzalarining skanerlash fotosuratlari\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Turli jarayonlar orqali ishlab chiqarilgan quyma detallarning cho'zilish yoriqlari yuzalarining skanerlash fotosuratlari.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Turli jarayonlar orqali ishlab chiqarilgan quyma detallarning cho'zilish yoriqlari yuzalarining skanerlash fotosuratlari. (a) Qatronli qum qolipida gravitatsiyaviy quyish; (b) qatronli qum qolipida manfiy bosim ostida quyish; (c) 6 og'irlik % namlik, −40 °C haroratda muzlatilgan qum qolipida gravitatsiyaviy quyish; (d) 6 og'irlik % namlik, −40 °C haroratda muzlatilgan qum qolipida manfiy bosim ostida quyish; (e) 6 og'irlik % namlik, −20 °C haroratda muzlatilgan qum qolipida manfiy bosim ostida quyish; (f) 6 og'irlik % namlik, −30 °C haroratda muzlatilgan qum qolipida manfiy bosim ostida quyish; (g) 4 og'irlik % namlik, −40 °C haroratda muzlatilgan qum qolipida manfiy bosim ostida quyish; (h) 2 og'irlik % namlik, −40 °C haroratda muzlatilgan qum qolipida manfiy bosim ostida quyish.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-f9.jpg\" alt=\"Issiqlik bilan ishlov berish jarayonlaridan keyin cho'zilish yoriqlari yuzalarining skanerlash mikrofotografiyalari.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Issiqlik bilan ishlov berish jarayonlaridan keyin cho'zilish yoriqlari yuzalarining skanerlash mikrofotografiyalari.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Issiqlik bilan ishlov berish jarayonlaridan keyin cho'zilish yoriqlari yuzalarining skanerlash mikrofotografiyalari. (a) Qatronli qum qolipida atmosfera bosimi ostida quyish; (b) qatronli qum qolipida manfiy bosim ostida quyish; (c) 6 og'irlik % namlik, −40 °C haroratda muzlatilgan qum qolipida atmosfera bosimi ostida quyish; (d) 6 og'irlik % namlik, −40 °C haroratda muzlatilgan qum qolipida manfiy bosim ostida quyish; (e) 6 og'irlik % namlik, −20 °C haroratda muzlatilgan qum qolipida manfiy bosim ostida quyish; (f) 6 og'irlik % namlik, −30 °C haroratda muzlatilgan qum qolipida manfiy bosim ostida quyish; (g) 4 og'irlik % namlik, −40 °C haroratda muzlatilgan qum qolipida manfiy bosim ostida quyish; (h) 2 og'irlik % namlik, −40 °C haroratda muzlatilgan qum qolipida manfiy bosim ostida quyish.&lt;/p&gt;\n&lt;/div&gt
