        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"101\" cy=\"103\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"639\" cy=\"200\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · DYNAMICS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Kvant optikasi: makro-&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;obyektlarni chip o‘lchamiga&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;qadar siqish&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/correlation-imaging-via-hybrid-entanglement-between-microwav-f2.jpg\" alt=\"Rasm 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Tadqiqotchilar fotonlar va sirt akustik fononlari o‘rtasidagi gibrid kvant bog‘liqligiga asoslangan korrelyatsion tasvirlash usulini taklif qilishdi. Ushbu zarrachalarning to‘lqin uzunliklari besh darajali farq qiladi, bu esa makro-obyektlarni mikroskopik chiplar bilan bog‘lash imkonini beradi. Tizim 10⁻⁸ dan 10⁶ gacha bo‘lgan diapazonda tasvir masshtabini o‘zgartiruvchi kvant mikroskopi kabi ishlaydi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-03/correlation-imaging-via-hybrid-entanglement-between-microwav.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Foton va fonon to‘lqin uzunliklarining 10⁵ marta farqi klassik optika cheklovlarini yengib o‘tadi.&lt;/li&gt;\n&lt;li&gt;Tasvirni 10⁶ martagacha masshtablash makro-obyektlarni mikrochiplarga proyeksiyalash imkonini beradi.&lt;/li&gt;\n&lt;li&gt;3.9×10³ juft/(s·Vt·Gs) yorqinlik rekonstruksiya aniqligini ta’minlaydi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-03/correlation-imaging-via-hybrid-entanglement-between-microwav.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tizimning asosi parametrik chastota konvertatsiyasi uchun nochiziqli element sifatida ishlaydigan o‘ta o‘tkazuvchan kvant sxemasidir (SQC). ω_a + ω_b = ω_p sharti bajarilganda, chulg‘angan foton-fonon juftliklari hosil bo‘ladi. O‘zaro ta’sirning samarali gamiltoniani H = Σ G_j (a†_j b†_j + H.c.) ko‘rinishida ifodalanadi, bu yerda G_j — SNAIL komponenti tomonidan ta’minlanadigan bog‘lanish konstantasi. Fotonlar va fononlarning tarqalish tezligidagi 10⁵ marta farq kross-masshtabli vizualizatsiya uchun noyob resurs yaratadi.&lt;/p&gt;\n&lt;p&gt;Obyektning fazoviy profilini rekonstruksiya qilish uchun foton-fonon mos kelishini o‘lchash orqali olinadigan G⁽²⁾(x_a,d, x_b,d) ikkinchi tartibli korrelyatsiya funksiyasi qo‘llaniladi. K± nuqtali sochilish funksiyasi proyeksiyaning masshtabini belgilaydi: M⁻ = (λ_b * z_b,sd) / (λ_a * z_a,so) demagnifikatsiya uchun va M⁺ = (λ_a * z_a,sd) / (λ_b * z_b,so) magnifikatsiya uchun. Juftliklar hosil bo‘lish yorqinligi B_pair taxminan 3.9×10³ juft/(s·Vt·Gs) ni tashkil etadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Usul juftliklar hosil bo‘lish samaradorligi va manba aperturalarining cheklangan o‘lchami bilan chegaralangan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-03/correlation-imaging-via-hybrid-entanglement-between-microwav.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Ushbu ishda o'ta o'tkazuvchan kvant sxemasi yordamida hosil qilingan mikroto'lqinli fotonlar va sirt akustik to'lqinli (SAT) fononlar o'rtasidagi gibrid chalkashlikka asoslangan kvant korrelyatsion vizualizatsiya usuli taklif etiladi. Asosiy g'oya fotonlar va fononlar o'rtasidagi to'lqin uzunliklarining besh darajali farqidan foydalanishdan iborat. Bu kvant chalkashligi resursi zondlash va o'qish uchun turli xil maydonlarni tanlash imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Usul keng ko'lamli o'zgarishlarni amalga oshiradi: makro-obyektlar profillarini mikrosxemalarga proyeksiyalashda 10⁻⁸–10⁻⁶ marta kichraytirish yoki mikro-obyektlarni makroskopik foton qurilmalari yordamida o'qishda 10⁴–10⁶ marta kattalashtirish.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;An'anaviy vizualizatsiya usullari zondlash va o'qish uchun bir xil to'lqin uzunligidagi maydonlarni talab qiladi, bu esa ko'pincha amaliy cheklovlarga olib keladi. Taklif etilgan yondashuv ushbu muammoni gibrid chalkashlik orqali hal qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;O'ta o'tkazuvchan kvant sxemasi (SQC) — bu ω_p chastotada nasos yordamida parametrik konversiyani ta'minlovchi va chalkash holatlarni hosil qiluvchi nochiziqli element.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Metodologiya o'ta o'tkazuvchan kvant sxemasini (masalan, SNAIL) fotonlar uchun uzatish liniyasi antennasi va fononlar uchun IDT (interdigital transducer) bilan bog'lashga asoslangan. 1-rasmda ko'rsatilganidek, ω_p chastotada sxemani haydash orqali fotonlar va fononlar o'rtasida chalkashlik hosil qilinadi. Bu tizimning kogerentligini saqlab qolgan holda, turli fazoviy miqyoslar o'rtasida ma'lumot almashinuvini ta'minlaydi.&lt;/p&gt;\n&lt;p&gt;Tasvirni shakllantirish jarayoni K^± nuqtali tarqalish funksiyalari bilan belgilanadi, ular obyekt tekisligini (x_o) detektor tekisliklari bilan bog'laydi. Ideal holatda bu funksiyalar Dirak delta-funksiyalariga yaqinlashsa-da, haqiqiy tizimlarda ular manba aperturasi, to'lqin uzunliklari va tarqalish masofalariga bog'liq bo'lgan chekli kenglikka ega. Geometrik masshtablash koeffitsiyentlari M^± foton va fononlarning to'lqin uzunliklari (farq ~ 10⁵) va tarqalish yo'llari nisbati bilan aniqlanadi. Bu makroskopik obyektlarni mikroskopik chiplarga siqish (demagnifikatsiya M⁻ ~eq 2 × 10⁻⁸ - 5 × 10⁻⁶) yoki mikroskopik detallarni makroskopik o'qish tizimlariga kattalashtirish (magnifikatsiya M⁺ ~eq 1 × 10⁴ - 1 × 10⁶) imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;M^± masshtablash koeffitsiyentlari fazoviy ma'lumotni besh darajagacha farq qiluvchi miqyoslar o'rtasida uzatish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tizimning aniqligi δ x^± difraksion kengayish bilan cheklangan. Demagnifikatsiya uchun (za,so ~eq 0.05 - 1 m va Lb,s ~eq 3 - 5 mm) aniqlik δ x⁻ ~eq 0.5 - 17 mkm, magnifikatsiya uchun (zb,so ~eq 0.5 - 10 sm) esa δ x⁺ ~eq 1 - 30 mkm ni tashkil qiladi. Rekonstruksiya sifati (kontrast Rv,±) tirqishlar kengligi va ular orasidagi masofaga bog'liq; Rv,± &amp;lt; 0.15 bo'lganda signal obyekt profilini tiklash uchun yetarli bo'lmaydi. Kvasimonoxromatik yaqinlashish soddalashtirilgan model bo'lib, foton-fonon juftliklarining chekli o'tkazish qobiliyati chastotaga bog'liq korrelyatsiyani keltirib chiqaradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kontrast (visibility) — korrelyatsion signalning shovqin fonidan qanchalik aniq ajralib turishini ko'rsatuvchi parametr.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Joriy usul cheklovlarini NOON-holatlari (sub-to'lqin aniqligi uchun) yoki Fok holatlari (kontrastni oshirish uchun) kabi murakkab kvant holatlari yordamida yengib o'tish mumkin. O'ta o'tkazuvchan kvant sxemalarining (SQC) moslashuvchanligi mikroto'lqinli fotonlar, sirt akustik fononlari va optik fotonlarni bog'lovchi gibrid holatlarni sintez qilish imkonini beradi. Tizim ishlashi uchun termal shovqinlarni bostirish maqsadida 10–20 mK harorat (eritma sovutgichlarida) talab qilinadi. Ko'ndalang impulsning saqlanishi SQC ni antennalar va IDT (o'zaro o'zgartirgichlar) bilan bog'lash orqali ta'minlanadi. O'lchash jarayoni Jozefson o'tish detektorlari va kubitlar orqali dispersiv o'qishni talab qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tajribani amalga oshirish yuqori aniqlikdagi nanopozitsiyalash va antenna massivlarini integratsiyalashni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu bo‘limda o‘ta o‘tkazuvchan kubitlar va sirtqi akustik to‘lqinlar (SAT) fononlari gibrid tizimiga asoslangan kross-masshtabli korrelyatsion vizualizatsiya (fantom tasvirlash) usulining nazariy asoslari va sonli modellashtirish natijalari umumlashtirilgan. Taklif etilgan konsepsiya klassik difraksiya chegarasini yengib o‘tish va qattiq jismli tuzilmalardagi mikrodefektlarni yuqori aniqlikda buzmasdan nazorat qilish imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Taklif etilayotgan kross-masshtabli korrelyatsion vizualizatsiya usuli chalkashgan «foton-fonon» juftliklaridan foydalanish hisobiga, zondlovchi nurlanish to‘lqin uzunligi 10⁻² m bo‘lganda, o‘lchami 10⁻⁶ m tartibida bo‘lgan defektlarni subto‘lqinli aniqlikda tasvirlashni ta’minlaydi va klassik aniqlik chegarasidan to‘rt tartibga oshib ketadi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Usulning fizik asosi o‘ta o‘tkazuvchan kubit (transmon yoki oqimli kubit) [41, 42] hamda mikroto‘lqinli va akustik SAT-rezonatorlar [15] birlashmasidan tashkil topgan gibrid zanjirda kuchli korrelyatsiyalangan kvant holatlarini hosil qilishga tayanadi. Bunday tizimdagi uch to‘lqinli aralashuv [38, 39] yoki parametrik parchalanish jarayonida chastotasi ω_e ≈ 2π × 5 GGs bo‘lgan mikroto‘lqinli foton va chastotasi ω_p ≈ 2π × 5 GGs bo‘lgan akustik fonon juftliklari tug‘iladi. Chastotalar yaqin bo‘lishiga qaramay, to‘lqin uzunliklari elektromagnit to‘lqinlarning to‘lqin yo‘naltirgichdagi tezligi (v_e ≈ 10⁸ m/s) va akustik to‘lqinlarning pyezoelektrikdagi tezligi (v_p ≈ 3000 m/s) o‘rtasidagi ulkan farq tufayli besh tartibga farq qiladi. Mikroto‘lqin uzunligi λ_e ≈ 6 sm ni tashkil etsa, akustik to‘lqin uzunligi atigi λ_p ≈ 600 nm ga teng bo‘ladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Fantom vizualizatsiya (ghost imaging) — ob’yekt tasvirini olish usuli bo‘lib, unda ob’yekt bilan o‘zaro ta’sir qiluvchi zondlovchi dasta fazoviy aniqlikka ega bo‘lmagan oddiy bir pikselli detektor orqali qayd etiladi, fazoviy tuzilma esa ob’yektga yo‘naltirilmagan ikkinchi (tayanch) dasta bilan korrelyatsion o‘lchovlar o‘tkazish orqali tiklanadi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Modellashtirishning matematik apparati foton va fonon maydonlarining fazoviy profillari o‘rtasidagi ikkinchi tartibli o‘zaro korrelyatsiya funksiyasini G⁽²⁾(x_e, x_p) hisoblashga asoslangan [47, 48]. Eksperiment sxemasida fonon kanali ob’yekt yelkasi sifatida ishlatiladi: SAT-impulslari mikroyoritgichli tuzilmalarni zondlaydi [36, 37], shundan so‘ng o‘tgan yoki qaytgan akustik signal keng aperturali bir pikselli akustik qabul qilgich orqali yig‘iladi. Foton kanali esa tayanch yelka vazifasini bajaradi: mikroto‘lqinli maydonning fazoviy taqsimoti koordinataga sezgir detektorlar matritsasi yordamida qayd etiladi.&lt;/p&gt;\n&lt;p&gt;«Foton-fonon» juftliklarining kvant chalkashligi tufayli, akustik dasta yordamida mikromasshtabda muhrlangan mikrodefektlar haqidagi fazoviy ma’lumot mikroto‘lqinli maydon intensivligining makromasshtabdagi taqsimotiga ko‘chiriladi. Sonli tahlillar shuni ko‘rsatadiki, signal/shovqin nisbati (SNR) 15 dB dan yuqori va o‘lchovlar statistikasi to‘plash tsikli 10⁵ tartibida bo‘lganda, sxema kengligi 1 mkm gacha bo‘lgan yoriqlar geometriyasini ± 50 nm dan oshmaydigan chegaraviy xatolik bilan ishonchli tiklaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Taqdim etilgan natijalar akustik to‘lqinlarning substrat hajmidagi so‘nishi va kubitning fazaviy dekogerensiyasi hisobga olinmagan ideallashtirilgan model doirasida olingan. Haqiqiy tajribadagi aniqlik SAT-rezonatoridagi fononlarning yashash vaqti va o‘qish traktidagi faza fluktuatsiyalari bilan cheklanadi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Sirt akustik to'lqinlari (SAT) asosida ishlab chiqilgan kvant fantom tasvirlash usuli mikroelektronika va akustooptik tizimlarni buzmasdan nazorat qilish uchun yangi imkoniyatlarni ochadi. Korrelatsiyalangan fonon va foton juftlaridan foydalanish zondlovchi nurlanish to'lqin uzunligi bilan aniqlanadigan klassik difraksiya chegarasini chetlab o'tish imkonini beradi.&lt;/p&gt;\n&lt;p&gt;Eksperimental qurilmalarda SAT generatsiyasi litiy niobati (LiNbO₃) kabi pyezoelektr tagliklarga purkaladigan qarama-qarshi shtirli o'zgartirgichlar (QShO') yordamida amalga oshiriladi. Akustik maydonni fokuslash uchun elektrodlarning halqasimon va qiyalikli konfiguratsiyalari qo'llaniladi, bu akustik energiyani λSAW/2 dan kichik bo'lgan subto'lqinli sohalarda to'plash imkonini beradi. Uyg'onish chastotasi f = 1.5 GGs va LiNbO₃ da SAT tarqalish tezligi v = 3900 m/s bo'lganda, akustik to'lqin uzunligi λSAW ≈ 2.6 mkm ni tashkil qiladi, bu esa nuqsonlarni aniqlashda submikronli fazoviy aniqlikni ta'minlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Kvant-korrelatsiyalangan holatlardan foydalanish klassik λSAW/2 chegarasidan past bo'lgan fazoviy aniqlikka erishishga va signal shovqini darajasini standart kvant chegarasidan 3 dB pastroq saqlashga imkon beradi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Kvant darajasidagi kuchsiz akustik signallarni qayd etish uchun millikelvin temperaturalarda (T ≈ 10 mK eritish refrijeratorlarida) ishlaydigan o'ta o'tkazuvchan bir fotonli detektorlar va Jozefson parametrik kuchaytirgichlari qo'llaniladi. Bu fonon modalarining o'rtacha zichligi &lt;span class=\"yfm-latex\" data-content=\"%5Cbar%7Bn%7D_%7Bth%7D%20%5Cll%201\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ga teng bo'lgan issiqlik shovqinini minimallashtiradi. Mikroto'lqinli va optik signallarning o'zaro aylanishi litiy niobatidagi yupqa plyonkali rezonatorlarda 45% gacha samaradorlik bilan amalga oshiriladi, bu esa tizimni mavjud tolali-optik aloqa liniyalari bilan moslashtiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Usulning asosiy cheklovi fononlarning kvant kogerentligini saqlab qolish uchun o'ta past temperaturalarni ushlab turish zaruriyatidir, bu esa qurilmani standart sanoat yig'uv liniyalariga integratsiyalashni qiyinlashtiradi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Taqdim etilgan kvant akustik vizualizatsiya konsepsiyasi kvant optikasi tamoyillarining akustoelektronikada qo'llanilishini isbotlaydi. Murakkab geometriyali QShO' va yuqori sezuvchanlikka ega mikroto'lqinli detektorlarning integratsiyasi ko'p qatlamli yarimo'tkazgichli tuzilmalarda va flip-chip korpuslarida yashirin nuqsonlarni klassik ultratovushli defektoskopiya usullari uchun imkonsiz bo'lgan aniqlikda topish imkonini beradi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/correlation-imaging-via-hybrid-entanglement-between-microwav-f2.jpg\" alt=\"Rasm 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 2&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-03/correlation-imaging-via-hybrid-entanglement-between-microwav.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;kvant&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;sensorl
