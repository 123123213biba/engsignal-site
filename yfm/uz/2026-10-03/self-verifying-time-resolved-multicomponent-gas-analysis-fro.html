        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"247\" cy=\"78\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"653\" cy=\"258\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · PLATES_SHELLS   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Membrana sensorlari o‘z&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ko‘rsatkichlarini polimer&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;mexanikasi orqali&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;tekshirishni o‘rgandi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-f1.jpg\" alt=\"Rasm 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Gaz sensorlari laboratoriyadan tashqarida ishlatilganda, gazlarning haqiqiy konsentratsiyasi noma'lum bo'ladi, shu sababli o'lchovlarning ishonchliligini baholash qiyin. Muhandislar gaz komponentlarini aniqlash bilan birga sensorning mexanik javobini ham tiklaydigan dinamik inversiya tizimini yaratdilar. Sorbtsiya kinetikasi va polimer membranalarining qovushqoq-elastiklik cheklovlari modelga o'z-o'zini tekshirish imkonini berdi. 12 kanalli MSS massivida o'tkazilgan sinovlarda algoritm alohida kanaldagi siljishlar va sezgirlik nosozliklarini aniqladi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;12 kanalli MSS massivi suv va etanolni sorbtsiya dinamikasi hamda SLS elastiklik modeli orqali ajratadi.&lt;/li&gt;\n&lt;li&gt;Kinetika va mexanika qoldiqlari optimizatsiyada MDMM usuli orqali avtomatik cheklov sifatida kiritilgan.&lt;/li&gt;\n&lt;li&gt;Kanaldagi nosozliklar tiklangan kuchlanishning real signaldan chetlashishi orqali o'z-o'zidan aniqlanadi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;O'lchov tizimi turli polimer qoplamali uchta to'rt kanalli chipdan (jami 12 kanal) iborat sirtqi mexanik kuchlanish membrana sensorlariga (MSS) asoslangan. Suv va etanol bug'lari yutilganda plyonka hajmi kengayadi va &lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon%20%3D%20(v%2F3)C_f\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; formulasiga muvofiq deformatsiyalanadi, bu yerda &lt;span class=\"yfm-latex\" data-content=\"v\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — solishtirma hajm, &lt;span class=\"yfm-latex\" data-content=\"C_f\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — plyonkadagi konsentratsiya. Qoplamaning kuchlanish holati standart chiziqli qovushqoq-elastik jism (SLS) modeli bilan tavsiflanadi: $ au_r E_U (d\\varepsilon/dt) + E_R \\varepsilon =  au_r (d\\sigma/dt) + \\sigma$, bu yerda &lt;span class=\"yfm-latex\" data-content=\"E_U\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; va &lt;span class=\"yfm-latex\" data-content=\"E_R\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; mos ravishda oniy va relaksatsiyalangan elastiklik modullari, $ au_r$ esa mexanik relaksatsiya vaqti hisoblanadi.&lt;/p&gt;\n&lt;p&gt;Teskari masalani yechish uchun TCN konvolyutsion tarmog'i va MLP perseptroni qo'llanilgan bo'lib, ular gaz konsentratsiyasi &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_g\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, ichki faza konsentratsiyasi &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_f\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; hamda tiklangan mexanik kuchlanishni &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Csigma%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; hisoblaydi. O'qitish differentsial ko'paytiruvchilar usuli (MDMM) yordamida olib borildi, bunda &lt;span class=\"yfm-latex\" data-content=\"R_1\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; sorbtsiya va &lt;span class=\"yfm-latex\" data-content=\"R_2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; mexanika qoldiq tenglamalari Lagranjian egar nuqtasida qat'iy shart sifatida bajariladi. Agar biror kanalda dreyf yoki sezgirlik buzilishi yuz bersa, hisoblangan &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Csigma%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; haqiqiy o'lchangan &lt;span class=\"yfm-latex\" data-content=\"%5Csigma\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; signalidan chetlashadi va etalonsiz nosozlikni aniqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tajriba faqat suv-etanol binar aralashmasida o'tkazilgan, noma'lum ko'p komponentli real gaz muhitlaridagi samaradorlik hali to'liq tekshirilmagan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Gaz sensorlari massivlari oʻzlarining javob naqshlari (response patterns) asosida gaz aralashmalarining tarkibini baholash imkonini beradi. Bunday tizimlarni laboratoriyadan tashqarida ishlatishdagi asosiy muammo — gazlarning haqiqiy konsentratsiyasi nomaʼlumligi, bu esa olingan natijalarning ishonchliligini tekshirishni qiyinlashtiradi. Mualliflar fizik cheklovlarga ega neyron tarmoqni (physics-constrained neural network) ishlab chiqdilar, u bir vaqtning oʻzida vaqt oʻtishi bilan oʻzgarib turadigan gaz konsentratsiyalarini baholaydi va sensor signallarini qayta tiklaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Fizik cheklovlarga ega neyron tarmoq — bu mashinali oʻqitish modeli boʻlib, unga fizik qonunlar (bu holda sorbsiya va mexanika tenglamalari) kiritilgan, bu esa modelga haqiqatga zid natijalarni chiqarishga yoʻl qoʻymaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Metod oʻn ikki kanalli membrana turidagi sirt tarangligi sensorlari massivida sinovdan oʻtkazildi. Tajriba davomida tizim vaqt oʻtishi bilan oʻzgaruvchan suv-etanol aralashmalari taʼsiriga duchor qilindi.&lt;/p&gt;\n&lt;p&gt;Model aralashmaning har ikkala komponenti uchun konsentratsiya profillarini birlamchi signallar asosida muvaffaqiyatli qayta tikladi. Tadqiqotchilar shuni koʻrsatdiki, bir kanaldagi sunʼiy siljishlar (offsets) va sezgirlik oʻzgarishlari oʻlchangan va qayta tiklangan signallar oʻrtasidagi tafovutlar orqali aniqlanadi. Bundan tashqari, oʻlchov yozuvlarining bir qismini oʻchirish yoki almashtirish holatlari sorbsiya va mexanika tenglamalarining buzilishi orqali aniqlandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ishlab chiqilgan metod yagona oʻlchov asosida avtomatik oʻzini-oʻzi tekshirish imkoniyati bilan koʻp komponentli gazlarni real vaqt rejimida tahlil qilish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot metodning laboratoriya qurilmasidagi namoyishi hisoblanadi; algoritmni nazorat qilib boʻlmaydigan shovqin darajasi yuqori boʻlgan dala sharoitlariga tatbiq etish qoʻshimcha tekshiruvni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Kvars kristalli mikrotarozi, sirt akustik toʻlqinli qurilmalar va membrana turidagi sirt kuchlanish datchiklari (MSS) kabi kimyoviy sensorlar laboratoriya muhitidan kundalik foydalanishga oʻtmoqda. Atrof-muhit monitoringi yoki nafas orqali sogʻliqni tekshirish kabi sohalarda datchiklar uzluksiz ishlashi kerak, bu esa tez-tez kalibrlash imkonini bermaydi. Anʼanaviy usullar sensorning dinamik javobini statik xususiyatlarga qisqartiradi, bu esa kalibrlashni osonlashtirsa-da, kinetik maʼlumotlarni yoʻqotadi. Ushbu ishda sensor statik oʻzgartirgich emas, balki dinamik tizim sifatida qaraladi, bunda signal gaz va retseptor qatlami oʻrtasidagi oʻzaro taʼsirning vaqt boʻyicha yozuvidir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Taklif etilgan usul sensorning dinamik javobidan foydalangan holda real vaqt rejimida gaz konsentratsiyasini baholash va tashqi etalonlarsiz maʼlumotlar ishonchliligini tekshirish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Dinamik oʻlchovlardagi asosiy muammo — taʼsir tarixi (xotira effekti) va koʻp komponentli aralashmalarni ajratish qiyinligidir. Mualliflar «cheklangan dinamik inversiya» (constrained dynamical inversion) yondashuvini qoʻllaydilar. Ushbu modelda neyron tarmoq teskari masalani hal qiladi va u sorbsiya hamda viskoelastik relaksatsiya tenglamalariga [20] qatʼiy boʻysunishi shart.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Cheklangan dinamik inversiya — bu tizimning kirish parametrlarini (gaz konsentratsiyasini) fizika qonunlariga (sorbsiya kinetikasi) boʻysunadigan neyron tarmoq orqali tiklash usuli boʻlib, u fizik jihatdan imkonsiz natijalarni chiqarib tashlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Algoritm quyidagicha ishlaydi: neyron tarmoq «xom» koʻp kanalli signalni qabul qiladi va bir vaqtning oʻzida uchta kattalikni hisoblaydi: gaz fazasidagi konsentratsiya &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_g\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, plyonkaning yashirin holati &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_f\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; va signalning oʻzini rekonstruksiya qilish &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Csigma%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Barcha uch parametr fizik tenglamalar bilan bogʻlanganligi sababli, oʻlchangan σ signal va rekonstruksiya qilingan &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Csigma%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; oʻrtasidagi muvofiqlik ichki tekshiruv mezoni boʻlib xizmat qiladi (1-rasm). Agar kanal shikastlangan boʻlsa, rekonstruksiya kirish maʼlumotlariga mos kelmay qoladi, bu esa nosozlikni aniqlash imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Usul 12 kanalli MSS massivida suv va etanol aralashmalari taʼsirida sinovdan oʻtkazilgan; boshqa turdagi gazlar yoki turli fizik sharoitlarga oʻtkazish qoʻshimcha tekshiruvni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mualliflar taklif etilgan tizim nafaqat konsentratsiya trayektoriyalarini tiklashini, balki anomaliyalarni mustaqil ravishda aniqlashini koʻrsatib, kimyoviy tahlilni naqshlarni aniqlash vazifasidan tizim holatini mantiqiy xulosa qilish vazifasiga aylantirmoqda.&lt;/p&gt;\n&lt;p&gt;Rekonstruksiya modeli (Rasm 1c) kiruvchi maʼlumot sifatida koʻp kanalli vaqtinchalik signallarni σ(t) qabul qiladi. Vaqtinchalik konvolyutsion neyron tarmoq (TCN) vaqtinchalik xususiyatlarni kodlaydi, umumiy koʻp qatlamli perseptron (MLP) esa ularni har bir vaqt qadamida uchta chiqishga dekodlaydi: taxminiy gaz fazasi konsentratsiyasi &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_g\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, retseptor plyonkalarning ichki holatini ifodalovchi plyonka fazasi konsentratsiyasi &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_f\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; va oʻlchangan signalning oʻzini rekonstruksiya qilish &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Csigma%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-f1.jpg\" alt=\"Rasm 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 1&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TCN (vaqtinchalik konvolyutsion tarmoq) — bu ketma-ketliklarni tahlil qilish uchun moʻljallangan neyron tarmoq arxitekturasi boʻlib, u vaqt oʻtishi bilan maʼlumotlar oʻrtasidagi bogʻliqlikni aniqlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu uchta chiqish sezish jarayonining boshqaruvchi tenglamalari orqali oʻzaro bogʻlangan boʻlib, ular oʻqitish jarayonida cheklov sifatida qoʻllanadi. Sorbtsiya kinetikasi gaz molekulalarining retseptor plyonkaga yutilishini belgilaydi:&lt;/p&gt;\n&lt;p&gt;&lt;span class=\"yfm-latex\" data-content=\"%5Cfrac%7Bd%5Chat%7BC%7D_f%7D%7Bdt%7D%20%3D%20%5Cfrac%7B1%7D%7B%20au_s%7D%20(K_p%5Chat%7BC%7D_g%20-%20%5Chat%7BC%7D_f)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;&lt;/p&gt;\n&lt;p&gt;bu yerda τ_s — sorbtsiya vaqt konstantasi, K_p — taqsimot koeffitsiyenti. Yutilish plyonkaning shishishiga olib keladi va kichik deformatsiya taxminida hosil boʻlgan deformatsiya &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Cvarepsilon%7D%20%3D%20(v%2F3)%5Chat%7BC%7D_f\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ga teng, bu yerda v — sorbsiyalangan moddaning solishtirma hajmi. Mexanik javob standart chiziqli qattiq jism (SLS) modeli bilan boshqariladi:&lt;/p&gt;\n&lt;p&gt;$ au_r E_U \\frac{d\\varepsilon}{dt} + E_R\\varepsilon =  au_r \\frac{d\\sigma}{dt} + \\sigma$ (2)&lt;/p&gt;\n&lt;p&gt;Bu yerda E_U va E_R — mos ravishda relaksatsiyalanmagan va relaksatsiyalangan elastiklik modullari, τ_r — mexanik relaksatsiya vaqt konstantasi. Ushbu tenglamalar C_g → C_f → σ ketma-ket bogʻliqligini oʻrnatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;R₁ va R₂ fizik cheklovlari konsentratsiyalar va mexanik javobni bogʻlab, modelning barcha chiqishlari oʻrtasida oʻzaro muvofiqlikni taʼminlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Oʻqitish davomida tenglamalar toʻgʻridan-toʻgʻri yechilmaydi, balki R₁ va R₂ qoldiqlar (3 va 4-tenglamalar) sifatida kiritiladi. Mualliflar qoldiqlarni yoʻqotish funksiyasiga belgilangan ogʻirliklar bilan qoʻshish oʻrniga, modifikatsiyalangan differensial multiplikatorlar usulidan (MDMM) foydalanadilar. Bu algoritmga multiplikatorlarni avtomatik moslashtirish va Lagranj funksiyasining egar nuqtasini topish imkonini beradi, bu esa fizik qonunlarning qatʼiy bajarilishini taʼminlaydi. Shunday qilib, tarmoq &lt;span class=\"yfm-latex\" data-content=\"L_%7BCg%7D%20%3D%20MSE(C_g%2C%20%5Chat%7BC%7D_g)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; va &lt;span class=\"yfm-latex\" data-content=\"L_V%20%3D%20MSE(%5Csigma%2C%20%5Chat%7B%5Csigma%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; maʼlumotlar xatolarini minimallashtiradi, bunda qoldiqlar minimal darajada qolishi shart. Plyonka fazasidagi &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_f\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; konsentratsiyasi hech qanday toʻgʻridan-toʻgʻri eksperimental nazoratsiz, faqat ushbu fizik cheklovlar orqali aniqlanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;MDMM usuli juda muhim, chunki u modelni fizik jarayonlarga qatʼiy rioya qilishga majbur qiladi, bu esa signal rekonstruksiyasidan maʼlumotlar yaxlitligini tekshirish uchun mustaqil vosita sifatida foydalanish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu tadqiqot taklif etilgan modelning ko‘p kanalli sensorlarning «xom» signallari asosida gazlarning dinamik konsentratsiyasini tiklash qobiliyatini baholaydi. Eksperimental qurilma 12 ta membranali sirt tarangligi datchiklaridan iborat bo‘lib, ular turli xil sorbsion va viskoelastik javoblarni ta’minlash uchun 12 xil retseptor qatlami bilan qoplangan. Sinov aralashmasi sifatida azot (N₂) orqali barbotaj qilingan suv va etanol bug‘lari ishlatilgan. Suv bug‘i gaz tahlilida asosiy xalaqit beruvchi omil bo‘lgani uchun, model uning hissasini etanol bilan teng darajada hisobga oladi. Signallar shakli to‘rtburchak, arra tishli, teskari arra tishli va Gauss taqsimoti ko‘rinishida o‘zgartirildi. Ma’lumotlar to‘plami o‘qitish uchun 150 ta va sinov uchun 50 ta ketma-ketlikni o‘z ichiga oladi, ular sinxron (umumiy to‘lqin shakli) va asinxron (mustaqil to‘lqin shakllari) rejimlariga bo‘lingan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Xom» signallar usuli ma’lumotlarni oldindan filtrlash yoki shovqinni kompensatsiya qilmasdan, bevosita datchiklardan qayta ishlashni nazarda tutadi, bu esa modeldan fizik javoblarni yuqori aniqlikda talqin qilishni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;2a, b-rasmlarda ko‘rsatilganidek, model konsentratsiyalarning vaqtinchalik tuzilishini, jumladan cho‘qqilar va signal shakllarini aniq qayta tiklaydi. Eng katta og‘ishlar keskin ko‘tarilish va tushish qirralarida kuzatiladi, bu yerda konsentratsiyaning tez o‘zgarishi sensorning sorbsion javob tezligidan oshib ketadi. Bu shuni ko‘rsatadiki, kalibrlash uchun tez-tez ishlatiladigan to‘rtburchak impulslar dinamik rekonstruksiya uchun optimal bo‘lmasligi mumkin. 2c, d-rasmlarga ko‘ra, xatolik sinxron rejimda ±2% va asinxron rejimda ±5% atrofida bo‘lib, 25% dan yuqori konsentratsiyalarda tizimli og‘ish kuzatiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Model belgilangan to‘lqin shakliga bog‘liq bo‘lmagan holda gaz konsentratsiyasi dinamikasini 5% gacha aniqlik bilan tiklaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Natijalar nazorat qilinadigan aralashmalarga ega laboratoriya modelida olingan; kutilmagan shovqinli real sharoitlarga o‘tkazish qo‘shimcha tekshiruvni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;3-rasmda turli vaqt oynalarida (to‘liq, yarim va chorak uzunlikda) gaz konsentratsiyalari, plyonka fazasi holatlari va sensor javobining birgalikdagi rekonstruksiyasi ko‘rsatilgan. Model kirish oynalari qisqarganda ham natijalarning izchilligini saqlab qoladi, bu esa algoritmining barqarorligini tasdiqlaydi.&lt;/p&gt;\n&lt;p&gt;3a,b-rasmlarda toʻliq kirish uzunligidagi vakillik test ketma-ketligi uchun rekonstruksiya koʻrsatilgan. Qayta tiklangan &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Csigma%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; signali barcha kanallar boʻyicha oʻlchangan kirish signalini aniq kuzatib boradi. Hisoblangan plyonka konsentratsiyalari &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_f\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; gaz fazasidagi &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_g\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; konsentratsiyalariga nisbatan vaqtinchalik kechikishni namoyon qiladi, bu (1)-tenglama bilan belgilangan chekli sorbsiya vaqtini aks ettiradi. Moddalar uchun xarakterli vaqt farqlari oʻrganilgan sorbsiya parametrlariga mos keladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Model samarali tarzda elastik javobga tushiriladi, chunki modullar nisbati E_U/E_R birlikka yaqinlashadi va sorbsiya vaqt konstantasi τ_s tez konsentratsiya oʻzgarishlarini filtrlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Oʻrganilgan viskoelastik parametrlar degeneratsiyani koʻrsatadi: E_U/E_R modullar nisbati barcha kanallar boʻyicha birlikka yaqin. Viskoelastik model hozirgi sharoitda elastik model kabi ishlaydi, chunki τ_s sorbsiya vaqt konstantasi tez oʻtish jarayonlarini filtrlab, viskoelastik relaksatsiyani aniqlashga imkon bermaydi. Shunga qaramay, viskoelastik cheklov &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_f%20%20o%20%5Chat%7B%5Csigma%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; yoʻlida vaqtinchalik silliqlikni taʼminlash uchun muhimdir. Kirish oynasi toʻliq uzunlikning 1/2 (3c,d-rasm) yoki 1/4 (3e,f-rasm) qismigacha qisqartirilganda, traektoriyalar markaziy qismda aniqligini saqlab qoladi, bu usulning kirish davomiyligiga bogʻliq emasligini tasdiqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Qoldiq (residual) — bu model bashorati va real maʼlumotlar oʻrtasidagi farq boʻlib, u tashqi etalonsiz tizimning muvofiqligini koʻrsatuvchi indikator hisoblanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mualliflar qayta tiklangan signal va fizik qoldiqlar sensorlardagi anomaliyalarni ikki turdagi boshqariladigan buzilishlar yordamida aniqlay olishini tekshiradilar.&lt;/p&gt;\n&lt;p&gt;Har bir test uchun bitta kanal tasodifiy tanlanadi (4a-rasm) va z-normallashtirilgan fazoda buzilishlar kiritiladi: (i) siljish (offset) σ'_j → σ'_j + δ, bu yerda &lt;span class=\"yfm-latex\" data-content=\"%5Cdelta%20%5Cin%20%5B0%2C%201%5D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (4b-rasm) va (ii) masshtablash (scale) σ'_j → α σ'_j, bu yerda &lt;span class=\"yfm-latex\" data-content=\"%5Calpha%20%5Cin%20%5B0.2%2C%201%5D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (4d-rasm). Bu buzilishlar sensorlarning tipik nosozliklarini: retseptorlarning ifloslanishi, termal siljish yoki kuchaytirish xatolarini simulyatsiya qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Model buzilgan signalni oʻrganilgan koʻp xillilikka (manifold) proyeksiyalaydi, shuning uchun &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Csigma%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; va σ oʻrtasidagi nomuvofiqlik xatolikni hisoblab chiqiladigan indikatorga aylantiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;4c,e-rasmlar shuni koʻrsatadiki, buzilishlar ostida &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_g\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; va &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_f\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; barqaror qoladi, &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Csigma%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; esa buzilgan kirishdan chetga chiqadi. Nomuvofiqlikni miqdoriy baholash uchun &lt;span class=\"yfm-latex\" data-content=\"I_%7B%5Csigma%7D%20%3D%20%20ext%7BMSE%7D(%5Csigma%2C%20%5Chat%7B%5Csigma%7D)%20%3D%20%5Cfrac%7B1%7D%7BN%7D%20%5Csum_%7Bt%3D1%7D%5EN%20(%5Csigma_i%20-%20%5Chat%7B%5Csigma%7D_i)%5E2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; koʻrsatkichi kiritiladi. 4g-rasmda koʻrsatilganidek, Iσ siljish ortishi bilan chiziqli oʻsadi. Masshtablash uchun (4h-rasm) tez oʻsish va keyingi toʻyinish kuzatiladi. Usul nosoz kanalni aniqlashga imkon beradi, chunki u uchun Iσ qiymati boshqa kanallarga qaraganda sezilarli darajada yuqori.&lt;/p&gt;\n&lt;p&gt;Signal amplitudasi oʻzgarishi Iσ metriki orqali oson aniqlanadi, biroq baʼzi anomaliyalar signal darajasida sezilmay qolishi mumkin. Buni koʻrsatish uchun mualliflar «segmentni oʻchirish» (deletionsplice) usulini qoʻllashdi: test ketma-ketligidan vaqtinchalik qism olib tashlanadi va qolgan qismlar birlashtiriladi (Rasm 5a). Bunday uzilishlar maʼlumotlar buferlari toʻlib ketganda yoki datchik qayta ishga tushganda yuz beradi. Signal qiymatlari oʻqitish taqsimotiga mos kelgani uchun, model &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Csigma%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ni xatosiz qayta tiklaydi va Iσ bazaviy darajada qoladi (Rasm 5b).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-f5.jpg\" alt=\"Rasm 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 5&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;R₁ va R₂ fizik qoldiqlari signal statistikasi orqali aniqlab boʻlmaydigan maʼlumotlar uzilishlarini aniqlash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biroq, model chiqishlari asosida hisoblangan R₁ (sorbsiya) va R₂ (viskoelastik) fizik qoldiqlari uzilish nuqtasida keskin oʻsishni koʻrsatadi (Rasm 5c). Vaqtinchalik uzluksizlikning buzilishi (1)–(2) tenglamalarga zid keladi va bu qoldiqlar orqali aniqlanadi. Test toʻplami boʻyicha issiqlik xaritalari (heatmaps) ushbu «qaynoq nuqtalar» barqaror ekanligini tasdiqlaydi (Rasm 5d).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Fizik qoldiq — bu model bashoratining tizimning asosiy fizik qonuniyatlaridan chetga chiqish darajasi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;«Segmentni almashtirish» (substitution splice) testida 70–90 s oraligʻi boshqa yozuvdagi mos qism bilan almashtiriladi (Rasm 5e). Barcha maʼlumotlar haqiqiy boʻlsa-da, ulanish joylarida dinamik uzilishlar yuzaga keladi. Bunda Iσ oʻrtacha 7% dan kamroqqa oʻsadi, bu bazaviy shovqin doirasida qoladi, ammo R₁ va R₂ har ikkala tahrirlash joyini aniq koʻrsatadi (Rasm 5f). Shunday qilib, fizik muvofiqlik faqat statistik usullar bilan aniqlab boʻlmaydigan maʼlumotlar soxtalashtirilishini fosh etadi.&lt;/p&gt;\n&lt;p&gt;Tajribalar shuni koʻrsatadiki, Iσ va R₁/R₂ har xil turdagi anomaliyalarga javob beradi. Signal siljishi yoki masshtablanishida Iσ oʻsadi, R₁ va R₂ esa barqaror qoladi, chunki model buzilgan kirishni ichki dinamikani buzmasdan oʻqitilgan manifoldga proyeksiyalaydi. Uzilishlar (splice) holatida esa vaziyat teskari: Iσ uzilishni koʻrmaydi, fizik qoldiqlar esa uni bevosita aniqlaydi. Ular birgalikda koʻp darajali diagnostikani tashkil etadi: Iσ global taqsimot siljishlarini, R₁ va R₂ esa dinamikaning lokal buzilishlarini qayd etadi.&lt;/p&gt;\n&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;p&gt;Biz koʻp kanalli datchik signallari asosida gaz aralashmalarining vaqt boʻyicha oʻzgaruvchan konsentratsiyalarini qayta tiklovchi cheklangan dinamik inversiya tizimini taqdim etdik. Tizim belgilangan toʻlqin shakli, oldindan belgilangan kirish davomiyligi yoki muvozanat xususiyatlarini talab qilmaydi. Model ham sinxron, ham asinxron aralashish sharoitida konsentratsiya trayektoriyalarini barqaror tiklaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Model datchik javobini &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Csigma%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; va konsentratsiyalarni &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_g\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; bir vaqtda qayta tiklash orqali oʻz-oʻzini tekshirish funksiyasini amalga oshiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Oʻz-oʻzini tekshirish ikki usulda amalga oshiriladi: signal nomuvofiqligi koʻrsatkichi Iσ (global siljishlarni aniqlaydi) va fizik qoldiqlar R₁ va R₂ (lokal dinamik buzilishlarni qayd etadi). Bu usullar etalon maʼlumotlarsiz xatoliklarni aniqlash imkonini beradi.&lt;/p&gt;\n&lt;h4 id=\"diagnostika-va-malumotlar-yaxlitligi\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#diagnostika-va-malumotlar-yaxlitligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Diagnostika va maʼlumotlar yaxlitligi&lt;/span&gt;&lt;/a&gt;Diagnostika va maʼlumotlar yaxlitligi&lt;/h4&gt;\n&lt;p&gt;Eksperimentlar shuni koʻrsatdiki, diagnostika vositalari xatolikning sababiga emas, balki fizik nomuvofiqlik sinfiga javob beradi. Masalan, kanaldagi siljish datchik ifloslanishi yoki oʻqish zanjiridagi xatolikdan kelib chiqishi mumkin. Tizim muammoni lokalizatsiya qiladi, ammo sababini aniqlash tashqi kontekstni talab qiladi. Texnik xizmat koʻrsatishda Iσ datchik sezgirligining pasayishini aniqlash uchun xizmat qiladi. Maʼlumotlar yaxlitligini tekshirishda fizik qoldiqlar maʼlumotlarni oʻchirish va almashtirish holatlarini muvaffaqiyatli aniqladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tizim toʻliq autentifikatsiya tizimi emas, lekin qoʻshimcha uskunalarsiz fizik asoslangan tekshiruvni qoʻshadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"cheklovlar-va-istiqbollar\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#cheklovlar-va-istiqbollar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va istiqbollar&lt;/span&gt;&lt;/a&gt;Cheklovlar va istiqbollar&lt;/h4&gt;\n&lt;p&gt;Joriy tajribalar faqat suv va etanolning binar aralashmalari bilan cheklangan. Nazariy jihatdan murakkabroq aralashmalarga oʻtish mumkin, ammo maʼlum kanallar soni uchun qancha gaz komponentini aniqlash mumkinligi ochiq savol boʻlib qolmoqda. Hozirgi sharoitda (EU/ER ≈ 1) SLS modeli elastik javobga tenglashadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Fizik qoldiqlar — bu model bashorati va haqiqiy oʻlchov oʻrtasidagi farq boʻlib, fizik qonuniyatlarning buzilishini koʻrsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Model oʻquv maʼlumotlari doirasidagi dinamikani toʻgʻri tasvirlaydi deb faraz qilinadi. Agar haqiqiy dinamika oʻzgarsa, fizik qoldiqlar Iσ oʻzgarmasdan turib ortishi mumkin. Shuningdek, tizim fizik qonunlarga toʻliq mos keladigan soxta yozuvlarni (masalan, oldindan yozib olingan toza maʼlumotlarni qayta ijro etish) aniqlay olmaydi. Kelajakda murakkabroq aralashmalar va avtomatlashtirilgan qaror qabul qilish protokollarini integratsiya qilish rejalashtirilgan.&lt;/p&gt;\n&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"51-sensorlar-massivi-va-eksperimental-olchovlar\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#51-sensorlar-massivi-va-eksperimental-olchovlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5.1 Sensorlar massivi va eksperimental oʻlchovlar&lt;/span&gt;&lt;/a&gt;5.1 Sensorlar massivi va eksperimental oʻlchovlar&lt;/h4&gt;\n&lt;p&gt;Sensorlar massivi uchun 12 xil polimer retseptorlari bilan qoplangan MSS chiplari ishlatildi: PVF, PS, PCL, PMMA, CAB, TENAX, P4MS, PSF, PVP, PVC, PMVE va PBA. Polimerlar N,N-dimetilformamid (DMF) yoki 1,1,2,2-tetraxloroetanda (TCE) eritilib, IJHBS-300 nozulli struyli printer (LaboJet-500SP) yordamida chiplarga tushirildi. Erituvchi 60 °C da bugʻlantirildi va namunalar 24 soat davomida xona haroratida quritildi. Oʻlchov kamerasiga uchta toʻrt kanalli chip oʻrnatildi. Sensor signallari 100 Gts chastotada yozib olindi va tahlil uchun 20 Gts gacha pasaytirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Struyli purkash (inkjet spotting) — sensor yuzasiga polimer eritmasini mikrodozalarda aniq taqsimlash usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"52-gaz-yetkazib-berish-protokollari\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#52-gaz-yetkazib-berish-protokollari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5.2 Gaz yetkazib berish protokollari&lt;/span&gt;&lt;/a&gt;5.2 Gaz yetkazib berish protokollari&lt;/h4&gt;\n&lt;p&gt;Suv va etanol bugʻlarining dinamik binar aralashmalari uchta massa oqimi regulyatori (MFC) va tashuvchi gaz sifatida azot (N2) yordamida hosil qilindi. Aralashma tarkibi toʻrt xil toʻlqin shakli (toʻgʻri toʻrtburchakli, arra tishli, teskari arra tishli va Gauss) boʻyicha boshqarildi. Har bir oʻlchov sikli 240 s davom etdi: tozalash (20 s), faol inyeksiya (120 s) va yakuniy tozalash (100 s). Ikki rejim qoʻllanildi: sinxron va asinxron aralashtirish. Oʻqitish toʻplami 150 ta, test toʻplami 50 ta ketma-ketlikdan iborat. Maʼlumotlar 160 s (3200 vaqt bosqichi) gacha qisqartirildi.&lt;/p&gt;\n&lt;h4 id=\"53-fizikaga-asoslangan-model\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#53-fizikaga-asoslangan-model\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5.3 Fizikaga asoslangan model&lt;/span&gt;&lt;/a&gt;5.3 Fizikaga asoslangan model&lt;/h4&gt;\n&lt;p&gt;Dinamika ikki bosqichdan iborat. Sorbtsiya kinetikasi (1-tenglama) massa oʻtishini τ_s va K_p parametrlari bilan tavsiflaydi. Mexanik javob standart chiziqli qattiq jism modeliga (2-tenglama) asoslanadi va &lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon%20%3D%20(v%2F3)%20C_f\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; nisbati orqali plyonka konsentratsiyasi bilan bogʻlanadi. n ta sensor va g ta gaz uchun har bir juftlik uchun τ_s, K_p va har bir sensor uchun viskoelastik parametrlar (τ_r, E_U, E_R) alohida oʻrganiladigan kattaliklardir.&lt;/p&gt;\n&lt;h4 id=\"54-neyron-tarmoq-arxitekturasi\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#54-neyron-tarmoq-arxitekturasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5.4 Neyron tarmoq arxitekturasi&lt;/span&gt;&lt;/a&gt;5.4 Neyron tarmoq arxitekturasi&lt;/h4&gt;\n&lt;p&gt;Model 11 qatlamli no-kausal vaqtinchalik konvolyutsion tarmoqdan (TCN) iborat (kengayish faktorlari &lt;span class=\"yfm-latex\" data-content=\"2%5E0%2C%20%5Cdots%2C%202%5E%7B10%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, yadro oʻlchami 3, 64 kanal). Retseptiv maydon 4095 vaqt bosqichini qamrab oladi. TCN chiqishi 512 ta neyronli ikkita yashirin qatlamli umumiy MLP orqali dekodlanadi va &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BC%7D_g%2C%20%5Chat%7BC%7D_f%2C%20%5Chat%7B%5Csigma%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ni bashorat qilish uchun 128 ta neyronli uchta chiqish blokiga ulanadi. Har bir qatlamdan keyin dropout (p=0.1) qoʻllanadi.&lt;/p&gt;\n&lt;h4 id=\"55-oqitish-maqsadlari-va-cheklovlar\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#55-oqitish-maqsadlari-va-cheklovlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5.5 Oʻqitish maqsadlari va cheklovlar&lt;/span&gt;&lt;/a&gt;5.5 Oʻqitish maqsadlari va cheklovlar&lt;/h4&gt;\n&lt;p&gt;Maqsadli funksiya — signal rekonstruksiyasi &lt;span class=\"yfm-latex\" data-content=\"L_V%20%3D%20MSE(V%2C%20%5Chat%7BV%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; va konsentratsiyani bashorat qilish &lt;span class=\"yfm-latex\" data-content=\"L_%7BCg%7D%20%3D%20MSE(C_g%2C%20%5Chat%7BC%7D_g)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; xatolarining yigʻindisi. Fizik qoldiqlar R₁, R₂ va E_U/E_R ≥ 1 cheklovi modifikatsiyalangan differensial multiplikatorlar usuli (MDMM) orqali kiritiladi. Optimallashtirish Adan algoritmi va ReduceLROnPlateau jadvali (boshlangʻich tezlik 10⁻³, minimal 10⁻⁵) yordamida amalga oshiriladi. Oʻqitish 800 epoxa sabr chegarasida toʻxtatiladi.&lt;/p&gt;\n&lt;h4 id=\"56-perturbatsiya-eksperimentlari\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#56-perturbatsiya-eksperimentlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5.6 Perturbatsiya eksperimentlari&lt;/span&gt;&lt;/a&gt;5.6 Perturbatsiya eksperimentlari&lt;/h4&gt;\n&lt;p&gt;Oʻqitishdan soʻng tarmoq parametrlari muzlatiladi. Global perturbatsiyalar: siljish (bazis dreyfini imitatsiya qilish uchun &lt;span class=\"yfm-latex\" data-content=\"%5Cdelta%20%5Cin%20%5B0%2C%201%5D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; qoʻshish) va masshtablash (sezgirlik degradatsiyasini imitatsiya qilish uchun &lt;span class=\"yfm-latex\" data-content=\"%5Calpha%20%5Cin%20%5B0.2%2C%201%5D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ga koʻpaytirish). Splayse-perturbatsiyalar: vaqtinchalik segmentni oʻchirish va oʻrnini almashtirish (70–90 s segmentini boshqa ketma-ketlik bilan almashtirish), bu yozuvlarni tahrirlashni imitatsiya qiladi.&lt;/p&gt;\n&lt;h4 id=\"57-baholash-metrikalari\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#57-baholash-metrikalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5.7 Baholash metrikalari&lt;/span&gt;&lt;/a&gt;5.7 Baholash metrikalari&lt;/h4&gt;\n&lt;p&gt;Konsentratsiyani rekonstruksiya qilish aniqligi barcha test ketma-ketliklari boʻylab rekonstruksiya qilingan va haqiqiy konsentratsiya trayektoriyalari oʻrtasidagi oʻrtacha kvadratik xatolik (RMSE) hamda determinatsiya koeffitsiyenti (R²) yordamida baholanadi. Signalning nomutanosibligi Iσ (5-tenglama) har bir kanal uchun oʻlchangan kirish signali va rekonstruksiya qilingan signal oʻrtasidagi oʻrtacha kvadratik xatolikni miqdoriy jihatdan aniqlaydi. Fizik qoldiqlar R₁ va R₂ (3–4-tenglamalar) har bir trayektoriya boʻylab nuqtali tarzda baholanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RMSE rekonstruksiya qilingan qiymatlarning haqiqiy qiymatlardan oʻrtacha ogʻishini koʻrsatadi, R² esa model tushuntira oladigan dispersiya ulushini aks ettiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Kanal boʻyicha RMSE, R² qiymatlari va xatoliklarning kümülatif taqsimoti 5-qoʻshimcha eslatmada keltirilgan.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 1.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-tT1.jpg\" alt=\"Jadval 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-f2.jpg\" alt=\"Rasm 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-f3.jpg\" alt=\"Rasm 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-f4.jpg\" alt=\"Rasm 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 4&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS2.jpg\" alt=\"S2-rasm. Beshta mustaqil, turlicha tasodifiy boshlangʻich qiymatlarga ega boʻlgan ishga tushirishlar boʻyicha fizik mode\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S2-rasm. Beshta mustaqil, turlicha tasodifiy boshlangʻich qiymatlarga ega boʻlgan ishga tushirishlar boʻyicha fizik model uchun oʻqitish va validatsiya yoʻqotishlari egri chiziqlari.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;S2-rasm. Beshta mustaqil, turlicha tasodifiy boshlangʻich qiymatlarga ega boʻlgan ishga tushirishlar boʻyicha fizik model uchun oʻqitish va validatsiya yoʻqotishlari egri chiziqlari. Uzluksiz chiziqlar: mediana; shtrixlangan sohalar: minimal va maksimal qiymatlar oraligʻi. Yuqori qator: umumiy yoʻqotishlar, LC konsentratsiya yoʻqotishlari va LV signalni rekonstruksiya qilish yoʻqotishlari. Pastki qator: R2 1 (sorbsiya) va R2 2 (viskoelastik) fizik qoldiqlarining kvadratlari.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS3.jpg\" alt=\"S3-rasm. Eksperimental qurilma sxemasi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S3-rasm. Eksperimental qurilma sxemasi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;S3-rasm. Eksperimental qurilma sxemasi. MFC-1 va MFC-2 mos ravishda etanol va suv boʻlgan barbotyorlar orqali N2 ni oʻtkazadi. MFC-3 suyultiruvchi N2 ni taʼminlaydi. Gaz aralashmasi 12 kanalli MSS matritsasini oʻz ichiga olgan datchik kamerasiga yuboriladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS4.jpg\" alt=\"S4-rasm. MFC larni boshqarish uchun ishlatiladigan toʻrt xil toʻlqin shakli: toʻgʻri burchakli, arra tishli, teskari arr\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S4-rasm. MFC larni boshqarish uchun ishlatiladigan toʻrt xil toʻlqin shakli: toʻgʻri burchakli, arra tishli, teskari arra tishli va Gauss shakli.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS5.jpg\" alt=\"S5-rasm. Sinxron (yuqori) va asinxron (pastki) aralashtirish sharoitidagi gaz fazasidagi Cg konsentratsiyasining repreze\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S5-rasm. Sinxron (yuqori) va asinxron (pastki) aralashtirish sharoitidagi gaz fazasidagi Cg konsentratsiyasining reprezentativ profillari. Sinxron rejimda ikkala komponent ham bir xil toʻlqin shakliga ega; asinxron rejimda har bir komponent mustaqil toʻlqin shakliga amal qiladi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS6.jpg\" alt=\"S6-rasm. S5-rasmdagi konsentratsiya profillariga mos keladigan sinxron (yuqori) va asinxron (pastki) aralashtirish sharo\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S6-rasm. S5-rasmdagi konsentratsiya profillariga mos keladigan sinxron (yuqori) va asinxron (pastki) aralashtirish sharoitidagi 12 kanalli datchikning reprezentativ chiqish signallari.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS7.jpg\" alt=\"S7-rasm. Beshta mustaqil oʻqitish sikli boʻyicha jamlangan har bir datchik kanali uchun tiklangan fizik parametrlar (oʻr\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S7-rasm. Beshta mustaqil oʻqitish sikli boʻyicha jamlangan har bir datchik kanali uchun tiklangan fizik parametrlar (oʻrtacha ± standart ogʻish).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;S7-rasm. Beshta mustaqil oʻqitish sikli boʻyicha jamlangan har bir datchik kanali uchun tiklangan fizik parametrlar (oʻrtacha ± standart ogʻish). Yuqorida: etanol va suv uchun sorbsiya vaqt konstantasi 𝜏𝑠. Oʻrtada: modullar nisbati 𝐸𝑈/𝐸𝑅. Pastda: mexanik relaksatsiya vaqt konstantasi 𝜏𝑟.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS8.jpg\" alt=\"S8-rasm. Uchta model varianti boʻyicha vakillik test ketma-ketligini rekonstruksiya qilish.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S8-rasm. Uchta model varianti boʻyicha vakillik test ketma-ketligini rekonstruksiya qilish.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;S8-rasm. Uchta model varianti boʻyicha vakillik test ketma-ketligini rekonstruksiya qilish. Yuqori qator: etanol va suv uchun haqiqiy maʼlumotlar (uzluksiz chiziq) ustiga qoʻyilgan 𝐶𝑔 bashoratlari (shtrixli chiziq). Oʻrta qator: bitta vakillik kanali (PVF) uchun kirish maʼlumotlariga nisbatan rekonstruksiya qilingan ̂𝜎 signali. Pastki qator: ikkala gaz turi uchun plyonka fazasidagi konsentratsiyaning oʻzgarishi Δ𝐶𝑓 = 𝐶𝑓(𝑡) − 𝐶𝑓(0).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS9.jpg\" alt=\"S9-rasm. 50 ta normal test ketma-ketligidagi oʻz-oʻzini tekshirish metrikalarining yadroviy zichlik baholari.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S9-rasm. 50 ta normal test ketma-ketligidagi oʻz-oʻzini tekshirish metrikalarining yadroviy zichlik baholari.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;S9-rasm. 50 ta normal test ketma-ketligidagi oʻz-oʻzini tekshirish metrikalarining yadroviy zichlik baholari. Chapda: signal nomutanosibligi 𝐼𝜎. Oʻrtada: oʻrtacha sorbsiya qoldigʻi /ℛ1/. Oʻngda: oʻrtacha viskoelastik qoldiq /ℛ2/. Qiymatlar har bir ketma-ketlikdagi har bir kanal uchun hisoblangan (har bir model uchun 600 ta qiymat).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS10.jpg\" alt=\"S10-rasm. 12 ta datchik kanalining har biri uchun additiv siljish kattaligining funksiyasi sifatida signal nomutanosibli\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S10-rasm. 12 ta datchik kanalining har biri uchun additiv siljish kattaligining funksiyasi sifatida signal nomutanosibligi 𝐼𝜎. Kichik rasm: siljish = 0 boʻlgandagi KDE taqsimotlari har bir model uchun bazaviy 𝐼𝜎 darajasini koʻrsatadi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS11.jpg\" alt=\"S11-rasm. 12 ta datchik kanalining har biri uchun multiplikativ masshtab koeffitsiyentining funksiyasi sifatida signal n\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S11-rasm. 12 ta datchik kanalining har biri uchun multiplikativ masshtab koeffitsiyentining funksiyasi sifatida signal nomutanosibligi 𝐼𝜎. Kichik rasm: masshtab koeffitsiyenti = 1 boʻlgandagi KDE taqsimotlari har bir model uchun bazaviy 𝐼𝜎 darajasini koʻrsatadi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS12.jpg\" alt=\"S12-rasm. Kirishdagi buzilishlar ostidagi ℛ1 sorbsiya qoldiq qiymati.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S12-rasm. Kirishdagi buzilishlar ostidagi ℛ1 sorbsiya qoldiq qiymati.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;S12-rasm. Kirishdagi buzilishlar ostidagi ℛ1 sorbsiya qoldiq qiymati. (a, c) ℛ1 ning oʻrtacha qiymati siljish (a) va kuchaytirish (c) buzilish kattaligining funksiyasi sifatida. Shtrixlangan hududlar standart chetlanishni koʻrsatadi. (b, d) Siljish (b) va kuchaytirish (d) sharoitlari uchun tanlangan buzilish kattaliklarida ℛ1 taqsimoti. Binafsha rang: buzilgan kanal; kulrang: buzilmagan kanallar; toʻq kulrang: bazaviy daraja (buzilishsiz).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS13.jpg\" alt=\"S13-rasm. Kirishdagi buzilishlar ostidagi ℛ2 viskoelastik qoldiq qiymati, tuzilishi S12-rasm bilan bir xil. ℛ2 𝐼𝜎 ning m\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S13-rasm. Kirishdagi buzilishlar ostidagi ℛ2 viskoelastik qoldiq qiymati, tuzilishi S12-rasm bilan bir xil. ℛ2 𝐼𝜎 ning monoton oʻsishidan farqli oʻlaroq, har ikkala turdagi buzilishlarda ham nisbatan barqaror qoladi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS14.jpg\" alt=\"S14-rasm. 𝐼𝜎 va fizik qoldiq qiymatlarning bir-birini toʻldirishini koʻrsatuvchi ketma-ketlikdan fragmentni oʻchirish.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S14-rasm. 𝐼𝜎 va fizik qoldiq qiymatlarning bir-birini toʻldirishini koʻrsatuvchi ketma-ketlikdan fragmentni oʻchirish.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;S14-rasm. 𝐼𝜎 va fizik qoldiq qiymatlarning bir-birini toʻldirishini koʻrsatuvchi ketma-ketlikdan fragmentni oʻchirish. Chap ustun: oʻchirilgan fragmentli ketma-ketlik (t=85 s da 100 ta nuqta oʻchirilgan, qizil shtrixli chiziq). Oʻng ustun: normal etalon ketma-ketlik (qizil shtrixlangan chiziq oʻchirilgan segmentni koʻrsatadi). Yuqoridan pastga qatorlar: kirish signali, rekonstruksiya qilingan 𝜎, vaqtga bogʻliq 𝐼𝜎(𝑡), rekonstruksiya qilingan ̂𝐶𝑔, ℛ1 sorbsiya qoldiq qiymati va ℛ2 viskoelastik qoldiq qiymati. t=0 dagi KDE taqsimotlari normal test maʼlumotlari boʻyicha bazaviy taqsimotlarni koʻrsatadi. Uzilish nuqtasi ℛ1 va ℛ2 da keskin sakrashlarni keltirib chiqaradi, ammo 𝐼𝜎 da sezilarli oʻzgarishlarni keltirib chiqarmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS15.jpg\" alt=\"S15-rasm. Ketma-ketlik fragmentini almashtirish uchun modelning vakillik chiqish maʼlumotlari. 70–90 s segmenti boshqa t\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S15-rasm. Ketma-ketlik fragmentini almashtirish uchun modelning vakillik chiqish maʼlumotlari. 70–90 s segmenti boshqa test ketma-ketligining mos segmenti bilan almashtirilgan; shtrixli chiziqlar ikkita tutashuv nuqtasini belgilaydi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS16.jpg\" alt=\"S16-rasm. Oʻchirish (yuqori qator) va almashtirish (pastki qator) uchun kanal boʻyicha tutashuvni aniqlash statistikasi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S16-rasm. Oʻchirish (yuqori qator) va almashtirish (pastki qator) uchun kanal boʻyicha tutashuvni aniqlash statistikasi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;S16-rasm. Oʻchirish (yuqori qator) va almashtirish (pastki qator) uchun kanal boʻyicha tutashuvni aniqlash statistikasi. Qutilar 50 ta test ketma-ketligi boʻyicha tutashuv(lar)dan ±1 s oraligʻidagi eng yuqori mutlaq qoldiq taqsimotini koʻrsatadi, ℛ1 sorbsiya qoldiq qiymati (ikkita gaz boʻyicha maksimum, chap ustun) va ℛ2 viskoelastik qoldiq qiymati (oʻng ustun) uchun. Kulrang romblar har bir yozuvning qolgan qismi boʻyicha mutlaq qoldiqning 99-persentili boʻyicha medianani belgilaydi. Eslatma: logarifmik shkala.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS17.jpg\" alt=\"S17-rasm. Sinov toʻplami boʻyicha etanol va suv konsentratsiyasini rekonstruksiya qilishning oʻrtacha kvadratik xatosi (\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S17-rasm. Sinov toʻplami boʻyicha etanol va suv konsentratsiyasini rekonstruksiya qilishning oʻrtacha kvadratik xatosi (RMSE). Asinxron aralashtirish (chapda) va sinxron aralashtirish (oʻngda). Xatolik chiziqlari standart ogʻishni koʻrsatadi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS18.jpg\" alt=\"S18-rasm. 12 ta sensor kanalining har biri uchun rekonstruksiya qilingan signalning kumulyativ oʻrtacha kvadratik xatosi\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S18-rasm. 12 ta sensor kanalining har biri uchun rekonstruksiya qilingan signalning kumulyativ oʻrtacha kvadratik xatosi (RMSE). Asinxron aralashtirish (chapda) va sinxron aralashtirish (oʻngda). Xatolik chiziqlari standart ogʻishni koʻrsatadi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS19.jpg\" alt=\"S19-rasm. 12 ta sensor kanali boʻyicha rekonstruksiya qilingan signal uchun R² taqsimoti.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S19-rasm. 12 ta sensor kanali boʻyicha rekonstruksiya qilingan signal uchun R² taqsimoti.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;S19-rasm. 12 ta sensor kanali boʻyicha rekonstruksiya qilingan signal uchun R² taqsimoti. Asinxron aralashtirish (chapda) va sinxron aralashtirish (oʻngda). Skripka diagrammalari toʻliq taqsimotni koʻrsatadi; markerlar ekstremal qiymatlarni belgilaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro-fS20.jpg\" alt=\"S20-rasm. Ishorasi oʻzgartirilgan kirish signali (barcha kanallar −1 ga koʻpaytirilgan). Yuqoridan pastga qatorlar: kiri\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S20-rasm. Ishorasi oʻzgartirilgan kirish signali (barcha kanallar −1 ga koʻpaytirilgan). Yuqoridan pastga qatorlar: kirish signali, rekonstruksiya qilingan Cg, kirish signaliga nisbatan rekonstruksiya qilingan 𝜎 va bitta vakillik kanali (PVF) uchun ΔCf.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-03/self-verifying-time-resolved-multicomponent-gas-analysis-fro.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Sensorlarning&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;kalibrovkasiz&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;xatoligi&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Polimer&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;mexanikasi&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;bilan&lt;/text&gt;&lt
