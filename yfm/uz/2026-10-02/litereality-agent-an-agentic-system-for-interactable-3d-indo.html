            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"84\" cy=\"117\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"676\" cy=\"166\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · DIGITAL_TWIN   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;LiteReality-Agent: xona&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;skanlarini simulyatsiya&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;uchun kodga aylantirish&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-f1.jpg\" alt=\"Rasm 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;LiteReality-Agent interyerlarni 3D rekonstruksiya qilishni grafikadan dasturlash sohasiga o'tkazadi. Tizim xonaning geometriyasi, obyektlar artikulyatsiyasi va fizik xususiyatlarini tavsiflovchi Room.py faylini yaratadi. Bu yondashuv sahnani tahrirlash va robototexnika simulyatorlarida ishlatishni osonlashtiradi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Sahnani bajariladigan Python kodi sifatida rekonstruksiya qilish&lt;/li&gt;\n&lt;li&gt;O'lchash va renderlash orqali tekshirish sikli&lt;/li&gt;\n&lt;li&gt;Fizik simulyatorlar bilan to'liq moslik&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tizim ikki bosqichda ishlaydi: sahnani ishga tushirish va agentli tahrirlash. Birinchi bosqichda RGB-D skanerlash ma'lumotlari «rejalashtirish agenti» tomonidan qayta ishlanadi, u to'qnashuvlarni aniqlaydi va obyektlar o'rtasidagi bog'liqlikni o'rnatadi. Butun sahna devorlar va buyumlar aniq fizik atributlarga ega bo'lgan graf ko'rinishida taqdim etiladi.&lt;/p&gt;\n&lt;p&gt;«Kuzatish-tahrirlash-tekshirish» (observe-edit-verify) sikli AI-agentga Room.py faylini iterativ tarzda aniqlashtirish imkonini beradi. Agent metrikalarni o'lchash, renderlarni solishtirish va obyektlarni qo'llab-quvvatlashni tekshirish uchun maxsus vositalardan foydalanadi. Statik setkalardan farqli o'laroq, yakuniy kod yuqori geometrik aniqlikni va MuJoCo muhitida fizik modellashtirishga tayyorlikni ta'minlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Yakuniy model sifati dastlabki RGB-D ma'lumotlarining aniqligiga va ishlatiladigan til modelining imkoniyatlariga bog'liq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;h4 id=\"related-work\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#related-work\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RELATED WORK&lt;/span&gt;&lt;/a&gt;RELATED WORK&lt;/h4&gt;\n&lt;p&gt;Indoor Reconstruction and Real-to-Sim. Ichki makonlarni real ma'lumotlar asosida qayta tiklash usullari ikki turga bo'linadi: tayyor CAD modellarni nuqtalar buluti bilan moslashtiruvchi ob'ektga yo'naltirilgan usullar (Avetisyan et al., 2019; Kuo et al., 2020; Gao et al., 2024) va sahna ko'rinishi hamda geometriyasini tiklovchi neyron tarmoq tasvirlariga (NeRF, 3DGS) asoslangan usullar (Mildenhall et al., 2020; Kerbl et al., 2023; Ni et al., 2025). LiteReality (Huang et al., 2025b) va MetaScenes (Yu et al., 2025) tizimlari skanerlash natijalarini aktivlarga asoslangan interaktiv muhitlarga aylantiradi. Video2Game (Xia et al., 2024), DRAWER (Xia et al., 2025b) va HoloScene (Xia et al., 2025a) loyihalari bevosita videodan uch o'lchamli dunyolarni tiklaydi, bunda DRAWER qo'shimcha ravishda harakatlanuvchi qismlarning bo'g'imlarini (artikulyatsiyasini) aniqlaydi. FIRE3D (Xia et al., 2026a) to'g'ridan-to'g'ri tarqaladigan neyron tarmoq yordamida sahnaning tarkibiy aktivlarini bashorat qiladi. Robotlarni o'qitish sohasida Phone2Proc (Deitke et al., 2023) mobil tasvirlar orqali protsedurali muhitlarni yaratadi, RialTo (Torne et al., 2024) boshqaruv strategiyalarini mukammallashtirish uchun raqamli egizaklarni quradi, PolaRiS (Jain et al., 2026) esa ularni baholash uchun muhitni qayta tiklaydi. O'z navbatida, ACDC (Dai et al., 2025) o'xshash, ammo aynan bir xil bo'lmagan aktivlardan foydalangan holda \"raqamli amakivachchalar\" (digital cousins) yaratadi.&lt;/p&gt;\n&lt;p&gt;Object Generation and Articulation. Tasvirlar asosida 3D ob'ektlarni yaratish usullari ko'p ko'rinishli sintezdan (Liu et al., 2023b; 2024; 2023a; Long et al., 2024) tortib yirik rekonstruksiya va generativ modellargacha (Hong et al., 2024; Xu et al., 2024; Xiang et al., 2026; Hunyuan3D et al., 2025; Chen et al., 2026b) farqlanadi. CAST (Yao et al., 2025) yaratilgan ob'ektlarni sahna ichida moslashtiradi, URDFormer (Chen et al., 2024) esa tasvirlardan bo'g'imli simulyatsiya muhitlarini tiklaydi. Real2Code (Mandi et al., 2025) bo'g'im parametrlarini bajariladigan kod ko'rinishida bashorat qiladi, Articulate-Anything (Le et al., 2025) esa artikulyatsiya dasturlarini ketma-ket yaratadi va tahrirlaydi. Articraft (Zhou et al., 2026) dasturiy aktivlar generatsiyasini maxsus SDK va tekshirish muhiti bilan birlashtiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Artikulyatsiya (articulation) uch o'lchamli modellashtirishda ob'ektning harakatlanuvchi birikmalari (masalan, shkaf eshigi yoki tortma) tavsifi bo'lib, jismoniy simulyatsiya uchun erkinlik darajalari, aylanish o'qlari va harakat chegaralarini belgilaydi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Language-Guided Scene Authoring. LayoutGPT (Feng et al., 2023) va Holodeck (Yang et al., 2024) matnli tavsiflar asosida xona loyihalarini yaratadi. FirePlace (Huang et al., 2025a) va LayoutVLM (Sun et al., 2025b) geometrik yoki vizual qayta aloqa orqali mebellarni joylashtirishni optimallashtiradi. 3D-GPT (Sun et al., 2025a), SceneCraft (Hu et al., 2024) va LL3M (Lu et al., 2025) tizimlarida 3D sahnalarni dasturiy yaratish uchun til modellaridan foydalaniladi. The Scene Language (Zhang et al., 2025) sahnaning tuzilishi va ko'rinishini tasvirlash uchun kod, matn va embeddinglarni birlashtiradi. SceneSmith (Pfaff et al., 2026), SAGE (Xia et al., 2026b) va SceneWeaver (Yang et al., 2025) ko'p agentli sahna yaratish konveyerlari ishini tashkil qiladi. Blender-Alchemy (Huang et al., 2024) vizual nazorat ostida tahrirlashni tadqiq qiladi, BlenderGym (Gu et al., 2025) esa grafikani dasturiy tahrirlash uchun benchmark bo'lib xizmat qiladi.&lt;/p&gt;\n&lt;p&gt;Agentic Inverse Graphics. SceneScript (Avetisyan et al., 2024) va IG-LLM (Kulits et al., 2024) vizual ma'lumotlardan sahnaning tuzilmaviy tavsiflarini ajratib oladi. VIGA (Yin et al., 2026) \"kod — renderlash — natijalarni tahlil qilish\" siklida ishlaydi, Thinking in Blender (He et al., 2026) esa bitta tasvir bo'yicha bajariladigan kodda sahna parametrlarini sozlaydi. HARMONY (Sun et al., 2026) monokulyar rekonstruksiya uchun ob'ektlarni agentli joylashtirishni geometrik aniqlashtirish bilan birlashtiradi. Agentic Real2Sim (Chen et al., 2026a) o'zaro ta'sir videolaridan jismoniy simulyatsiyalarni yig'ish uchun multimodal agentlarni jalb qiladi. AHa-3D (Xu et al., 2026) blogida kameralarni kalibrlash, o'lchash va sifatni nazorat qilish vositalaridan foydalangan holda videodan simulyatsiyani qayta tiklashning o'xshash jarayoni tasvirlangan. Bizning LiteReality-Agent tizimimiz harakatlanuvchi aktivlar va doimiy sahna dasturini kalibrlangan ko'p ko'rinishli tekshirish, shuningdek, to'qnashuvlar va tayanch mavjudligini aniq tekshirish bilan birlashtirib, xonalarni metrik RGB-D rekonstruksiya qilish masalasini hal qiladi.&lt;/p&gt;\n&lt;h4 id=\"litereality-agent\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#litereality-agent\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;LITEREALITY-AGENT&lt;/span&gt;&lt;/a&gt;LITEREALITY-AGENT&lt;/h4&gt;\n&lt;p&gt;LiteReality-Agent xonani qayta tiklashni ikki bosqichda amalga oshiradi: birinchi navbatda sahnani initsializatsiya qilish bosqichida umumiy reja va asosiy ob'ektlar aniqlanadi, so'ngra agentli loyihalash (agentic authoring) bosqichida sahnaning bajariladigan dasturi \"kuzatish — tahrirlash — tekshirish\" siklida ketma-ket takomillashtiriladi (Rasm 2). Amalga oshirish tafsilotlari va yordamchi misollar B ilovasida keltirilgan.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-f2.jpg\" alt=\"Rasm 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;3.1 INPUT: RGB–D SCANS AND DETECTION RESULTS&lt;/p&gt;\n&lt;p&gt;Tizim uchun kirish ma'lumotlari bo'lib LiteRealityScan ilovasidan olingan RGB-D skanerlash va ob'ektlarni aniqlash natijalari, jumladan, xona devorlarining geometriyasi va ob'ektlarning uch o'lchamli cheklovchi ramkalari (bounding boxes) xizmat qiladi.&lt;/p&gt;\n&lt;p&gt;3.2 SCENE INITIALISATION&lt;/p&gt;\n&lt;p&gt;LiteReality (Huang et al., 2025b) ketma-ketligiga rioya qilgan holda, biz yakuniy yig'ishdan oldin xona karkasini alohida tahlil qilamiz va ob'ektlarni alohida qayta tiklaymiz. Biroq, ma'lumotlar bazasidan tayyor aktivlarni qidirish o'rniga, biz ularni bevosita skaner tasvirlari asosida yaratamiz.&lt;/p&gt;\n&lt;p&gt;Layout Agent. Xona loyihasi tarkibiy elementlar, ob'ektlar va ular o'rtasidagi aloqalarni (jismoniy tayanch, devorlarga taqalish, funktsional guruhlar va potentsial to'qnashuvlar) o'z ichiga olgan sahna grafi ko'rinishida taqdim etiladi. Ushbu aloqalar bevosita jismoniy tayanch va assotsiativ bog'liqlikni (masalan, stul funktsional jihatdan stolga tegishli, lekin polga tayanadi) farqlash imkonini beradi. Shuningdek, ular ob'ektlarning noto'g'ri kesishishini va ularning o'lcham ramkalarining tabiiy ustma-ust tushishini (masalan, stul stol ostiga surilganda) ajratishga yordam beradi. Rejalashtirish agenti (Layout Agent) ob'ektlarni qayta tiklash boshlanishidan oldin shovqinli aniqlash natijalarini tuzatadi. Geometrik tekshirishlar yordamida xonadan tashqarida qolgan, devorga botib ketgan, havoda muallaq turgan yoki bir-biri bilan noto'g'ri kesishgan ob'ektlar aniqlanadi. Deterministik algoritmlar ob'ektlarning joylashuvi va o'lchamlariga kichik tuzatishlar kiritadi. Noaniq holatlarda (masalan, ramka o'lchami noto'g'ri bo'lsa yoki bir nechta ob'ektlar birlashib ketganda) agent tasvirlarning vizual tahlilidan foydalanadi. Taklif etilgan o'zgarishlar faqat sahnaning geometrik mosligini yaxshilasa va dastlabki skanerga nisbatan to'plangan xatolik chegarasidan chiqmasa qabul qilinadi. Tuzatilgan cheklovchi ramkalar aktivlarni yaratish va ularni yakuniy joylashtirish uchun asos bo'lib xizmat qiladi, bu esa sahnani yig'ishda aniqlash xatolarining qayta paydo bo'lishining oldini oladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Rejalashtirish agenti aktivlar yaratilishidan oldin sahna grafi asosida aniqlashning geometrik anomaliyalarini (kesishishlar, muallaq ob'ektlar) bartaraf etadi va yakuniy yig'ish jismoniy jihatdan to'g'ri ramkalarga asoslanishini kafolatlaydi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Object reconstruction. Har bir ob'ekt uchun skanerdan eng informativ ko'rinishlar tanlanadi va ular tozalangan mos yozuvlar kadrini yaratish uchun tasvir generatsiyasi modeli tomonidan qayta ishlanadi. Tuzilmaviy yoki harakatlanuvchi (artikulyatsiyalangan) ob'ektlar protsedurali generatsiyaga yo'naltiriladi, vizual jihatdan murakkab va asosan statik ob'ektlar esa TRELLIS.2 (Xiang et al., 2026) modeli yordamida qayta tiklanadi. Yaratilgan poligonli to'rlar (meshlar) geometriya nuqsonlari, ajralgan qismlar va topologiya xatolari mavjudligi bo'yicha avtomatik tekshiriladi. 1-algoritm agentning ikkinchi bosqichdagi ishlash siklini tavsiflaydi, bunda u 1-jadvaldagi vositalar yordamida kuzatishlar asosida Room.py faylini ketma-ket tahrirlaydi.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;1-algoritm: 2-bosqichda agentli loyihalash sikli. Agent 1-jadvaldagi vositalardan foydalangan holda kuzatishlar asosida Room.py faylini ketma-ket tahrirlaydi.\n1: env, tools ← Room.py, defined_tools\n2: observations ← SCAN()\n3: history, turn, qc_passed ← [ ], 0, FALSE\n4: while turn &amp;lt; T and not qc_passed do\n5:     actions ← LLM(observations, env, tools, history)\n6:     result ← EXECUTE(actions, env, observations)\n7:     append (actions, result) to history\n8:     if result muhitni o'zgartirgan bo'lsa then\n9:         qc_passed, feedback ← QC(env, observations)\n10:        append feedback to history\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"128\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-128\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-128\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-128.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-f1.jpg\" alt=\"Rasm 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-f3.jpg\" alt=\"Rasm 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-f4.jpg\" alt=\"Rasm 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 4&lt;
