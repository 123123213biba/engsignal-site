        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"165\" cy=\"140\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"635\" cy=\"252\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · CEMENT_CHEM   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Sementning raqamli egizagi:&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;neyron tarmoqlar beton&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;mustahkamligini qanday&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;bashorat qiladi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;Kalsiy silikat gidrati (C-S-H) sement toshining asosiy tarkibiy qismi bo'lib, uning murakkab tuzilishi o'nlab yillar davomida modellashtirish uchun jumboq bo'lib kelgan. Yangi CSH-MLP usuli zichlik funksionali nazariyasi (DFT) yordamida olingan 50 000 dan ortiq konfiguratsiyalarni tahlil qilish uchun mashinali o'qitishdan foydalanadi. Bu betonning mustahkamligi va chidamliligini mavjud analoglarga qaraganda 30 barobar tezroq simulyatsiya qilish imkonini beradi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-02/machine-learning-potential-for-calcium-silicate-hydrates-wit.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;CSH-MLP 50 000+ DFT aniqligidagi konfiguratsiyalarda o'qitilgan.&lt;/li&gt;\n&lt;li&gt;ReaxFF ga nisbatan hisoblash tezligi 30 barobar yuqori.&lt;/li&gt;\n&lt;li&gt;Ca/Si nisbatlarining 0,83 dan 2,5 gacha bo'lgan diapazoni.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-02/machine-learning-potential-for-calcium-silicate-hydrates-wit.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;C-S-H ni modellashtirishdagi asosiy muammo uning nano-o'lchamdagi bir jinsli emasligi va amorf tabiatidir. ClayFF yoki ReaxFF kabi an'anaviy kuch maydonlari yo kimyoviy reaktivlikni hisobga olmaydi, yoki juda katta hisoblash quvvatini talab qiladi. Ishlab chiqilgan CSH-MLP 1890 ta optimallashtirilgan DFT tuzilmalari, 9450 ta buzilgan konfiguratsiyalar va 39 057 ta molekulyar-dinamik trayektoriyalardan iborat ma'lumotlar bazasida o'qitildi.&lt;/p&gt;\n&lt;p&gt;Model Ca/Si nisbatlarining keng diapazonini (0,83 dan 2,5 gacha) qamrab oladi, bu esa elastiklik modullari va yuqori bosim ostidagi xatti-harakatlarni aniq bashorat qilish imkonini beradi. SOAP (Smooth Overlap of Atomic Positions) usuli yordamida tuzilmani tahlil qilish neyron tarmoq C-S-H konfiguratsiyalarining barcha xilma-xilligini muvaffaqiyatli qamrab olganini tasdiqladi. Natijada, CSH-MLP hisob-kitoblarni sezilarli darajada tezlashtirib, DFT bilan taqqoslanadigan aniqlikni ta'minlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Model o'qitish uchun ishlatilgan ma'lumotlar to'plami bilan cheklangan va tanlanmagan ekstremal sharoitlarda aniqlikni yo'qotishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-02/machine-learning-potential-for-calcium-silicate-hydrates-wit.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Sement, kelib chiqishi 2000 yildan ortiq vaqtga borib taqaladigan va 200 yildan ortiq vaqt oldin sanoat miqyosida ishlab chiqilgan material, insoniyat tomonidan eng ko'p ishlab chiqariladigan materialdir. Biroq, u global uglerod chiqindilarining asosiy manbalaridan biri bo'lib, umumiy hajmining qariyb 8 foizini tashkil qiladi. Sementning atrof-muhitga ta'sirini kamaytirish va infratuzilmaga bo'lgan ortib borayotgan talabni qondirish uning turli miqyosdagi xususiyatlarini chuqur, bashoratli tushunishni talab qiladi. Gidratlangan sement xamiridagi markaziy bog'lovchi faza kalsiy silikat gidrat (C–S–H) bo'lib, u o'zgaruvchan tarkib va mahalliy tartibsizlikka ega nanokristalli va rentgen-amorf geldir. U sement materiallarining koheziyasi, mustahkamligi va chidamliligi uchun asosiy javobgardir. Uning muhim roliga qaramay, C–S–H ning atom darajasidagi tuzilishi va mexanik xulq-atvori uning geterogen kimyosi va yomon aniqlangan kristalliligi tufayli noma'lumligicha qolmoqda.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Atomistik simulyatsiyalar, xususan molekulyar dinamika (MD) va ab initio hisob-kitoblar sementning strukturaviy, mexanik va termodinamik xususiyatlarini tushunishda, shuningdek, eksperimental kuzatishlarni to'ldiruvchi atom darajasidagi joylashuvlar, nuqsonlar tuzilishi va gidratlanish dinamikasi bo'yicha muhim ma'lumotlarni taqdim etishda bebaho ekanligini isbotladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ab initio usullari (masalan, zichlik funksionali nazariyasi, DFT) yuqori aniqlikni taklif qiladi va xususiyatlarni bashorat qilish uchun mezon hisoblanadi, ammo ularning hisoblash qiymati kichik tizimlar bilan cheklanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Klassik MD simulyatsiyalari kattaroq fazoviy va vaqtinchalik miqyoslarga imkon beradi, ammo ularning ishonchliligi kuch maydonlarining sifatiga bog'liq bo'lib, har birining o'ziga xos kamchiliklari mavjud.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Kvant mexanik simulyatsiyalarining fazoviy va vaqtinchalik cheklovlarini ularning aniqligini saqlab qolgan holda bartaraf etish uchun mashinali o'rganish potensiallari (MLP) kuchli muqobil sifatida paydo bo'ldi. MLP nanosekundlik vaqt oralig'ida katta va tartibsiz tizimlarning simulyatsiyasini an'anaviy ab initio usullariga qaraganda ancha arzon narxda amalga oshirishga imkon beradi. Ushbu tadqiqotda biz Ca/Si nisbatlari, nuqsonlar topologiyalari va gidratlanish holatlarining keng doirasini qamrab oluvchi C–S–H atom tuzilishi ma'lumotlar to'plamini yaratish uchun ma'lumotlar yaratish strategiyasini taqdim etamiz. C–S–H ma'lumotlar to'plamiga asoslanib, biz C–S–H uchun aniq va umumlashtiriladigan MLP — CSH-MLP ni o'rgatamiz va uning aniqligini ab initio simulyatsiyalari hamda ilgari ishlab chiqilgan kuch maydonlari bilan taqqoslash orqali tekshiramiz. Ushbu ishning asosiy yutug'i C–S–H ma'lumotlar to'plamining xilma-xilligi va CSH-MLP ning tarkibiy va strukturaviy umumlashtirilishidadir.&lt;/p&gt;\n&lt;p&gt;Taklif etilgan CSH-MLP nafaqat C–S–H ning mexanik xususiyatlari va strukturaviy xususiyatlarini bashorat qilishda yuqori aniqlikni ko'rsatadi, balki qariyb 700 ta alohida tarkib bo'yicha stexiometrik umumlashtirilish, katta hajmdagi tizimlarga miqyoslilik va ko'rilmagan tuzilmalarga ekstrapolyatsiya qilish qobiliyatiga ega. Muhimi, CSH-MLP yuqori bosimli rentgen nurlari difraksiyasi o'lchovlari va nuqsonlarga asoslangan C–S–H modellari o'rtasidagi uzoq vaqtdan beri mavjud bo'lgan tafovutlarni bartaraf etadi. Biz CSH-MLP ReaxFF ga nisbatan taxminan 30 baravar tezroq hisoblash tezligiga erishishini ko'rsatamiz, bu esa sement materiallarini DFT ga yaqin aniqlik bilan keng ko'lamli simulyatsiya qilish imkonini beradi.&lt;/p&gt;\n&lt;p&gt;Aniq va umumlashtiriladigan mashinali o'rganish potensiali (MLP) o'quv ma'lumotlar to'plamining sifati va xilma-xilligiga bog'liq. Biroq, bugungi kunga qadar sementning nanokristalli tabiati, geterogen tarkibi va dinamik kimyoviy muhiti tufayli eksperimental tarzda olingan atom tuzilmalarini o'z ichiga olgan ommabop ma'lumotlar bazasi mavjud emas. Ushbu bo'shliqni to'ldirish uchun biz C–S–H tuzilmalarining o'ziga xos xususiyatlarini qamrab oluvchi DFT bilan belgilangan ma'lumotlar to'plamini yaratish uchun ma'lumotlar yaratish strategiyasini ishlab chiqdik. Strategiya to'rt bosqichni o'z ichiga oladi: (i) model qurish va ortiqchalikni nazorat qilish, (ii) strukturani optimallashtirish, (iii) muvozanatsiz ma'lumotlarni kengaytirish va (iv) DFT bir nuqtali hisob-kitoblari (1-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;DFT bir nuqtali hisob-kitoblari — bu atomlarning koordinatalarini o'zgartirmasdan, belgilangan konfiguratsiya uchun energiya va kuchlarni hisoblashdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Birinchi bosqichda pyCSH dasturi yordamida taxminan 500 000 ta C–S–H superyacheykasi yaratildi va saralash jarayoni ularni 688 ta tarkibni qamrab oluvchi 1926 ta mustaqil tuzilmaga qisqartirdi. Ikkinchi bosqichda tanlangan modellar NVT va NPT ansambllari ostida MD simulyatsiyalari yordamida muvozanatlandi va keyinchalik DFT darajasida optimallashtirildi. Bu jami 1890 ta konfiguratsiyaga olib keldi. Uchinchi bosqichda strukturaviy buzilishlar (9450 ta variant) va 100 ta MD muvozanatlash traektoriyalaridan (39 057 ta konfiguratsiya) tuzilmalarni yig'ishni o'z ichiga olgan ikki bosqichli kengaytirish strategiyasi qabul qilindi. Barcha konfiguratsiyalar yuqori aniqlikdagi DFT hisob-kitoblari bilan belgilandi va yakuniy C–S–H ma'lumotlar to'plamini tashkil etdi.&lt;/p&gt;\n&lt;p&gt;C–S–H ma'lumotlar to'plamidagi strukturaviy xilma-xillik SOAP barmoq izi usuli bilan aniqlandi va strukturaviy xususiyatlar PCA o'lchamini kamaytirish algoritmi yordamida ikki o'lchovli tekislikka proyeksiyalandi. 2-rasm turli kichik to'plamlar bo'ylab ichki strukturaviy ma'lumotlarni aks ettiradi. Natijalar yuqori darajadagi dispersiyani ko'rsatadi, bu taklif etilgan saralash usulining konfiguratsion fazoning keng spektrini qamrab olishdagi samaradorligini tasdiqlaydi. Bundan tashqari, Ca/Si va 2H/Si nisbatlari ma'lumotlar to'plamining strukturaviy parametrlariga sezilarli ta'sir ko'rsatadi. Ca/Si va 2H/Si ning sinxron o'sish tendentsiyasi eksperimental natijalar bilan yaxshi mos keladi.&lt;/p&gt;\n&lt;p&gt;CSH-MLP ning aniqligi MLP tomonidan bashorat qilingan atom energiyasi va kuchlarini DFT yordamida hisoblanganlari bilan solishtirish orqali tekshirildi. 3-rasm o'quv va test ma'lumotlar to'plamlari uchun MLP va DFT natijalari o'rtasidagi kuchli chiziqli korrelyatsiyani ko'rsatadi. Atom energiyalari uchun o'rtacha kvadratik xatolar (RMSE) mos ravishda o'quv va test to'plamlari uchun 1,18 va 1,50 meV/atomni tashkil qiladi. Atom kuchlari uchun RMSE qiymatlari mos ravishda 0,092 va 0,102 eV/Å ni tashkil qiladi. Ushbu qiymatlar mavjud MLP lar uchun xatolik diapazonining quyi qismida joylashgan bo'lib, CSH-MLP ning yuqori aniqligi va mustahkamligini tasdiqlaydi.&lt;/p&gt;\n&lt;p&gt;Tobermorit tuzilmalari va C–S–H modelining panjara konstantalari MLMD va DFT simulyatsiyalari yordamida optimallashtirildi va natijalar ilgari ishlab chiqilgan kuch maydonlari bilan solishtirildi (1-jadval). C–S–H benchmark modeli uchun CSH-MLP atigi 0,23% maksimal og'ish va 0,14% o'rtacha tafovut bilan ustun ishlashni ko'rsatadi va boshqa kuch maydonlaridan sezilarli darajada ustun turadi. Bu natijalar CSH-MLP ning nanokristalli C–S–H ga o'xshash fazalarning strukturaviy xususiyatlarini aniq takrorlashdagi ajoyib qobiliyatini ta'kidlaydi.&lt;/p&gt;\n&lt;p&gt;Dinamik xususiyatlarni baholash uchun biz DFT optimallashtirilgan C–S–H modeli uchun ClayFF, ReaxFF, csh_cp va CSH-MLP ostida turli atom turlarining o'rtacha kvadratik siljishini (MSD) hisobladik (6a–d-rasm). CSH-MLP ning MSD tebranishlari csh_cp ga qaraganda izchil va barqaror bo'lib, bu CSH-MLP potensiali ostida C–S–H ning termal tebranishlari zaifroq ekanligini ko'rsatadi. Bu natijalar CSH-MLP ning ilgari ishlab chiqilgan sementga asoslangan MLP lardan yuqori aniqlik va barqarorlikka erishganini tasdiqlaydi.&lt;/p&gt;\n&lt;p&gt;7a,b-rasm CSH-MLP va csh_cp tomonidan bashorat qilingan C–S–H benchmark modelining elastiklik tensorini va ularning DFT dan og'ishlarini ko'rsatadi. csh_cp bilan solishtirganda, CSH-MLP DFT bilan ko'proq mos kelishini ko'rsatadi. Elastiklik tensorining normal komponentlarini tahlil qilish C–S–H ning mexanik javobida aniq nomonoton tendentsiyani ochib beradi. Ca/Si 1,3 dan 1,5 gacha oshganda, C₁₁, C₂₂ va C₃₃ mos ravishda 99,12 dan 105,94 GPa gacha, 96,71 dan 100,02 GPa gacha va 60,39 dan 76,04 GPa gacha o'sadi; Ca/Si ning keyingi o'sishi bilan ular mos ravishda 95,15, 91,46 va 68,44 GPa gacha tushadi. Bizning simulyatsiyalarimiz ushbu xatti-harakatni atom darajasida tushuntirib beradi va eksperimental kuzatishlarni C–S–H ning strukturaviy evolyutsiyasi bilan bog'laydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-02/machine-learning-potential-for-calcium-silicate-hydrates-wit.html#tadqiqot-sxemasi\" class=\"yfm-anc
