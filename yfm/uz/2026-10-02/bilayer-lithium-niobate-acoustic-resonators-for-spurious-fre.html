            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"168\" cy=\"66\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"572\" cy=\"284\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · COMPOSITES   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Ikki qatlamli litiy niobat:&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;6 GGs chastotadagi&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;shovqinlarni qanday&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;yo'qotish mumkin&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre-f1.jpg\" alt=\"1-rasm. Qalinlik-siljish hajmli akustik rezonator arxitekturalari va vakillik javoblari. a Taklif etilgan qurilmaning uc\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. Qalinlik-siljish hajmli akustik rezonator arxitekturalari va vakillik javoblari. a Taklif etilgan qurilmaning uch o'lchovli sxemasi, u osilgan LiNbO3 membranada naqshlangan alyuminiy IDTlardan iborat.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm. Qalinlik-siljish hajmli akustik rezonator arxitekturalari va vakillik javoblari. a Taklif etilgan qurilmaning uch o'lchovli sxemasi, u osilgan LiNbO3 membranada naqshlangan alyuminiy IDTlardan iborat. A-A bo'ylab kesma osilgan tuzilmani va qalinlik-siljish qo'zg'alishini ta'minlaydigan suzuvchi pastki elektrodni ta'kidlaydi. b Bir qatlamli X-kesim LiNbO3 rezonator steki. c X-kesim LiNbO3 qalinlik-siljish BAW rezonatorining admitans javobi, SH1 sekin rejimining kuchli bog'lanishi va SH1 tez rejimining soxta rejimi bilan birga. d Optimallashtirilgan bog'lanish burchagi θ bilan bog'langan X-kesim va -X-kesim LiNbO3 qatlamlaridan iborat taklif etilgan ikki qatlamli rezonator steki. e Taxminan 4,5 GGs chastotada SH1 sekin va SH2 sekin rejimlarning selektiv qo'zg'alishini, shuningdek, tarmoqli ichidagi tez siljish rejimlarini bostirishni ko'rsatadigan vakillik admitans javoblari. Bu turli xil LiNbO3 qatlam qalinligi va bog'lanish burchaklaridan foydalangan holda amalga oshiriladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;5G va Wi-Fi 6E tarmoqlarining rivojlanishi 5 GGs dan yuqori chastotalarda ishlaydigan keng polosali filtrlarni talab qiladi. An'anaviy rezonatorlar litografik cheklovlar va parazit modalar tufayli qiyinchiliklarga duch kelmoqda. Ikki qatlamli X-kesimli litiy niobat (LiNbO3) arxitekturasi qatlamlar simmetriyasini muhandislik yo'li bilan boshqarish orqali ushbu muammoni hal qiladi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Ikki qatlamli LiNbO3 tuzilmasi SH2-modani tanlab qo'zg'atadi.&lt;/li&gt;\n&lt;li&gt;6 GGs chastotada elektrmexanik bog'lanish k2eff 35% ga yetadi.&lt;/li&gt;\n&lt;li&gt;294° yopishtirish burchagi parazit tez modalarni bostiradi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tadqiqotchilar aniq tanlangan yopishtirish burchagi bilan vertikal ravishda birlashtirilgan ikkita yupqa LiNbO3 plyonkasidan iborat konstruksiyani taklif qilishdi. Bunday tuzilmada qalinlik bo'yicha ikkinchi siljish modasi (SH2, slow) qo'zg'atiladi, oddiy X-kesim uchun xos bo'lgan tez siljish modalari esa samarali bostiriladi. Bu qatlamlarning kristallografik o'qlarini burish orqali pyezoelektrik koeffitsientlarning belgilarini o'zgartirish va kerakli moda uchun konstruktiv interferensiyani ta'minlash orqali amalga oshiriladi.&lt;/p&gt;\n&lt;p&gt;6 GGs atrofida ishlaydigan eksperimental namunalar 35% atrofida elektrmexanik bog'lanish koeffitsientini (k2eff) ko'rsatdi. Optimal yopishtirish burchagi θ = 294° diapazon ichida parazit tebranishlarsiz toza spektral javobga erishish imkonini berdi. Narvon tipidagi filtr prototiplari 18,6% nisbiy o'tkazish qobiliyatini namoyish etdi, bu esa ushbu usulning kelajakdagi radiochastota filtrlari uchun yuqori samaradorligini tasdiqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot laboratoriya prototiplari bilan cheklangan; plyonkalarni aniq yopishtirish jarayonini ommaviy ishlab chiqarish uchun masshtablash talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Simsiz aloqa standartlarining yuqori chastotalar va kengroq o‘tkazish qobiliyati tomon rivojlanishi akustik filtr texnologiyalariga yangi talablarni qo‘ymoqda. An’anaviy rezonatorlar 5 GGs dan yuqori chastotalarda litografik cheklovlar, elektromexanik bog‘lanish koeffitsiyentining (k²eff) pasayishi va keraksiz parazit modlarning qo‘zg‘alishi tufayli amaliy qiyinchiliklarga duch keladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Elektromexanik bog‘lanish koeffitsiyenti (k²eff) elektr energiyasini akustik energiyaga aylantirish samaradorligini belgilaydi; u qanchalik yuqori bo‘lsa, filtrning o‘tkazish qobiliyati shunchalik keng bo‘ladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mualliflar qalinligi bo‘yicha siljish modida ishlaydigan, X-kesimli litiy niobat (LiNbO₃) asosidagi ikki qatlamli hajmiy akustik rezonator arxitekturasini taklif qilmoqdalar. Metod simmetriyani muhandislik yo‘li bilan boshqarishga asoslangan: ikkita pyezoelektrik yupqa plyonkali qatlam vertikal ravishda ma’lum bir bog‘lash burchagi ostida joylashtiriladi. Bu konfiguratsiya ikkinchi tartibli qalinlik bo‘yicha siljish modini (SH₂, sekin moda) tanlab qo‘zg‘atish imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Simmetriyani boshqarish orqali tezkor siljish modlarini bostirish va o‘tkazish diapazonida parazit rezonanslarsiz spektral tozalikka erishish mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Taxminan 6 GGs chastotada ishlaydigan eksperimental namunalar 35% atrofidagi k²eff koeffitsiyentini ko‘rsatdi, bu chekli elementlar usuli (FEM) yordamida olingan modellashtirish natijalariga mos keladi. Zinapoyali filtrlar (ladder filters) prototiplari 18,6% nisbiy o‘tkazish qobiliyatini namoyish etdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Natijalar eksperimental maketlar (proof-of-concept) asosida olingan bo‘lib, texnologiyani ommaviy ishlab chiqarish uchun qo‘shimcha tadqiqotlar talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu arxitektura qatlamlar qalinligini o‘zgartirish orqali chastotani sozlash imkonini beradi, shu bilan birga yuqori bog‘lanish va spektral tozalikni saqlab qoladi, bu esa uni keyingi avlod simsiz aloqa tizimlari uchun istiqbolli platformaga aylantiradi.&lt;/p&gt;\n&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;h4 id=\"5g-va-undan-yuqori-tarmoqlar-uchun-radiochastota-filtrlari-evolyutsiyasi\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#5g-va-undan-yuqori-tarmoqlar-uchun-radiochastota-filtrlari-evolyutsiyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5G va undan yuqori tarmoqlar uchun radiochastota filtrlari evolyutsiyasi&lt;/span&gt;&lt;/a&gt;5G va undan yuqori tarmoqlar uchun radiochastota filtrlari evolyutsiyasi&lt;/h4&gt;\n&lt;p&gt;Beshinchi avlod (5G) simsiz tarmoqlari va kelajakdagi standartlarning rivojlanishi spektrdagi tirbandlikni kamaytirish va ma'lumotlar uzatish tezligini oshirish uchun yuqoriroq ishchi chastotalar va kengroq polosalar sari o'tishni taqozo etmoqda. FR1 diapazonida (6 GGs dan past) n77 (3,3–4,2 GGs), n78 (3,3–3,8 GGs) va n79 (4,4–5 GGs) kabi asosiy polosalar 4G LTE tizimlariga qaraganda yuqori sig'im va o'tkazuvchanlikni ta'minlaydi. Shuningdek, Wi-Fi 6E uchun 6 GGs diapazonida 1200 MGts qo'shimcha polosaning ajratilishi RF front-end tizimlaridan kengroq kanallar bilan ishlashni talab qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;5G va Wi-Fi 6E ga o'tish kengaytirilgan chastota diapazonlarida samarali ishlaydigan va yuqori o'tkazuvchanlikni saqlaydigan filtrlarni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Akustik filtr texnologiyalari RF tizimlarining asosiy cheklovchi omili bo'lib qolmoqda. An'anaviy sirt akustik to'lqinli (SAW) va hajmiy akustik to'lqinli (BAW) filtrlar avvalgi avlodlarda muvaffaqiyatli qo'llanilgan, ammo masshtablashda qiyinchiliklarga duch kelmoqda. SAW qurilmalari uchun chastotaning oshishi to'lqin uzunligi va elektrod o'lchamlarining qisqarishini talab qiladi, bu esa litografiya imkoniyatlarini chegaralaydi. IHP-SAW (yuqori unumli SAW) texnologiyasi energiya lokallashuvi, sifat koeffitsienti va elektromexanik bog'lanish koeffitsientini (k²eff) yaxshilash orqali ushbu muammoni qisman hal qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;k²eff (elektromexanik bog'lanish koeffitsienti) — elektr energiyasini akustik energiyaga aylantirish samaradorligini belgilovchi parametr; u qanchalik yuqori bo'lsa, filtrning o'tkazish polosi shunchalik keng bo'ladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;SAW dan farqli o'laroq, BAW rezonatorlarining chastotasi plyonka qalinligi bilan belgilanadi, bu esa lateral masshtablash cheklovlarini yo'q qiladi. Tijoriy yechimlarda alyuminiy nitridi (AlN) va alyuminiy-skandiy nitridi (AlScN) yetakchi hisoblanadi, bunda AlScN k²eff ni sezilarli darajada oshiradi. Epitaksial AlN va davriy qutblangan pyezoelektrik plyonka (P3F) arxitekturalari yuqori tartibli modalarni qo'zg'atish va X hamda Ku diapazonlarida ishlash imkonini beradi. Shunga qaramay, keng nisbiy o'tkazish polosi uchun o'ta yuqori chastotalar va yuqori k²eff ga bir vaqtda erishish murakkab muhandislik vazifasi bo'lib qolmoqda.&lt;/p&gt;\n&lt;h4 id=\"linbo3-asosidagi-yuqori-chastotali-rezonatorlar-istiqbollari\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#linbo3-asosidagi-yuqori-chastotali-rezonatorlar-istiqbollari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;LiNbO3 asosidagi yuqori chastotali rezonatorlar istiqbollari&lt;/span&gt;&lt;/a&gt;LiNbO3 asosidagi yuqori chastotali rezonatorlar istiqbollari&lt;/h4&gt;\n&lt;p&gt;Litiy niobatining (LiNbO3) yuqori elektromexanik bog‘lanish koeffitsienti uni samarali akustik filtrlar uchun istiqbolli materialga aylantiradi. LiNbO3 yupqa plyonkalarini SiC kabi yuqori tovush tezligiga ega substratlarga integratsiya qilish, yaxshilangan sifat koeffitsienti bilan 3 GGs dan yuqori chastotalarda ishlash imkonini beradi. Osma membrana tuzilmalaridan foydalanish akustik energiyani lokallashtirishni kuchaytiradi va k²eff &amp;gt; 30% samarali bog‘lanish koeffitsientiga erishishga yordam beradi. Biroq, simmetrik, gorizontal siljish va hajmiy siljish modlari uchun rezonans chastotasi lateral o‘lchamlarga kuchli bog‘liq bo‘lib, bu chastotani masshtablashni cheklaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LiNbO3 osma tuzilmalari k²eff &amp;gt; 30% dan yuqori ko‘rsatkichni ta’minlaydi, ammo chastotaning lateral bog‘liqligi plyonka qalinligiga asoslangan modlarga o‘tishni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;O‘lchamlardagi cheklovlarni yengib o‘tish uchun Lambning yuqori tartibli modlari (masalan, A1) yoki lateral qo‘zg‘aluvchi hajmiy akustik rezonatorlar (XBAR) qo‘llaniladi. Muqobil yondashuv — FBAR rezonatorlaridagi kabi elektr maydonini plyonka qalinligi bo‘ylab qo‘llashdir. X-kesim LiNbO3 alohida qiziqish uyg‘otadi, chunki u k²eff ≈ 40% bo‘lgan fundamental sekin siljish modini (SH1, slow) qo‘llab-quvvatlaydi. Biroq, Wi-Fi 6E diapazoni (6–7 GGs) uchun plyonka qalinligini sezilarli darajada kamaytirish talab etiladi, bu esa sifat koeffitsienti va quvvatga salbiy ta’sir qiladi. P3F (pyezoelektrik ko‘p qatlamli) arxitekturalari pyezoelektrik qalinligini saqlab qolgan holda qalinlik bo‘ylab yuqori tartibli siljish modlarini qo‘zg‘atish imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;P3F (Piezoelectric-on-Piezoelectric) — bu qatlamlar simmetriyasini muhandislik yo‘li bilan boshqarish orqali materialni haddan tashqari yupqalashtirmasdan kerakli akustik modlarni samarali qo‘zg‘atish imkonini beruvchi ko‘p qatlamli arxitektura.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu ishda 6–7 GGs diapazoni uchun X-kesim LiNbO3 asosidagi ikki qatlamli rezonator taqdim etilgan. Arxitektura +X va -X qatlamlarini tanlangan yopishtirish burchagi bilan birlashtirib, SH2,slow modini selektiv qo‘zg‘atishga imkon beradi. Bu qalinlikni keskin kamaytirmasdan chastotani masshtablash va k²eff ≈ 35% darajasini saqlashni ta’minlaydi. Qatlamlar simmetriyasi shovqinli tez siljish modlarini bostiradi va spektr tozaligini ta’minlaydi. Konsepsiya zinapoyali (ladder-type) filtrlar yordamida tasdiqlangan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Usulning samaradorligi qatlamlarni yopishtirish burchagining aniqligiga bevosita bog‘liq bo‘lib, bu raqamli modellashtirish va eksperimental o‘lchovlar bilan tasdiqlangan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"ikki-qatlamli-qalinlik-siljish-hajmiy-akustik-rezonatori\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#ikki-qatlamli-qalinlik-siljish-hajmiy-akustik-rezonatori\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ikki qatlamli qalinlik-siljish hajmiy akustik rezonatori&lt;/span&gt;&lt;/a&gt;Ikki qatlamli qalinlik-siljish hajmiy akustik rezonatori&lt;/h4&gt;\n&lt;p&gt;LiNbO₃ asosidagi osma hajmiy akustik to'lqinli (BAW) rezonatorlar yuqori yuzasida metall barmoqli o'zgartirgichlar (IDT) va pastki qismida suzuvchi elektrod joylashgan LiNbO₃ membranadan iborat (1a-rasm). Ushbu elektrod konfiguratsiyasi o'zgaruvchan qutbli vertikal elektr maydonini hosil qilib, qalinlik-siljish modalarini qo'zg'atadi. Rezonans chastotasi asosan pyezoelektrik qatlam qalinligi bilan belgilanadi, IDT qadami va tirqishlar esa statik sig'im hamda elektr qarshiligini sozlash, shuningdek, Lamb modalarini bostirish uchun xizmat qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;IDT (barmoqli o'zgartirgich) — elektr signalini mexanik tebranishlarga aylantiruvchi elektrodlar tizimi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;An'anaviy konfiguratsiyada bitta X-kesimli LiNbO₃ qatlami ishlatiladi (1b-rasm). Bunday tuzilmaning admittans javobi (1c-rasm) SH1, slow modasining kuchli bog'langanligini ko'rsatadi. Biroq, qo'shimcha SH1, fast modasi o'tkazish polosasi ichida parazit tebranishlarni hosil qilib, filtrlar dizaynini murakkablashtiradi (S1a-rasmga qarang). Ushbu muammoni hal qilish uchun X-kesimli va -X-kesimli LiNbO₃ qatlamlaridan iborat ikki qatlamli arxitektura taklif etildi (1a va 1d-rasmlar).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ikki qatlamli arxitektura k²eff koeffitsientini pasaytirmasdan, SH1, slow yoki SH2, slow modalarini tanlab qo'zg'atish va tezkor siljish modalarini bostirish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Qatlamlarning kristallografik yo'nalishini o'zgartirish pyezoelektrik koeffitsientlar ishorasini o'zgartiradi, ammo elastik xususiyatlarni saqlab qoladi. Bu butun qatlam bo'ylab konstruktiv elektromexanik bog'lanishni ta'minlaydi. Bog'lanish burchagi va qatlam qalinligiga qarab, ushbu arxitektura SH2, slow modasini samarali qo'zg'atadi va 1e-rasmda ko'rsatilganidek, keraksiz tezkor modalarni bostiradi.&lt;/p&gt;\n&lt;h4 id=\"moda-tanlash-uchun-burilish-burchagi\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#moda-tanlash-uchun-burilish-burchagi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Moda tanlash uchun burilish burchagi&lt;/span&gt;&lt;/a&gt;Moda tanlash uchun burilish burchagi&lt;/h4&gt;\n&lt;p&gt;Qatlamlar qalinligidan tashqari, ikki LiNbO₃ qatlami orasidagi bog‘lanish burchagi θ asosiy loyihalash parametri hisoblanadi. Bu burchak kristallografik yo‘nalishni belgilaydi va piezoelektrik koeffitsientlarga ta’sir qiladi. X-cut va -X-cut qatlamlarining tekislikdagi aylanish burchaklari &lt;span class=\"yfm-latex\" data-content=\"%5Cphi_1\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; va &lt;span class=\"yfm-latex\" data-content=\"%5Cphi_2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (2a-rasm) orqali ifodalanadi. e₃₄ koeffitsienti &lt;span class=\"yfm-latex\" data-content=\"%5Cphi%20%5Capprox%2033%5E%5Ccirc\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; bo‘lganda maksimal qiymatga erishadi (2b-rasm). Bog‘lanish burchagi $ heta = 360^\\circ - (\\phi_1 + \\phi_2)$ formulasi bilan aniqlanadi (2c-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Optimal θ = 294^° burchagi SH₁ modasini bostiradi va SH₂ modasi uchun keff² = 37% gacha bo‘lgan samarali bog‘lanishni ta’minlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;To‘rtta konfiguratsiya tahlili (2d-rasm) shuni ko‘rsatadiki: θ = 0^° da bog‘lanish susaygan. θ = 114^° da faqat SH₁ modasi qo‘zg‘aladi. θ = 294^° (yoki -66^°) holatida e₃₄ koeffitsientlari qarama-qarshi ishoraga ega bo‘lib, SH₂ uchun konstruktiv, SH₁ uchun esa destruktiv interferensiyani hosil qiladi. Bu 5,9 GGs chastotada keff² = 37% samaradorlikni beradi. θ = 66^° holatida esa bog‘lanish samaradorligi pasayadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Elektromexanik bog‘lanish kuchlanish maydoni va elektr induksiyalangan deformatsiyaning bir-biriga mos kelishiga bog‘liq. Piezo-koeffitsientlarning qarama-qarshi ishoralari keraksiz modalarni o‘chirish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;keff² ning θ burchagiga bog‘liqligi (2f-rasm) SH₁ va SH₂ modalari o‘rtasida 180^° fazaviy siljishni ko‘rsatadi. SH₁ uchun maksimal bog‘lanish 43%, SH₂ uchun esa 37,2% ni tashkil qiladi. Ikki qatlamli struktura bir qatlamli rezonatorga (34%) nisbatan 10% yuqori samaradorlikka ega. Tez siljish modalarining bostirilishi burchakka bog‘liq emas va bu qo‘zg‘alish shartlarining ortogonalligi bilan izohlanadi.&lt;/p&gt;\n&lt;h4 id=\"qurilma-tavsifi\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#qurilma-tavsifi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qurilma tavsifi&lt;/span&gt;&lt;/a&gt;Qurilma tavsifi&lt;/h4&gt;\n&lt;p&gt;Ikki qatlamli resonatorlar kremniy ustidagi X-kesim/-X-kesim LiNbO3 (litiy niobat) plastinasida tayyorlanadi. Jarayon YBAR texnologiyasiga asoslangan. 3a-rasmda osilib turgan LiNbO3 membranasi va suzuvchi elektrod ko'rsatilgan qurilmaning optik mikrografi keltirilgan. Qatlamlar qalinligini nazorat qilish uchun SEM (skanerlovchi elektron mikroskopiya) qo'llanildi (3b-rasm), natijada pastki qatlam 220 nm va yuqori qatlam 250 nm ekanligi aniqlandi. Ariqcha chuqurligi 300 nm qilib tanlangan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SEM usuli materialning nano-o'lchamdagi tuzilishini vizualizatsiya qilish imkonini beradi, bu yupqa plyonkali membranalarning aniqligini tekshirish uchun juda muhimdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;BAW (hajmiy akustik to'lqinlar) resonatorining o'lchangan admitans javobi 2,6 Om ketma-ket qarshilikni hisobga olgan holda modellashtirish bilan solishtirildi. Asosiy SH2 (sekin rejim) rezonansi 6,04 GGs chastotada qayd etilgan bo'lib, k²eff = 34,6% elektrmexanik bog'lanish koeffitsientiga ega. Impedans nisbati 2 dekadadan oshadi, sifat koeffitsientlari Q_r = 65, Qar = 80, Bode Q ≈ 100. SH1 qoldiq rejimi 4,16 GGs chastotada k²eff ≈ 0,9% bilan kuzatiladi, bu qatlamlar qalinligidagi kichik assimetriya bilan izohlanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tajriba ikki qatlamli resonator konsepsiyasini tasdiqladi: qalinliklar balansi erishilganda, SH2 rejimi 34,6% samaradorlik bilan selektiv ravishda qo'zg'atiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;tLN,top/tLN,bot qalinliklar nisbatining ta'siri pastki qatlam 220 nm bo'lganda va yuqori qatlam 350, 290 va 250 nm bo'lganda o'rganildi. Assimetriya kamayishi bilan SH1 bog'lanishi 8,13% dan 0,9% gacha kamayadi, SH2 esa 32,2% dan 34,6% gacha ortadi. Rezonans chastotalari umumiy qalinlik kamayishi bilan ortadi. Bode Q esa 170 dan 70 gacha pasayadi. O'lchov natijalari (3d, 3e, 3f-rasmlar) nazariy modellar bilan yuqori moslikni ko'rsatadi, bu SH2 bog'lanish samaradorligi birlikka yaqin nisbatda maksimal bo'lishini tasdiqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Yuqori qatlamni yupqalash jarayonida sifat koeffitsientining pasayishi elektrodlardagi akustik yo'qotishlar va ishlov berish vaqtida sirtda yuzaga kelgan shikastlanishlar bilan bog'liq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"filtr-natijalari\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#filtr-natijalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Filtr natijalari&lt;/span&gt;&lt;/a&gt;Filtr natijalari&lt;/h4&gt;\n&lt;p&gt;Ikki qatlamli platformaning radiochastotali filtrlashdagi imkoniyatlarini baholash uchun LiNbO3 rezonatorlari asosida zinapoyali (ladder-type) filtr prototiplari yaratildi. Maqsadli diapazon — 6 GHz Wi-Fi 6E bo‘lib, SH2 rejimining yuqori bog‘lanishi va parazit modalar yo‘qligi hisobiga 20% dan ortiq nisbiy o‘tkazish polosasini (FBW) ta’minlash ko‘zda tutilgan. Dastlab ketma-ket va parallel rezonatorlar uchun X-cut / -X-cut qatlamlari qalinligi mos ravishda 250/185 nm va 250/335 nm qilib loyihalashtirilgan edi. Biroq, ishlab chiqarish jarayonida og‘ishlar yuz berdi: kesim tahlili pastki X-cut qatlami taxminan 220 nm ekanligini va yakuniy kombinatsiyalar 220/215 nm hamda 220/365 nm bo‘lganini ko‘rsatdi. Moda nomutanosibligini qisman tuzatish uchun orqa tomonga 30 nm qalinlikdagi Al qatlami yotqizildi. Bu moda balansini yaxshiladi, ammo massa yuklamasini oshirib, markaziy chastotani va elektromexanik bog‘lanish koeffitsientini biroz pasaytirdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ikki qatlamli platforma o‘z samaradorligini isbotladi: 5-tartibli filtr 5,8 GHz chastotada 18,6% FBW ko‘rsatdi, bu 6,1 GHz da hisoblangan 18,2% qiymatga yaqin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;4a-rasmda 5-tartibli filtrning mikrosurati keltirilgan. 1,9 Om ketma-ket qarshilikni hisobga olgan holda olingan sintezlangan xarakteristika (4b-rasm) 6,1 GHz markaziy chastotada 18,2% FBW ni bashorat qiladi. Eksperimental natijalar (4c-rasm) 5,8 GHz atrofida 18,6% FBW ni ko‘rsatadi. O‘tkazish polosasi kengligining biroz oshishi markaziy chastotaning pastga siljishi bilan bog‘liq. O‘lchangan kiritish yo‘qotishlari 4,9 dB ni tashkil etdi, bu rezonatorlarning o‘rtacha sifat koeffitsienti (Q) bilan cheklangan. Texnologik og‘ishlarga qaramay, ushbu ish vertikal qo‘zg‘aluvchi P3F LiNbO3 qalinlikdagi siljish rezonatorlari asosidagi birinchi zinapoyali filtrni namoyish etadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Zinapoyali filtr (ladder-type filter) — bu ketma-ket va parallel ulangan rezonatorlar zanjiri bo‘lib, ularning rezonans chastotalari farqi signal o‘tkazish polosasi hosil bo‘lishiga olib keladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;h4 id=\"p3f-simmetriyasini-muhandislik-loyihalash\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#p3f-simmetriyasini-muhandislik-loyihalash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;P3F simmetriyasini muhandislik loyihalash&lt;/span&gt;&lt;/a&gt;P3F simmetriyasini muhandislik loyihalash&lt;/h4&gt;\n&lt;p&gt;Ushbu ish shuni ko'rsatadiki, P3F (qutb-qutb yo'nalishidagi piezoelektrik plyonkalar) tuzilmasidagi simmetriyadan foydalanish qalinlik bo'yicha siljishli hajmli akustik rezonatorlarni loyihalash uchun yangi imkoniyatlar ochadi. An'anaviy yondashuvlardan farqli o'laroq, bu yerda piezoelektrik qatlamlar orasidagi bog'lanish burchagi akustik modlarni qo'zg'atishni boshqarish uchun qo'shimcha parametr sifatida ishlatiladi. Bu sekin siljish modalarini tanlab kuchaytirish yoki bostirish imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ikki qatlamli arxitektura va bog'lanish burchagini tanlash 6 GGs chastotada taxminan 35% elektromexanik bog'lanish koeffitsientiga erishish imkonini beradi, bu standart bir qatlamli yechimlardan ustundir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;An'anaviy X-kesimli LiNbO3 rezonatorlari bir vaqtning o'zida SH1,slow va SH1,fast modalarini qo'zg'atadi, bu esa filtrlarda amaliy qo'llanilishini cheklaydi. Y va YX 163° kesimlari toza spektrni ta'minlasa-da, ularning 6 GGs chastotadagi bog'lanish koeffitsienti 26% bilan cheklangan (Rasm S1 ga qarang). Taklif etilgan ikki qatlamli arxitektura X-kesimli LiNbO3 ning yuqori bog'lanishini SH2,slow modasining selektiv qo'zg'alishi bilan birlashtiradi. Yuqori tartibli modadan foydalanish plastinkalarni haddan tashqari yupqalashtirmasdan yuqori chastotalarda ishlashga imkon beradi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre-fS1.jpg\" alt=\"S1-rasm. 4,5 va 6 GGs atrofida ishlaydigan bir qatlamli X-kesim, Y-kesim va YX163° LiNbO3 qalinlik-siljish FBAR rezonato\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S1-rasm. 4,5 va 6 GGs atrofida ishlaydigan bir qatlamli X-kesim, Y-kesim va YX163° LiNbO3 qalinlik-siljish FBAR rezonatorlarining simulyatsiya qilingan sekinlik egri chiziqlari va admitans javoblari. a X-kesim LiNbO3 ning elastik va pyezo-qattiqlashtirilgan…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;S1-rasm. 4,5 va 6 GGs atrofida ishlaydigan bir qatlamli X-kesim, Y-kesim va YX163° LiNbO3 qalinlik-siljish FBAR rezonatorlarining simulyatsiya qilingan sekinlik egri chiziqlari va admitans javoblari. a X-kesim LiNbO3 ning elastik va pyezo-qattiqlashtirilgan sekinlik egri chiziqlari. Qo'shimcha SH1 tez rejimining nolga teng bo'lmagan bog'lanishini ta'kidlaydi. b 75 nm alyuminiy elektrodli 300 nm va 180 nm qalinlikdagi bir qatlamli X-kesim LiNbO3 qalinlik-siljish FBAR rezonatorlarining simulyatsiya qilingan admitans javoblari. 4,42 va 6,03 GGs dagi rezonanslar SH1 tez rejimini namoyish etadi, pyezoelektrik qalinligi kamayishi bilan bog'lanish 41,5% dan 34,5% gacha kamayadi. c Y-kesim LiNbO3 ning elastik va pyezo-qattiqlashtirilgan sekinlik egri chiziqlari. Qo'shimcha SH1 tez rejimining nol bog'lanishini ta'kidlaydi. d 75 nm alyuminiy elektrodli 300 nm va 180 nm qalinlikdagi bir qatlamli Y-kesim LiNbO3 qalinlik-siljish FBAR rezonatorlarining simulyatsiya qilingan admitans javoblari. 4,53 va 6,17 GGs dagi rezonanslar soxta modlardan xoli, ammo yupqaroq pyezoelektrik qatlam holatida bog'lanish 26,1% gacha kamayadi. e YX163° LiNbO3 ning elastik va pyezo-qattiqlashtirilgan sekinlik egri chiziqlari. Qo'shimcha SH1 tez rejimining nol bog'lanishini ta'kidlaydi. f 75 nm alyuminiy elektrodli 300 nm va 180 nm qalinlikdagi bir qatlamli YX163° LiNbO3 qalinlik-siljish FBAR rezonatorlarining simulyatsiya qilingan admitans javoblari. 4,57 va 6,21 GGs dagi rezonanslar soxta modlardan xoli, ammo yupqaroq pyezoelektrik qatlam holatida bog'lanish 26,7% gacha kamayadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Elektromexanik bog'lanish koeffitsienti — elektr energiyasini mexanik energiyaga aylantirish samaradorligining o'lchovidir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"amaliy-amalga-oshirish-va-cheklovlar\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#amaliy-amalga-oshirish-va-cheklovlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Amaliy amalga oshirish va cheklovlar&lt;/span&gt;&lt;/a&gt;Amaliy amalga oshirish va cheklovlar&lt;/h4&gt;\n&lt;p&gt;Eksperimental narvonli filtrlar keng o'tkazish qobiliyatiga (FBW) erishish mumkinligini tasdiqladi, ammo stekdagi asimmetriyaga yuqori sezgirlikni ham ko'rsatdi. SH1,slow modasining qoldiq javobi qatlam qalinligidagi nanometrik tafovutlar bilan bog'liq. Chastotani sozlash chuqurligi oshishi bilan sifat koeffitsientining (Q) pasayishi sirt shikastlanishi yoki elektrodlar bilan o'zaro ta'sir tufayli akustik yo'qotishlarning ortishini anglatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;6 GGs chastotada ishlab chiqarish aniqligiga bo'lgan talablar keskin oshadi, chunki qatlam qalinligidagi kichik og'ishlar ham simmetriyani buzadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Kelgusi ishlar qatlam qalinligini nazorat qilishni yaxshilash va elektrodlar geometriyasini optimallashtirishga qaratiladi. Ikki qatlamli X-kesimli LiNbO3 rezonatorlari keyingi avlod keng polosali filtrlari uchun istiqbolli platforma hisoblanadi.&lt;/p&gt;\n&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"materiallar\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#materiallar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Materiallar&lt;/span&gt;&lt;/a&gt;Materiallar&lt;/h4&gt;\n&lt;p&gt;Qurilmalar NGK Insulators tomonidan taqdim etilgan litiy niobat (LiNbO3) ikki qatlamli plastinalarida tayyorlangan. U 250 nm qalinlikdagi X-kesim qatlami va 350 nm qalinlikdagi -66°-X-kesim qatlamidan iborat bo‘lib, yuqori qarshilikli kremniy plastinaga yopishtirilgan. Pyezoelektrik qatlamning umumiy qalinligi 570 nm dan 630 nm gacha o‘zgarib turadi. Old yuzada platinali tekislash belgilari hosil qilindi. Kremniy substrat 250 mkm gacha yupqalashtirilgandan so‘ng, plastinani alohida chiplarga kesishdan oldin orqa yuzaga ham platinali belgilar qo‘yildi.&lt;/p&gt;\n&lt;h4 id=\"qurilmalarni-ishlab-chiqarish\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#qurilmalarni-ishlab-chiqarish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qurilmalarni ishlab chiqarish&lt;/span&gt;&lt;/a&gt;Qurilmalarni ishlab chiqarish&lt;/h4&gt;\n&lt;p&gt;Jarayon avval ma’lum bo‘lgan bir qatlamli YBAR texnologiyasiga asoslangan bo‘lib, qo‘shimcha ravishda yuqori LiNbO3 qatlamini lokal yupqalashtirish va ikki qatlamli stekda ariqchalar (trench) o‘yish bosqichlarini o‘z ichiga oladi. Asimmetrik stek rezonans chastotasini sozlash uchun tanlangan. Old yuzani qayta ishlash: yuqori LiNbO3 yuzasi ion-nurli o‘yish (IBE, Veeco Nexus IBE350) yordamida yupqalashtirildi. Cr/Al (5/75 nm) metall qatlami elektron-nurli bug‘lantirish (Bühler Alzenau LTE 700) orqali yotqizildi. Rezonator elektrodlari elektron-nurli litografiya (Raith EBPG5000+) va ZEP520A rezisti yordamida aniqlandi, so‘ngra metall va LiNbO3 qatlamlari 300 nm chuqurlikkacha o‘yildi. 500 nm qalinlikdagi alyuminiy kontakt maydonchalari lazerli yozish (Heidelberg MLA 150) yordamida lift-off usulida shakllantirildi. Orqa yuzani qayta ishlash: old yuzani 5 mkm fotoresist bilan himoyalab, QS135 mumi yordamida tashuvchi plastinaga yopishtirildi. Orqa yuzada 6 mkm fotoresist (Merck AZ10XT) yordamida fotolitografiya o‘tkazildi. Kremniy substrat Bosch jarayoni (DRIE, Alcatel AMS 200 SE) yordamida o‘yilib, osilib turgan membrana hosil qilindi. Orqa yuzaga Cr/Al (5/75 nm) suzuvchi elektrod yotqizildi. Qurilmalarni ajratish: himoya qatlamlari Remover 1165 erituvchisida olib tashlandi va izopropanol bilan yuvildi (3a-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Lift-off usuli — metall qatlamini rezist ustiga yotqizib, so‘ngra rezistni eritish orqali keraksiz metallni olib tashlash texnologiyasi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"elektr-tavsiflari\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#elektr-tavsiflari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Elektr tavsiflari&lt;/span&gt;&lt;/a&gt;Elektr tavsiflari&lt;/h4&gt;\n&lt;p&gt;Qurilmalarning elektr ko‘rsatkichlari GSG zondlari va R&amp;amp;S®ZNB20 vektor analizatori (VNA) yordamida -15 dBm quvvatda o‘lchandi. De-embeding qo‘llanilmadi. Rezonator parametrlari mBVD modeli yordamida aniqlandi. Filtrlar uchun ikki portli konfiguratsiyada S21 va S11 o‘lchandi. Samarali elektromexanik bog‘lanish koeffitsiyenti &lt;span class=\"yfm-latex\" data-content=\"k_%7Beff%7D%5E2%20%3D%20%5Cfrac%7Bf_a%5E2%20-%20f_r%5E2%7D%7Bf_a%5E2%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; formulasi bo‘yicha hisoblandi, bunda f_r va f_a mos ravishda rezonans va antirezonans chastotalaridir.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre-f1.jpg\" alt=\"1-rasm. Qalinlik-siljish hajmli akustik rezonator arxitekturalari va vakillik javoblari. a Taklif etilgan qurilmaning uc\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. Qalinlik-siljish hajmli akustik rezonator arxitekturalari va vakillik javoblari. a Taklif etilgan qurilmaning uch o'lchovli sxemasi, u osilgan LiNbO3 membranada naqshlangan alyuminiy IDTlardan iborat.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm. Qalinlik-siljish hajmli akustik rezonator arxitekturalari va vakillik javoblari. a Taklif etilgan qurilmaning uch o'lchovli sxemasi, u osilgan LiNbO3 membranada naqshlangan alyuminiy IDTlardan iborat. A-A bo'ylab kesma osilgan tuzilmani va qalinlik-siljish qo'zg'alishini ta'minlaydigan suzuvchi pastki elektrodni ta'kidlaydi. b Bir qatlamli X-kesim LiNbO3 rezonator steki. c X-kesim LiNbO3 qalinlik-siljish BAW rezonatorining admitans javobi, SH1 sekin rejimining kuchli bog'lanishi va SH1 tez rejimining soxta rejimi bilan birga. d Optimallashtirilgan bog'lanish burchagi θ bilan bog'langan X-kesim va -X-kesim LiNbO3 qatlamlaridan iborat taklif etilgan ikki qatlamli rezonator steki. e Taxminan 4,5 GGs chastotada SH1 sekin va SH2 sekin rejimlarning selektiv qo'zg'alishini, shuningdek, tarmoqli ichidagi tez siljish rejimlarini bostirishni ko'rsatadigan vakillik admitans javoblari. Bu turli xil LiNbO3 qatlam qalinligi va bog'lanish burchaklaridan foydalangan holda amalga oshiriladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre-f2.jpg\" alt=\"2-rasm. Ikki qatlamli rezonatorning kontseptsiyasi va rejimni tanlash xatti-harakati. a Alohida X-kesim va -X-kesim LiNb\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm. Ikki qatlamli rezonatorning kontseptsiyasi va rejimni tanlash xatti-harakati. a Alohida X-kesim va -X-kesim LiNbO3 qatlamlarining kristallografik yo'nalishlarining sxematik tasviri, mos ravishda φ1 va φ2 tekislikdagi aylanish burchaklari bilan…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-rasm. Ikki qatlamli rezonatorning kontseptsiyasi va rejimni tanlash xatti-harakati. a Alohida X-kesim va -X-kesim LiNbO3 qatlamlarining kristallografik yo'nalishlarining sxematik tasviri, mos ravishda φ1 va φ2 tekislikdagi aylanish burchaklari bilan aniqlanadi. b X-kesim va -X-kesim LiNbO3 uchun e34 pyezoelektrik koeffitsientining φ individual tekislikdagi aylanish burchagiga bog'liq holda evolyutsiyasi. φ ≈ 33° da ikkala yo'nalish ham teng kattalikdagi va qarama-qarshi belgili koeffitsientlarni namoyish etadi. c Bog'lanish burchagi θ ning pastki X-kesim va yuqori -X-kesim LiNbO3 qatlamlarining Y'cr o'qlari orasidagi yo'naltirilgan burchak sifatida ta'rifi, θ = 360 – (φ1 + φ2) bilan. d Tanlangan bog'lanish konfiguratsiyalari uchun simulyatsiya qilingan admitans javobi: (i) θ = 0° tekislangan Y o'qlariga mos keladi, bu ikkala rejimning zaifroq qo'zg'alishiga olib keladi; (ii) θ = 114°, SH1 sekin bog'lanishni maksimal darajada oshiradi va SH2 sekin rejimini bostiradi; (iii) θ = 294° (-66° ga teng), SH1 sekin rejimini to'liq bostirishga va SH2 sekin bog'lanishni maksimal darajada oshirishga olib keladi; (iv) θ = 66°, faqat SH2 sekin rejimini selektiv qo'zg'atish uchun burilish yo'nalishining muhimligini ko'rsatadi. (ii) va (iii) holatlar bitta vakillik tekislikdagi siljish komponenti va bitta siljish kuchlanish komponenti bilan birga keladi, ular bog'lanish burchagiga qarab SH1 sekin va SH2 sekin rejim shakllarini aniqlash uchun etarli. Tez siljish rejimlari barcha burilish kombinatsiyalari uchun bostiriladi. e Rezonator qalinligi bo'ylab SH1 sekin va SH2 sekin rejimlarining vakillik tekislikdagi siljish va siljish kuchlanish komponentlari, ularning mos rejim simmetriyalarini ko'rsatadi. f Ikki LiNbO3 qatlami orasidagi bog'lanish burchagi θ ga bog'liq holda SH1 sekin va SH2 sekin rejimlarining simulyatsiya qilingan elektromexanik bog'lanish faktori k2eff. Barcha simulyatsiyalar 250 nm simmetrik litiy niobat qatlam qalinligi va 75 nm alyuminiy elektrod qalinligi yordamida amalga oshirildi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre-f3.jpg\" alt=\"3-rasm. Ishlab chiqarilgan ikki qatlamli rezonatorlarning mikrofotograflari, o'lchangan admitans javobi va ikki qatlamli\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm. Ishlab chiqarilgan ikki qatlamli rezonatorlarning mikrofotograflari, o'lchangan admitans javobi va ikki qatlamli qalinlik simmetriyasining ta'siri. a Ishlab chiqarilgan ikki qatlamli qurilmaning optik mikrofotografi, osilgan membrana hududini va orqa…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-rasm. Ishlab chiqarilgan ikki qatlamli rezonatorlarning mikrofotograflari, o'lchangan admitans javobi va ikki qatlamli qalinlik simmetriyasining ta'siri. a Ishlab chiqarilgan ikki qatlamli qurilmaning optik mikrofotografi, osilgan membrana hududini va orqa suzuvchi elektrodni ta'kidlaydi. b Kremniy substrat ustidagi alohida LiNbO3 qalinligini ko'rsatadigan ikki qatlamli stekning kesma SEM tasviri. c Ishlab chiqarilgan ikki qatlamli rezonatorning o'lchangan va simulyatsiya qilingan admitans javoblari. Dominant SH2 sekin rezonansi 6,04 GGs da 34,6% elektromexanik bog'lanish bilan o'lchanadi. Qoldiq SH1 sekin rejimi 4,16 GGs da 0,9% kamaytirilgan bog'lanish bilan kuzatiladi, bu ikki qatlamli qalinlikdagi assimetriyaga mos keladi. Simulyatsiya javobi qarshilik yo'qotishlarini hisobga oladi va o'lchangan javob bilan mos keladi. d Taxminan 220 nm qalinlikdagi X-kesim LiNbO3 pastki qatlami va 350 nm, 290 nm va 250 nm qalinlikdagi -X-kesim yuqori qatlamlaridan tashkil topgan ikki qatlamli rezonatorlarning o'lchangan admitans javoblari. Yuqori qatlamni bosqichma-bosqich qirqish SH1 sekin rejimining qo'zg'alishini kamaytiradi va SH2 sekin rejimining bog'lanishini kuchaytiradi. tLN,top/tLN,bot qalinlik nisbati funksiyasi sifatida har ikkala rejimning rezonans chastotalari (e) va k2eff (f) ning simulyatsiya qilingan evolyutsiyasi, o'lchangan ko'rsatkichlar bilan birga. O'lchangan javoblar simulyatsiyalar bilan yaxshi mos kelishini ko'rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre-f4.jpg\" alt=\"4-rasm. Ikki qatlamli rezonatorlardan foydalangan holda filtrni amalga oshirish. a Ishlab chiqarilgan 5-tartibli narvon \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm. Ikki qatlamli rezonatorlardan foydalangan holda filtrni amalga oshirish. a Ishlab chiqarilgan 5-tartibli narvon tipidagi filtrning optik mikrofotografi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-rasm. Ikki qatlamli rezonatorlardan foydalangan holda filtrni amalga oshirish. a Ishlab chiqarilgan 5-tartibli narvon tipidagi filtrning optik mikrofotografi. Kerakli chastota ajratilishiga erishish uchun ketma-ket rezonatorlar uchun yuqori qatlam LiNbO3 selektiv ravishda qirqilgan. b Qatlam qalinligini eksperimental o'lchash orqali olingan 220 nm/215 nm va 220 nm/365 nm X-kesim/-X-kesim LiNbO3 qalinlik kombinatsiyalariga ega simulyatsiya qilingan ikki qatlamli rezonatorlardan foydalangan holda 5-tartibli narvon tipidagi filtrning sintez qilingan javobi. c 5,8 GGs atrofida markazlashgan 18,6% FBW ni ko'rsatadigan 5-tartibli narvon tipidagi filtrning o'lchangan javobi. O'lchangan natijalarga hech qanday de-embedding qo'llanilmagan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre-fS2.jpg\" alt=\"S2-rasm. Bir qatlamli va ikki qatlamli LiNbO₃ qalinlikdagi siljishli FBAR rezonatorlarining bir o'lchovli to'lqin tengla\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S2-rasm. Bir qatlamli va ikki qatlamli LiNbO₃ qalinlikdagi siljishli FBAR rezonatorlarining bir o'lchovli to'lqin tenglamasi tahlili. a 300 nm qalinlikdagi, chegaralari kuchlanishsiz bo'lgan bir qatlamli X-kesimli LiNbO3 plastinasining analitik modeli. b 300…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;S2-rasm. Bir qatlamli va ikki qatlamli LiNbO₃ qalinlikdagi siljishli FBAR rezonatorlarining bir o'lchovli to'lqin tenglamasi tahlili. a 300 nm qalinlikdagi, chegaralari kuchlanishsiz bo'lgan bir qatlamli X-kesimli LiNbO3 plastinasining analitik modeli. b 300 nm X-kesimli LiNbO3 va 300 nm -X-kesimli LiNbO3 dan tashkil topgan, tashqi chegaralari kuchlanishsiz va tutashuv joyida kuchlanish va siljish uzluksizligiga ega bo'lgan ikki qatlamli strukturaning analitik modeli. c, d Yuqoridan pastga: hisoblangan elektr admitansi (yuqorida), mexanik rezonanslarni aniqlovchi chegara shartlari matritsasining teskari minimal singulyar soni (o'rtada) va mos ravishda bir qatlamli (c) va ikki qatlamli (d) konfiguratsiyalar uchun modlarning elektr qo'zg'aluvchanligini miqdoriy baholovchi normallashtirilgan proyeksiya (pastda).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre-fS3.jpg\" alt=\"S3-rasm. Turli LiNbO3 yo'nalishlari uchun tez siljish modlarining qo'zg'aluvchanligini analitik baholash.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S3-rasm. Turli LiNbO3 yo'nalishlari uchun tez siljish modlarining qo'zg'aluvchanligini analitik baholash.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;S3-rasm. Turli LiNbO3 yo'nalishlari uchun tez siljish modlarining qo'zg'aluvchanligini analitik baholash. a, b 300 nm qalinlikdagi Y-kesimli (a) va YX 163° (b) LiNbO3 rezonatorlari uchun hisoblangan elektr admitansi (yuqorida), chegara shartlari matritsasining teskari minimal singulyar soni (o'rtada) va normallashtirilgan elektr qo'zg'aluvchanlik proyeksiyasi (pastda). Ikkala holatda ham tez siljish modi mexanik jihatdan qo'llab-quvvatlanadi, lekin elektr jihatdan qo'zg'almaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre-fS4.jpg\" alt=\"S4-rasm. Tekislikda aylanish vaqtida bo'ylama va ko'ndalang nojo'ya modlarning namoyon bo'lishi. a 2D simulyatsiyalar uc\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S4-rasm. Tekislikda aylanish vaqtida bo'ylama va ko'ndalang nojo'ya modlarning namoyon bo'lishi. a 2D simulyatsiyalar uchun ishlatiladigan 2 ta kesish tekisligiga ega ikki qatlamli qalinlikdagi siljishli FBAR rezonatorining yuqoridan ko'rinishi sxemasi: A-A…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;S4-rasm. Tekislikda aylanish vaqtida bo'ylama va ko'ndalang nojo'ya modlarning namoyon bo'lishi. a 2D simulyatsiyalar uchun ishlatiladigan 2 ta kesish tekisligiga ega ikki qatlamli qalinlikdagi siljishli FBAR rezonatorining yuqoridan ko'rinishi sxemasi: A-A bo'ylama nojo'ya modlarni, B-B esa ko'ndalang nojo'ya modlarni ajratib ko'rsatadi. b A-A va B-B kesimlari yordamida olingan simulyatsiya qilingan admitans javoblari, ular zaif, ammo ko'p sonli bo'ylama va ko'ndalang nojo'ya modlarni ajratib ko'rsatadi. Egri chiziqlar aniqlik uchun siljitilgan. c Nojo'ya modlarni miqdoriy baholash usulining illyustratsiyasi. Asosiy modning moslashtirilgan javobi simulyatsiya qilingan admitansdan ayirilib, qoldiq javob olinadi, undan diapazon ichidagi nojo'ya modlarning namoyon bo'lish darajasi chiqariladi. d Ikki qatlamli burilish burchagi θ = 294° bo'lganda, rezonatorning tekislikdagi aylanish burchagiga bog'liq holda bo'ylama (A-A) va ko'ndalang (B-B) yo'nalishlar uchun ajratib olingan nojo'ya modlar namoyon bo'lishining yig'indisi. Grafik nojo'ya modlarning 180° fazali siljish bilan burchak bog'liqligini ko'rsatadi, ya'ni bo'ylama nojo'ya modlarni minimallashtirish ko'ndalanglarini maksimallashtiradi va aksincha.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre-fS5.jpg\" alt=\"S5-rasm. Ikki qatlamli qalinlikdagi siljishli hajmli akustik rezonatorlarda elektrod simmetriyasining siljish modini qo'\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S5-rasm. Ikki qatlamli qalinlikdagi siljishli hajmli akustik rezonatorlarda elektrod simmetriyasining siljish modini qo'zg'atishga ta'siri. a Simmetrik (75 nm/75 nm) va asimmetrik (25 nm/75 nm) elektrod konfiguratsiyalarini solishtirgan holda, LiNbO3…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;S5-rasm. Ikki qatlamli qalinlikdagi siljishli hajmli akustik rezonatorlarda elektrod simmetriyasining siljish modini qo'zg'atishga ta'siri. a Simmetrik (75 nm/75 nm) va asimmetrik (25 nm/75 nm) elektrod konfiguratsiyalarini solishtirgan holda, LiNbO3 qalinligi nisbati tLN,top/tLN,bot ga bog'liq holda SH1,slow va SH2,slow modlarining simulyatsiya qilingan rezonans chastotalari. b Mos keladigan simulyatsiya qilingan elektromexanik bog'lanish faktorlari keff². Elektrod asimmetriyasi SH2,slow bog'lanishining maksimal va SH1,slow bog'lanishining minimal qiymatlariga mos keladigan qalinlik nisbatini o'zgartiradi va modal javobning LiNbO3 qalinligi nomutanosibligiga chidamliligini o'zgartiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre-fS6.jpg\" alt=\"S6-rasm. Ikki qatlamli LiNbO₃ qalinlikdagi siljishli FBAR rezonatorlariga asoslangan 3- va 5-tartibli zinapoyali filtrla\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S6-rasm. Ikki qatlamli LiNbO₃ qalinlikdagi siljishli FBAR rezonatorlariga asoslangan 3- va 5-tartibli zinapoyali filtrlarning sintez qilingan va o'lchangan javoblari. a Chekli elementlar simulyatsiyasi va mBVD asosidagi sxema sintezi yordamida olingan…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;S6-rasm. Ikki qatlamli LiNbO₃ qalinlikdagi siljishli FBAR rezonatorlariga asoslangan 3- va 5-tartibli zinapoyali filtrlarning sintez qilingan va o'lchangan javoblari. a Chekli elementlar simulyatsiyasi va mBVD asosidagi sxema sintezi yordamida olingan uchinchi tartibli zinapoyali filtrning sintez qilingan javobi. b Ishlab chiqarilgan uchinchi tartibli zinapoyali filtrning o'lchangan javobi. c Beshinchi tartibli zinapoyali filtrning sintez qilingan javobi. d Ishlab chiqarilgan beshinchi tartibli zinapoyali filtrning o'lchangan javobi. Ichki rasmlarda filtrning o'tkazish diapazonlari, shuningdek, ajratib olingan kiritish yo'qotishlari, markaziy chastota va nisbiy o'tkazish qobiliyati ko'rsatilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"s
