        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"262\" cy=\"86\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"498\" cy=\"240\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · OTHER   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;AIR-LLM: xotira va&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;yuklashsiz neyron&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;tarmoqlarni ishga tushirish&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-f2.jpg\" alt=\"2-rasm. Har bir raundda GEMV ning 𝐴 ta ichki ko'paytmasini (IP) (yoki haqiqiy qiymatli bo'lsa 2𝐴 ta) bajaradigan AIR-LLM\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm. Har bir raundda GEMV ning 𝐴 ta ichki ko'paytmasini (IP) (yoki haqiqiy qiymatli bo'lsa 2𝐴 ta) bajaradigan AIR-LLM ning RF hisoblash dvigateli umumiy ko'rinishi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-rasm. Har bir raundda GEMV ning 𝐴 ta ichki ko'paytmasini (IP) (yoki haqiqiy qiymatli bo'lsa 2𝐴 ta) bajaradigan AIR-LLM ning RF hisoblash dvigateli umumiy ko'rinishi. Markaziy radiostansiya ushbu IP vaznlarini foydalanuvchiga xos dastlabki kodlashsiz (precoding) o'zining 𝐴 ta antennalari orqali uzatadi. So'ngra har bir chetki qurilma qabul qilingan 𝐴 ta vazn to'lqin shakllarini o'zining GEMV kirishi bilan birga 𝐶 ta kalibrlash bloklariga uzatadi; ularning prekoderlari va postkoderlari ushbu foydalanuvchining o'z kanalidan SVD ga asoslangan boshlang'ich sozlash va ALS ga asoslangan aniq sozlash orqali olinadi. 𝐶 ta blokning chiqishlarini qo'shish ushbu raundning GEMV chiqishini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;AIR-LLM neyron tarmoq hisob-kitoblarini mahalliy xotiradan radiochastota domeniga o'tkazadi. Markaziy stansiya model vaznlarini OFDM signallari orqali uzatadi, foydalanuvchi qurilmasi esa oddiy RF-mikser yordamida matritsa-vektor ko'paytmasini (GEMV) bajaradi. Bu ma'lumotlarni o'qish uchun energiya sarfini istisno qilib, xotirasi cheklangan qurilmalarda LLM'ni ishga tushirish imkonini beradi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Hisob-kitoblar mikserlar orqali analog RF-domenda bajariladi&lt;/li&gt;\n&lt;li&gt;FP16 hisob-kitoblariga nisbatan 157,7 barobar energiya tejamkorligi&lt;/li&gt;\n&lt;li&gt;Masshtablilik: bitta uzatish cheksiz foydalanuvchiga xizmat qiladi&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;AIR-LLM asosi sifatida radiochastota mikseridan (RF mixer) hisoblash tuguni sifatida foydalaniladi. Mikser signallarni vaqt domenida analog ko'paytirishni amalga oshiradi, bu chastota domenidagi chiziqli konvolyutsiyaga ekvivalentdir. GEMV operatsiyasini amalga oshirish uchun model vaznlari OFDM-tashuvchilarga kodlanadi, aktivatsiyalar esa lokal ossillyator orqali uzatiladi. Natijada, chiqish signalining o'rta tashuvchisi vektorlarning skalyar ko'paytmasini o'z ichiga oladi, bu esa barcha oraliq ma'lumotlarni raqamlashtirmasdan natijani olish imkonini beradi.&lt;/p&gt;\n&lt;p&gt;Masshtablilik uchun tizim MIMO-multiplekslashdan (Multiple-Input Multiple-Output) foydalanadi va bir vaqtning o'zida bir nechta vazn oqimini uzatadi. Kanalni kalibrlash pre-koder va post-koder juftligi orqali amalga oshiriladi, bu mijoz tomonidagi hisoblash xarajatlarini minimallashtiradi. NVIDIA Sionna nurlarni kuzatish (ray-tracing) yordamida LLaMA-3.1-8B modelida o'tkazilgan sinovlarda ushbu usul FP16 bilan solishtirganda energiya sarfini 157,7 barobar kamaytirdi va 20 ta foydalanuvchi uchun uzatish vaqtini 104,1 barobar qisqartirdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot NVIDIA Sionna kanallari simulyatsiyasi va bitta turdagi RF-mikser profiliga asoslangan, bu real muhitdagi barcha shovqinlarni hisobga olmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Zamonaviy katta til modellari (LLM) bulutli infratuzilmalardan periferik qurilmalarga faol o'tmoqda. Biroq, bunday qurilmalar ko'pincha xotira yetishmasligi yoki modellarni yuklashda energiya sarfining yuqoriligi kabi muammolarga duch keladi. Mualliflar savol qo'yishadi: LLM inferensini modellarni mahalliy saqlamasdan yoki oldindan yuklamasdan, ularni «havo orqali» qabul qilib, real vaqt rejimida qayta ishlash mumkinmi?&lt;/p&gt;\n&lt;p&gt;AIR-LLM konsepsiyasi taqdim etilgan bo'lib, u markaziy radio tugun (masalan, 5G baza stansiyasi) va periferik foydalanuvchidan iborat. Radio tugun model vaznlarini efirga uzatadi, foydalanuvchi qurilmasi esa radiochastota (RCh) aralashtirgichlar yordamida to'g'ridan-to'g'ri RCh domenida umumiy matritsa-vektor ko'paytirish (GEMV) amalini bajaradi. Ma'lumotlarni uzatish vaqtini optimallashtirish uchun MIMO fazoviy multiplekslash va simsiz kanalni kalibrlash uchun energiya tejamkor pre-koder va post-koder juftligi qo'llaniladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AIR-LLM vaznlarni saqlamasdan inferens bajarish imkonini beradi, FP16 bazaviy liniyasiga nisbatan 157,7 barobar energiya tejaydi va 20 foydalanuvchi bilan ishlashda uzatish vaqtini 104,1 barobarga qisqartiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GEMV (General Matrix-Vector Multiplication) — bu neyron tarmoqlar ishining asosi bo'lgan matematik amal bo'lib, unda vaznlar matritsasi kirish vektori bilan ko'paytiriladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tizim NVIDIA Sionna simulyatori yordamida ikkita shahar muhitida, real RCh aralashtirgichlar xususiyatlarini hisobga olgan holda sinovdan o'tkazildi. LLaMA-3.1-8B modeli bilan ishlashda WikiText-2 ma'lumotlar to'plamidagi perplexity degradatsiyasi atigi 4,0% ni tashkil etdi. Tizim masshtablanuvchan, chunki markaziy radio tugun foydalanuvchilarni identifikatsiya qilishni talab qilmaydi, bu esa qamrov zonasidagi cheksiz foydalanuvchilarga xizmat ko'rsatish imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Natijalar NVIDIA Sionna muhitidagi simulyatsiyalar va RCh aralashtirgichlar profiliga asoslangan bo'lib, real apparat ta'minotidagi ish sharoitlaridan farq qilishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;h4 id=\"llmlarni-chekka-qurilmalarga-joriy-etish\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#llmlarni-chekka-qurilmalarga-joriy-etish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;LLM'larni chekka qurilmalarga joriy etish&lt;/span&gt;&lt;/a&gt;LLM'larni chekka qurilmalarga joriy etish&lt;/h4&gt;\n&lt;p&gt;Bugungi kunda trillionlab chekka qurilmalar sog'liqni saqlash monitoringi, nutqni tanish va avtonom boshqaruv kabi sohalarda mashinali o'qitish usullaridan foydalanmoqda. Katta til modellari (LLM) tabiiy tilni tushunish va qayta ishlashda yangi imkoniyatlar ochadi, biroq ularning chekka qurilmalarda ishlashi asosan bulutli hisoblashlarga tayanadi. Bu esa ma'lumotlar maxfiyligi va kechikish (latency) bilan bog'liq muammolarni keltirib chiqaradi. Asosiy to'siq — modellarning hajmi: masalan, LLaMA-3.1-8B modeli FP16 formatida 16 GB, 4-bitli kvantlashdan (WoQ) keyin esa 4 GB xotirani talab qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LLM'larni chekka qurilmalarda ishlatishdagi asosiy muammo xotira hajmining yetishmasligi va og'irlik koeffitsientlarini xotiradan hisoblash blokiga uzatishdagi yuqori energiya sarfidir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kvantlash (quantization) — model parametrlarining aniqligini kamaytirish orqali uning xotiradagi hajmini qisqartirish usulidir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;LLM'larda xulosa chiqarish (inference) jarayoni xotira o'tkazuvchanligi bilan cheklangan: bitta og'irlikni o'qish atigi ikkita suzuvchi nuqtali operatsiyani (FLOPs) ta'minlaydi. Natijada, ma'lumotlarni ko'chirishga sarflanadigan energiya hisoblash jarayonidan ancha yuqori bo'ladi. Xotira ichidagi hisoblashlar (ReRAM, PCM, SRAM) yoki havoda hisoblash (over-the-air) kabi usullar apparat cheklovlari (masalan, 128×128 o'lchamli krossbarlar) tufayli zamonaviy LLM'lar uchun mos emas.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mavjud apparat yechimlari (masalan, 128×128 krossbarlar) matritsali hisoblashlar hajmini cheklab qo'yadi, bu esa o'sib borayotgan LLM'lar uchun yetarli emas.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz mavjud 5G tarmoqlarining imkoniyatlaridan foydalanishni taklif qilamiz. 5G tayanch stansiyasi orqali og'irlik koeffitsientlarini barcha foydalanuvchilarga bir vaqtning o'zida eshittirish (broadcasting) orqali uzatish mumkin. Hisoblashlar uchun biz RF-aralashtirgichlar (RF mixer) yordamida radiochastotali (RF) hisoblash usulini qo'llaymiz. Bu signal qabul qilinganda analog shaklda hisoblashni amalga oshirishga imkon beradi va og'irlik koeffitsientlarini raqamlashtirish yoki xotirada saqlash zaruratini yo'q qiladi.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 1.&lt;/strong&gt; AIR-LLM va mavjud chekka hisoblash paradigmalarini taqqoslash&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;1&lt;/th&gt;\n&lt;th&gt;2&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;2&lt;/td&gt;\n&lt;td&gt;2&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h4 id=\"air-llm-hisoblash-paradigmasi\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#air-llm-hisoblash-paradigmasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AIR-LLM hisoblash paradigmasi&lt;/span&gt;&lt;/a&gt;AIR-LLM hisoblash paradigmasi&lt;/h4&gt;\n&lt;p&gt;AIR-LLM — bu LLM inferensi uchun arxitektura bo'lib, unda markaziy radiostansiya (masalan, 5G minorasi) model vaznlarini OFDM signali chastota spektriga kodlaydi va uzatadi. Qamrov zonasidagi har qanday qurilma ushbu signalni qabul qiladi va hisob-kitoblarni o'zining radiochastota (RF) traktida bajaradi. Asosiy element — bu RF-aralashtirgich (mixer), u signallarni vaqt sohasida ko'paytiradi, bu chastota sohasidagi chiziqli konvolyutsiyaga ekvivalentdir. Lokal osilatorga aktivatsiyalar signali berilganda, vaznlar spektrining aktivatsiyalar spektriga konvolyutsiyasi yuz beradi va natijaning markaziy kichik tashuvchisi (subcarrier) vaznlar va aktivatsiyalar vektorlarining skalyar ko'paytmasini beradi. Paradigmalarni taqqoslash 1-jadvalda keltirilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AIR-LLM RF-aralashtirgichlardan foydalanib, GEMV operatsiyalarini to'g'ridan-to'g'ri radiokanalda bajaradi, bu esa lokal xotiraga murojaat qilish zaruratini yo'qotadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tizim A × A MIMO fazoviy multipleksatsiyasidan foydalanib, bir vaqtning o'zida A ta vazn oqimini uzatadi, bu efir vaqtini A marta qisqartiradi. Kanalni kompensatsiya qilish uchun C blokli kalibrlash qo'llaniladi, bu matritsa inversiyasidan ancha arzon. AIR-LLM foydalanuvchilar bilan «qo'l siqish» (handshake) yoki SNRga qarab modulyatsiya sxemasini (MCS) moslashtirishni talab qilmaydi, chunki hisob-kitoblar termal shovqinga chidamli. Parij va Myunxen stsenariylarida 1B dan 70B parametrgacha bo'lgan modellar (LLaMA-3.1-8B) sinovlarida aniqlikning (PPL) pasayishi atigi 4.0% ni tashkil etdi. Bir tokenga sarflanadigan energiya masofaviy xotiradagi FP16/4-bitli vaznlarga nisbatan 157.7/40.4 marta, lokal xotiradan olishga nisbatan esa 51.5/13.9 marta kamaydi. Efir vaqti 104.1/26.0 marta qisqardi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GEMV (General Matrix-Vector Multiplication) — neyron tarmoqlardagi asosiy operatsiya bo'lib, unda vaznlar matritsasi aktivatsiyalar vektoriga ko'paytiriladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ofdm-va-mimo-kanal-modeli\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#ofdm-va-mimo-kanal-modeli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;OFDM va MIMO kanal modeli&lt;/span&gt;&lt;/a&gt;OFDM va MIMO kanal modeli&lt;/h4&gt;\n&lt;p&gt;Signallar Nfft FFT o'lchami va B polosali OFDM asosida qurilgan, bunda kichik tashuvchilar oralig'i Δ f = B/Nfft. A_t × A_r MIMO tizimida uzatiladigan signal &lt;span class=\"yfm-latex\" data-content=\"S_t%20%5Cin%20%5Cmathbb%7BC%7D%5E%7BA_t%20%20imes%20N_%7B%20ext%7Bfft%7D%7D%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; va qabul qilingan signal &lt;span class=\"yfm-latex\" data-content=\"S_r%20%5Cin%20%5Cmathbb%7BC%7D%5E%7BA_r%20%20imes%20N_%7B%20ext%7Bfft%7D%7D%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; kanal &lt;span class=\"yfm-latex\" data-content=\"H%20%5Cin%20%5Cmathbb%7BC%7D%5E%7BA_t%20%20imes%20A_r%20%20imes%20N_%7B%20ext%7Bfft%7D%7D%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; orqali bog'langan. Qabul qilingan signal (1) formula bilan aniqlanadi:&lt;br /&gt;\n&lt;span class=\"yfm-latex\" data-content=\"S_r%5Ba_r%2C%20k%5D%20%3D%20%5Csum_%7Ba_t%3D0%7D%5E%7BA_t-1%7D%20H%5Ba_t%2C%20a_r%2C%20k%5D%20%5Ccdot%20S_t%5Ba_t%2C%20k%5D%20%2B%20%5Cfrac%7B%5Csigma%7D%7B%5Csqrt%7BN_%7B%20ext%7Bfft%7D%7D%7D%7D%20%5Ccdot%20N\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;&lt;br /&gt;\nbu yerda σ² — AWGN shovqin quvvati. Qabul qiluvchi tomonda signalni tiklash uchun (2) psevdo-teskari matritsa ishlatiladi, bu 8A_t A_r Nfft suzuvchi nuqtali operatsiyani talab qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kanal inversiyasi orqali signalni tiklash qurilma tomonida sezilarli hisoblash resurslarini talab qiladi, bu esa katta MIMO o'lchamlarida samaradorlikni cheklaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kompleks-qiymatli-chiziqli-konvolyutsiya\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#kompleks-qiymatli-chiziqli-konvolyutsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kompleks qiymatli chiziqli konvolyutsiya&lt;/span&gt;&lt;/a&gt;Kompleks qiymatli chiziqli konvolyutsiya&lt;/h4&gt;\n&lt;p&gt;Radiochastota (RF) mikseri teng Δ f chastotali ikkita kirish signali o'rtasida kompleks qiymatli chiziqli konvolyutsiyani (∗) amalga oshirish imkonini beradi. FFT hajmi (Nfft) bir xil deb faraz qilsak, kirish signali &lt;span class=\"yfm-latex\" data-content=\"X%20%5Cin%20%5Cmathbb%7BC%7D%5E%7BN_%7B%20ext%7Bfft%7D%7D%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; va vazn signali &lt;span class=\"yfm-latex\" data-content=\"W%20%5Cin%20%5Cmathbb%7BC%7D%5E%7BN_%7B%20ext%7Bfft%7D%7D%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (3)-formulaga ko'ra &lt;span class=\"yfm-latex\" data-content=\"Y%20%5Cin%20%5Cmathbb%7BC%7D%5E%7B2N_%7B%20ext%7Bfft%7D%7D-1%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; chiqish signalini hosil qiladi: &lt;span class=\"yfm-latex\" data-content=\"Y%5Bk%5D%20%3D%20(W%20*%20X)%5Bk%5D%20%3D%20%5Csum_%7Bk'%7D%20W%5Bk'%5D%20%5Ccdot%20X%5Bk-k'%5D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RF mikseri konvolyutsiya operatsiyasini apparat darajasida bajarib, kompleks signallarni samarali qayta ishlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"gemv/ip-uchun-chiziqli-konvolyutsiyadan-foydalanish\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#gemv/ip-uchun-chiziqli-konvolyutsiyadan-foydalanish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GEMV/IP uchun chiziqli konvolyutsiyadan foydalanish&lt;/span&gt;&lt;/a&gt;GEMV/IP uchun chiziqli konvolyutsiyadan foydalanish&lt;/h4&gt;\n&lt;p&gt;ML xulosalash asosida yotuvchi Y = W · X (&lt;span class=\"yfm-latex\" data-content=\"W%20%5Cin%20%5Cmathbb%7BR%7D%5E%7BM%20%20imes%20N%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"X%20%5Cin%20%5Cmathbb%7BR%7D%5EN\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;) matritsa-vektor ko'paytmasi (GEMV) M ta mustaqil skalyar ko'paytmaga (IP) bo'linadi. (3)-konvolyutsiya kompleks bo'lgani uchun, bitta signal juftligi ikkita IP ni tashiydi. W matritsasining m va m' qatorlari uchun Nfft = N bo'lganda, kirish signali X to'g'ridan-to'g'ri uzatiladi, vazn signali esa Wm,m'[k] = W[m, N-1-k] + j · W[m', N-1-k] (4) ko'rinishida kodlanadi. (5)-formulaga ko'ra, markaziy subkaryer Y[N-1] natijani Y[m] + j · Y[m'] sifatida saqlaydi. Qolgan 2N-2 subkaryerlar Δ f polosali past chastotali filtr (LPF) orqali kesib tashlanadi. Bu ADC energiya sarfini kamaytiradi, chunki faqat bitta subkaryerni raqamlashtirish kifoya. Jami &lt;span class=\"yfm-latex\" data-content=\"%5Clceil%20M%2F2%20%5Crceil\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ta vazn signali talab qilinadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GEMV — bu matritsani vektorga ko'paytirish operatsiyasi; bu yerda u hisoblash tezligini oshirish uchun analog radio signalga \"o'raladi\".&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"rf-hisoblash-dvigateli\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#rf-hisoblash-dvigateli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RF hisoblash dvigateli&lt;/span&gt;&lt;/a&gt;RF hisoblash dvigateli&lt;/h4&gt;\n&lt;p&gt;AIR-LLM arxitekturasi (2-rasm) MIMO tizimidan foydalanadi, bunda efirga uzatiladigan vaznlar kanali analog GEMV uchun moslashtirilgan pre-koder va post-koder juftligi bilan kalibrlanadi.&lt;/p&gt;\n&lt;h4 id=\"muammoni-shakllantirish\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#muammoni-shakllantirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muammoni shakllantirish&lt;/span&gt;&lt;/a&gt;Muammoni shakllantirish&lt;/h4&gt;\n&lt;p&gt;Biz A × A MIMO tizimini ko'rib chiqamiz. Bu A tagacha parallel fazoviy oqimlarni qo'llab-quvvatlaydi, bu esa bir siklda 2A ta skalyar ko'paytmani bajarish imkonini beradi. GEMV &lt;span class=\"yfm-latex\" data-content=\"%5Clceil%20M%2F(2A)%20%5Crceil\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; siklni talab qiladi.&lt;/p&gt;\n&lt;h4 id=\"kalibrlash-blokini-loyihalash\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#kalibrlash-blokini-loyihalash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kalibrlash blokini loyihalash&lt;/span&gt;&lt;/a&gt;Kalibrlash blokini loyihalash&lt;/h4&gt;\n&lt;p&gt;Kalibrlash bloki (3-rasm) quyidagilarni bajaradi: (i) x signalini raqamli pre-kodlash va IFFT, (ii) analog A yo'lga dublikatlash, (iii) W' signallari bilan aralashtirish va filtrlash, (iv) raqamli post-kodlash.&lt;/p&gt;\n&lt;h4 id=\"subkaryerlarni-kalibrlash-uchun-pre-kodlash\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#subkaryerlarni-kalibrlash-uchun-pre-kodlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Subkaryerlarni kalibrlash uchun pre-kodlash&lt;/span&gt;&lt;/a&gt;Subkaryerlarni kalibrlash uchun pre-kodlash&lt;/h4&gt;\n&lt;p&gt;Pre-koder &lt;span class=\"yfm-latex\" data-content=\"P_%7B%20ext%7Bpre%7D%7D%20%5Cin%20%5Cmathbb%7BC%7D%5E%7BN_%7B%20ext%7Bfft%7D%7D%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; kanalning notekis chastotaviy javobini kompensatsiya qiladi. x'[k] = x[k] · Ppre[k] (6) signali pre-koder bilan elementma-element ko'paytiriladi.&lt;/p&gt;\n&lt;h4 id=\"analog-pre-kodlangan-konvolyutsiya\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#analog-pre-kodlangan-konvolyutsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Analog pre-kodlangan konvolyutsiya&lt;/span&gt;&lt;/a&gt;Analog pre-kodlangan konvolyutsiya&lt;/h4&gt;\n&lt;p&gt;x' signali A ta RF mikseriga uzatiladi, ular parallel konvolyutsiyani bajaradi: &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7By%7D_a%20%3D%20w'_a%7B%7D%5E%20op%20%5Ccdot%20x'\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (7).&lt;/p&gt;\n&lt;h4 id=\"antennalarni-kalibrlash-uchun-post-kodlash\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#antennalarni-kalibrlash-uchun-post-kodlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Antennalarni kalibrlash uchun post-kodlash&lt;/span&gt;&lt;/a&gt;Antennalarni kalibrlash uchun post-kodlash&lt;/h4&gt;\n&lt;p&gt;Post-koder &lt;span class=\"yfm-latex\" data-content=\"P_%7B%20ext%7Bpost%7D%7D%20%5Cin%20%5Cmathbb%7BC%7D%5E%7BA%20%20imes%20A%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; antennaaro shovqinlarni yo'qotadi: &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7By%7D'_a%20%3D%20%5Csum_%7Ba'%3D0%7D%5E%7BA-1%7D%20P_%7B%20ext%7Bpost%7D%7D%5Ba%2C%20a'%5D%20%5Ccdot%20%5Chat%7By%7D_%7Ba'%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (8).&lt;/p&gt;\n&lt;h4 id=\"kalibrlash-bloklari-ortasidagi-hamkorlik\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#kalibrlash-bloklari-ortasidagi-hamkorlik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kalibrlash bloklari o'rtasidagi hamkorlik&lt;/span&gt;&lt;/a&gt;Kalibrlash bloklari o'rtasidagi hamkorlik&lt;/h4&gt;\n&lt;p&gt;Turli Ppre va Ppost ga ega C ta kalibrlash bloki ishlatiladi. Yakuniy chiqish &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7By%7D''_a%20%3D%20%5Csum_%7Bc%3D0%7D%5E%7BC-1%7D%20%5Chat%7By%7D'_%7Bc%2Ca%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (9) barcha bloklar natijalarini jamlaydi.&lt;/p&gt;\n&lt;h4 id=\"prekoder-va-postkoder-optimallashtirish\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#prekoder-va-postkoder-optimallashtirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Prekoder va postkoder optimallashtirish&lt;/span&gt;&lt;/a&gt;Prekoder va postkoder optimallashtirish&lt;/h4&gt;\n&lt;p&gt;AIR-LLM ning asosiy maqsadi — yakuniy chiqish signali &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7By%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; va haqiqiy signal y o'rtasidagi o'rtacha kvadratik xatolikni (MSE) minimallashtirishdir. Buning uchun Ppre prekoder va Ppost postkoder barcha kalibrlash birliklari bo'ylab birgalikda optimallashtiriladi. OPT-Orig masalasi quyidagicha shakllantiriladi:&lt;/p&gt;\n&lt;p&gt;&lt;span class=\"yfm-latex\" data-content=\"P%5E%7B%5Cstar%7D_%7Bpre%7D%2C%20P%5E%7B%5Cstar%7D_%7Bpost%7D%20%3D%20%5Carg%20%5Cmin_%7BP_%7Bpre%7D%2C%20P_%7Bpost%7D%7D%20%5Cmathbb%7BE%7D_%7Bx%2C%20W%7D%20%5Cleft%5B%20%5Cfrac%7B1%7D%7BA%7D%20%5Csum_%7Ba%3D0%7D%5E%7BA-1%7D%20%5C%2F%20%5Chat%7By%7D_a%20-%20y_a%20%5C%2F%5E2%20%5Cright%5D%20%5Cquad%20(10)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Optimallashtirish faqat kanal xususiyatlariga bog'liq bo'lgan xatolikni minimallashtirishga qaratilgan, bu esa qimmat onlayn o'qitishni talab qilmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;W va x qiymatlari noma'lum bo'lgani sababli, OPT-Orig ni to'g'ridan-to'g'ri yechish qiyin. Biroq, maqsad funksiyasi (W, x) ga nisbatan bilynear bo'lgani uchun, u faqat birinchi va ikkinchi tartibli statistikaga bog'liq. Yuqori SNR (signal-shovqin nisbati) sharoitida masala OPT-Chan shakliga keltiriladi:&lt;/p&gt;\n&lt;p&gt;&lt;span class=\"yfm-latex\" data-content=\"P%5E%7B%5Cstar%7D_%7Bpre%7D%2C%20P%5E%7B%5Cstar%7D_%7Bpost%7D%20%3D%20%5Carg%20%5Cmin_%7BP_%7Bpre%7D%2C%20P_%7Bpost%7D%7D%20%5Csum_%7Bk%3D0%7D%5E%7BN_%7Bfft%7D-1%7D%20%5Csum_%7Bc%3D0%7D%5E%7BC-1%7D%20%5C%2F%20P_%7Bpre%7D%5Bc%2C%20k%5D%20%5Ccdot%20P_%7Bpost%7D%5Bc%2C%20%3A%2C%20%3A%5D%20%5Ccdot%20H%5B%3A%2C%20%3A%2C%20k%5D%5ET%20-%20I_A%20%5C%2F%5E2%20%5Cquad%20(12)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;&lt;/p&gt;\n&lt;p&gt;Bu yerda I_A — A × A o'lchamli birlik matritsa. Maqsad — har bir sub-tashuvchi uchun kanal ta'sirini nolga tenglashtirish.&lt;/p&gt;\n&lt;h4 id=\"1-qadam-initsializatsiya-uchun-yaqinlashish\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#1-qadam-initsializatsiya-uchun-yaqinlashish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1-qadam: initsializatsiya uchun yaqinlashish&lt;/span&gt;&lt;/a&gt;1-qadam: initsializatsiya uchun yaqinlashish&lt;/h4&gt;\n&lt;p&gt;OPT-Chan ni yechish uchun ikki bosqichli yondashuv qo'llaniladi. Dastlab OPT-Approx yaqinlashuvi qo'llaniladi, unda kanal amplitudalarining vaznli ta'siri e'tibordan chetda qoldiriladi:&lt;/p&gt;\n&lt;p&gt;&lt;span class=\"yfm-latex\" data-content=\"P%5E%7B(0)%7D_%7Bpre%7D%2C%20%20ilde%7BP%7D%5E%7B(0)%7D_%7Bpost%7D%20%3D%20%5Carg%20%5Cmin_%7B%20ilde%7BP%7D_%7Bpost%7D%2C%20%20ilde%7BP%7D_%7Bpre%7D%7D%20%5C%2F%20%20ilde%7BP%7D_%7Bpost%7D%20%5Ccdot%20P_%7Bpre%7D%20-%20%20ilde%7BH%7D%5E%7B-1%7D%20%5C%2F%5E2%20%5Cquad%20(13)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SVD (singulyar qiymatlar dekompozitsiyasi) — matritsani uning eng muhim komponentlarini ajratib olish uchun qismlarga ajratish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bu yerda  ildePpost — C × A² o'lchamli \"tekislangan\" postkoder. Eckart-Young-Mirsky teoremasiga ko'ra, masala  ildeH⁻¹ matritsasining SVD yordamida yechiladi.&lt;/p&gt;\n&lt;h4 id=\"2-qadam-iterativ-aniqlashtirish-als\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#2-qadam-iterativ-aniqlashtirish-als\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2-qadam: iterativ aniqlashtirish (ALS)&lt;/span&gt;&lt;/a&gt;2-qadam: iterativ aniqlashtirish (ALS)&lt;/h4&gt;\n&lt;p&gt;P⁽⁰⁾ initsializatsiyasidan boshlab, ALS (alternating least squares) usuli qo'llaniladi: avval Ppost qotiriladi va Ppre optimallashtiriladi, keyin esa aksincha. Bu jarayon bir necha iteratsiyada yaqinlashadi.&lt;/p&gt;\n&lt;h4 id=\"tizim-samaradorligini-tahlil-qilish\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#tizim-samaradorligini-tahlil-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tizim samaradorligini tahlil qilish&lt;/span&gt;&lt;/a&gt;Tizim samaradorligini tahlil qilish&lt;/h4&gt;\n&lt;p&gt;AIR-LLM samaradorligi kanal vaqti va energiya sarfi bilan o'lchanadi. Kanal vaqti A antennalar soni va B o'tkazish qobiliyatiga teskari proportsionaldir. AIR-LLM foydalanuvchilar uchun signallarni moslashtirmaydi, bu esa uni eshittirish (broadcasting) uchun ideal qiladi.&lt;/p&gt;\n&lt;h4 id=\"energiya-tahlili\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#energiya-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Energiya tahlili&lt;/span&gt;&lt;/a&gt;Energiya tahlili&lt;/h4&gt;\n&lt;p&gt;Energiya samaradorligi apparat komponentlari xarajatlarini amortizatsiya qilish orqali erishiladi. RF mikser va past chastotali filtr (LPF) kirish o'lchamini bitta sub-tashuvchiga qisqartiradi, bu esa ADC yukini kamaytiradi. Prekodlash va IFFT har bir GEMV uchun bir marta bajariladi, ularning qiymati esa M chiqish hajmi bo'yicha taqsimlanadi.&lt;/p&gt;\n&lt;h4 id=\"hisoblash-aniqligi,-efir-vaqti-va-energiya-ortasidagi-kelishuv\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#hisoblash-aniqligi,-efir-vaqti-va-energiya-ortasidagi-kelishuv\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Hisoblash aniqligi, efir vaqti va energiya o'rtasidagi kelishuv&lt;/span&gt;&lt;/a&gt;Hisoblash aniqligi, efir vaqti va energiya o'rtasidagi kelishuv&lt;/h4&gt;\n&lt;p&gt;Kalibrlash birliklari soni C — bu uchta ko'rsatkichni bog'lovchi parametrdir. OPT-Chan kanallarni C darajali yaqinlashish bilan kalibrlaydi: C ning ortishi qoldiq xatoni kamaytirib, aniqlikni oshiradi, ammo ko'proq antennalar A talab qiladi. Energiya nuqtai nazaridan, har bir xarajat C ga chiziqli bog'liq. Shuning uchun, A ni oshirish efir vaqtini qisqartiradi, lekin energiya sarfini oshiradi. C qiymati maqsadli aniqlikka erishish uchun minimal bo'lishi kerak.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;C ni tanlash — bu aniqlik va energiya sarfi o'rtasidagi muvozanatni topishdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"amalga-oshirish\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#amalga-oshirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Amalga oshirish&lt;/span&gt;&lt;/a&gt;Amalga oshirish&lt;/h4&gt;\n&lt;p&gt;AIR-LLM real shahar muhitida nur izlash (ray-tracing) simulyatori va haqiqiy RF mikser buzilishlari asosida sinovdan o'tkazildi.&lt;/p&gt;\n&lt;h4 id=\"sionna-orqali-kanal-modellashtirish\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#sionna-orqali-kanal-modellashtirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sionna orqali kanal modellashtirish&lt;/span&gt;&lt;/a&gt;Sionna orqali kanal modellashtirish&lt;/h4&gt;\n&lt;p&gt;Markaziy radio va qurilmalar o'rtasidagi kanal NVIDIA Sionna (v2.0.1) muhitida modellashtiriladi. Simulyator 10⁷ nurni shahar modeliga yo'naltirib, aks etish va difraksiyani hisobga oladi. Bu H kanalini hosil qiladi. 4-rasmda (a) va (b) Parij (to'g'ridan-to'g'ri ko'rinish LOS mavjud) va Myunxen (ko'p yo'lli tarqalish, LOS yo'q) shaharlari misol qilib keltirilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Nur izlash (ray-tracing) — radio to'lqinlarning to'siqlarga urilib tarqalishini fizik modellashtirish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"markaziy-radio-konfiguratsiyasi\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#markaziy-radio-konfiguratsiyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Markaziy radio konfiguratsiyasi&lt;/span&gt;&lt;/a&gt;Markaziy radio konfiguratsiyasi&lt;/h4&gt;\n&lt;p&gt;Stansiya 10 m balandlikda joylashgan. U A=4 antennadan foydalanadi (1,7 m masofada). Signal 3,5 GGs chastotada, 100 MGts polosada uzatiladi. Har bir antenna uchun quvvat 50 dBm, qamrov radiusi 100 m.&lt;/p&gt;\n&lt;h4 id=\"qurilma-konfiguratsiyasi\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#qurilma-konfiguratsiyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qurilma konfiguratsiyasi&lt;/span&gt;&lt;/a&gt;Qurilma konfiguratsiyasi&lt;/h4&gt;\n&lt;p&gt;100 ta qurilma 1,5 m balandlikda tasodifiy joylashtirilgan. Har birida C=8 kalibrlash bloki mavjud. Shovqin koeffitsienti 4 dB (-90 dBm shovqin chegarasi). Kanal yo'qotishlari (PL) &lt;span class=\"yfm-latex\" data-content=\"-10%20%5Clog_%7B10%7D(E%5B%2FH%2F%5E2%5D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; sifatida baholanadi.&lt;/p&gt;\n&lt;h4 id=\"rf-mikserni-profillash\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#rf-mikserni-profillash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RF mikserni profillash&lt;/span&gt;&lt;/a&gt;RF mikserni profillash&lt;/h4&gt;\n&lt;p&gt;ZEM-4300+ mikserining buzilishlari USRP X310 radiostansiyalari yordamida simli stendda o'lchandi. Shovqin yo'qligi sababli, xatolar faqat mikserning o'ziga xos buzilishlariga bog'liq. Har bir RF quvvati uchun eng yaxshi samarali bitlar soni (ENOB) topildi.&lt;/p&gt;\n&lt;h4 id=\"gemv-benchmarki\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#gemv-benchmarki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GEMV benchmarki&lt;/span&gt;&lt;/a&gt;GEMV benchmarki&lt;/h4&gt;\n&lt;p&gt;Aniqlik ENOB bilan o'lchanadi. 5-rasm (a) 100 ta foydalanuvchi uchun ENOB ning PL ga bog'liqligini ko'rsatadi. Parijda (o'rtacha PL 84,0 dB) median ENOB 3,97 bitni (1,58–5,69 bit diapazoni), Myunxenda (91,4 dB) esa 2,91 bitni (0,53–5,33 bit) tashkil etdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ENOB faqat PL ga bog'liq emas: 89–91 dB PL oralig'ida aniqlik 2,01 dan 5,33 bitgacha o'zgaradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;5-rasm (b) uzatish quvvati (30-70 dBm) ta'sirini ko'rsatadi. Aniqlik har 10 dB uchun taxminan 1 bitga o'sadi va keyin to'yinadi. Myunxen misolida, quvvat 30 dBm dan 60 dBm gacha oshganda aniqlik 1,20 dan 3,55 bitgacha o'sdi, 70 dBm da esa 3,87 bitgacha yetdi.&lt;/p&gt;\n&lt;h4 id=\"hisoblash-aniqligi,-energiya-va-efir-vaqti-balansi\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#hisoblash-aniqligi,-energiya-va-efir-vaqti-balansi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Hisoblash aniqligi, energiya va efir vaqti balansi&lt;/span&gt;&lt;/a&gt;Hisoblash aniqligi, energiya va efir vaqti balansi&lt;/h4&gt;\n&lt;p&gt;WISE tizimidan farqli o‘laroq, A=C=1 bo‘lganda AIR-LLM GEMV operatsiyasining efir vaqtini qisqartirish uchun MIMO'dan foydalanadi, bu vaqt antenna soniga teskari proporsionaldir (1/A). Biroq, kanalni kompensatsiya qilish uchun ko‘proq kalibrlash birliklari C talab qilinadi, bu esa energiya sarfini C ga proporsional ravishda oshiradi. 6(a)-rasmda Parijdagi M=2A va N=4,096 bo‘lgan GEMV uchun ushbu kompromiss ko‘rsatilgan. A ni 2 dan 32 gacha oshirish vaqt bo‘yicha 32 barobar yutuq beradi. A=4 bo‘lganda aniqlik (ENOB) 0,55 bitdan (C=1) 3,97 bitgacha (C=8) va 5,07 bitgacha (C=10) o‘sadi; C ni yanada oshirish energiya sarfini 1,5 barobar oshirib, atigi 0,43 bit foyda beradi. 6(b)-rasmda ma’lum bir ENOB ga erishish uchun minimal energiya sarfi ko‘rsatilgan: 3 bit uchun xarajatlar 1,02× dan 9,60× gacha, 4 bit uchun esa A ni 2 dan 32 gacha oshirishda 1,54× dan 13,59× gacha o‘zgaradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Antenna soni A ning oshishi uzatish vaqtini qisqartiradi, ammo kanalni C parametri orqali kompensatsiya qilish uchun energiya sarfini eksponensial oshiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"gemv-hajmini-masshtablash\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#gemv-hajmini-masshtablash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GEMV hajmini masshtablash&lt;/span&gt;&lt;/a&gt;GEMV hajmini masshtablash&lt;/h4&gt;\n&lt;p&gt;7(a)-rasmda GEMV ni N=M=2⁰ dan 2¹⁴ gacha masshtablash ko‘rsatilgan. N=M=2³ gacha aniqlik barqaror (Parijda 5,58–5,75 bit), keyin esa ko‘p bosqichli hisob-kitoblarda u 3,99–4,51 bitgacha tushadi. 7(b)-rasmda FLOP uchun energiya sarfi FP16 bilan solishtiriladi. FP16 va WoQ (W4A16/W3A16) usullarida energiya samaradorligi o‘zgarmas bo‘lsa, AIR-LLM da u vazifa masshtabi bilan birga o‘sadi. Kichik GEMV larda raqamli ishlov berish, kattalarida esa DAC (raqamli-analog o‘zgartirgich) cheklovchi omil hisoblanadi. Analog tizimlarda ustunlik qiluvchi ADC (analog-raqamli o‘zgartirgich) energiya sarfi bu yerda N pastga diskretlash koeffitsienti tufayli deyarli nolga teng.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;FLOP — suzuvchi nuqtali operatsiya; WoQ (Weights-only Quantization) — faqat model vaznlarini kvantlash.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"llm-boyicha-benchmark\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#llm-boyicha-benchmark\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;LLM bo‘yicha benchmark&lt;/span&gt;&lt;/a&gt;LLM bo‘yicha benchmark&lt;/h4&gt;\n&lt;p&gt;Biz barcha vazn va aktivatsiya GEMV lari AIR-LLM orqali analog usulda bajariladigan to‘liq LLM larning ishlashini sinovdan o‘tkazdik.&lt;/p&gt;\n&lt;h4 id=\"wikitext-2-dagi-perpleksiya-ppl\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#wikitext-2-dagi-perpleksiya-ppl\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;WikiText-2 dagi perpleksiya (PPL)&lt;/span&gt;&lt;/a&gt;WikiText-2 dagi perpleksiya (PPL)&lt;/h4&gt;\n&lt;p&gt;2-jadvalda 9 ta model (LLaMA-3.2, LLaMA-3.1, LLaMA-2, Mistral-7B, Gemma-4) uchun 2048 ketma-ketlik uzunligidagi PPL ko‘rsatilgan. Parijda (~4 bit aniqlik) AIR-LLM 9 ta modeldan 7 tasida eng yaxshi WoQ usullaridan va 9 tasidan 4 tasida eng yaxshi analog usullardan ustun keladi. Myunxenda (~3 bit aniqlik) natijalar o‘xshash. Bu AIR-LLM dagi shovqin va buzilishlar LLM xulosasiga ta’sir qilmasligini tasdiqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Baholash ma’lum parametrli ENOB ga ega bo‘lgan maxsus aloqa kanallari (Parij/Myunxen) sharoitida o‘tkazildi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"token-uchun-energiya-sarfi\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#token-uchun-energiya-sarfi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Token uchun energiya sarfi&lt;/span&gt;&lt;/a&gt;Token uchun energiya sarfi&lt;/h4&gt;\n&lt;p&gt;8-rasmda token uchun energiya sarfi tasvirlangan. LLaMA-3.1-8B modelida AIR-LLM masofaviy FP16 ga qaraganda 157,7 barobar va masofaviy W4A16 ga qaraganda 40,4 barobar kam energiya sarflaydi. Mahalliy FP16 va W4A16 ga nisbatan yutuq mos ravishda 51,5× va 13,9× ni tashkil etadi. Tejamkorlik ma’lumotlarni ko‘chirish operatsiyalarini istisno qilish va ADC ning samarali ishlashi hisobiga erishiladi.&lt;/p&gt;\n&lt;h4 id=\"airtime-per-token\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#airtime-per-token\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Airtime per token&lt;/span&gt;&lt;/a&gt;Airtime per token&lt;/h4&gt;\n&lt;p&gt;9-rasmda to‘qqizta LLM uchun AIR-LLM va ikkita masofaviy bazaviy modelning simsiz kanaldan foydalanish vaqti ko‘rsatilgan. Vaqt LLaMA-3.1-8B dagi masofaviy FP16 ga nisbatan normallashtirilgan. LLaMA-3.1-8B da AIR-LLM FP16 ga qaraganda 5,11 marta va W4A16 ga qaraganda 1,28 marta kamroq vaqt sarflaydi. Bu koeffitsiyentlar barcha modellar uchun o‘zgarmasdir, chunki uzatish vaqti og‘irliklar soniga proporsional. Bir foydalanuvchili stsenariyda W4A16 ga yaqinlik kanalning fizik cheklovlari bilan izohlanadi: vaqt tarmoqli kengligi B va antennalar soni A bilan chiziqli masshtablanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AIR-LLM kanal vaqti bo‘yicha barqaror ustunlikka ega: FP16 dan 5,11 marta va W4A16 dan 1,28 marta tezroq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Jadval 2.&lt;/strong&gt; Tanlangan Parij va Myunxen foydalanuvchilarida AIR-LLM uchun WikiText-2 PPL, FP16, WoQ va analog hisoblash bazaviy liniyalari bilan solishtirganda&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Aniqlik&lt;/th&gt;\n&lt;th&gt;Usul&lt;/th&gt;\n&lt;th&gt;LLaMA-3 (3.2-1B)&lt;/th&gt;\n&lt;th&gt;LLaMA-3 (3.2-3B)&lt;/th&gt;\n&lt;th&gt;LLaMA-3 (3.1-8B)&lt;/th&gt;\n&lt;th&gt;LLaMA-3 (3.1-70B†)&lt;/th&gt;\n&lt;th&gt;LLaMA-2 (7B)&lt;/th&gt;\n&lt;th&gt;LLaMA-2 (13B)&lt;/th&gt;\n&lt;th&gt;Mistral (7B)&lt;/th&gt;\n&lt;th&gt;Gemma-4 (7B)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;E2B&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;FP16&lt;/td&gt;\n&lt;td&gt;9.77&lt;/td&gt;\n&lt;td&gt;7.82&lt;/td&gt;\n&lt;td&gt;6.24&lt;/td&gt;\n&lt;td&gt;2.81&lt;/td&gt;\n&lt;td&gt;5.47&lt;/td&gt;\n&lt;td&gt;4.88&lt;/td&gt;\n&lt;td&gt;5.25&lt;/td&gt;\n&lt;td&gt;8.24&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;E4B&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;RTN&lt;/td&gt;\n&lt;td&gt;11.71&lt;/td&gt;\n&lt;td&gt;8.49&lt;/td&gt;\n&lt;td&gt;6.83&lt;/td&gt;\n&lt;td&gt;3.35&lt;/td&gt;\n&lt;td&gt;5.72&lt;/td&gt;\n&lt;td&gt;4.98&lt;/td&gt;\n&lt;td&gt;5.42&lt;/td&gt;\n&lt;td&gt;10.60&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;GPTQ&lt;/td&gt;\n&lt;td&gt;10.63&lt;/td&gt;\n&lt;td&gt;8.78&lt;/td&gt;\n&lt;td&gt;6.65&lt;/td&gt;\n&lt;td&gt;3.37&lt;/td&gt;\n&lt;td&gt;5.62&lt;/td&gt;\n&lt;td&gt;4.99&lt;/td&gt;\n&lt;td&gt;5.38&lt;/td&gt;\n&lt;td&gt;8.95&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;AWQ&lt;/td&gt;\n&lt;td&gt;10.95&lt;/td&gt;\n&lt;td&gt;8.29&lt;/td&gt;\n&lt;td&gt;6.66&lt;/td&gt;\n&lt;td&gt;3.27&lt;/td&gt;\n&lt;td&gt;5.60&lt;/td&gt;\n&lt;td&gt;4.97&lt;/td&gt;\n&lt;td&gt;5.37&lt;/td&gt;\n&lt;td&gt;9.57&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;ENOB 4&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;AWGN&lt;/td&gt;\n&lt;td&gt;12.28&lt;/td&gt;\n&lt;td&gt;8.75&lt;/td&gt;\n&lt;td&gt;7.11&lt;/td&gt;\n&lt;td&gt;4.30&lt;/td&gt;\n&lt;td&gt;40.94&lt;/td&gt;\n&lt;td&gt;5.06&lt;/td&gt;\n&lt;td&gt;16.31&lt;/td&gt;\n&lt;td&gt;9.51&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;HyFlexPIM&lt;/td&gt;\n&lt;td&gt;10.45&lt;/td&gt;\n&lt;td&gt;8.11&lt;/td&gt;\n&lt;td&gt;6.48&lt;/td&gt;\n&lt;td&gt;3.04&lt;/td&gt;\n&lt;td&gt;5.56&lt;/td&gt;\n&lt;td&gt;4.93&lt;/td&gt;\n&lt;td&gt;5.32&lt;/td&gt;\n&lt;td&gt;8.82&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;AIR-LLM @ Paris&lt;/td&gt;\n&lt;td&gt;10.41&lt;/td&gt;\n&lt;td&gt;8.08&lt;/td&gt;\n&lt;td&gt;6.49&lt;/td&gt;\n&lt;td&gt;3.21&lt;/td&gt;\n&lt;td&gt;5.82&lt;/td&gt;\n&lt;td&gt;4.96&lt;/td&gt;\n&lt;td&gt;5.45&lt;/td&gt;\n&lt;td&gt;8.77&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;W3A16&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;RTN&lt;/td&gt;\n&lt;td&gt;34.82&lt;/td&gt;\n&lt;td&gt;13.25&lt;/td&gt;\n&lt;td&gt;10.86&lt;/td&gt;\n&lt;td&gt;5.24&lt;/td&gt;\n&lt;td&gt;6.66&lt;/td&gt;\n&lt;td&gt;5.52&lt;/td&gt;\n&lt;td&gt;6.15&lt;/td&gt;\n&lt;td&gt;264.35&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;GPTQ&lt;/td&gt;\n&lt;td&gt;16.46&lt;/td&gt;\n&lt;td&gt;15.21&lt;/td&gt;\n&lt;td&gt;8.24&lt;/td&gt;\n&lt;td&gt;5.33&lt;/td&gt;\n&lt;td&gt;6.42&lt;/td&gt;\n&lt;td&gt;5.44&lt;/td&gt;\n&lt;td&gt;5.89&lt;/td&gt;\n&lt;td&gt;11.79&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;AWQ&lt;/td&gt;\n&lt;td&gt;18.38&lt;/td&gt;\n&lt;td&gt;10.62&lt;/td&gt;\n&lt;td&gt;8.28&lt;/td&gt;\n&lt;td&gt;4.80&lt;/td&gt;\n&lt;td&gt;6.27&lt;/td&gt;\n&lt;td&gt;5.35&lt;/td&gt;\n&lt;td&gt;5.93&lt;/td&gt;\n&lt;td&gt;17.92&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;ENOB 3&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;AWGN&lt;/td&gt;\n&lt;td&gt;72.87&lt;/td&gt;\n&lt;td&gt;18.76&lt;/td&gt;\n&lt;td&gt;26.51&lt;/td&gt;\n&lt;td&gt;24.40&lt;/td&gt;\n&lt;td&gt;515.84&lt;/td&gt;\n&lt;td&gt;6.31&lt;/td&gt;\n&lt;td&gt;332.53&lt;/td&gt;\n&lt;td&gt;13.11&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;HyFlexPIM&lt;/td&gt;\n&lt;td&gt;13.45&lt;/td&gt;\n&lt;td&gt;9.35&lt;/td&gt;\n&lt;td&gt;7.25&lt;/td&gt;\n&lt;td&gt;3.90&lt;/td&gt;\n&lt;td&gt;5.92&lt;/td&gt;\n&lt;td&gt;5.14&lt;/td&gt;\n&lt;td&gt;5.59&lt;/td&gt;\n&lt;td&gt;11.55&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;AIR-LLM @ Munich&lt;/td&gt;\n&lt;td&gt;12.20&lt;/td&gt;\n&lt;td&gt;8.92&lt;/td&gt;\n&lt;td&gt;7.37&lt;/td&gt;\n&lt;td&gt;4.99&lt;/td&gt;\n&lt;td&gt;6.47&lt;/td&gt;\n&lt;td&gt;5.12&lt;/td&gt;\n&lt;td&gt;5.78&lt;/td&gt;\n&lt;td&gt;10.17&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;†: 3.1-70B&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"ppl-over-the-sequence-length\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#ppl-over-the-sequence-length\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PPL over the sequence length&lt;/span&gt;&lt;/a&gt;PPL over the sequence length&lt;/h4&gt;\n&lt;p&gt;3-jadvalda ketma-ketlik uzunligi 256 dan 16 384 tokengacha bo‘lganda PPL o‘zgarishi keltirilgan. Kontekst o‘sishi bilan PPL pasayadi. AIR-LLM va FP16 o‘rtasidagi farq qisqarib, 2048 tokendan yuqori qiymatlarda Parij uchun 4,0% va Myunxen uchun 17,3% atrofida barqarorlashadi. Bu AIR-LLM da hisoblash xatosi to‘planmasligini ko‘rsatadi. Har bir token uchun energiya va vaqt o‘zgarmas qoladi, chunki ular tokenlar soniga emas, balki qatlam og‘irliklarini uzatishga bog‘liq.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Baholash LLaMA-3.1-8B modellari asosida o‘tkazildi; natijalar boshqa arxitekturalar uchun farq qilishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"impact-of-the-system-factors\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#impact-of-the-system-factors\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Impact of the System Factors&lt;/span&gt;&lt;/a&gt;Impact of the System Factors&lt;/h4&gt;\n&lt;p&gt;Biz uzatish quvvati, antennalar (A) va kalibrlash bloklari (C) sonining ta’sirini tahlil qildik. 4-jadvalda ko‘rsatilishicha, Parijda 35 dBm quvvatda PPL FP16 dan 9,1% yuqori, 60 dBm da esa 3,8% ni tashkil etadi. Myunxenda aniqlik termal shovqin bilan cheklangan: PPL 60 dBm da 8,8% gacha yaxshilanadi.&lt;/p&gt;\n&lt;p&gt;5-jadvalda A va C ning ta’siri keltirilgan. A=4 bo‘lganda PPL 8 ta blokda, A=8 bo‘lganda esa 32 ta blokda barqarorlashadi. Amalda yaxshi aniqlikka erishish uchun A²/2 kalibrlash bloki kifoya qiladi, bu esa energiyani 50% ga tejaydi. 6-jadvalda 0,915 GGs (ISM) va 28 GGs (mmWave) diapazonlari uchun natijalar berilgan. 0,915 GGs da natijalar 3,5 GGs bilan solishtiriladigan darajada (PPL farqi 0,42 gacha), 28 GGs da esa ko‘p yo‘lli tarqalishning siyrakligi tufayli Myunxen foydalanuvchisi uchun natijalar yaroqsiz (PPL &amp;gt; 10²).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PPL (Perplexity) — til modelining sifat ko‘rsatkichi; qiymat qanchalik past bo‘lsa, model keyingi tokenni shunchalik aniq bashorat qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ppl-foydalanuvchilar-qirrasida\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#ppl-foydalanuvchilar-qirrasida\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PPL foydalanuvchilar qirrasida&lt;/span&gt;&lt;/a&gt;PPL foydalanuvchilar qirrasida&lt;/h4&gt;\n&lt;p&gt;10-rasmda Parij (PL 70.0–99.9 dB) va Myunxen (68.6–105.0 dB) hududlaridagi foydalanuvchilar joylashuvi ko‘rsatilgan. LLaMA-3.1-8B modeli uchun AIR-LLM yordamida o‘rtacha PPL Parijda 6.52 (W4A16 uchun 6.65), Myunxenda esa 7.23 (W3A16 uchun 8.24) ni tashkil etdi. 70-80% hollarda AIR-LLM bazaviy usullardan ustun keladi. Parijdagi bitta foydalanuvchida PPL 255.27 gacha ko‘tarildi, chunki ko‘p yo‘lli komponentlar kamligi sababli H kanal matritsasi deyarli yagonalashib qoldi. Bu muammo H ni yaxshilash uchun kamroq A antennalaridan foydalanish orqali hal qilinadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AIR-LLM murakkab aloqa kanallarida ham raqamli analoglarga qaraganda pastroq PPL ko‘rsatkichini ta’minlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"energiya-sarfi\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#energiya-sarfi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Energiya sarfi&lt;/span&gt;&lt;/a&gt;Energiya sarfi&lt;/h4&gt;\n&lt;p&gt;AIR-LLM ning har bir token uchun energiya sarfi (11(b)-rasm) barqaror va kanal sharoitlariga bog‘liq emas. Parijda AIR-LLM masofaviy FP16/W4A16 ga nisbatan 160.5×/41.1×, mahalliy yechimlarga nisbatan esa 51.5×/13.9× kamroq energiya sarflaydi. Myunxenda ham shunga o‘xshash natijalar kuzatilgan. Aloqa usullaridan farqli o‘laroq, AIR-LLM foydalanuvchi joylashuvidan qat’i nazar samarali ishlaydi.&lt;/p&gt;\n&lt;h4 id=\"efir-vaqti\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#efir-vaqti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Efir vaqti&lt;/span&gt;&lt;/a&gt;Efir vaqti&lt;/h4&gt;\n&lt;p&gt;12-rasmda ko‘rsatilishicha, U foydalanuvchiga xizmat ko‘rsatishda AIR-LLM uchun efir vaqti o‘zgarmas qoladi, chunki vaznlar eshittirish (broadcast) orqali uzatiladi. Oddiy usullar (unicast) xarajatlarni chiziqli oshirsa, AIR-LLM 20 foydalanuvchi uchun FP16/W4A16 ga qaraganda 104.1×/26.0× kamroq vaqt sarflaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Eshittirish (broadcast) usuli ma’lumotlarni barcha foydalanuvchilar uchun bir vaqtda uzatish imkonini beradi, bu esa tarmoq yuklamasini kamaytiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"llm-tezlatgichlari-boyicha-ishlar\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#llm-tezlatgichlari-boyicha-ishlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;LLM tezlatgichlari bo‘yicha ishlar&lt;/span&gt;&lt;/a&gt;LLM tezlatgichlari bo‘yicha ishlar&lt;/h4&gt;\n&lt;p&gt;An’anaviy yondashuvlar vaznlarni siqish yoki hisoblashni xotiraga yaqinlashtirishga asoslanadi. Ularning barchasi vaznlar qurilmada saqlanishini talab qiladi. AIR-LLM esa vaznlarni mahalliy saqlamaydi, balki signal qabul qilinayotganda RF/analog domenida to‘g‘ridan-to‘g‘ri hisoblaydi.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 3.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-tT3.jpg\" alt=\"Jadval 3\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"ml-uchun-analog-hisoblash\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#ml-uchun-analog-hisoblash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ML uchun analog hisoblash&lt;/span&gt;&lt;/a&gt;ML uchun analog hisoblash&lt;/h4&gt;\n&lt;p&gt;Analog tizimlar (ReRAM, fotonika) raqamli arifmetika cheklovlaridan qochib, fizik qonunlar (Om/Kirxgof) asosida ishlaydi. AIR-LLM bu g‘oyani rivojlantirib, qabul qiluvchining RF-aralashtirgichlaridan (mixer) foydalanadi. Tizim chastotaga bog‘liq shovqinlarni yo‘qotish uchun A \times A MIMO dvigatelini qo‘llaydi.&lt;/p&gt;\n&lt;h4 id=\"chekka-qurilmalarda-llm-joylashtirish\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#chekka-qurilmalarda-llm-joylashtirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Chekka qurilmalarda LLM joylashtirish&lt;/span&gt;&lt;/a&gt;Chekka qurilmalarda LLM joylashtirish&lt;/h4&gt;\n&lt;p&gt;Mobil qurilmalarda xotira va hisoblash quvvati cheklangan. Mavjud usullar qurilmani ortiqcha yuklaydi yoki serverga bog‘liq bo‘lib qoladi. AIR-LLM esa vaznlarni markaziy radiostansiyada saqlaydi va eshittirish orqali uzatadi, natijada har bir qurilma hisoblashni mahalliy bajarib, yetkazib berish xarajatlarini taqsimlaydi.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 4.&lt;/strong&gt; ThePPLofAIR-LLMinParisandMunichover different central radio broadcasting power.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-tT4.jpg\" alt=\"Jadval 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 5.&lt;/strong&gt; The PPL of AIR-LLM in Paris and Munich at 𝐴= {4, 8} with a varying number of calibration units, 𝐶.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-tT5.jpg\" alt=\"Jadval 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 6.&lt;/strong&gt; ThePPLofAIR-LLMatISM(0.915 GHz)and mmWave (28 GHz) bands with different (𝐴,𝐶) combinations. Figure 10. The broadcasting of LLaMA-3.1-8B to the 20 users with WikiText-2 PPL labeled in Paris (a) and Munich (b).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-tT6.jpg\" alt=\"Jadval 6\" /&gt;&lt;/p&gt;\n&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;p&gt;&lt;strong&gt;Jadval S8.&lt;/strong&gt; Over six commonsense-reasoning benchmarks, the zero-shot accuracy (%) of LLaMA-3.1-8B by AIR-LLM on the selected users of Paris and Munich vs. the FP16, WoQ, and analog computing baselines.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-tTS8.jpg\" alt=\"Jadval S8\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval S9.&lt;/strong&gt; The WikiText-2 PPL of LLaMA-3.1-8B when the weight signal is repeated 1 to 16 times and averaged, with ∞as the distortion floor.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-tTS9.jpg\" alt=\"Jadval S9\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval S10.&lt;/strong&gt; Tab. 4 repeated at the ISM (0.915 GHz) and mmWave (28 GHz) bands, each read against its own regulatory ceiling.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-tTS10.jpg\" alt=\"Jadval S10\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 7.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-tT7.jpg\" alt=\"Jadval 7\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval S11.&lt;/strong&gt; Tab. 5 repeated at the ISM and mmWave bands, each at the transmit power where it saturates in Tab. A10.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-tTS11.jpg\" alt=\"Jadval S11\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"air-llm-arxitekturasini-ishlab-chiqish-yakunlari\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#air-llm-arxitekturasini-ishlab-chiqish-yakunlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AIR-LLM arxitekturasini ishlab chiqish yakunlari&lt;/span&gt;&lt;/a&gt;AIR-LLM arxitekturasini ishlab chiqish yakunlari&lt;/h4&gt;\n&lt;p&gt;Ushbu ishda chekka qurilmalarda (edge devices) katta til modellarini (LLM) inferens qilish uchun mo‘ljallangan AIR-LLM arxitekturasi taqdim etilgan. Ishlanmaning asosiy maqsadi xotira cheklovlaridan xoli, foydalanuvchilar uchun masshtablanadigan va energiya tejamkor tizimni yaratishdir. Asosiy texnik yechim sifatida MIMO fazoviy multiplekslashdan foydalanildi, bu model vaznlarini bir vaqtning o‘zida bir nechta oqimda uzatish imkonini beradi va shu orqali efir vaqtini (airtime) keskin qisqartiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AIR-LLM arxitekturasi MIMO-multiplekslash va pre-coder–post-coder optimallashtirishi hisobiga energiya sarfi va uzatish vaqtini aniqlikning minimal yo‘qotilishi bilan bir necha barobar kamaytiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Simsiz kanalda samarali ishlashni ta’minlash uchun chekka qurilma tomonida aloqa kanalini avtomatik kalibrlaydigan «pre-coder–post-coder» juftligi ishlab chiqildi. Samaradorlikni baholash NVIDIA Sionna muhitida nurlarni kuzatish (ray-tracing) yordamida modellashtirilgan kanallar va real radiochastota (RF) mikserini profillash asosida amalga oshirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Nurlarni kuzatish (ray-tracing) — bu radio to‘lqinlarning tarqalishini modellashtirish usuli bo‘lib, u aks etish va to‘siqlarni hisobga olgan holda real aloqa sharoitlarini yuqori aniqlik bilan simulyatsiya qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Natijalar shuni ko‘rsatadiki, AIR-LLM FP16 bazaviy modeliga nisbatan PPL (perpleksiya) ko‘rsatkichida juda kichik farqni namoyon etadi. Shu bilan birga, har bir token uchun energiya sarfi va ma’lumotlarni uzatish vaqti bir necha barobar qisqaradi. Ushbu arxitektura yangi avlod intellektual chekka tizimlari uchun poydevor yaratadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ishlash samaradorligini baholash NVIDIA Sionna simulyatsiyalari va alohida RF komponentlarini profillashga asoslangan bo‘lib, bu murakkab apparat prototiplarida qo‘shimcha tekshiruvni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-f2.jpg\" alt=\"2-rasm. Har bir raundda GEMV ning 𝐴 ta ichki ko'paytmasini (IP) (yoki haqiqiy qiymatli bo'lsa 2𝐴 ta) bajaradigan AIR-LLM\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm. Har bir raundda GEMV ning 𝐴 ta ichki ko'paytmasini (IP) (yoki haqiqiy qiymatli bo'lsa 2𝐴 ta) bajaradigan AIR-LLM ning RF hisoblash dvigateli umumiy ko'rinishi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-rasm. Har bir raundda GEMV ning 𝐴 ta ichki ko'paytmasini (IP) (yoki haqiqiy qiymatli bo'lsa 2𝐴 ta) bajaradigan AIR-LLM ning RF hisoblash dvigateli umumiy ko'rinishi. Markaziy radiostansiya ushbu IP vaznlarini foydalanuvchiga xos dastlabki kodlashsiz (precoding) o'zining 𝐴 ta antennalari orqali uzatadi. So'ngra har bir chetki qurilma qabul qilingan 𝐴 ta vazn to'lqin shakllarini o'zining GEMV kirishi bilan birga 𝐶 ta kalibrlash bloklariga uzatadi; ularning prekoderlari va postkoderlari ushbu foydalanuvchining o'z kanalidan SVD ga asoslangan boshlang'ich sozlash va ALS ga asoslangan aniq sozlash orqali olinadi. 𝐶 ta blokning chiqishlarini qo'shish ushbu raundning GEMV chiqishini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-f3.jpg\" alt=\"3-rasm. Kalibrlash blokining batafsil me'morchiligi va uning qabul qilingan vazn vektori w′ 𝑎 hamda prekoderlangan kiris\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm. Kalibrlash blokining batafsil me'morchiligi va uning qabul qilingan vazn vektori w′ 𝑎 hamda prekoderlangan kirish vektori x′ o'rtasidagi ichki ko'paytmani qayta ishlashi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-f4.jpg\" alt=\"Rasm 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 4&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-f6.jpg\" alt=\"Rasm 6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 6&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-f8.jpg\" alt=\"8-rasm. To'qqizta LLM bo'yicha AIR-LLM ning har bir token uchun normallashtirilgan energiyasi 4 ta bazaviy yechimga nisb\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;8-rasm. To'qqizta LLM bo'yicha AIR-LLM ning har bir token uchun normallashtirilgan energiyasi 4 ta bazaviy yechimga nisbatan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-f10.jpg\" alt=\"Rasm 10\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 10&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-f12.jpg\" alt=\"Rasm 12\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 12&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-fS1.jpg\" alt=\"A1-rasm. 𝐴 = 4 va 𝐶 = 8 bo'lganda OPT-Chan ning ikki bosqichi tanlangan foydalanuvchilarga nima berishi: yechimning to'r\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;A1-rasm. 𝐴 = 4 va 𝐶 = 8 bo'lganda OPT-Chan ning ikki bosqichi tanlangan foydalanuvchilarga nima berishi: yechimning to'rtta bosqichida y ga nisbatan ˆy (a, b), hamda ALS ning har bir iteratsiyasidagi (17) yo'qotish va uning ENOB ko'rsatkichi (c, d).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-fS4.jpg\" alt=\"Rasm S4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S4&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-fS6.jpg\" alt=\"A6-rasm. Parij (a) va Myunxendagi (b) 10-rasmdagi 20 ta foydalanuvchi, ularning har biri PL, GEMV ENOB va WikiText-2 PPL\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;A6-rasm. Parij (a) va Myunxendagi (b) 10-rasmdagi 20 ta foydalanuvchi, ularning har biri PL, GEMV ENOB va WikiText-2 PPL ko'rsatkichlari bilan belgilangan.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Edge-&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=
