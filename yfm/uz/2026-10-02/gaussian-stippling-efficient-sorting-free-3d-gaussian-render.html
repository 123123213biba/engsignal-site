        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"151\" cy=\"93\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"569\" cy=\"223\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · CAD_PARAMETRIC   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Gaussian Stippling: 3D&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;renderlashni sifatni&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;yo'qotmasdan tezlashtirish&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render-f1.jpg\" alt=\"Rasm 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;An'anaviy &lt;a href=\"concepts/3d-gaussian-splatting.html\"&gt;3D Gaussian Splatting&lt;/a&gt; qatlamlarni chuqur saralashni talab qiladi, bu esa resursi cheklangan qurilmalarda ishni sekinlashtiradi. Gaussian Stippling usuli alfa-aralashtirishni stoxastik tanlash bilan almashtirib, saralash zaruratini yo'qotadi. Gibrid tizim va neyron tarmoq rekonstruksiyasi yuqori kadrlar tezligini vizual aniqlik bilan birlashtiradi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Alfa-aralashtirishni stoxastik tanlash bilan almashtirish saralashni bekor qiladi.&lt;/li&gt;\n&lt;li&gt;Gibrid renderlovchi primitivlarni shaffofligiga qarab optimallashtiradi.&lt;/li&gt;\n&lt;li&gt;Neyron tarmoq rekonstruksiyasi shovqinni o'tgan kadrlar yordamida bostiradi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Standart 3DGS tartiblangan alfa-kompozitingdan foydalanadi, bunda har bir primitivning hissasi T_i(x) = Π_{j&amp;lt;i} (1-α_j(x)) formulasi orqali hisoblanadi. Bu chuqurlik bo'yicha saralashni (depth sorting) talab qiladi va ko'p sonli primitivlar bilan ishlashda asosiy to'siqqa aylanadi. Gaussian Stippling diskret modelga o'tadi, bu yerda har bir primitiv o'zining alfa qiymatiga teng ehtimollik bilan qabul qilinadi.&lt;/p&gt;\n&lt;p&gt;Gibrid renderlovchi primitivlarni ularning proyeksion maydoni va shaffofligiga qarab fragment va primitiv oqimlariga taqsimlaydi. Kam namunalar (1-spp) bilan yuzaga keladigan shovqinni bostirish uchun yengil neyron tarmoq joriy va o'tgan kadrlardagi ma'lumotlarni birlashtiradi. 1-spp konfiguratsiyasida usul 1080p ruxsatda bazaviy 3DGS'ga nisbatan 2,3–2,7 barobar yuqori unumdorlikka erishadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Usul shovqin va unumdorlik o'rtasidagi muvozanat uchun namunalar sonini (spp) sozlashni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;An'anaviy 3D Gaussian Splatting (3DGS) usuli bir-birining ustiga tushadigan primitivlarni to'g'ri render qilish uchun chuqurlik bo'yicha saralash va tartiblangan alfa-aralashtirishni talab qiladi. Ushbu ishda saralashni talab qilmaydigan yondashuv taklif etiladi: stokastik shaffoflik yordamida kasrli alfa qiymatlari diskret ko'rinishdagi ko'rinish namunalari bilan almashtiriladi. Mualliflar tomonidan «Gaussian Stippling» deb nomlangan ushbu jarayon renderlashni ob'ektlar tartibiga bog'liq bo'lmagan holda amalga oshirish imkonini beradi. Tizim primitiv va fragmentga asoslangan stippling usullarini moslashuvchan tarzda birlashtirib, renderlash tezligini optimallashtiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Stokastik shaffoflik — bu ko'p qatlamli shaffoflikni o'rtacha hisoblash o'rniga tasodifiy nuqtalarni tanlash usuli bo'lib, u ob'ektlarni masofaga qarab saralash zaruratini yo'qotadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Kam namunalar (spp) sonida yuzaga keladigan fazoviy va vaqtinchalik shovqinni bostirish uchun yengil vaznli fazoviy-vaqtinchalik rekonstruksiya neyrotarmog'i ishlab chiqildi. U Gauss atributlaridan foydalanib, joriy ma'lumotlarni qayta proyeksiyalangan tarixiy kuzatuvlar bilan birlashtiradi. Model turli sahnalar to'plamida o'qitilgan va 3DGS aktivlarini o'zgartirmasdan yoki qayta o'qitmasdan yangi ma'lumotlar bilan ishlashga qodir.&lt;/p&gt;\n&lt;p&gt;Muayyan sahna uchun o'qitilganda, 1-spp (har bir piksel uchun 1 namuna) bo'lgan ixcham konfiguratsiya 1080p ruxsatda standart 3DGS ga nisbatan 2,3–2,7 baravar yuqori o'tkazish qobiliyatini ta'minlaydi. 16-spp konfiguratsiyasi esa barcha uchta sinov to'plamida yuqoriroq o'rtacha PSNR qiymatini ko'rsatadi, garchi u ko'proq hisoblash resurslarini talab qilsa ham. Usul mobil qurilmalarda interaktiv rejimda muvaffaqiyatli sinovdan o'tkazildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Taklif etilgan usul 1-spp holatida renderlash tezligini 2,3–2,7 baravarga oshiradi va 16-spp holatida tasvir sifatini yaxshilaydi, bu esa mobil qurilmalarda ishlash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;3D Gaussian Splatting (3DGS) texnologiyasi aniq Gauss primitivlarini samarali rasterizatsiya qilish orqali real vaqt rejimida yangi ko‘rinishlarni sintez qilish imkonini beradi. Biroq, ushbu usul chuqurlik bo‘yicha saralash va tartibli kompozitingga tayanadi, bu esa primitivlar soni ko‘p bo‘lganda yoki resurslari cheklangan qurilmalarda unumdorlikni pasaytiradi. Mavjud muqobil yechimlar renderlash paradigmasini yoki primitivlar tuzilishini o‘zgartiradi, bu esa ularni tayyor 3DGS aktivlari bilan ishlatishni qiyinlashtiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Taklif etilgan «Gauss shtrixlash» (Gaussian stippling) usuli 3DGS aktivlarini saralashsiz, stokastik ko‘rinish namunalarini olish orqali renderlash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Standart 3DGS’dan farqli o‘laroq, bu yerda uzluksiz Gauss dog‘lari o‘rniga diskret, noaniq namunalar (stipples) hosil qilinadi va ular standart chuqurlik testi orqali raqobatlashadi. Mualliflar fragmentga asoslangan va primitivga asoslangan shtrixlash usullarini birlashtiruvchi gibrid rendererni ishlab chiqdilar. U har bir Gauss elementini uning shaffofligi va proyeksiyalangan o‘lchamiga qarab eng samarali usulga yo‘naltiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Stokastik tanlash (Monte-Karlo) — bu murakkab vizualizatsiya jarayonini tasodifiy namunalar yordamida baholash usuli bo‘lib, u obyektlarni tartiblash zaruratini yo‘q qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kam namunali (low-spp) renderlash natijasida yuzaga keladigan fazoviy shovqin va miltillashlarni bartaraf etish uchun qo‘shimcha qayta ishlash talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Shovqinni kamaytirish uchun mualliflar fazoviy-vaqtinchalik rekonstruksiya qiluvchi yengil neyron tarmoqdan foydalanadilar. U joriy kadr ma’lumotlarini oldingi kadrlardan olingan Gauss atributlari (shaffoflik, kovariatsiya, chuqurlik) bilan birlashtiradi. Rasm 1’da ko‘rsatilganidek, ushbu yondashuv modelni har bir sahna uchun qayta o‘qitmasdan shovqinni samarali bostiradi. Tizim mobil qurilmalarda ham yuqori tezlikda ishlaydi va ham umumiy, ham ixtisoslashgan (sahna uchun moslashtirilgan) rejimda yuqori sifatni ta’minlaydi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render-f1.jpg\" alt=\"Rasm 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 1&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"stoxastik-namunalar-asosida-neyron-rekonstruksiya\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#stoxastik-namunalar-asosida-neyron-rekonstruksiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Stoxastik namunalar asosida neyron rekonstruksiya&lt;/span&gt;&lt;/a&gt;Stoxastik namunalar asosida neyron rekonstruksiya&lt;/h4&gt;\n&lt;p&gt;Tasvirlarga asoslangan renderlashda tarqoq, tuzilmagan geometrik proksilardan yuqori sifatli tasvirlarni sintez qilish asosiy muammodir. Neyron nuqtali grafikalar (NPBG) va kechiktirilgan neyron renderlash tizimlari chuqur konvolyutsion tarmoqlar (masalan, U-Net) siyrak nuqtali xususiyatlardan fotorealistik tasvirlarni samarali tiklay olishini ko'rsatdi. Bizning yondashuvimiz bir xil rakursning takroriy renderlari o'rtasidagi stoxastik ko'rinish o'zgarishlarini hisobga oladi va uni bir-birining ustiga chiqadigan yarim shaffof Gauss primitivlariga moslashtiradi.&lt;/p&gt;\n&lt;p&gt;Stoxastik namunalardan rekonstruksiya qilish yo'llarni kuzatish (path tracing) usullariga tayanadi, bu yerda shovqinli kuzatuvlarni filtrlash uchun neyron tarmoqlar qo'llaniladi. Bizning usul har bir kuzatuvda Gauss-lokal deskriptorlarini saqlaydi; har bir kadr uchun bir nechta kuzatuvlardan foydalanganda, biz rekonstruksiyadan oldin ushbu deskriptorlarni kanallar bo'yicha o'rtachalashtiramiz. Chuqurlik va albedo kabi yordamchi xususiyatlar rekonstruksiya uchun yo'l-yo'riq beradi, ammo bitta sirt tavsifi barcha Gauss «splat»larining hissasini qamrab ololmasligi mumkin. Shu sababli, biz primitivlarning proyeksiyalangan izi, shaffofligi va chuqurligini kodlovchi lokal deskriptorlarni ajratib olamiz.&lt;/p&gt;\n&lt;p&gt;Fazoviy-vaqtinchalik tekislash 1-spp (har bir piksel uchun bitta namuna) renderlashda sifatni oshirish uchun muhimdir. An'anaviy real vaqt rejimidagi quvurlar barqaror sirt harakati vektorlaridan foydalangan holda teskari reproyeksiyaga tayanadi. Stoxastik 3DGS renderlashda pikseldagi ko'rinadigan Gauss elementi o'zgarishi mumkin, bu esa vaqtinchalik tekislashni qiyinlashtiradi. Biz tarixiy kuzatuv xaritalarining to'g'ridan-to'g'ri reproyeksiyasidan foydalanamiz.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Usul Gauss lokal deskriptorlari va tarixiy ma'lumotlarning to'g'ridan-to'g'ri reproyeksiyasini birlashtirib, shovqinli stoxastik namunalardan sifatli tasvirlarni tiklaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"metod\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#metod\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Metod&lt;/span&gt;&lt;/a&gt;Metod&lt;/h4&gt;\n&lt;p&gt;O'qitilgan 3D Gauss tasviri G va maqsadli kamera C_t berilgan bo'lsa, maqsad sahnani o'zgartirmasdan tasvirni rekonstruksiya qilishdir. Jarayon ikki bosqichdan iborat (2-rasm). Birinchidan, gibrid renderlovchi har bir primitivni primitivga asoslangan yoki fragmentga asoslangan namuna olish oqimiga yo'naltiradi. Ikkinchidan, har bir qabul qilingan namuna lokal deskriptor bilan to'ldiriladi va tarixiy kadrlar maqsadli ko'rinishga to'g'ridan-to'g'ri reproyeksiya qilinadi; yengil konvolyutsion tarmoq D_θ yakuniy tasvirni tiklaydi.&lt;/p&gt;\n&lt;p&gt;Har bir kadr uchun biz M ta mustaqil stoxastik kuzatuvni hosil qilamiz va O_t^M ni olish uchun ularning deskriptorlarini o'rtachalashtiramiz (Mspp namuna byudjeti). Yakuniy kirish X_t joriy kadr va K=3 oldingi kadrlarning agregatsiyalangan xaritalarini birlashtirish orqali hosil bo'ladi. Rekonstruksiya jarayoni &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BI%7D_t%20%3D%20D_%20heta(X_t)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; formulasi bilan ifodalanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;To'g'ridan-to'g'ri reproyeksiya — bu ma'lumotlarni oldingi kadrlardan joriy kadrga o'tkazish usuli bo'lib, u joriy «shovqinli» kadrdagi ma'lumotlar yetishmovchiligini to'ldirishga yordam beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"gibrid-stoxastik-kuzatuvlarni-generatsiya-qilish\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#gibrid-stoxastik-kuzatuvlarni-generatsiya-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Gibrid stoxastik kuzatuvlarni generatsiya qilish&lt;/span&gt;&lt;/a&gt;Gibrid stoxastik kuzatuvlarni generatsiya qilish&lt;/h4&gt;\n&lt;p&gt;Metod 3D Gaussian Splattingdagi alfa-aralashtirishning ehtimollik talqiniga asoslanadi. Har bir piksel x va &lt;span class=\"yfm-latex\" data-content=\"(%5Cmu_i%2C%20%5CSigma_i%2C%20o_i%2C%20c_i%2C%20z_i)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; parametrli gaussiyani uchun &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Calpha%7D_i(x)%20%5Csim%20%20ext%7BBernoulli%7D(%5Calpha_i(x))\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; binar qabul qilish indikatori kiritiladi. Agar &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Calpha%7D_i(x)%3D1\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; bo'lsa, gaussiyan saqlanadi, aks holda tashlab yuboriladi. Qabul qilingan nomzodlar orasidan chuqurligi z_i eng kichik bo'lgani tanlanadi. Matematik jihatdan isbotlanishicha, bu yondashuv standart alfa-kompozitingning siljimagan (unbiased) bahosi hisoblanadi, chunki piksel rangi &lt;span class=\"yfm-latex\" data-content=\"E%5B%5Chat%7BI%7D_%7BST%7D(x)%5D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ning matematik kutilmasi klassik renderlash IGS(x) natijasi bilan bir xil.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Bernulli taqsimotiga asoslangan stoxastik tanlash klassik alfa-aralashtirishga teng bo'lgan siljimagan bahoni beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ish unumdorligini oshirish uchun primitivlarni «marshrutlash» (routing) qo'llaniladi. Proyeksiya maydoni &lt;span class=\"yfm-latex\" data-content=\"A%20%3D%20%5Cpi%20%5Csqrt%7B%2F%5CSigma%2F%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; katta bo'lgan gaussiyanlar rasterizatsiya (fragment oqimi) orqali, kichiklari esa nuqtalar generatsiyasi (primitiv oqimi) orqali qayta ishlanadi. Tanlov mezoni &lt;span class=\"yfm-latex\" data-content=\"S(o%2C%20A)%20%3D%20%5Cbeta_0%20%2B%20%5Cbeta_1%20%5Clog_2%20A%20%2B%20%5Cbeta_2%20o%20%2B%20%5Cbeta_3%20o%20%5Clog_2%20A\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; regressiya funksiyasi bilan aniqlanadi. Agar S(o, A) &amp;gt; 0 bo'lsa, primitiv fragment oqimiga, aks holda primitiv oqimiga yo'naltiriladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Marshrutlash — bu yuklamani dinamik taqsimlash: yirik obyektlar apparatli (fragmentlar), maydalari esa tasodifiy nuqtalar generatsiyasi orqali renderlanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Primitiv oqimida intensivligi λ = 2A Li₂(o) bo'lgan Puasson jarayoni ishlatiladi. Nuqtalar koordinatalari x Xoleskiy dekompozitsiyasi yordamida &lt;span class=\"yfm-latex\" data-content=\"%5CSigma\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; kovariatsion matritsani hisobga oluvchi teskari Boks-Myuller transformatsiyasi orqali hosil qilinadi.&lt;/p&gt;\n&lt;h4 id=\"fragmentli-tanlash-oqimi\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#fragmentli-tanlash-oqimi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Fragmentli tanlash oqimi&lt;/span&gt;&lt;/a&gt;Fragmentli tanlash oqimi&lt;/h4&gt;\n&lt;p&gt;Fragment oqimida gaussiyanlar &lt;span class=\"yfm-latex\" data-content=\"%5COmega\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; sohasida τ_F kesish chegarasi bilan rasterlanadi. Samarali qabul qilish ehtimoli &lt;span class=\"yfm-latex\" data-content=\"%5Calpha_%7Beff%7D%5EF(x)%20%3D%20%5Calpha(x)%20%5Ccdot%201_%7Bx%20%5Cin%20%5COmega%7D%20%5Ccdot%201_%7B%5Calpha(x)%20%3E%20%20au_F%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ni tashkil qiladi. Ikkala oqim natijalarini birlashtirish uchun gibrid renderlovchi &lt;span class=\"yfm-latex\" data-content=\"A_P(x)%20%5Ccup%20A_F(x)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; nomzodlar to'plamidan chuqurligi z_p eng kichik bo'lganini tanlaydi.&lt;/p&gt;\n&lt;h4 id=\"fazoviy-vaqtinchalik-gauss-kuzatuvlari\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#fazoviy-vaqtinchalik-gauss-kuzatuvlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Fazoviy-vaqtinchalik Gauss kuzatuvlari&lt;/span&gt;&lt;/a&gt;Fazoviy-vaqtinchalik Gauss kuzatuvlari&lt;/h4&gt;\n&lt;p&gt;Har bir kuzatuv uchun 10 kanalli deskriptor s_t(x) = [c(x), α(x), δ²(x), o, q, z⁻¹] shakllantiriladi, bu yerda δ²(x) — Maxalanobis masofasining kvadrati, q — kovariatsiya koeffitsiyentlari. M ta mustaqil tanlamani o'rtachalash OM_t(x) kuzatuv xaritasini beradi. Neyron tarmoq uchun yakuniy kirish signali X_t(x) joriy va K=3 ta oldingi kadrlarning t vaqt momentiga forward warping usuli bilan proyeksiyalangan OM xaritalarini konkatenatsiya qilish orqali hosil qilinadi.&lt;/p&gt;\n&lt;h4 id=\"neyron-rekonstruksiya\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#neyron-rekonstruksiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Neyron rekonstruksiya&lt;/span&gt;&lt;/a&gt;Neyron rekonstruksiya&lt;/h4&gt;\n&lt;p&gt;Rekonstruksiya jarayoni U-Net arxitekturasi va piksel darajasidagi MLP bloki yordamida amalga oshiriladi. Yakuniy tasvir &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BI%7D_t\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; mahalliy Flocal^t va kontekstual Fcontext^t belgilarni birlashtirish orqali hosil qilinadi. O‘qitish Charbonnier jarimasi Lchar va gradient mosligi Lgrad yig‘indisidan iborat L funksiyasi yordamida olib boriladi:&lt;br /&gt;\nL = Lchar + λgradLgrad, (2)&lt;br /&gt;\n&lt;span class=\"yfm-latex\" data-content=\"L_%7Bchar%7D%20%3D%20%5Cfrac%7B1%7D%7BN%7D%20%5Csum_p%20%5Csqrt%7B%5C%2F%5Chat%7BI%7D_t(p)%20-%20I_%7BGT%7D%5Et(p)%5C%2F%5E2%20%2B%20%5Cepsilon%5E2%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, (3)&lt;br /&gt;\n&lt;span class=\"yfm-latex\" data-content=\"L_%7Bgrad%7D%20%3D%20%5Cfrac%7B1%7D%7BN%7D%20%5Csum_p%20%5Csum_%7Bd%20%5Cin%20%5C%7Bx%2Cy%5C%7D%7D%20%5C%2F%0Aabla_d%20%5Chat%7BI%7D_t(p)%20-%20%0Aabla_d%20I_%7BGT%7D%5Et(p)%5C%2F_1\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, (4)&lt;br /&gt;\nbunda N — piksellar soni, ε — kichik o‘zgarmas qiymat. Gradient komponenti tasvir chegaralarini saqlashda muhim rol o‘ynaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Charbonnier va gradient yo‘qotish funksiyalarining kombinatsiyasi tasvir tafsilotlari va chegaralarini yuqori aniqlikda tiklash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"eksperimental-sozlamalar\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#eksperimental-sozlamalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Eksperimental sozlamalar&lt;/span&gt;&lt;/a&gt;Eksperimental sozlamalar&lt;/h4&gt;\n&lt;p&gt;Baholash Mip-NeRF 360, Tanks and Temples va Deep Blending to‘plamlaridagi 11 ta sahnada o‘tkazildi. Har bir sahna uchun alohida tarmoq o‘qitildi, Gaussian tasviri esa o‘zgarmas qoldirildi. Kadrlar orasiga kamida K ≥ 3 ta oraliq ko‘rinish kiritildi, kamera siljishi 0,05 birlik va burilish 3^° bilan cheklandi. Stochastic Splats (SS), Gaussian Point Splatting (GPS), MobileGS va MiniSplatting usullari bilan solishtirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Gaussian tasviri — 3D sahnani 3D-gausslar to‘plami sifatida ifodalash usuli bo‘lib, ular renderlash jarayonida tasvir tekisligiga proyeksiyalanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Implementatsiya PyTorch (o‘qitish) va &lt;a href=\"concepts/vulkan.html\"&gt;Vulkan&lt;/a&gt;/GLSL (inferens) yordamida amalga oshirildi. Optimizatsiya AdamW orqali 2000 davr (epoch) davomida, 100 davrlik warmup va 1 × 10⁻⁴ dan 5 × 10⁻⁶ gacha kosinusli pasayish bilan bajarildi.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 1.&lt;/strong&gt; Quality against ground truth at the training resolution; throughput at 1080p. The first three rows report renderer-only FPS; Ours-S/L rows include rendering and reconstruction. Best/second-best PSNR and FPS within each block are bold/underlined; tiessharerank.∗MobileGSoptimizationproducedNaNsonTanks&amp;amp;Temples.†MobileGSFPSincludesitsview-dependent MLP (TensorRT) and rasterization; its released timing code omits the MLP.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render-tT1.jpg\" alt=\"Jadval 1\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"yakuniy-rekonstruksiya\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#yakuniy-rekonstruksiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yakuniy rekonstruksiya&lt;/span&gt;&lt;/a&gt;Yakuniy rekonstruksiya&lt;/h4&gt;\n&lt;p&gt;Ours-S versiyasi 1 spp da 283,17–305,32 FPS tezlikka erishadi, bu 3DGS dan 2,3–2,7 barobar tezroq. Ours-L (16 spp) modeli PSNR bo‘yicha 3DGS dan ustun keladi. Rekonstruksiya vaqti Ours-S uchun 1,78 ms, Ours-L uchun 11,31 ms ni tashkil etadi. Ablatsion tadqiqotlar (2-jadval) vaqtinchalik tarix va deskriptorlarning muhimligini tasdiqlaydi. DL3DV ma’lumotlaridagi kross-sahna baholashda (3-jadval) Ours-S modeli SS va GPS bazaviy usullaridan yuqori PSNR ko‘rsatkichini qayd etdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Natijalar sahnaga bog‘liq; kross-sahna validatsiyasida model yaxshi umumlashtirish qobiliyatini ko‘rsatadi, ammo maqsadli ma’lumotlarda o‘qitilgan 3DGS aniqligiga yetmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"qollanilishi-mobil-platformalarda-joriy-etish-va-grafik-hamda-hisoblash-jarayonlarini-bir-vaqtda-bajarish\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#qollanilishi-mobil-platformalarda-joriy-etish-va-grafik-hamda-hisoblash-jarayonlarini-bir-vaqtda-bajarish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qo'llanilishi: mobil platformalarda joriy etish va grafik hamda hisoblash jarayonlarini bir vaqtda bajarish&lt;/span&gt;&lt;/a&gt;Qo'llanilishi: mobil platformalarda joriy etish va grafik hamda hisoblash jarayonlarini bir vaqtda bajarish&lt;/h4&gt;\n&lt;p&gt;Mualliflar ushbu usulning cheklangan resurslarga ega qurilmalarda ishlashini baholash uchun uni mobil platformaga moslashtirdilar. 540p ruxsatda ishlab chiqilgan renderlash tizimi o'rtacha 92,6 FPS tezlikni ko'rsatadi. Taqqoslash uchun: Stochastic Splats (SS) 53,3 FPS va Gaussian Point Splatting (GPS) 49,0 FPS natijalarini qayd etadi. Rekonstruksiya uchun ixcham neyron tarmoq arxitekturasidan foydalanilganda va hisoblashlar NPU (neyron protsessor) orqali amalga oshirilganda, tezlik 73,2 FPS ni tashkil qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Taklif etilgan usul 540p ruxsatda 92,6 FPS tezlikka erishib, analoglardan (SS — 53,3 FPS, GPS — 49,0 FPS) sezilarli darajada ustunlik qiladi va mobil qurilmalarda NPU yordamida 73,2 FPS tezlikni ta'minlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;3DGS-GL uchun asosiy bazaviy model sifatida Splatapult algoritmi olindi. Interaktiv realizatsiya yakuniy tasvirlar sifatini oshirish uchun qayta proyeksiyalangan vaqtinchalik jamlash (reprojected temporal accumulation) usulini qo'llaydi. Ishlash samaradorligi bo'yicha qiyosiy ma'lumotlar 1-jadvalda keltirilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Qayta proyeksiyalangan vaqtinchalik jamlash — bu kamera harakatini hisobga olgan holda joriy va oldingi kadrlardagi ma'lumotlarni birlashtirish orqali tasvir sifatini yaxshilash usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;1-jadval. Turli sahnalarda ishlash samaradorligini (FPS) taqqoslash&lt;/p&gt;\n&lt;p&gt;/ Metod / Truck / Room / DrJohnson / Avg. /&lt;br /&gt;\n/ :--- / :--- / :--- / :--- / :--- /&lt;br /&gt;\n/ 3DGS-GL / 5,46 / 12,8 / 3,2 / 7,15 /&lt;br /&gt;\n/ SS / 24,8 / 65,8 / 69,4 / 53,3 /&lt;br /&gt;\n/ GPS / 41,3 / 52,8 / 53,0 / 49,03 /&lt;br /&gt;\n/ SortfreeGS / 37,2 / 50,3 / 27,2 / 38,2 /&lt;br /&gt;\n/ MobileGS / – / 32,6 / 28,1 / 30,4 /&lt;br /&gt;\n/ Ours (1-spp) / 78,8 / 112,7 / 86,3 / 92,6 /&lt;br /&gt;\n/ Ours (1-spp + S) / 64,6 / 86,7 / 68,3 / 73,2 /&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 2.&lt;/strong&gt; Vaqtinchalik tarix va Gauss lokal deskriptorlarining Ours-S yordamida ablyatsiyasi&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Usul&lt;/th&gt;\n&lt;th&gt;Mip-NeRF360 (PSNR↑/SSIM↑/LPIPS↓/FPS↑)&lt;/th&gt;\n&lt;th&gt;Tanks&amp;amp;Temples (PSNR↑/SSIM↑/LPIPS↓/FPS↑)&lt;/th&gt;\n&lt;th&gt;Deep Blending (PSNR↑/SSIM↑/LPIPS↓/FPS↑)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;StochasticSplats&lt;/td&gt;\n&lt;td&gt;17.29/0.2427/0.8942/664.95&lt;/td&gt;\n&lt;td&gt;13.30/0.1754/0.9961/843.08&lt;/td&gt;\n&lt;td&gt;21.61/0.3562/0.8063/556.03&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Gaussian Point Splatting&lt;/td&gt;\n&lt;td&gt;17.28/0.2413/0.8947/620.56&lt;/td&gt;\n&lt;td&gt;13.30/0.1749/0.9961/440.99&lt;/td&gt;\n&lt;td&gt;21.60/0.3559/0.8065/438.95&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ours (1-spp)&lt;/td&gt;\n&lt;td&gt;17.28/0.2407/0.8947/880.07&lt;/td&gt;\n&lt;td&gt;13.29/0.1738/0.9965/1001.78&lt;/td&gt;\n&lt;td&gt;21.61/0.3559/0.8065/1024.15&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;3DGS&lt;/td&gt;\n&lt;td&gt;28.90/0.8708/0.1856/122.18&lt;/td&gt;\n&lt;td&gt;23.39/0.8421/0.1837/113.19&lt;/td&gt;\n&lt;td&gt;29.52/0.9038/0.2459/111.18&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;MobileGS†&lt;/td&gt;\n&lt;td&gt;28.20/0.8570/0.2103/234.97&lt;/td&gt;\n&lt;td&gt;-∗/-∗/-∗/-∗&lt;/td&gt;\n&lt;td&gt;30.07/0.9109/0.2486/292.26&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Mini. + Ours (1-spp + S)&lt;/td&gt;\n&lt;td&gt;26.92/0.8055/0.2607/345.31&lt;/td&gt;\n&lt;td&gt;22.31/0.7723/0.2830/343.51&lt;/td&gt;\n&lt;td&gt;29.48/0.8983/0.2703/344.11&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ours (1-spp + S)&lt;/td&gt;\n&lt;td&gt;27.72/0.8120/0.1949/283.17&lt;/td&gt;\n&lt;td&gt;22.72/0.7780/0.2075/305.32&lt;/td&gt;\n&lt;td&gt;29.33/0.8952/0.1895/301.10&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ours (4-spp + S)&lt;/td&gt;\n&lt;td&gt;28.23/0.8344/0.2321/159.59&lt;/td&gt;\n&lt;td&gt;22.98/0.7904/0.2656/173.77&lt;/td&gt;\n&lt;td&gt;29.48/0.8999/0.2591/160.01&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ours (16-spp + L)&lt;/td&gt;\n&lt;td&gt;29.08/0.8606/0.1561/40.43&lt;/td&gt;\n&lt;td&gt;23.68/0.8252/0.1570/40.36&lt;/td&gt;\n&lt;td&gt;29.70/0.9065/0.1735/38.05&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Barcha PSNR qiymatlari standart 3DGS maqsadi bilan solishtirilgan.&lt;/em&gt;&lt;/p&gt;\n&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 3.&lt;/strong&gt; PSNRonheld-outDL3DVviewswithrespectto photographic ground truth. Avg. is the arithmetic mean over the five scenes. The best and second-best values are shown in bold and underlined, respectively. SS (4-spp), GPS (4-spp), and Ours (1-spp + S) run at 353.32, 282.91, and 353.43 FPS, respectively.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render-tT3.jpg\" alt=\"Jadval 3\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"asosiy-xulosalar-va-cheklovlar\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#asosiy-xulosalar-va-cheklovlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiy xulosalar va cheklovlar&lt;/span&gt;&lt;/a&gt;Asosiy xulosalar va cheklovlar&lt;/h4&gt;\n&lt;p&gt;Taklif etilgan usul 3D-sahnalarni renderlashda saralashni (sorting) talab qilmaydigan Gauss stoxastik tanlash (sampling) tizimiga asoslangan. Uzluksiz Gauss splatlarini diskret ko'rinuvchanlik namunalariga aylantirish orqali gibrid sampler 3DGS aktivlarini o'zgartirmasdan, primitiv va fragmentga asoslangan yondashuvlarning afzalliklarini birlashtiradi. Gauss tuzilishini hisobga olgan holda fazoviy-vaqtinchalik rekonstruksiya joriy va tarixiy ma'lumotlarni birlashtirib, kam namunali renderlashda shovqinni samarali bostiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Usul saralashsiz samarali renderlashni ta'minlaydi, stoxastik tanlash va fazoviy-vaqtinchalik filtrlash orqali shovqinni kamaytiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tizim ikki rejimni qo'llab-quvvatlaydi: turli sahnalar uchun umumiy rekonstruksiya modeli va yuqori sifat uchun maxsus sahna konfiguratsiyasi. Asosiy cheklov — siyrak stoxastik kuzatuvlardan rekonstruksiya qilishda yuqori chastotali detallarning haddan tashqari silliqlashishi. Bu ayniqsa nozik tuzilmalar, keskin ko'rinuvchanlik o'tishlari va burchakka bog'liq detallarda yaqqol namoyon bo'ladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Past diskretlash tezligida ma'lumotlar yetishmovchiligi va rekonstruksiya funksiyasi tufayli mayda detallar yo'qolishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Kelajakdagi istiqbolli yo'nalish — bu Gauss tasviri, tanlash strategiyasi va rekonstruksiya tarmog'ini yakuniy tasvir sifati uchun birgalikda optimallashtiradigan yaxlit (end-to-end) o'qitish tizimidir. Bunday sifatga yo'naltirilgan rejim nozik detallarni yaxshiroq saqlab qolishi mumkin, ammo bu hozirgi belgilangan aktivlar bilan ishlashdan farqli o'laroq, har bir sahna uchun qo'shimcha optimallashtirishni talab qiladi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render-f2.jpg\" alt=\"2-rasm: Taklif etilgan Gauss nuqtali tasvirlash va rekonstruksiya konveyerining umumiy ko'rinishi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm: Taklif etilgan Gauss nuqtali tasvirlash va rekonstruksiya konveyerining umumiy ko'rinishi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-rasm: Taklif etilgan Gauss nuqtali tasvirlash va rekonstruksiya konveyerining umumiy ko'rinishi. 1-bosqichda, N ta Gauss primitivini o'z ichiga olgan 3DGS aktivini hisobga olgan holda, xarajatlarni hisobga olgan marshrutlash strategiyasi NF primitivlarini fragmentga asoslangan oqimga, qolgan primitivlarni esa NP stoxastik namuna nuqtalarini yaratadigan primitivga asoslangan oqimga taqsimlaydi. Keyin umumiy chuqurlik testi joriy kadr kuzatuvini shakllantirish uchun qabul qilingan nuqtalarni ularning mahalliy Gauss deskriptorlari bilan birga tanlaydi. 2-bosqichda, rekonstruksiya tarmog'i rekonstruksiya qilingan tasvirni yaratish uchun joriy kuzatuvni va oldinga proyeksiyalangan tarixiy kuzatuvlarni birlashtiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render-f5.jpg\" alt=\"Rasm 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 5&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render-fS2.jpg\" alt=\"Rasm S2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render-fS5.jpg\" alt=\"A5-rasm: 16 spp + katta tarmoq yordamida qo'shimcha sahnalarning sifatli natijalari, neyron rekonstruksiya sifati va mah\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;A5-rasm: 16 spp + katta tarmoq yordamida qo'shimcha sahnalarning sifatli natijalari, neyron rekonstruksiya sifati va mahalliy ko'rinish tafsilotlarini ko'rsatadi.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/20
