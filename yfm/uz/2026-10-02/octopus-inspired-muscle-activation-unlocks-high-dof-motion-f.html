        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"236\" cy=\"110\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"504\" cy=\"182\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · ROBOTICS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Sakkizoyoq uslubi: yumshoq&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;robotlarni boshqarishning&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;yangi bosqichi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/octopus-inspired-muscle-activation-unlocks-high-dof-motion-f-f1.jpg\" alt=\"Rasm 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;An'anaviy yumshoq robotlar ko'plab aktuatorlarni talab qiladi, bu esa ularni og'ir va murakkab qiladi. Tadqiqotchilar shakl xotirasi qotishmasi (&lt;a href=\"concepts/shape-memory-alloy.html\"&gt;SMA&lt;/a&gt;) asosidagi bitta aktuatorga simli birikma tugunlarini (&lt;a href=\"concepts/wire-bonding-junctions.html\"&gt;WBJ&lt;/a&gt;) o'rnatishni taklif qilishdi. Bu tizim sakkizoyoqning neyromushak birikmalarini taqlid qilib, robotning turli qismlarini alohida boshqarish imkonini beradi. Natijada energiya sarfi 40% ga kamaydi va ishchi maydon sezilarli darajada kengaydi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-02/octopus-inspired-muscle-activation-unlocks-high-dof-motion-f.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;WBJ texnologiyasi SMA-aktuator segmentlarini sakkizoyoq mushaklari kabi lokal boshqarish imkonini beradi.&lt;/li&gt;\n&lt;li&gt;Ixcham konstruksiya robotning ishchi hajmini 4,31 × 10^5 mm³ gacha kengaytiradi.&lt;/li&gt;\n&lt;li&gt;Energiya sarfini 40% ga qisqartirish va yuqori manevr qobiliyatiga erishish.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-02/octopus-inspired-muscle-activation-unlocks-high-dof-motion-f.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tizim asosi sifatida shakl xotirasi qotishmasidan (SMA) tayyorlangan prujinasimon aktuator ishlatiladi, u WBJ tugunlari yordamida segmentlarga bo'linadi. Har bir segment uchun alohida drayver talab qilinadigan an'anaviy tizimlardan farqli o'laroq, WBJ kuchlanishni lokal tarzda taqsimlash imkonini beradi. 2 A tok kuchi ostida WBJ-segmentli aktuator barqaror ishlaydi, tok 1 A ga tushganda esa segmentlararo issiqlik o'tkazuvchanligi hisobiga 12,3 mm gacha qo'shimcha qisqarish kuzatiladi.&lt;/p&gt;\n&lt;p&gt;WBJ tugunlarining mexanik mustahkamligi 9 N yuklanish va 7 mm cho'zilishda sinovdan o'tkazildi. 2000 dan ortiq siklli testlar tizimning yuqori chidamliligini tasdiqladi. WBJ yordamida yig'ilgan ixcham robotning ishchi hajmi 4,31 × 10^5 mm³ ni tashkil etib, an'anaviy yig'ma konstruksiyalardan 2,9 barobar kattaroqdir. Bu yondashuv robotning chiziqli manevr qobiliyatini o'rtacha 2,11 barobar oshiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot ochiq konturli boshqaruv tizimida o'tkazilgan, bu esa bir vaqtning o'zida bir nechta segment faollashganda trayektoriyaning noaniqligiga olib keladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"rasmlar\"&gt;&lt;a href=\"2026-10-02/octopus-inspired-muscle-activation-unlocks-high-dof-motion-f.html#rasmlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Rasmlar&lt;/span&gt;&lt;/a&gt;Rasmlar&lt;/h2&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/octopus-inspired-muscle-activation-unlocks-high-dof-motion-f-f2.jpg\" alt=\"Rasm 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/octopus-inspired-muscle-activation-unlocks-high-dof-motion-f-f3.jpg\" alt=\"Rasm 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/octopus-inspired-muscle-activation-unlocks-high-dof-motion-f-f4.jpg\" alt=\"Rasm 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 4&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/octopus-inspired-muscle-activation-unlocks-high-dof-motion-f-f5.jpg\" alt=\"Rasm 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 5&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/octopus-inspired-muscle-activation-unlocks-high-dof-motion-f-f6.jpg\" alt=\"Rasm 6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 6&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-02/octopus-inspired-muscle-activation-unlocks-high-dof-motion-f.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/t
