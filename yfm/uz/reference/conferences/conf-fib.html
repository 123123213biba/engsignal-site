        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Konferensiyalar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Международная федерация по бетону: железобетонные конструкции&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/conferences/conf-fib.jpg\" alt=\"fib Symposium / Congress\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;Международная федерация по бетону: железобетонные конструкции&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima olamiz&lt;/td&gt;\n&lt;td&gt;программы, труды&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-concrete.html\"&gt;Beton va bog'lovchilar&lt;/a&gt;, &lt;a href=\"concepts/spec-structures.html\"&gt;Konstruksiyalar va binolar&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"konferensiya-nima\"&gt;&lt;a href=\"reference/conferences/conf-fib.html#konferensiya-nima\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Konferensiya nima&lt;/span&gt;&lt;/a&gt;Konferensiya nima&lt;/h2&gt;\n&lt;p&gt;fib Symposium / Congress — bu Xalqaro beton federatsiyasi (International Federation for Structural Concrete) tomonidan tashkil etiladigan asosiy xalqaro tadbirdir. Konferensiya olimlar, konstruktor-muhandislar va qurilish materiallari ishlab chiqaruvchilari o'rtasida bilim almashish uchun asosiy maydon hisoblanadi. Tadbirlarning asosiy maqsadi — beton va temir-beton sohasidagi nazariy tadqiqotlarni binolarning xavfsizligi va mustahkamligini oshiradigan amaliy muhandislik yechimlariga aylantirishdir.&lt;/p&gt;\n&lt;h2 id=\"tashkilotchilar-va-tarix\"&gt;&lt;a href=\"reference/conferences/conf-fib.html#tashkilotchilar-va-tarix\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tashkilotchilar va tarix&lt;/span&gt;&lt;/a&gt;Tashkilotchilar va tarix&lt;/h2&gt;\n&lt;p&gt;Tashkilotchi butun dunyo bo'ylab mutaxassislarning milliy guruhlarini birlashtirgan fib federatsiyasidir. Tashkilot tarixi 1998 yilda ikkita yirik birlashmaning (CEB va FIP) qo'shilishiga borib taqaladi. O'shandan beri federatsiya muntazam ravishda simpozium va kongresslar o'tkazib keladi. Ta'kidlash joizki, fib faoliyati faqat qurilish fanlari va beton texnologiyalariga qaratilgan; u boshqa kontekstlarda shunga o'xshash qisqartmalardan foydalanadigan siyosiy harakatlar yoki tashkilotlarga aloqador emas.&lt;/p&gt;\n&lt;h2 id=\"mavzular-va-seksiyalar\"&gt;&lt;a href=\"reference/conferences/conf-fib.html#mavzular-va-seksiyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mavzular va seksiyalar&lt;/span&gt;&lt;/a&gt;Mavzular va seksiyalar&lt;/h2&gt;\n&lt;p&gt;Konferensiya dasturi sement toshining fundamental kimyosidan tortib murakkab baland qavatli konstruksiyalarni loyihalashgacha bo'lgan keng doiradagi masalalarni qamrab oladi. Asosiy seksiyalar odatda quyidagilarni o'z ichiga oladi:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Yangi materiallar va bog'lovchilar: ekologik toza aralashmalar va chidamlilik sohasidagi tadqiqotlar.&lt;/li&gt;\n&lt;li&gt;Seysmik barqaror qurilish: konstruksiyalarni yengillashtirish uchun poliuretan qoplamalaridan foydalanish kabi yuklamani kamaytirish usullari.&lt;/li&gt;\n&lt;li&gt;Raqamlashtirish va modellashtirish: betonning mustahkamligini molekulyar darajada bashorat qilish uchun neyron tarmoq potensiallarini (masalan, CSH-MLP) qo'llash.&lt;/li&gt;\n&lt;li&gt;Barqaror rivojlanish: beton ishlab chiqarishda uglerod izini kamaytirish.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"u-yerda-nimalar-paydo-boladi\"&gt;&lt;a href=\"reference/conferences/conf-fib.html#u-yerda-nimalar-paydo-boladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;U yerda nimalar paydo bo'ladi&lt;/span&gt;&lt;/a&gt;U yerda nimalar paydo bo'ladi&lt;/h2&gt;\n&lt;p&gt;fib simpoziumlarida keyinchalik sanoat standartlariga aylanadigan tadqiqot natijalari birinchi marta taqdim etiladi. Masalan, bu yerda og'ir qurilish materiallarini yengil polimer analoglariga almashtirish usullari muhokama qilinadi, bu esa yuk ko'taruvchi konstruksiyalarni kuchaytirmasdan seysmik yuklamani 20% ga kamaytirish imkonini beradi. Shuningdek, sement kompozitlarini tahlil qilish uchun mashinali o'qitish usullari namoyish etiladi.&lt;/p&gt;\n&lt;h2 id=\"qanday-kuzatish-va-ishtirok-etish\"&gt;&lt;a href=\"reference/conferences/conf-fib.html#qanday-kuzatish-va-ishtirok-etish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday kuzatish va ishtirok etish&lt;/span&gt;&lt;/a&gt;Qanday kuzatish va ishtirok etish&lt;/h2&gt;\n&lt;p&gt;Konferensiyalarda ishtirok etish uchun fib rasmiy taqvimini kuzatib borish kerak. Ilmiy ishlar to'plamlari (proceedings) ixtisoslashtirilgan ma'lumotlar bazalarida mavjud. Tadqiqotchilar o'z ishlarining tezislarini taqdim etishlari mumkin. To'g'ridan-to'g'ri ishtirok etmaydigan mutaxassislar uchun konferensiya materiallarini o'rganish materialshunoslik va konstruksiyalarni loyihalash sohasidagi dolzarb tendentsiyalardan xabardor bo'lishning eng yaxshi usulidir.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/conferences/conf-fib.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Brazilian_Integralist_Front\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Brazilian Integralist Front — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Frente_Integralista_Brasileira_logo.png\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Morgadofelipen, Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Konferensiyalar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Международная федерация по бетону: железобетонные конструкции"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"fib Symposium / Congress","description":"Международная федерация по бетону: железобетонные конструкции","vcsPath":"reference/conferences/conf-fib.md"},"headings":[{"title":"Konferensiya nima","href":"reference/conferences/conf-fib.html#konferensiya-nima","level":2},{"title":"Tashkilotchilar va tarix","href":"reference/conferences/conf-fib.html#tashkilotchilar-va-tarix","level":2},{"title":"Mavzular va seksiyalar","href":"reference/conferences/conf-fib.html#mavzular-va-seksiyalar","level":2},{"title":"U yerda nimalar paydo bo'ladi","href":"reference/conferences/conf-fib.html#u-yerda-nimalar-paydo-boladi","level":2},{"title":"Qanday kuzatish va ishtirok etish","href":"reference/conferences/conf-fib.html#qanday-kuzatish-va-ishtirok-etish","level":2},{"title":"Manbalar","href":"reference/conferences/conf-fib.html#manbalar","level":2}],"title":"fib Symposium / Congress"},"router":{"pathname":"reference/conferences/conf-fib","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
