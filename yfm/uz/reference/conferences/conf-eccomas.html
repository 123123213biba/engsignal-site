        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Konferensiyalar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;вычислительная механика, МКЭ&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/conferences/conf-eccomas.jpg\" alt=\"ECCOMAS / WCCM\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;вычислительная механика, МКЭ&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima olamiz&lt;/td&gt;\n&lt;td&gt;аннотации докладов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-fem.html\"&gt;Hisob va modellashtirish&lt;/a&gt;, &lt;a href=\"concepts/spec-mechanics.html\"&gt;Materiallar qarshiligi va mexanika&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"konferensiya-nima\"&gt;&lt;a href=\"reference/conferences/conf-eccomas.html#konferensiya-nima\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Konferensiya nima&lt;/span&gt;&lt;/a&gt;Konferensiya nima&lt;/h2&gt;\n&lt;p&gt;ECCOMAS (European Community on Computational Methods in Applied Sciences) va WCCM (World Congress on Computational Mechanics) — bu hisoblash mexanikasi bilan shug'ullanadigan olimlar va muhandislarni birlashtiruvchi yirik xalqaro maydonlardir. Konferensiyalar Oy bazalaridan tortib kvant mikroprotsessorlarigacha bo'lgan murakkab tizimlarning xatti-harakatlarini bashorat qilish imkonini beruvchi ilg'or raqamli modellashtirish usullarini taqdim etish joyi hisoblanadi.&lt;/p&gt;\n&lt;h2 id=\"tashkilotchilar-va-tarix\"&gt;&lt;a href=\"reference/conferences/conf-eccomas.html#tashkilotchilar-va-tarix\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tashkilotchilar va tarix&lt;/span&gt;&lt;/a&gt;Tashkilotchilar va tarix&lt;/h2&gt;\n&lt;p&gt;ECCOMAS — amaliy fanlar sohasidagi faoliyatni muvofiqlashtiruvchi Yevropa ilmiy tashkilotidir. WCCM esa IACM (International Association for Computational Mechanics) shafeligida o'tkaziladi. Ushbu tadbirlar bir necha yilda bir marta o'tkazilib, matematik modellashtirish va fizik jarayonlarni algoritmlash bo'yicha tajriba almashish uchun minglab mutaxassislarni to'playdi.&lt;/p&gt;\n&lt;h2 id=\"mavzular-va-seksiyalar\"&gt;&lt;a href=\"reference/conferences/conf-eccomas.html#mavzular-va-seksiyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mavzular va seksiyalar&lt;/span&gt;&lt;/a&gt;Mavzular va seksiyalar&lt;/h2&gt;\n&lt;p&gt;Konferensiyalarning asosiy diqqat markazida chekli elementlar usuli (ChEU) va uning rivojlanishi turadi. Seksiya mavzulari murakkab geometrik domenlar uchun to'rlar yaratishdan (mesh generation) tortib, xonalarning raqamli egizaklarini ishlab chiqishgacha bo'lgan keng doirani qamrab oladi. Topologik optimallashtirish, muhitlar o'zaro ta'siri va fizik hodisalarni masshtablash masalalari muhokama qilinadi.&lt;/p&gt;\n&lt;h2 id=\"u-yerda-nimalar-paydo-boladi\"&gt;&lt;a href=\"reference/conferences/conf-eccomas.html#u-yerda-nimalar-paydo-boladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;U yerda nimalar paydo bo'ladi&lt;/span&gt;&lt;/a&gt;U yerda nimalar paydo bo'ladi&lt;/h2&gt;\n&lt;p&gt;Konferensiyalarda loyihalashga yondashuvni o'zgartiruvchi tadqiqotlar taqdim etiladi. Masalan, regolitdan qurilish uchun topologik ilmoq usullari, RGB-D skanlarini simulyatsiya kodiga aylantirish algoritmlari va fotonlar hamda fononlarning mikro-masshtabdagi o'zaro ta'sirini modellashtirish kabi mavzular ko'rib chiqiladi.&lt;/p&gt;\n&lt;h2 id=\"qanday-kuzatish-va-ishtirok-etish\"&gt;&lt;a href=\"reference/conferences/conf-eccomas.html#qanday-kuzatish-va-ishtirok-etish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday kuzatish va ishtirok etish&lt;/span&gt;&lt;/a&gt;Qanday kuzatish va ishtirok etish&lt;/h2&gt;\n&lt;p&gt;Konferensiyalarda ishtirok etish uchun taqrizdan o'tadigan ma'ruzalar annotatsiyalarini nashr etish talab qilinadi. Yangiliklarni ECCOMAS va IACM rasmiy portallari orqali kuzatish mumkin. Bu o'z muhandislik amaliyotiga zamonaviy hisoblash usullarini joriy etishni istagan mutaxassislar uchun asosiy manbadir.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"reference/conferences/conf-eccomas.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;Hisoblash mexanikasining asosi uzluksiz fazoni diskretlashdan iborat. Chekli elementlar usuli (ChEU) murakkab geometriyani oddiy kataklarga (simplekslarga) ajratib, to'r hosil qiladi. To'r sifati hisob-kitoblar aniqligini belgilaydi: tizimni ortiqcha ma'lumotlar bilan yuklamasdan, muhim zonalarda yetarlicha mayda kataklarni yaratish muhimdir. Bu qarshiliklar nazariyasi va mexanika bilan bevosita bog'liq: hisob-kitoblar tabiiy sinovlarni raqamli modellashtirish bilan almashtirish imkonini beradi.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/conferences/conf-eccomas.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Mesh_generation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Mesh generation — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Example_finite_element_mesh,_for_illustrating_the_concept.png\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: SamitchSandia, CC BY-SA 4.0&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Konferensiyalar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"вычислительная механика, МКЭ"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"ECCOMAS / WCCM","description":"вычислительная механика, МКЭ","vcsPath":"reference/conferences/conf-eccomas.md"},"headings":[{"title":"Konferensiya nima","href":"reference/conferences/conf-eccomas.html#konferensiya-nima","level":2},{"title":"Tashkilotchilar va tarix","href":"reference/conferences/conf-eccomas.html#tashkilotchilar-va-tarix","level":2},{"title":"Mavzular va seksiyalar","href":"reference/conferences/conf-eccomas.html#mavzular-va-seksiyalar","level":2},{"title":"U yerda nimalar paydo bo'ladi","href":"reference/conferences/conf-eccomas.html#u-yerda-nimalar-paydo-boladi","level":2},{"title":"Qanday kuzatish va ishtirok etish","href":"reference/conferences/conf-eccomas.html#qanday-kuzatish-va-ishtirok-etish","level":2},{"title":"Nazariya","href":"reference/conferences/conf-eccomas.html#nazariya","level":2},{"title":"Manbalar","href":"reference/conferences/conf-eccomas.html#manbalar","level":2}],"title":"ECCOMAS / WCCM"},"router":{"pathname":"reference/conferences/conf-eccomas","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
