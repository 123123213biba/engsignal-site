        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;48 ta tushuncha&lt;/p&gt;\n&lt;h2 id=\"m\"&gt;&lt;a href=\"reference/glossary.html#m\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M&lt;/span&gt;&lt;/a&gt;M&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-mechanics.html\"&gt;Materiallar qarshiligi va mexanika&lt;/a&gt; — Прочность, жёсткость, устойчивость: классические задачи и свежие решения — с формулами и эпюрами.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-materials.html\"&gt;Materialshunoslik&lt;/a&gt; — Сталь, композиты, дерево, полимеры, стекло: структура → свойства → применение.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"r\"&gt;&lt;a href=\"reference/glossary.html#r\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Р&lt;/span&gt;&lt;/a&gt;Р&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-axial.html\"&gt;Растяжение и сжатие&lt;/a&gt; — Осевые нагрузки, напряжения, закон Гука.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-developables.html\"&gt;Развёртки, оригами, кириками&lt;/a&gt; — Развёртываемые поверхности, складчатые конструкции.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-robotics.html\"&gt;Роботы на стройке&lt;/a&gt; — Кирпичекладущие роботы, дроны, автоматизация.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"i\"&gt;&lt;a href=\"reference/glossary.html#i\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;И&lt;/span&gt;&lt;/a&gt;И&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-bending.html\"&gt;Изгиб и балки&lt;/a&gt; — Эпюры моментов, прогибы, балки переменного сечения.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"k\"&gt;&lt;a href=\"reference/glossary.html#k\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;К&lt;/span&gt;&lt;/a&gt;К&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-torsion.html\"&gt;Кручение&lt;/a&gt; — Валы, тонкостенные профили, депланация.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-dynamics.html\"&gt;Колебания и динамика&lt;/a&gt; — Собственные частоты, демпфирование, удар.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-composites.html\"&gt;Композиты&lt;/a&gt; — Стекло- и углепластики, FRP-арматура.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-ceramics_glass.html\"&gt;Керамика и стекло&lt;/a&gt; — Хрупкие материалы, остекление, огнеупоры.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-corrosion.html\"&gt;Коррозия&lt;/a&gt; — Ржавление арматуры, защита, ингибиторы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-masonry.html\"&gt;Каменная кладка&lt;/a&gt; — Кирпич, камень, исторические здания.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"u\"&gt;&lt;a href=\"reference/glossary.html#u\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;У&lt;/span&gt;&lt;/a&gt;У&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-stability.html\"&gt;Устойчивость и потеря устойчивости&lt;/a&gt; — Продольный изгиб стержней, оболочек, панелей.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-fatigue_fracture.html\"&gt;Усталость и разрушение&lt;/a&gt; — Трещины, циклическая прочность, механика разрушения.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"p\"&gt;&lt;a href=\"reference/glossary.html#p\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;П&lt;/span&gt;&lt;/a&gt;П&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-plates_shells.html\"&gt;Пластины и оболочки&lt;/a&gt; — Тонкостенные конструкции, мембраны, купола.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-projections.html\"&gt;Проекции и виды&lt;/a&gt; — Ортогональные, аксонометрические и перспективные проекции.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-surfaces.html\"&gt;Поверхности и пересечения&lt;/a&gt; — Линии пересечения, линейчатые поверхности, коники.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-polymers.html\"&gt;Полимеры&lt;/a&gt; — Пластики, эластомеры, герметики.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"c\"&gt;&lt;a href=\"reference/glossary.html#c\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C&lt;/span&gt;&lt;/a&gt;C&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-geometry.html\"&gt;Chizma geometriya va grafika&lt;/a&gt; — Проекции, поверхности, пересечения, развёртки — и то, как это живёт в CAD и вычислительной геометрии.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-cad_parametric.html\"&gt;CAD и параметрическое моделирование&lt;/a&gt; — Параметрика, NURBS, генеративный дизайн.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"a\"&gt;&lt;a href=\"reference/glossary.html#a\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;А&lt;/span&gt;&lt;/a&gt;А&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-dg_algorithms.html\"&gt;Алгоритмы начерталки&lt;/a&gt; — Натуральная величина, метрические задачи как алгоритмы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"v\"&gt;&lt;a href=\"reference/glossary.html#v\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;В&lt;/span&gt;&lt;/a&gt;В&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-comp_geometry.html\"&gt;Вычислительная геометрия&lt;/a&gt; — Сетки, триангуляции, разбиения, алгоритмы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-uhpc.html\"&gt;Высокопрочный и фибробетон&lt;/a&gt; — UHPC, фибра, трещиностойкость.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"b\"&gt;&lt;a href=\"reference/glossary.html#b\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;B&lt;/span&gt;&lt;/a&gt;B&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-concrete.html\"&gt;Beton va bog'lovchilar&lt;/a&gt; — Состав бетона и цемента: гидратация, добавки, долговечность, «зелёные» вяжущие.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-bim.html\"&gt;BIM и цифровое проектирование&lt;/a&gt; — Информационная модель здания.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"h\"&gt;&lt;a href=\"reference/glossary.html#h\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Х&lt;/span&gt;&lt;/a&gt;Х&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-cement_chem.html\"&gt;Химия цемента и гидратация&lt;/a&gt; — Клинкер, C-S-H, тепловыделение, твердение.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-admixtures.html\"&gt;Химические добавки&lt;/a&gt; — Суперпластификаторы, ускорители, воздухововлекающие.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"m1\"&gt;&lt;a href=\"reference/glossary.html#m1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;М&lt;/span&gt;&lt;/a&gt;М&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-scm.html\"&gt;Минеральные добавки (SCM)&lt;/a&gt; — Зола-унос, шлак, метакаолин, стекло вместо части цемента.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-steel_structures.html\"&gt;Металлические конструкции&lt;/a&gt; — Фермы, рамы, соединения.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-bridges.html\"&gt;Мосты&lt;/a&gt; — Пролёты, вантовые и арочные системы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-fem_methods.html\"&gt;Метод конечных элементов&lt;/a&gt; — Сетки, элементы, сходимость.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-ml_surrogate.html\"&gt;Машинное обучение в расчётах&lt;/a&gt; — Суррогатные модели, PINN.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"g\"&gt;&lt;a href=\"reference/glossary.html#g\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Г&lt;/span&gt;&lt;/a&gt;Г&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-geopolymer.html\"&gt;Геополимеры и щелочные вяжущие&lt;/a&gt; — Бетон без портландцемента.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"d\"&gt;&lt;a href=\"reference/glossary.html#d\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Д&lt;/span&gt;&lt;/a&gt;Д&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-durability.html\"&gt;Долговечность&lt;/a&gt; — Хлориды, карбонизация, ЩСР, морозостойкость.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-timber.html\"&gt;Дерево и клеёные материалы&lt;/a&gt; — CLT, клеёный брус, деревянные небоскрёбы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-dem_particles.html\"&gt;Дискретные и частичные методы&lt;/a&gt; — DEM, SPH, моделирование гранулярных сред.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"s\"&gt;&lt;a href=\"reference/glossary.html#s\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;С&lt;/span&gt;&lt;/a&gt;С&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-steels.html\"&gt;Стали и сплавы&lt;/a&gt; — Марки, термообработка, микроструктура.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-seismic.html\"&gt;Сейсмостойкость&lt;/a&gt; — Землетрясения, изоляция, демпферы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-prefab.html\"&gt;Сборное и модульное&lt;/a&gt; — Заводские модули, узлы, монтаж.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"k1\"&gt;&lt;a href=\"reference/glossary.html#k1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;K&lt;/span&gt;&lt;/a&gt;K&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-structures.html\"&gt;Konstruksiyalar va binolar&lt;/a&gt; — Как стоят здания и мосты: железобетон, металл, дерево, кладка, фундаменты, сейсмика.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"zh\"&gt;&lt;a href=\"reference/glossary.html#zh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ж&lt;/span&gt;&lt;/a&gt;Ж&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-rc_structures.html\"&gt;Железобетонные конструкции&lt;/a&gt; — Плиты, колонны, преднапряжение.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"o\"&gt;&lt;a href=\"reference/glossary.html#o\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;О&lt;/span&gt;&lt;/a&gt;О&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-foundations.html\"&gt;Основания и фундаменты&lt;/a&gt; — Грунты, сваи, осадки.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-formwork.html\"&gt;Опалубка и твердение&lt;/a&gt; — Опалубка, прогрев, уход за бетоном.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"h1\"&gt;&lt;a href=\"reference/glossary.html#h1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;H&lt;/span&gt;&lt;/a&gt;H&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-fem.html\"&gt;Hisob va modellashtirish&lt;/a&gt; — Численные методы в инженерии: МКЭ, оптимизация, цифровые двойники.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"t\"&gt;&lt;a href=\"reference/glossary.html#t\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Т&lt;/span&gt;&lt;/a&gt;Т&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-topopt.html\"&gt;Топологическая оптимизация&lt;/a&gt; — Форма, которую «находит» алгоритм.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"c1\"&gt;&lt;a href=\"reference/glossary.html#c1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ц&lt;/span&gt;&lt;/a&gt;Ц&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-digital_twin.html\"&gt;Цифровые двойники и мониторинг&lt;/a&gt; — Датчики на сооружениях, SHM.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"q\"&gt;&lt;a href=\"reference/glossary.html#q\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q&lt;/span&gt;&lt;/a&gt;Q&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-build.html\"&gt;Qurilish texnologiyalari&lt;/a&gt; — Как строят сегодня: 3D-печать, модульность, BIM, роботы на площадке.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"3\"&gt;&lt;a href=\"reference/glossary.html#3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3&lt;/span&gt;&lt;/a&gt;3&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-printing_3d.html\"&gt;3D-печать в строительстве&lt;/a&gt; — Печать бетоном, межслойная прочность.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"48 ta tushuncha"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Lug'at A–Z","description":"48 ta tushuncha","vcsPath":"reference/glossary.md"},"headings":[{"title":"M","href":"reference/glossary.html#m","level":2},{"title":"Р","href":"reference/glossary.html#r","level":2},{"title":"И","href":"reference/glossary.html#i","level":2},{"title":"К","href":"reference/glossary.html#k","level":2},{"title":"У","href":"reference/glossary.html#u","level":2},{"title":"П","href":"reference/glossary.html#p","level":2},{"title":"C","href":"reference/glossary.html#c","level":2},{"title":"А","href":"reference/glossary.html#a","level":2},{"title":"В","href":"reference/glossary.html#v","level":2},{"title":"B","href":"reference/glossary.html#b","level":2},{"title":"Х","href":"reference/glossary.html#h","level":2},{"title":"М","href":"reference/glossary.html#m1","level":2},{"title":"Г","href":"reference/glossary.html#g","level":2},{"title":"Д","href":"reference/glossary.html#d","level":2},{"title":"С","href":"reference/glossary.html#s","level":2},{"title":"K","href":"reference/glossary.html#k1","level":2},{"title":"Ж","href":"reference/glossary.html#zh","level":2},{"title":"О","href":"reference/glossary.html#o","level":2},{"title":"H","href":"reference/glossary.html#h1","level":2},{"title":"Т","href
