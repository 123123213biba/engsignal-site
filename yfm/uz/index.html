bitat-design-based-on-topological-i-card.jpg"},"buttons":[{"text":"O'qish","url":"2026-10-03/a-pyramidal-isru-lunar-habitat-design-based-on-topological-i.html","theme":"action"}]},{"type":"card-layout-block","animated":false,"title":{"text":"Yangi son &amp;middot; 03.10.2026","url":"2026-10-03/index.html"},"colSizes":{"all":12,"md":6,"lg":4},"children":[{"type":"layout-item","media":{"image":"2026-10-03/a-pyramidal-isru-lunar-habitat-design-based-on-topological-i-card.jpg"},"content":{"title":"Regolitdan oy&amp;nbsp;bazasi: yelim va&amp;nbsp;boltlar o&amp;lsquo;rniga piramidal arxitektura","text":"&lt;p&gt;Oyda sement va mahkamlagichlarsiz qurilish: muhandislar regolit bloklarini topologik ilmoqlash orqali yig‘ishni taklif qilishdi.&lt;/p&gt;\n","links":[{"url":"2026-10-03/a-pyramidal-isru-lunar-habitat-design-based-on-topological-i.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-03/correlation-imaging-via-hybrid-entanglement-between-microwav-card.jpg"},"content":{"title":"Kvant optikasi: makro-obyektlarni chip o&amp;lsquo;lchamiga qadar siqish","text":"&lt;p&gt;Olimlar mikroto‘lqinli fotonlar va fononlarni chulg‘ab, obyektlarni million marta kattalashtirib yoki kichraytirib ko‘rishga muvaffaq bo‘lishdi.&lt;/p&gt;\n","links":[{"url":"2026-10-03/correlation-imaging-via-hybrid-entanglement-between-microwav.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-card.jpg"},"content":{"title":"Muzlatilgan qum va&amp;nbsp;vakuum murakkab alyuminiy quymalarini qanday qutqaradi","text":"&lt;p&gt;Alyuminiy-mis qotishmalari quyishda injiq. Tadqiqotchilar kriogen qoliplar va manfiy bosim yordamida g‘ovaklikni yengish usulini topdilar.&lt;/p&gt;\n","links":[{"url":"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy.html","text":"O'qish","arrow":true,"theme":"normal"}]}}]},{"type":"card-layout-block","animated":false,"title":{"text":"Son &amp;middot; 02.10.2026","url":"2026-10-02/index.html"},"colSizes":{"all":12,"md":6,"lg":4},"children":[{"type":"layout-item","media":{"image":"2026-10-02/bio-inspired-functional-recursion-enables-multi-mode-locomot-card.jpg"},"content":{"title":"140&amp;nbsp;мг&amp;nbsp;вазндаги робот: ҳашаротлар муҳандисларни қандай илҳомлантирди","text":"&lt;p&gt;Учиш, судралиш ва сувга шўнғишга қодир микроробот: турли моторлар ўрнига битта универсал тана.&lt;/p&gt;\n","links":[{"url":"2026-10-02/bio-inspired-functional-recursion-enables-multi-mode-locomot.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render-card.jpg"},"content":{"title":"Gaussian Stippling: 3D renderlashni sifatni yo&amp;rsquo;qotmasdan tezlashtirish","text":"&lt;p&gt;Yangi Gaussian Stippling usuli qatlamlarni saralashdan voz kechib, mobil qurilmalarda renderlash tezligini oshiradi.&lt;/p&gt;\n","links":[{"url":"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-card.jpg"},"content":{"title":"AIR-LLM: xotira va&amp;nbsp;yuklashsiz neyron tarmoqlarni ishga tushirish","text":"&lt;p&gt;RAM'dagi gigabaytlarni unuting: yangi AIR-LLM arxitekturasi neyron tarmoq vaznlarini to'g'ridan-to'g'ri radioefirda hisoblaydi.&lt;/p&gt;\n","links":[{"url":"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/multi-functional-performance-of-upcycled-high-density-polyur-card.jpg"},"content":{"title":"Binolarni yengillashtirish: qayta ishlangan poliuretan zilziladan himoya qiladi","text":"&lt;p&gt;Sement qoplamasini poliuretan bilan almashtirish konstruksiyani kucha antirish","text":"&lt;p&gt;Oddiy RGB-D xona skanini Python skripti yordamida to'liq raqamli egizakka aylantiring.&lt;/p&gt;\n","links":[{"url":"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/massively-parallel-reinforcement-learning-with-a-chaotic-rec-card.jpg"},"content":{"title":"Kremniy ichidagi xaotik tizim: sun&amp;rsquo;iy intellektni tezlashtirishning yangi usuli","text":"&lt;p&gt;Takt generatorlarini unuting. Biz oddiy FPGA chiplarini neyron tarmoqlarni o'ta tez o'qitish uchun xaotik signallar yaratishga o'rgatdik.&lt;/p&gt;\n","links":[{"url":"2026-10-02/massively-parallel-reinforcement-learning-with-a-chaotic-rec.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/wood-carbon-sponge-sio2-aerogel-composites-with-anisotropic-card.jpg"},"content":{"title":"Yog&amp;rsquo;och uglerodli aerogel: anizotrop tuzilish radio to&amp;rsquo;lqinlarni qanday boshqaradi","text":"&lt;p&gt;Balsa daraxtining tabiiy arxitekturasi uglerodli gubkani yo'naltirilgan xususiyatlarga ega samarali stels-materialga aylantiradi.&lt;/p&gt;\n","links":[{"url":"2026-10-02/wood-carbon-sponge-sio2-aerogel-composites-with-anisotropic.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/l-band-single-photon-generation-from-a-cavity-coupled-silico-card.jpg"},"content":{"title":"Kremniy C-markazlari: L-diapazondagi kvant tarmoqlari uchun yangi standart","text":"&lt;p&gt;Olimlar kremniyda yagona C-markazni ajratib olishdi, bu telekommunikatsiya to‘lqinlarida masshtablanadigan kvant aloqalarini yaratishga yo‘l ochadi.&lt;/p&gt;\n","links":[{"url":"2026-10-02/l-band-single-photon-generation-from-a-cavity-coupled-silico.html","text":"O'qish","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/machine-learning-potential-for-calciu
