        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"251\" cy=\"170\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"629\" cy=\"183\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · STEELS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Мұздатылған құм мен вакуум&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;күрделі алюминий құймаларын&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;қалай құтқарады&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-f1.jpg\" alt=\"Мұздатылған құмды қалып моделіндегі температураны жинаудың принципті схемасы. (a) Құрылғының алдыңғы көрінісі. (b) Құрыл\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Мұздатылған құмды қалып моделіндегі температураны жинаудың принципті схемасы. (a) Құрылғының алдыңғы көрінісі. (b) Құрылғының қима көрінісі.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;ZL205A қорытпасын құю оның кристалдану аралығының кеңдігі мен төмен аққыштығына байланысты қиындық тудырады. Мұздатылған құм қалыптарымен бірге теріс қысымды қолдану жылу алмасуды күрт жақсартады. Бұл шешім жұқа қабырғалы бөлшектерде ұсақ түйіршікті құрылым мен ақаусыз нәтижені қамтамасыз етеді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Оңтайлы IHTC 236 Вт/(м²·К) 6% ылғалдылық пен -40 °C-та алынды.&lt;/li&gt;\n&lt;li&gt;T6 өңдеуден кейін беріктік 478,5 МПа және созылу 7,4% болды.&lt;/li&gt;\n&lt;li&gt;Әдіс диаметрі 180 мм жұқа қабырғалы бөлшектердегі ақауларды жояды.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Зерттеу газ кеуектілігі мен шөгу ақауларына бейім ZL205A (AlCu5MnTiCdV) қорытпасына арналған. «Қалып-құйма» шекарасындағы жылу алмасуды талдау үшін 10 Гц жиілікте жазатын жеті K-типті терможұп деректері негізінде кері жылу өткізгіштік әдісі қолданылды. Процестің оңтайлы параметрлері — қалып ылғалдылығы 6% және мұздату температурасы -40 °C — орташа жылу беру коэффициентін (IHTC) 236 Вт/(м²·К) деңгейіне жеткізді.&lt;/p&gt;\n&lt;p&gt;Бұл көрсеткіш қарапайым мұздатылған қалыптарға қарағанда 2,8 есе, ал вакуумды шайырлы құм қалыптарына қарағанда 1,6 есе жоғары. Жылуды шығару қарқындылығының артуы түйіршіктердің ұсақталуына және газдардың тиімді шығуына ықпал етеді. Нәтижесінде, созылу кезіндегі беріктік құйма күйінде 200,6 МПа және T6 термиялық өңдеуден кейін 478,5 МПа-ға жетеді, бұл қабырға қалыңдығы 3 мм бөлшектерді құюға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу шағын көлемді зертханалық үлгілермен шектелген және ірі өнеркәсіптік құймалар үшін процестің масштабталуын ескермейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Құйма алюминий қорытпалары аэроғарыш жабдықтарында кеңінен қолданылады, негізінен ұшақ корпустары, қозғалтқыш жүйелері және басқару жүйелері үшін құрылымдық компоненттер ретінде қызмет етеді, мұнда жеңілдік пен жоғары беріктік қасиеттері өте маңызды. Аэроғарыш өндірісінде ең көп қолданылатын қорытпалар ZL1×× және ZL2×× сериялары болып табылады, олар жалпы тұтынудың 95%-дан астамын құрайды. Бұл қорытпалар әдетте құм қалыптарына құю, кокильге құю және инвестициялық құю әдістері арқылы қалыптасады, көбінесе жоғары өнімді алюминий қорытпасы құймаларын алу үшін төмен қысымды және электромагниттік құю сияқты арнайы құю техникаларымен біріктіріледі. Алайда, алюминий қорытпалары жоғары температурада газды сіңіруге және тотығуға өте бейім, бұл құйма өнімдерінде көптеген қатаю ақауларына және өнімділіктің төмендеуіне әкеледі. Сонымен қатар, технологияның дамуымен өнеркәсіптік өндіріс алюминий қорытпаларын дайындау, өңдеу және жұмыс көрсеткіштеріне барған сайын қатаң талаптар қоюда. Осы тұрғыдан алғанда, қатаю процесінде кең қатаю интервалдары бар қорытпалардың қатаю мінез-құлқын нақты уақыт режимінде реттеу, олардың микроқұрылымын тиімдірек тазарту, құрылымдық ақауларды жою және механикалық қасиеттерін арттыру өзекті мәселе мен зерттеу нысанына айналды. Бұл мұндай қорытпалардың соңғы пішінге жақын (near-net shaping) қалыптасуын одан әрі қамтамасыз етеді, құюдан кейінгі өңдеуді азайтады, материал қалдықтарын азайтады, шығындарды төмендетеді және жұмыс талаптарына сәйкестікті қамтамасыз ете отырып, материалды пайдалану мен өндіріс тиімділігін арттырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Негізгі мәселе ақауларды азайту және құймалардың сапасын арттыру үшін кең кристалдану интервалы бар қорытпалардың қатаю процесін басқару қажеттілігі болып табылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;1970-жылдары британдық Booth және British Oxygen Company компаниялары құю процесінде криогендік технологияны қолданды және мұздатылған қалыпқа құю процесін ойлап тапты. Алынған қалып белгілі бір беріктікке жету үшін төмен температурада мұздатылды және нәтижесінде пайда болған құм қалыбы негізінен дәстүрлі құм қалыбына құюда қолданылатындармен бірдей болды. Мур және басқалар мұздатылған құм қалыптарындағы өткізгіштіктің өзгеру заңдылықтарын зерттеп, ірірек құм бөлшектері қалыптың жақсырақ соңғы өткізгіштігіне әкелетінін анықтады. Нагоя өнеркәсіптік технологиялар зерттеу институты қалып температурасы мен беріктігі арасындағы байланысты салыстыру үшін мұздату процесінде қалыптардағы ылғалдың динамикалық мінез-құлқын зерттеді. Олар сондай-ақ мұздатылған құю үшін қосымша байланыстырғыш ретінде ферросилиций ұнтағын пайдалану минималды деформацияға әкелетінін анықтады. Сонымен қатар, олар салқындатқыш шығынын азайтатын және қалыпты біркелкі нығайтуға мүмкіндік беретін сығып құю әдісін әзірледі. 2008 жылы С. Тада мұздатылған құм қалыптарының сығылу күшіне әсер ететін факторларды зерттеді. Мұздатылған құм қалыптарын өндіру үшін сулы ерітінділердің орнына кремний коллоидты ерітінділерін пайдалана отырып, қалыптардың тіпті еріген күйде де белгілі бір сығылу күшін сақтайтыны анықталды. 2015 жылы Шань және басқалар мұздатылған құм қалыптары үшін цифрлық шаблоны жоқ кесу әдісін ұсынды. Бұл әдіс құм қалыбына құю үшін байланыстырғыш ретінде таза суды пайдаланады, мұнда құм бөлшектері тиісті мөлшердегі сумен араластырылады және мұздатылған құм дайындамасын қалыптастыру үшін төмен температуралы ортада мұздатылады. Содан кейін мұздатылған құм қалыбы шегеруші өндіріс принциптеріне негізделген цифрлық шаблоны жоқ кесу жабдықтары арқылы пішінге келтіріледі. Лян және басқалар әртүрлі температурада әртүрлі су құрамы бар мұздатылған құм қалыптарының жылу өткізгіштігін өлшеу үшін термиялық зонд әдісін қолданды және мұздатылған құм қалыптарының жылу өткізгіштігін бағалау үшін көлемдік араластыру моделін орнатты.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мұздатылған қалыпқа құю — бұл құм қоспасы сумен мұздатылып, беріктік берілетін әдіс, ол химиялық байланыстырғыштарсыз нақты қалыптарды алуға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мұздатылған қалыпқа құю технологиясы бойынша қазіргі зерттеулер негізінен қалыптастыру процесіне және қарапайым пішінді құймалардың микроқұрылымдары мен қасиеттерін салыстыруға бағытталған. Алайда, мұздатылған қалыпқа құю процесінде әртүрлі қорытпа жүйелерімен байланысты негізгі мәселелерді шешетін жұмыстар салыстырмалы түрде аз. Көптеген эксперименттік үлгілер алюминий-кремний сериялы қорытпаларға негізделген, сонымен бірге сұйықтығы төмен және қатаю ақауларына жоғары сезімталдығы бар алюминий-мыс сериялы қорытпалар сияқты қорытпалар бойынша зерттеулер аз күйінде қалуда. Теріс қысым көмегімен құю саласындағы қазіргі зерттеулер, елімізде де, халықаралық деңгейде де, негізінен екі техникаға бағытталған: V-процесс және жоғалатын модельге құю (LGM). Жергілікті құю компаниясы біркелкі қатаюға жету үшін жоғары ағынды жылдам құюды қабылдады және нәтижесінде құю вакуум деңгейі −0,04 МПа, ұстап тұру вакуум деңгейі −0,03 МПа, ұстап тұру уақыты 15 минут және құйма изоляция уақыты 8 сағат сияқты негізгі процесс параметрлерін анықтады. Бұл тәсіл құймалардағы суық түйісу және ыстық жарылу сияқты мәселелерді түбегейлі шешті. Сентил және басқалар әртүрлі құю әдістері астында қатаю процесі және қорытпалардың мінез-құлқы бойынша салыстырмалы зерттеулер жүргізді. Олар V-процесс дәстүрлі құм қалыбына құю және қысым астында құюмен байланысты негізгі кемшіліктерді тиімді түрде жоятынын, сонымен бірге қорытпаның толтыру қабілетін арттыратынын және құймалардың бетін жақсартатынын анықтады. Гао және басқалар үлкен және орташа жартылай жабық құймаларды LGM әдісімен құюда қалыптың құлауы және қалып қабырғасының кеңеюі сияқты жалпы ақауларды шешті. Олар осы ақаулар туындайтын өндіріс кезеңдерін және олардың түпкі себептерін талдады, содан кейін тиісті жақсарту шараларын әзірледі. Тәжірибелік нәтижелер қалыпты толтыру кезінде жартылай жабық компоненттердің жоғарғы жазықтығын 45° бұрыш астында қисайту құмды жақсырақ толтыруды және нығыздауды жеңілдететінін көрсетті. Сонымен қатар, сыртқы вакуум құбырларын орнату және құю кезінде ішкі, сондай-ақ сыртқы жағынан вакуум қолдану қалып қуысының ішінде және сыртында теңдестірілген теріс қысымды қамтамасыз етеді, осылайша құймалардың сапа коэффициентін арттырады. Zhang және басқалар трактор трансмиссиясы корпусының құрылымын және LGM-нің процесс икемділігін талдады. Жүйелі зерттеу және әзірлемелер арқылы олар корпус үшін LGM процесін сәтті орнатты, бұл жалпы өндіріс шығындарын азайту үшін үлкен маңызға ие. Лян және басқалар маховик корпустары сияқты өнімдерді LGM әдісімен құюда оңай туындайтын құм күюі, газ кеуектілігі және құм жуылуы сияқты ақауларды зерттеді. Модельді жинау процесін реттеу, құю жүйесін оңтайландыру, желдету және шлак ұстағыштар тәртібін қайта жобалау және кіру орындары позициясының рационалдығын жақсарту арқылы, тәжірибелік өндіріс жағдайларымен бірге, ол тиісті өнімдердегі құю ақауларын жою шараларын ұсынды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қолданыстағы зерттеулердің көпшілігі қарапайым пішіндер мен Al-Si қорытпаларымен шектелген, бұл нәтижелерді кең қатаю интервалы бар күрделі Al-Cu қорытпаларына қолдануды қиындатады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;LGM және V-процесс бойынша қазіргі зерттеулер негізінен қалып жасау процестері мен процесс параметрлерін бақылауға бағытталған. Бұл әдістер өндіріс тиімділігін арттыру, құю дәлдігін жақсарту және шығындарды белгілі бір дәрежеде азайту сияқты артықшылықтарды ұсынады. Алайда, бірқатар күрделі шешілмеген мәселелер қалуда, бұл олардың кеңірек қолданылуын шектейді. 1950-жылдардан бері зерттеушілер интерфейс жылу беру коэффициенті (IHTC) металл қатаю кезінде температура өрісінің эволюциясына айтарлықтай әсер ететінін және осылайша құймалардың микроқұрылымы мен қасиеттеріне әсер ететінін мойындады. Oukach және басқалар температура-уақыт қисықтарын жазып алу үшін құйма және қалып ішіндегі белгіленген жерлерге терможұптарды орналастырды. Осы деректерге негізделе отырып, олар құйма/қалып интерфейсіндегі температура градиентін есептеді және h = q / (Tis - Tim) формуласы арқылы уақыт өте келе IHTC өзгеруін шығарды, бұл IHTC-нің бірінші эксперименттік анықталуын белгіледі. Han, Singh және басқалар металл қатаю процестерімен компьютерлік технологияларды біріктіріп, қатаю механизмдерін талдау және қалып/құйма интерфейсінде IHTC-нің уақытша өзгеруін зерттеу үшін Beck кері алгоритмін қолданды. Motoyama және басқалар және Woodbury және басқалар құм қалыптары мен алюминий қорытпасы құймалары арасындағы интерфейсте IHTC-ні зерттеді, оның мәндерін әртүрлі есептеу әдістері арқылы алды. Соңғы жылдары отандық ғалымдар IHTC-ні анықтау саласында айтарлықтай жетістіктерге жетті. Xu және басқалар қатаю процесіне тұтқырлық сияқты процесс факторларының әсерін зерттеді және IHTC мен тұтқырлық арасындағы байланысты талдады. Олардың нәтижелері жоғары тұтқырлық қалып/құйма интерфейсінде кеңірек ауа саңылауы қабатына әкелетінін көрсетті, бұл төменірек IHTC-ге сәйкес келеді. Көптеген зерттеу топтары, сондай-ақ Zhu және басқалар, Sui және басқалар, Zhang және басқалар, Wang және басқалар және Cao және басқалар сияқты қатаю кезінде IHTC қалай дамитыны бойынша эксперименттік талдаулар арқылы маңызды нәтижелерді ұсынды. Қазіргі уақытта IHTC-нің кері есебі құм қалыбына құю, кокильге құю және төмен қысымды құю сияқты әртүрлі құю процестеріне қолданылды. Жақында Dong және басқалар шекті айырымдар әдісін конъюгат градиент және бөлшектер тобын оңтайландыру алгоритмдерімен біріктіріп, мұздатылған құм қалыбы/ZL101 қорытпасы интерфейсінде IHTC-ні анықтады, бұл 4–5 салмақ пайыздық су мөлшері IHTC эволюция қисықтарының екі түрлі түрін келтіріп шығаратынын көрсетті; дәл сол топ A356 қатаю кезінде мұздатылған құм қалыбы-ерітінді IHTC-ні бағалау үшін кері жылу өткізгіштік моделін әзірледі, бастапқы мұздату температурасы, су мөлшері және қалыптау құмының әсерін сандық бағалады. Qiu және басқалар сақиналы алюминий құймаларының сыртқы қалыбы және ішкі өзегі үшін IHTC-нің кері моделін орнатты, бұл құйма/өзек IHTC әрқашан құйма/қалып мәнінен жоғары екенін және негізінен интерфейс саңылауымен басқарылатынын көрсетті. Сонымен бірге, Shi және басқалар мұздатылған құм қалыптары үшін криогендік градиент қалыптастыру техникасын әзірледі және маховик корпусы құймалары үшін CT8 өлшемді дәлдігіне жеткен оңтайлы формулалар терезесін (құм көлемі 106–212 мкм, су мөлшері 4–5 салмақ пайыз, мұздату температурасы −25 °C-тан төмен) анықтады. Алайда, мұздатылған құм қалыптары бойынша қолданыстағы IHTC зерттеулері Al-Si қорытпаларының атмосфералық қатаюымен шектелген; әлі де құю кезінде теріс қысымды ортаның IHTC және жылу беру мінез-құлқына әсері, сондай-ақ ZL205A сияқты кең қатаю интервалы бар Al-Cu қорытпалары бойынша зерттеулер туралы хабарланбаған. Қатаю микроқұрылымының морфологиясы мен ауқымы тікелей металл-қалып интерфейсі жылу беру қарқындылығымен басқарылғандықтан, бұл әдетте IHTC-мен сипатталады, интерфейс жылу беру және қатаю құрылымы арасындағы сандық байланыс барған сайын көбірек назар аударуда. Yang және басқалар құм қалыбына құйылған Al-5Cu-0.38Mg-0.32Mn-0.1Ag қорытпасынан жасалған цилиндр бастарына зерттеу жүргізді және позицияға тәуелді салқындату жылдамдығы тең осьті дәндерді 116 мкм-ден 62 мкм-ге дейін тазартатынын, аққыштық шектері 140-тан 159 МПа-ға дейін өзгеретінін анықтады, бұл дән өлшемі мен механикалық жұмысты анықтауда салқындату жылдамдығының доминантты рөлін растайды. Mao және басқалар Al-7Si-0.6Mg қорытпалары үшін жоғары салқындату жылдамдығы ядроланудың шамадан тыс суынуын және ядролану жылдамдығын арттыратынын, осылайша дәндерді тазартатынын және бір уақытта беріктік пен иілгіштікті жақсартатынын көрсетті. Бұл нәтижелер интерфейс жылу беруді күшейту жылуды алып тастауды жеделдететінін, қатаюдың шамадан тыс суынуын арттыратынын, дәндерді тазартатынын және газ кеуектілігін басатынын көрсетеді, бұл осы жұмыста қарастырылған «процесс-жылу-микроқұрылым-қасиет» қатынастарының механикалық негізін құрайды. Сондықтан, бұл зерттеу кең қатаю интервалы, нашар сұйықтық және көптеген қатаю мәселелерімен сипатталатын Al-Cu негізіндегі қорытпа өкілі болып табылатын ZL205A алюминий қорытпасына бағытталған.&lt;/p&gt;\n&lt;p&gt;Үш түрлі қалыптастыру әдісін қолдана отырып салыстырмалы зерттеу жүргізіледі: атмосфералық қысымда дәстүрлі шайырлы құм қалыбына құю, атмосфералық қысымда мұздатылған құм қалыбына құю және теріс қысым жағдайында мұздатылған құм қалыбына құю. Сонымен қатар, теріс қысымды мұздатылған құм қалыбына құю процесі үшін әртүрлі су құрамына және бастапқы мұздату температурасына ие құм қалыптарын қолдана отырып салыстырмалы талдау жүргізіледі. Мақсат ZL205A алюминий қорытпасының әртүрлі процестер мен мұздатылған құм қалыбы параметрлері астында қатаю мінез-құлқын және микроқұрылымы мен қасиеттерінің эволюциясын анықтау болып табылады. Бұл зерттеудің нақты мақсаттары мыналар: (1) кері жылу өткізгіштік талдауын қолдана отырып, әртүрлі қалып/қысым жағдайларында уақытқа тәуелді IHTC эволюциясын сандық анықтау; (2) IHTC көлемі, қатаю жылдамдығы, дән тазарту және кеуектілікті басу арасындағы механикалық байланысты орнату; және (3) ZL205A-ны теріс қысым астында құю үшін оңтайлы мұздатылған құм қалыбы параметрлерін (ылғал мөлшері және бастапқы мұздату температурасы) анықтау, бұл жоғары сапалы жұқа қабырғалы компоненттерді өндіруге мүмкіндік береді.&lt;/p&gt;\n&lt;p&gt;Бұл зерттеуде температураны жинау үшін 150 мм × 150 мм × 150 мм өлшемді мұздатылған құм қалыбы әзірленді. Қалып қуысы 40 мм диаметрге және 100 мм биіктікке ие болды. Температура деректері көп арналы температура жазғышы (MIK-4000D, CHN, Hangzhou Meikong Automation Technology Co., Ltd., Ханчжоу, Қытай) және жеті K-типті терможұп (Hangzhou Meikong Automation Technology Co., Ltd., Ханчжоу, Қытай) көмегімен 10 Гц жазып алу жиілігімен жинақталды. Ерітіндінің температурасын дәл өлшеуді қамтамасыз ету үшін T1 және T7 деп белгіленген екі терможұп ерітіндінің ортасына орналастырылды. Қосымша терможұптар ерітіндінің сыртқы шетінен 5 мм, 10 мм, 15 мм, 20 мм және 25 мм қашықтықта орналастырылды және сәйкесінше T2-ден T6-ға дейін белгіленді, 1-суретте көрсетілгендей. Құймадан радиалды жылу таралуын ынталандыру және осьтік жылу жоғалуын азайту үшін қалып қуысының төменгі бөлігіне жылу изоляциясы мақтасы орналастырылды. Сонымен қатар, тік бағытта термиялық изоляцияны қамтамасыз ету үшін жоғарғы бөлікке құю тостағаны және изоляция мақтасы орналастырылды. 1-сурет Мұздатылған құм қалыбы моделінде температураны жинаудың схемалық диаграммасы. (a) Құрылғының алдыңғы көрінісі. (b) Құрылғының қима көрінісі. K-типті терможұптар эксперименттерден бұрын дәл эталондық термометр (дәлдік ±0,5 °C) көмегімен −50 °C-тан 900 °C-қа дейінгі температура аралығында калибрленді; кеңейтілген өлшем белгісіздігі ±1,5 °C (k = 2) болды. Қалып ішіндегі терможұп позициялары құмды нығыздау кезінде жылжу 1-суретте көрсетілген номиналды позициялардан ±1 мм-ден аз болуын тексеру үшін мұздатылғаннан кейін құрбандық қалыбын кесу арқылы расталды. Теріс қысым көмегімен өткізілген эксперименттер үшін қысым-уақыт профилі әр эксперимент барысында калибрленген қысым өлшегіш (Anhui Zhenglan Instrument Co., Ltd., Chuzhou, Anhui, Қытай; диапазон: 0-ден −0,1 МПа-ға дейін, рұқсат: 0,001 МПа) көмегімен бақыланды. Вакуум құю және қатаю тізбегі барысында −0,03 ± 0,002 МПа деңгейінде сақталды. Қалыпты қоршап тұрған болат атқылау қабаты механикалық қолдау көрсетті және кішігірім жылу изоляциясы эффектісіне үлес қосты; алайда, барлық теріс қысым эксперименттерінде бірдей болат атқылау қабаты конфигурациясы қолданылғандықтан, оның тиімді IHTC-ге үлесі өлшенген h(t) мәндеріне енгізілген және жағдайлар арасындағы салыстырмалы талдауларға әсер етпейді. Дегенмен, болат атқылау қабаты және PE тығыздау жүйесі тек вакуум көмегімен конфигурацияда болғандықтан, олардың мүмкін болатын термиялық үлесі атмосфералық және теріс қысым жағдайлары абсолютті мәндерде салыстырылғанда осы зерттеудің шектеуі ретінде танылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;IHTC (интерфейс жылу беру коэффициенті) — бұл жылудың құймадан қалыпқа қаншалықты тиімді өтетінін көрсететін көрсеткіш; мән неғұрлым жоғары болса, салқындату соғұрлым жылдам және дәндер соғұрлым ұсақ болады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-f1.jpg\" alt=\"Мұздатылған құмды қалып моделіндегі температураны жинаудың принципті схемасы. (a) Құрылғының алдыңғы көрінісі. (b) Құрыл\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Мұздатылған құмды қалып моделіндегі температураны жинаудың принципті схемасы. (a) Құрылғының алдыңғы көрінісі. (b) Құрылғының қима көрінісі.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-f2.jpg\" alt=\"Әртүрлі технологиялық параметрлердегі фазааралық жылу беру коэффициенті.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Әртүрлі технологиялық параметрлердегі фазааралық жылу беру коэффициенті.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Әртүрлі технологиялық параметрлердегі фазааралық жылу беру коэффициенті. (a) Атмосфералық және теріс қысымдағы шайырлы құм қалыбының IHTC коэффициенті. (b) Атмосфералық құю кезіндегі әртүрлі ылғалдылығы бар мұздатылған құм қалыптарының IHTC коэффициенті. (c) Теріс қысыммен құю кезінде −40 °C-тағы әртүрлі ылғалдылығы бар мұздатылған құм қалыптарының IHTC коэффициенті. (d) Теріс қысыммен құю кезінде әртүрлі температуралардағы ылғалдылығы 6 мас.% мұздатылған құм қалыптарының IHTC коэффициенті.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-f3.jpg\" alt=\"Шайырлы құм қалыптарын қолданатын әртүрлі құю процестеріне арналған температуралық қисықтарды салыстыру. (a) Атмосфералы\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Шайырлы құм қалыптарын қолданатын әртүрлі құю процестеріне арналған температуралық қисықтарды салыстыру. (a) Атмосфералық қысыммен құю. (b) Теріс қысыммен құю.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-f4.jpg\" alt=\"Әртүрлі параметрлері бар мұздатылған құм қалыптарын атмосфералық қысыммен құюдың температураны өлшеу қисықтарын салыстыр\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Әртүрлі параметрлері бар мұздатылған құм қалыптарын атмосфералық қысыммен құюдың температураны өлшеу қисықтарын салыстыру.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Әртүрлі параметрлері бар мұздатылған құм қалыптарын атмосфералық қысыммен құюдың температураны өлшеу қисықтарын салыстыру. (a) Су мөлшері 2 мас.%, бастапқы мұздату температурасы −40 °C. (b) Су мөлшері 4 мас.%, бастапқы мұздату температурасы −40 °C. (c) Су мөлшері 6 мас.%, бастапқы мұздату температурасы −40 °C.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-f5.jpg\" alt=\"Әртүрлі параметрлері бар мұздатылған құм қалыптарын теріс қысыммен құюдың температураны өлшеу қисықтары.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Әртүрлі параметрлері бар мұздатылған құм қалыптарын теріс қысыммен құюдың температураны өлшеу қисықтары.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Әртүрлі параметрлері бар мұздатылған құм қалыптарын теріс қысыммен құюдың температураны өлшеу қисықтары. (a) Су мөлшері 2 мас.%, бастапқы мұздату температурасы −20 °C. (b) Су мөлшері 4 мас.%, бастапқы мұздату температурасы −20 °C. (c) Су мөлшері 6 мас.%, бастапқы мұздату температурасы −20 °C. (d) Су мөлшері 2 мас.%, бастапқы мұздату температурасы −30 °C. (e) Ылғалдылығы 4 мас.%, бастапқы мұздату температурасы −30 °C. (f) Ылғалдылығы 6 мас.%, бастапқы мұздату температурасы −30 °C. (g) Су мөлшері 2 мас.%, бастапқы мұздату температурасы −40 °C. (h) Су мөлшері 4 мас.%, бастапқы мұздату температурасы −40 °C. (i) Су мөлшері 6 мас.%, бастапқы мұздату температурасы −40 °C.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-f6.jpg\" alt=\"Әртүрлі құю процестерінің микроқұрылымы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Әртүрлі құю процестерінің микроқұрылымы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Әртүрлі құю процестерінің микроқұрылымы. (a) Шайырлы құм қалыбында қалыпты қысыммен құю; (b) шайырлы құм қалыбында теріс қысыммен құю; (c) 6 салмақ % ылғалдылығы бар, −40 °C мұздатылған құм қалыбында қалыпты қысыммен құю; (d) 6 салмақ % ылғалдылығы бар, −40 °C мұздатылған құм қалыбында теріс қысыммен құю; (e) 6 салмақ % ылғалдылығы бар, −20 °C мұздатылған құм қалыбында теріс қысыммен құю; (f) 6 салмақ % ылғалдылығы бар, −30 °C мұздатылған құм қалыбында теріс қысыммен құю; (g) 4 салмақ % ылғалдылығы бар, −40 °C мұздатылған құм қалыбында теріс қысыммен құю; (h) 2 салмақ % ылғалдылығы бар, −40 °C мұздатылған құм қалыбында теріс қысыммен құю.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-f7.jpg\" alt=\"Әртүрлі технологиялық жағдайлардағы қорытпаның механикалық қасиеттері\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Әртүрлі технологиялық жағдайлардағы қорытпаның механикалық қасиеттері&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Әртүрлі технологиялық жағдайлардағы қорытпаның механикалық қасиеттері: (a) құйылған күйдегі созылу беріктігі; (b) құйылған күйдегі салыстырмалы ұзаруы; (c) термиялық өңдеуден кейінгі созылу беріктігі; (d) термиялық өңдеуден кейінгі салыстырмалы ұзаруы. (Ескертпе: 1 шайырлы құм, атмосфералық қысым; 2 шайырлы құм және теріс қысым; 3 6 салмақ %, −40 °C мұздату температурасы және атмосфералық қысым; 4 6 салмақ %, −40 °C мұздату температурасы және теріс қысыммен құюды білдіреді).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-f8.jpg\" alt=\"Әртүрлі процестер арқылы алынған құймалардың созылу кезіндегі сыну беттерінің сканерлеу фотосуреттері.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Әртүрлі процестер арқылы алынған құймалардың созылу кезіндегі сыну беттерінің сканерлеу фотосуреттері.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Әртүрлі процестер арқылы алынған құймалардың созылу кезіндегі сыну беттерінің сканерлеу фотосуреттері. (a) Шайырлы құм қалыбында гравитациялық құю; (b) шайырлы құм қалыбында теріс қысыммен құю; (c) 6 салмақ % ылғалдылығы бар, −40 °C мұздатылған құм қалыбында гравитациялық құю; (d) 6 салмақ % ылғалдылығы бар, −40 °C мұздатылған құм қалыбында теріс қысыммен құю; (e) 6 салмақ % ылғалдылығы бар, −20 °C мұздатылған құм қалыбында теріс қысыммен құю; (f) 6 салмақ % ылғалдылығы бар, −30 °C мұздатылған құм қалыбында теріс қысыммен құю; (g) 4 салмақ % ылғалдылығы бар, −40 °C мұздатылған құм қалыбында теріс қысыммен құю; (h) 2 салмақ % ылғалдылығы бар, −40 °C мұздатылған құм қалыбында теріс қысыммен құю.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-f9.jpg\" alt=\"Термиялық өңдеу процестерінен кейінгі созылу кезіндегі сыну беттерінің сканерлеу микрофотографиялары.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Термиялық өңдеу процестерінен кейінгі созылу кезіндегі сыну беттерінің сканерлеу микрофотографиялары.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Термиялық өңдеу процестерінен кейінгі созылу кезіндегі сыну беттерінің сканерлеу микрофотографиялары. (a) Шайырлы құм қалыбында атмосфералық қысыммен құю; (b) шайырлы құм қалыбында теріс қысыммен құю; (c) 6 салмақ % ылғалдылығы бар, −40 °C мұздатылған құм қалыбында атмосфералық қысыммен құю; (d) 6 салмақ % ылғалдылығы бар, −40 °C мұздатылған құм қалыбында теріс қысыммен құю; (e) 6 салмақ % ылғалдылығы бар, −20 °C мұздатылған құм қалыбында теріс қысыммен құю; (f) 6 салмақ % ылғалдылығы бар, −30 °C мұздатылған құм қалыбында теріс қысыммен құю; (g) 4 салмақ % ылғалдылығы бар, −40 °C мұздатылған құм қалыбында теріс қысыммен құю; (h) 2 салмақ % ылғалдылығы бар, −40 °C мұздатылған құм қалыбында теріс қысыммен құю.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-f10.jpg\" alt=\"Әртүрлі технологиялық жағдайлардағы қорытпалардың механикалық қасиеттері. (a) Құйылған күйдегі созылу беріктігі; (b) құй\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Әртүрлі технологиялық жағдайлардағы қорытпалардың механикалық қасиеттері. (a) Құйылған күйдегі созылу беріктігі; (b) құйылған күйдегі салыстырмалы ұзаруы; (c) термиялық өңдеуден кейінгі созылу беріктігі; (d) термиялық өңдеуден кейінгі салыстырмалы ұзаруы. (Ескертпе: 1 6 салмақ %, −20 °C; 2 6 салмақ %, −30 °C; 3 6 салмақ %, −40 °C; 4 4 салмақ %, −40 °C; 5 2 салмақ %, −40 °C; барлығы теріс қысыммен құю кезінде).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-f11.jpg\" alt=\"Сурет 11\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 11&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-f12.jpg\" alt=\"Сурет 12\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 12&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-f13.jpg\" alt=\"Сурет 13\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 13&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ZL205A&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қорытпасындағы&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;құю ақаулары&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Мұздатылған&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қалыпта&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;вакуумды құю&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;IHTC өсуі және&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;түйіршіктердің&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ұсақталуы&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Жұқа қабырғалы&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сапалы&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;құймалар&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мақала рецензияланатын Materials (Basel, Switzerland) журналында жарияланған. Бірақ бұл да бір зерттеу ғана, түпкілікті қорытынды емес.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Materials (Basel, Switzerland) (Europe PMC)&lt;/td&gt;\n&lt;td&gt;steels&lt;/td&gt;\n&lt;td&gt;CC BY 4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторлар: Luo L, Luo C, Lv Q, Liang X, Wang L, Su Y, Guo J, Mi F, Chen C, Wang B.&lt;/p&gt;\n&lt;h3 id=\"derekkoezder\"&gt;&lt;a href=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;stron
