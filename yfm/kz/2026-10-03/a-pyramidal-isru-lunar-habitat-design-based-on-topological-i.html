        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"101\" cy=\"91\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"519\" cy=\"227\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · FEM_METHODS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Реголиттен ай базасы: желім&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;мен бұрандаларсыз&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;пирамидалық архитектура&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/a-pyramidal-isru-lunar-habitat-design-based-on-topological-i-f1.jpg\" alt=\"Сурет 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Айға құрылыс материалдарын жеткізу өте қымбат, сондықтан зерттеушілер жергілікті ресурстарға сүйенеді. Жаңа тұжырымдама тек өз геометриясы арқылы ұсталатын бірдей блоктардан пирамидалық күмбездер тұрғызуды ұсынады. Шекті элементтер әдісі (FEM) арқылы жүргізілген талдау құрылымның жекелеген блоктар жоғалған кезде де тұрақтылығын сақтайтынын растады.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-03/a-pyramidal-isru-lunar-habitat-design-based-on-topological-i.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Топологиялық ілінісу желім мен бекіткіштерге деген қажеттілікті жояды.&lt;/li&gt;\n&lt;li&gt;Drucker-Prager моделі блоктар жоғалған кезде де тұрақтылықты растады.&lt;/li&gt;\n&lt;li&gt;Пирамидалық пішін блоктар геометриясын өзгертпей базаны кеңейтуге мүмкіндік береді.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-03/a-pyramidal-isru-lunar-habitat-design-based-on-topological-i.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Кернеу-деформациялық күйді модельдеу үшін авторлар Drucker-Prager моделін қолданды. Бұл модель ішкі үйкелісі бар материалдардың, мысалы, пісірілген ай реголитінің мінез-құлқын сипаттайды. Мизестің классикалық пластикалық теориясынан айырмашылығы, бұл модель аққыштық шегінің гидростатикалық қысымға тәуелділігін ескереді, бұл кеуекті керамика үшін өте маңызды.&lt;/p&gt;\n&lt;p&gt;Шаршы негізді пирамида геометриясы (қабырға ұзындығы 7,5 м) пайдаланылмайтын орынды азайту және масштабталуды қамтамасыз ету үшін таңдалды. Шекті элементтер талдауында блоктар топологиялық ілініскен қатты денелер ретінде қарастырылды, мұнда кез келген элементтің қабатқа қатысты қалыпты бағыттағы ығысуы көршілес блоктармен кинематикалық түрде шектелген. Симуляция нәтижелері құрылымның жоғары артықтыққа ие екенін көрсетті: бір немесе бірнеше блоктың болмауы бүкіл қабықтың құлауына әкелмейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу теориялық сипатта және пісірілген реголиттің сынғыштығына циклдік температуралық жүктемелердің әсерін ескермейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-03/a-pyramidal-isru-lunar-habitat-design-based-on-topological-i.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Бұл жұмыста құрылыс блоктарының топологиялық ілінісуіне негізделген ай тұрғын үй кешенінің жаңа тұжырымдамасы ұсынылады. Жоба байланыстырғыш заттарсыз немесе механикалық бекіткіштерсіз бір-біріне бекитін блоктар геометриясын біріктіріп, пирамида пішіндес тұрақты құрылымды қалыптастырады. Бұл тәсіл жергілікті ресурстарды пайдалану (ISRU) негізінде ғарышта құрылыс жүргізу үшін өте қолайлы. Друкер-Прагер пластикалық моделін қолдану арқылы жүргізілген шекті элементтер талдауы ай реголитінен жасалған мұндай құрылыстардың жоғары төзімділікке ие екенін көрсетті: олар жергілікті зақымданулар немесе жекелеген блоктардың жетіспеушілігі кезінде де өз тұтастығын сақтайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Топологиялық ілінісу тұжырымдамасы қосымша бекіткіштерсіз реголиттен тұрақты ай базаларын салуға мүмкіндік береді және құрылымның ақауларға төзімділігін қамтамасыз етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Айға адамның аяқ басуы және Artemis, Moon Village мен Халықаралық ай зерттеу станциясы сияқты бағдарламалардың дамуымен құрылыс мәселелері өзекті бола бастады. Жерден материал тасымалдаудың жоғары құны ай реголитін пайдалануды жалғыз тиімді шешімге айналдырады. Синтерленген (пісірілген) реголит механикалық қасиеттері бойынша кеуекті керамикаға жақын және оны өңдеу үшін күн энергиясын пайдалануға болады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ISRU (In Situ Resource Utilization) — бұл ғарыштық миссиялардың логистикалық шығындарын азайту үшін аспан денелеріндегі жергілікті ресурстарды пайдалану стратегиясы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Модульдік құрылыс әдісі автоматтандырылған құрастыру, базаны кеңейту және материалдарды қайта өңдеу үшін ең тиімді болып табылады. Сондай-ақ, модульділік синтерленген реголиттің морттығын жұмсартуға көмектеседі. Авторлар жүйе тиімділігін арттыру үшін блок түрлерін барынша азайту және олардың өлшемдерін монтаждау үшін ыңғайлы етіп оңтайландыру қажеттігін атап өтеді.&lt;/p&gt;\n&lt;p&gt;Жердегі модульдік құрылыста желімдер, ерітінділер немесе жалғағыштар қолданылады. Айдағы өте төмен атмосфералық қысым желімдердің қатаюына кедергі келтіреді, ал судың тапшылығы ерітінді дайындауды мүмкін етпейді. Сонымен қатар, желімделген қосылыстардың сенімділігіне кепілдік жоқ, өйткені оларды бұзбай тексеру мүмкін емес, ал механикалық жалғағыштар кернеу шоғырлануын тудырып, құрылымның тұтастығын бұзады.&lt;/p&gt;\n&lt;p&gt;Балама ретінде топологиялық ілінісу (topological interlocking) тұжырымдамасы ұсынылады, мұнда блоктар байланыстырғыштарсыз, тек өз геометриясы мен өзара орналасуы арқылы ұсталады. Көптеген шешімдер жазық құрылымдарға бағытталғанымен, Ай базалары үшін үш өлшемді пішіндер қажет. Күмбезді қабықшаларды қолданғанда Гаусс теоремасына (Theorema egregium) сәйкес, жазық торды сфералық бетке көшіру блоктардың пішінінің бұрмалануына әкеледі және әртүрлі блоктарды талап етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ай модулі үшін пирамидалық геометрия ұсынылды, ол бірдей блоктардан тұрады, байланыстырғыштарды қажет етпейді және геометриялық бұрмалану мәселесін шешеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторлар қырлары тең қабырғалы үшбұрыштардан тұратын және бірдей блоктардың моноқабатымен қапталған пирамидалық пішінді ұсынады. Бұл пішін ішкі қысым мен гравитация күштерін тиімді бөледі. Мұндай жүйеде кез келген блоктың қабатқа қатысты қалыпты бағыттағы ығысуы көршілес блоктар арқылы кинематикалық түрде шектеледі. Құрылымның механикалық тұрақтылығы блоктардың зақымдануын ескеретін шекті элементтер әдісі (FE) арқылы расталды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Топологиялық ілінісу — бұл бөлшектердің геометриялық пішіні арқылы бір-бірін блоктайтын, желім немесе болттарсыз тұрақтылықты қамтамасыз ететін құрастыру әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Негізгі мақсат — астронавттардың өмір сүруі мен жұмыс істеуі үшін басқарылатын ортаны қамтамасыз ететін, қысым астындағы толық жабық көлемді жасау. Ішкі қысымды қолдану қосымша қорғаныссыз стандартты жабдықтарды пайдалануға мүмкіндік береді, бұл Айға тасымалданатын материалдардың массасын азайтады. Тұрғын модульдің дизайны екі негізгі жүктеменің: ішкі қысым (беттерге перпендикуляр) және гравитация (төмен қарай) өзара әрекеттесуіне негізделеді. Дәстүрлі тік қабырғалы құрылымдарда ішкі қысым гравитациямен өтелмейтін жүктемені тудырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қабықшалы құрылымдарды қолдану жүктемелерді иілу моменттерінсіз, тек мембраналық күштер арқылы қабылдауға мүмкіндік береді, бұл герметикалық модульдер үшін өте тиімді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мембраналық күштер — бұл қабықша жазықтығында әсер ететін ішкі күштер, олар құрылымның иілусіз жұмыс істеуін қамтамасыз етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сфераны қаптау үшін Платон денелерін пайдалану блоктар санын қатаң бекітеді, бұл модульді кеңейтуге мүмкіндік бермейді. Голдберг көпжақтарына негізделген геодезиялық күмбездер де масштабтау кезінде шектеулерге ие. Кеңейтілуі мүмкін жүйені жасау үшін авторлар икосаэдр негізіндегі геометрияны таңдады. Негіз ретінде қабырғасы шамамен 7,5 м болатын шаршы табанды пирамида таңдалды, себебі ол үшбұрышты пирамиданың артық биіктігі мен бесбұрышты пирамиданың пайдасыз аудандары арасындағы тепе-теңдікті қамтамасыз етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Таңдалған пирамида геометриясы герметикалықты қамтамасыз ету үшін ішкі газ өткізбейтін мембрананы талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл тәсілдің басты артықшылығы — масштабтау мүмкіндігі: бірдей блоктарды қосу немесе алып тастау арқылы әртүрлі өлшемдегі пирамидаларды жинауға болады. Сондай-ақ, топологиялық байланыс жүйенің артықтығын (redundancy) қамтамасыз етеді: бір блок зақымданған жағдайда (мысалы, микрометеорит әсерінен) құрылымның жалпы тұтастығы сақталады.&lt;/p&gt;\n&lt;p&gt;Блок геометриясы пирамида қырларын құрастыру үшін әзірленген, тасымалдау ыңғайлылығы үшін максималды өлшемі 1 м деп белгіленген. Конструкция топологиялық ілінісу принципіне негізделген, бұл элементтерді өндірістік жабдықтар немесе роботтардың мүмкіндіктеріне бейімдеуге мүмкіндік береді. Негізгі бірлік ретінде p6 кристаллографиялық тобының іргелі аймағы болып табылатын тең қабырғалы F үшбұрышы алынған. Бұл топ үшбұрышты төбелері айналасында 120° бұру арқылы жазықтықты бос орынсыз толтыруға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Іргелі аймақ — бұл жазықтықты ешқандай бос орынсыз толық жабатын минималды геометриялық элемент.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Күрделі ілінісу геометриясын алу үшін үшбұрыш қабырғалары төрт тең сегментке бөлінеді. Екі сыртқы бөліну нүктесі қабырғаға перпендикуляр бағытта 120 мм-ге ығыстырылады: біреуі ішке, екіншісі сыртқа. p6 симметриясын сақтау және қабаттасуды болдырмау үшін модификация үшбұрыштың барлық үш қабырғасына қолданылады (1-сурет). Блок әрқайсысы 200 мм қашықтықта орналасқан үш параллель жазықтық арасында интерполяция жасау арқылы құралады. Үш қабатты пайдалану және төбелерді ығыстыру бағыттарын алмастыру арқылы жалпы қалыңдығы 400 мм болатын «қос теңіз жұлдызы» (double-Starfish block) блогы жасалады (2-сурет). Конструкция бос орынсыз тығыз орналасуды қамтамасыз етеді, оның оң қатаңдығы алдыңғы зерттеулерде 120 мм деформация конфигурациялары үшін расталған.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;p6 тобы бойынша қабырғаларды модификациялау және үш қабатты құрылымды қолдану 400 мм қалыңдықтағы оң қатаңдыққа ие өзіндік ілінісуші блокты жасауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Блоктардан жиналған төрт тең қабырғалы үшбұрыш қырлары дұрыс октаэдрдің жоғарғы бөлігін құрайтын пирамиданы түзеді. Бұл мысалда қырдың негізі 9 блоктан тұрады, яғни әр қырда барлығы 81 блок бар. Қырлар сыртқы жазықтықтарға қатысты нормальдар бойымен ығыстырыла отырып біріктіріледі, бұл көршілес қырлар арасында байланыс болмауын қамтамасыз етеді және екі іштей орналасқан пирамиданы түзеді (3-сурет).&lt;/p&gt;\n&lt;p&gt;Топологиялық ілінісу перифериялық элементтердің (төменгі қатар, қырлар, шыңы) бекітілген болуын талап етеді. Төменгі қатарды топыраққа бекітуге болатынымен, қырлар мен шыңы еркін қалады. Конструкцияның құрылымдық тұтастығын тексеру үшін Ай жағдайларына сәйкес параметрлермен шекті элементтер (FE) симуляциялары өткізілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель қатты бекітілмеген перифериялық блоктардың ілінісу геометриясы есебінен конструкция тұрақтылығын сақтап қалатынын болжайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Шекті элементтер талдауы үшін Abaqus 2024 Explicit бағдарламасы және Друкер-Прагер пластикалық моделі қолданылды. Есеп статикалық болғанымен, блоктар арасындағы көптеген түйісулерге байланысты есептеу тұрақтылығын қамтамасыз ету үшін Explicit әдісі таңдалды. Модельдеу 2 секундқа созылды, жүктемелер «smooth step» функциясы арқылы біртіндеп түсірілді. Жүйе тепе-теңдігі ішкі энергияның кинетикалық энергиядан айтарлықтай жоғары болуымен расталды. 361 блоктан тұратын жинақ Fusion 360 бағдарламасында жобаланды. Блоктардың өзара әрекеттесуі «hard contact» және үйкеліссіз модельденді, бұл топологиялық байланысқан жүйелер үшін қолайлы.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Explicit әдісі — бұл күрделі түйісу есептерінде есептеу тұрақтылығын сақтау үшін уақыт бойынша кезең-кезеңімен есептейтін алгоритм.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Модельдеуде Ай гравитациясы (1,62  м/с²) және атмосфералық қысымның жоқтығы ескерілді. Модуль ішіндегі қысым 81 060  Па (шамамен 0,8 атм) деп белгіленді, бұл ұшақ салонындағы жағдайға сәйкес келеді. Радиациядан қорғау және конструкцияны тұрақтандыру үшін сыртқы бетке 0,15  Н/мм² қысым түсіретін реголит қабаты қосылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Негізгі параметрлер: гравитация 1,62  м/с², ішкі қысым 81 060  Па және сыртқы реголит жүктемесі 0,15  Н/мм².&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Синтерленген реголит блоктары үшін 15  ГПа Юнг модулі, 0,17 Пуассон коэффициенті және 1,5  г/см³ тығыздық қабылданды. Морт сынуды модельдеу үшін Друкер-Прагер моделі (үйкеліс бұрышы 58,5^°, дилатансия бұрышы 0^°, созылудағы аққыштық шегі 5  МПа) қолданылды. Сәтсіздік критерийлері: жалпы құрылымдық тұтастықтың жойылуы және жеке блоктардың жергілікті сынуы. Python скрипті арқылы блоктардың қалған бөлігі өзара байланысу қабілетін сақтап қалуы тексеріледі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель материалдың морт сынуына негізделген; блоктардың жергілікті бөліктерінің сынуы, егер жалпы геометрия жүк көтеру қабілетін сақтаса, қабылданады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-10-03/a-pyramidal-isru-lunar-habitat-design-based-on-topological-i.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;h4 id=\"naetizhelerdi-talkhylau\"&gt;&lt;a href=\"2026-10-03/a-pyramidal-isru-lunar-habitat-design-based-on-topological-i.html#naetizhelerdi-talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелерді талқылау&lt;/span&gt;&lt;/a&gt;Нәтижелерді талқылау&lt;/h4&gt;\n&lt;p&gt;Бұл жұмыста үш түрлі блоктан тұратын топологиялық байланысқан (TIA) құрастырма негізінде модульдік геометрия әзірленді. Бұл құрылым көлемді кеңейтуге және пайдалануға жарамды ішкі кеңістік жасауға мүмкіндік береді. Біз құрылымның Ай ортасы жағдайындағы мінез-құлқын толық жинақталған күйде де, бір блок алынып тасталған конфигурацияларда да бағаладық. Зерттеу көрсеткендей, топологиялық ілмекті жүйе негізінде Ай мекенжайын жасау техникалық тұрғыдан орынды және құрылым жекелеген элементтер жоғалған кезде де өз тұтастығын сақтайды. Бұл TIA-ның негізгі артықшылығы — жергілікті зақымдануларға төзімділігін растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Топологиялық байланысқан құрылымдар жоғары өміршеңдікке ие, жекелеген модульдер жоғалған кезде де жүк көтергіштігін сақтайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ұсынылған құрылыс әдісі жергілікті ресурстарды пайдалану (ISRU) есебінен құрылым массасын оңтайландыруға мүмкіндік береді. Барлық материалдарды Жерден тасымалдауды талап ететін дәстүрлі тәсілдерден айырмашылығы, біздің әдіс негізгі материал ретінде Ай реголитін пайдалануға мүмкіндік береді. Алайда, жұмыс бірқатар болжамдарға негізделген, ең алдымен, жердегі аналогтардан өзгеше болуы мүмкін синтезделген реголиттің қасиеттеріне қатысты. Сонымен қатар, ағымдағы модель шлюздер мен кіру-шығу жүйелерін ескермейді, олар Жерден жеткізілуі тиіс.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ISRU (In-Situ Resource Utilization) — құрылыс материалдарын тікелей сол жерде өндіру үшін жергілікті ресурстарды (мысалы, Ай топырағын) пайдалану тұжырымдамасы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Құрылымның герметикалығын қамтамасыз ету үшін қосымша мембрананы пайдалану қажет, өйткені TIA блоктары арасындағы саңылаулар, әсіресе жүктеме астында, газ өткізбеушілікті қамтамасыз етпейді. Мұндай жүйелердің герметикалығы мәселелері әлі жеткіліксіз зерттелген және болашақ зерттеулерді талап етеді. Сондай-ақ, ағымдағы геометрия базалық болып табылады; блок параметрлерін Ай ортасының нақты талаптарына бейімдеу сипаттамаларды айтарлықтай жақсартуы мүмкін. Жалпы алғанда, сандық модельдеу TIA-құрылымдары ішкі қысым жүктемелерін тиімді бөлетінін және синтезделген реголит сияқты сынғыш материалдарды пайдалануға мүмкіндік беретінін растады.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/a-pyramidal-isru-lunar-habitat-design-based-on-topological-i-f1.jpg\" alt=\"Сурет 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src
