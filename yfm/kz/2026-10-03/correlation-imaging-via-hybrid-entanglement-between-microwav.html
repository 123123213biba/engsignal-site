        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"101\" cy=\"103\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"639\" cy=\"200\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · DYNAMICS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Кванттық оптика: макро-&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;нысандарды чип өлшеміне&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;дейін сығу&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/correlation-imaging-via-hybrid-entanglement-between-microwav-f2.jpg\" alt=\"Сурет 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Зерттеушілер фотондар мен беттік акустикалық фонондар арасындағы гибридті кванттық байланысқа негізделген корреляциялық бейнелеу әдісін ұсынды. Бұл бөлшектердің толқын ұзындығы бес реттік шамаға ерекшеленеді, бұл макроскопиялық нысандарды микроскопиялық чиптермен тиімді байланыстыруға мүмкіндік береді. Жүйе 10⁻⁸-ден 10⁶-ға дейінгі диапазонда кескін масштабын өзгертетін кванттық микроскоп ретінде жұмыс істейді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-03/correlation-imaging-via-hybrid-entanglement-between-microwav.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Фотон мен фонон толқын ұзындығының 10⁵ есе айырмашылығы классикалық оптика шектеулерін жеңеді.&lt;/li&gt;\n&lt;li&gt;Кескінді 10⁶ есеге дейін масштабтау макро-нысандарды микрочиптерге проекциялауға мүмкіндік береді.&lt;/li&gt;\n&lt;li&gt;3.9×10³ жұп/(с·Вт·Гц) жарықтығы реконструкцияның жоғары дәлдігін қамтамасыз етеді.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-03/correlation-imaging-via-hybrid-entanglement-between-microwav.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Жүйенің негізінде параметрлік жиілікті түрлендіру үшін сызықтық емес элемент ретінде жұмыс істейтін асқын өткізгіш кванттық тізбек (SQC) жатыр. ω_a + ω_b = ω_p шарты орындалғанда, шатасқан фотон-фонон жұптары түзіледі. Өзара әрекеттесудің тиімді гамильтонианы H = Σ G_j (a†_j b†_j + H.c.) түрінде сипатталады, мұндағы G_j — SNAIL компоненті қамтамасыз ететін байланыс константасы. Фотондар мен фонондардың таралу жылдамдығындағы 10⁵ есе айырмашылық кросс-масштабты визуализация үшін бірегей ресурс жасайды.&lt;/p&gt;\n&lt;p&gt;Нысанның кеңістіктік профилін реконструкциялау үшін фотон-фонон сәйкестігін өлшеу арқылы алынатын G⁽²⁾(x_a,d, x_b,d) екінші реттік корреляция функциясы қолданылады. K± нүктелік шашырау функциясы проекция масштабын анықтайды: M⁻ = (λ_b * z_b,sd) / (λ_a * z_a,so) демагнификация үшін және M⁺ = (λ_a * z_a,sd) / (λ_b * z_b,so) магнификация үшін. Жұптардың түзілу жарықтығы B_pair шамамен 3.9×10³ жұп/(с·Вт·Гц) құрайды, бұл деректерді сенімді тіркеуге жеткілікті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әдіс жұптардың түзілу тиімділігімен және дереккөз апертураларының шектеулі өлшемімен шектелген.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-03/correlation-imaging-via-hybrid-entanglement-between-microwav.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Бұл жұмыста асқын өткізгіш кванттық схема арқылы генерацияланатын микротолқынды фотондар мен беттік акустикалық толқын (БАТ) фонондары арасындағы гибридті шатасуға негізделген кванттық корреляциялық визуализация әдісі ұсынылған. Негізгі идея — фотондар мен фонондардың толқын ұзындықтарының бес реттік айырмашылығын пайдалану. Бұл кванттық шатасу ресурсы объектіні зондтау және ақпаратты оқу үшін әртүрлі өрістерді таңдауға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әдіс ауқымды түрлендіруге мүмкіндік береді: макро-объектілердің профильдерін микрочиптерге проекциялау кезінде 10⁻⁸–10⁻⁶ есе кішірейту немесе микро-объектілерді макроскопиялық фотондық құрылғылармен оқу кезінде 10⁴–10⁶ есе үлкейту.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Дәстүрлі визуализация әдістері зондтау және оқу үшін бірдей толқын ұзындығындағы өрістерді талап етеді, бұл көбінесе практикалық шектеулерге әкеледі. Ұсынылған тәсіл осы мәселені гибридті шатасу арқылы шешеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Асқын өткізгіш кванттық схема (SQC) — бұл ω_p жиілігінде айдау (pump) арқылы параметрлік түрленуді қамтамасыз ететін және шатасқан күйлерді генерациялайтын сызықтық емес элемент.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Әдіснама асқын өткізгіш кванттық схеманы (мысалы, SNAIL) фотондар үшін тарату желісінің антеннасымен және фонондар үшін IDT (interdigital transducer) түрлендіргішімен байланыстыруға негізделген. 1-суретте көрсетілгендей, схеманы ω_p жиілігінде айдау арқылы фотондар мен фонондар арасында шатасу пайда болады. Бұл жүйенің когеренттілігін сақтай отырып, әртүрлі кеңістіктік масштабтар арасында ақпарат алмасуды қамтамасыз етеді.&lt;/p&gt;\n&lt;p&gt;Кескінді қалыптастыру процесі K^± нүктелік шашырау функцияларымен анықталады, олар нысан жазықтығын (x_o) детектор жазықтықтарымен байланыстырады. Идеал жағдайда бұл функциялар Дирак дельта-функцияларына жақындаса, нақты жүйелерде олардың апертураға, толқын ұзындықтарына және таралу қашықтығына байланысты шекті ені болады. Геометриялық масштабтау коэффициенттері M^± фотондар мен фонондардың толқын ұзындықтарының айырмашылығы (~ 10⁵) және таралу жолдарының қатынасымен анықталады. Бұл макроскопиялық нысандарды микроскопиялық чиптерге сығуға (демагнификация M⁻ ~eq 2 × 10⁻⁸ - 5 × 10⁻⁶) немесе микроскопиялық бөлшектерді макроскопиялық оқу жүйелеріне үлкейтуге (магнификация M⁺ ~eq 1 × 10⁴ - 1 × 10⁶) мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;M^± масштабтау коэффициенттері кеңістіктік ақпаратты бес ретке дейінгі айырмашылығы бар ауқымдар арасында тасымалдауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жүйенің ажыратымдылығы δ x^± дифракциялық кеңеюмен шектелген. Демагнификация үшін (za,so ~eq 0.05 - 1 м және Lb,s ~eq 3 - 5 мм) ажыратымдылық δ x⁻ ~eq 0.5 - 17 мкм, ал магнификация үшін (zb,so ~eq 0.5 - 10 см) δ x⁺ ~eq 1 - 30 мкм құрайды. Реконструкция сапасы (контраст Rv,±) саңылаулардың ені мен олардың арақашықтығына байланысты; Rv,± &amp;lt; 0.15 болғанда сигнал нысан профилін қалпына келтіру үшін жеткіліксіз болады. Квазимонохроматтық жуықтау — бұл жеңілдетілген модель, ал фотон-фонон жұптарының шекті өткізу қабілеті жиілікке тәуелді корреляцияны тудырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Контраст (visibility) — корреляциялық сигналдың шуыл фонынан қаншалықты анық бөлініп тұратынын көрсететін параметр.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл әдістің шектеулерін NOON-күйлері (толқын астындағы ажыратымдылық үшін) немесе Фок күйлері (контрастты арттыру үшін) сияқты күрделі кванттық күйлер арқылы жеңуге болады. Асқын өткізгіш кванттық схемалардың (SQC) икемділігі микротолқынды фотондарды, беттік акустикалық фонондарды және оптикалық фотондарды байланыстыратын гибридті күйлерді синтездеуге мүмкіндік береді. Жүйенің жұмысы үшін жылулық шуылдарды басу мақсатында 10–20 мК температура (ерітінді тоңазытқыштарында) қажет. Көлденең импульстің сақталуы SQC-ді антенналармен және IDT (өзара түрлендіргіштермен) байланыстыру арқылы қамтамасыз етіледі. Өлшеу процесі Джозефсон ауысу детекторлары мен кубиттер арқылы дисперсиялық оқуды талап етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Экспериментті жүзеге асыру жоғары дәлдіктегі нанопозициялауды және антенналық массивтерді интеграциялауды талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл бөлімде аса өткізгіш кубиттер мен беттік акустикалық толқындар (БАТ) фонондарының гибридті жүйесі негізіндегі кросс-масштабты корреляциялық визуализация (фантомды кескіндеу) әдісінің теориялық негіздемесі мен сандық модельдеу нәтижелері қорытындыланады. Ұсынылған тұжырымдама классикалық дифракциялық шекті еңсеруге және қатты денелі құрылымдардағы микродефектілерді жоғары ажыратылымдықпен бұзбай бақылауды жүзеге асыруға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Ұсынылған кросс-масштабты корреляциялық визуализация әдісі өзара шырмалған «фотон-фонон» жұптарын қолдану есебінен, зондтаушы сәулеленудің толқын ұзындығы 10⁻² м болғанда, өлшемі 10⁻⁶ м ретіндегі дефектілерді толқын астылық ажыратылымдықпен кескіндеуді қамтамасыз етеді және классикалық шектен төрт ретке асып түседі.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Әдістің физикалық негізі аса өткізгіш кубит (трансмон немесе ағындық кубит) [41, 42] және біріктірілген микротолқынды резонатор мен акустикалық БАТ-резонатордан [15] тұратын гибридті контурда күшті корреляцияланған кванттық күйлерді генерациялауға сүйенеді. Мұндай жүйедегі үш толқынды араласу [38, 39] немесе параметрік ыдырау процесінде жиілігі ω_e ≈ 2π × 5 ГГц микротолқынды фотон мен жиілігі ω_p ≈ 2π × 5 ГГц акустикалық фонон жұптары түзіледі. Жиіліктері жақын болғанымен, толқын ұзындықтары электромагниттік толқындардың толқынжолғыштағы жылдамдығы (v_e ≈ 10⁸ м/с) мен акустикалық толқындардың пьезоэлектриктегі жылдамдығы (v_p ≈ 3000 м/с) арасындағы орасан зор айырмашылыққа байланысты бес ретке ерекшеленеді. Микротолқын ұзындығы λ_e ≈ 6 см құраса, акустикалық толқын ұзындығы бары-жоғы λ_p ≈ 600 нм тең болады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Фантомды визуализация (ghost imaging) — нысанның кескінін алу әдісі, мұнда нысанмен әрекеттесетін зондтаушы шоқ кеңістіктік ажыратылымы жоқ қарапайым бір пиксельді детектормен тіркеледі, ал кеңістіктік құрылым нысанға бағытталмаған екінші (тірек) шоқпен корреляциялық өлшеулер жүргізу арқылы қалпына келтіріледі.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Модельдеудің математикалық аппараты фотон мен фонон өрістерінің кеңістіктік профильдері арасындағы екінші ретті өзара корреляция функциясын G⁽²⁾(x_e, x_p) есептеуге негізделген [47, 48]. Эксперимент схемасында фонон арнасы нысандық иық ретінде қолданылады: БАТ-импульстері микрожарықшақты құрылымдарды зондтайды [36, 37], содан кейін өткен немесе шағылысқан акустикалық сигнал кең апертуралы бір пиксельді акустикалық қабылдағышпен жиналады. Фотон арнасы тірек иық қызметін атқарады: микротолқынды өрістің кеңістіктік үлестірімі координатқа сезімтал детекторлар матрицасымен тіркеледі.&lt;/p&gt;\n&lt;p&gt;«Фотон-фонон» жұптарының кванттық шырмалуы арқасында, акустикалық шоқпен микромасштабта жазылған микродефектілер туралы кеңістіктік ақпарат микротолқынды өріс интенсивтілігінің макромасштабты үлестіріміне көшіріледі. Сандық талдау көрсеткендей, сигнал/шуыл қатынасы (SNR) 15 дБ-ден жоғары және өлшеулер статистикасын жинақтау циклі 10⁵ ретінде болғанда, схема ені 1 мкм-ге дейінгі жарықшақтардың геометриясын ± 50 нм-ден аспайтын шекаралық қателікпен сенімді түрде қалпына келтіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Ұсынылған нәтижелер акустикалық толқындардың төсеніш көлемінде өшуі және кубиттің фазалық декогеренциясы ескерілмеген идеалдандырылған модель аясында алынды. Нақты тәжірибедегі ажыратылымдық БАТ-резонаторындағы фонондардың өмір сүру уақытымен және оқу трактындағы фазалық флуктуациялармен шектелетін болады.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Беттік акустикалық толқындар (БАТ) негізінде әзірленген кванттық фантомдық бейнелеу әдісі микроэлектроника мен акустооптикалық жүйелерді бұзбай бақылау үшін жаңа көкжиектерді ашады. Корреляцияланған фонон мен фотон жұптарын пайдалану зондтаушы сәулеленудің толқын ұзындығымен анықталатын классикалық дифракциялық шекті айналып өтуге мүмкіндік береді.&lt;/p&gt;\n&lt;p&gt;Эксперименттік қондырғыларда БАТ генерациясы литий ниобаты (LiNbO₃) сияқты пьезоэлектрлік төсемдерге тозаңдатылатын қарсы-істікшелі түрлендіргіштер (ҚІТ) көмегімен жүзеге асырылады. Акустикалық өрісті фокустау үшін электродтардың сақиналы және көлбеу конфигурациялары қолданылады, бұл акустикалық энергияны өлшемі λSAW/2 мәнінен аз субтолқынды аймақтарда шоғырландыруға мүмкіндік береді. Қоздыру жиілігі f = 1.5 ГГц және LiNbO₃ ішіндегі БАТ таралу жылдамдығы v = 3900 м/с болғанда, акустикалық толқын ұзындығы λSAW ≈ 2.6 мкм құрайды, бұл ақауларды анықтауда субмикрондық кеңістіктік ажыратымдылықты қамтамасыз етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Кванттық-корреляцияланған күйлерді пайдалану классикалық λSAW/2 шегінен төмен кеңістіктік ажыратымдылыққа және стандартты кванттық шектен 3 дБ төмен сигналдық шу деңгейіне қол жеткізуге мүмкіндік береді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Кванттық деңгейдегі әлсіз акустикалық сигналдарды тіркеу үшін милликельвиндік температурада (T ≈ 10 мК еріту рефрижераторларында) жұмыс істейтін асқын өткізгіш бір фотонды детекторлар мен Джозефсон параметрлік күшейткіштері қолданылады. Бұл фонондық модалардың орташа тығыздығы &lt;span class=\"yfm-latex\" data-content=\"%5Cbar%7Bn%7D_%7Bth%7D%20%5Cll%201\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; баламалы жылулық шуды барынша азайтады. Микротолқынды және оптикалық сигналдардың өзара түрленуі литий ниобатындағы жұқа қабықшалы резонаторларда 45%-ға дейінгі тиімділікпен жүзеге асырылады, бұл жүйені қолданыстағы талшықты-оптикалық байланыс желілерімен үйлесімді етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Әдістің негізгі шектеуі фонондардың кванттық когеренттілігін сақтау үшін аса төмен температураларды ұстап тұру қажеттілігі болып табылады, бұл қондырғыны стандартты өнеркәсіптік құрастыру желілеріне біріктіруді қиындатады.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ұсынылған кванттық акустикалық визуализация тұжырымдамасы кванттық оптика принциптерінің акустоэлектроникада қолданылатынын дәлелдейді. Күрделі геометриялы ҚІТ пен жоғары сезімталдықты микротолқынды детекторларды біріктіру көпқабатты жартылай өткізгішті құрылымдар мен flip-chip корпустарындағы жасырын ақауларды классикалық ультрадыбыстық дефектоскопия әдістеріне қолжетімсіз ажыратымдылықпен анықтауға мүмкіндік береді.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/correlation-imaging-via-hybrid-entanglement-between-microwav-f2.jpg\" alt=\"Сурет 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 2&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-03/correlation-imaging-via-hybrid-entanglement-between-microwav.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;кванттық&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сенсорлардағы&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;масштаб&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сәйкессіздігі&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path
