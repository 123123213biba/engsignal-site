        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"129\" cy=\"135\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"651\" cy=\"264\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · ADMIXTURES   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Кремнийдегі хаос: асинхронды&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;логикалық желілер ИИ оқытуды&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;қалай жеделдетеді&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/massively-parallel-reinforcement-learning-with-a-chaotic-rec-f1.jpg\" alt=\"Сурет 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Дәстүрлі процессорлар тактілік жиілік пен кездейсоқ сандарды генерациялаудың шектеулеріне байланысты масштабтау мәселесіне тап болады. Зерттеушілер «бөлінген булев хаосы» режимінде жұмыс істейтін асинхронды XOR/XNOR логикалық элементтер желісін ұсынды. Бұл бір коммерциялық чипте мыңдаған тәуелсіз энтропия көздерін жасауға мүмкіндік береді. Жүйе 1024 «бандит» есебінде сыналды және жоғары тиімділікті көрсетті.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-02/massively-parallel-reinforcement-learning-with-a-chaotic-rec.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Хаос генерациялау үшін асинхронды XOR/XNOR желілері.&lt;/li&gt;\n&lt;li&gt;Бір чипте 5120 параллель арнаны масштабтау.&lt;/li&gt;\n&lt;li&gt;Энтропия генерациясының 2,14 Тбит/с жылдамдығы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-02/massively-parallel-reinforcement-learning-with-a-chaotic-rec.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Архитектура автономды булевтік желілерге (ABN) негізделген, мұнда әр түйін сыртқы тактілік сигналсыз жұмыс істейтін логикалық элемент болып табылады. Жүйе динамикасы сигналдың таралу кідірістері мен транзисторлардың жетілмегендігімен анықталады. XOR және XNOR қақпаларын пайдалану максималды булевтік сезімталдықты қамтамасыз етеді, бұл хаотикалық режимді сақтау үшін өте маңызды. Жұмыста стационарлық күйлерді жоққа шығаратын гексагональды тор жүзеге асырылған.&lt;/p&gt;\n&lt;p&gt;FPGA-дағы тәжірибелер 5120 параллель арнаға дейін масштабтауға және 2,14 Тбит/с жиынтық генерация жылдамдығына қол жеткізуге мүмкіндік берді. Көп қолды бандит (MAB) есебін шешуде жүйе фотондық аналогтардан басым түсті. Арнайы өндірістің қажеті жоқтығынан, шешімді стандартты CMOS чиптеріне оңай көшіруге болады, бұл оны шешім қабылдауды жеделдеткіштер үшін қолжетімді етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу FPGA архитектурасымен және логикалық элементтердің физикалық параметрлерімен шектелген. Нәтижелер нақты чиптің қасиеттеріне тәуелді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"suretter\"&gt;&lt;a href=\"2026-10-02/massively-parallel-reinforcement-learning-with-a-chaotic-rec.html#suretter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Суреттер&lt;/span&gt;&lt;/a&gt;Суреттер&lt;/h2&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/massively-parallel-reinforcement-learning-with-a-chaotic-rec-f2.jpg\" alt=\"Сурет 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/massively-parallel-reinforcement-learning-with-a-chaotic-rec-f4.jpg\" alt=\"Сурет 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 4&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-02/massively-parallel-reinforcement-learning-with-a-chaotic-rec.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Кездейсоқ&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сандарды&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;масштабтау&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Асинхронды&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;булевтік хаос&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;желілері&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;2,14 Тбит/с&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жылдамдықтағы&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;5120 арна&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Масштабталатын&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ИИ жеделдеткіш&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тері&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт әлі рецензиядан өтпеген. Қорытындылар алдын ала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-02/massivel
