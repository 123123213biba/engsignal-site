        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"150\" cy=\"155\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"570\" cy=\"217\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · ROBOTICS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Салмағы 140 мг робот:&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;жәндіктер инженерлерді қалай&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;шабыттандырды&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/bio-inspired-functional-recursion-enables-multi-mode-locomot-f1.jpg\" alt=\"Сурет 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Инженерлер ауада, құрлықта және суда қозғала алатын 140 миллиграммдық роботты жасады. Әр орта үшін бөлек қозғалтқыштар орнатудың орнына, авторлар функционалдық рекурсия принципін қолданды. Пішін жады бар қорытпадан жасалған H-тәрізді жақтау әр түрлі тапсырмаларды орындау үшін өз конфигурациясын өзгертеді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-02/bio-inspired-functional-recursion-enables-multi-mode-locomot.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Роботтың салмағы 35 мм ұзындықта небәрі 140 мг.&lt;/li&gt;\n&lt;li&gt;SMA-бұлшықеттер бір жақтаудың қанат, аяқ және сүңгу жүйесі ретінде жұмыс істеуін қамтамасыз етеді.&lt;/li&gt;\n&lt;li&gt;225 В кернеудегі электроылғалдану су астына өтуді белсендіреді.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-02/bio-inspired-functional-recursion-enables-multi-mode-locomot.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Конструкцияның негізі диаметрі 48 мкм болатын пішін жады бар қорытпа (SMA) жасанды бұлшықеттерімен басқарылатын H-тәрізді жақтау болып табылады. Бұл бұлшықеттер композиттік негіздің бейтарап осінен 160 мкм қашықтықта бекітілген, бұл жылулық қысқаруды иілу деформациясына айналдыруға мүмкіндік береді. Күшті беруді күшейту үшін табиғи жібекпен арматуралау қолданылған, бұл ең аз салмақта жоғары беріктікті қамтамасыз етеді.&lt;/p&gt;\n&lt;p&gt;Жүйе табандағы киригами құрылымдары арқылы беттің ылғалдануын басқарады. 225 В кернеу берілгенде электроылғалдану жүреді, ол судың беттік керілуін бұзып, роботтың суға батуына мүмкіндік береді. Су бетінде жүзу режимінде робот қанаттардың асимметриялық қағылуы есебінен тартылыс күшін тудырады, ал құрлықта 8 Гц жиілікте 15,3 мм/с жылдамдықпен қозғалады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Демонстрация біртұтас автономды миссия ретінде емес, жеке функционалдық тесттер түрінде өткізілді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-02/bio-inspired-functional-recursion-enables-multi-mode-locomot.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Жәндіктер өз денесі мен аяқ-қолдарының механикасын бейімдеу арқылы әртүрлі ортада тиімді қозғалады. Жәндіктер ауқымындағы робототехникада мұндай икемділікті қатаң масса шектеулері кезінде қайталау қиын мәселе болып табылады. Бұл жұмыста массасы 140 мг микроробот ұсынылған, ол ұшуға, ауадағы қалпын басқаруға, жерде жорғалауға, су бетінде сырғанауға және бақыланатын батуға қабілетті. Бұл мүмкіндіктер біртұтас автономды миссия ретінде емес, жеке ашық контурлы функционалдық сынақтар ретінде көрсетілген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;140 мг массалы робот пішін жады қорытпасынан жасалған жасанды бұлшықеттермен басқарылатын бірыңғай трансформацияланатын қаңқа арқылы қозғалыстың төрт түрін біріктіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Көптеген жетектері бар конструкциялардан айырмашылығы, бұл робот «құрылымдық интеллектті» пайдаланады: пішін жады қорытпасынан (SMA) жасалған жасанды бұлшықеттермен жұмыс істейтін көпфункционалды қаңқа. Трансформацияланатын дене әртүрлі міндеттер үшін конфигурациясын өзгертеді: асимметриялық қанат қағу ұшуы үшін трансмиссия, анизотропты үйкеліс есебінен жерде жорғалау үшін сызықтық осциллятор және киригами үлгісіндегі табан саңылауларын реттеу үшін деформацияланатын актуатор қызметін атқарады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Киригами кинематикасы — тегіс парақтардан дәл кесу және бүгу арқылы күрделі 3D құрылымдарды жасау әдісі, бұл артық бөлшектерсіз геометрияны өзгертуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Табандарды модуляциялау белсенді электрлік сулауды жүзеге асыруға мүмкіндік береді: 225 В кернеу берілгенде судың беттік керілуі үзіледі, бұл бақыланатын батуды қамтамасыз етеді және жүк көтеру қабілетін робот дене массасының 1,7 есесіне дейін арттырады. Жұмсақ жетектер мен құрылымдық механиканы бір платформада біріктіру функционалдық рекурсия принципін жүзеге асырады, бұл жоғары функционалдылықты сақтай отырып, массаны барынша азайтуға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жұмыс біртұтас үздіксіз автономды миссияны емес, сынақтар аясындағы жеке функционалдық мүмкіндіктерді көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Әуе, жер және су ортасында қозғала алатын роботтарды жасау биологиялық жүйелерден шабыттанған маңызды міндет болып табылады. Жәндіктер ұшу, жорғалау, жүзу және секіру үшін бірыңғай тірек-қимыл аппаратын пайдаланып, ерекше мультимодальды қабілеттерді көрсетеді. Бұл жұмыста «функционалдық рекурсия» стратегиясы — бірдей қайта конфигурацияланатын құрылымды әртүрлі механикалық міндеттер үшін қайта тағайындау ұсынылады. Әрбір модуль автономды болатын дәстүрлі жүйелерден айырмашылығы, мұнда пішін жады бар қорытпа (SMA) бұлшықеттерімен басқарылатын H-тәрізді жақтау орталық белсенді элемент қызметін атқарады. Ол ұшуды басқару үшін қанаттар кинематикасын модуляциялайды, жерде қозғалу үшін жүрісті қалыптастырады және су-ауа өтулері үшін киригами-тіректердің ылғалдануын реттейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SMA-актуаторлы бірыңғай морфологиялық жақтауды пайдалану масса шектеулері мен жүзгіштік және суға бату талаптары арасындағы қайшылықты жеңуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Функционалдық рекурсия — бұл бір физикалық бөлшек жұмыс режиміне қарай бірнеше түрлі функцияны орындайтын инженерлік тәсіл.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Әзірленген төрт қанатты роботтың ұзындығы 35 мм және массасы 140 мг (сыртқы электроника мен қуат көзін есептемегенде). Негізгі бөлік қанат актуаторларына жалғанған H-тәрізді жақтаудан тұрады. Робот ұшуды, 8 Гц жиілікте 15,3 мм/с жылдамдықпен жерде жорғалауды, су бетінде сырғанауды және басқарылатын батуды сәтті көрсетті. Басқару ашық контурда жүзеге асырылады: SMA-бұлшықеттері арқылы жақтаудың деформациясы курсты түзету (бұрылу, тангаж, қисаю) үшін қанаттар кинематикасын өзгертеді және киригами-тіректердегі саңылауларды реттейді. Суға бату үшін беттік керілуді азайтатын механикалық деформация мен электроылғалдану комбинациясы қолданылады. Суға бату барысында қанат қағулары дененің қалпын тұрақтандыру үшін пайдаланылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу ашық контурда жеке режимдерді көрсетуге бағытталған; кері байланысы бар толық автономды миссия болашақ әзірлемелер үшін міндет болып қала береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мультимодальды локомоциясы бар роботтарды жасау үшін актуатор мен жүк көтергіш құрылымды біріктіретін ықшам архитектура қажет. Авторлар H-тәрізді жақтауды белсенді қайта конфигурациялау үшін жібекпен нығайтылған пішін жады қорытпасы (SMA) негізіндегі жасанды бұлшықетті әзірледі. Бұл шешім әр қозғалыс режимі үшін жеке актуатор орнатпай, бірдей корпусты қанаттар кинематикасын, жерде жорғалауды және орталар арасындағы ауысуды басқару үшін пайдалануға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жібекпен нығайту PDMS-инкапсуляциямен салыстырғанда конструкция массасын 408%-ға азайтуға және иілу деформациясын 325%-ға арттыруға мүмкіндік берді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жасанды бұлшықет көміртекті талшықпен нығайтылған эластомер негізінен, шыны талшықты электр оқшаулау қабаттарынан және бейтарап жазықтықтан 160 мкм биіктікте орналасқан SMA сымдарынан (диаметрі 48 мкм) тұрады. Деформацияны беруді күшейту үшін 8,5 ГПа анизотропты серпімділік модулі бар табиғи жібек қолданылады. SMA қысқарған кезде сым ығысып, жібек қабатын тартады, бұл қысқаруды иілуге айналдырады (3a, b-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Фотолитография әдісі SMA сымдарын композиттік талшықтарға қатысты дәл орналастыруға мүмкіндік береді, бұл болжамды деформацияны қамтамасыз етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Дифференциалды сканерлеуші калориметрия SMA фазалық ауысу температураларын анықтады: мартенситтік (Mp) — 67 °C, аустениттік (Ap) — 88 °C. Сынақтар барысында (n=5) орташа иілу бұрышы 45° ± 3°, ал ұшының ығысуы 2,1 ± 0,2 мм болды. Сипаттамалардың қанығуы 70 мВт қуатта жүреді. Циклдік төзімділік сынақтары 16 Гц жиілікте 6000 циклге дейін ығысу тұрақты қалатынын (1,55 ± 0,3 мм) көрсетті, алайда 10⁴ циклден кейін құрылымның деградациясы байқалады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;83 мВт қуатта максималды блоктайтын күшке қол жеткізіледі, бірақ кернеудің шоғырлануына байланысты қысқыш аймағында конструкцияның бұзылу қаупі бар.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жиіліктік сипаттамалар жылу циклінің (қыздыру/суыту) уақытымен шектелген. 70 мВт қуатта активтену шамамен 0,17 с, ал суыту 0,23 с алады. Жиілік артқан сайын (1-ден 16 Гц-ке дейін) толық суымау салдарынан қалдық жылу жинақталады, бұл бастапқы позицияның ығысуына (displacement offset) әкеледі. Бұл эффектіні компенсациялау үшін PWM сигналының оңтайлы жұмыс циклі (duty cycle) 1 Гц-те 7%-дан 16 Гц-те 19%-ға дейін арттырылады.&lt;/p&gt;\n&lt;p&gt;Жәндіктердің кеуде қуысының толық функционалды роботтандырылған моделін жасау жеңіл конструкцияда көптеген функцияларды арнайы жетектерсіз біріктіруді талап ететін күрделі міндет. Аралардың биологиялық ерекшеліктерінен шабыт ала отырып, біз жасанды бұлшықеттері бар H-тәрізді жақтауды әзірледік. Бұл конструкция жүк көтергіш қаңқа қызметін атқарады, қанат кинематикасын реттейді және жер бетінде қозғалуға бейімделе алады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жасанды бұлшықетті H-тәрізді жақтау көпфункционалдылықты қамтамасыз етеді және 1,2 тарту-салмақ қатынасына қол жеткізуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жетек ретінде төмен кернеуде жұмыс істейтін және ықшам өлшемге ие электромагниттік жүйелер таңдалды. Миниатюраланған жетектер жәндік кеудесінің өлшемдеріне сәйкестендірілген. 4a-суретте көрсетілгендей, H-жақтау екі беріліс жүйесімен біріктірілген. Трансмиссияға орнатылған катушкалар (4b-сурет) қанаттарды жазық төрт буынды механизмдер арқылы қозғалысқа келтіреді, бұл осьтік ығысуды айналмалы қозғалысқа айналдырады (S5-суретті қараңыз).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Төрт буынды механизм — бұл сызықтық қозғалысты айналмалы қозғалысқа айналдырып беретін кинематикалық тізбек.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Механизм нүктелеріне бекітілген жасанды бұлшықеттер трансмиссия геометриясын өзгертіп, ұшу бағытын басқару үшін асимметриялық қанат қағуды қамтамасыз етеді. Аэродинамикалық модельге сәйкес, қанаттың пассивті бұралуы (4c-сурет) дене салмағының 120% бөлігіне тең көтеру күшін түзеді. Ашық контурлы ұшу сынақтары (4d-сурет, S6-сурет, S4-видео) 1,2 тарту-салмақ қатынасына қол жеткізілгенін растады.&lt;/p&gt;\n&lt;p&gt;Математикалық модельдер жасанды бұлшықеттердің деформациясы қанаттардың кинематикасын тікелей анықтайтынын растайды. Синусоидалы қуат көзі кезінде сызықтық актуатор қозғалысы қанат қағу кинематикасына айналады. Әрбір жасанды бұлшықет сол немесе оң қанаттың қағу амплитудасын дербес модуляциялайды. Бұлшықет ұштары траекториясының кіші қисықтығын (&amp;lt; 5° доға) ескере отырып, ығысу сызықтық басқару сигналы ретінде жуықталды. 48-теңдеуге сәйкес, δ_c = ± 300  мкм басқару сигналдары қанат қағу амплитудасын модуляциялайды. Бейтарап күй симметрияны қамтамасыз етсе, бағытталған сигналдар асимметрияны тудырып, дифференциалды көтеру күші мен бұру моментін жасайды (4f-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;± 300  мкм басқару әсері қанат амплитудасын дәл модуляциялауға мүмкіндік беріп, маневр жасау үшін қажетті моменттерді қалыптастырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Робот ұшуды ашық контурда басқару үшін деформацияланатын H-тәрізді жақтауды пайдаланады. Электромагниттік катушкалар жоғары жиілікті қанат қағуды (93 Гц) қамтамасыз етеді, ал жақтау деформациясы трансмиссияға геометриялық ығысу береді (4a, b-сурет). Тангаж алдыңғы және артқы қанаттар амплитудасымен, көлбеу (крен) сол және оң қанаттар амплитудасының асимметриясымен, ал бұрылу (яв) қанат қағу жылдамдығы мен ауа кедергісінің айырмашылығы арқылы басқарылады (4g–i-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ашық контурлы басқару жүйесі нақты уақыт режимінде сенсорлардан кері байланыссыз командаларды орындайтынын білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Актуаторлардың бір жақты деформациясы көтеру күшінің асимметриясын тудырып, y осі айналасында айналуды (тангаж) қалыптастырады. Екі жақты актуаторлардың дифференциалды деформациясы x осі айналасында көлбеу моментін жасайды. Бұрылу үшін қанат қағудағы реактивті күштер пайдаланылады: бұлшықеттердің диагональды деформациясы ауа кедергісінде асимметрияны тудырып, z осі айналасында таза бұру моментін келтіреді (4i-сурет). Бейнежазбаларды талдау нәтижелердің қайталануын көрсетті: 0,7 секундта 40° тангаж, 0,6 секундта 50° көлбеу және 1,0 секундта 160° бұрылуға қол жеткізілді (4j–l-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жүйенің өткізу қабілеті пьезоэлектрлік актуаторларға қарағанда шектеулі, сондықтан жұмыс жоғары динамикалық тұрақтандыруға емес, басқару мүмкіндігін көрсетуге бағытталған.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жасанды бұлшықеттермен басқарылатын H-тәрізді раманы жер бетінде қозғалу үшін қолдану мүмкіндігі зерттелді. Көп буынды аяқтардың орнына жүйе функционалды рекурсия принципіне негізделген: ұшу кезінде қанаттарды басқаратын құрылым жерде периодты тербелістер тудырады. 5a-суретте көрсетілгендей, раманың ұштарына анизотропты үйкелісі бар тырнақ тәрізді қарапайым аяқтар бекітілген. Бұл бір бағыттағы үйкеліс кедергісінің екіншісінен жоғары болуын қамтамасыз етеді. Екі жасанды бұлшықет раманы қарама-қарсы иіп, аяқтардың қарсы фазада қозғалуына әкеледі. 5b-суреттегі күйлер арасындағы ауысу кезінде бір жұп аяқ статикалық үйкеліс салдарынан орнында қалады, ал екіншісі сырғанайды. Қозғалыс бағытын басқару бұлшықет деформациясының амплитудасы мен жиілігін модуляциялау арқылы жүзеге асады. Қозғалыс жылдамдығы Δ X = 2δ формуласымен анықталады, мұндағы δ — тиімді ығысу. Сынақтар бетінің кедір-бұдырлығы Ra = 7,5 µ m болатын қағаз бетінде жүргізілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Анизотропты үйкеліс пен раманың реципрокты деформациясы роботқа күрделі аяқ механизмдерінсіз қозғалуға мүмкіндік береді.&lt;br /&gt;\n[!tip] Анизотропты үйкеліс — қозғалыс бағытына байланысты үйкеліс коэффициентінің өзгеруі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Су бетінде қозғалу үшін H-тәрізді рама реттелетін «киригами» аяқтарымен жабдықталды. Аяқтар PDMS субстратынан (200 µ m), металл электродтан (2 µ m) және PTFE жабынынан (15 µ m) тұрады. Гидрофобты бет және киригами саңылаулары су бетінде ұстап тұратын мениск түзеді (6a-сурет). Қанаттар ұшу режимінде жұмыс істегенде, қағу жазықтығының көлбеуі көлденең тарту күшін тудырып, суда сырғанауды қамтамасыз етеді. 90 Hz жиілікте (екінші гармоника) робот 3–6,3 mm/s жылдамдықпен қозғалады (6b-сурет). Жоғары жылдамдықты түсірілім арқылы өлшенген динамикалық көрсеткіштер 4,3 mm/s² (0,12 BL/s²) максималды үдеуді және 950 ms өткен соң 6,3 ± 0,4 mm/s (n = 3 талпыныс) максималды жылдамдықты көрсетті (6c-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Киригами аяқтары мен электрмен сулау интеграциясы роботқа су бетінде жүзуге және басқарылатын батуға мүмкіндік береді.&lt;br /&gt;\n[!warning] Тәжірибелер зертханалық жағдайда өткізілді; шағын таңдама (n=3) нәтижелерді жалпылауда сақтықты талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Эксперименталды зерттеулер барысында 0-ден 3 В-қа дейінгі кернеу (V) мен жылдамдық (мм/с) және үдеу (мм/с²) арасындағы байланыс талданды. Кернеу берілген кезде жылдамдықтың –2-ден 4 мм/с-қа дейінгі ауытқуы тіркелді, ал жиіліктер айырмашылығы (Гц) 2-ден 6 Гц аралығында болды. Бұл көрсеткіштер 250 мН-ға дейінгі жүктеме (Fload) режимдерінде жүйенің динамикалық жауабын бағалауға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жиіліктер айырмашылығы — тербелмелі жүйенің резонанстан ауытқуын сипаттайтын параметр, бұл объектінің сұйықтықтағы тұрақтылығын түсіну үшін өте маңызды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Объектінің су бетіне (Water surface) бату процесін зерттеу кезінде x (0–10 мм) және z (0–140 мм) осьтері бойынша таралу профильдері алынды. «Аяғымен алға» (Feet-first settling) бату режимінде тангаж (Pitch) және крен (Roll) бойынша бағдарлау бұрыштары (Attitude) –100°-тан 80°-қа дейін өзгеретіні анықталды. 2δ (мм) параметрі, яғни бұзылу аймағының ені, объектінің ауа-су шекарасымен өзара әрекеттесу процесінде тіркелді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;3 В-қа дейінгі кернеу кезінде жүйе жылдамдықтың 4 мм/с-қа дейін бақыланатын өзгерісін көрсетеді, ал бату кезінде бұрыштық ауытқулар z тереңдігіне байланысты 100°-қа дейін жетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Робот су бетінде реттелетін саңылаулары бар киригами-тіректердің көмегімен қозғалады (6a, b-сурет). Сырғанау жылдамдығы қанаттардың тербеліс жиіліктерінің айырмашылығына байланысты: 80 Гц базалық жиілікте максималды жылдамдық 6,3 ± 0,4 мм/с (n = 3) құрайды. Киригами қағидасы бойынша жасалған тірек теріс Пуассон коэффициентіне ие: тігінен созылған кезде ол бүйірге қарай кеңейеді. 2δ деформациясы (мұнда δ — бүйірлік ығысу) беттік керілу есебінен көтеру күшін арттырады және робот массасынан 1,7 есе артық, яғни 242 ± 32 мг қосымша жүк көтеруге мүмкіндік береді (6e-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Киригами механизмі көтеру қабілетін робот массасының 170%-ына дейін арттырып, жүзгіштікті тиімді басқаруға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бастапқы күйде құрылымдағы саңылаулар минималды, ал гидрофобты бет пен бір-біріне қабаттасатын менискілер судың кіруіне кедергі жасайды. Металлданған диэлектрлік қабатқа кернеу берілгенде электро-сулану (electrowetting) орын алады: жанасу бұрышы азайып, су саңылауларды толтырады және робот суға батады (6f–h-сурет). CCE математикалық моделі жүктеменің 70%-дан астамы Архимед күші емес, беттік керілу есебінен ұсталатынын растайды. 243,6 В кернеуде мениск биіктігі h_w нөлге жақындайды және тірек өз тиімділігін жоғалтады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Электро-сулану — бұл электр өрісінің әсерінен беттің сулану қасиетін (гидрофобты күйден гидрофильді күйге) өзгерту процесі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Суға кіру үшін беттік керілу шегін жеңу қажет. Тірек деформациясы 2δ = 1 мм болғанда 225 В, ал 2δ = 2 мм болғанда 300 В кернеу талап етіледі (6j-сурет). Еркін бату процесінде робот аударылып кетуге бейім болады. Тұрақтылықты қамтамасыз ету үшін қанаттардың асимметриялық тербелісі қолданылады: бұл тангаж және көлбеу бұрыштарын түзетіп, роботтың «аяғымен төмен» қонуын қамтамасыз етеді (6k–m-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тұрақтандыру ашық контур (open-loop) бойынша жүзеге асырылады, бұл бату кезіндегі пассивті тұрақсыздықты өтеу үшін қанат тербелісінің параметрлерін алдын ала баптауды талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Салмағы 1 граммнан аз роботтарды жасау кезіндегі негізгі қайшылық — миниатюризация массаны барынша азайтуды талап етсе, көпфункционалдылық әдетте арнайы жетектерді (актуаторларды) қосуды қажет етеді. Бұл жұмыста салмағы 140 мг роботта функционалды рекурсия стратегиясы қолданылды. Оның негізі — пішінін сақтайтын қорытпадан (SMA) жасалған жасанды бұлшықеттері бар H-тәрізді рама. Бұл бірыңғай қайта конфигурацияланатын құрылым ұшу (раманы деформациялау арқылы), жер бетінде жорғалау (асимметриялық үйкеліс), су бетінде сырғанау және бақыланатын суға бату (киригами-тіректер мен электроылғалдану арқылы) мүмкіндіктерін береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Салмағы 140 мг робот төрт түрлі қозғалысты біріктіреді және жеке жетектердің орнына бір ғана деформацияланатын құрылымды пайдаланады, бұл функционалды тығыздықты арттырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Басты жетістік — жәндіктер қанатының механизміне ұқсас бұлшықет-рама үйлесімі. Раманы деформациялау арқылы тангаж, крен және ығысу моменттері жасалады. Асимметриялық үйкеліс тербелістерді бағытталған қозғалысқа айналдырады. Тәжірибелер 2δ = 1 мм деформацияда суға бату белгілі бір кернеуде, ал 2δ = 2 мм болғанда 300 В кернеуде болатынын көрсетті. Бұл қажетті кернеудің беттің тірек күшіне байланысты екенін дәлелдейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Функционалды рекурсия — бұл бір физикалық бөлшектің пішінін өзгерту арқылы бірнеше міндетті атқаруы, бұл артық механизмдерден аулақ болуға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;SMA бұлшықеттерінің жылулық инерциясы ұшуды тұрақтандыру жылдамдығын шектейді. Электромагниттік көтеру механизмі ықшамдылық үшін таңдалған, бірақ пьезоэлектрлік жетектерден күш қуаты бойынша төменірек. Қазіргі тәжірибелер тынық суда өткізілді, толық автономды «ұшу–қону–жорғалау–суға бату» циклі әлі жүзеге асырылмаған. Болашақ жұмыстар жоғары жиілікті гибридті жетектер мен борттық қуат жүйелерін интеграциялауға бағытталған.&lt;/p&gt;\n&lt;p&gt;Роботтың суда тұру қабілеті капиллярлық және электроылғалдану (CCE) моделімен талданады. Статикалық күйде салмақ, көтеру күші және беттік керілу тепе-теңдікте болады. Жалпы жүк көтергіштік Fload келесідей анықталады:&lt;/p&gt;\n&lt;p&gt;&lt;span class=\"yfm-latex\" data-content=\"F_%7Bload%7D%20%3D%20%5Crho%20g%20b%20(S_1%20%2B%202S_2)%20%3D%20%5Crho%20a%20b%20h_w%20g%20-%202%5Cgamma%20(a%20%2B%20b)%20%5Ccos%20%20heta\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;&lt;/p&gt;\n&lt;p&gt;Мұнда &lt;span class=\"yfm-latex\" data-content=\"S_1%20%2B%202S_2%20%3D%20%5Cint_0%5Eh%20x%20dz%20%3D%20a%20h_w%20%2B%202(k-1)%20%5Csin%20%5Calpha\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (1-теңдеу), &lt;span class=\"yfm-latex\" data-content=\"S_y%20%3D%20-2%5Cgamma%20(a%20%2B%20b)%20%5Ccos%20%20heta\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (4-теңдеу) және &lt;span class=\"yfm-latex\" data-content=\"F_b%20%3D%20%5Crho%20a%20b%20h_w%20g\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (5-теңдеу). Мениск бату тереңдігі h түйісу геометриясынан шығады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель идеалды гидрофобты бет пен тынық суды қарастырады; толқынды жағдайда динамикалық өзгерістерді ескеру қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мениск биіктігі h_w келесі формуламен анықталады: &lt;span class=\"yfm-latex\" data-content=\"h_w%20%3D%20k_1%20%5Csqrt%7B2(1%20-%20%5Ccos%20%5Calpha)%20%2F%20%5Crho%20g%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, мұндағы α = θ - π/2. Мұнда θ — шеткі бұрыш (90^° &amp;lt; θ &amp;lt; 180^° гидрофобтылық үшін, 0^° &amp;lt; θ &amp;lt; 90^° гидрофильділік үшін), γ = 0.0728  Н/м — судың беттік керілу коэффициенті, &lt;span class=\"yfm-latex\" data-content=\"%5Crho\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — су тығыздығы, g — еркін түсу үдеуі. a және b параметрлері деформация кезінде Пуассонның теріс коэффициентін көрсететін тірек алаңының өлшемдерін анықтайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Беттік керілу роботтың көтергіштік қабілетінің 70%-дан астамын қамтамасыз етеді, ал киригами-механизмі статикалық жүк көтергіштікті 1.7 есе арттырып, 242 мг қосымша жүк тасуға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тәжірибелер жәндіктер ауқымында роботтың жүзгіштігі дәл осы беттік керілуге байланысты екенін растайды. Жасанды бұлшықеттер іске қосылғанда алаң кеңейіп, байланыс сызығының ұзындығын және проекциялық ауданды арттырады, бұл керілуді де, итеруші күшті де күшейтеді. Алайда, шамадан тыс кеңею деформация мен бойлық иілуге әкеледі, бұл менискінің үзілуіне және көтергіштік қабілеттің төмендеуіне себеп болады.&lt;/p&gt;\n&lt;p&gt;Өзгермелі саңылаулы жүйелерді сипаттау үшін модификацияланған электрлік сулау моделі қолданылады. V кернеуі берілгенде, шеткі бұрыш θ Юнг-Липпман теңдеуіне сәйкес өзгереді: &lt;span class=\"yfm-latex\" data-content=\"%5Ccos%20%20heta%20%3D%20%5Ccos%20%20heta_0%20%2B%20%5Cfrac%7B%5Cepsilon_0%20%5Cepsilon_r%7D%7B2%20%5Cgamma%20d_H%7D%20V%5E2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, мұндағы ε₀ — вакуумның диэлектрлік өтімділігі, ε_r — салыстырмалы өтімділік, d_H — жабын қалыңдығы. Кері трапеция пішінді саңылауларда қабырғалардың көлбеу бұрышына α_g байланысты капиллярлық эффект пайда болады. Капиллярлық қысым &lt;span class=\"yfm-latex\" data-content=\"%5CDelta%20P%20%3D%202%20%5Cgamma%20%5Ccos(%20heta%20-%20%5Calpha_g)%20%2F%20W_%7Beff%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, мұндағы Weff — саңылаудың тиімді ені. Сұйықтықтың көтерілу биіктігінің тепе-теңдік шарты &lt;span class=\"yfm-latex\" data-content=\"h_g%20%3D%202%20%5Cgamma%20%5Ccos(%20heta%20-%20%5Calpha_g)%20%2F%20%5Crho%20g%20W_%7Beff%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; түрінде анықталады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Электрлік сулау — бұл электр өрісінің әсерінен беттің сулануын (шеткі бұрышын) өзгерту, бұл микро-саңылаулардағы сұйықтықтың капиллярлық көтерілуін басқаруға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Беттік керілу күшінің тік құраушысы &lt;span class=\"yfm-latex\" data-content=\"S_y%20%3D%20%5Cgamma%20L%20%5Ccos(%20heta%20-%20%5Calpha_g)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; және итеруші күш &lt;span class=\"yfm-latex\" data-content=\"F_b%20%3D%20%5Crho%20g%20a%20b%20(h_w%20-%20w%20L%20%2F%202%20h_g)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; жалпы көтергіштік қабілетті &lt;span class=\"yfm-latex\" data-content=\"F_%7Bload%7D%20%3D%20F_b%20-%202%20%5Cgamma%20L%20%5Ccos(%20heta%20-%20%5Calpha_g)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; анықтайды, бұл кернеу мен саңылау геометриясына тікелей байланысты.&lt;/p&gt;\n&lt;p&gt;CCE моделін растау үшін әртүрлі кернеулер мен саңылау ендеріндегі тік қолдау күші өлшенді. Робот бір осьті күш датчигіне бекітілді, өлшеулер 0.1  мм/с жылдамдықта квазистатикалық жақындату/ажырату әдісімен жүргізілді. Әр жағдай үшін үш қайталау өлшемі өткізілді, нәтижелер диапазон көрсетілген орташа мәндер ретінде ұсынылды (6i-сурет). Бату процесі бағдарламалық түрде басталды: алдымен саңылау деформацияланды, содан кейін қолдау күшін теріс мәнге дейін төмендететін кернеу берілді.&lt;/p&gt;\n&lt;p&gt;Құрылымды жасау процесі диодты сорғысы бар қатты денелі (DPSS) лазердің көмегімен киригами өрнегін абляциялаудан басталды. Фокустық қашықтықты өзгерту арқылы элементтердің трапеция пішіндес көлденең қимасы алынды. PDMS негізінің бетін белсендіру үшін үлгі 45° бұрышпен көлбеу орнатылды. Одан кейін атомдық-қабаттық тұндыру (ALD) әдісімен қалыңдығы 10 нм Al₂O₃ адгезиялық қабаты бірнеше цикл ішінде, дәл сол 45° бұрышпен тұндырылды. Келесі кезеңде магнетронды шашырату әдісімен қалыңдығы 150 нм алтын (Au) электрод қабаты жалатылды. Байланыс алаңдары жоғары дәлдіктегі дозатор арқылы электр өткізгіш күміс пастасымен қапталды. Соңғы кезеңде қалыңдығы 15 мкм парилен-C қабаты конформды жабын ретінде жағылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Атомдық-қабаттық тұндыру (ALD) — беткі қабатта өте жұқа және біркелкі пленкаларды қалыптастыруға мүмкіндік беретін жоғары технологиялық әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Лазерлік абляция және 45° бұрышпен тұндырылған Al₂O₃ (10 нм) мен Au (150 нм) қабаттары деформацияланатын негізде жоғары дәлдіктегі электродтарды қалыптастыруды қамтамасыз етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл жұмыс жәндіктердің қозғалыс механизмдері мен олардың роботтандырылған аналогтарын қамтитын биошабыттандырылған технологиялардың кең ауқымды талдауына негізделген. Зерттеу базасы су жүзгіштердің гидродинамикасын, аралар мен шыбындардың ұшу механизмдерін, сондай-ақ су бетінде секіру принциптерін зерттеуді қамтиды. Орталар арасындағы ауысуға ерекше назар аударылған: ұшудан жүзуге және қатты беттермен қозғалуға. Мақалада маневрлікті қамтамасыз ету үшін эластомерлі жетектер мен электростатикалық адгезияны қолданатын қатты конструкциялар да, жұмсақ робототехникалық жүйелер де қарастырылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу әртүрлі ортадағы микророботтардың өтпелі қозғалыс режимдерін сипаттайтын 37 негізгі дереккөзге сүйене отырып, биомиметика мен робототехника принциптерін біріктіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Зерттеу әдіснамасы массасы 88 мг-нан бастап ірірек жүйелерге дейінгі микроауқымды роботтар туралы деректер синтезіне сүйенеді. Жұмыста ұшуды, секіруді және жүзуді басқару әдістері, соның ішінде жұмсақ жасанды бұлшықеттер мен электроадгезивті механизмдерді пайдалану талданады. Тұжырымдардың статистикалық сенімділігі эксперименттік деректерді жәндіктерге тән гидродинамика мен аэродинамиканың теориялық модельдерімен салыстыру арқылы қамтамасыз етіледі. Қолданылатын аспаптарға жоғары жылдамдықты қозғалысты түсіру жүйелері мен бетпен әрекеттесу күштерін бағалауға арналған датчиктер кіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Биошабыттану — бұл роботтардың тиімділігін арттыру үшін биологиялық жүйелерден конструктивтік шешімдер мен басқару принциптері алынатын инженерлік тәсіл.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ұсынылған әдебиеттер тізімі 2016–2026 жылдар аралығындағы биологиялық нысандардан шабыттанған микроробототехника саласындағы озық әзірлемелерді қамтиды. Негізгі назар ұшу, жорғалау, секіру және орталар арасында (ауа-су, жер-ауа) ауысу сияқты күрделі қозғалыс түрлеріне қабілетті көпфункционалды жүйелерді құруға аударылған. Негізгі зерттеулер соқтығысуға төзімділікті қамтамасыз ету үшін жұмсақ жетектерді пайдалануды [44], жәндіктер қанаттарының механикасын басқару үшін терең оқытуды [41] және сенімді болжамды басқару арқылы күрделі маневрлерді жүзеге асыруды [50] қамтиды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Биомиметикалық робот — бұл құрылымы мен қозғалыс принциптері биологиялық прототиптерге (жәндіктер, құстар) еліктейтін құрылғы, бұл шағын масштабта жоғары энергия тиімділігі мен маневрлікке қол жеткізуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Құрылымдық элементтерді жетек механизмдерімен біріктіруде, мысалы, оригами технологияларын қолдану арқылы айтарлықтай прогресс байқалады [48]. Геометриясы өзгеретін жүйелердің дамуы роботтарға экстремалды жағдайларда, соның ішінде терең су ортасында бейімделуге мүмкіндік береді [49]. Зерттеулер сонымен қатар қауіпсіз қону стратегияларына [45] және «жорғалау–секіру–қалықтау» сияқты үздіксіз қозғалыс режимдерін оңтайландыруға бағытталған [46].&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/bio-inspired-functional-recursion-enables-multi-mode-locomot-f1.jpg\" alt=\"Сурет 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/bio-inspired-functional-recursion-enables-multi-mode-locomot-f2.jpg\" alt=\"Сурет 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/bio-inspired-functional-recursion-enables-multi-mode-locomot-f3.jpg\" alt=\"Сурет 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/bio-inspired-functional-recursion-enables-multi-mode-locomot-f4.jpg\" alt=\"Сурет 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 4&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/bio-inspired-functional-recursion-enables-multi-mode-locomot-f5.jpg\" alt=\"5-сурет. H-тәрізді раманың деформациясы және асимметриялық үйкеліс арқылы жерде жорғалау. a Аяқ пен беткей арасындағы ан\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет. H-тәрізді раманың деформациясы және асимметриялық үйкеліс арқылы жерде жорғалау. a Аяқ пен беткей арасындағы анизотропты үйкеліске негізделген жорғалаудың механикалық принципі.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-сурет. H-тәрізді раманың деформациясы және асимметриялық үйкеліс арқылы жерде жорғалау. a Аяқ пен беткей арасындағы анизотропты үйкеліске негізделген жорғалаудың механикалық принципі. Алдыңғы және артқы аяқтар бір әрекет циклі ішінде бағытқа тәуелді үйкеліс күштерін бастан кешіреді, бұл дененің қайтымды деформациясын таза алға қарай қозғалысқа айналдырады және басқаруды қамтамасыз етеді. b Бір жорғалау циклі ішінде пішіні өзгеретін H-тәрізді раманың екі экстремалды деформация күйі. SMA арқылы басқарылатын кезектесіп иілу аяқтардың салыстырмалы орнын өзгертеді және дененің периодты түрде ұзаруы мен қысқаруын тудырады. c Қозғалыстың өкілдік жиіліктерінде түзу сызық бойымен жорғалаудың композиттік кескіндер тізбегі. Робот 1-күй мен 2-күй арасында қайталанатын ауысу арқылы алға қарай қозғалады. d Бір бағытты және екі бағытты H-тәрізді раманың иілуінде қозғалыс жиілігінің функциясы ретінде жорғалау жылдамдығы. Робот тегіс қағазда 8 Гц оңтайлы қозғалыс жиілігінде 0,46 ± 0,02 BL/с максималды жорғалау жылдамдығына жетеді. Кіші суретте екі қозғалыс режимі үшін қолданылатын H-тәрізді раманың тиісті деформация күйлері көрсетілген. e Асимметриялық үйкеліспен жорғалаудың кинематикалық моделі. Модель дененің орнын, дененің бағытын, аяқтардың орнын және бір әрекет циклі ішінде аяқтардың уақыт бойынша өзгеретін ығысуларын сипаттайды. f Әртүрлі асимметриялық деформация енгізулері арқылы жасалған түзу сызық бойымен жорғалауды, солға бұрылуды және оңға бұрылуды көрсететін өлшенген траекториялар. Кіші суретте бір жорғалау циклі ішінде аяқ пен дененің өкілдік жылдамдықтары көрсетілген. g Әртүрлі кедір-бұдырлығы бар төрт беткейде жорғалаудың өкілдік траекториялары: шыны (#1, Ra = 0,01 мкм), тегіс қағаз (#2, Ra = 7,5 мкм), бальза ағашы (#3, Ra ≈ 15,3 мкм) және EPP (#4, Ra &amp;gt; 500 мкм). h Әртүрлі кедір-бұдырлығы бар беткейлерде жорғалау жылдамдығы. Қателік сызықтары үш қайталанатын сынақтан алынған максималды және минималды мәндерді көрсетеді. Робот тегіс қағазда ең жоғары жылдамдыққа жетеді, ал шыны мен бальза ағашында жылдамдық төмендейді, EPP-де дерлік тоқтап қалады. Деректер орташа мән ретінде мин-макс диапазонымен көрсетілген (n = 3). Масштаб сызықтары (c, g): 10 мм.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-02/bio-inspired-functional-recursion-enables-multi-mode-locomot.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Мультимодальды&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;лықтағы салмақ&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;шектеуі&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;SMA-жақтау&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;арқылы&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;функционалдық&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;рекурсия&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Робот ұшады,&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жүреді және&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сүңгиді&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Миниатюралық р&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;обототехникада&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ғы жаңа&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;стандарт&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мақала рецензияланатын Microsystems &amp;amp; nanoengineering журналында жарияланғ
