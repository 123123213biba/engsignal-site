            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"84\" cy=\"117\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"676\" cy=\"166\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · DIGITAL_TWIN   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;LiteReality-Agent: бөлме&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;скандарын симуляцияға&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;арналған кодқа айналдыру&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-f1.jpg\" alt=\"Сурет 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;LiteReality-Agent интерьерді 3D реконструкциялауды графикадан бағдарламалау саласына ауыстырады. Жүйе бөлменің геометриясын, нысандар артикуляциясын және физикалық қасиеттерін сипаттайтын Room.py файлын жасайды. Бұл тәсіл сахнаны өңдеуді және робототехника симуляторларында қолдануды жеңілдетеді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Сахнаны орындалатын Python коды ретінде реконструкциялау&lt;/li&gt;\n&lt;li&gt;Өлшеу және рендерлеу арқылы тексеру циклі&lt;/li&gt;\n&lt;li&gt;Физикалық симуляторлармен толық үйлесімділік&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Жүйе екі кезеңде жұмыс істейді: сахнаны бастапқы баптау және агенттік өңдеу. Бірінші кезеңде RGB-D сканерлеу деректері «жоспарлау агенті» арқылы өңделеді, ол соқтығысуларды анықтап, нысандар арасындағы байланысты орнатады. Бүкіл сахна қабырғалар мен заттар нақты физикалық атрибуттарға ие граф түрінде ұсынылады.&lt;/p&gt;\n&lt;p&gt;«Бақылау-өңдеу-тексеру» (observe-edit-verify) циклі AI-агентке Room.py файлын итеративті түрде нақтылауға мүмкіндік береді. Агент метрикаларды өлшеу, рендерлерді салыстыру және нысандардың тірегін тексеру үшін арнайы құралдарды пайдаланады. Статикалық торлардан айырмашылығы, қорытынды код жоғары геометриялық дәлдікті және MuJoCo ортасында физикалық модельдеуге дайындықты қамтамасыз етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қорытынды модельдің сапасы бастапқы RGB-D деректерінің дәлдігіне және қолданылатын тілдік модельдің мүмкіндіктеріне тікелей байланысты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;h4 id=\"related-work\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#related-work\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RELATED WORK&lt;/span&gt;&lt;/a&gt;RELATED WORK&lt;/h4&gt;\n&lt;p&gt;Indoor Reconstruction and Real-to-Sim. Нақты деректер негізінде интерьерді қайта құру әдістері екіге бөлінеді: дайын CAD модельдерін нүктелер бұлтымен сәйкестендіретін объектіге бағытталған әдістер (Avetisyan et al., 2019; Kuo et al., 2020; Gao et al., 2024) және сахнаның сыртқы түрі мен геометриясын қалпына келтіретін нейрожелілік көрсетілімдерге (NeRF, 3DGS) негізделген әдістер (Mildenhall et al., 2020; Kerbl et al., 2023; Ni et al., 2025). LiteReality (Huang et al., 2025b) және MetaScenes (Yu et al., 2025) жүйелері сканерлеу нәтижелерін активтерге негізделген интерактивті орталарға түрлендіреді. Video2Game (Xia et al., 2024), DRAWER (Xia et al., 2025b) және HoloScene (Xia et al., 2025a) жобалары бейнежазбадан тікелей үш өлшемді әлемдерді қалпына келтіреді, бұл ретте DRAWER қосымша түрде қозғалмалы бөлшектердің буындарын (артикуляциясын) анықтайды. FIRE3D (Xia et al., 2026a) тікелей таралатын нейрожелі көмегімен сахнаның құрамдас активтерін болжайды. Роботтарды оқыту саласында Phone2Proc (Deitke et al., 2023) мобильді суреттер арқылы процедуралық орталарды генерациялайды, RialTo (Torne et al., 2024) басқару стратегияларын жетілдіру үшін цифрлық егіздерді құрады, ал PolaRiS (Jain et al., 2026) оларды бағалау үшін ортаны қайта қалпына келтіреді. Өз кезегінде, ACDC (Dai et al., 2025) ұқсас, бірақ бірдей емес активтерді пайдалана отырып, «цифрлық немере ағайындарды» (digital cousins) жасайды.&lt;/p&gt;\n&lt;p&gt;Object Generation and Articulation. Кескіндер негізінде 3D объектілерді генерациялау әдістері көпжақты синтезден (Liu et al., 2023b; 2024; 2023a; Long et al., 2024) бастап ірі реконструкциялық және генеративті модельдерге дейін (Hong et al., 2024; Xu et al., 2024; Xiang et al., 2026; Hunyuan3D et al., 2025; Chen et al., 2026b) ерекшеленеді. CAST (Yao et al., 2025) генерацияланған объектілерді сахна ішінде сәйкестендіреді, ал URDFormer (Chen et al., 2024) кескіндерден буынды симуляциялық орталарды қалпына келтіреді. Real2Code (Mandi et al., 2025) буын параметрлерін орындалатын код түрінде болжайды, ал Articulate-Anything (Le et al., 2025) артикуляциялық бағдарламаларды итеративті түрде генерациялайды және түзетеді. Articraft (Zhou et al., 2026) бағдарламалық активтер генерациясын арнайы SDK және тексеру ортасымен біріктіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Артикуляция (articulation) үш өлшемді модельдеуде объектінің қозғалмалы қосылыстарының (мысалы, шкаф есігі немесе суырмалы жәшік) сипаттамасы болып табылады, ол физикалық симуляция үшін еркіндік дәрежелерін, айналу осьтерін және қозғалыс шектерін анықтайды.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Language-Guided Scene Authoring. LayoutGPT (Feng et al., 2023) және Holodeck (Yang et al., 2024) мәтіндік сипаттамалар негізінде бөлме жоспарларын генерациялайды. FirePlace (Huang et al., 2025a) және LayoutVLM (Sun et al., 2025b) геометриялық немесе визуалды кері байланыс арқылы жиһаздарды орналастыруды оңтайландырады. 3D-GPT (Sun et al., 2025a), SceneCraft (Hu et al., 2024) және LL3M (Lu et al., 2025) жүйелерінде 3D сахналарды бағдарламалық түрде құру үшін тілдік модельдер қолданылады. The Scene Language (Zhang et al., 2025) сахнаның құрылымы мен сыртқы түрін сипаттау үшін кодты, мәтінді және эмбеддингтерді біріктіреді. SceneSmith (Pfaff et al., 2026), SAGE (Xia et al., 2026b) және SceneWeaver (Yang et al., 2025) көп агентті сахна генерациясы конвейерлерінің жұмысын ұйымдастырады. Blender-Alchemy (Huang et al., 2024) визуалды бақылаумен өңдеуді зерттейді, ал BlenderGym (Gu et al., 2025) графиканы бағдарламалық өңдеуге арналған бенчмарк болып табылады.&lt;/p&gt;\n&lt;p&gt;Agentic Inverse Graphics. SceneScript (Avetisyan et al., 2024) және IG-LLM (Kulits et al., 2024) визуалды деректерден сахнаның құрылымдық сипаттамаларын бөліп алады. VIGA (Yin et al., 2026) «код — рендеринг — нәтижелерді талдау» циклінде жұмыс істейді, ал Thinking in Blender (He et al., 2026) бір кескін бойынша орындалатын кодта сахна параметрлерін баптайды. HARMONY (Sun et al., 2026) монокулярлы реконструкция үшін объектілерді агенттік орналастыруды геометриялық нақтылаумен біріктіреді. Agentic Real2Sim (Chen et al., 2026a) өзара әрекеттесу бейнежазбаларынан физикалық симуляцияларды жинақтау үшін мультимодальды агенттерді тартады. AHa-3D (Xu et al., 2026) блогында камераларды калибрлеу, өлшеу және сапаны бақылау құралдарын пайдалана отырып, бейнеден симуляцияны қалпына келтірудің ұқсас процесі сипатталған. Біздің LiteReality-Agent жүйеміз қозғалмалы активтер мен тұрақты сахна бағдарламасын калибрленген көпжақты тексерумен, сондай-ақ соқтығысулар мен тіректің болуын нақты тексерумен біріктіріп, бөлмелерді метрикалық RGB-D реконструкциялау мәселесін шешеді.&lt;/p&gt;\n&lt;h4 id=\"litereality-agent\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#litereality-agent\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;LITEREALITY-AGENT&lt;/span&gt;&lt;/a&gt;LITEREALITY-AGENT&lt;/h4&gt;\n&lt;p&gt;LiteReality-Agent бөлмені қалпына келтіруді екі кезеңде жүзеге асырады: алдымен сахнаны инициализациялау кезеңінде жалпы жоспар мен негізгі объектілер анықталады, содан кейін агенттік жобалау (agentic authoring) кезеңінде сахнаның орындалатын бағдарламасы «бақылау — өңдеу — тексеру» циклінде итеративті түрде жетілдіріледі (Рис. 2). Іске асыру егжей-тегжейлері мен қосымша мысалдар B қосымшасында берілген.&lt;/p&gt;\n&lt;p&gt;3.1 INPUT: RGB–D SCANS AND DETECTION RESULTS&lt;/p&gt;\n&lt;p&gt;Жүйе үшін кіріс деректері ретінде LiteRealityScan қосымшасынан алынған RGB-D сканерлеу және объектілерді анықтау нәтижелері, соның ішінде бөлме қабырғаларының геометриясы мен объектілердің үш өлшемді шектеуші жақтаулары (bounding boxes) қызмет етеді.&lt;/p&gt;\n&lt;p&gt;3.2 SCENE INITIALISATION&lt;/p&gt;\n&lt;p&gt;LiteReality (Huang et al., 2025b) реттілігін сақтай отырып, біз соңғы жинақтау алдында бөлме қаңқасын бөлек талдаймыз және объектілерді бөлек қалпына келтіреміз. Дегенмен, деректер базасынан дайын активтерді іздеудің орнына, біз оларды тікелей сканер кескіндері негізінде генерациялаймыз.&lt;/p&gt;\n&lt;p&gt;Layout Agent. Бөлме жоспары құрылымдық элементтерді, объектілерді және олардың арасындағы байланыстарды (физикалық тірек, қабырғаларға жанасу, функционалдық топтар және ықтимал соқтығысулар) қамтитын сахна графы түрінде ұсынылады. Бұл байланыстар тікелей физикалық тіректі және ассоциативті байланысты (мысалы, орындық функционалды түрде үстелге жатады, бірақ еденге тіреледі) ажыратуға мүмкіндік береді. Олар сондай-ақ объектілердің рұқсат етілмеген қиылысуын және олардың өлшемдік жақтауларының табиғи беттесуін (мысалы, орындық үстел астына сырғытылғанда) ажыратуға көмектеседі. Жоспарлау агенті (Layout Agent) объектілерді қалпына келтіру басталғанға дейін шулы анықтау нәтижелерін түзетеді. Геометриялық тексерулер көмегімен бөлмеден тыс қалған, қабырғаға кіріп кеткен, ауада ілініп тұрған немесе бір-бірімен рұқсат етілмеген түрде қиылысқан объектілер анықталады. Детерминирленген алгоритмдер объектілердің орналасуы мен өлшемдеріне шағын түзетулер енгізеді. Күмәнді жағдайларда (мысалы, жақтау өлшемі қате болса немесе бірнеше объектілер бірігіп кеткенде) агент кескіндерді визуалды талдауды қолданады. Ұсынылған өзгерістер тек сахнаның геометриялық сәйкестігін жақсартса және бастапқы сканерге қатысты жинақталған қателік шегінен шықпаса ғана қабылданады. Түзетілген шектеуші жақтаулар активтерді генерациялау және оларды соңғы орналастыру үшін негіз болады, бұл сахнаны жинақтау кезінде анықтау қателерінің қайта пайда болуын болдырмайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Жоспарлау агенті активтер генерацияланғанға дейін сахна графы негізінде анықтаудың геометриялық аномалияларын (қиылысулар, ілініп тұрған объектілер) жояды және соңғы жинақтау физикалық тұрғыдан дұрыс жақтауларға негізделетініне кепілдік береді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Object reconstruction. Әрбір объект үшін сканерден ең ақпаратты көріністер таңдалады және олар тазартылған анықтамалық кадрды жасау үшін кескін генерациясы моделімен өңделеді. Құрылымдық немесе қозғалмалы (артикуляцияланған) объектілер процедуралық генерацияға бағытталады, ал визуалды түрде күрделі және негізінен статикалық объектілер TRELLIS.2 (Xiang et al., 2026) моделі көмегімен қалпына келтіріледі. Генерацияланған полигонды торлар (мештер) геометрия ақаулары, бөлінген бөлшектер және топология қателерінің бар-жоғына автоматты түрде тексеріледі. 1-алгоритм агенттің екінші кезеңдегі жұмыс циклін сипаттайды, мұнда ол 1-кестедегі құралдарды пайдалана отырып, бақылаулар негізінде Room.py файлын итеративті түрде өңдейді.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;1-алгоритм: 2-кезеңдегі агенттік жобалау циклі. Агент 1-кестедегі құралдарды пайдалана отырып, бақылаулар негізінде Room.py файлын итеративті түрде өңдейді.\n1: env, tools ← Room.py, defined_tools\n2: observations ← SCAN()\n3: history, turn, qc_passed ← [ ], 0, FALSE\n4: while turn &amp;lt; T and not qc_passed do\n5:     actions ← LLM(observations, env, tools, history)\n6:     result ← EXECUTE(actions, env, observations)\n7:     append (actions, result) to history\n8:     if result ортаны өзгертсе then\n9:         qc_passed, feedback ← QC(env, observations)\n10:        append feedback to history\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"122\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-122\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-122\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-122.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-f1.jpg\" alt=\"Сурет 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-f2.jpg\" alt=\"Сурет 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-f3.jpg\" alt=\"Сурет 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-f4.jpg\" alt=\"Сурет 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 4&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-f6.jpg\" alt=\"Сурет 6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 6&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS1.jpg\" alt=\"Сурет S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS2.jpg\" alt=\"Сурет S2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS3.jpg\" alt=\"Сурет S3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS4.jpg\" alt=\"Сурет S4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S4&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS5.jpg\" alt=\"Сурет S5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S5&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS6.jpg\" alt=\"Сурет S6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S6&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS7.jpg\" alt=\"Сурет S7\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S7&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS8.jpg\" alt=\"Сурет S8\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S8&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS9.jpg\" alt=\"Сурет S9\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S9&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&
