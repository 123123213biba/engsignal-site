        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"151\" cy=\"93\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"569\" cy=\"223\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · CAD_PARAMETRIC   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Gaussian Stippling: 3D&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;рендерингті сапаны жоғалтпай&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;жеделдету&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render-f1.jpg\" alt=\"Сурет 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Дәстүрлі 3D Gaussian Splatting қабаттарды терең сұрыптауды талап етеді, бұл шектеулі ресурстары бар құрылғыларда жұмысты баяулатады. Gaussian Stippling әдісі альфа-араластыруды стохастикалық таңдаумен алмастырып, сұрыптау қажеттілігін жояды. Гибридті жүйе мен нейрондық желілік реконструкция жоғары кадр жиілігін визуалды айқындықпен үйлестіреді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Альфа-араластыруды стохастикалық таңдаумен алмастыру сұрыптауды жояды.&lt;/li&gt;\n&lt;li&gt;Гибридті рендерер примитивтерді мөлдірлігіне қарай оңтайландырады.&lt;/li&gt;\n&lt;li&gt;Нейрондық желілік реконструкция шуды өткен кадрлар көмегімен басады.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Стандартты 3DGS реттелген альфа-композитингті қолданады, мұнда әрбір примитивтің үлесі T_i(x) = Π_{j&amp;lt;i} (1-α_j(x)) формуласы арқылы есептеледі. Бұл тереңдік бойынша сұрыптауды (depth sorting) талап етеді және көптеген примитивтермен жұмыс істегенде басты кедергіге айналады. Gaussian Stippling дискретті модельге көшеді, мұнда әрбір примитив өз альфа-мәніне тең ықтималдықпен қабылданады.&lt;/p&gt;\n&lt;p&gt;Гибридті рендерер примитивтерді олардың проекциялық ауданы мен мөлдірлігіне қарай фрагменттік және примитивтік ағындарға бөледі. Аз таңдаулармен (1-spp) туындайтын шуды басу үшін жеңіл нейрондық желі ағымдағы және өткен кадрлардағы деректерді біріктіреді. 1-spp конфигурациясында әдіс 1080p ажыратымдылығында базалық 3DGS-пен салыстырғанда 2,3–2,7 есе жоғары өнімділікке қол жеткізеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әдіс шу мен өнімділік арасындағы тепе-теңдік үшін таңдаулар санын (spp) баптауды талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Дәстүрлі 3D Gaussian Splatting (3DGS) әдісі бір-бірінің үстіне түсетін примитивтерді дұрыс көрсету үшін тереңдік бойынша сұрыптауды және реттелген альфа-араластыруды талап етеді. Бұл жұмыста сұрыптауды қажет етпейтін тәсіл ұсынылады: стохастикалық мөлдірлік арқылы бөлшектік альфа мәндері дискретті көріну үлгілерімен алмастырылады. Авторлар «Gaussian Stippling» деп атаған бұл процесс рендерингті объектілердің ретіне тәуелсіз жүзеге асыруға мүмкіндік береді. Жүйе примитивті және фрагменттік стипплинг әдістерін бейімделгіш түрде біріктіріп, рендеринг жылдамдығын оңтайландырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Стохастикалық мөлдірлік — бұл көп қабатты мөлдірлікті орташа есептеудің орнына кездейсоқ нүктелерді таңдау әдісі, ол объектілерді қашықтыққа қарай сұрыптау қажеттілігінен арылтады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Үлгілер саны аз болғанда (spp) туындайтын кеңістіктік және уақыттық шуды басу үшін жеңілдетілген кеңістіктік-уақыттық реконструкция нейрожелісі әзірленді. Ол Гаусс атрибуттарын пайдаланып, ағымдағы деректерді қайта проецияланған тарихи бақылаулармен біріктіреді. Модель әртүрлі көріністер жиынтығында оқытылған және 3DGS активтерін өзгертпей немесе қайта оқытпай жаңа деректермен жұмыс істей алады.&lt;/p&gt;\n&lt;p&gt;Белгілі бір көрініс үшін оқытылған кезде, 1-spp (әр пиксель үшін 1 үлгі) болатын ықшам конфигурация 1080p ажыратымдылығында стандартты 3DGS-пен салыстырғанда 2,3–2,7 есе жоғары өткізу қабілетін қамтамасыз етеді. 16-spp конфигурациясы барлық үш сынақ жиынтығында жоғарырақ орташа PSNR мәнін көрсетеді, дегенмен ол көбірек есептеу ресурстарын талап етеді. Әдіс мобильді құрылғыларда интерактивті режимде сәтті сыналды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ұсынылған әдіс 1-spp жағдайында рендеринг жылдамдығын 2,3–2,7 есеге арттырады және 16-spp жағдайында кескін сапасын жақсартады, бұл мобильді құрылғыларда жұмыс істеуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;3D Gaussian Splatting (3DGS) технологиясы айқын Гаусс примитивтерін тиімді растеризациялау арқылы нақты уақыт режимінде жаңа көріністерді синтездеуге мүмкіндік береді. Алайда, бұл әдіс тереңдік бойынша сұрыптауға және реттелген композитингке тәуелді, бұл примитивтер саны көп болғанда немесе ресурстары шектеулі құрылғыларда өнімділікті шектейді. Қазіргі балама әдістер рендеринг парадигмасын немесе примитивтер құрылымын өзгертеді, бұл оларды дайын 3DGS активтерімен тікелей қолдануды қиындатады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ұсынылған «Гаусс штрихтау» (Gaussian stippling) әдісі 3DGS активтерін сұрыптаусыз, стохастикалық көріну таңдамаларын қолдану арқылы рендерингтеуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Стандартты 3DGS-тен айырмашылығы, мұнда үздіксіз Гаусс дақтарының орнына дискретті, мөлдір емес үлгілер (stipples) жасалады және олар стандартты тереңдік тесті арқылы бәсекелеседі. Авторлар фрагментке негізделген және примитивке негізделген штрихтау әдістерін біріктіретін гибридті рендерерді әзірледі. Ол әрбір Гаусс элементін оның мөлдірлігі мен проекцияланған өлшеміне қарай ең тиімді әдіске бағыттайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Стохастикалық таңдау (Monte-Carlo) — бұл күрделі визуализация процесін кездейсоқ таңдамалар арқылы бағалау әдісі, ол объектілерді сұрыптау қажеттілігін жояды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Төмен таңдамалы (low-spp) рендеринг нәтижесінде пайда болатын кеңістіктік шу мен жыпылықтауды жою үшін қосымша өңдеу қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Шуды азайту үшін авторлар кеңістіктік-уақыттық реконструкция жасайтын жеңіл нейрондық желіні қолданады. Ол ағымдағы кадр деректерін алдыңғы кадрлардан алынған Гаусс атрибуттарымен (мөлдірлік, ковариация, тереңдік) біріктіреді. Rasm 1-де көрсетілгендей, бұл тәсіл модельді әр көрініс үшін қайта оқытпастан шуды тиімді басады. Жүйе мобильді құрылғыларда да жоғары жылдамдықта жұмыс істейді және жалпы, сондай-ақ мамандандырылған (көрініске бейімделген) режимдерде жоғары сапаны қамтамасыз етеді.&lt;/p&gt;\n&lt;h4 id=\"stohastikalykh-tangdamalar-negizinde-nejrondykh-rekonstrukciya\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#stohastikalykh-tangdamalar-negizinde-nejrondykh-rekonstrukciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Стохастикалық таңдамалар негізінде нейрондық реконструкция&lt;/span&gt;&lt;/a&gt;Стохастикалық таңдамалар негізінде нейрондық реконструкция&lt;/h4&gt;\n&lt;p&gt;Кескінге негізделген рендерингте дискретті, құрылымдалмаған геометриялық проксилерден жоғары сапалы кескіндерді синтездеу негізгі мәселе болып табылады. Нейрондық нүктелік графика (NPBG) және кешіктірілген нейрондық рендеринг жүйелері терең конволюциялық желілердің (мысалы, U-Net) сирек нүктелік белгілерден фотореалистикалық кескіндерді тиімді қалпына келтіре алатынын дәлелдеді. Біздің тәсіл бірдей ракурстың қайталанатын рендерлері арасындағы стохастикалық көріну өзгерістерін ескереді және оны бір-бірінің үстіне түсетін жартылай мөлдір Гаусс примитивтеріне бейімдейді.&lt;/p&gt;\n&lt;p&gt;Стохастикалық таңдамалардан реконструкциялау жолдарды қадағалау (path tracing) әдістеріне сүйенеді, мұнда шулы бақылауларды сүзу үшін нейрондық желілер қолданылады. Біздің әдіс әрбір бақылауда Гаусс-локалды дескрипторларын сақтайды; әр кадр үшін бірнеше бақылауды пайдаланғанда, біз реконструкция алдында бұл дескрипторларды арналар бойынша орташалаймыз. Тереңдік пен альбедо сияқты қосалқы белгілер реконструкция үшін бағдар береді, алайда бір беттік сипаттама барлық Гаусс «сплэттерінің» үлесін қамти алмауы мүмкін. Сол себепті, біз примитивтердің проекцияланған ізін, мөлдірлігін және тереңдігін кодтайтын локалды дескрипторларды бөліп аламыз.&lt;/p&gt;\n&lt;p&gt;Кеңістіктік-уақыттық теңестіру 1-spp (әр пиксельге бір таңдама) рендерингінде сапаны арттыру үшін маңызды. Дәстүрлі нақты уақыт режиміндегі конвейерлер тұрақты беттік қозғалыс векторларын пайдаланып кері репроекцияға сүйенеді. Стохастикалық 3DGS рендерингінде пиксельдегі көрінетін Гаусс элементі өзгеруі мүмкін, бұл уақыттық теңестіруді қиындатады. Біз тарихи бақылау карталарының тікелей репроекциясын қолданамыз.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әдіс Гаусс локалды дескрипторлары мен тарихи деректердің тікелей репроекциясын біріктіріп, шулы стохастикалық таңдамалардан сапалы кескіндерді қалпына келтіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"aedis\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#aedis\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдіс&lt;/span&gt;&lt;/a&gt;Әдіс&lt;/h4&gt;\n&lt;p&gt;Оқытылған 3D Гаусс кескіні G және мақсатты камера C_t берілген болса, мақсат сахнаны өзгертпестен кескінді реконструкциялау болып табылады. Процесс екі кезеңнен тұрады (2-сурет). Біріншіден, гибридті рендеринг құралы әр примитивті примитивке негізделген немесе фрагментке негізделген таңдама алу ағынына бағыттайды. Екіншіден, әр қабылданған таңдама локалды дескриптормен толықтырылады және тарихи кадрлар мақсатты көрініске тікелей репроекцияланады; жеңіл конволюциялық желі D_θ соңғы кескінді қалпына келтіреді.&lt;/p&gt;\n&lt;p&gt;Әр кадр үшін біз M тәуелсіз стохастикалық бақылауды генерациялаймыз және O_t^M алу үшін олардың дескрипторларын орташалаймыз (Mspp таңдама бюджеті). Соңғы кіріс X_t ағымдағы кадр мен K=3 алдыңғы кадрлардың агрегацияланған карталарын біріктіру арқылы қалыптасады. Реконструкция процесі &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BI%7D_t%20%3D%20D_%20heta(X_t)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; формуласымен өрнектеледі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тікелей репроекция — бұл деректерді алдыңғы кадрлардан ағымдағы кадрға көшіру әдісі, ол ағымдағы «шулы» кадрдағы ақпарат тапшылығын толтыруға көмектеседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"gibridti-stohastikalykh-bakhylaulardy-generaciyalau\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#gibridti-stohastikalykh-bakhylaulardy-generaciyalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Гибридті стохастикалық бақылауларды генерациялау&lt;/span&gt;&lt;/a&gt;Гибридті стохастикалық бақылауларды генерациялау&lt;/h4&gt;\n&lt;p&gt;Әдіс 3D Gaussian Splatting-тегі альфа-араластырудың ықтималдық интерпретациясына негізделген. Әрбір пиксель x және &lt;span class=\"yfm-latex\" data-content=\"(%5Cmu_i%2C%20%5CSigma_i%2C%20o_i%2C%20c_i%2C%20z_i)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; параметрлері бар гауссиан үшін &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Calpha%7D_i(x)%20%5Csim%20%20ext%7BBernoulli%7D(%5Calpha_i(x))\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; бинарлы қабылдау индикаторы енгізіледі. Егер &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Calpha%7D_i(x)%3D1\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; болса, гауссиан сақталады, әйтпесе алынып тасталады. Қабылданған үміткерлердің ішінен тереңдігі z_i ең кішісі таңдалады. Математикалық тұрғыдан бұл тәсіл стандартты альфа-композитингтің ығыспаған (unbiased) бағасы болып табылатыны дәлелденген, өйткені пиксель түсінің &lt;span class=\"yfm-latex\" data-content=\"E%5B%5Chat%7BI%7D_%7BST%7D(x)%5D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; математикалық күтімі классикалық рендеринг IGS(x) нәтижесімен сәйкес келеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бернулли үлестіріміне негізделген стохастикалық таңдау классикалық альфа-араластыруға тең ығыспаған бағаны береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Өнімділікті арттыру үшін примитивтерді «маршруттау» (routing) қолданылады. Проекция ауданы &lt;span class=\"yfm-latex\" data-content=\"A%20%3D%20%5Cpi%20%5Csqrt%7B%2F%5CSigma%2F%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; үлкен гауссиандар растеризация (фрагменттік ағын) арқылы, ал кішілері нүктелер генерациясы (примитивтік ағын) арқылы өңделеді. Таңдау критерийі &lt;span class=\"yfm-latex\" data-content=\"S(o%2C%20A)%20%3D%20%5Cbeta_0%20%2B%20%5Cbeta_1%20%5Clog_2%20A%20%2B%20%5Cbeta_2%20o%20%2B%20%5Cbeta_3%20o%20%5Clog_2%20A\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; регрессия функциясымен анықталады. Егер S(o, A) &amp;gt; 0 болса, примитив фрагменттік ағынға, әйтпесе примитивтік ағынға бағытталады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Маршруттау — бұл жүктемені динамикалық бөлу: ірі объектілер аппараттық (фрагменттер), ал ұсақтары кездейсоқ нүктелер генерациясы арқылы рендерленеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Примитивтік ағында қарқындылығы λ = 2A Li₂(o) болатын Пуассон процесі қолданылады. Нүктелер координаталары x Холецкий декомпозициясы арқылы &lt;span class=\"yfm-latex\" data-content=\"%5CSigma\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ковариациялық матрицасын ескеретін кері Бокс-Мюллер түрлендіруі арқылы жасалады.&lt;/p&gt;\n&lt;h4 id=\"fragmenttik-tangdau-aghyny\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#fragmenttik-tangdau-aghyny\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Фрагменттік таңдау ағыны&lt;/span&gt;&lt;/a&gt;Фрагменттік таңдау ағыны&lt;/h4&gt;\n&lt;p&gt;Фрагменттік ағында гауссиандар &lt;span class=\"yfm-latex\" data-content=\"%5COmega\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; аймағында τ_F кесу шегімен растеризацияланады. Тиімді қабылдау ықтималдығы &lt;span class=\"yfm-latex\" data-content=\"%5Calpha_%7Beff%7D%5EF(x)%20%3D%20%5Calpha(x)%20%5Ccdot%201_%7Bx%20%5Cin%20%5COmega%7D%20%5Ccdot%201_%7B%5Calpha(x)%20%3E%20%20au_F%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; құрайды. Екі ағынның нәтижелерін біріктіру үшін гибридтік рендерер &lt;span class=\"yfm-latex\" data-content=\"A_P(x)%20%5Ccup%20A_F(x)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; үміткерлер жиынынан тереңдігі z_p ең кішісін таңдайды.&lt;/p&gt;\n&lt;h4 id=\"kengistiktik-uakhyttykh-gauss-bakhylaulary\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#kengistiktik-uakhyttykh-gauss-bakhylaulary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кеңістіктік-уақыттық Гаусс бақылаулары&lt;/span&gt;&lt;/a&gt;Кеңістіктік-уақыттық Гаусс бақылаулары&lt;/h4&gt;\n&lt;p&gt;Әрбір бақылау үшін 10 арналы дескриптор s_t(x) = [c(x), α(x), δ²(x), o, q, z⁻¹] қалыптастырылады, мұнда δ²(x) — Махаланобис қашықтығының квадраты, q — ковариация коэффициенттері. M тәуелсіз таңдаманы орташалау OM_t(x) бақылау картасын береді. Нейрондық желі үшін қорытынды кіріс сигналы X_t(x) ағымдағы және K=3 алдыңғы кадрлардың t уақыт сәтіне forward warping әдісімен проекцияланған OM карталарын конкатенациялау арқылы алынады.&lt;/p&gt;\n&lt;h4 id=\"nejrondy-rekonstrukciyalau\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#nejrondy-rekonstrukciyalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нейронды реконструкциялау&lt;/span&gt;&lt;/a&gt;Нейронды реконструкциялау&lt;/h4&gt;\n&lt;p&gt;Реконструкциялау процесі U-Net архитектурасы мен пикселдік MLP-блок негізінде жүзеге асады. Қорытынды кескін &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BI%7D_t\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; жергілікті Flocal^t және контекстік Fcontext^t белгілерді біріктіру арқылы қалыптасады. Оқыту Charbonnier айыппұл функциясы Lchar мен градиенттік сәйкестік мүшесі Lgrad қосындысынан тұратын L функциясы арқылы жүргізіледі:&lt;br /&gt;\nL = Lchar + λgradLgrad, (2)&lt;br /&gt;\n&lt;span class=\"yfm-latex\" data-content=\"L_%7Bchar%7D%20%3D%20%5Cfrac%7B1%7D%7BN%7D%20%5Csum_p%20%5Csqrt%7B%5C%2F%5Chat%7BI%7D_t(p)%20-%20I_%7BGT%7D%5Et(p)%5C%2F%5E2%20%2B%20%5Cepsilon%5E2%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, (3)&lt;br /&gt;\n&lt;span class=\"yfm-latex\" data-content=\"L_%7Bgrad%7D%20%3D%20%5Cfrac%7B1%7D%7BN%7D%20%5Csum_p%20%5Csum_%7Bd%20%5Cin%20%5C%7Bx%2Cy%5C%7D%7D%20%5C%2F%0Aabla_d%20%5Chat%7BI%7D_t(p)%20-%20%0Aabla_d%20I_%7BGT%7D%5Et(p)%5C%2F_1\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, (4)&lt;br /&gt;\nмұндағы N — пикселдер саны, ε — кіші тұрақты шама. Градиенттік мүше кескін шекаралары мен құрылымын сақтауда шешуші рөл атқарады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Charbonnier және градиенттік шығын функцияларын біріктіру кескіннің ұсақ бөлшектері мен шекараларын жоғары дәлдікпен қалпына келтіруге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"eksperimenttik-khondyrghy\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#eksperimenttik-khondyrghy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эксперименттік қондырғы&lt;/span&gt;&lt;/a&gt;Эксперименттік қондырғы&lt;/h4&gt;\n&lt;p&gt;Бағалау Mip-NeRF 360, Tanks and Temples және Deep Blending жиынтықтарындағы 11 көріністе жүргізілді. Әр көрініс үшін жеке желі оқытылды, ал Gaussian-көрінісі өзгеріссіз қалдырылды. Кадрлар арасына кемінде K ≥ 3 аралық көрініс енгізілді, камераның ығысуы 0,05 бірлікпен және бұрылуы 3^° шегінде шектелді. Stochastic Splats (SS), Gaussian Point Splatting (GPS), MobileGS және MiniSplatting әдістерімен салыстыру жүргізілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Gaussian-көрінісі — 3D көріністі 3D-гауссиандар жиынтығы ретінде көрсету әдісі, олар рендеринг кезінде кескін жазықтығына проекцияланады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Имплементация PyTorch (оқыту) және Vulkan/GLSL (инференс) көмегімен орындалды. Оптимизация AdamW арқылы 2000 эпоха бойы, 100 эпохалық warmup және 1 × 10⁻⁴-тен 5 × 10⁻⁶-ға дейінгі косинустық кему кестесімен жүзеге асырылды.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 1.&lt;/strong&gt; Quality against ground truth at the training resolution; throughput at 1080p. The first three rows report renderer-only FPS; Ours-S/L rows include rendering and reconstruction. Best/second-best PSNR and FPS within each block are bold/underlined; tiessharerank.∗MobileGSoptimizationproducedNaNsonTanks&amp;amp;Temples.†MobileGSFPSincludesitsview-dependent MLP (TensorRT) and rasterization; its released timing code omits the MLP.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render-tT1.jpg\" alt=\"Кесте 1\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"tutas-rekonstrukciyalau\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#tutas-rekonstrukciyalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тұтас реконструкциялау&lt;/span&gt;&lt;/a&gt;Тұтас реконструкциялау&lt;/h4&gt;\n&lt;p&gt;Ours-S нұсқасы 1 spp кезінде 283,17–305,32 FPS жылдамдыққа жетеді, бұл 3DGS-тен 2,3–2,7 есе жылдам. Ауқымдырақ Ours-L (16 spp) моделі PSNR бойынша 3DGS-тен асып түседі. Реконструкциялау уақыты Ours-S үшін 1,78 мс, ал Ours-L үшін 11,31 мс құрайды. Абляциялық зерттеулер (2-кесте) уақытша тарих пен дескрипторлардың маңыздылығын растайды. DL3DV деректеріндегі кросс-көріністік бағалауда (3-кесте) Ours-S моделі SS және GPS базалық әдістерінен жоғары PSNR көрсеткішін тіркеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нәтижелер көрініске байланысты; кросс-көріністік валидацияда модель жақсы жалпылау қабілетін көрсетеді, бірақ мақсатты деректерде оқытылған 3DGS дәлдігіне жетпейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kholdanyluy-mobildi-platformada-engizu-zhaene-grafika-men-esepteulerdi-bir-mezgilde-oengdeu\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#kholdanyluy-mobildi-platformada-engizu-zhaene-grafika-men-esepteulerdi-bir-mezgilde-oengdeu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қолданылуы: мобильді платформада енгізу және графика мен есептеулерді бір мезгілде өңдеу&lt;/span&gt;&lt;/a&gt;Қолданылуы: мобильді платформада енгізу және графика мен есептеулерді бір мезгілде өңдеу&lt;/h4&gt;\n&lt;p&gt;Авторлар ұсынылған әдістің шектеулі ресурстары бар құрылғылардағы тиімділігін бағалау үшін оны мобильді платформаға бейімдеді. 540p ажыратымдылығында әзірленген рендерер орташа есеппен 92,6 FPS өнімділігін көрсетеді. Салыстыру үшін: Stochastic Splats (SS) көрсеткіші 53,3 FPS, ал Gaussian Point Splatting (GPS) көрсеткіші 49,0 FPS құрайды. Реконструкциялау үшін ықшам нейрондық желі архитектурасын қолданып, есептеулерді кіріктірілген нейрондық процессор (NPU) арқылы жүргізгенде, жылдамдық 73,2 FPS-ке жетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әдіс 540p ажыратымдылығында 92,6 FPS жылдамдығын қамтамасыз етеді, бұл аналогтардан (SS — 53,3 FPS, GPS — 49,0 FPS) әлдеқайда жоғары және мобильді құрылғыларда NPU көмегімен 73,2 FPS деңгейінде жұмыс істейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;3DGS-GL үшін базалық модель ретінде Splatapult алгоритмі алынды. Интерактивті іске асыру қорытынды кескіндердің сапасын арттыру үшін қайта проецияланған уақытша жинақтау (reprojected temporal accumulation) әдісін қолданады. Өнімділік бойынша салыстырмалы деректер 1-кестеде көрсетілген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қайта проецияланған уақытша жинақтау — бұл камераның қозғалысын ескере отырып, ағымдағы және алдыңғы кадрлардағы деректерді біріктіру арқылы кескін сапасын жақсарту әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;1-кесте. Әртүрлі көріністердегі өнімділікті (FPS) салыстыру&lt;/p&gt;\n&lt;p&gt;/ Әдіс / Truck / Room / DrJohnson / Орт. /&lt;br /&gt;\n/ :--- / :--- / :--- / :--- / :--- /&lt;br /&gt;\n/ 3DGS-GL / 5,46 / 12,8 / 3,2 / 7,15 /&lt;br /&gt;\n/ SS / 24,8 / 65,8 / 69,4 / 53,3 /&lt;br /&gt;\n/ GPS / 41,3 / 52,8 / 53,0 / 49,03 /&lt;br /&gt;\n/ SortfreeGS / 37,2 / 50,3 / 27,2 / 38,2 /&lt;br /&gt;\n/ MobileGS / – / 32,6 / 28,1 / 30,4 /&lt;br /&gt;\n/ Біздің әдіс (1-spp) / 78,8 / 112,7 / 86,3 / 92,6 /&lt;br /&gt;\n/ Біздің әдіс (1-spp + S) / 64,6 / 86,7 / 68,3 / 73,2 /&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 2.&lt;/strong&gt; Ours-S көмегімен уақытша тарих пен Гаусс жергілікті дескрипторларын абляциялау&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Әдіс&lt;/th&gt;\n&lt;th&gt;Mip-NeRF360 (PSNR↑/SSIM↑/LPIPS↓/FPS↑)&lt;/th&gt;\n&lt;th&gt;Tanks&amp;amp;Temples (PSNR↑/SSIM↑/LPIPS↓/FPS↑)&lt;/th&gt;\n&lt;th&gt;Deep Blending (PSNR↑/SSIM↑/LPIPS↓/FPS↑)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;StochasticSplats&lt;/td&gt;\n&lt;td&gt;17.29/0.2427/0.8942/664.95&lt;/td&gt;\n&lt;td&gt;13.30/0.1754/0.9961/843.08&lt;/td&gt;\n&lt;td&gt;21.61/0.3562/0.8063/556.03&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Gaussian Point Splatting&lt;/td&gt;\n&lt;td&gt;17.28/0.2413/0.8947/620.56&lt;/td&gt;\n&lt;td&gt;13.30/0.1749/0.9961/440.99&lt;/td&gt;\n&lt;td&gt;21.60/0.3559/0.8065/438.95&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ours (1-spp)&lt;/td&gt;\n&lt;td&gt;17.28/0.2407/0.8947/880.07&lt;/td&gt;\n&lt;td&gt;13.29/0.1738/0.9965/1001.78&lt;/td&gt;\n&lt;td&gt;21.61/0.3559/0.8065/1024.15&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;3DGS&lt;/td&gt;\n&lt;td&gt;28.90/0.8708/0.1856/122.18&lt;/td&gt;\n&lt;td&gt;23.39/0.8421/0.1837/113.19&lt;/td&gt;\n&lt;td&gt;29.52/0.9038/0.2459/111.18&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;MobileGS†&lt;/td&gt;\n&lt;td&gt;28.20/0.8570/0.2103/234.97&lt;/td&gt;\n&lt;td&gt;-∗/-∗/-∗/-∗&lt;/td&gt;\n&lt;td&gt;30.07/0.9109/0.2486/292.26&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Mini. + Ours (1-spp + S)&lt;/td&gt;\n&lt;td&gt;26.92/0.8055/0.2607/345.31&lt;/td&gt;\n&lt;td&gt;22.31/0.7723/0.2830/343.51&lt;/td&gt;\n&lt;td&gt;29.48/0.8983/0.2703/344.11&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ours (1-spp + S)&lt;/td&gt;\n&lt;td&gt;27.72/0.8120/0.1949/283.17&lt;/td&gt;\n&lt;td&gt;22.72/0.7780/0.2075/305.32&lt;/td&gt;\n&lt;td&gt;29.33/0.8952/0.1895/301.10&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ours (4-spp + S)&lt;/td&gt;\n&lt;td&gt;28.23/0.8344/0.2321/159.59&lt;/td&gt;\n&lt;td&gt;22.98/0.7904/0.2656/173.77&lt;/td&gt;\n&lt;td&gt;29.48/0.8999/0.2591/160.01&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ours (16-spp + L)&lt;/td&gt;\n&lt;td&gt;29.08/0.8606/0.1561/40.43&lt;/td&gt;\n&lt;td&gt;23.68/0.8252/0.1570/40.36&lt;/td&gt;\n&lt;td&gt;29.70/0.9065/0.1735/38.05&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Барлық PSNR мәндері стандартты 3DGS мақсатына қатысты бағаланған.&lt;/em&gt;&lt;/p&gt;\n&lt;h3 id=\"khorytyndy\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды&lt;/span&gt;&lt;/a&gt;Қорытынды&lt;/h3&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 3.&lt;/strong&gt; PSNRonheld-outDL3DVviewswithrespectto photographic ground truth. Avg. is the arithmetic mean over the five scenes. The best and second-best values are shown in bold and underlined, respectively. SS (4-spp), GPS (4-spp), and Ours (1-spp + S) run at 353.32, 282.91, and 353.43 FPS, respectively.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render-tT3.jpg\" alt=\"Кесте 3\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"negizgi-khorytyndylar-men-shekteuler\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#negizgi-khorytyndylar-men-shekteuler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Негізгі қорытындылар мен шектеулер&lt;/span&gt;&lt;/a&gt;Негізгі қорытындылар мен шектеулер&lt;/h4&gt;\n&lt;p&gt;Ұсынылған әдіс 3D-көріністерді рендерингтеу кезінде сұрыптауды (sorting) қажет етпейтін Гаусс стохастикалық таңдау (sampling) жүйесіне негізделген. Үздіксіз Гаусс сплаттарын дискретті көріну үлгілеріне түрлендіру арқылы гибридті сэмплер 3DGS активтерін өзгертпестен, примитивті және фрагментке негізделген тәсілдердің артықшылықтарын біріктіреді. Гаусс құрылымын ескеретін кеңістіктік-уақыттық реконструкция ағымдағы және тарихи деректерді біріктіріп, аз таңдаулы рендерингте шуды тиімді басады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әдіс сұрыптаусыз тиімді рендерингті қамтамасыз етеді, стохастикалық таңдау мен кеңістіктік-уақыттық сүзу арқылы шуды азайтады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жүйе екі режимді қолдайды: әртүрлі көріністер үшін жалпы реконструкция моделі және жоғары сапа үшін арнайы көрініс конфигурациясы. Негізгі шектеу — сирек стохастикалық бақылаулардан реконструкциялау кезінде жоғары жиілікті бөлшектердің шамадан тыс тегістелуі. Бұл әсіресе нәзік құрылымдарда, көрінудің өткір ауысуларында және бұрышқа тәуелді бөлшектерде айқын көрінеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Дискреттеудің төмен жылдамдығында деректердің жетіспеушілігі мен реконструкция функциясының ерекшелігіне байланысты ұсақ бөлшектер жоғалуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Болашақтағы перспективалы бағыт — Гаусс кескінін, таңдау стратегиясын және реконструкция желісін түпкілікті кескін сапасы үшін бірлесіп оңтайландыратын тұтас (end-to-end) оқыту жүйесі. Мұндай сапаға бағытталған режим нәзік бөлшектерді жақсырақ сақтай алады, бірақ бұл қазіргі бекітілген активтермен жұмыс істеуден өзгеше, әр көрініс үшін қосымша оңтайландыруды талап етеді.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render-f1.jpg\" alt=\"Сурет 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render-f2.jpg\" alt=\"2-сурет: Біз ұсынған Гаусс нүктелі кескіндеу және реконструкциялау конвейеріне шолу.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет: Біз ұсынған Гаусс нүктелі кескіндеу және реконструкциялау конвейеріне шолу.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-сурет: Біз ұсынған Гаусс нүктелі кескіндеу және реконструкциялау конвейеріне шолу. 1-кезеңде N Гаусс примитивін қамтитын 3DGS активі берілгенде, шығынды ескеретін маршруттау стратегиясы NF примитивтерін фрагментке негізделген ағынға, ал қалған примитивтерді NP стохастикалық таңдама нүктелерін генерациялайтын примитивке негізделген ағынға бөледі. Содан кейін ортақ тереңдік тесті ағымдағы кадрдың бақылауын қалыптастыру үшін қабылданған нүктелерді олардың жергілікті Гаусс дескрипторларымен бірге таңдайды. 2-кезеңде реконструкциялау желісі реконструкцияланған кескінді жасау үшін ағымдағы бақылауды және алға қарай проекцияланған тарихи бақылауларды біріктіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render-f5.jpg\" alt=\"Сурет 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 5&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render-fS2.jpg\" alt=\"Сурет S2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render-fS5.jpg\" alt=\"A5-сурет: Нейрондық реконструкция сапасы мен жергілікті көрініс бөлшектерін көрсететін 16 spp + үлкен желідегі қосымша к\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;A5-сурет: Нейрондық реконструкция сапасы мен жергілікті көрініс бөлшектерін көрсететін 16 spp + үлкен желідегі қосымша көріністердің сапалық нәтижелері.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Қабаттарды&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сұрыптаудың&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жоғары құны&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&
