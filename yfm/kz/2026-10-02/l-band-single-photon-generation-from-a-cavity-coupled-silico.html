        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"139\" cy=\"137\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"681\" cy=\"261\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · OTHER   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Кремний C-орталықтары:&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;L-диапазонындағы кванттық&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;желілер үшін жаңа стандарт&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/l-band-single-photon-generation-from-a-cavity-coupled-silico-f1.jpg\" alt=\"Сурет 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Зерттеушілер нанофотондық резонаторды қолдана отырып, кремний құрылымындағы жалғыз C-орталықты сәтті бөліп алды. Бұл Парселл эффектісінің арқасында ақаудың спонтанды сәулеленуін бес есе жылдамдатуға мүмкіндік берді. Алынған жалғыз фотон көзі L-диапазонында жұмыс істейді, бұл оптикалық талшық арқылы минималды шығынмен деректерді тасымалдау үшін өте маңызды.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-02/l-band-single-photon-generation-from-a-cavity-coupled-silico.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;g^(2)(0) = 0,23 болатын жалғыз C-орталық бөлінді.&lt;/li&gt;\n&lt;li&gt;Өмір сүру уақыты 5 есе қысқарып, 0,287 мкс болды.&lt;/li&gt;\n&lt;li&gt;1570 нм диапазоны оптикалық талшық үшін идеал.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-02/l-band-single-photon-generation-from-a-cavity-coupled-silico.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;C-орталығы кремний торындағы көміртегі мен оттегі (Ci-Oi) кешені болып табылады. Оның нөлдік фонондық сызығы (ZPL) 1565–1625 нм диапазонында орналасқан, бұл оптикалық талшықтың ең жоғары өткізгіштік терезесіне сәйкес келеді. Жалғыз эмитентті оқшаулау үшін авторлар кремний-изолятор (SOI) негізіндегі бір өлшемді фотондық-кристалдық резонаторды қолданды. Резонатордың сапа коэффициенті (Q) (1,4±0,3)×10^4 құрады, бұл ZPL (1569,831 нм) резонансына сәйкестендіруге мүмкіндік берді.&lt;/p&gt;\n&lt;p&gt;Резонатор модасымен әрекеттесу кезінде қозған күйдің өмір сүру уақыты 1,45±0,08 мкс-тен 0,287±0,002 мкс-ке дейін қысқарды. Бұл Парселл факторының (FP) төменгі шегі ≥ 33 екенін көрсетеді. Жалғыз фотондық сәулелену сапасы фондық түзетусіз g^(2)(0) = 0,23 екінші ретті автокорреляциялық функциясымен расталды. Тәжірибелер 8 К температурада 800 нм лазерлік сорғымен жүргізілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нәтижелер 8 К криогендік температурада алынды және тиімділік қараңғы триплеттік күйлердің болуымен шектелген.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-02/l-band-single-photon-generation-from-a-cavity-coupled-silico.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Кремний фотоникасында жалғыз фотон көздерін монолитті интеграциялау ауқымды кванттық телекоммуникациялық архитектураларды құру үшін маңызды шешім болып табылады. Кремнийдегі түстік орталықтардың ішінде C-орталығы телекоммуникациялық L-диапазонында (1565–1625 нм) нөлдік фонондық эмиссияға ие, бұл оптикалық талшықтардағы минималды таралу шығындары терезесіне сәйкес келеді. Осы артықшылыққа қарамастан, жалғыз C-орталықтарын оқшаулау қатты денелі кванттық оптикада шешілмеген мәселе болып келді. Бұл жұмыста авторлар алғаш рет жалғыз кремний C-орталығын оқшаулауды жүзеге асырды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нанофотонды кристалды резонатордың көмегімен қозған күйдің өмір сүру уақыты 5 есеге қысқартылды (0,287 мкс-ке дейін), бұл F_P ≥ 33 Парселл факторына сәйкес келеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Парселл эффектісі — резонатордың көмегімен кванттық эмитенттің спонтанды сәулелену жылдамдығын арттыру процесі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Кіші модалық көлемді фотонды кристалды резонатор арқылы нөлдік фонондық сызықтың спонтанды сәулелену жылдамдығы айтарлықтай арттырылды. Екінші реттік автокорреляциялық өлшеулер эмитенттен жалғыз фотондардың шығатынын растады, мұнда фондық сигналды түзетпестен оптикалық тазалық g⁽²⁾(0) = 0,23 мәніне жетті. Бұл нәтижелер кремний негізіндегі L-диапазонды кванттық жарық көзін жасауға мүмкіндік береді, бұл ұзақ қашықтықтағы кванттық байланыс жүйелері үшін іргетас болып табылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;C-орталықтарының төменгі триплеттік күйі және фонондық бүйірлік сызыққа рекомбинация салдарынан жалғыз эмитенттерді бақылау қиын, сондықтан жоғары сапалы резонаторларды пайдалану талап етіледі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Кремнийдегі C_i-O_i кешендері болып табылатын C-орталықтары 1570 нм толқын ұзындығында микросекундтық өмір сүру уақыты бар ноль-фонондық сызықты (C₀-сызық) көрсетеді. Екінші қозу күйі (C₁-сызық) 1560 нм-де сәулеленеді. Маңызды ерекшелігі — C₀ деңгейінен 2,64 мэВ төмен орналасқан қараңғы триплеттік күйдің (C_T) болуы. Криогендік температурада бұл күйдің өмір сүру уақыты миллисекундтармен өлшенеді, ал жүйеаралық ауысу уақыты τISC ≈ 2,8 мкс C-орталықтарының сәулелену тиімділігін шектейді. Теориялық Дебай-Уоллер факторы 0,12–0,2 аралығында, бұл C₀ ауысуын селективті күшейтуді талап етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;C-орталықтарының сәулелену тиімділігінің төмендігі C_T қараңғы күйі мен Дебай-Уоллер факторының кішілігіне байланысты, сондықтан фотондық резонаторларды қолдану қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;C-орталықтары изотоптық және химиялық тазартылған SOI қабаттарында жасалды. Көміртегі мен сутегі иондары арналық эффектіні болдырмау үшін 7^° бұрышпен имплантацияланды; SRIM симуляцияларына сәйкес иондардың жобалық жүрісі 110 нм деп алынды. Оттегі көзі ретінде кремнийдің табиғи ластануы мен оксид қабатынан диффузия пайдаланылды. Үлгілер C₀ ауысуымен резонанста болатын бір өлшемді фотондық кристалды наноарқалықтар түрінде дайындалды (1c-сурет). Резонанс құрылғы бетіне азот конденсациясы арқылы бапталды. N_L және N_R тесіктер саны арқылы шағылысу асимметриясы басқарылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Фотондық кристал — бұл жарықты басқаруға және оны резонатор ішінде ұстап тұруға мүмкіндік беретін периодты наноқұрылым.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Өлшеулер 8 К температурада криостатта жүргізілді. Қоздыру 800 нм лазерімен NA 0,70 объективі арқылы жүзеге асырылды. Сигнал NA 0,4 линзалы бір модалы талшық арқылы ~ 70% тиімділікпен жиналды. Резонатордың шағылыстыру қабілеті (2a-сурет) FWHM 0,11 ± 0,02 нм және сапа коэффициенті (1,4 ± 0,3) × 10⁴ екенін көрсетті. 10 мкВт қуатта фотолюминесценция спектрі (2b-сурет) λZPL = 1569,831 ± 0,004 нм орталық толқын ұзындығын және 0,078 ± 0,001 нм енін көрсетті. Эмиттердің резонатормен өзара әрекеттесуі δ = λZPL - λCM детьюнинг функциясы арқылы бағаланды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Криогендік температуралар (8 К) фонондық кеңеюді азайту және C-орталықтарының тар спектрлік сызықтарын бақылау үшін қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Парселл эффектісін сандық бағалау үшін уақытша ажыратымдылығы бар фотолюминесценция өлшеулері жүргізілді (3-сурет). 780 нм толқын ұзындығындағы, 100 кГц қайталану жиілігі және 70 пс импульс ені бар лазер қолданылды. Резонаторсыз нанобалкадағы орталықтар ансамблінің өмір сүру ұзақтығы τ₀ = 1.45 ± 0.08 мкс құрады. Резонаторды резонансқа келтіргенде (δ = 0 нм), өмір сүру ұзақтығы τon = 0.287 ± 0.002 мкс-ке дейін қысқарды, бұл спонтанды сәулеленудің бес есе жылдамдағанын білдіреді. Резонанстан ауытқығанда (δ = -0.09 нм) өмір сүру ұзақтығы τ = 0.523 ± 0.005 мкс-ке, ал δ = -0.83 нм болғанда τoff = 0.780 ± 0.030 мкс-ке дейін артады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Резонатормен резонанстық әрекеттесу C-орталығының өмір сүру ұзақтығын 5 есе қысқартады (1.45 мкс-тен 0.287 мкс-ке дейін), бұл спонтанды сәулелену жылдамдығының айтарлықтай артқанын растайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Парселл факторы (F_P) — резонатордың кванттық нысанның сәулелену жылдамдығын бос кеңістікке қарағанда қанша есе арттыратынын көрсететін көрсеткіш.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;F_P-ді есептеу үшін Дебай-Валлер факторын (FDW = 0.2) және ішкі кванттық тиімділікті (&lt;span class=\"yfm-latex\" data-content=\"%5Ceta_%7BQE%7D%20%3D%200.482\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;) ескеретін (1)-теңдеу қолданылды. Есептелген мән F_P ≥ 33 құрады. τoff пен τ₀ арасындағы айырмашылық наноқұрылымдағы сәулеленбейтін рекомбинацияның қосымша жолдарының болуымен түсіндіріледі.&lt;/p&gt;\n&lt;p&gt;Сәулелену қарқындылығының сорғы қуатына тәуелділігі (4а-сурет) екі деңгейлі жүйе моделімен (2-теңдеу) сипатталады. Аппроксимация нәтижесінде қанығу қарқындылығы Isat = (7.68 ± 0.09) × 10³ имп/с және қанығу қуаты Psat = 10.4 ± 0.3 мкВт деп анықталды. Сәулелендіргіштің жалғыз ақау екенін растау үшін 7 мкВт (0.67 Psat) қуатта екінші ретті автокорреляция функциясы g⁽²⁾(τ) өлшенді (4b-сурет). Алынған g⁽²⁾(0) = 0.23 ± 0.01 мәні (фон үшін түзетусіз) жалғыз фотонды сәулелендіргіш табиғатын дәлелдейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;g⁽²⁾(0) = 0.23 мәні фондық сәулеленуді шегермей алынған, бұл жалғыз кванттық сәулелендіргіштің жұмысының тікелей дәлелі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл жұмыс C-орталықтарын кремнийлі фотонды кристалдарға интеграциялау мүмкіндігін көрсетеді, бұл стандартты SOI платформалары негізінде телекоммуникациялық L-диапазонында масштабталатын кванттық желілерді құруға жол ашады.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/l-band-single-photon-generation-from-a-cavity-coupled-silico-f1.jpg\" alt=\"Сурет 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/l-band-single-photon-generation-from-a-cavity-coupled-silico-f2.jpg\" alt=\"2-сурет: a) C0-сызығының толқын ұзындығына бапталған резонатордың шағылысу спектрі (нүктелер) және сәйкес Лоренц аппрокс\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет: a) C0-сызығының толқын ұзындығына бапталған резонатордың шағылысу спектрі (нүктелер) және сәйкес Лоренц аппроксимациясы (штрихталған сызық), FWHM = 0.11 ± 0.02 нм мәнін береді, бұл (1.4 ± 0.3) × 10^4 сапа факторына сәйкес келеді&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-сурет: a) C0-сызығының толқын ұзындығына бапталған резонатордың шағылысу спектрі (нүктелер) және сәйкес Лоренц аппроксимациясы (штрихталған сызық), FWHM = 0.11 ± 0.02 нм мәнін береді, бұл (1.4 ± 0.3) × 10^4 сапа факторына сәйкес келеді; b) 8 К температурада, 800 нм үздіксіз қоздыру кезінде, 10 мкВт сорғы қуатында, резонансты емес жағдайда эмитенттің фотолюминесценция спектрі (нүктелер). Эксперименттік деректердің Лоренц аппроксимациясы (штрихталған сызық) λZPL = 1569.831 ± 0.004 нм және FWHM = 0.078 ± 0.001 нм мәндерін береді; c) Фотолюминесценция қарқындылығының резонатор модасының детьюнингіне (δ) тәуелділігі. Штрихталған сызық δ өзгеруін бақылау үшін визуалды нұсқаулық ретінде қызмет етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/l-band-single-photon-generation-from-a-cavity-coupled-silico-f4.jpg\" alt=\"Сурет 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 4&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/l-band-single-photon-generation-from-a-cavity-coupled-silico-fS1.jpg\" alt=\"S1-сурет: Ашық наножолақтағы C-орталықтар ансамблінің фотолюминесценция спектрі, ∼1570 нм-де C0-сызығын және ∼1560 нм-де\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S1-сурет: Ашық наножолақтағы C-орталықтар ансамблінің фотолюминесценция спектрі, ∼1570 нм-де C0-сызығын және ∼1560 нм-де C1-сызығын көрсетеді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/l-band-single-photon-generation-from-a-cavity-coupled-silico-fS2.jpg\" alt=\"S2-сурет: 2c-суреттегі (нүктелер) резонатор модасының детьюнингіне (δ) тәуелді C0-сызығының интегралдық ауданы. Штрихтал\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S2-сурет: 2c-суреттегі (нүктелер) резонатор модасының детьюнингіне (δ) тәуелді C0-сызығының интегралдық ауданы. Штрихталған сызық эксперименттік деректердің Лоренц аппроксимациясын білдіреді, FWHM = 0.13 ± 0.01 нм және λC = 1569.831 ± 0.004 нм мәндерін береді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/l-band-single-photon-generation-from-a-cavity-coupled-silico-fS3.jpg\" alt=\"S3-сурет: C-орталығының өмір сүру уақытының резонатор модасының детьюнингіне (δ) тәуелділігі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S3-сурет: C-орталығының өмір сүру уақытының резонатор модасының детьюнингіне (δ) тәуелділігі.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/l-band-single-photon-generation-from-a-cavity-coupled-silico-fS4.jpg\" alt=\"S4-сурет: Фонды түзетусіз (IB=0, жасыл нүктелер) және фонды түзетілген (көк нүктелер) g(2)(0) мәндерінің түсетін қуатқа \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S4-сурет: Фонды түзетусіз (IB=0, жасыл нүктелер) және фонды түзетілген (көк нүктелер) g(2)(0) мәндерінің түсетін қуатқа тәуелділігі.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-02/l-band-single-photon-generation-from-a-cavity-coupled-silico.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;кремнийдегі C-&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;орталықтардың&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;төмен&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жарықтығы&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;нанофотондық&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;резонатормен&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;байланыстыру&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"
