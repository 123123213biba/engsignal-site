        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференциялар&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;3D-печать бетоном и цифровое строительство&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Не туралы&lt;/td&gt;\n&lt;td&gt;3D-печать бетоном и цифровое строительство&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Не аламыз&lt;/td&gt;\n&lt;td&gt;труды&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-build.html\"&gt;Құрылыс технологиялары&lt;/a&gt;, &lt;a href=\"concepts/spec-concrete.html\"&gt;Бетон және байланыстырғыштар&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"bul-khandaj-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-digital_concrete.html#bul-khandaj-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қандай конференция&lt;/span&gt;&lt;/a&gt;Бұл қандай конференция&lt;/h2&gt;\n&lt;p&gt;Digital Concrete — құрылыстағы аддитивті өндіріс (3D-басып шығару) технологияларына арналған халықаралық ғылыми алаң. Конференция зерттеушілерді, инженерлер мен материалтанушыларды бетонды 3D-басып шығару, құрылыс процестерін автоматтандыру және жаңа байланыстырғыш қоспаларды әзірлеу мәселелерін талқылау үшін біріктіреді. Негізгі мақсат — дәстүрлі қалыптардан пішін түзуді цифрлық басқаруға көшу.&lt;/p&gt;\n&lt;h2 id=\"ujymdastyrushylar-zhaene-tarihy\"&gt;&lt;a href=\"reference/conferences/conf-digital_concrete.html#ujymdastyrushylar-zhaene-tarihy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ұйымдастырушылар және тарихы&lt;/span&gt;&lt;/a&gt;Ұйымдастырушылар және тарихы&lt;/h2&gt;\n&lt;p&gt;Конференция бетонды 3D-басып шығару (3DCP) әдістерін стандарттау және ғылыми негіздеу қажеттілігінен туындады. Ол ғимараттар мен күрделі сәулеттік пішіндерді тұрғызуды автоматтандыруға ұмтылатын академиялық институттар мен өнеркәсіптік серіктестер арасындағы деректер алмасу платформасы ретінде қызмет етеді.&lt;/p&gt;\n&lt;h2 id=\"takhyryptar-men-sekciyalar\"&gt;&lt;a href=\"reference/conferences/conf-digital_concrete.html#takhyryptar-men-sekciyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тақырыптар мен секциялар&lt;/span&gt;&lt;/a&gt;Тақырыптар мен секциялар&lt;/h2&gt;\n&lt;p&gt;Конференция жұмысы бірнеше негізгі бағытты қамтиды:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Реология және қоспалар құрамы: бетонның экструзия үшін қажетті қасиеттерін зерттеу.&lt;/li&gt;\n&lt;li&gt;Механикалық сипаттамалар және төзімділік: басып шығарылған конструкциялардың беріктігі мен микроқұрылымын талдау.&lt;/li&gt;\n&lt;li&gt;Цифрлық жобалау және модельдеу: цемент тасының мінез-құлқын молекулалық деңгейде болжау үшін нейрондық желілік потенциалдарды (мысалы, CSH-MLP) пайдалану.&lt;/li&gt;\n&lt;li&gt;Роботтандырылған жүйелер: жұмсақ робототехника принциптерін құрылыс техникасына интеграциялау.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"onda-ne-pajda-bolady\"&gt;&lt;a href=\"reference/conferences/conf-digital_concrete.html#onda-ne-pajda-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Онда не пайда болады&lt;/span&gt;&lt;/a&gt;Онда не пайда болады&lt;/h2&gt;\n&lt;p&gt;Digital Concrete конференциясында құрылысқа деген көзқарасты өзгертетін зерттеу нәтижелері ұсынылады:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Күрделі пішіндерді қалдықсыз жасауға мүмкіндік беретін алынбайтын қалыптарды 3D-басып шығару әдістері.&lt;/li&gt;\n&lt;li&gt;Цемент гидратациясын модельдеу үшін нейрондық желілерді қолдану.&lt;/li&gt;\n&lt;li&gt;Роботтарды басқарудағы инновациялар: күрделі қозғалыстар үшін бір актуаторды пайдаланудан бастап, басқару контроллерлерінде асинхронды логикалық желілерді қолдануға дейін.&lt;/li&gt;\n&lt;li&gt;Өнеркәсіптің көміртегі ізін азайтатын тұрақты құрылыс материалдары бойынша зерттеулер.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"khalaj-bakhylaugha-zhaene-khatysugha-bolady\"&gt;&lt;a href=\"reference/conferences/conf-digital_concrete.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалай бақылауға және қатысуға болады&lt;/span&gt;&lt;/a&gt;Қалай бақылауға және қатысуға болады&lt;/h2&gt;\n&lt;p&gt;Конференцияға қатысу рецензияланатын ғылыми жұмыстарды жариялауды көздейді. Жаңалықтарды аддитивті өндіріс және материалтану саласындағы бейіндік қауымдастықтардың ресми порталдары арқылы бақылауға болады. Конференция материалдары инженер-жобалаушылар үшін іргелі база болатын еңбектер жинағы түрінде жарияланады.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"reference/conferences/conf-digital_concrete.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Digital Concrete негізінде материалтану мен цифрлық басқарудың синтезі жатыр. Негізгі ұғым — «жаңа төселген қоспаның реологиясы», ол бетонның саптамадан шығу және келесі қабаттардың салмағын ұстап тұру қабілетін анықтайды. Классикалық бетоннан айырмашылығы, мұнда қатаю жылдамдығы мен қатараралық жабысқақтық (адгезия) маңызды рөл атқарады. Заманауи зерттеулер бетонның макроскопиялық қасиеттерін микроқұрылымдық модельдеумен байланыстырады, мұнда нейрондық желілер қоспа құрамын оңтайландыруға көмектеседі.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/conferences/conf-digital_concrete.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/Concrete_(%D0%B0%D0%BB%D1%8C%D0%B1%D0%BE%D0%BC_Fear_Factory)\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Concrete (альбом Fear Factory) — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/ma14143800\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;3D Concrete Printing: A Systematic Review of Rheology, Mix Designs, Mechanical, Microstructural, and Durability Characteristics&lt;/a&gt; — шолу, Materials (Basel) 2021&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1089/3dp.2021.0024\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;3D Printed Formwork for Concrete: State-of-the-Art, Opportunities, Challenges, and Applications&lt;/a&gt; — шолу, 3D Print Addit Manuf 2022&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1089/3dp.2020.0331\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Additive Manufacturing of Sustainable Construction Materials and Form-finding Structures: A Review on Recent Progresses&lt;/a&gt; — шолу, 3D Print Addit Manuf 2022&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференциялар&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"3D-печать бетоном и цифровое строительство"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Digital Concrete","description":"3D-печать бетоном и цифровое строительство","vcsPath":"reference/conferences/conf-digital_concrete.md"},"headings":[{"title":"Бұл қандай конференция","href":"reference/conferences/conf-digital_concrete.html#bul-khandaj-konferenciya","level":2},{"title":"Ұйымдастырушылар және тарихы","href":"reference/conferences/conf-digital_concrete.html#ujymdastyrushylar-zhaene-tarihy","level":2},{"title":"Тақырыптар мен секциялар","href":"reference/conferences/conf-digital_concrete.html#takhyryptar-men-sekciyalar","level":2},{"title":"Онда не пайда болады","href":"reference/conferences/conf-digital_concrete.html#onda-ne-pajda-bolady","level":2},{"title":"Қалай бақылауға және қатысуға болады","href":"reference/conferences/conf-digital_concrete.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady","level":2},{"title":"Теория","href":"reference/conferences/conf-digital_concrete.html#teoriya","level":2},{"title":"Дереккөздер","href":"reference/conferences/conf-digital_concrete.html#derekkoezder","level":2}],"title":"Digital Concrete"},"router":{"pathname":"reference/conferences/conf-digital_concrete","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
