        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференциялар&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Международная федерация по бетону: железобетонные конструкции&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/conferences/conf-fib.jpg\" alt=\"fib Symposium / Congress\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Не туралы&lt;/td&gt;\n&lt;td&gt;Международная федерация по бетону: железобетонные конструкции&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Не аламыз&lt;/td&gt;\n&lt;td&gt;программы, труды&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-concrete.html\"&gt;Бетон және байланыстырғыштар&lt;/a&gt;, &lt;a href=\"concepts/spec-structures.html\"&gt;Конструкциялар және ғимараттар&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"bul-khandaj-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-fib.html#bul-khandaj-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қандай конференция&lt;/span&gt;&lt;/a&gt;Бұл қандай конференция&lt;/h2&gt;\n&lt;p&gt;fib Symposium / Congress — Халықаралық бетон федерациясы (International Federation for Structural Concrete) ұйымдастыратын негізгі халықаралық іс-шара. Конференция ғалымдар, құрылымдық инженерлер және құрылыс материалдарын өндірушілер арасында білім алмасудың басты алаңы болып табылады. Іс-шаралардың негізгі мақсаты — бетон және темірбетон саласындағы теориялық зерттеулерді ғимараттардың қауіпсіздігі мен беріктігін арттыратын практикалық инженерлік шешімдерге айналдыру.&lt;/p&gt;\n&lt;h2 id=\"ujymdastyrushylar-zhaene-tarihy\"&gt;&lt;a href=\"reference/conferences/conf-fib.html#ujymdastyrushylar-zhaene-tarihy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ұйымдастырушылар және тарихы&lt;/span&gt;&lt;/a&gt;Ұйымдастырушылар және тарихы&lt;/h2&gt;\n&lt;p&gt;Ұйымдастырушы — бүкіл әлем бойынша мамандардың ұлттық топтарын біріктіретін fib федерациясы. Ұйымның тарихы 1998 жылы екі ірі бірлестіктің (CEB және FIP) қосылуынан бастау алады. Содан бері федерация тұрақты түрде симпозиумдар мен конгрестер өткізіп келеді. Айта кетейік, fib қызметі тек құрылыс ғылымы мен бетон технологияларына бағытталған; ол басқа контексттерде ұқсас аббревиатураларды қолданатын саяси қозғалыстармен немесе ұйымдармен байланысты емес.&lt;/p&gt;\n&lt;h2 id=\"takhyryptar-men-sekciyalar\"&gt;&lt;a href=\"reference/conferences/conf-fib.html#takhyryptar-men-sekciyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тақырыптар мен секциялар&lt;/span&gt;&lt;/a&gt;Тақырыптар мен секциялар&lt;/h2&gt;\n&lt;p&gt;Конференция бағдарламасы цемент тасының іргелі химиясынан бастап күрделі биік құрылымдарды жобалауға дейінгі кең ауқымды мәселелерді қамтиды. Негізгі секциялар әдетте мыналарды қамтиды:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Жаңа материалдар мен байланыстырғыштар: экологиялық таза қоспалар мен төзімділік саласындағы зерттеулер.&lt;/li&gt;\n&lt;li&gt;Сейсмикалық тұрақты құрылыс: құрылымдарды жеңілдету үшін полиуретанды қаптамаларды қолдану сияқты жүктемені азайту әдістері.&lt;/li&gt;\n&lt;li&gt;Цифрландыру және модельдеу: бетонның беріктігін молекулярлық деңгейде болжау үшін нейрондық желілік потенциалдарды (мысалы, CSH-MLP) қолдану.&lt;/li&gt;\n&lt;li&gt;Тұрақты даму: бетон өндірісіндегі көміртегі ізін азайту.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"onda-ne-pajda-bolady\"&gt;&lt;a href=\"reference/conferences/conf-fib.html#onda-ne-pajda-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Онда не пайда болады&lt;/span&gt;&lt;/a&gt;Онда не пайда болады&lt;/h2&gt;\n&lt;p&gt;fib симпозиумдарында кейіннен салалық стандарттарға айналатын зерттеу нәтижелері алғаш рет ұсынылады. Мысалы, мұнда ауыр құрылыс материалдарын жеңіл полимерлі аналогтарға ауыстыру әдістері талқыланады, бұл жүк көтергіш құрылымдарды күшейтпей-ақ сейсмикалық жүктемені 20%-ға азайтуға мүмкіндік береді. Сондай-ақ, цемент композиттерін талдау үшін машиналық оқыту әдістері көрсетіледі, бұл материалдардың мінез-құлқын кванттық физикаға жақын дәлдікпен модельдеуге мүмкіндік береді.&lt;/p&gt;\n&lt;h2 id=\"khalaj-bakhylaugha-zhaene-khatysugha-bolady\"&gt;&lt;a href=\"reference/conferences/conf-fib.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалай бақылауға және қатысуға болады&lt;/span&gt;&lt;/a&gt;Қалай бақылауға және қатысуға болады&lt;/h2&gt;\n&lt;p&gt;Конференцияларға қатысу үшін fib ресми күнтізбесін бақылап отыру қажет. Ғылыми еңбектер жинақтары (proceedings) мамандандырылған дерекқорларда қолжетімді. Зерттеушілер өз жұмыстарының тезистерін рецензиялауға және профильдік секцияларда баяндама жасауға ұсына алады. Тікелей қатыспайтын мамандар үшін конференция материалдарын зерделеу материалтану және құрылымдарды жобалау саласындағы өзекті трендтерден хабардар болудың ең жақсы жолы болып табылады.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/conferences/conf-fib.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Brazilian_Integralist_Front\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Brazilian Integralist Front — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Frente_Integralista_Brasileira_logo.png\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Morgadofelipen, Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференциялар&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Международная федерация по бетону: железобетонные конструкции"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"fib Symposium / Congress","description":"Международная федерация по бетону: железобетонные конструкции","vcsPath":"reference/conferences/conf-fib.md"},"headings":[{"title":"Бұл қандай конференция","href":"reference/conferences/conf-fib.html#bul-khandaj-konferenciya","level":2},{"title":"Ұйымдастырушылар және тарихы","href":"reference/conferences/conf-fib.html#ujymdastyrushylar-zhaene-tarihy","level":2},{"title":"Тақырыптар мен секциялар","href":"reference/conferences/conf-fib.html#takhyryptar-men-sekciyalar","level":2},{"title":"Онда не пайда болады","href":"reference/conferences/conf-fib.html#onda-ne-pajda-bolady","level":2},{"title":"Қалай бақылауға және қатысуға болады","href":"reference/conferences/conf-fib.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady","level":2},{"title":"Дереккөздер","href":"reference/conferences/conf-fib.html#derekkoezder","level":2}],"title":"fib Symposium / Congress"},"router":{"pathname":"reference/conferences/conf-fib","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
