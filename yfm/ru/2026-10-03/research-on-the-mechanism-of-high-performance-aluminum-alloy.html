        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"251\" cy=\"170\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"629\" cy=\"183\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · STEELS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Как замороженный песок и&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;вакуум спасают сложные&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;алюминиевые отливки&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-f1.jpg\" alt=\"Принципиальная схема сбора данных о температуре в модели замороженной песчаной формы. (a) Вид устройства спереди. (b) Ви\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Принципиальная схема сбора данных о температуре в модели замороженной песчаной формы. (a) Вид устройства спереди. (b) Вид устройства в разрезе.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Литье сплава &lt;a href=\"concepts/zl205a-alloy.html\"&gt;ZL205A&lt;/a&gt; осложняется широким интервалом кристаллизации и низкой текучестью. Применение отрицательного давления в сочетании с замороженными песчаными формами позволяет радикально улучшить теплообмен. Это решение обеспечивает мелкозернистую структуру и отсутствие дефектов в тонкостенных деталях.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Оптимальный &lt;a href=\"concepts/ihtc.html\"&gt;IHTC&lt;/a&gt; 236 Вт/(м²·К) достигнут при 6% влажности и -40 °C.&lt;/li&gt;\n&lt;li&gt;Прочность после T6-обработки выросла до 478,5 МПа при 7,4% удлинении.&lt;/li&gt;\n&lt;li&gt;Метод исключает дефекты в тонкостенных деталях диаметром 180 мм.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Исследование сфокусировано на сплаве ZL205A (AlCu5MnTiCdV), который склонен к газовой пористости и усадочным дефектам. Для анализа теплообмена на границе «форма-отливка» использовался метод обратной теплопроводности на основе данных семи K-типа термопар с частотой записи 10 Гц. Оптимальные параметры процесса — влажность формы 6% и температура заморозки -40 °C — обеспечили средний коэффициент теплопередачи (IHTC) 236 Вт/(м²·К).&lt;/p&gt;\n&lt;p&gt;Этот показатель в 2,8 раза выше, чем при обычном &lt;a href=\"concepts/lite-v-zamorozhennye-formy.html\"&gt;литье в замороженные формы&lt;/a&gt;, и в 1,6 раза выше, чем при вакуумном литье в песчано-смоляные формы. Увеличение интенсивности отвода тепла способствует измельчению зерна и эффективному удалению газов. В результате предел прочности при растяжении достигает 200,6 МПа в литом состоянии и 478,5 МПа после термообработки T6, что позволяет отливать детали с толщиной стенки от 3 мм.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование ограничено лабораторными образцами малого объема и не учитывает масштабируемость процесса для крупногабаритных промышленных отливок.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Литые алюминиевые сплавы широко используются в аэрокосмической технике, в основном в качестве конструкционных элементов планеров, силовых установок и систем управления, где критически важны малый вес и высокая прочность. Наиболее распространенными сплавами в аэрокосмическом производстве являются серии ZL1×× и ZL2××, на долю которых приходится более 95% от общего объема потребления. Эти сплавы обычно формуют с использованием литья в песчаные формы, литья в кокиль и литья по выплавляемым моделям, часто в сочетании со специальными методами, такими как литье под низким давлением и электромагнитное литье, для получения высококачественных отливок. Однако алюминиевые сплавы крайне склонны к поглощению газов и окислению при повышенных температурах, что приводит к многочисленным дефектам затвердевания в литых изделиях и снижению выхода годного. Между тем, с развитием технологий промышленное производство предъявляет все более строгие требования к подготовке, обработке и эксплуатационным характеристикам алюминиевых сплавов. В этом контексте актуальной задачей и фокусом исследований стало регулирование поведения сплавов с широким температурным интервалом затвердевания в режиме реального времени, более эффективное измельчение их микроструктуры, устранение структурных дефектов и повышение механических свойств. Это позволит в дальнейшем приблизить форму отливок к конечной (near-net shaping), сократить постобработку, минимизировать отходы материала, снизить затраты и повысить эффективность использования материала и производства при соблюдении требований к характеристикам.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Основная проблема заключается в необходимости управления затвердеванием сплавов с широким интервалом кристаллизации для минимизации дефектов и повышения качества отливок.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В 1970-х годах британские компании Booth и British Oxygen Company применили криогенную технологию в литье и изобрели процесс литья в замороженные формы. Полученная форма замораживалась при низких температурах для достижения определенной прочности, и такая песчаная форма была по существу идентична используемым в традиционном литье в песчаные формы. Мур и соавт. исследовали закономерности изменения проницаемости в замороженных песчаных формах и обнаружили, что более крупные частицы песка приводят к лучшей конечной проницаемости формы. Нагойский научно-исследовательский институт промышленных технологий изучал динамическое поведение влаги в формах во время замораживания, чтобы сравнить зависимость между температурой формы и ее прочностью. Они также обнаружили, что использование порошка ферросилиция в качестве вспомогательного связующего для замороженного литья приводит к минимальной деформации. Кроме того, они разработали метод уплотнения вливанием, который снижает расход хладагента и обеспечивает равномерное уплотнение формы. В 2008 году С. Тада изучил факторы, влияющие на прочность на сжатие замороженных песчаных форм. Используя коллоидные растворы кремнезема вместо водных растворов для создания замороженных песчаных форм, было установлено, что формы сохраняют определенную прочность на сжатие даже в оттаявшем состоянии. В 2015 году Шань и соавт. предложили метод цифрового бесшаблонного резания для формирования замороженных песчаных форм. Этот метод использует чистую воду в качестве связующего, где частицы песка смешиваются с соответствующим количеством воды и замораживаются в низкотемпературной среде для формирования заготовки. Затем замороженная песчаная форма обрабатывается до нужной формы с помощью оборудования для цифрового бесшаблонного резания, основанного на принципах аддитивного производства. Лян и соавт. использовали метод теплового зонда для измерения теплопроводности замороженных песчаных форм с различным содержанием воды при различных температурах, создав объемно-смешивающую модель для оценки теплопроводности таких форм.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Литье в замороженные формы — это метод, при котором песчаная смесь с водой замораживается для придания ей прочности, что позволяет получать точные формы без использования химических связующих.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Текущие исследования технологии литья в замороженные формы в основном сосредоточены на процессе формования и сравнении микроструктур и свойств отливок простой формы. Однако существует относительно мало работ, посвященных ключевым проблемам, связанным с различными системами сплавов в процессе литья в замороженные формы. Большинство экспериментальных образцов основаны на алюминиево-кремниевых сплавах, в то время как исследования сплавов с плохой жидкотекучестью и высокой склонностью к дефектам затвердевания, таких как алюминиево-медные сплавы, остаются редкими. Текущие исследования в области литья с использованием отрицательного давления, как внутри страны, так и за рубежом, в основном сосредоточены на двух методах: V-процесс и литье по газифицируемым моделям (ЛГМ). Отечественная литейная компания применила высокоскоростную заливку для достижения равномерного затвердевания, определив ключевые параметры процесса: вакуум при заливке −0,04 МПа, вакуум при выдержке −0,03 МПа, время выдержки 15 мин и время изоляции отливки 8 ч. Этот подход фундаментально решил проблемы холодной спайности и горячих трещин в отливках. Сентил и соавт. провели сравнительные исследования процесса затвердевания и поведения сплавов при различных методах литья. Они обнаружили, что V-процесс эффективно устраняет основные недостатки, связанные с традиционным литьем в песчаные формы и литьем под давлением, одновременно повышая заполняющую способность сплава и улучшая чистоту поверхности отливок. Гао и соавт. решили распространенные дефекты, такие как обрушение формы и раздутие стенок формы при ЛГМ крупных и средних полузакрытых отливок. Они проанализировали этапы производства, на которых возникают эти дефекты, и их первопричины, сформулировав соответствующие меры по улучшению. Практические результаты показали, что наклон верхней плоскости полузакрытых компонентов под углом 45° во время заполнения формы облегчает лучшее заполнение песком и уплотнение. Кроме того, установка внешних вакуумных трубок и применение вакуума как внутри, так и снаружи во время заливки обеспечивает сбалансированное отрицательное давление внутри и снаружи полости формы, тем самым повышая коэффициент годности отливок. Чжан и соавт. проанализировали структуру корпуса трансмиссии трактора и технологическую адаптивность ЛГМ. Благодаря систематическим исследованиям и разработкам они успешно создали процесс ЛГМ для корпуса, что имеет большое значение для снижения общих производственных затрат. Лян и соавт. исследовали дефекты, такие как пригар, газовая пористость и размыв формы, которые легко возникают при ЛГМ изделий, таких как корпуса маховиков. Регулируя процесс сборки моделей, оптимизируя литниковую систему, перепроектируя расположение вентиляционных каналов и шлакоуловителей, а также улучшая рациональность расположения впусков, в сочетании с практическими производственными условиями, он предложил меры по устранению дефектов литья в соответствующих изделиях.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Большинство существующих исследований ограничено простыми формами и Al-Si сплавами, что затрудняет перенос результатов на сложные Al-Cu сплавы с широким интервалом затвердевания.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Текущие исследования по ЛГМ и V-процессу в основном сосредоточены на процессах изготовления форм и контроле параметров процесса. Эти методы предлагают такие преимущества, как повышение эффективности производства, улучшение точности литья и снижение затрат в определенной степени. Однако остается ряд сложных нерешенных вопросов, ограничивающих их более широкое применение. С 1950-х годов исследователи признали, что коэффициент теплопередачи на границе раздела (IHTC) существенно влияет на эволюцию температурного поля при затвердевании металла, тем самым влияя на микроструктуру и свойства отливок. Оукач и соавт. разместили термопары в фиксированных местах внутри отливки и формы для записи кривых «температура-время». На основе этих данных они рассчитали температурный градиент на границе раздела отливка/форма и вывели изменение IHTC во времени, используя формулу h = q / (Tis - Tim), что ознаменовало первое экспериментальное определение IHTC. Хан, Сингх и соавт. интегрировали компьютерные технологии с процессами затвердевания металлов, используя обратный алгоритм Бека для анализа механизмов затвердевания и исследования временного изменения IHTC на границе раздела форма/отливка. Мотояма и соавт., а также Вудбери и соавт. изучали IHTC на границе раздела между песчаными формами и отливками из алюминиевых сплавов, получая его значения с помощью различных вычислительных методов. В последние годы отечественные ученые добились значительного прогресса в области определения IHTC. Сюй и соавт. исследовали влияние технологических факторов, таких как вязкость, на процесс затвердевания и проанализировали связь между IHTC и вязкостью. Их результаты показали, что более высокая вязкость приводит к более широкому слою воздушного зазора на границе раздела форма/отливка, что соответствует более низкому IHTC. Многочисленные исследовательские группы также внесли существенные результаты посредством экспериментального анализа того, как IHTC развивается во время затвердевания, включая Чжу и соавт., Суй и соавт., Чжан и соавт., Ван и соавт. и Цао и соавт. В настоящее время обратный расчет IHTC применяется к различным процессам литья, таким как литье в песчаные формы, литье в кокиль и литье под низким давлением. Совсем недавно Дун и соавт. определили IHTC на границе раздела замороженная песчаная форма/сплав ZL101, объединив метод конечных разностей с алгоритмами сопряженных градиентов и оптимизации роя частиц, показав, что содержание воды 4–5 мас.% приводит к двум различным типам кривых эволюции IHTC; та же группа дополнительно разработала модель обратной теплопроводности для оценки IHTC на границе замороженная форма-расплав во время затвердевания A356, количественно оценив влияние начальной температуры замораживания, содержания воды и формовочного песка. Цю и соавт. создали обратную модель для IHTC как внешней формы, так и внутреннего стержня кольцевых алюминиевых отливок, показав, что IHTC отливка/стержень всегда выше, чем значение отливка/форма, и в основном определяется межфазным зазором. Параллельно Ши и соавт. разработали метод криогенного градиентного формирования для замороженных песчаных форм и определили оптимальное окно рецептуры (размер песка 106–212 мкм, содержание воды 4–5 мас.%, температура замораживания ниже −25 °C), которое обеспечило точность размеров CT8 для отливок корпусов маховиков. Однако существующие исследования IHTC на замороженных песчаных формах ограничены атмосферным затвердеванием сплавов Al-Si; до сих пор нет сообщений об исследованиях влияния среды с отрицательным давлением на IHTC и поведение теплопередачи во время литья, а также на сплавы Al-Cu с широким интервалом затвердевания, такие как ZL205A. Поскольку морфология и масштаб микроструктуры затвердевания напрямую определяются интенсивностью теплопередачи на границе раздела металл-форма, которая обычно характеризуется IHTC, количественная связь между межфазной теплопередачей и структурой затвердевания привлекает все больше внимания. Ян и соавт. исследовали головки цилиндров из сплава Al-5Cu-0.38Mg-0.32Mn-0.1Ag, отлитые в песчаные формы, и обнаружили, что зависящие от положения скорости охлаждения измельчили равноосные зерна со 116 мкм до 62 мкм, при этом пределы текучести варьировались от 140 до 159 МПа, что подтверждает доминирующую роль скорости охлаждения в определении размера зерна и механических характеристик. Мао и соавт. продемонстрировали для сплавов Al-7Si-0.6Mg, что более высокая скорость охлаждения увеличивает переохлаждение при зарождении и скорость зарождения, тем самым измельчая зерна и одновременно улучшая прочность и пластичность. Эти результаты показывают, что усиление межфазной теплопередачи ускоряет отвод тепла, повышает переохлаждение при затвердевании, измельчает зерна и подавляет газовую пористость, что составляет механистическую основу связей «процесс-тепло-микроструктура-свойство», рассматриваемых в данной работе. Поэтому данное исследование сосредоточено на алюминиевом сплаве ZL205A, представительном сплаве на основе Al-Cu, характеризующемся широким интервалом затвердевания, плохой жидкотекучестью и многочисленными проблемами при затвердевании.&lt;/p&gt;\n&lt;p&gt;Проведено сравнительное исследование с использованием трех различных методов формования: обычное литье в смоляно-песчаные формы при атмосферном давлении, литье в замороженные песчаные формы при атмосферном давлении и литье в замороженные песчаные формы в условиях отрицательного давления. Кроме того, для процесса литья в замороженные формы под отрицательным давлением проведен сравнительный анализ с использованием песчаных форм с различным содержанием воды и начальными температурами замораживания. Цель состоит в том, чтобы прояснить поведение при затвердевании и эволюцию микроструктуры и свойств алюминиевого сплава ZL205A при различных процессах и параметрах замороженных песчаных форм. Конкретные цели этого исследования: (1) количественно определить эволюцию IHTC во времени при различных условиях формы/давления с использованием анализа обратной теплопроводности; (2) установить механистическую связь между величиной IHTC, скоростью затвердевания, измельчением зерна и подавлением пористости; и (3) определить оптимальные параметры замороженной песчаной формы (содержание влаги и начальная температура замораживания) для литья ZL205A под отрицательным давлением, что позволит изготавливать высококачественные тонкостенные компоненты.&lt;/p&gt;\n&lt;p&gt;Для сбора температурных данных в этом исследовании была спроектирована замороженная песчаная форма размером 150 мм × 150 мм × 150 мм. Полость формы имела диаметр 40 мм и высоту 100 мм. Температурные данные собирались с помощью многоканального регистратора температуры (MIK-4000D, CHN, Hangzhou Meikong Automation Technology Co., Ltd., Ханчжоу, Китай) и семи термопар K-типа (Hangzhou Meikong Automation Technology Co., Ltd., Ханчжоу, Китай) с частотой записи 10 Гц. Чтобы обеспечить точное измерение температуры расплава, две термопары, обозначенные T1 и T7, были расположены в центре расплава. Дополнительные термопары были размещены на расстояниях 5 мм, 10 мм, 15 мм, 20 мм и 25 мм от внешнего края расплава, обозначенные как T2–T6 соответственно, как показано на Рис. 1. Для содействия радиальному отводу тепла от отливки и минимизации осевых потерь тепла на дно полости формы была помещена теплоизоляционная вата. Кроме того, литниковая чаша и изоляционная вата были размещены сверху для обеспечения тепловой изоляции в вертикальном направлении. Рис. 1 Схематическая диаграмма сбора температуры в модели замороженной песчаной формы. (a) Вид спереди устройства. (b) Вид в разрезе устройства. Термопары K-типа были откалиброваны перед экспериментами с использованием прецизионного эталонного термометра (точность ±0,5 °C) в диапазоне температур от −50 °C до 900 °C; расширенная неопределенность измерения составила ±1,5 °C (k = 2). Положения термопар внутри формы были подтверждены путем разрезания жертвенной формы после замораживания, чтобы убедиться, что смещение во время уплотнения песка составляло менее ±1 мм от номинальных положений, показанных на Рис. 1. Для экспериментов с использованием отрицательного давления профиль «давление-время» контролировался на протяжении каждого эксперимента с помощью откалиброванного манометра (Anhui Zhenglan Instrument Co., Ltd., Чучжоу, Аньхой, Китай; диапазон: от 0 до −0,1 МПа, разрешение: 0,001 МПа). Вакуум поддерживался на уровне −0,03 ± 0,002 МПа на протяжении всей последовательности заливки и затвердевания. Слой стальной дроби, окружающий форму, обеспечивал механическую поддержку и вносил незначительный теплоизоляционный эффект; однако, поскольку одна и та же конфигурация слоя стальной дроби использовалась последовательно во всех экспериментах с отрицательным давлением, его вклад в эффективный IHTC заложен в измеренных значениях h(t) и не влияет на относительные сравнения между условиями. Тем не менее, поскольку слой стальной дроби и система герметизации PE присутствовали только в конфигурации с вакуумной поддержкой, их возможный тепловой вклад признается ограничением настоящего исследования при сравнении атмосферных условий и условий отрицательного давления в абсолютном выражении.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-f1.jpg\" alt=\"Принципиальная схема сбора данных о температуре в модели замороженной песчаной формы. (a) Вид устройства спереди. (b) Ви\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Принципиальная схема сбора данных о температуре в модели замороженной песчаной формы. (a) Вид устройства спереди. (b) Вид устройства в разрезе.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;IHTC (коэффициент теплопередачи на границе раздела) — это показатель того, насколько эффективно тепло передается от отливки к форме; чем выше значение, тем быстрее охлаждение и мельче зерно.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-f2.jpg\" alt=\"Коэффициент межфазного теплопереноса при различных технологических параметрах.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Коэффициент межфазного теплопереноса при различных технологических параметрах.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Коэффициент межфазного теплопереноса при различных технологических параметрах. (a) КМТП песчано-смоляной формы при атмосферном и отрицательном давлении. (b) КМТП замороженных песчаных форм с различным содержанием влаги при литье под атмосферным давлением. (c) КМТП замороженных песчаных форм с различным содержанием влаги при −40 °C при литье под отрицательным давлением. (d) КМТП замороженных песчаных форм с содержанием влаги 6 мас.% при различных температурах при литье под отрицательным давлением.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-f3.jpg\" alt=\"Сравнение температурных кривых для различных процессов литья с использованием песчано-смоляных форм. (a) Литье под атмос\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сравнение температурных кривых для различных процессов литья с использованием песчано-смоляных форм. (a) Литье под атмосферным давлением. (b) Литье под отрицательным давлением.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-f4.jpg\" alt=\"Сравнение кривых измерения температуры при литье под атмосферным давлением в замороженные песчаные формы с различными па\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сравнение кривых измерения температуры при литье под атмосферным давлением в замороженные песчаные формы с различными параметрами.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Сравнение кривых измерения температуры при литье под атмосферным давлением в замороженные песчаные формы с различными параметрами. (a) Содержание воды 2 мас.%, начальная температура замораживания −40 °C. (b) Содержание воды 4 мас.%, начальная температура замораживания −40 °C. (c) Содержание воды 6 мас.%, начальная температура замораживания −40 °C.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-f5.jpg\" alt=\"Кривые измерения температуры при литье под отрицательным давлением в замороженные песчаные формы с различными параметрам\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Кривые измерения температуры при литье под отрицательным давлением в замороженные песчаные формы с различными параметрами.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Кривые измерения температуры при литье под отрицательным давлением в замороженные песчаные формы с различными параметрами. (a) Содержание воды 2 мас.%, начальная температура замораживания −20 °C. (b) Содержание воды 4 мас.%, начальная температура замораживания −20 °C. (c) Содержание воды 6 мас.%, начальная температура замораживания −20 °C. (d) Содержание воды 2 мас.%, начальная температура замораживания −30 °C. (e) Содержание влаги 4 мас.%, начальная температура замораживания −30 °C. (f) Содержание влаги 6 мас.%, начальная температура замораживания −30 °C. (g) Содержание воды 2 мас.%, начальная температура замораживания −40 °C. (h) Содержание воды 4 мас.%, начальная температура замораживания −40 °C. (i) Содержание воды 6 мас.%, начальная температура замораживания −40 °C.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-f6.jpg\" alt=\"Микроструктура при различных процессах литья.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Микроструктура при различных процессах литья.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Микроструктура при различных процессах литья. (a) Литье в песчано-смоляную форму при нормальном давлении; (b) литье в песчано-смоляную форму при отрицательном давлении; (c) литье в замороженную песчаную форму (6 мас.% влаги, −40 °C) при нормальном давлении; (d) литье в замороженную песчаную форму (6 мас.% влаги, −40 °C) при отрицательном давлении; (e) литье в замороженную песчаную форму (6 мас.% влаги, −20 °C) при отрицательном давлении; (f) литье в замороженную песчаную форму (6 мас.% влаги, −30 °C) при отрицательном давлении; (g) литье в замороженную песчаную форму (4 мас.% влаги, −40 °C) при отрицательном давлении; (h) литье в замороженную песчаную форму (2 мас.% влаги, −40 °C) при отрицательном давлении.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-f7.jpg\" alt=\"Механические свойства сплава при различных технологических условиях\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Механические свойства сплава при различных технологических условиях&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Механические свойства сплава при различных технологических условиях: (a) предел прочности в литом состоянии; (b) относительное удлинение в литом состоянии; (c) предел прочности после термической обработки; (d) относительное удлинение после термической обработки. (Примечание: 1 обозначает песчано-смоляную форму при атмосферном давлении; 2 обозначает песчано-смоляную форму при отрицательном давлении; 3 обозначает 6 мас.%, −40 °C, атмосферное давление; 4 обозначает 6 мас.%, −40 °C, литье под отрицательным давлением).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-f8.jpg\" alt=\"Сканирующие фотографии поверхностей разрушения при растяжении отливок, полученных различными способами.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сканирующие фотографии поверхностей разрушения при растяжении отливок, полученных различными способами.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Сканирующие фотографии поверхностей разрушения при растяжении отливок, полученных различными способами. (a) Гравитационное литье в песчано-смоляную форму; (b) литье в песчано-смоляную форму при отрицательном давлении; (c) гравитационное литье в замороженную песчаную форму (6 мас.% влаги, −40 °C); (d) литье в замороженную песчаную форму (6 мас.% влаги, −40 °C) при отрицательном давлении; (e) литье в замороженную песчаную форму (6 мас.% влаги, −20 °C) при отрицательном давлении; (f) литье в замороженную песчаную форму (6 мас.% влаги, −30 °C) при отрицательном давлении; (g) литье в замороженную песчаную форму (4 мас.% влаги, −40 °C) при отрицательном давлении; (h) литье в замороженную песчаную форму (2 мас.% влаги, −40 °C) при отрицательном давлении.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-f9.jpg\" alt=\"Сканирующие микрофотографии поверхностей разрушения при растяжении после термической обработки.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сканирующие микрофотографии поверхностей разрушения при растяжении после термической обработки.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Сканирующие микрофотографии поверхностей разрушения при растяжении после термической обработки. (a) Литье в песчано-смоляную форму при атмосферном давлении; (b) литье в песчано-смоляную форму при отрицательном давлении; (c) литье в замороженную песчаную форму (6 мас.% влаги, −40 °C) при атмосферном давлении; (d) литье в замороженную песчаную форму (6 мас.% влаги, −40 °C) при отрицательном давлении; (e) литье в замороженную песчаную форму (6 мас.% влаги, −20 °C) при отрицательном давлении; (f) литье в замороженную песчаную форму (6 мас.% влаги, −30 °C) при отрицательном давлении; (g) литье в замороженную песчаную форму (4 мас.% влаги, −40 °C) при отрицательном давлении; (h) литье в замороженную песчаную форму (2 мас.% влаги, −40 °C) при отрицательном давлении.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-f10.jpg\" alt=\"Механические свойства сплавов при различных технологических условиях.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Механические свойства сплавов при различных технологических условиях.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Механические свойства сплавов при различных технологических условиях. (a) Предел прочности в литом состоянии; (b) относительное удлинение в литом состоянии; (c) предел прочности после термической обработки; (d) относительное удлинение после термической обработки. (Примечание: 1 обозначает 6 мас.%, −20 °C; 2 обозначает 6 мас.%, −30 °C; 3 обозначает 6 мас.%, −40 °C; 4 обозначает 4 мас.%, −40 °C; 5 обозначает 2 мас.%, −40 °C; все при литье под отрицательным давлением).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-f11.jpg\" alt=\"Рис. 11\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 11&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-f12.jpg\" alt=\"Рис. 12\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 12&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-f13.jpg\" alt=\"Рис. 13\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 13&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Дефекты литья&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сплава ZL205A&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Вакуумное&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;литье в&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;замороженные&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;формы&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Рост IHTC и&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;измельчение&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;зерна&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Качественное&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;литье тонких&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;стенок&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Статья опубликована в рецензируемом журнале Materials (Basel, Switzerland). Но и опубликованный результат — одно исследование, а не окончательный вывод.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Materials (Basel, Switzerland) (Europe PMC)&lt;/td&gt;\n&lt;td&gt;steels&lt;/td&gt;\n&lt;td&gt;CC BY 4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Luo L, Luo C, Lv Q, Liang X, Wang L, Su Y, Guo J, Mi F, Chen C, Wang B.&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a href=\"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Ссылка&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Страница статьи&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://europepmc.org/article/PMC/PMC13608691\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;europepmc.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Полный текст (PDF)&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://europepmc.org/articles/PMC13608691?pdf=render\" target=\"_blank\" rel=\"nore
