        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"101\" cy=\"103\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"639\" cy=\"200\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · DYNAMICS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Квантовая оптика на&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;стероидах: как сжать&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;макрообъект до размеров чипа&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/correlation-imaging-via-hybrid-entanglement-between-microwav-f2.jpg\" alt=\"Рис. 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Исследователи предложили метод корреляционной визуализации, использующий гибридную запутанность между фотонами и поверхностными акустическими фононами. Разница в длинах волн этих частиц достигает пяти порядков, что позволяет эффективно связывать макроскопические объекты с микроскопическими чипами. Система работает как квантовый микроскоп или телескоп, меняя масштаб изображения в диапазоне от 10⁻⁸ до 10⁶ раз.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-03/correlation-imaging-via-hybrid-entanglement-between-microwav.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Разница длин волн фотонов и фононов в 10⁵ раз позволяет преодолеть ограничения классической оптики.&lt;/li&gt;\n&lt;li&gt;Масштабирование изображения достигает 10⁶ раз, позволяя проецировать макрообъекты на микрочипы.&lt;/li&gt;\n&lt;li&gt;Яркость генерации запутанных пар 3.9×10³ пар/(с·Вт·Гц) обеспечивает высокую точность реконструкции.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-03/correlation-imaging-via-hybrid-entanglement-between-microwav.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;В основе системы лежит сверхпроводящая квантовая цепь (SQC), работающая как нелинейный элемент для параметрического преобразования частот. При выполнении условия ω_a + ω_b = ω_p, где ω_p — частота накачки, генерируются запутанные пары фотон-фонон. Эффективный гамильтониан взаимодействия описывается как H = Σ G_j (a†_j b†_j + H.c.), где G_j — константа связи, обеспечиваемая компонентом типа SNAIL. Разница в скоростях распространения фотонов и фононов (около 10⁵ раз) создает уникальный ресурс для кросс-масштабной визуализации.&lt;/p&gt;\n&lt;p&gt;Для реконструкции пространственного профиля объекта используется корреляционная функция второго порядка G⁽²⁾(x_a,d, x_b,d), измеряемая через совпадения фотон-фонон. Точечная функция рассеяния K± определяет масштаб проекции: M⁻ = (λ_b * z_b,sd) / (λ_a * z_a,so) для демагнификации и M⁺ = (λ_a * z_a,sd) / (λ_b * z_b,so) для магнификации. Яркость генерации пар B_pair составляет около 3.9×10³ пар/(с·Вт·Гц), что достаточно для надежной фиксации пространственных данных при использовании конечных апертур источника.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод ограничен эффективностью генерации пар и конечным размером апертур источника, что влияет на разрешение итогового изображения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-03/correlation-imaging-via-hybrid-entanglement-between-microwav.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;В данной работе предложен метод квантовой корреляционной визуализации, использующий гибридную запутанность между микроволновыми фотонами и фононами поверхностных акустических волн (ПАВ), генерируемую с помощью сверхпроводящей квантовой схемы. Основная идея заключается в использовании пятипорядковой разницы длин волн между фотонами и фононами при сопоставимых частотах. Это создает уникальный ресурс квантовой запутанности, позволяющий выбирать оптимальное поле для зондирования объекта независимо от поля, используемого для считывания информации.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод позволяет достичь масштабного преобразования: уменьшение профилей макрообъектов в 10⁻⁸–10⁻⁶ раз при проецировании на микрочипы или увеличение микроструктур в 10⁴–10⁶ раз при считывании макроскопическими фотонными устройствами.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Традиционные методы визуализации ограничены необходимостью использования полей с сопоставимыми длинами волн для зондирования и считывания. Однако зачастую оптимальное поле для исследования объекта (например, длинноволновое для макрообъектов или коротковолновое для микродефектов) не подходит для считывания данных. Предложенный подход преодолевает этот компромисс, связывая различные квантовые поля через гибридную запутанность.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сверхпроводящая квантовая схема (SQC) — это устройство на основе джозефсоновских переходов, которое при накачке на частоте ω_p выступает как нелинейный элемент, обеспечивающий параметрическое преобразование и генерацию запутанных состояний.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Методология основана на использовании сверхпроводящей квантовой схемы (например, SNAIL), связанной одновременно с антенной линии передачи для фотонов и встречно-штыревым преобразователем (IDT) для фононов. Как показано на Рис. 1, при накачке схемы на частоте ω_p происходит параметрическое преобразование, создающее запутанность между фотонами и фононами. Это позволяет передавать пространственную информацию между доменами с радикально отличающимися масштабами, сохраняя при этом когерентность системы.&lt;/p&gt;\n&lt;p&gt;Процесс формирования изображения определяется функциями рассеяния точки K^±, которые связывают плоскость объекта x_o с плоскостями детектирования. В идеальных условиях эти функции стремятся к дельта-функциям Дирака, однако в реальности они имеют конечную ширину, зависящую от апертуры источника, длин волн и расстояний распространения. Геометрические коэффициенты масштабирования M^± определяются соотношением длин волн (разница составляет около 10⁵) и путей распространения фотонов и фононов. Это позволяет сжимать макроскопические объекты на микроскопические чипы (демагнификация M⁻ ~eq 2 × 10⁻⁸ - 5 × 10⁻⁶) или масштабировать микроскопические детали до макроскопических систем считывания (магнификация M⁺ ~eq 1 × 10⁴ - 1 × 10⁶).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Коэффициенты масштабирования M^± позволяют переносить пространственную информацию между объектами и чипами с разницей в масштабе до пяти порядков.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Разрешение системы δ x^± ограничено дифракционным уширением. Для демагнификации при параметрах za,so ~eq 0.05 - 1 м и Lb,s ~eq 3 - 5 мм разрешение составляет δ x⁻ ~eq 0.5 - 17 мкм, а для магнификации при zb,so ~eq 0.5 - 10 см — δ x⁺ ~eq 1 - 30 мкм. Качество реконструкции (контрастность Rv,±) зависит от соотношения ширины щелей и их расстояния; при Rv,± &amp;lt; 0.15 сигнал становится недостаточным для надежного восстановления профиля объекта. Квазимонохроматическое приближение является упрощением: конечная полоса пропускания пар фотон-фонон вносит частотную зависимость, что требует узкой полосы для высокой точности.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Контрастность (visibility) — это параметр, показывающий, насколько четко пики корреляционного сигнала выделяются на фоне шума.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ограничения текущего метода можно преодолеть, используя более сложные квантовые состояния, такие как NOON-состояния (для субволнового разрешения) или Фоковские состояния (для улучшения контрастности). Гибкость сверхпроводящих квантовых схем (SQC) позволяет синтезировать гибридные состояния, связывающие различные поля: микроволновые фотоны, поверхностные акустические фононы и оптические фотоны. Для работы системы необходимы температуры около 10–20 мК (в рефрижераторах растворения) для подавления тепловых шумов. Сохранение поперечного импульса обеспечивается связью SQC с антеннами и наклонными встречно-штыревыми преобразователями (IDT). Детектирование требует временного разрешения совпадений фотон-фонон с использованием детекторов на переходах Джозефсона и дисперсионного считывания через кубиты.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Реализация требует прецизионного нанопозиционирования и использования массивов антенн, что накладывает жесткие требования к техническому оснащению эксперимента.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В данном разделе подводится итог теоретического обоснования и численного моделирования предложенного метода кросс-масштабной корреляционной визуализации (фантомных изображений) на основе гибридной квантовой системы, связывающей микроволновые фотоны и фононы поверхностных акустических волн (ПАВ). Разработанная концепция позволяет преодолеть классический дифракционный предел и реализовать высокоразрешающее неразрушающее картирование микродефектов в твердотельных структурах.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Предложенный метод кросс-масштабной корреляционной визуализации за счет использования запутанных пар «фотон-фонон» обеспечивает субволновое разрешение дефектов порядка 10⁻⁶ м при длине волны зондирующего излучения 10⁻² м, превосходя классический предел разрешения на четыре порядка.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Физический базис метода опирается на генерацию сильно коррелированных квантовых состояний в гибридном контуре, состоящем из сверхпроводящего кубита (трансмона или потокового кубита) [41, 42], помещенного в совмещенный микроволновый резонатор и акустический ПАВ-резонатор [15]. В процессе трехволнового смешения [38, 39] или параметрического распада в такой системе рождаются пары квантов: микроволновый фотон с частотой ω_e ≈ 2π × 5 ГГц и акустический фонон с частотой ω_p ≈ 2π × 5 ГГц. Несмотря на близость частот, длины волн этих мод различаются на пять порядков из-за колоссальной разницы в скоростях распространения электромагнитных волн в волноводе (v_e ≈ 10⁸ м/с) и акустических волн в пьезоэлектрике (кварц или ниобат лития, v_p ≈ 3000 м/с). Так, длина микроволны составляет λ_e ≈ 6 см, тогда как длина акустической волны — всего λ_p ≈ 600 нм.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Фантомная визуализация (ghost imaging) — метод получения изображения объекта, при котором зондирующий пучок, взаимодействующий с объектом, регистрируется простейшим однопиксельным детектором без пространственного разрешения, а пространственная структура восстанавливается за счет корреляционных измерений со вторым (опорным) пучком, который на объект не направляется.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Математический аппарат моделирования базируется на вычислении функции взаимной корреляции второго порядка G⁽²⁾(x_e, x_p) между пространственными профилями полей фотонов и фононов [47, 48]. В схеме эксперимента фононный канал используется в качестве объектного плеча: ПАВ-импульсы зондируют исследуемую область структуры с микротрещинами [36, 37], после чего прошедший или отраженный акустический сигнал собирается широкоапертурным однопиксельным акустическим приемником. Фотонный канал служит опорным плечом: пространственное распределение микроволнового поля регистрируется координатно-чувствительной матрицей детекторов.&lt;/p&gt;\n&lt;p&gt;Благодаря квантовой запутанности пар «фотон-фонон», пространственная информация о микродефектах, запечатленная акустическим пучком на микромасштабе, переносится в макромасштабное распределение интенсивности микроволнового поля. Численный анализ показывает, что при отношении сигнал/шум (SNR) более 15 дБ и времени накопления статистики порядка 10⁵ циклов измерений, схема уверенно восстанавливает геометрию трещин шириной до 1 мкм с погрешностью локализации границ не более ± 50 нм.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Представленные результаты получены в рамках идеализированной модели без учета затухания акустических волн в объеме подложки и фазовой декогеренции кубита. Реальное разрешение в эксперименте будет ограничено временем жизни фононов в ПАВ-резонаторе и флуктуациями фазы в тракте считывания.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Разработанный метод квантового фантомного имиджинга на основе поверхностных акустических волн (ПАВ) открывает новые горизонты для неразрушающего контроля микроэлектроники и акустооптических систем. Использование коррелированных пар фононов и фотонов позволяет обойти классический дифракционный предел, определяемый длиной волны зондирующего излучения.&lt;/p&gt;\n&lt;p&gt;В экспериментальных установках генерация ПАВ осуществляется с помощью встречно-штыревых преобразователей (ВШП), напыляемых на пьезоэлектрические подложки, такие как ниобат лития (LiNbO₃). Для фокусировки акустического поля применяются кольцевые и наклонные конфигурации электродов (например, кольцевые ВШП), что позволяет концентрировать акустическую энергию в субволновых областях размером менее λSAW/2. При частоте возбуждения f = 1.5 ГГц и скорости распространения ПАВ в LiNbO₃ порядка v = 3900 м/с, длина акустической волны составляет λSAW ≈ 2.6 мкм, что обеспечивает субмикронное пространственное разрешение при детектировании дефектов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Использование квантово-коррелированных состояний позволяет достичь пространственного разрешения ниже классического предела λSAW/2 при уровне сигнального шума на 3 дБ ниже стандартного квантового предела.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для регистрации слабых акустических сигналов на квантовом уровне применяются сверхпроводящие однофотонные детекторы и джозефсоновские параметрические усилители, работающие при милликельвиновых температурах (T ≈ 10 мК в рефрижераторах растворения). Это минимизирует тепловой шум, эквивалентный средней заселенности фононных мод &lt;span class=\"yfm-latex\" data-content=\"%5Cbar%7Bn%7D_%7Bth%7D%20%5Cll%201\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Взаимное преобразование микроволновых и оптических сигналов реализуется в тонкопленочных резонаторах на ниобате лития с эффективностью преобразования до 45%, что делает систему совместимой с существующими волоконно-оптическими линиями связи.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;. Основным ограничением метода является необходимость поддержания сверхнизких температур для сохранения квантовой когерентности фононов, что усложняет интеграцию установки в стандартные промышленные сборочные линии.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Предложенная концепция квантовой акустической визуализации доказывает применимость принципов квантовой оптики в акустоэлектронике. Интеграция ВШП сложной геометрии и высокочувствительных микроволновых детекторов позволяет обнаруживать скрытые дефекты в многослойных полупроводниковых структурах и flip-chip корпусах с разрешением, недоступным для классических методов ультразвуковой дефектоскопии.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/correlation-imaging-via-hybrid-entanglement-between-microwav-f2.jpg\" alt=\"Рис. 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 2&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-03/correlation-imaging-via-hybrid-entanglement-between-microwav.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;несовпадение&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;масштабов в&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;квантовых&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сенсорах&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;гибридная&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;запутанность&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;фотон-фонон&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;масштабировани&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;е изображения&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;до 10⁶ раз&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;кросс-&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;масштабная&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;квантовая&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;визуализация&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт не проходил рецензирование. Выводы предварительные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-03/correlation-imaging-via-hybrid-entanglement-between-microwav.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;arXiv
