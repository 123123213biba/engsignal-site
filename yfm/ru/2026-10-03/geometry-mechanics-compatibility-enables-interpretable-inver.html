        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"129\" cy=\"124\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"671\" cy=\"291\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · DEVELOPABLES   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Как проектировать гибкое&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;оригами: от сложной&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;математики к простым моделям&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/geometry-mechanics-compatibility-enables-interpretable-inver-f1.jpg\" alt=\"Обзор структуры обратного проектирования на основе совместимости для нежесткого оригами.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Обзор структуры обратного проектирования на основе совместимости для нежесткого оригами.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Обзор структуры обратного проектирования на основе совместимости для нежесткого оригами. (A) Структура, связывающая высокоточный геометрически точный анализ с тестом на геометрико-механическую совместимость и, при допустимости, с упрощенной моделью с 1 степенью свободы (1-DOF) для быстрого и интерпретируемого проектирования. Высокоточный анализ решает задачу нелинейного равновесия на точной сложенной поверхности и выводит поля деформации, кривизны и напряжений. Тест на совместимость сравнивает высокоточный отклик с описанием геометрической модели с 1-DOF и позволяет выполнить редукцию, если нормализованное рассогласование удовлетворяет условию Fmisfit≤tol. Для совместимых случаев, прошедших тест, упрощенная модель обеспечивает низкозатратный оценщик для обратного проектирования с меньшими вычислительными затратами. (B) Традиционный рабочий процесс обратного проектирования, ориентированный на моделирование, в котором генерация вариантов, оценка характеристик, оптимизация/поиск и накопление данных основаны на повторяющихся высокоточных симуляциях. (C) Три проектные области, используемые для проверки переносимости между масштабами и функциями посредством оценки с 1-DOF, квалифицированной по совместимости: программирование механических откликов в метаматериалах оригами, обратное проектирование для морфинга целевой формы и программирование движений под конкретные задачи в робототехнике оригами.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Проектирование нежесткого оригами часто упирается в вычислительную сложность нелинейных моделей. Новый фреймворк вводит тест на совместимость геометрии и механики, позволяя переходить к упрощенным моделям с одной степенью свободы (1-DOF). Это ускоряет поиск оптимальных форм для робототехники и метаматериалов, сохраняя точность расчетов.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-03/geometry-mechanics-compatibility-enables-interpretable-inver.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Безсеточный анализ точно моделирует деформации криволинейных сгибов.&lt;/li&gt;\n&lt;li&gt;Тест на совместимость определяет допустимость перехода к 1-DOF модели.&lt;/li&gt;\n&lt;li&gt;Метод снижает вычислительные затраты при поиске оптимальных форм.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-03/geometry-mechanics-compatibility-enables-interpretable-inver.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;В основе метода лежит высокоточный безсеточный анализ (meshless method), где глобальная матрица жесткости K(S,u) строится на основе реальной геометрии поверхности S и поля перемещений u. Уравнение равновесия K(S,u)u = F решается для определения напряженно-деформированного состояния. Ключевым этапом является тест на совместимость: если нормализованная ошибка F_misfit между высокоточной моделью и упрощенной 1-DOF геометрией не превышает заданный допуск (tol), система признается пригодной для упрощения.&lt;/p&gt;\n&lt;p&gt;Для квалифицированных конструкций используется модель с одной степенью свободы, где деформация описывается через угол складывания θ. Исследование показало высокую точность: среднеквадратичная ошибка (RMS) для многокриволинейных сгибов составила всего 1,6–1,9% по сравнению с методом конечных элементов (FEA). Это позволяет проектировать метаматериалы с программируемой многостабильностью, исключая лишние итерации в оптимизационных циклах.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод требует предварительного определения допуска ошибки и эффективен преимущественно для конструкций, где доминирует изгибная деформация.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-03/geometry-mechanics-compatibility-enables-interpretable-inver.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Кодирование функционального поведения в геометрию является центральной задачей в проектируемых физических системах. Нежесткое оригами предоставляет перспективный путь, позволяя граням и сгибам деформироваться во время движения, связывая кинематику складывания со структурной механикой вне идеализации жесткого складывания. Эта дополнительная податливость существенно расширяет пространство функционального проектирования, обеспечивая применение в метаматериалах, робототехнике, гибкой электронике и развертываемых конструкциях. Реализация этих функций с ориентацией на целевой результат требует метода обратного проектирования, который переводит целевое поведение в схемы сгибов. Однако обратное проектирование нежесткого оригами остается преимущественно ориентированным на моделирование. В текущей практике нелинейные механические решатели многократно встраиваются в циклы оптимизации, или сгенерированные моделированием наборы данных используются для обучения суррогатных моделей для быстрого скрининга. Этот рабочий процесс имеет 3 повторяющихся ограничения. Во-первых, генерация достаточно богатых высокоточных данных для оценки кандидатов или обучения суррогатов (например, через моделирование стержней и шарниров или &lt;a href=\"concepts/finite-element-method.html\"&gt;метод конечных элементов&lt;/a&gt;) является вычислительно дорогостоящей; эта стоимость становится запретительной при скрининге большого количества схем сгибов. Во-вторых, модели пониженного порядка могут ускорить оценку во время оптимизации или генерации суррогатных данных, но многие из них полагаются на специфические для паттерна кинематические или механические допущения и поэтому плохо переносятся на другие схемы сгибов, часто требуя переформулировки при изменении топологии или схемы сгибов. В-третьих, когда поисковая оптимизация не достигает целевой функции, интерпретация неудачи часто затруднена: остается неясным, является ли цель фундаментально невыполнимой при геометрических ограничениях или просто лежит вне исследованной параметризации или пространства проектирования. В совокупности эти ограничения указывают на отсутствие правила принятия решений в текущих рабочих процессах обратного проектирования: теста на совместимость геометрии и механики, который определяет, когда упрощенные описания механически допустимы для скрининга кандидатов, а когда высокоточная механика должна оставаться основным инструментом оценки. Чтобы операционализировать этот принцип, мы представляем структуру обратного проектирования, управляемую геометрией, которая связывает высокоточный эталонный анализ с моделью с одной степенью свободы (1-DOF), прошедшей проверку на совместимость (Рис. 1 A). В отличие от обычных рабочих процессов обратного проектирования, ориентированных на моделирование (Рис. 1 B), наша структура явно определяет с помощью теста на совместимость геометрии и механики, когда допустим низкозатратный скрининг. Высокоточный анализ решает задачу нелинейного механического отклика структур-кандидатов с использованием бессеточного метода, в то время как тест на совместимость определяет, может ли класс проектных решений быть представлен описанием с 1-DOF в пределах заявленного допуска. Совместимые случаи затем быстро проходят скрининг с использованием упрощенной модели, тогда как несовместимые остаются в высокоточном анализе. Это условное сокращение снижает зависимость от повторяющихся нелинейных симуляций без принятия специфических для паттерна допущений упрощенной модели, тем самым улучшая переносимость между схемами сгибов.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/geometry-mechanics-compatibility-enables-interpretable-inver-f1.jpg\" alt=\"Обзор структуры обратного проектирования на основе совместимости для нежесткого оригами.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Обзор структуры обратного проектирования на основе совместимости для нежесткого оригами.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Обзор структуры обратного проектирования на основе совместимости для нежесткого оригами. (A) Структура, связывающая высокоточный геометрически точный анализ с тестом на геометрико-механическую совместимость и, при допустимости, с упрощенной моделью с 1 степенью свободы (1-DOF) для быстрого и интерпретируемого проектирования. Высокоточный анализ решает задачу нелинейного равновесия на точной сложенной поверхности и выводит поля деформации, кривизны и напряжений. Тест на совместимость сравнивает высокоточный отклик с описанием геометрической модели с 1-DOF и позволяет выполнить редукцию, если нормализованное рассогласование удовлетворяет условию Fmisfit≤tol. Для совместимых случаев, прошедших тест, упрощенная модель обеспечивает низкозатратный оценщик для обратного проектирования с меньшими вычислительными затратами. (B) Традиционный рабочий процесс обратного проектирования, ориентированный на моделирование, в котором генерация вариантов, оценка характеристик, оптимизация/поиск и накопление данных основаны на повторяющихся высокоточных симуляциях. (C) Три проектные области, используемые для проверки переносимости между масштабами и функциями посредством оценки с 1-DOF, квалифицированной по совместимости: программирование механических откликов в метаматериалах оригами, обратное проектирование для морфинга целевой формы и программирование движений под конкретные задачи в робототехнике оригами.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Предложенная структура обратного проектирования использует тест на совместимость геометрии и механики для выбора между высокоточным анализом и быстрой моделью с 1-DOF, что снижает вычислительные затраты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;1-DOF (одна степень свободы) означает, что движение всей системы определяется единственным параметром (например, углом сгиба), что значительно упрощает расчеты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод основан на допущении, что поведение системы доминирует за счет изгиба; при сильном растяжении или самоконтакте граней модель требует высокоточного анализа.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Высокоточный геометрически точный анализ как эталонная модель&lt;br /&gt;\nВысокоточный эталонный анализ напрямую вычисляет поля деформации и кривизны на точной сложенной поверхности нежесткого оригами с использованием бессеточной формулировки, с точками интегрирования, определенными на истинной криволинейной геометрии, а не на аппроксимированной сетке поверхности.&lt;/p&gt;\n&lt;p&gt;Для заданной геометрии оригами S (грани и сгибы) мы дискретизировали грани узлами поверхности и собрали локальные взаимодействия «узел-узел» внутри каждой области влияния в глобальную матрицу жесткости K(S, u), которая зависит от геометрии S и текущего поля узловых перемещений u. Граничные условия задаются с помощью вектора внешней нагрузки F, а состояние равновесия получается путем решения уравнения (1): K(S, u)u = F (1). Высокоточный анализ дает деформированную конфигурацию, механические отклики вдоль пути нагружения и распределения кривизны при заданных граничных условиях. Эти выходные данные обеспечивают информацию о деформации и кривизне, используемую в последующей квалификации на основе совместимости, где требуются геометрически согласованные поля кривизны и деформации для оценки допустимости сокращения. Когда сокращение допустимо, они также служат эталоном для валидации упрощенной модели с 1-DOF. Чтобы подтвердить надежность и универсальность привода высокоточного эталонного анализа, мы сначала рассмотрели лист, содержащий один криволинейный сгиб при 3 режимах нагружения (Рис. 2 A): (a) заданное внеплоскостное перемещение края, (b) заданное вращение сгиба (угол складывания) и (c) заданный изгиб панели. Бессеточный анализ фиксирует соответствующие деформированные конфигурации (Рис. 2 B, слева), в то время как распределения углов складывания вдоль нормализованной длины дуги сгиба тесно согласуются с результатами, полученными методом конечных элементов (МКЭ) на основе оболочек для всех 3 режимов нагружения (Рис. 2 B, справа).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/geometry-mechanics-compatibility-enables-interpretable-inver-f2.jpg\" alt=\"Высокоточная валидация для репрезентативного оригами при различных режимах нагружения и топологиях.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Высокоточная валидация для репрезентативного оригами при различных режимах нагружения и топологиях.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Высокоточная валидация для репрезентативного оригами при различных режимах нагружения и топологиях. (A) Геометрия листа с одним криволинейным сгибом (черный — граница листа, красный — криволинейный сгиб) и 3 режима нагружения: (I) заданное перемещение, (II) заданный поворот сгиба (угол складывания) и (III) заданный изгиб панели. (B) Деформированные конфигурации, предсказанные бессеточным методом при 3 режимах нагружения, и соответствующие распределения угла складывания вдоль нормализованной длины дуги сгиба. (C) Конфигурации с множественными криволинейными сгибами, полученные путем высвобождения заданных углов покоя сгибов, показаны для (RKg=1/3) и (RKg=9/5), где красный и синий цвета обозначают сгибы типа «гора» и «долина» соответственно. Бессеточные поля перемещений хорошо согласуются с оболочечным методом конечных элементов (FEA), при этом среднеквадратичные ошибки, нормализованные по (R), составляют 1,9% и 1,6% соответственно. (D) Кольцевой узор с криволинейными сгибами и его результирующая конфигурация равновесия при потере устойчивости. Безразмерная кривизна и кручение сгиба вдоль нормализованной длины дуги хорошо согласуются с эталонным решением Dias et al. (37).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бессеточный анализ точно воспроизводит деформации и распределение углов сгиба, демонстрируя ошибки RMS (среднеквадратичные отклонения) 1,9% и 1,6% по сравнению с МКЭ для сложных конфигураций.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бессеточный метод — это численный подход, где расчеты ведутся не на сетке элементов, а на наборе узлов, что позволяет точнее описывать криволинейные поверхности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Валидация проводилась для конкретных топологий (один сгиб, аннулярные структуры); при переходе к принципиально иным формам точность может потребовать дополнительной проверки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мы использовали тест на совместимость геометрии и механики, чтобы определить, когда высокоточное решение может быть надежно сведено к описанию с 1-DOF для быстрого проектирования. Тест сравнивает поле деформации на точной сложенной поверхности из высокоточного анализа с кандидатом геометрического кинематического пути с 1-DOF, параметризованным единственным движущим углом складывания θ. Из высокоточного анализа мы получаем поле перемещений u и соответствующее поле деформации изгиба ε_b, которое измеряет деформацию грани. Параллельно кандидат геометрической модели с 1-DOF дает свое поле деформации изгиба ε_b^geo через отношение кривизны к углу складывания κ(θ), как показано следующим отображением: &lt;span class=\"yfm-latex\" data-content=\"%5Cepsilon_b%20%5Cleftarrow%20u%2C%20%5Cepsilon_b%5E%7Bgeo%7D%20%5Cleftarrow%20%5Ckappa(%20heta)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (2). Перед сравнением 2 поля деформации изгиба отображаются на одни и те же координаты поверхности. Затем мы проводим предварительный отбор на поведение, доминируемое изгибом, используя отношение энергии деформации изгиба к полной энергии. Для случаев, прошедших этот предварительный отбор, мы оцениваем согласие между высокоточным откликом и кандидатом пути с 1-DOF, используя нормализованное расхождение изгиба Fmisfit, и объявляем совместимость, когда &lt;span class=\"yfm-latex\" data-content=\"F_%7Bmisfit%7D%20%3D%20%5C%2F%5Cepsilon_b%20-%20%5Cepsilon_b%5E%7Bgeo%7D%5C%2F%20%2F%20%5C%2F%5Cepsilon_b%5C%2F%20%5Cle%20tol\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (3), где tol — заранее заданный допустимый допуск аппроксимации для скрининга проекта.&lt;/p&gt;\n&lt;p&gt;Для случаев, прошедших квалификацию по совместимости, упрощенная модель с 1-DOF служит моделью проектирования пониженного порядка, сводя движение к описанию с 1-DOF, параметризованному одной движущей переменной. По 4 репрезентативным эталонным случаям (Рис. 3 A–D) упрощенная модель сохраняет доминирующие механизмы деформации, идентифицированные из высокоточного анализа, переписывая их в закрытой форме для эффективной и интерпретируемой оценки. В частности, доминирующие механизмы извлекаются путем анализа высокоточных полей изгиба и дистиллируются в приведенные переменные и члены связи (Рис. 3 E–H). Полученные аналитические выражения воспроизводят высокоточные отклики «энергия-перемещение» с близким согласием в отображаемых трендах при тех же историях нагружения (Рис. 3 I–L), заменяя высокоточную оценку кандидатов однопараметрическим оценщиком для совместимых случаев.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/geometry-mechanics-compatibility-enables-interpretable-inver-f3.jpg\" alt=\"Редуцированная модель, основанная на геометрико-механической совместимости.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Редуцированная модель, основанная на геометрико-механической совместимости.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Редуцированная модель, основанная на геометрико-механической совместимости. (A–D) Четыре репрезентативные конфигурации и граничные условия: (A) евклидово оригами, (B) неевклидово оригами, (C) оригами с непараллельными линиями развертки и (D) дважды изогнутый лист оригами (стрелки обозначают BC1/BC2). (E–H) Поля главных изгибов высокой точности, спроецированные на точную поверхность (сверху), и выделенные доминирующие механизмы, используемые для выбора редуцированных переменных и членов связи для упрощенной модели (снизу). (I–L) Валидация при тех же историях нагружения: аналитические предсказания упрощенной модели точно отслеживают высокоточные численные отклики «энергия–перемещение», подтверждая возможность оценки с пониженной размерностью в совместимых случаях.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Далее мы используем структуру для программирования механического отклика в метаматериалах оригами с криволинейными сгибами через упрощенную модель. Используя двухслойную элементарную ячейку с криволинейным сгибом и ее тесселированную сборку (Рис. 4 A), мы сравниваем отклики «нагрузка-перемещение», предсказанные упрощенной моделью, с результатами высокоточного анализа и наблюдаем сильное согласие на уровне элементарной ячейки (Рис. 4 B). После установления этого согласия мы используем генетический алгоритм для настройки отношения толщин верхнего и нижнего слоев и получения целевых семейств жесткости, включая положительные, околонулевые и отрицательные отклики жесткости (Рис. 4 C).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/geometry-mechanics-compatibility-enables-interpretable-inver-f4.jpg\" alt=\"Проектирование, валидация и применение метаматериала оригами с криволинейными сгибами на основе упрощенной модели.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Проектирование, валидация и применение метаматериала оригами с криволинейными сгибами на основе упрощенной модели.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Проектирование, валидация и применение метаматериала оригами с криволинейными сгибами на основе упрощенной модели. (A) Проектируемый двухслойный модуль с криволинейными сгибами и его 3D-тесселяция. (B) Сравнение упрощенной модели и высокоточного анализа при сжатии элементарной ячейки. (C) Семейства периодических метаматериалов, спроектированные для проявления положительной, околонулевой или отрицательной эффективной жесткости путем настройки соотношений толщины слоев; линии обозначают аналитические проекты, а заштрихованные полосы показывают экспериментальные диапазоны для n = 3 независимых образцов (снимки справа). (D) Удаление зеленого межслойного сгиба устраняет доминирующее геометрическое ограничение и приводит к последовательно-параллельной (LSP) компоновке с развязанными слоями. (E) Зажимная секция, обеспечивающая измерение в режиме реверса силы. (F) Мультистабильность, достигнутая послойным проектированием: оптимизированная кривая (линия) и экспериментальный диапазон (заштриховано); оранжевые маркеры обозначают стабильные состояния. (G) Концепция стельки с использованием метаматериала с несколькими плато рассеивания энергии: 3 сегмента распределены для амортизации, поддержки и защиты с репрезентативными плато отдельных сегментов (справа). (H) Результирующая кривая «нагрузка–перемещение» с несколькими плато разделена на зоны амортизации/поддержки/защиты; предсказание совпадает с экспериментом. В (C), (F) и (H) заштрихованные полосы представляют точечный диапазон от минимума до максимума нагрузки, полученный по 3 независимым образцам при каждом заданном перемещении. Масштабная линейка: 10 мм.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Далее мы используем структуру для формирования целевой формы в оригами с криволинейными сгибами, начиная с периодических паттернов и затем расширяясь до апериодических. Для периодических случаев (Рис. 5 A–C) складывание одного сгиба распространяется через паттерн сгибов благодаря геометрической совместимости, создавая коллективную деформацию с приблизительной вращательной симметрией или обеспечивая формирование замкнутой поверхности. Используя эту периодическую архитектуру, упрощенная модель быстро генерирует схемы сгибов-кандидатов для репрезентативных дважды криволинейных целевых поверхностей (Рис. 5 C).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/geometry-mechanics-compatibility-enables-interpretable-inver-f5.jpg\" alt=\"Обратное проектирование на основе упрощенной модели и применение форм оригами с криволинейными сгибами.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Обратное проектирование на основе упрощенной модели и применение форм оригами с криволинейными сгибами.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Обратное проектирование на основе упрощенной модели и применение форм оригами с криволинейными сгибами. (A) Периодический узор модуля с криволинейными сгибами и схематическая декомпозиция. (B) Изменение углового интервала между соседними модулями во время складывания, приводящее к замкнутым конфигурациям при соединении границ. (C) Обратно спроектированные диаграммы сгибов и их сложенные модели, достигающие репрезентативных дважды изогнутых поверхностей с оптимизированным соответствием целевым геометриям. (D) Расширение от периодических к апериодическим конструкциям: проектирование целевых 3D нерегулярных узоров поперечного сечения и боковых узоров на основе плоских апериодических диаграмм сгибов. (E) Примеры с использованием поперечных сечений в форме букв (S, J, T, U), демонстрирующие воспроизведение заданных границ в сложенных моделях (нижние панели), показанные как в виде сверху, так и в стандартном виде. Масштабная линейка: 20 мм.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Валидировав предложенную структуру для обратного проектирования программируемых механических откликов и реализации целевой формы на уровне архитектуры, мы далее исследуем, распространяется ли та же логика, управляемая геометрией, на роботизированную манипуляцию на системном уровне. В этой настройке центральной задачей является не единая цель производительности, а одновременная реализация низкой сложности управления, пространственной программируемости, доступности изготовления и динамической настраиваемости. Мы используем сравнение с помощью лепестковой диаграммы с обычными мягкими и континуальными роботами (Рис. 6 A), чтобы сформулировать эту многокритериальную задачу проектирования и мотивировать модульный путь оригами, который может сбалансировать эти требования в рамках схемы привода с 1-DOF.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/geometry-mechanics-compatibility-enables-interpretable-inver-f6.jpg\" alt=\"Проектирование и применение оригами-манипулятора на основе упрощенной модели.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Проектирование и применение оригами-манипулятора на основе упрощенной модели.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Проектирование и применение оригами-манипулятора на основе упрощенной модели. (A) Лепестковая диаграмма, сравнивающая предложенный манипулятор с традиционными мягкими и континуальными роботами, обобщающая компромиссы в проектировании: минимизация управления, пространственная программируемость, доступность изготовления и динамическая настраиваемость. (B) Оптимизированный рабочий процесс «печать-сгибание-нагрев-сборка», иллюстрирующий переход от 2D композитных паттернов (PETG и TPU) к специализированным рабочим органам и 3D кинематическим модулям. (C) Кинематические примитивы на уровне элементарных ячеек, закодированные различными схемами сгибов, демонстрирующие переходы удлинения (i), изгиба (ii) и скручивания (iii) из плоского состояния в полностью развернутое. (D) Последовательные снимки, сравнивающие динамику развертывания жестких (ломаная линия) и податливых (криволинейный сгиб) сегментов. (E) Профили нормализованной плотности энергии деформации жестких и податливых сегментов, раскрывающие механизм накопления упругой энергии для быстрого развертывания. (F) Демонстрация модульного манипулятора с тросовым приводом и различными кинематическими кодировками (пути 1 и 2), обеспечивающими различную морфологию манипулятора и функции рабочих органов (например, жесткие и податливые захваты) из единой плоской формы. (G) Установка для выполнения задач с воздуха, объединяющая плоский сложенный манипулятор с БПЛА и двигателем дистанционного управления для захвата. (H) Демонстрация выполнения задач с использованием дополнительных запрограммированных путей (пути 3 и 4), где кинематика манипулятора, специфичная для пути, позволяет выполнять различные траектории манипулирования, ориентированные на цель. (I) Пространство программируемых путей, реконструированное на основе полученных кинематических откликов, с репрезентативными траекториями, иллюстрирующими доступную 3D-область движения, обеспечиваемую модульной конструкцией оригами.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-03/geometry-mechanics-compatibility-enables-interpretable-inver.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Высокая&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;стоимость&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;нелинейных&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;расчетов&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Тест&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;совместимости&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;геометрии и&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;механики&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Упрощенная&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;модель с одной&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;степенью&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;свободы&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Быстрое&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;проектирование&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сложных&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;механизмов&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Статья опубликована в рецензируемом журнале Research (Washington, D.C.). Но и опубликованный результат — одно исследование, а не окончательный вывод.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-03/geometry-mechanics-compatibility-
