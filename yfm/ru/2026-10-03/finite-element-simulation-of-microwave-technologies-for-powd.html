        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"247\" cy=\"83\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"693\" cy=\"245\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · PRINTING_3D   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Микроволны вместо лазеров:&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;объемная печать металлами и&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;керамикой&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd-f1.jpg\" alt=\"Рисунок 1: Примеры существующих и предлагаемых систем аддитивного производства (AM).\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Примеры существующих и предлагаемых систем аддитивного производства (AM).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1: Примеры существующих и предлагаемых систем аддитивного производства (AM). a) Графическое изображение лазерного порошкового синтеза (PBF) для металлических порошков (39). b) Схема системы объемного аддитивного производства (VAM) с использованием фоточувствительных смол и оптических частот. DLP-проектор использует переменную дифракцию и интерференцию от параксиальных источников для создания зависящих от времени изображений вдоль одной оси, а поворотный столик позволяет расширить двумерную плоскость изображения до трехмерных форм. Рисунок из «Volumetric additive manufacturing via tomographic reconstruction» (30). Адаптировано с разрешения AAAS. c) Микроволновая система VAM, предложенная Мукерджи и соавт. (34), эквивалентная оптической системе в пункте b). При достаточном количестве антенн антенная решетка обеспечивает полный контроль над интенсивностью электрического поля и позволяет реализовать VAM без поворотного столика. Рисунок из «Towards microwave volumetric additive manufacturing: Generation of a computational multi-physics model for localized curing» (34). Адаптировано с разрешения Elsevier. d) Графическое изображение предлагаемой микроволновой системы VAM. Волновод (оранжевый), содержащий объем порошка (синий), удерживаемый диэлектрическими стенками (зеленый), получает энергию микроволнового излучения. Естественные электромагнитные моды устройства, зависящие от входных поперечных мод, избирательно расплавляют области порошка с наибольшей интенсивностью поля. e) Подборка архитектурных ячеек 3D-решеток. В данной работе основное внимание уделяется решеткам с размером ячейки около 1 мм. Рисунок из «Architected cellular materials: A review on their mechanical properties towards fatigue-tolerant design and fabrication» (40). Адаптировано с разрешения Elsevier.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Традиционная 3D-печать ограничена скоростью послойного синтеза и типом материалов. Исследователи предложили метод объемной печати (VAM) на основе микроволнового излучения, позволяющий работать с керамикой и металлами. С помощью конечно-элементного моделирования удалось спроектировать устройства, создающие тепловые решетки внутри порошкового слоя.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Применение СВЧ-излучения (8–40 ГГц) для объемной печати керамикой и металлами.&lt;/li&gt;\n&lt;li&gt;Формирование тепловых решеток с размером ячейки ~1 мм при мощности 100 кВт.&lt;/li&gt;\n&lt;li&gt;Использование конечно-элементного моделирования для оптимизации тепловых полей.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;В работе использованы методы конечно-элементного анализа (FEM) в среде COMSOL Multiphysics для моделирования трех типов устройств: линейного резонатора, перекрестного интерферометра и граничного нагревателя. Для преодоления вычислительной сложности при работе с порошками применено приближение эффективной среды, где материал рассматривается как однородный объем, если размер частиц значительно меньше длины волны (диапазон 8–40 ГГц).&lt;/p&gt;\n&lt;p&gt;Результаты показывают, что при точном управлении частотой и мощностью (порядка 100 кВт) можно формировать тепловые узлы с размером ячейки около 1 мм. Резонаторы и интерферометры обеспечивают спекание 3D-решеток в керамических и композитных порошках, тогда как граничные нагреватели позволяют печатать полые оболочки из чистых металлов. Использование СВЧ-излучения исключает необходимость в прозрачных фотополимерных смолах, открывая путь к прямому производству высокопрочных конструкционных материалов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование носит теоретический характер; не учитываются эффекты пробоя Пашена и реальные дефекты изготовления устройств.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Объемная аддитивная технология (VAM) представляет собой перспективный метод производства, позволяющий сократить время изготовления изделий по сравнению с традиционной 3D-печатью при сохранении возможности создания сложных геометрических форм. Современные системы VAM ограничены использованием фотополимеризующихся смол, что сужает область их промышленного применения. В данной работе представлены результаты конечно-элементного моделирования микроволновых систем VAM, совместимых с порошковыми материалами: керамикой, металлами и композитами.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Конечно-элементное моделирование (КЭМ) — это численный метод решения инженерных задач, при котором сложный объект разбивается на множество простых элементов для анализа распределения температур и напряжений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Исследование охватывает три типа устройств: линейный резонатор, перекрестный интерферометр и граничный нагреватель. Каждое из них потенциально применимо для обработки одного или нескольких типов порошкового сырья. Моделирование показало, что при точном управлении входной частотой, мощностью и поперечными модами волновода можно создавать тепловые решетки для селективного нагрева областей материала, что является основой для процесса VAM.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Установлено, что при входной мощности порядка 100 кВт возможно формирование тепловых решеток с размером ячеек около 1 мм, что открывает путь к аддитивному производству из материалов, недоступных для оптических методов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Данные получены исключительно путем компьютерного моделирования; экспериментальная проверка работоспособности предложенных систем на реальных установках не проводилась.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;h4 id=\"sovremennye-metody-additivnogo-proizvodstva\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#sovremennye-metody-additivnogo-proizvodstva\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Современные методы аддитивного производства&lt;/span&gt;&lt;/a&gt;Современные методы аддитивного производства&lt;/h4&gt;\n&lt;p&gt;Аддитивное производство (АП) позволяет снижать затраты и количество отходов при создании деталей сложной геометрии. Традиционные технологии, такие как стереолитография (SLA) и цифровая световая проекция (DLP), строят объекты послойно, проецируя 2D-изображения на слой смолы. Эти методы ограничены низкой скоростью из-за малого объема засветки и необходимости механического перемещения слоев. Для металлов применяются методы сплавления порошкового слоя (PBF) со скоростью 0,1 л/ч, струйной печати связующим (binder jetting) до 1000 л/ч и направленного энергетического осаждения (DED) 0,5 л/ч. Однако струйная печать страдает от усадки при спекании и деформаций, а PBF и DED работают медленно.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Традиционные методы АП ограничены либо низкой скоростью (SLA, DLP, PBF, DED), либо проблемами с точностью (binder jetting).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"obuemnoe-additivnoe-proizvodstvo-vam\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#obuemnoe-additivnoe-proizvodstvo-vam\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Объемное аддитивное производство (VAM)&lt;/span&gt;&lt;/a&gt;Объемное аддитивное производство (VAM)&lt;/h4&gt;\n&lt;p&gt;Альтернативой является объемное аддитивное производство (VAM), где весь объем материала отверждается одновременно с помощью интерференции лазерных лучей, как показано на Рис. 1b. Это исключает необходимость в поддерживающих структурах. Основное ограничение VAM — необходимость использования прозрачных фоточувствительных смол; рассеяние света препятствует работе с наполненными композитами. Использование микроволнового излучения (Рис. 1c) позволяет работать с непрозрачными материалами, так как микроволны меньше рассеиваются на микрочастицах. В данной работе исследуется возможность применения микроволнового VAM для порошковых сред без использования смол, используя омический и дипольный нагрев (Рис. 1d).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd-f1.jpg\" alt=\"Рисунок 1: Примеры существующих и предлагаемых систем аддитивного производства (AM).\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Примеры существующих и предлагаемых систем аддитивного производства (AM).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1: Примеры существующих и предлагаемых систем аддитивного производства (AM). a) Графическое изображение лазерного порошкового синтеза (PBF) для металлических порошков (39). b) Схема системы объемного аддитивного производства (VAM) с использованием фоточувствительных смол и оптических частот. DLP-проектор использует переменную дифракцию и интерференцию от параксиальных источников для создания зависящих от времени изображений вдоль одной оси, а поворотный столик позволяет расширить двумерную плоскость изображения до трехмерных форм. Рисунок из «Volumetric additive manufacturing via tomographic reconstruction» (30). Адаптировано с разрешения AAAS. c) Микроволновая система VAM, предложенная Мукерджи и соавт. (34), эквивалентная оптической системе в пункте b). При достаточном количестве антенн антенная решетка обеспечивает полный контроль над интенсивностью электрического поля и позволяет реализовать VAM без поворотного столика. Рисунок из «Towards microwave volumetric additive manufacturing: Generation of a computational multi-physics model for localized curing» (34). Адаптировано с разрешения Elsevier. d) Графическое изображение предлагаемой микроволновой системы VAM. Волновод (оранжевый), содержащий объем порошка (синий), удерживаемый диэлектрическими стенками (зеленый), получает энергию микроволнового излучения. Естественные электромагнитные моды устройства, зависящие от входных поперечных мод, избирательно расплавляют области порошка с наибольшей интенсивностью поля. e) Подборка архитектурных ячеек 3D-решеток. В данной работе основное внимание уделяется решеткам с размером ячейки около 1 мм. Рисунок из «Architected cellular materials: A review on their mechanical properties towards fatigue-tolerant design and fabrication» (40). Адаптировано с разрешения Elsevier.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VAM — метод «мгновенной» печати всего объема детали, в отличие от послойного наращивания.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"arhitekturnye-materialy\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#arhitekturnye-materialy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Архитектурные материалы&lt;/span&gt;&lt;/a&gt;Архитектурные материалы&lt;/h4&gt;\n&lt;p&gt;Природные электромагнитные моды волноводов позволяют создавать периодические решетки, востребованные в производстве архитектурных материалов. Это пористые структуры из узлов и стержней, обладающие высокими показателями жесткости и прочности к плотности. Они находят применение в аэрокосмической отрасли и медицине, так как позволяют оптимизировать топологию и снижать массу изделий. В работе предлагается интеграция резонаторов и волноводов для быстрого и энергоэффективного производства таких решеток из керамики и металлических оболочек (Рис. 1e).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование является численным обоснованием концепции (proof of concept), перенос результатов на реальные производственные установки требует экспериментальной проверки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"2-oblast-issledovaniya\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#2-oblast-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. Область исследования&lt;/span&gt;&lt;/a&gt;2. Область исследования&lt;/h4&gt;\n&lt;p&gt;Данная работа представляет собой анализ концепции и технической осуществимости микроволнового аддитивного производства (VAM) с использованием порошковых материалов. С помощью метода конечных элементов (&lt;a href=\"concepts/finite-element-method.html\"&gt;МКЭ&lt;/a&gt;) авторы исследуют три архитектуры устройств: 1) линейный резонатор, использующий усиление внутреннего поля и стоячие волны; 2) перекрестный интерферометр, применяющий интерференцию для достижения разрешения меньше длины волны; 3) граничный нагреватель для расширения совместимости с металлическими порошками при создании специфических геометрий.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование оценивает три архитектуры устройств, оптимизируя их для снижения энергопотребления, повышения гибкости паттернов и расширения спектра используемых материалов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Линейный резонатор направлен на снижение требований к мощности за счет усиления поля в полости, однако ограничивает геометрию печати дискретным набором резонансных мод. Перекрестный интерферометр жертвует усилением поля ради свободы формирования паттернов, позволяя использовать произвольные комбинации входных мод и фаз для получения более мелких деталей. Граничный нагреватель предназначен для работы с металлическими порошками, которые невозможно нагреть объемно, что ограничивает печать полыми оболочечными структурами.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод конечных элементов (МКЭ) — это численный способ решения инженерных задач, при котором сложная физическая система разбивается на множество простых элементов для расчета распределения полей и температур.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Исследование фокусируется на диапазоне сверхвысоких частот (SHF) и миллиметровых волн от 8 ГГц до 40 ГГц. Этот диапазон выбран из-за длины волны миллиметрового масштаба, что позволяет избежать рассеяния на порошках микронного размера. Это обеспечивает возможность применения приближения эффективной среды для определения электромагнитных и тепловых свойств порошка при сохранении субмиллиметрового разрешения фазовых структур. Материалы ограничены диэлектрической керамикой, металлами и их композитами; полупроводники исключены из-за температурной зависимости их свойств и нехватки эмпирических данных.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Моделирование ограничено идеализированными условиями: полупроводники не рассматриваются, а системы предполагают полную локализацию мод внутри проводящих слоев для обеспечения безопасности от пробоя и излучения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"linejnyj-rezonator\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#linejnyj-rezonator\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Линейный резонатор&lt;/span&gt;&lt;/a&gt;Линейный резонатор&lt;/h4&gt;\n&lt;p&gt;Линейный резонатор представляет собой конструкцию типа Фабри-Перо, интегрированную в волновод. Устройство генерирует стоячие волны, создающие трехмерные решетки интенсивности электрического поля в диэлектрических порошках с низкой или умеренной степенью поглощения. Это достигается за счет наложения поперечных мод, заданных границами волновода, и продольных мод, формируемых зеркалами Фабри-Перо. Метод позволяет осуществлять прямую печать базовых решетчатых структур из керамических и композитных порошков, при этом геометрия изделий ограничена суперпозицией наборов резонансных мод.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Линейный резонатор использует волноводные и продольные моды для создания 3D-решеток в порошках, требуя мощности от 200 кВт до 1 МВт для предотвращения тепловых искажений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Схема устройства (Рис. 3a) включает распределенные брэгговские отражатели (DBR) и рабочую камеру с порошком. Зеркала DBR состоят из слоев высокочистого оксида алюминия (ε_r = 9,7,  anδ = 10⁻⁴ при центральной частоте полосы запирания 10 ГГц), разделенных воздушными промежутками. В качестве рабочего материала выбран порошок плавленого кварца (fused silica) из-за низкой температурной зависимости диэлектрической проницаемости (α ≈ 5 \times 10⁻⁵) и относительно высокого тангенса угла диэлектрических потерь ( anδ ≈ 10⁻³), что на порядок выше, чем у кварца или оксида алюминия. Относительная диэлектрическая проницаемость материала при комнатной температуре составляет 3,8.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd-f3.jpg\" alt=\"Рисунок 3: Схема и моделирование модели линейного резонатора с использованием сырья из чистого плавленого кварца.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3: Схема и моделирование модели линейного резонатора с использованием сырья из чистого плавленого кварца.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 3: Схема и моделирование модели линейного резонатора с использованием сырья из чистого плавленого кварца. a) Диаграмма системы, показывающая компоненты резонатора. Порт 1 — активный входной порт, порт 2 — приемный порт. b) Профиль тетраэдрической сетки, созданный для ВЧ и теплового моделирования из пункта a). Разница в размере сетки для каждой области обусловлена различием значений ε′ между слоями. c) Двумерный срез при y = 0 рассчитанного профиля электрического поля в зависимости от времени. Использовалась входная мощность 250 кВт. d) Результирующее распределение температуры от электромагнитного нагрева в той же плоскости, что и в пункте c). Нагрев рассчитывался с шагом 0,1 мс для обновления профиля электрического поля на каждом шаге в течение 250 мс.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Распределенный брэгговский отражатель (DBR) — это структура из чередующихся слоев материалов с разными показателями преломления, которая эффективно отражает электромагнитные волны определенной частоты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Длина полости, заполненной порошком, составляет 97,3 мм. С учетом проникновения поля в зеркала DBR, эффективная оптическая длина резонатора составляет 6λ_g ≈ 99,9 мм на резонансной частоте 9,825 ГГц, где λ_g — длина волны в волноводе. Разница в 2,6 мм соответствует проникновению поля на 1,3 мм в каждое зеркало. Температурная зависимость диэлектрической проницаемости кварца моделируется линейной экстраполяцией до температуры плавления T_m = 1986 К (1713 °C).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель опирается на линейную экстраполяцию диэлектрических свойств кварца вплоть до температуры плавления из-за дефицита экспериментальных данных, что является основным источником неопределенности результатов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"parametry-konechno-elementnogo-modelirovaniya-i-temperaturnaya-dinamika\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#parametry-konechno-elementnogo-modelirovaniya-i-temperaturnaya-dinamika\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Параметры конечно-элементного моделирования и температурная динамика&lt;/span&gt;&lt;/a&gt;Параметры конечно-элементного моделирования и температурная динамика&lt;/h4&gt;\n&lt;p&gt;Для численного моделирования была создана неоднородная сетка (Рис. 3b), разрешение которой варьируется между слоями оксида алюминия и воздушными зазорами. Шаг по времени установлен на 0,1 мс. Микроволновое излучение в основной моде TE₁₀ подавалось через активный порт и фиксировалось на приемном порту. Результаты моделирования (Рис. 3c, 3d) показывают нагрев в пучностях стоячих волн резонатора с шагом 8,33 мм, что соответствует λ_g/2 (где λ_g — длина волны в волноводе с порошком).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование системы DBR из трех периодов позволяет достичь Tmax = 1215 К (942 °C) при входной мощности 250 кВт за 250 мс, тогда как без зеркал температура достигает лишь 393 К (120 °C).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;DBR (Distributed Bragg Reflector) — это структура, состоящая из чередующихся слоев с разными показателями преломления, работающая как высокоэффективное зеркало для электромагнитных волн.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"temperaturnaya-filtraciya-i-optimizaciya-dobrotnosti\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#temperaturnaya-filtraciya-i-optimizaciya-dobrotnosti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Температурная фильтрация и оптимизация добротности&lt;/span&gt;&lt;/a&gt;Температурная фильтрация и оптимизация добротности&lt;/h4&gt;\n&lt;p&gt;Устройство демонстрирует эффект температурной фильтрации: диэлектрическая проницаемость среды монотонно растет с температурой, сдвигая фазу волны и выводя резонатор из резонанса. Это ограничивает максимальную температуру Tmax. Добавление 1% технического углерода (эффективная &lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon'_%7Beff%7D%20%3D%203%2C75\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; и  anδeff = 0,02) подтвердило это поведение: нагрев достиг Tmax = 1198 К (925 °C), но при снижении требуемой мощности до 210 кВт (Рис. 4a).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd-f4.jpg\" alt=\"Рисунок 4: Исследования максимально достижимой внутренней температуры за 250 мс и формирование 3D-температурной решетки.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 4: Исследования максимально достижимой внутренней температуры за 250 мс и формирование 3D-температурной решетки.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 4: Исследования максимально достижимой внутренней температуры за 250 мс и формирование 3D-температурной решетки. a) Влияние тангенса угла потерь эффективной среды на кривую нагрева, сравнение чистого плавленого кварца (tanδ = 0,001) с 1% композитом технического углерода (tanδ = 0,02). b) Влияние добротности (Q-фактора) резонатора на кривую нагрева; добротности Q = 18, 75 и 890 соответствуют нулю, одному и трем периодам оксид алюминия/воздух на зеркало соответственно. c) Показывает 3D-решетку внутри однослойного резонатора и определяет минимальные продольные и поперечные расстояния как 2,1 мм и 5,1 мм. d) Изображает x-z срез температуры, пересекающий точку максимальной температуры в объеме (Tmax = 443 К (170 °C)), с детализацией продольной решетки. e) Изображает визуализацию архитектурного материала, полученного с помощью этого устройства. Используя последовательности импульсного нагрева с приложенным теплообменом, тепловые узлы расширяются до перекрывающегося профиля со стойками, определяемыми профилем поперечной моды, и спекаются в кубическую (или прямоугольную) решетчатую структуру.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Анализ добротности (Q) резонаторов Фабри-Перо (Рис. 4b) показывает, что Q = 75 является оптимальным для баланса между усилением поля и шириной линии резонанса. При более высоких значениях Q расчетные температуры превышают температуру плавления диоксида кремния, что делает модель нефизичной. Использование моды TE₃₂ на частоте 36 ГГц позволяет формировать трехмерные тепловые решетки (Рис. 4c, 4d), что открывает возможности для детерминированной печати керамических структур (Рис. 4e).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Моделирование основано на линеаризованной модели диэлектрической проницаемости; при температурах выше точки плавления материала результаты требуют экспериментальной верификации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"perekrestnyj-interferometr\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#perekrestnyj-interferometr\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Перекрестный интерферометр&lt;/span&gt;&lt;/a&gt;Перекрестный интерферометр&lt;/h4&gt;\n&lt;p&gt;Конструкция перекрестного интерферометра представляет собой L-образное соединение двух волноводов WR-90. В области их пересечения удерживается порошок диоксида кремния, ограниченный двумя тонкими стенками из оксида алюминия. Система создает трехмерные решетки за счет интерференции волн от двух перпендикулярных входов, что аналогично антенной решетке из четырех источников. В отличие от линейного резонатора, данная схема позволяет задавать произвольные входные параметры, обеспечивая более гибкое управление профилем поля, хотя и теряет преимущество в виде внутреннего усиления поля и стабилизации мод. Геометрия системы, включая скругления углов для предотвращения сингулярностей поля, представлена на Рис. 5a и 5b.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd-f5.jpg\" alt=\"Рисунок 5: Схема и моделирование модели перекрестного интерферометра для входной моды TE32.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 5: Схема и моделирование модели перекрестного интерферометра для входной моды TE32.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 5: Схема и моделирование модели перекрестного интерферометра для входной моды TE32. a) Диаграмма системы, на врезке показана входная мода. Размеры a и b соответствуют входу волновода WR-90 (a = 0,9 дюйма × b = 0,4 дюйма). b) Детальный вид в поперечном сечении схемы из пункта a). Диэлектрическая область — это поглощающий порошок, тонкие желтые стенки представляют оксид алюминия. Порт 1 и порт 2 являются активными входными портами. c) Двумерный срез при y = 0 рассчитанного профиля электрического поля через 100 мс. d) Результирующее распределение температуры от электромагнитного нагрева в той же плоскости, что и в пункте c). Нагрев рассчитывался с шагом 0,1 мс с пересчетом профиля электромагнитной моды на каждом шаге.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Перекрестный интерферометр — устройство, формирующее интерференционную картину электромагнитного поля путем наложения волн из двух разных источников, что позволяет гибко управлять распределением энергии в порошке.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Моделирование проводилось для моды TE₃₂ при подаче микроволнового излучения в порты 1 и 2. Расчет охватывал 100 мс с шагом 0,1 мс. Электромагнитное поле в области порошка существенно менялось по мере нагрева из-за температурной зависимости диэлектрической проницаемости, что приводило к дрейфу интерференционной картины. На Рис. 5c и 5d показано значительное расхождение между профилями электрического поля и температуры к концу процесса. Несмотря на нестабильность мод, удалось достичь формирования решетки с шагом 1,86 мм и максимальной температурой Tmax = 1232 К (959 °C) при мощности 100 кВт на каждом порту.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Система обеспечивает формирование стабильной и предсказуемой решетки с шагом 1,86 мм при Tmax = 1232 К, несмотря на динамическое изменение профиля поля в процессе нагрева.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Практическая сложность заключается в том, что зависимость между входными параметрами (частота, фаза) и итоговым тепловым полем не является интуитивной. Для решения этой обратной задачи при печати могут быть использованы алгоритмы типа Герчберга-Сэкстона. Для оценки влияния стохастичности отклика материала на изменение диэлектрической проницаемости ε_r(T) были проведены симуляции с коэффициентами пропорциональности α от 0 до 10⁻² К⁻¹. Результаты для моды TE₁₀ (Рис. 6a) показывают, что при высоких значениях α поле сильно варьируется, однако итоговое распределение температуры сохраняет схожий геометрический профиль. Стохастичность поля приводит к некоторому расширению теплового пятна и снижению Tmax, что указывает на возможные отклонения в реальных экспериментах, которые, однако, не делают модель невалидной.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd-f6.jpg\" alt=\"Рисунок 6: Исследование чувствительности и идеальный выход устройства с использованием частотных разверток для перекрест\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 6: Исследование чувствительности и идеальный выход устройства с использованием частотных разверток для перекрестного интерферометра (показан на врезке).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 6: Исследование чувствительности и идеальный выход устройства с использованием частотных разверток для перекрестного интерферометра (показан на врезке). a) Исследование чувствительности профиля нагрева к линейному температурному коэффициенту диэлектрической проницаемости α. В каждой симуляции использовалась мода TE10 в течение 50 мс для моделирования стабильности электрического поля и созданного теплового профиля. b) Рендер идеальной элементарной ячейки на основе кубических стоек, полученной с помощью этого устройства. c) Рендер реалистичного выхода устройства, сформированного путем спекания по независимым частотным разверткам для каждого порта. Выделенные секции (красная, зеленая, желтая) обозначают области спекания от независимых тепловых узлов, сформированных на разных входных частотах.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Моделирование показывает, что стохастичность поля при нагреве может снижать пиковую температуру, поэтому для точного управления процессом требуется предварительное численное решение обратной задачи.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Основное преимущество системы — возможность настройки внутренней структуры за счет управления интерференцией. Например, сканирование частот на портах позволяет создавать кубические решетки (Рис. 6b и 6c). Такие структуры могут применяться в керамических теплообменниках, каталитических носителях и фильтрах, обеспечивая тонкий контроль над механическими и тепловыми свойствами материала.&lt;/p&gt;\n&lt;h4 id=\"vneshnij-granichnyj-nagrevatel\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#vneshnij-granichnyj-nagrevatel\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Внешний граничный нагреватель&lt;/span&gt;&lt;/a&gt;Внешний граничный нагреватель&lt;/h4&gt;\n&lt;p&gt;Предыдущие методы нагрева ограничены диэлектрическими порошками. Для работы с чистыми металлическими порошками предложен внешний граничный нагреватель, где порошок выступает в роли граничного условия волновода и нагревается за счет индуцированных вихревых токов. Этот метод позволяет печатать полые оболочки из металла, что по принципу действия ближе к литью, чем к аддитивному производству. Схема устройства представлена на Рис. 7a: прибор помещается в порошковую ванну так, чтобы все грани диэлектрического блока контактировали с металлом. Входная мощность отражается от металлической пластины, создавая стоячую волну.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd-f7.jpg\" alt=\"Рисунок 7: Схема и симуляция модели внешнего граничного нагревателя.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 7: Схема и симуляция модели внешнего граничного нагревателя.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 7: Схема и симуляция модели внешнего граничного нагревателя. a) Диаграмма системы, показывающая систему отражателей. На врезке показано, как металлический порошок создает граничное условие вокруг диэлектрического блока, эффективно работая как волновод. Длина диэлектрического блока была оптимизирована для максимального усиления поля в диоксиде кремния на частоте 10 ГГц. b) Профиль тетраэдрической сетки, созданный для ВЧ и теплового моделирования из пункта a). Зеленые стрелки показывают импедансные граничные условия для материала волновода (вольфрам), а красные стрелки — для материала порошка (медь). c) Двумерный срез профиля электрического поля при y = 0 и t = 1500 мс. Использовалась входная мощность 1 МВт. d) Результирующее распределение температуры от электромагнитного нагрева вдоль граничной (порошковой) стенки. Нагрев рассчитывался с шагом 1 мс. e) Рендер медной оболочки, полученной с помощью этого устройства при входной моде TE20 и коротком времени нагрева.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Вихревые токи — это электрические токи, возникающие в проводнике при изменении магнитного поля, которые вызывают нагрев материала за счет его электрического сопротивления.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В электромагнитной модели металлический порошок задан как импедансная граница меди, а волноводы — как импедансная граница вольфрама. Вольфрам нагревается медленнее меди из-за большей объемной теплоемкости. Температура плавления вольфрама T_m = 3695 K (3422^°C) значительно выше, чем у меди (T_m = 1358 K, 1085^°C), что предотвращает плавление самого волновода. Диэлектрический блок выполнен из кварца высокой чистоты с низкими потерями ( anδ = 10⁻⁴) и коэффициентом теплового расширения α = 10⁻⁴ K⁻¹. Моделирование проводилось при входной мощности 1 МВт в моде TE₁₀ в течение 1500 мс с шагом 1 мс.&lt;/p&gt;\n&lt;h4 id=\"rezultaty-modelirovaniya\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#rezultaty-modelirovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты моделирования&lt;/span&gt;&lt;/a&gt;Результаты моделирования&lt;/h4&gt;\n&lt;p&gt;Распределение электрического поля (Рис. 7c) демонстрирует высокую стабильность в течение всего процесса нагрева, так как глубина скин-слоя практически не меняется. Это обеспечивает постоянство граничных условий и стабильный профиль нагрева вдоль внутренних стенок (Рис. 7d), где максимальная температура достигает Tmax = 789 K (516^°C). Высокая теплопроводность металлов требует значительной входной мощности для компенсации теплоотвода.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Стабильный электромагнитный режим обеспечивает равномерный нагрев до 789 K (516^°C), позволяя создавать спеченные металлические оболочки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Моделирование является теоретическим; высокая теплопроводность металлов требует экстремальных уровней входной мощности, что ограничивает практическую реализацию.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;При коротком времени нагрева формируется тонкостенная прямоугольная решетка (Рис. 7e), а при длительном — сплошная трубка. Толщина стенок регулируется мощностью и временем воздействия. Метод перспективен для производства тонкостенных корпусов, воздуховодов и полых волноводов.&lt;/p&gt;\n&lt;h3 id=\"zaklyuchenie\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#zaklyuchenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заключение&lt;/span&gt;&lt;/a&gt;Заключение&lt;/h3&gt;\n&lt;h4 id=\"zaklyuchenie-i-perspektivy\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#zaklyuchenie-i-perspektivy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заключение и перспективы&lt;/span&gt;&lt;/a&gt;Заключение и перспективы&lt;/h4&gt;\n&lt;p&gt;В работе представлены результаты имитационного моделирования трех архитектур микроволновой объемной аддитивной печати (VAM): линейного резонатора Фабри-Перо, перекрестного интерферометра и внешнего граничного нагревателя. Каждая система позволяет работать с материалами, несовместимыми с оптическими методами печати. Линейный резонатор формирует детерминированные тепловые решетки в диэлектрических порошках за счет взаимодействия поперечных и продольных мод. Ограничением системы является температурная фильтрация поля, которая снижает скорость нагрева, но предотвращает искажение решетки из-за изменения геометрии электрических полей. Перекрестный интерферометр обеспечивает сложные интерференционные паттерны, однако обладает меньшей модальной стабильностью. Внешний граничный нагреватель позволяет использовать металлические порошки через омический нагрев на границах волновода, но ограничивает геометрию изделий полыми оболочками.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Разработанные системы позволяют печатать керамические, металлические и композитные материалы, используя микроволновое излучение мощностью от 200 кВт до 1 МВт.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Моделирование охватывает процесс до начала уплотнения материала. При плавлении диэлектрическая проницаемость и тангенс угла диэлектрических потерь меняются, что не учитывается текущей линеаризованной моделью из-за дефицита высокотемпературных данных. Измерение этих параметров в процессе уплотнения является критически важным для будущих экспериментов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Моделирование ограничено начальной стадией процесса; данные о свойствах материалов при высоких температурах являются оценочными, что вносит неопределенность в количественные прогнозы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Экспериментальная реализация требует значительных мощностей (200 кВт – 1 МВт), сопоставимых с параметрами клистрона Canon E3718 (длина 3,5 м, масса 1250 кг). Снижение требований к мощности возможно при использовании композитных порошков с более высокими тангенсами потерь. Несмотря на аппроксимации в моделях, анализ чувствительности для перекрестного интерферометра показал, что форма тепловой решетки устойчива к вариациям коэффициента проницаемости α в диапазоне 10⁻³–10⁻².&lt;/p&gt;\n&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;h4 id=\"chislennoe-modelirovanie-metodom-konechnyh-elementov\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#chislennoe-modelirovanie-metodom-konechnyh-elementov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Численное моделирование методом конечных элементов&lt;/span&gt;&lt;/a&gt;Численное моделирование методом конечных элементов&lt;/h4&gt;\n&lt;p&gt;Моделирование выполняется в среде COMSOL Multiphysics с использованием модулей радиочастот (RF) и теплопередачи. Из-за разницы временных масштабов электромагнитных процессов и динамики нагрева применяется комбинированный частотно-переходный метод. Сначала оцениваются модальные свойства электромагнитного поля в частотной области, которые затем используются как источники тепла для анализа теплопередачи во временной области. Алгоритм расчёта, требующий итерационного цикла для взаимного влияния электромагнитного и теплового состояний на каждом шаге, представлен на Рис. 2a).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd-f2.jpg\" alt=\"Рисунок 2: a) Блок-схема процесса частотно-переходного моделирования.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2: a) Блок-схема процесса частотно-переходного моделирования.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 2: a) Блок-схема процесса частотно-переходного моделирования. Итерационный цикл от «Расчета материальных свойств, зависящих от температуры» до «Конечного временного шага» автоматизирован для выполнения внутри одного моделирования COMSOL без инициализации пользователем. b) Диаграмма материальных свойств: тангенс угла диэлектрических потерь в зависимости от эффективной диэлектрической проницаемости на частоте 10 ГГц при комнатной температуре. Материалы сгруппированы в керамику/стекла, полимеры и композиты. Данные для керамики (оксид алюминия (59, 60), кварц (61), плавленый кварц (62, 59), боросиликатное стекло (62, 63) и оксид магния (MgO) (64)) и полимеров (политетрафторэтилен (PTFE) (62, 61), полиимид (65), жидкокристаллические полимеры (LCP) (66) и FR4 (67)) взяты из экспериментальных данных. Примечательно, что MgO является выбросом, для которого данные были получены при 80 К (−193 °C). Композиты рассчитаны с использованием приближения эффективной среды Бруггемана для смеси плавленого кварца и технического углерода (CB) с указанным процентом, представляющим объемную долю технического углерода. Металлы/проводники не учитываются, так как соответствующие свойства являются экстремально высокими (/εr/, tanδ ≫ 1), и эти материалы лучше представлять через проводимость, а не диэлектрическую проницаемость.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод эффективной среды позволяет заменить сложную гетерогенную структуру порошка на эквивалентную сплошную среду, если размер частиц значительно меньше длины волны микроизлучения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для повышения эффективности расчётов применяется приближение эффективной среды. Поскольку порошковые материалы неоднородны на уровне зёрен, прямое моделирование потребовало бы чрезмерных вычислительных мощностей. Метод позволяет рассматривать порошки как единый объёмный материал, сохраняя точность. Это применимо как к однородным порошкам, так и к смесям, что позволяет проектировать свойства сырья, как показано на графике тангенса угла диэлектрических потерь от диэлектрической проницаемости (Рис. 2b). Поскольку свойства материалов зависят от температуры, источник тепла пересчитывается динамически.&lt;/p&gt;\n&lt;p&gt;Все симуляции используют свободную тетраэдрическую сетку с максимальным размером ячейки λ/10 и импедансные граничные условия на стенках волновода для учёта омических потерь. Для обеспечения физической корректности шаг по времени выбирается так, чтобы изменение диэлектрической проницаемости &lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon_r\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; не превышало 0,1% за шаг. Проверка сходимости подтверждает независимость температурных профилей от параметров сетки и шага времени.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тепловая диффузия ограничивает время нагрева: для сохранения структуры решётки длина диффузии &lt;span class=\"yfm-latex\" data-content=\"%5Csqrt%7B4%5Ckappa%20t%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; должна быть значительно меньше расстояния между узлами.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для плавленого кварца при коэффициенте температуропроводности κ ≈ 7 × 10⁻⁷  м²с⁻¹ длина диффузии за 250 мс составляет 0,84 мм, что на порядок меньше расстояния между антинодами. Это ограничивает допустимое время нагрева и мощность: при увеличении времени в 10 раз и снижении мощности в 10 раз вместо локализованной структуры решётки получится равномерно нагретый блок.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-03/finite-element-simulation-of-microwave-technologies-for-powd.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;низкая&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;скорость&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;послойной&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;печати&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;моделирование&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" fon
