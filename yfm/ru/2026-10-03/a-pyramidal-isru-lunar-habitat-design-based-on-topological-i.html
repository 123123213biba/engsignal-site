            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"101\" cy=\"91\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"519\" cy=\"227\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · FEM_METHODS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Лунная база из реголита: как&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;пирамидальная архитектура&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;заменяет клей и болты&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/a-pyramidal-isru-lunar-habitat-design-based-on-topological-i-f1.jpg\" alt=\"Рис. 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Доставка стройматериалов на Луну экономически невыгодна, поэтому исследователи делают ставку на локальные ресурсы. Новая концепция предлагает возводить пирамидальные купола из идентичных блоков, которые удерживаются вместе исключительно за счет своей геометрии. &lt;a href=\"concepts/finite-element-method.html\"&gt;Метод конечных элементов&lt;/a&gt; подтвердил, что такая конструкция сохраняет устойчивость даже при потере отдельных элементов.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-03/a-pyramidal-isru-lunar-habitat-design-based-on-topological-i.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/topologicheskoe-zatseplenie.html\"&gt;Топологическое зацепление&lt;/a&gt; исключает необходимость в адгезивах и крепеже.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/drucker-prager-model.html\"&gt;Модель Друкера-Прагера&lt;/a&gt; подтвердила устойчивость при потере отдельных блоков.&lt;/li&gt;\n&lt;li&gt;Пирамидальная форма позволяет масштабировать базу без изменения геометрии блоков.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-03/a-pyramidal-isru-lunar-habitat-design-based-on-topological-i.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Для моделирования напряженно-деформированного состояния (НДС) авторы использовали модель Друкера-Прагера (Drucker-Prager), которая описывает поведение материалов с внутренним трением, таких как спеченный лунный реголит. В отличие от классической теории пластичности Мизеса, эта модель учитывает зависимость предела текучести от гидростатического давления, что критично для пористой керамики.&lt;/p&gt;\n&lt;p&gt;Геометрия пирамиды с квадратным основанием (длина стороны 7,5 м) выбрана для минимизации неиспользуемого пространства и обеспечения масштабируемости. В расчетах МКЭ (метод конечных элементов) блоки рассматривались как жесткие тела с топологическим зацеплением, где перемещение любого элемента по нормали к слою кинематически ограничено соседними блоками. Результаты симуляций показали, что структура обладает высокой избыточностью: отсутствие одного или нескольких блоков не приводит к обрушению всей оболочки, что критически важно для безопасности в условиях микрометеоритных ударов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование является теоретическим фреймингом и не учитывает влияние циклической температурной нагрузки на хрупкость спеченного реголита.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-03/a-pyramidal-isru-lunar-habitat-design-based-on-topological-i.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;В данной работе представлена концепция лунного жилого модуля, основанная на принципе топологического зацепления строительных блоков. Предложенная конструкция объединяет геометрию элементов, позволяющую им соединяться без использования связующих веществ или механических крепежей, формируя устойчивую пирамидальную структуру. Данный подход оптимален для строительства в условиях внеземных миссий с использованием местных ресурсов (ISRU). Численное моделирование методом конечных элементов с применением модели пластичности Друкера-Прагера подтвердило, что такие сооружения из лунного реголита обладают высокой живучестью: они сохраняют структурную целостность даже при локальных повреждениях или выпадении отдельных блоков.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Концепция топологического зацепления позволяет создавать устойчивые лунные базы из реголита без дополнительных крепежей, обеспечивая отказоустойчивость конструкции.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Освоение Луны перешло из области научной фантастики в стадию реализации масштабных программ, таких как Artemis (NASA), Moon Village (ESA) и Международная лунная исследовательская станция. Ключевым препятствием для колонизации остается высокая стоимость доставки материалов с Земли, что делает использование лунного реголита единственным рациональным решением. &lt;a href=\"concepts/sintered-regolith.html\"&gt;Спеченный реголит&lt;/a&gt; по своим физико-механическим характеристикам близок к пористой керамике, а энергия для его обработки может быть получена за счет солнечного излучения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод ISRU (&lt;a href=\"concepts/in-situ-resource-utilization.html\"&gt;In Situ Resource Utilization&lt;/a&gt;) — это стратегия использования местных ресурсов небесного тела для обеспечения жизнедеятельности и строительства, что критически важно для снижения логистических затрат.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Модульный подход к строительству признан наиболее перспективным, так как он позволяет автоматизировать сборку с помощью робототехники, упрощает масштабирование баз и переработку материалов. Кроме того, модульность нивелирует хрупкость спеченного реголита, позволяя перераспределять нагрузки в системе. Авторы подчеркивают, что для эффективности системы необходимо минимизировать номенклатуру типов блоков и оптимизировать их размеры для удобства монтажа.&lt;/p&gt;\n&lt;p&gt;Традиционные методы модульного строительства на Земле опираются на использование клеевых составов, строительных растворов или механических соединителей. В условиях Луны эти подходы неэффективны: крайне низкое атмосферное давление препятствует нормальному отверждению связующих, а дефицит воды делает производство растворов практически невозможным. Кроме того, клеевые соединения создают неопределенность в надежности конструкции, так как их невозможно проверить неразрушающими методами, а механические крепежи вызывают локальные концентрации напряжений, снижая общую прочность.&lt;/p&gt;\n&lt;p&gt;В качестве альтернативы предлагается концепция топологического зацепления (topological interlocking), где элементы удерживаются вместе исключительно за счет своей геометрии и взаимного расположения. Хотя большинство существующих решений в этой области ограничены плоскими структурами, для создания обитаемых объемов на Луне требуются трехмерные формы. Использование купольных или полусферических оболочек, работающих преимущественно на сжатие, сталкивается с геометрической проблемой: согласно теореме Гаусса (Theorema egregium), при переносе плоской сетки на криволинейную поверхность неизбежно возникают искажения, требующие создания множества уникальных по форме блоков.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Предложена пирамидальная геометрия лунного модуля, состоящая из идентичных блоков с топологическим зацеплением, что исключает необходимость в связующих материалах и решает проблему геометрических искажений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для оптимизации конструкции авторы предлагают пирамидальную форму, грани которой представляют собой равносторонние треугольники, выложенные монослоем идентичных блоков. Такая геометрия позволяет эффективно распределять нагрузки от внутреннего давления и гравитации, минимизируя изгибающие моменты. В данной системе любое смещение блока в направлении, нормальном к поверхности слоя, кинематически ограничено соседними элементами. Механическая состоятельность предложенной структуры подтверждается методом конечных элементов (FE), учитывающим возможность повреждения отдельных блоков, что также демонстрирует высокую живучесть системы при локальных отказах.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Топологическое зацепление — это способ сборки конструкций, при котором устойчивость системы обеспечивается геометрической формой деталей, блокирующих перемещение друг друга без использования клея или болтов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Основная задача — создание герметичного объема под давлением для обеспечения жизнедеятельности астронавтов. Использование внутреннего давления позволяет применять стандартное оборудование без дополнительной защиты, что снижает массу доставляемых на Луну материалов. Конструкция жилого модуля определяется балансом двух нагрузок: внутреннего давления (действует перпендикулярно стенкам) и гравитации (действует вертикально вниз). В идеале эти силы должны компенсировать друг друга, однако в традиционных конструкциях с вертикальными стенами внутреннее давление не создает вертикальной составляющей, требующей компенсации гравитацией.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование оболочечных конструкций позволяет воспринимать нагрузки преимущественно через &lt;a href=\"concepts/membrannye-usiliya.html\"&gt;мембранные усилия&lt;/a&gt;, исключая изгибающие моменты, что критично для герметичных лунных модулей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мембранные усилия — это внутренние силы, действующие в плоскости оболочки, которые позволяют конструкции работать на растяжение или сжатие без изгиба, что значительно эффективнее для тонкостенных сооружений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для минимизации изгиба оптимальны полусферические формы. Применение мозаичного покрытия (тайлинга) на основе Платоновых тел ограничено жесткой фиксацией количества элементов, что делает невозможным масштабирование или расширение модуля. Геодезические купола, основанные на многогранниках Голдберга, также имеют ограничения: либо они требуют использования разных типов треугольников, либо при фиксации длины ребер их форма стремится к икосаэдрической, что также затрудняет гибкое проектирование.&lt;/p&gt;\n&lt;p&gt;Для обеспечения возможности расширения модуля авторы выбрали геометрию на основе икосаэдра. В качестве базовой формы была выбрана пирамида с квадратным основанием (длина ребра около 7,5 м), так как она представляет собой компромисс между избыточной высотой треугольной пирамиды и неэффективным использованием пространства в пятиугольной пирамиде. Использование равносторонних треугольников в качестве граней упрощает производство компонентов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Выбранная геометрия пирамиды с квадратным основанием требует использования внутренней газонепроницаемой мембраны для обеспечения герметичности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ключевое преимущество предложенного подхода — возможность масштабирования: пирамиды разных размеров собираются из идентичных блоков путем их добавления или удаления. Кроме того, топологическое сцепление блоков обеспечивает избыточность структуры: при потере одного блока (например, вследствие удара микрометеорита) общая целостность конструкции сохраняется.&lt;/p&gt;\n&lt;p&gt;Геометрия блока (плитки) разработана для сборки граней пирамиды с учетом удобства транспортировки: максимальный габарит любого элемента ограничен 1 м. Конструкция основана на принципе топологического зацепления, что позволяет масштабировать элементы под конкретные производственные мощности или возможности роботов-сборщиков. В качестве базовой единицы используется равносторонний треугольник F, который является фундаментальной областью кристаллографической группы p6. Эта группа позволяет путем поворотов на 120° вокруг вершин заполнять плоскость без зазоров.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/fundamentalnaya-oblast.html\"&gt;Фундаментальная область&lt;/a&gt; — это минимальный геометрический элемент, многократное повторение которого (путем поворотов или сдвигов) позволяет полностью покрыть плоскость без пустот.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для создания сложной геометрии зацепления стороны треугольника делятся на четыре равных сегмента. Две внешние точки деления смещаются на 120 мм перпендикулярно ребру: одна внутрь, другая наружу. Чтобы сохранить симметрию p6 и избежать наложений, модификация применяется ко всем трем сторонам треугольника (Рис. 1). Блок формируется путем интерполяции между тремя параллельными плоскостями, разнесенными на 200 мм каждая. Использование трех слоев с чередованием направлений смещения вершин создает «двойной блок-морская звезда» (double-Starfish block) общей толщиной 400 мм (Рис. 2). Конструкция обеспечивает плотное прилегание без пустот, а положительная жесткость подтверждена предыдущими исследованиями для конфигураций с деформацией 120 мм.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/a-pyramidal-isru-lunar-habitat-design-based-on-topological-i-f1.jpg\" alt=\"Рис. 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/a-pyramidal-isru-lunar-habitat-design-based-on-topological-i-f2.jpg\" alt=\"Рис. 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 2&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование трехслойной структуры с модификацией сторон по группе p6 позволяет создать самозацепляющийся блок толщиной 400 мм, обладающий положительной жесткостью.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Четыре равносторонних треугольных грани, собранные из блоков, образуют пирамиду, представляющую собой верхнюю половину октаэдра. В рассматриваемом примере основание грани состоит из 9 блоков, что дает 81 блок на одну грань. Грани соединяются с учетом отступа вдоль нормалей к внешним плоскостям, что исключает контакт между соседними гранями и формирует две вложенные пирамиды: внешнюю и внутреннюю (Рис. 3).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/a-pyramidal-isru-lunar-habitat-design-based-on-topological-i-f3.jpg\" alt=\"Рис. 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Топологическое зацепление требует фиксации периферийных элементов (нижний ряд, ребра, вершина). Хотя нижний ряд может быть закреплен в грунте, ребра и вершина остаются свободными. Для проверки структурной целостности конструкции были проведены конечно-элементные (FE) симуляции с параметрами, соответствующими лунным условиям.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель предполагает, что периферийные блоки, не имеющие жесткой фиксации, сохраняют устойчивость конструкции за счет геометрии зацепления.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для конечно-элементного анализа использовался пакет Abaqus 2024 Explicit с моделью пластичности Друкера-Прагера. Несмотря на статический характер задачи, выбор явного метода (Explicit) обусловлен необходимостью обеспечения сходимости при большом количестве межблочных контактов. Моделирование длилось 2 с, нагрузки прикладывались по плавной кривой (smooth step). Равновесие системы подтверждалось тем, что внутренняя энергия значительно превышала кинетическую. Сборка из 361 блока была спроектирована в Fusion 360 и экспортирована в формате .step. Взаимодействие блоков реализовано через контакт «hard contact» с нулевым коэффициентом трения, что допустимо для топологически сцепленных систем, где геометрия блоков является определяющим фактором структурной целостности.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/yavnyy-metod-explicit-v-abaqus.html\"&gt;Явный метод (Explicit) в Abaqus&lt;/a&gt; — это численный алгоритм, который вычисляет состояние системы пошагово во времени; он эффективен для сложных контактных задач, где обычные статические решатели могут терять сходимость.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;При моделировании учитывались гравитация Луны (1,62  м/с²) и отсутствие атмосферного давления. Внутреннее давление в обитаемом модуле принято равным 81 060  Па (около 0,8 атм), что соответствует условиям на борту коммерческих авиалайнеров. Для защиты от космической радиации и обеспечения дополнительной стабилизации на внешнюю поверхность конструкции накладывается слой реголита, создающий внешнее давление 0,15  Н/мм².&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Основные параметры среды: гравитация 1,62  м/с², внутреннее давление 81 060  Па и внешняя пригрузка от реголита 0,15  Н/мм².&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Материал блоков (спеченный реголит) характеризуется модулем Юнга 15  ГПа, коэффициентом Пуассона 0,17 и плотностью 1,5  г/см³. Для описания хрупкого разрушения использована модель Друкера-Прагера с углом внутреннего трения 58,5^°, углом дилатансии 0^° и пределом текучести при растяжении 5  МПа. Критерии отказа включают потерю общей структурной целостности (смещение блоков наружу) и локальное разрушение отдельных элементов. Локальное повреждение блока считается допустимым, если оставшаяся часть сохраняет способность к сцеплению, что подтверждается анализом через Python-скрипт.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель предполагает хрупкое разрушение материала; локальные сколы блоков не считаются критическими, если общая геометрия сцепления сохраняет несущую способность.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-10-03/a-pyramidal-isru-lunar-habitat-design-based-on-topological-i.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;p&gt;В данной работе была разработана модульная геометрия на основе топологически взаимосвязанной сборки (TIA), состоящей из трех типов блоков. Такая структура позволяет расширять объем и создавать пригодное для использования внутреннее пространство. Мы провели оценку поведения конструкции в условиях лунной среды, рассмотрев как полную сборку, так и конфигурации с удалением одного блока. Исследование показало, что создание лунного обитаемого модуля на основе топологического зацепления технически осуществимо, а конструкция сохраняет целостность даже при потере отдельных элементов. Это подтверждает ключевое преимущество TIA — высокую устойчивость к локальным повреждениям.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Топологически взаимосвязанные структуры обладают высокой живучестью, сохраняя несущую способность даже при потере отдельных модулей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Предложенный метод строительства позволяет оптимизировать массу конструкции за счет использования местных ресурсов (ISRU). В отличие от традиционных подходов, требующих доставки всей массы с Земли, наш метод позволяет использовать лунный реголит в качестве основного материала. Однако работа опирается на ряд допущений, прежде всего касающихся свойств спеченного реголита, которые могут отличаться от земных аналогов. Кроме того, текущая модель не учитывает системы шлюзов и входа-выхода, которые, вероятно, потребуют доставки с Земли.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ISRU (In-Situ Resource Utilization) — концепция использования местных ресурсов (например, лунного грунта) для производства строительных материалов непосредственно на месте.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для обеспечения герметичности конструкции необходимо использование дополнительной мембраны, так как зазоры между блоками TIA не обеспечивают газонепроницаемость, особенно под нагрузкой. Вопросы герметичности таких систем пока недостаточно изучены и требуют дальнейших исследований. Также текущая геометрия является базовой; оптимизация параметров блоков под конкретные требования лунной среды может значительно улучшить характеристики. В целом, численное моделирование подтвердило, что TIA-структуры эффективно распределяют нагрузки от внутреннего давления и позволяют использовать хрупкие материалы, такие как спеченный реголит, с возможностью последующего расширения обитаемого объема.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/a-pyramidal-isru-lunar-habitat-design-based-on-topological-i-f4.jpg\" alt=\"Рис. 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 4&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/a-pyramidal-isru-lunar-habitat-design-based-on-topological-i-f5.jpg\" alt=\"Рис. 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 5&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/a-pyramidal-isru-lunar-habitat-design-based-on-topological-i-f6.jpg\" alt=\"Рис. 6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 6&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/a-pyramidal-isru-lunar-habitat-design-based-on-topological-i-f7.jpg\" alt=\"Рис. 7\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 7&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/a-pyramidal-isru-lunar-habitat-design-based-on-topological-i-f8.jpg\" alt=\"Рис. 8\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 8&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/a-pyramidal-isru-lunar-habitat-design-based-on-topological-i-f9.jpg\" alt=\"Рис. 9\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 9&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-03/a-pyramidal-isru-lunar-habitat-design-based-on-topological-i.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Высокая&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;стоимость&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;доставки&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;материалов&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Топологическое&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;зацепление&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-s
