        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференции&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;3D-печать бетоном и цифровое строительство&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;О чём&lt;/td&gt;\n&lt;td&gt;3D-печать бетоном и цифровое строительство&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Что берём&lt;/td&gt;\n&lt;td&gt;труды&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-build.html\"&gt;Технологии строительства&lt;/a&gt;, &lt;a href=\"concepts/spec-concrete.html\"&gt;Бетон и вяжущие&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chto-eto-za-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-digital_concrete.html#chto-eto-za-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что это за конференция&lt;/span&gt;&lt;/a&gt;Что это за конференция&lt;/h2&gt;\n&lt;p&gt;Digital Concrete — это международная научная площадка, посвященная аддитивному производству в строительстве. Конференция объединяет исследователей, инженеров и материаловедов для обсуждения технологий 3D-печати бетоном, автоматизации строительных процессов и разработки новых вяжущих составов. Основная цель — переход от традиционной опалубки к цифровому управлению формообразованием.&lt;/p&gt;\n&lt;h2 id=\"organizatory-i-istoriya\"&gt;&lt;a href=\"reference/conferences/conf-digital_concrete.html#organizatory-i-istoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Организаторы и история&lt;/span&gt;&lt;/a&gt;Организаторы и история&lt;/h2&gt;\n&lt;p&gt;Конференция возникла как ответ на потребность в стандартизации и научном обосновании методов 3D-печати бетоном (3DCP). Она служит платформой для обмена данными между академическими институтами и индустриальными партнерами, стремящимися автоматизировать возведение зданий и сложных архитектурных форм.&lt;/p&gt;\n&lt;h2 id=\"temy-i-sekcii\"&gt;&lt;a href=\"reference/conferences/conf-digital_concrete.html#temy-i-sekcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Темы и секции&lt;/span&gt;&lt;/a&gt;Темы и секции&lt;/h2&gt;\n&lt;p&gt;Работа конференции охватывает несколько ключевых направлений:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Реология и составы смесей: изучение свойств бетона, необходимых для экструзии и сохранения формы до момента схватывания.&lt;/li&gt;\n&lt;li&gt;Механические характеристики и долговечность: анализ прочности напечатанных конструкций и их микроструктуры.&lt;/li&gt;\n&lt;li&gt;Цифровое проектирование и моделирование: использование нейросетевых потенциалов (например, CSH-MLP) для предсказания поведения цементного камня на молекулярном уровне.&lt;/li&gt;\n&lt;li&gt;Роботизированные системы: интеграция принципов мягкой робототехники и адаптивных механизмов в строительную технику.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"chto-tam-poyavlyaetsya\"&gt;&lt;a href=\"reference/conferences/conf-digital_concrete.html#chto-tam-poyavlyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что там появляется&lt;/span&gt;&lt;/a&gt;Что там появляется&lt;/h2&gt;\n&lt;p&gt;На Digital Concrete представляются результаты исследований, которые меняют подход к строительству:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Методы 3D-печати несъемной опалубки, позволяющие создавать сложные формы без отходов.&lt;/li&gt;\n&lt;li&gt;Применение нейросетей для моделирования гидратации цемента, что позволяет предсказывать прочность материала с точностью квантовой физики.&lt;/li&gt;\n&lt;li&gt;Инновации в управлении роботами: от использования одного актуатора для сложных движений (по аналогии с щупальцами осьминога) до применения асинхронных логических сетей в управляющих контроллерах.&lt;/li&gt;\n&lt;li&gt;Исследования устойчивых строительных материалов, снижающих углеродный след индустрии.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"kak-sledit-i-uchastvovat\"&gt;&lt;a href=\"reference/conferences/conf-digital_concrete.html#kak-sledit-i-uchastvovat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как следить и участвовать&lt;/span&gt;&lt;/a&gt;Как следить и участвовать&lt;/h2&gt;\n&lt;p&gt;Участие в конференции предполагает публикацию рецензируемых научных работ. Следить за обновлениями можно через официальные порталы профильных ассоциаций в области аддитивного производства и материаловедения. Материалы конференции публикуются в виде сборников трудов, которые служат фундаментальной базой для инженеров-проектировщиков.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"reference/conferences/conf-digital_concrete.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;В основе Digital Concrete лежит синтез материаловедения и цифрового управления. Ключевое понятие — «реология свежеуложенной смеси», определяющая способность бетона выдавливаться через сопло и держать вес последующих слоев. В отличие от классического бетонирования, здесь критически важна скорость схватывания и адгезия между слоями. Современные исследования связывают макроскопические свойства бетона с микроструктурным моделированием, где нейросети помогают оптимизировать состав смеси, минимизируя дефекты. Эти методы тесно связаны с общей теорией автоматизации, где робототехнические системы (от микророботов до строительных принтеров) используют единые принципы управления для достижения высокой точности и эффективности.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/conferences/conf-digital_concrete.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/Concrete_(%D0%B0%D0%BB%D1%8C%D0%B1%D0%BE%D0%BC_Fear_Factory)\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Concrete (альбом Fear Factory) — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/ma14143800\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;3D Concrete Printing: A Systematic Review of Rheology, Mix Designs, Mechanical, Microstructural, and Durability Characteristics&lt;/a&gt; — обзор, Materials (Basel) 2021&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1089/3dp.2021.0024\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;3D Printed Formwork for Concrete: State-of-the-Art, Opportunities, Challenges, and Applications&lt;/a&gt; — обзор, 3D Print Addit Manuf 2022&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1089/3dp.2020.0331\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Additive Manufacturing of Sustainable Construction Materials and Form-finding Structures: A Review on Recent Progresses&lt;/a&gt; — обзор, 3D Print Addit Manuf 2022&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференции&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"3D-печать бетоном и цифровое строительство"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Digital Concrete","description":"3D-печать бетоном и цифровое строительство","vcsPath":"reference/conferences/conf-digital_concrete.md"},"headings":[{"title":"Что это за конференция","href":"reference/conferences/conf-digital_concrete.html#chto-eto-za-konferenciya","level":2},{"title":"Организаторы и история","href":"reference/conferences/conf-digital_concrete.html#organizatory-i-istoriya","level":2},{"title":"Темы и секции","href":"reference/conferences/conf-digital_concrete.html#temy-i-sekcii","level":2},{"title":"Что там появляется","href":"reference/conferences/conf-digital_concrete.html#chto-tam-poyavlyaetsya","level":2},{"title":"Как следить и участвовать","href":"reference/conferences/conf-digital_concrete.html#kak-sledit-i-uchastvovat","level":2},{"title":"Теория","href":"reference/conferences/conf-digital_concrete.html#teoriya","level":2},{"title":"Источники","href":"reference/conferences/conf-digital_concrete.html#istochniki","level":2}],"title":"Digital Concrete"},"router":{"pathname":"reference/conferences/conf-digital_concrete","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
