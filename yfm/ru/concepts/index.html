            {"data":{"leading":false,"html":"&lt;p&gt;Понятия из статей выпусков — по статье на каждое: что это, как о нём пишут исследователи, с чем связано и где встречается.&lt;/p&gt;\n&lt;p&gt;154 концепции.&lt;/p&gt;\n&lt;h2 id=\"specialnost\"&gt;&lt;a href=\"concepts/index.html#specialnost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Специальность&lt;/span&gt;&lt;/a&gt;Специальность&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-mechanics.html\"&gt;Сопромат и механика&lt;/a&gt; — Прочность, жёсткость, устойчивость: классические задачи и свежие решения — с формулами и эпюрами.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-geometry.html\"&gt;Начертательная геометрия и графика&lt;/a&gt; — Проекции, поверхности, пересечения, развёртки — и то, как это живёт в CAD и вычислительной геометрии.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-concrete.html\"&gt;Бетон и вяжущие&lt;/a&gt; — Состав бетона и цемента: гидратация, добавки, долговечность, «зелёные» вяжущие.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-materials.html\"&gt;Материаловедение&lt;/a&gt; — Сталь, композиты, дерево, полимеры, стекло: структура → свойства → применение.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-structures.html\"&gt;Конструкции и здания&lt;/a&gt; — Как стоят здания и мосты: железобетон, металл, дерево, кладка, фундаменты, сейсмика.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-fem.html\"&gt;Расчёт и моделирование&lt;/a&gt; — Численные методы в инженерии: МКЭ, оптимизация, цифровые двойники.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-build.html\"&gt;Технологии строительства&lt;/a&gt; — Как строят сегодня: 3D-печать, модульность, BIM, роботы на площадке.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"process\"&gt;&lt;a href=\"concepts/index.html#process\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Процесс&lt;/span&gt;&lt;/a&gt;Процесс&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-axial.html\"&gt;Растяжение и сжатие&lt;/a&gt; — Осевые нагрузки, напряжения, закон Гука.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-bending.html\"&gt;Изгиб и балки&lt;/a&gt; — Эпюры моментов, прогибы, балки переменного сечения.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-torsion.html\"&gt;Кручение&lt;/a&gt; — Валы, тонкостенные профили, депланация.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-stability.html\"&gt;Устойчивость и потеря устойчивости&lt;/a&gt; — Продольный изгиб стержней, оболочек, панелей.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-fatigue_fracture.html\"&gt;Усталость и разрушение&lt;/a&gt; — Трещины, циклическая прочность, механика разрушения.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-plates_shells.html\"&gt;Пластины и оболочки&lt;/a&gt; — Тонкостенные конструкции, мембраны, купола.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-dynamics.html\"&gt;Колебания и динамика&lt;/a&gt; — Собственные частоты, демпфирование, удар.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-projections.html\"&gt;Проекции и виды&lt;/a&gt; — Ортогональные, аксонометрические и перспективные проекции.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-surfaces.html\"&gt;Поверхности и пересечения&lt;/a&gt; — Линии пересечения, линейчатые поверхности, коники.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-dg_algorithms.html\"&gt;Алгоритмы начерталки&lt;/a&gt; — Натуральная величина, метрические задачи как алгоритмы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-developables.html\"&gt;Развёртки, оригами, кириками&lt;/a&gt; — Развёртываемые поверхности, складчатые конструкции.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-cad_parametric.html\"&gt;CAD и параметрическое моделирование&lt;/a&gt; — Параметрика, NURBS, генеративный дизайн.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-comp_geometry.html\"&gt;Вычислительная геометрия&lt;/a&gt; — Сетки, триангуляции, разбиения, алгоритмы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-cement_chem.html\"&gt;Химия цемента и гидратация&lt;/a&gt; — Клинкер, C-S-H, тепловыделение, твердение.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-scm.html\"&gt;Минеральные добавки (SCM)&lt;/a&gt; — Зола-унос, шлак, метакаолин, стекло вместо части цемента.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-admixtures.html\"&gt;Химические добавки&lt;/a&gt; — Суперпластификаторы, ускорители, воздухововлекающие.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-uhpc.html\"&gt;Высокопрочный и фибробетон&lt;/a&gt; — UHPC, фибра, трещиностойкость.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-geopolymer.html\"&gt;Геополимеры и щелочные вяжущие&lt;/a&gt; — Бетон без портландцемента.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-durability.html\"&gt;Долговечность&lt;/a&gt; — Хлориды, карбонизация, ЩСР, морозостойкость.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-steels.html\"&gt;Стали и сплавы&lt;/a&gt; — Марки, термообработка, микроструктура.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-composites.html\"&gt;Композиты&lt;/a&gt; — Стекло- и углепластики, FRP-арматура.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-timber.html\"&gt;Дерево и клеёные материалы&lt;/a&gt; — CLT, клеёный брус, деревянные небоскрёбы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-polymers.html\"&gt;Полимеры&lt;/a&gt; — Пластики, эластомеры, герметики.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-ceramics_glass.html\"&gt;Керамика и стекло&lt;/a&gt; — Хрупкие материалы, остекление, огнеупоры.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-corrosion.html\"&gt;Коррозия&lt;/a&gt; — Ржавление арматуры, защита, ингибиторы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-rc_structures.html\"&gt;Железобетонные конструкции&lt;/a&gt; — Плиты, колонны, преднапряжение.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-steel_structures.html\"&gt;Металлические конструкции&lt;/a&gt; — Фермы, рамы, соединения.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-masonry.html\"&gt;Каменная кладка&lt;/a&gt; — Кирпич, камень, исторические здания.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-bridges.html\"&gt;Мосты&lt;/a&gt; — Пролёты, вантовые и арочные системы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-foundations.html\"&gt;Основания и фундаменты&lt;/a&gt; — Грунты, сваи, осадки.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-seismic.html\"&gt;Сейсмостойкость&lt;/a&gt; — Землетрясения, изоляция, демпферы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-fem_methods.html\"&gt;Метод конечных элементов&lt;/a&gt; — Сетки, элементы, сходимость.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-topopt.html\"&gt;Топологическая оптимизация&lt;/a&gt; — Форма, которую «находит» алгоритм.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-dem_particles.html\"&gt;Дискретные и частичные методы&lt;/a&gt; — DEM, SPH, моделирование гранулярных сред.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-digital_twin.html\"&gt;Цифровые двойники и мониторинг&lt;/a&gt; — Датчики на сооружениях, SHM.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-ml_surrogate.html\"&gt;Машинное обучение в расчётах&lt;/a&gt; — Суррогатные модели, PINN.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-printing_3d.html\"&gt;3D-печать в строительстве&lt;/a&gt; — Печать бетоном, межслойная прочность.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-prefab.html\"&gt;Сборное и модульное&lt;/a&gt; — Заводские модули, узлы, монтаж.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-bim.html\"&gt;BIM и цифровое проектирование&lt;/a&gt; — Информационная модель здания.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-robotics.html\"&gt;Роботы на стройке&lt;/a&gt; — Кирпичекладущие роботы, дроны, автоматизация.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-formwork.html\"&gt;Опалубка и твердение&lt;/a&gt; — Опалубка, прогрев, уход за бетоном.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"termin\"&gt;&lt;a href=\"concepts/index.html#termin\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Термин&lt;/span&gt;&lt;/a&gt;Термин&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/ab-initio-metody.html\"&gt;Ab initio методы&lt;/a&gt; — Высокоточные квантово-механические расчеты, которые считаются эталонными, но требуют огромных вычислительных затрат.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/c-center.html\"&gt;C-центр&lt;/a&gt; — Комплекс из междоузельного углерода и кислорода в кремнии, выступающий в качестве источника одиночных фотонов в L-диапазоне.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/csgv.html\"&gt;CSGV&lt;/a&gt; — Формат сжатия данных без потерь, используемый для эффективного хранения и считывания сегментированных объемов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/flop.html\"&gt;FLOP&lt;/a&gt; — Операция с плавающей запятой; WoQ (Weights-only Quantization) — квантование только весов модели.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/g-buffer.html\"&gt;G-Buffer&lt;/a&gt; — Промежуточный буфер, хранящий геометрические свойства сцены (нормали, глубину, материалы) для каждого пикселя, что позволяет выполнять…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gaussian-predstavlenie.html\"&gt;Gaussian-представление&lt;/a&gt; — Метод представления 3D-сцены в виде набора 3D-гауссиан, которые «растекаются» (splatting) на плоскость изображения для рендеринга.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/general-matrix-vector-multiplication.html\"&gt;GEMV&lt;/a&gt; — Базовая операция логического вывода нейросетей, реализуемая в работе через кодирование весов в OFDM-поднесущие и аналоговую свертку.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ihtc.html\"&gt;IHTC&lt;/a&gt; — Параметр, количественно характеризующий интенсивность теплообмена на границе раздела «форма-отливка» при затвердевании металла.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/k2eff.html\"&gt;k²eff&lt;/a&gt; — Параметр, определяющий эффективность преобразования электрической энергии в акустическую и обратно; чем он выше, тем шире полоса…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/level-of-detail.html\"&gt;LOD&lt;/a&gt; — Метод оптимизации, при котором для объектов, находящихся дальше от камеры или требующих меньшей точности, используются упрощенные версии…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/piezoelectric-on-piezoelectric.html\"&gt;P3F&lt;/a&gt; — Многослойная архитектура, где за счет инженерного управления симметрией слоев можно эффективно возбуждать нужные акустические моды без…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/perplexity.html\"&gt;PPL&lt;/a&gt; — Метрика качества языковой модели; чем ниже значение, тем лучше модель предсказывает следующий токен.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ray-marching.html\"&gt;Ray marching&lt;/a&gt; — Метод рендеринга объемных данных, при котором луч проходит через воксельную сетку, накапливая значения плотности или цвета.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/svd.html\"&gt;SVD&lt;/a&gt; — Метод разложения матрицы на составляющие, позволяющий выделить наиболее значимые компоненты данных.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/anizotropnoe-trenie.html\"&gt;Анизотропное трение&lt;/a&gt; — Физическое свойство опор с когтеобразными наконечниками, при котором сопротивление скольжению в одну сторону выше, чем в другую…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/articulation.html\"&gt;Артикуляция&lt;/a&gt; — Описание подвижных соединений объекта, определяющее степени свободы и пределы движения для физической симуляции.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/artikulyatsiya-articulation-v-trehmernom-modelirovanii.html\"&gt;Артикуляция (articulation) в трехмерном моделировании&lt;/a&gt; — Описание подвижных соединений объекта (например, дверцы шкафа или выдвижного ящика), определяющее степени свободы, оси вращения и пределы…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ald.html\"&gt;Атомно-слоевое осаждение&lt;/a&gt; — Метод нанесения тонких пленок, при котором реагенты подаются поочередно, позволяя контролировать толщину слоя с точностью до ангстрема.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/bioinspiratsiya.html\"&gt;Биоинспирация&lt;/a&gt; — Подход в инженерии, при котором конструктивные решения и принципы управления заимствуются из биологических систем для повышения…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/biomimeticheskiy-robot.html\"&gt;Биомиметический робот&lt;/a&gt; — Устройство, конструкция и принципы движения которого имитируют биологические прототипы (насекомых, птиц), что позволяет достичь высокой…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cache-deadlock.html\"&gt;Блокировка кэша&lt;/a&gt; — Ситуация, когда все ресурсы памяти заняты данными, которые постоянно требуются для отрисовки, из-за чего новые данные не могут быть…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/lift-off.html\"&gt;Взрывная литография&lt;/a&gt; — Метод формирования рисунка, при котором металл напыляется поверх слоя резиста, а затем лишний металл удаляется вместе с растворением самого…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/voxel.html\"&gt;Воксель&lt;/a&gt; — Элемент объемного изображения, которому в сегментированных данных присваивается метка объекта.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/quantization.html\"&gt;Квантование&lt;/a&gt; — Метод сжатия модели путем снижения точности представления весов (например, с 16 бит до 4 бит), что уменьшает объем занимаемой памяти.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kinematika-kirigami.html\"&gt;Кинематика киригами&lt;/a&gt; — Метод создания сложных 3D-структур из плоских листов путем точных прорезей и сгибов, что позволяет менять геометрию без лишних деталей.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/visibility.html\"&gt;Контрастность&lt;/a&gt; — Параметр, показывающий, насколько четко пики корреляционного сигнала выделяются на фоне шума.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/koeffitsient-elektromehanicheskoy-svyazi.html\"&gt;Коэффициент электромеханической связи&lt;/a&gt; — Параметр эффективности преобразования электрической энергии в механическую в пьезоэлектрических резонаторах, достигающий около 35% на…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ladder-type-filter.html\"&gt;Лестничный фильтр&lt;/a&gt; — Конструкция радиочастотного фильтра на основе акустических резонаторов, прототипы которого на базе LiNbO3 продемонстрировали относительную…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/lite-v-zamorozhennye-formy.html\"&gt;Литье в замороженные формы&lt;/a&gt; — Технология литья, при которой песчаная форма замораживается при низких температурах для достижения необходимой прочности за счет замерзания…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/marshrutizatsiya.html\"&gt;Маршрутизация&lt;/a&gt; — Динамическое распределение нагрузки: крупные объекты рендерятся аппаратно (фрагменты).&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/membrannye-usiliya.html\"&gt;Мембранные усилия&lt;/a&gt; — Внутренние силы, действующие в плоскости оболочки, которые позволяют конструкции работать на растяжение или сжатие без изгиба, что…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/in-situ-resource-utilization.html\"&gt;Метод ISRU&lt;/a&gt; — Концепция использования местных внеземных ресурсов для обеспечения жизнедеятельности и строительства, позволяющая минимизировать доставку…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/metod-lamberta.html\"&gt;Метод Ламберта&lt;/a&gt; — Модель освещения, при которой яркость поверхности не зависит от угла обзора, так как свет рассеивается равномерно во всех направлениях.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/meshi.html\"&gt;Меши&lt;/a&gt; — Аппроксимация поверхности объекта в виде сетки из треугольников, которая требует упрощения для снижения веса файла, в отличие от…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/obratnye-ssylki.html\"&gt;Обратные ссылки&lt;/a&gt; — Механизм в сжатии данных, позволяющий заменить повторяющиеся значения ссылкой на их предыдущее вхождение, что экономит место, но усложняет…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ogranichenie-zaprosov.html\"&gt;Ограничение запросов&lt;/a&gt; — Метод приоритизации данных, при котором система «отсекает» менее важные запросы к памяти, чтобы гарантировать, что критически важные для…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/odnotochechnye-raschety-dft.html\"&gt;Одноточечные расчеты DFT&lt;/a&gt; — Вычисление энергии и сил для фиксированной конфигурации атомов без изменения их координат, что необходимо для «обучения» потенциала…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/paletizatsiya-kesha.html\"&gt;Палетизация кэша&lt;/a&gt; — Метод сжатия данных в памяти, при котором вместо хранения полных значений меток хранятся индексы в небольшой таблице (палитре), что…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/floating-floor.html\"&gt;плавающий пол&lt;/a&gt; — Конструктивное решение укладки материала пола, исключающее передачу температурных деформаций на несущие элементы здания.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pryamaya-reproektsiya.html\"&gt;Прямая репроекция&lt;/a&gt; — Перенос данных из предыдущих кадров в текущий вид на основе их известных координат, что помогает компенсировать нехватку информации в…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/raznost-chastot.html\"&gt;Разность частот&lt;/a&gt; — Показатель, характеризующий отклонение колебательной системы от резонанса, что критически важно для понимания стабильности объекта в…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/reproetsirovannoe-vremennoe-nakoplenie.html\"&gt;Репроецированное временное накопление&lt;/a&gt; — Метод улучшения качества картинки путем объединения данных из текущего и предыдущих кадров с учетом движения камеры, что позволяет сгладить…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sqc.html\"&gt;Сверхпроводящая квантовая схема&lt;/a&gt; — Устройство, используемое в работе как нелинейный элемент для параметрического преобразования частот и генерации запутанных пар фотон-фонон.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/segmentatsiya.html\"&gt;Сегментация&lt;/a&gt; — Процесс разделения цифрового изображения на области, где каждый элемент (воксель) классифицируется как принадлежащий определенному объекту.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/monte-carlo.html\"&gt;Стохастическая выборка&lt;/a&gt; — Метод оценки сложного интеграла через случайные выборки, что избавляет от необходимости сортировки объектов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/stohasticheskaya-prozrachnost.html\"&gt;Стохастическая прозрачность&lt;/a&gt; — Метод рендеринга, где вместо усреднения прозрачности многих слоев мы выбираем случайные точки, что избавляет от необходимости сортировать…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/topologicheskoe-zatseplenie.html\"&gt;Топологическое зацепление&lt;/a&gt; — Принцип соединения строительных элементов, при котором они удерживаются вместе исключительно за счет своей геометрии и взаимного…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ray-tracing.html\"&gt;Трассировка лучей&lt;/a&gt; — Метод моделирования распространения радиоволн, который учитывает отражения и препятствия, обеспечивая высокую точность симуляции реальных…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/faktor-parsella.html\"&gt;Фактор Парселла&lt;/a&gt; — Показатель того, во сколько раз резонатор увеличивает скорость излучения квантового объекта по сравнению со свободным пространством.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ghost-imaging.html\"&gt;Фантомная визуализация&lt;/a&gt; — Метод получения изображения, при котором пространственная структура объекта восстанавливается через корреляционные измерения между…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fotonnyy-kristall.html\"&gt;Фотонный кристалл&lt;/a&gt; — Наноструктура с периодическим изменением показателя преломления, которая позволяет управлять движением света, «запирая» его в резонаторе.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fundamentalnaya-oblast.html\"&gt;Фундаментальная область&lt;/a&gt; — Минимальный геометрический элемент, многократное повторение которого (путем поворотов или сдвигов) позволяет полностью покрыть плоскость…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/funktsiya-peredachi.html\"&gt;Функция передачи&lt;/a&gt; — Математическое правило, которое определяет, как числовые данные (метки) преобразуются в визуальные характеристики (цвет, прозрачность)…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/funktsionalnaya-rekursiya.html\"&gt;Функциональная рекурсия&lt;/a&gt; — Стратегия многократного переназначения одной и той же реконфигурируемой механической структуры для выполнения различных механических задач.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/chetyrehzvennyy-mehanizm.html\"&gt;Четырехзвенный механизм&lt;/a&gt; — Кинематическая цепь из четырех стержней, преобразующая один тип движения (например, линейное) в другой (вращательное).&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/elektrosmachivanie.html\"&gt;Электросмачивание&lt;/a&gt; — Явление, возникающее при подаче напряжения на опоры робота и разрушающее поверхностное натяжение воды для погружения.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/yavnyy-metod-explicit-v-abaqus.html\"&gt;Явный метод (Explicit) в Abaqus&lt;/a&gt; — Численный алгоритм, который вычисляет состояние системы пошагово во времени; он эффективен для сложных контактных задач, где обычные…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"metod\"&gt;&lt;a href=\"concepts/index.html#metod\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Метод&lt;/span&gt;&lt;/a&gt;Метод&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/3d-gaussian-splatting.html\"&gt;3D Gaussian Splatting&lt;/a&gt; — Технология синтеза новых ракурсов в реальном времени через растеризацию гауссовых примитивов, использующая сортировку по глубине и…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/air-llm.html\"&gt;AIR-LLM&lt;/a&gt; — Архитектура инференса больших языковых моделей, переносящая вычисления из памяти в радиочастотный домен и выполняющая аналоговое умножение…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rgb-d-scanning.html\"&gt;RGB-D сканирование&lt;/a&gt; — Метод получения данных о геометрии помещения и объектах, включающий цветное изображение и информацию о глубине.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/smooth-overlap-of-atomic-positions.html\"&gt;SOAP&lt;/a&gt; — Метод дескрипторов, используемый для анализа структурного разнообразия и конфигурационного пространства набора данных C-S-H.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/asynchronous-logic-networks.html\"&gt;Асинхронные логические сети&lt;/a&gt; — Архитектура из логических элементов, работающая без внешнего тактового сигнала, где динамика определяется физическими задержками…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gaussian-stippling.html\"&gt;гауссов пунктир&lt;/a&gt; — Метод 3D-рендеринга, заменяющий упорядоченное альфа-смешивание стохастической выборкой видимости для устранения необходимости сортировки…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hexagonal-lattice.html\"&gt;Гексагональная решетка&lt;/a&gt; — Структура расположения логических элементов, исключающая стационарные состояния и гарантирующая непрерывную генерацию хаотических переходов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/finite-element-method.html\"&gt;Метод конечных элементов&lt;/a&gt; — Численный метод решения задач механики деформируемого твердого тела, используемый для анализа напряженно-деформированного состояния и…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/drucker-prager-model.html\"&gt;Модель Друкера-Прагера&lt;/a&gt; — Математическая модель пластичности, описывающая поведение материалов с внутренним трением, учитывающая зависимость предела текучести от…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spatiotemporal-neural-reconstruction.html\"&gt;нейросетевая пространственно-временная реконструкция&lt;/a&gt; — Метод фильтрации и восстановления изображения на базе архитектуры U-Net и MLP, объединяющий текущие признаки и исторические данные прошлых…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pushover-analysis.html\"&gt;нелинейный статический анализ&lt;/a&gt; — Метод расчетной оценки конструкции, по результатам которого фиксируется уровень ее эксплуатационной пригодности.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/primitive-based-sampling-stream.html\"&gt;примитивный поток&lt;/a&gt; — Поток стохастической выборки для гауссианов малой площади, осуществляющий генерацию точек через пуассоновский процесс и преобразование…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mimo-spatial-multiplexing.html\"&gt;пространственное мультиплексирование MIMO&lt;/a&gt; — Технология многоантенной передачи нескольких потоков весов одновременно для сокращения времени эфира.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/density-functional-theory.html\"&gt;Теория функционала плотности&lt;/a&gt; — Квантово-механический метод расчета электронной структуры, используемый в работе для разметки данных и оптимизации атомных конфигураций.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/t6-heat-treatment.html\"&gt;термообработка T6&lt;/a&gt; — Режим термической обработки отливок, используемый для повышения предела прочности при растяжении сплава.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/path-tracing.html\"&gt;Трассировка путей&lt;/a&gt; — Метод глобального освещения, обеспечивающий высокую точность визуализации и пространственное восприятие структур.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fragment-based-sampling-stream.html\"&gt;фрагментный поток&lt;/a&gt; — Поток стохастической выборки, в котором гауссианы с большой площадью проекции обрабатываются путем растеризации с учетом порога отсечения.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"veshestvo\"&gt;&lt;a href=\"concepts/index.html#veshestvo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вещество&lt;/span&gt;&lt;/a&gt;Вещество&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/calcium-silicate-hydrate.html\"&gt;Гидросиликат кальция&lt;/a&gt; — Основной продукт гидратации цемента, представляющий собой нанокристаллический гель, определяющий прочность и долговечность цементного камня.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/zl205a-alloy.html\"&gt;сплав ZL205A&lt;/a&gt; — Литейный алюминиево-медный сплав с широким интервалом кристаллизации, склонный к газовой пористости и усадочным дефектам.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"material\"&gt;&lt;a href=\"concepts/index.html#material\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Материал&lt;/span&gt;&lt;/a&gt;Материал&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/silicon-on-insulator.html\"&gt;Кремний на изоляторе&lt;/a&gt; — Структура, состоящая из слоя кремния на диэлектрической подложке, используемая как платформа для создания нанофотонных устройств.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/lithium-niobate.html\"&gt;Ниобат лития&lt;/a&gt; — Ниобат лития (LiNbO₃) — это пьезоэлектрический материал с высоким коэффициентом электромеханической связи. Он используется в качестве…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/high-density-recycled-polyurethane.html\"&gt;переработанный полиуретан высокой плотности&lt;/a&gt; — Материал, используемый для замены цементной стяжки с целью облегчения массы здания, повышения сейсмостойкости и теплоизоляции пола.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sintered-regolith.html\"&gt;Спеченный реголит&lt;/a&gt; — Локальный лунный материал, используемый в качестве основного строительного ресурса, по физико-механическим свойствам близкий к пористой…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/shape-memory-alloy.html\"&gt;сплав с памятью формы&lt;/a&gt; — Материал проволочных искусственных мышц, преобразующий тепловое сокращение в изгибную деформацию несущей рамы микроробота.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cement-screed.html\"&gt;цементная стяжка&lt;/a&gt; — Традиционный материал пола высокой плотности, создающий балласт и паразитную массу, увеличивающую инерционные силы при землетрясении.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"instrument\"&gt;&lt;a href=\"concepts/index.html#instrument\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Инструмент&lt;/span&gt;&lt;/a&gt;Инструмент&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/csh-mlp.html\"&gt;CSH-MLP&lt;/a&gt; — Метод машинного обучения, используемый для моделирования атомных структур гидросиликата кальция с точностью квантово-механических расчетов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/h-shaped-frame.html\"&gt;H-образная рама&lt;/a&gt; — Единый реконфигурируемый каркас робота, приводимый в действие мышцами из сплава с памятью формы для управления полетом, наземного ползания…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mujoco.html\"&gt;MuJoCo&lt;/a&gt; — Среда физического моделирования, используемая для проверки готовности и симуляции сцен, созданных системой.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/room-py.html\"&gt;Room.py&lt;/a&gt; — Исполняемый файл, описывающий геометрию, артикуляцию объектов и физические свойства пространства для симуляторов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/volcanite.html\"&gt;Volcanite&lt;/a&gt; — Фреймворк с открытым исходным кодом для прямого рендеринга плотных сегментированных данных на обычном оборудовании.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vulkan.html\"&gt;Vulkan&lt;/a&gt; — Графический бэкенд, используемый для аппаратного ускорения рендеринга и декомпрессии данных на GPU.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/layout-agent.html\"&gt;Агент планировки&lt;/a&gt; — Компонент системы, исправляющий геометрические ошибки детектирования объектов и устанавливающий связи между элементами сцены.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/interdigital-transducer.html\"&gt;Встречно-штыревой преобразователь&lt;/a&gt; — Компонент, напыляемый на пьезоэлектрические подложки для генерации и регистрации поверхностных акустических волн.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hybrid-renderer.html\"&gt;гибридный рендерер&lt;/a&gt; — Система рендеринга, адаптивно распределяющая гауссианы между фрагментным и примитивным потоками выборки на основе их непрозрачности и…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kirigami-supports.html\"&gt;киригами-опоры&lt;/a&gt; — Перестраиваемые многослойные конструкции лапок микроробота с регулируемыми зазорами, управляющие смачиваемостью и удерживающие робота на…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/bulk-acoustic-wave-resonator.html\"&gt;объемный акустический резонатор&lt;/a&gt; — Акустическое устройство, резонансная частота которого задается толщиной пленки; используется для широкополосной фильтрации радиочастотных…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/wire-bonding-junctions.html\"&gt;Проволочные соединительные узлы&lt;/a&gt; — Элементы конструкции, позволяющие локально активировать сегменты актуатора для пространственного программирования сокращений.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rf-mixer.html\"&gt;радиочастотный смеситель&lt;/a&gt; — Аналоговый вычислительный узел, перемножающий входные сигналы во временной области, что эквивалентно линейной свертке в частотной области.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/photonic-crystal-resonator.html\"&gt;Фотонно-кристаллический резонатор&lt;/a&gt; — Нанофотонное устройство, обеспечивающее резонансное усиление излучения за счет локализации света в структуре с периодическим изменением…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"yavlenie\"&gt;&lt;a href=\"concepts/index.html#yavlenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Явление&lt;/span&gt;&lt;/a&gt;Явление&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/second-thickness-shear-mode.html\"&gt;мода сдвига по толщине SH2&lt;/a&gt; — Вторая медленная мода толщинного сдвига, селективно возбуждаемая в двухслойном резонаторе за счет разворота кристаллографических осей слоев…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/distributed-boolean-chaos.html\"&gt;Распределенный булев хаос&lt;/a&gt; — Физическое явление, используемое для генерации случайных чисел путем создания тысяч независимых источников энтропии на одном чипе.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/purcell-effect.html\"&gt;Эффект Парселла&lt;/a&gt; — Физическое явление ускорения спонтанного излучения квантового эмиттера при его помещении в оптический резонатор с малым модовым объемом.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"metrika\"&gt;&lt;a href=\"concepts/index.html#metrika\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Метрика&lt;/span&gt;&lt;/a&gt;Метрика&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/second-order-autocorrelation-function.html\"&gt;Автокорреляционная функция второго порядка&lt;/a&gt; — Метрика, используемая для подтверждения квантовой природы источника света; значение g^(2)(0) &amp;lt; 0,5 доказывает, что излучатель является…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/inter-story-drift.html\"&gt;межэтажные перекосы&lt;/a&gt; — Параметр деформации каркаса здания, уменьшающийся при использовании легкого полиуретана вместо цементной стяжки.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ca-si-ratio.html\"&gt;Отношение Ca/Si&lt;/a&gt; — Параметр стехиометрического состава гидросиликата кальция, определяющий его механические свойства и структурную эволюцию.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/robot-workspace.html\"&gt;Рабочая зона робота&lt;/a&gt; — Показатель объема пространства, доступного для маневрирования мягкого робота, используемый для оценки эффективности конструкции.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/base-shear.html\"&gt;сдвигающая сила в основании&lt;/a&gt; — Сейсмическая силовая характеристика в основании здания, снижающаяся при уменьшении массы пола.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/entropy-generation-rate.html\"&gt;Скорость генерации энтропии&lt;/a&gt; — Показатель производительности системы, отражающий объем генерируемых хаотических данных в единицу времени.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/bonding-angle.html\"&gt;угол склейки&lt;/a&gt; — Угол взаимной ориентации между двумя пьезоэлектрическими слоями, определяющий знаки пьезоэлектрических коэффициентов и подавление…&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Понятия из статей выпусков — по статье на каждое: что это, как о нём пишут исследователи, с чем связано и где встречается."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Концепции","description":"Понятия из статей выпусков — по статье на каждое: что это, как о нём пишут исследователи, с чем связано и где встречается.","vcsPath":"concepts/index.md"},"headings":[{"title":"Специальность","href":"concepts/index.html#specialnost","level":2},{"title":"Процесс","href":"concepts/index.html#process","level":2},{"title":"Термин","href":"concepts/index.html#termin","level":2},{"title":"Метод","href":"concepts/index.html#metod","level":2},{"title":"Вещество","href":"concepts/index.html#veshestvo","level":2},{"title":"Материал","href":"concepts/index.html#material","level":2},{"title":"Инструмент","href":"concepts/index.html#instrument","level":2},{"title":"Явление","href":"concepts/index.html#yavlenie","level":2},{"title":"Метрика","href":"concepts/index.html#metrika","level":2}],"title":"Концепции"},"router":{"pathname":"concepts/index","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
