            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Материал&lt;/strong&gt; · &lt;em&gt;shape memory alloy&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/shape-memory-alloy.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Материал проволочных искусственных мышц, преобразующий тепловое сокращение в изгибную деформацию несущей рамы микроробота.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Определение собрано из статей выпуска автоматически и ждёт проверки редакцией.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"kak-ob-etom-pishut-v-statyah\"&gt;&lt;a href=\"concepts/shape-memory-alloy.html#kak-ob-etom-pishut-v-statyah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как об этом пишут в статьях&lt;/span&gt;&lt;/a&gt;Как об этом пишут в статьях&lt;/h2&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Основой конструкции служит H-образная рама, приводимая в действие искусственными мышцами на основе сплава с памятью формы (SMA) диаметром 48 мкм.&lt;/p&gt;\n&lt;p&gt;— &lt;a href=\"2026-10-02/bio-inspired-functional-recursion-enables-multi-mode-locomot.html\"&gt;Робот весом 140 мг: как насекомые вдохновили инженеров на создание универсального механизма&lt;/a&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h2 id=\"spravka\"&gt;&lt;a href=\"concepts/shape-memory-alloy.html#spravka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Справка&lt;/span&gt;&lt;/a&gt;Справка&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;диаметр проволок&lt;/td&gt;\n&lt;td&gt;48 мкм&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;мартенситный фазовый переход (Mp)&lt;/td&gt;\n&lt;td&gt;67 °C&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;аустенитный фазовый переход (Ap)&lt;/td&gt;\n&lt;td&gt;88 °C&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;рабочий_ток&lt;/td&gt;\n&lt;td&gt;1-2 А&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;дополнительное_сокращение&lt;/td&gt;\n&lt;td&gt;12,3 мм&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"drugie-nazvaniya\"&gt;&lt;a href=\"concepts/shape-memory-alloy.html#drugie-nazvaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Другие названия&lt;/span&gt;&lt;/a&gt;Другие названия&lt;/h2&gt;\n&lt;p&gt;SMA, SMA-мышцы&lt;/p&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/shape-memory-alloy.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/bio-inspired-functional-recursion-enables-multi-mode-locomot.html\"&gt;Робот весом 140 мг: как насекомые вдохновили инженеров на создание универсального механизма&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/octopus-inspired-muscle-activation-unlocks-high-dof-motion-f.html\"&gt;Как щупальце осьминога: новый способ управления мягкими роботами&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt; · &lt;a href=\"reference/materials.html\"&gt;Материалы&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Материал проволочных искусственных мышц, преобразующий тепловое сокращение в изгибную деформацию несущей рамы микроробота."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"сплав с памятью формы","descripti
