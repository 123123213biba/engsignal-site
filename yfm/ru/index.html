ted":false,"title":{"text":"Свежий выпуск &amp;middot; 03.10.2026","url":"2026-10-03/index.html"},"colSizes":{"all":12,"md":6,"lg":4},"children":[{"type":"layout-item","media":{"image":"2026-10-03/a-pyramidal-isru-lunar-habitat-design-based-on-topological-i-card.jpg"},"content":{"title":"Лунная база из&amp;nbsp;реголита: как пирамидальная архитектура заменяет клей и&amp;nbsp;болты","text":"&lt;p&gt;Строительство на Луне без цемента и крепежа: инженеры предложили собирать жилые модули из спеченного реголита по принципу топологического зацепления.&lt;/p&gt;\n","links":[{"url":"2026-10-03/a-pyramidal-isru-lunar-habitat-design-based-on-topological-i.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-03/correlation-imaging-via-hybrid-entanglement-between-microwav-card.jpg"},"content":{"title":"Квантовая оптика на&amp;nbsp;стероидах: как сжать макрообъект до&amp;nbsp;размеров чипа","text":"&lt;p&gt;Ученые научили микроволновые фотоны и фононы запутываться, позволяя «видеть» объекты с десятикратным изменением масштаба.&lt;/p&gt;\n","links":[{"url":"2026-10-03/correlation-imaging-via-hybrid-entanglement-between-microwav.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy-card.jpg"},"content":{"title":"Как замороженный песок и&amp;nbsp;вакуум спасают сложные алюминиевые отливки","text":"&lt;p&gt;Алюминиево-медные сплавы капризны при литье. Исследователи нашли способ победить пористость с помощью криогенных форм и отрицательного давления.&lt;/p&gt;\n","links":[{"url":"2026-10-03/research-on-the-mechanism-of-high-performance-aluminum-alloy.html","text":"Читать","arrow":true,"theme":"normal"}]}}]},{"type":"card-layout-block","animated":false,"title":{"text":"Выпуск &amp;middot; 02.10.2026","url":"2026-10-02/index.html"},"colSizes":{"all":12,"md":6,"lg":4},"children":[{"type":"layout-item","media":{"image":"2026-10-02/bio-inspired-functional-recursion-enables-multi-mode-locomot-card.jpg"},"content":{"title":"Робот весом 140&amp;nbsp;мг: как насекомые вдохновили инженеров на&amp;nbsp;создание универсального механизма","text":"&lt;p&gt;Микроробот, который летает, ползает и ныряет, используя одно и то же тело вместо набора разных приводов.&lt;/p&gt;\n","links":[{"url":"2026-10-02/bio-inspired-functional-recursion-enables-multi-mode-locomot.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render-card.jpg"},"content":{"title":"Gaussian Stippling: как ускорить 3D-рендеринг без потери качества","text":"&lt;p&gt;Новый метод рендеринга Gaussian Splatting избавляет от тяжелой сортировки слоев, ускоряя работу на мобильных устройствах.&lt;/p&gt;\n","links":[{"url":"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e-card.jpg"},"content":{"title":"AIR-LLM: как запускать нейросети без памяти и&amp;nbsp;загрузки весов","text":"&lt;p&gt;Забудьте про гигабайты в RAM: новая архитектура AIR-LLM вычисляет веса нейросетей прямо в радиоэфире.&lt;/p&gt;\n","links":[{"url":"2026-10-02/air-llm-broadcasting-ai-weights-over-radio-for-memory-free-e.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/multi-functional-performance-of-upcycled-high-density-polyur-card.jpg"},"content":{"title":"Облегчение зданий: как переработанный полиуретан спасает от&amp;nbsp;землетрясений","text":"&lt;p&gt;Замена тяжелой стяжки на полиуретан снижает сейсмическую нагрузку на 20% без усиления конструкций.&lt;/p&gt;\n","links":[{"url":"2026-10-02/multi-functional-performance-of-upcycled-high-density-polyur.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre-card.jpg"},"content":{"title":"Двухслойный ниобат лития: как избавиться от&amp;nbsp;паразитных мод в&amp;nbsp;фильтрах 6&amp;nbsp;ГГц","text":"&lt;p&gt;Инженеры научились подавлять шумы в радиочастотных фильтрах, используя симметрию кристаллической решетки ниобата лития.&lt;/p&gt;\n","links":[{"url":"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/octopus-inspired-muscle-activation-unlocks-high-dof-motion-f-card.jpg"},"content":{"title":"Как щупальце осьминога: новый способ управления мягкими роботами","text":"&lt;p&gt;Инженеры научились управлять мягким роботом с помощью одного актуатора, имитируя нервную систему осьминога.&lt;/p&gt;\n","links":[{"url":"2026-10-02/octopus-inspired-muscle-activation-unlocks-high-dof-motion-f.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-card.jpg"},"content":{"title":"Volcanite: как визуализировать терабайты данных без суперкомпьютеров","text":"&lt;p&gt;Забудьте о долгом создании сеток: Volcanite позволяет исследовать огромные 3D-объемы данных прямо на обычном ПК.&lt;/p&gt;\n","links":[{"url":"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-card.jpg"},"content":{"title":"LiteReality-Agent: превращаем сканы помещений в&amp;nbsp;код для симуляций","text":"&lt;p&gt;Как превратить обычный RGB-D скан комнаты в полноценный цифровой двойник с помощью Python-скрипта.&lt;/p&gt;\n","links":[{"url":"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/massively-parallel-reinforcement-learning-with-a-chaotic-rec-card.jpg"},"content":{"title":"Хаос в&amp;nbsp;кремнии: как асинхронные логические сети ускоряют обучение ИИ","text":"&lt;p&gt;Забудьте про тактовые генераторы. Мы научили обычные FPGA-чипы генерировать хаос для сверхбыстрого обучения нейросетей.&lt;/p&gt;\n","links":[{"url":"2026-10-02/massively-parallel-reinforcement-learning-with-a-chaotic-rec.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/wood-carbon-sponge-sio2-aerogel-composites-with-anisotropic-card.jpg"},"content":{"title":"Древесный углеродный аэрогель: как анизотропия структуры управляет поглощением радиоволн","text":"&lt;p&gt;Природная архитектура бальзы превращает углеродную губку в эффективный стелс-материал с направленными свойствами.&lt;/p&gt;\n","links":[{"url":"2026-10-02/wood-carbon-sponge-sio2-aerogel-composites-with-anisotropic.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/l-band-single-photon-generation-from-a-cavity-coupled-silico-card.jpg"},"content":{"title":"Кремниевые C-центры: новый стандарт для квантовых сетей в&amp;nbsp;L-диапазоне","text":"&lt;p&gt;Ученые впервые изолировали одиночный C-центр в кремнии, открыв путь к созданию масштабируемых квантовых коммуникаций на телеком-волнах.&lt;/p&gt;\n","links":[{"url":"2026-10-02/l-band-single-photon-generation-from-a-cavity-coupled-silico.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/machine-learning-potential-for-calcium-silicate-hydrates-wit-card.jpg"},"content":{"title":"Цифровой двойник цемента: как нейросети предсказывают прочность бетона","text":"&lt;p&gt;Ученые создали CSH-MLP — нейросетевой потенциал, который моделирует поведение цемента с точностью квантовой физики.&lt;/p&gt;\n","links":[{"url":"2026-10-02/machine-learning-potenti
