        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"151\" cy=\"93\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"569\" cy=\"223\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · CAD_PARAMETRIC   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Gaussian Stippling: как&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ускорить 3D-рендеринг без&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;потери качества&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render-f1.jpg\" alt=\"Рис. 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Традиционный 3D Gaussian Splatting требует глубокой сортировки примитивов, что замедляет рендеринг на слабых устройствах. Метод Gaussian Stippling заменяет альфа-смешивание стохастической выборкой, исключая необходимость сортировки. Гибридная система и нейросетевая реконструкция позволяют достичь высокой частоты кадров при сохранении визуальной четкости.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Замена альфа-смешивания стохастической выборкой исключает сортировку примитивов.&lt;/li&gt;\n&lt;li&gt;Гибридный рендерер оптимизирует нагрузку, распределяя примитивы по их прозрачности.&lt;/li&gt;\n&lt;li&gt;Нейросетевая реконструкция подавляет шум, используя данные из прошлых кадров.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Стандартный 3DGS использует упорядоченное альфа-композитинг, где вклад каждого примитива рассчитывается через transmittance (пропускание) T_i(x) = Π_{j&amp;lt;i} (1-α_j(x)). Это требует сортировки по глубине (depth sorting), что становится «бутылочным горлышком» при большом количестве примитивов. Gaussian Stippling переходит к дискретной модели, где каждый примитив принимается с вероятностью, равной его альфа-значению, превращая задачу в стохастическую выборку.&lt;/p&gt;\n&lt;p&gt;Гибридный рендерер адаптивно распределяет примитивы между фрагментным и примитивным потоками на основе их проективной площади и прозрачности. Для подавления шума, возникающего при малом количестве выборок (1-spp), используется легковесная нейросеть, которая агрегирует данные текущего и прошлых кадров. При 1-spp конфигурации метод достигает 2,3–2,7-кратного прироста производительности по сравнению с базовым 3DGS при разрешении 1080p, сохраняя стабильность изображения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод требует настройки количества выборок (spp) для баланса между шумом и производительностью, а качество зависит от эффективности обучения нейросети.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Традиционный метод 3D Gaussian Splatting (3DGS) опирается на попиксельную сортировку глубины и упорядоченное альфа-смешивание для корректной визуализации перекрывающихся примитивов. В данной работе предложен подход, исключающий сортировку за счет использования стохастической прозрачности: дробные значения альфа-канала заменяются дискретными выборками видимости. Этот процесс, названный авторами «гауссовым пунктиром» (Gaussian Stippling), позволяет реализовать рендеринг, не зависящий от порядка объектов. Система адаптивно объединяет примитивный и фрагментный методы пунктирования, что оптимизирует пропускную способность рендеринга.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Стохастическая прозрачность — это метод рендеринга, где вместо усреднения прозрачности многих слоев мы выбираем случайные точки, что избавляет от необходимости сортировать объекты по удаленности от камеры.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для подавления пространственного и временного шума, возникающего при малом количестве выборок (spp), разработана облегченная нейросеть для пространственно-временной реконструкции. Она использует локальные атрибуты гауссианов, объединяя текущие данные с перепроецированными историческими наблюдениями. Модель обучалась на наборе различных сцен и способна работать с новыми данными без дообучения или изменения параметров 3DGS-активов.&lt;/p&gt;\n&lt;p&gt;При обучении под конкретную сцену компактная конфигурация с 1 выборкой на пиксель (1-spp) обеспечивает увеличение пропускной способности в 2,3–2,7 раза по сравнению со стандартным 3DGS при разрешении 1080p. Конфигурация с 16 выборками (16-spp) демонстрирует более высокое среднее значение PSNR на всех трех тестовых наборах данных, хотя и требует больших вычислительных затрат. Метод успешно протестирован на мобильном оборудовании в интерактивном режиме.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Предложенный метод повышает скорость рендеринга в 2,3–2,7 раза при 1-spp и улучшает качество изображения при 16-spp, обеспечивая работу на мобильных устройствах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;Технология 3D Gaussian Splatting (3DGS) обеспечивает синтез новых ракурсов в реальном времени через эффективную растеризацию явных гауссовых примитивов. Однако метод требует сортировки по глубине и упорядоченного композитинга, что становится узким местом при большом количестве примитивов или на устройствах с ограниченными ресурсами. Существующие альтернативы либо модифицируют парадигму рендеринга, либо изменяют структуру самих примитивов, что делает их несовместимыми с уже готовыми 3DGS-активами.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Предложенный метод «гауссова пунктирования» (Gaussian stippling) позволяет рендерить стандартные 3DGS-сцены без сортировки, используя стохастическую выборку видимости.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В отличие от стандартного 3DGS, где гауссовы пятна накапливаются непрерывно, стохастическое «пунктирование» генерирует дискретные непрозрачные образцы (stipples), конкурирующие через стандартный тест глубины. Существуют два подхода: фрагментное и примитивное пунктирование. Первый зависит от площади покрытия, второй — от количества образцов, определяемого непрозрачностью и проекцией. Авторы разработали гибридный рендерер, который распределяет гауссианы между этими методами в зависимости от их параметров, оптимизируя вычислительные затраты.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Стохастическая выборка (Monte Carlo) — это метод оценки сложного интеграла (в данном случае — прозрачности) через случайные выборки, что избавляет от необходимости сортировки объектов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование малого числа выборок (low-spp) неизбежно порождает пространственный шум и мерцание, что требует дополнительной фильтрации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для устранения шума, возникающего при малом количестве выборок, авторы используют легковесную нейронную сеть пространственно-временной реконструкции. Она объединяет данные текущего кадра с информацией из предыдущих кадров, используя атрибуты гауссиан (непрозрачность, ковариация, глубина). Как показано на Рис. 1, такой подход позволяет эффективно подавлять шум без переобучения модели под конкретную сцену. Система демонстрирует высокую производительность на мобильных устройствах и поддерживает как универсальные модели, так и специализированные (с дообучением) для достижения максимального качества.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render-f1.jpg\" alt=\"Рис. 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"nejronnaya-rekonstrukciya-na-osnove-stohasticheskih-vyborok\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#nejronnaya-rekonstrukciya-na-osnove-stohasticheskih-vyborok\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нейронная реконструкция на основе стохастических выборок&lt;/span&gt;&lt;/a&gt;Нейронная реконструкция на основе стохастических выборок&lt;/h4&gt;\n&lt;p&gt;Синтез высококачественных изображений из разреженных, неструктурированных геометрических прокси-объектов является ключевой задачей в рендеринге на основе изображений. Методы нейронной графики на основе точек (NPBG) и сопутствующие фреймворки отложенного нейронного рендеринга доказали, что глубокие сверточные сети (например, U-Net) способны эффективно восстанавливать плотные фотореалистичные изображения из разреженных растровых признаков. В данной работе мы расширяем этот подход, учитывая стохастические изменения видимости при многократном рендеринге одного и того же ракурса, адаптируя парадигму отложенного рендеринга для работы с перекрывающимися полупрозрачными гауссовыми примитивами.&lt;/p&gt;\n&lt;p&gt;Реконструкция из стохастических выборок опирается на методы фильтрации шума в трассировке путей, где глубокие нейронные сети используются для обработки зашумленных данных. В отличие от традиционных методов, наш подход сохраняет локальные дескрипторы Гаусса для каждого наблюдения. При использовании нескольких наблюдений на кадр мы усредняем эти дескрипторы по каналам перед реконструкцией. Вспомогательные признаки, такие как глубина и альбедо, служат ориентирами, однако, поскольку одна поверхность не может описать вклад всех перекрывающихся «сплэтов» Гаусса, мы извлекаем дескрипторы, кодирующие проекцию, непрозрачность и глубину примитивов.&lt;/p&gt;\n&lt;p&gt;Пространственно-временное выравнивание критично для повышения качества при рендеринге с частотой 1 сэмпл на пиксель (1-spp). В отличие от стандартных конвейеров, использующих обратную репроекцию векторов движения поверхности, мы применяем прямую репроекцию карт наблюдений, так как стохастический характер 3DGS делает видимость конкретного гауссиана нестабильной. Наша сеть обучается объединять текущие и исторические данные, поступающие в качестве раздельных входных сигналов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод объединяет локальные дескрипторы Гаусса и прямую репроекцию исторических данных, что позволяет восстанавливать качественные изображения из зашумленных стохастических выборок.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"metod\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#metod\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Метод&lt;/span&gt;&lt;/a&gt;Метод&lt;/h4&gt;\n&lt;p&gt;Для фиксированного обученного представления 3D-Гауссианов G и целевой камеры C_t в кадре t задача состоит в реконструкции изображения без модификации сцены. Процесс состоит из двух этапов (Рис. 2). Сначала гибридный рендерер направляет каждый примитив в поток выборки на основе примитивов или фрагментов, создавая разреженное изображение. Затем каждое принятое наблюдение дополняется локальным дескриптором, а исторические кадры проецируются вперед в целевой вид. Легковесная сверточная сеть D_θ агрегирует эти данные.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render-f2.jpg\" alt=\"Рисунок 2: Обзор предложенного нами конвейера гауссовой пунктирной отрисовки и реконструкции.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2: Обзор предложенного нами конвейера гауссовой пунктирной отрисовки и реконструкции.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 2: Обзор предложенного нами конвейера гауссовой пунктирной отрисовки и реконструкции. На этапе 1, при наличии 3DGS-актива, содержащего N гауссовых примитивов, стратегия маршрутизации с учетом стоимости распределяет NF примитивов в поток на основе фрагментов, а оставшиеся примитивы — в поток на основе примитивов, который генерирует NP стохастических точек выборки. Затем общий тест глубины выбирает принятые точки пунктира вместе с их локальными гауссовыми дескрипторами для формирования наблюдения текущего кадра. На этапе 2 сеть реконструкции агрегирует текущее наблюдение и исторические наблюдения, спроецированные вперед, для создания реконструированного изображения.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Для каждого кадра мы генерируем M независимых стохастических проходов и усредняем их дескрипторы для получения O_t^M (бюджет выборок Mspp). Итоговый входной тензор X_t формируется путем конкатенации агрегированных карт текущего кадра и K=3 предыдущих кадров. Процесс реконструкции описывается формулой &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BI%7D_t%20%3D%20D_%20heta(X_t)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Прямая репроекция — это перенос данных из предыдущих кадров в текущий вид на основе их известных координат, что помогает компенсировать нехватку информации в текущем «шумном» кадре.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"gibridnaya-generaciya-stohasticheskih-nablyudenij\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#gibridnaya-generaciya-stohasticheskih-nablyudenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Гибридная генерация стохастических наблюдений&lt;/span&gt;&lt;/a&gt;Гибридная генерация стохастических наблюдений&lt;/h4&gt;\n&lt;p&gt;Метод основан на вероятностной интерпретации альфа-смешивания в 3D Gaussian Splatting. Для каждого пикселя x и гауссиана i с параметрами &lt;span class=\"yfm-latex\" data-content=\"(%5Cmu_i%2C%20%5CSigma_i%2C%20o_i%2C%20c_i%2C%20z_i)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; вводится бинарный индикатор принятия &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Calpha%7D_i(x)%20%5Csim%20%20ext%7BBernoulli%7D(%5Calpha_i(x))\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Гауссиан сохраняется, если &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Calpha%7D_i(x)%3D1\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, иначе отбрасывается. Среди принятых кандидатов выбирается ближайший по глубине z_i. Математически доказано, что такой подход является несмещенной оценкой стандартного альфа-композитинга, так как математическое ожидание цвета пикселя &lt;span class=\"yfm-latex\" data-content=\"E%5B%5Chat%7BI%7D_%7BST%7D(x)%5D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; совпадает с результатом классического рендеринга IGS(x).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Стохастический отбор на основе распределения Бернулли позволяет получить несмещенную оценку цвета, эквивалентную классическому альфа-смешиванию, при условии корректного распределения примитивов по потокам обработки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для оптимизации производительности используется «маршрутизация» (routing) примитивов. Гауссианы с большой площадью проекции &lt;span class=\"yfm-latex\" data-content=\"A%20%3D%20%5Cpi%20%5Csqrt%7B%2F%5CSigma%2F%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; эффективнее обрабатывать через растеризацию (фрагментный поток), а с малой — через генерацию точек (примитивный поток). Критерий выбора определяется функцией регрессии &lt;span class=\"yfm-latex\" data-content=\"S(o%2C%20A)%20%3D%20%5Cbeta_0%20%2B%20%5Cbeta_1%20%5Clog_2%20A%20%2B%20%5Cbeta_2%20o%20%2B%20%5Cbeta_3%20o%20%5Clog_2%20A\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Если S(o, A) &amp;gt; 0, примитив направляется в фрагментный поток, иначе — в примитивный.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Маршрутизация — это динамическое распределение нагрузки: крупные объекты рендерятся аппаратно (фрагменты), а мелкие — через генерацию случайных точек (примитивы), что экономит ресурсы GPU.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В примитивном потоке используется пуассоновский процесс с интенсивностью λ = 2A Li₂(o). Координаты точек x генерируются с помощью обратного преобразования Бокса-Мюллера, учитывающего ковариационную матрицу &lt;span class=\"yfm-latex\" data-content=\"%5CSigma\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; через разложение Холецкого.&lt;/p&gt;\n&lt;h4 id=\"fragmentnyj-potok-vyborki\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#fragmentnyj-potok-vyborki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Фрагментный поток выборки&lt;/span&gt;&lt;/a&gt;Фрагментный поток выборки&lt;/h4&gt;\n&lt;p&gt;Во фрагментном потоке гауссианы растеризуются в пределах области &lt;span class=\"yfm-latex\" data-content=\"%5COmega\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; с учетом порога отсечения τ_F. Эффективная вероятность принятия составляет &lt;span class=\"yfm-latex\" data-content=\"%5Calpha_%7Beff%7D%5EF(x)%20%3D%20%5Calpha(x)%20%5Ccdot%201_%7Bx%20%5Cin%20%5COmega%7D%20%5Ccdot%201_%7B%5Calpha(x)%20%3E%20%20au_F%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Для объединения результатов из обоих потоков гибридный рендерер выбирает примитив с минимальной глубиной z_p из объединенного множества кандидатов &lt;span class=\"yfm-latex\" data-content=\"A_P(x)%20%5Ccup%20A_F(x)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;.&lt;/p&gt;\n&lt;h4 id=\"prostranstvenno-vremennye-gaussovy-nablyudeniya\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#prostranstvenno-vremennye-gaussovy-nablyudeniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пространственно-временные гауссовы наблюдения&lt;/span&gt;&lt;/a&gt;Пространственно-временные гауссовы наблюдения&lt;/h4&gt;\n&lt;p&gt;Для каждого наблюдения формируется 10-канальный дескриптор s_t(x) = [c(x), α(x), δ²(x), o, q, z⁻¹], где δ²(x) — квадрат расстояния Махаланобиса, а q — коэффициенты ковариации. Усреднение M независимых выборок дает карту наблюдений OM_t(x). Итоговый входной сигнал для нейросети X_t(x) формируется путем конкатенации карт OM для текущего и K=3 предыдущих кадров, спроецированных в текущий момент времени t методом forward warping.&lt;/p&gt;\n&lt;h4 id=\"nejronnaya-rekonstrukciya\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#nejronnaya-rekonstrukciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нейронная реконструкция&lt;/span&gt;&lt;/a&gt;Нейронная реконструкция&lt;/h4&gt;\n&lt;p&gt;Процесс реконструкции базируется на архитектуре U-Net, дополненной попиксельным MLP-блоком. Итоговое изображение &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BI%7D_t\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; формируется путем объединения локальных признаков Flocal^t (от MLP) и контекстных признаков Fcontext^t (от U-Net). Обучение проводится с использованием функции потерь L, состоящей из Charbonnier-штрафа Lchar и члена согласованности градиентов Lgrad с весовым коэффициентом λgrad:&lt;br /&gt;\nL = Lchar + λgradLgrad, (2)&lt;br /&gt;\n&lt;span class=\"yfm-latex\" data-content=\"L_%7Bchar%7D%20%3D%20%5Cfrac%7B1%7D%7BN%7D%20%5Csum_p%20%5Csqrt%7B%5C%2F%5Chat%7BI%7D_t(p)%20-%20I_%7BGT%7D%5Et(p)%5C%2F%5E2%20%2B%20%5Cepsilon%5E2%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, (3)&lt;br /&gt;\n&lt;span class=\"yfm-latex\" data-content=\"L_%7Bgrad%7D%20%3D%20%5Cfrac%7B1%7D%7BN%7D%20%5Csum_p%20%5Csum_%7Bd%20%5Cin%20%5C%7Bx%2Cy%5C%7D%7D%20%5C%2F%0Aabla_d%20%5Chat%7BI%7D_t(p)%20-%20%0Aabla_d%20I_%7BGT%7D%5Et(p)%5C%2F_1\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, (4)&lt;br /&gt;\nгде N — число пикселей, а ε — малая константа. Градиентный член критически важен для сохранения четкости границ и локальных структур.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование комбинации Charbonnier-потерь и градиентного согласования позволяет эффективно восстанавливать детали изображения, сохраняя структурную целостность границ.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"eksperimentalnaya-ustanovka\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#eksperimentalnaya-ustanovka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Экспериментальная установка&lt;/span&gt;&lt;/a&gt;Экспериментальная установка&lt;/h4&gt;\n&lt;p&gt;Оценка проводилась на 11 сценах из наборов Mip-NeRF 360, Tanks and Temples и Deep Blending. Для каждой сцены обучалась отдельная сеть, при этом Gaussian-представление оставалось фиксированным. Между кадрами исходных данных вставлялось не менее K ≥ 3 промежуточных видов с ограничением смещения камеры в 0,05 единиц сцены и поворота в 3^°. В качестве базовых методов для сравнения использовались Stochastic Splats (SS), Gaussian Point Splatting (GPS), MobileGS и MiniSplatting.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Gaussian-представление — это метод представления 3D-сцены в виде набора 3D-гауссиан, которые «растекаются» (splatting) на плоскость изображения для рендеринга.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Реализация выполнена на PyTorch (обучение) и Vulkan/GLSL с использованием TensorRT (инференс). Оптимизация проводилась 2000 эпох через AdamW с линейным прогревом (100 эпох) и косинусным затуханием learning rate от 1 × 10⁻⁴ до 5 × 10⁻⁶. В каждой эпохе использовалось семь случайных кропов 256 × 256.&lt;/p&gt;\n&lt;h4 id=\"skvoznaya-rekonstrukciya\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#skvoznaya-rekonstrukciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сквозная реконструкция&lt;/span&gt;&lt;/a&gt;Сквозная реконструкция&lt;/h4&gt;\n&lt;p&gt;Версия Ours-S при 1 spp достигает 283,17–305,32 FPS, что в 2,3–2,7 раза быстрее 3DGS. Более тяжелая модель Ours-L (16 spp) превосходит 3DGS по PSNR. Время реконструкции составляет 1,78 мс для Ours-S и 11,31 мс для Ours-L. Аблационные исследования (Таблица 2) подтверждают важность временной истории и дескрипторов: удаление истории снижает PSNR, тогда как вклад отдельных дескрипторов менее выражен. При кросс-сценовой оценке на данных DL3DV (Таблица 3) модель Ours-S показывает более высокий PSNR, чем базовые методы SS и GPS, хотя и уступает стандартному 3DGS.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 2.&lt;/strong&gt; Абляция временной истории и локальных дескрипторов Гаусса с использованием Ours-S&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Метод&lt;/th&gt;\n&lt;th&gt;Mip-NeRF360 (PSNR↑/SSIM↑/LPIPS↓/FPS↑)&lt;/th&gt;\n&lt;th&gt;Tanks&amp;amp;Temples (PSNR↑/SSIM↑/LPIPS↓/FPS↑)&lt;/th&gt;\n&lt;th&gt;Deep Blending (PSNR↑/SSIM↑/LPIPS↓/FPS↑)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;StochasticSplats&lt;/td&gt;\n&lt;td&gt;17.29/0.2427/0.8942/664.95&lt;/td&gt;\n&lt;td&gt;13.30/0.1754/0.9961/843.08&lt;/td&gt;\n&lt;td&gt;21.61/0.3562/0.8063/556.03&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Gaussian Point Splatting&lt;/td&gt;\n&lt;td&gt;17.28/0.2413/0.8947/620.56&lt;/td&gt;\n&lt;td&gt;13.30/0.1749/0.9961/440.99&lt;/td&gt;\n&lt;td&gt;21.60/0.3559/0.8065/438.95&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ours (1-spp)&lt;/td&gt;\n&lt;td&gt;17.28/0.2407/0.8947/880.07&lt;/td&gt;\n&lt;td&gt;13.29/0.1738/0.9965/1001.78&lt;/td&gt;\n&lt;td&gt;21.61/0.3559/0.8065/1024.15&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;3DGS&lt;/td&gt;\n&lt;td&gt;28.90/0.8708/0.1856/122.18&lt;/td&gt;\n&lt;td&gt;23.39/0.8421/0.1837/113.19&lt;/td&gt;\n&lt;td&gt;29.52/0.9038/0.2459/111.18&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;MobileGS†&lt;/td&gt;\n&lt;td&gt;28.20/0.8570/0.2103/234.97&lt;/td&gt;\n&lt;td&gt;-∗/-∗/-∗/-∗&lt;/td&gt;\n&lt;td&gt;30.07/0.9109/0.2486/292.26&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Mini. + Ours (1-spp + S)&lt;/td&gt;\n&lt;td&gt;26.92/0.8055/0.2607/345.31&lt;/td&gt;\n&lt;td&gt;22.31/0.7723/0.2830/343.51&lt;/td&gt;\n&lt;td&gt;29.48/0.8983/0.2703/344.11&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ours (1-spp + S)&lt;/td&gt;\n&lt;td&gt;27.72/0.8120/0.1949/283.17&lt;/td&gt;\n&lt;td&gt;22.72/0.7780/0.2075/305.32&lt;/td&gt;\n&lt;td&gt;29.33/0.8952/0.1895/301.10&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ours (4-spp + S)&lt;/td&gt;\n&lt;td&gt;28.23/0.8344/0.2321/159.59&lt;/td&gt;\n&lt;td&gt;22.98/0.7904/0.2656/173.77&lt;/td&gt;\n&lt;td&gt;29.48/0.8999/0.2591/160.01&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ours (16-spp + L)&lt;/td&gt;\n&lt;td&gt;29.08/0.8606/0.1561/40.43&lt;/td&gt;\n&lt;td&gt;23.68/0.8252/0.1570/40.36&lt;/td&gt;\n&lt;td&gt;29.70/0.9065/0.1735/38.05&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Все значения PSNR оценены относительно стандартной цели 3DGS.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 3.&lt;/strong&gt; PSNRonheld-outDL3DVviewswithrespectto photographic ground truth. Avg. is the arithmetic mean over the five scenes. The best and second-best values are shown in bold and underlined, respectively. SS (4-spp), GPS (4-spp), and Ours (1-spp + S) run at 353.32, 282.91, and 353.43 FPS, respectively.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render-tT3.jpg\" alt=\"Таблица 3\" /&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Результаты зависят от конкретной сцены; при кросс-сценовой валидации модель демонстрирует хорошую обобщающую способность, но не достигает точности 3DGS, обученного на целевых данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"primenenie-mobilnoe-razvertyvanie-i-sovmestnaya-obrabotka-grafiki-i-vychislenij\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#primenenie-mobilnoe-razvertyvanie-i-sovmestnaya-obrabotka-grafiki-i-vychislenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Применение: мобильное развертывание и совместная обработка графики и вычислений&lt;/span&gt;&lt;/a&gt;Применение: мобильное развертывание и совместная обработка графики и вычислений&lt;/h4&gt;\n&lt;p&gt;Авторы адаптировали предложенный метод для мобильных платформ, чтобы проверить его эффективность в условиях ограниченных вычислительных ресурсов. При разрешении 540p разработанный рендерер демонстрирует среднюю производительность 92,6 FPS. Для сравнения: показатели Stochastic Splats (SS) составляют 53,3 FPS, а Gaussian Point Splatting (GPS) — 49,0 FPS. При использовании компактной нейросетевой архитектуры для реконструкции, работающей на встроенном нейронном процессоре (NPU), скорость достигает 73,2 FPS.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод обеспечивает 92,6 FPS при 540p, что значительно превосходит показатели аналогов (SS — 53,3 FPS, GPS — 49,0 FPS), сохраняя работоспособность на мобильных устройствах с NPU на уровне 73,2 FPS.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В качестве базовой линии для 3DGS-GL использовался алгоритм Splatapult. Интерактивная реализация дополнительно включает механизм репроецированного временного накопления (reprojected temporal accumulation) для повышения качества итоговых изображений. Сравнительные данные по производительности (FPS) для различных сцен представлены в Таблице 1.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 1.&lt;/strong&gt; Quality against ground truth at the training resolution; throughput at 1080p. The first three rows report renderer-only FPS; Ours-S/L rows include rendering and reconstruction. Best/second-best PSNR and FPS within each block are bold/underlined; tiessharerank.∗MobileGSoptimizationproducedNaNsonTanks&amp;amp;Temples.†MobileGSFPSincludesitsview-dependent MLP (TensorRT) and rasterization; its released timing code omits the MLP.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render-tT1.jpg\" alt=\"Таблица 1\" /&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Репроецированное временное накопление — это метод улучшения качества картинки путем объединения данных из текущего и предыдущих кадров с учетом движения камеры, что позволяет сгладить шум без потери детализации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Таблица 1. Сравнение производительности (FPS) на различных сценах&lt;/p&gt;\n&lt;p&gt;/ Метод / Грузовик / Комната / Доктор Джонсон / Ср. /&lt;br /&gt;\n/ :--- / :--- / :--- / :--- / :--- /&lt;br /&gt;\n/ 3DGS-GL / 5,46 / 12,8 / 3,2 / 7,15 /&lt;br /&gt;\n/ SS / 24,8 / 65,8 / 69,4 / 53,3 /&lt;br /&gt;\n/ GPS / 41,3 / 52,8 / 53,0 / 49,03 /&lt;br /&gt;\n/ SortfreeGS / 37,2 / 50,3 / 27,2 / 38,2 /&lt;br /&gt;\n/ MobileGS / – / 32,6 / 28,1 / 30,4 /&lt;br /&gt;\n/ Наш (1-spp) / 78,8 / 112,7 / 86,3 / 92,6 /&lt;br /&gt;\n/ Наш (1-spp + S) / 64,6 / 86,7 / 68,3 / 73,2 /&lt;/p&gt;\n&lt;h3 id=\"zaklyuchenie\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#zaklyuchenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заключение&lt;/span&gt;&lt;/a&gt;Заключение&lt;/h3&gt;\n&lt;h4 id=\"osnovnye-vyvody-i-ogranicheniya\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#osnovnye-vyvody-i-ogranicheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Основные выводы и ограничения&lt;/span&gt;&lt;/a&gt;Основные выводы и ограничения&lt;/h4&gt;\n&lt;p&gt;Представленный метод основан на использовании гауссовского стохастического сэмплирования, что позволяет выполнять рендеринг 3D-сцен без необходимости предварительной сортировки элементов. Преобразуя непрерывные гауссовские сплэты в дискретные выборки видимости, гибридный сэмплер объединяет преимущества примитивно-ориентированного и фрагментно-ориентированного подходов, не требуя при этом изменения исходных данных 3DGS. Пространственно-временная реконструкция с учетом гауссовской структуры интегрирует текущие и накопленные данные, что эффективно подавляет шум при малом количестве выборок на пиксель.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод обеспечивает эффективный рендеринг без сортировки, объединяя стохастическую выборку и пространственно-временную фильтрацию для подавления шума.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Система поддерживает два режима работы: использование фиксированной модели реконструкции для различных сцен и индивидуальную настройку под конкретную сцену для достижения максимального качества. Основным ограничением является склонность к чрезмерному сглаживанию высокочастотных деталей при работе с разреженными стохастическими данными. Это особенно заметно на тонких структурах, резких границах видимости и эффектах, зависящих от угла обзора.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;При низких частотах дискретизации возможна потеря мелких деталей из-за сглаживания, что обусловлено ограниченным объемом данных и спецификой целевой функции реконструкции.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Перспективным направлением развития является создание сквозного (end-to-end) обучения, при котором гауссовское представление, стратегия сэмплирования и нейронная сеть реконструкции оптимизируются совместно. Такой подход позволит лучше сохранять мелкие детали, однако потребует дополнительных вычислительных затрат на оптимизацию под конкретную сцену, в отличие от текущего метода развертывания с фиксированными активами.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render-f5.jpg\" alt=\"Рис. 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 5&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render-fS2.jpg\" alt=\"Рис. S2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render-fS5.jpg\" alt=\"Рисунок A5: Качественные результаты для дополнительных сцен при 16 spp + большая сеть, демонстрирующие качество нейронно\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок A5: Качественные результаты для дополнительных сцен при 16 spp + большая сеть, демонстрирующие качество нейронной реконструкции и детали локального внешнего вида.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-02/gaussian-stippling-efficient-sorting-free-3d-gaussian-render.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Высокая&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;стоимость&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сортировки&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;слоев&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Гибридная&lt;/text&gt;&l
