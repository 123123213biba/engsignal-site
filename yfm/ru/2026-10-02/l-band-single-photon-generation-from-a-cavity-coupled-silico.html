        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"139\" cy=\"137\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"681\" cy=\"261\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · OTHER   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Кремниевые C-центры: новый&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;стандарт для квантовых сетей&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;в L-диапазоне&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/l-band-single-photon-generation-from-a-cavity-coupled-silico-f1.jpg\" alt=\"Рис. 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Исследователи успешно изолировали одиночный &lt;a href=\"concepts/c-center.html\"&gt;C-центр&lt;/a&gt; в кремниевой структуре, используя нанофотонный резонатор. Это позволило ускорить спонтанное излучение дефекта в пять раз благодаря эффекту Парселла. Полученный источник одиночных фотонов работает в L-диапазоне, что критически важно для передачи данных по оптоволокну с минимальными потерями.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-02/l-band-single-photon-generation-from-a-cavity-coupled-silico.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Изолирован одиночный C-центр с &lt;a href=\"concepts/second-order-autocorrelation-function.html\"&gt;g^(2)(0)&lt;/a&gt; = 0,23.&lt;/li&gt;\n&lt;li&gt;Время жизни сокращено в 5 раз до 0,287 мкс.&lt;/li&gt;\n&lt;li&gt;Рабочий диапазон 1570 нм идеален для оптоволокна.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-02/l-band-single-photon-generation-from-a-cavity-coupled-silico.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;C-центр представляет собой комплекс из междоузельного углерода и кислорода (Ci-Oi). Его нулевая фононная линия (ZPL) находится в диапазоне 1565–1625 нм, что совпадает с максимумом прозрачности кварцевого волокна. Для изоляции одиночного излучателя авторы использовали одномерный &lt;a href=\"concepts/photonic-crystal-resonator.html\"&gt;фотонно-кристаллический резонатор&lt;/a&gt; в кремниевой нанобалке на изоляторе (&lt;a href=\"concepts/silicon-on-insulator.html\"&gt;SOI&lt;/a&gt;). Добротность резонатора (Q) составила (1,4±0,3)×10^4, что позволило настроиться на резонанс с ZPL (1569,831 нм).&lt;/p&gt;\n&lt;p&gt;При взаимодействии с модой резонатора время жизни возбужденного состояния сократилось с 1,45±0,08 мкс до 0,287±0,002 мкс. Это соответствует нижнему пределу фактора Парселла (FP) ≥ 33. Качество одиночного фотонного излучения подтверждено измерением автокорреляционной функции второго порядка g^(2)(0) = 0,23 без коррекции на фон. Расчеты проводились при температуре 8 К с использованием лазерной накачки на 800 нм.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Результаты получены при криогенной температуре 8 К, а эффективность ограничена наличием темных триплетных состояний.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-02/l-band-single-photon-generation-from-a-cavity-coupled-silico.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Интеграция источников одиночных фотонов в кремниевые фотонные схемы является ключевым этапом для создания масштабируемых квантовых коммуникационных систем. Среди различных дефектов в кремнии C-центр выделяется своей бесфононной линией излучения в телекоммуникационном L-диапазоне (1565–1625 нм), что соответствует области минимальных потерь в оптическом волокне. Несмотря на этот потенциал, выделение одиночных C-центров ранее оставалось нерешенной задачей. В данной работе авторы впервые демонстрируют изоляцию одиночного C-центра путем его интеграции в нанофотонную кристаллическую полость на основе сужающегося нановолновода.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование нанофотонной полости позволило сократить время жизни возбужденного состояния в 5 раз (до 0,287 мкс), что соответствует фактору Парселла F_P ≥ 33.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/faktor-parsella.html\"&gt;Фактор Парселла&lt;/a&gt; — это показатель того, во сколько раз резонатор ускоряет спонтанное излучение квантового эмиттера по сравнению с излучением в свободном пространстве.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для усиления яркости и выделения одиночного эмиттера была использована полость с малым модовым объемом, которая за счет эффекта Парселла селективно ускоряет спонтанное излучение на бесфононной линии. Экспериментальные измерения автокорреляции второго порядка подтвердили квантовую природу источника: значение параметра чистоты излучения составило g⁽²⁾(0) = 0,23 без коррекции на фоновый сигнал. Данный результат доказывает возможность создания эффективных квантовых источников света в кремнии, работающих в L-диапазоне, что открывает перспективы для квантовых сетей с ультранизкими потерями.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Наблюдение одиночных C-центров осложняется наличием низколежащего триплетного состояния и неэффективным переходом в некогерентную фононную боковую полосу, что требует применения высокодобротных полостей для селективного усиления сигнала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;C-центры в кремнии представляют собой комплексы C_i-O_i, обладающие бесфононной линией (линия C₀) на длине волны 1570 нм с временем жизни в микросекундном диапазоне. Второе возбужденное состояние (линия C₁) излучает на 1560 нм. Важной особенностью является наличие темного триплетного состояния (C_T), расположенного на 2,64 мэВ ниже уровня C₀. Время жизни этого состояния при криогенных температурах достигает миллисекунд, а время межсистемного перехода τISC ≈ 2,8 мкс ограничивает эффективность излучения C-центров. Теоретический фактор Дебая-Уоллера для них составляет 0,12–0,2, что в сочетании с долгоживущими темными состояниями требует селективного усиления перехода C₀.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;C-центры имеют низкую эффективность излучения из-за наличия темного состояния C_T и малого фактора Дебая-Уоллера, что требует использования фотонных резонаторов для усиления сигнала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для минимизации примесей C-центры создавались в изотопически и химически очищенных слоях SOI (кремний на изоляторе). Ионы углерода и водорода имплантировались под углом 7^° для исключения каналирования; энергия подбиралась так, чтобы проекция пробега ионов составляла 110 нм согласно симуляциям SRIM. Источником кислорода служила естественная контаминация и диффузия из оксидного слоя при отжиге. Образцы выполнялись в виде сужающихся нанобалок с одномерным фотонным кристаллом (Рис. 1c), резонирующим с переходом C₀. Резонанс настраивался конденсацией азота на поверхность устройства. Асимметрия отражения, задаваемая количеством отверстий N_L и N_R, обеспечивает направленное распространение фотонов к волокну.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/l-band-single-photon-generation-from-a-cavity-coupled-silico-f1.jpg\" alt=\"Рис. 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/fotonnyy-kristall.html\"&gt;Фотонный кристалл&lt;/a&gt; — это наноструктура с периодическим изменением показателя преломления, которая позволяет управлять движением света, «запирая» его в резонаторе.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Измерения проводились в криостате при 8 К. Возбуждение осуществлялось лазером (CW 800 нм или импульсным) через объектив с NA 0,70. Сигнал собирался линзованным одномодовым волокном (NA 0,4) с эффективностью связи ~ 70%. Отражательная способность резонатора (Рис. 2a) показала ширину линии FWHM 0,11 ± 0,02 нм и добротность (1,4 ± 0,3) × 10⁴. При возбуждении мощностью 10 мкВт спектр фотолюминесценции (Рис. 2b) выявил пик на λZPL = 1569,831 ± 0,004 нм с шириной 0,078 ± 0,001 нм. Взаимодействие эмиттера с резонатором оценивалось через зависимость интенсивности от расстройки δ = λZPL - λCM.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/l-band-single-photon-generation-from-a-cavity-coupled-silico-f2.jpg\" alt=\"Рисунок 2: a) Спектр отражения резонатора, настроенного на длину волны линии C0 (точки), и соответствующая аппроксимация\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2: a) Спектр отражения резонатора, настроенного на длину волны линии C0 (точки), и соответствующая аппроксимация функцией Лоренца (пунктирная линия), дающая FWHM = 0.11 ± 0.02 нм, что соответствует добротности (1.4 ± 0.3) × 10^4&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 2: a) Спектр отражения резонатора, настроенного на длину волны линии C0 (точки), и соответствующая аппроксимация функцией Лоренца (пунктирная линия), дающая FWHM = 0.11 ± 0.02 нм, что соответствует добротности (1.4 ± 0.3) × 10^4; b) Спектр фотолюминесценции (точки) излучателя при 8 К под воздействием непрерывного возбуждения 800 нм, мощность накачки 10 мкВт, в нерезонансных условиях. Аппроксимация экспериментальных данных функцией Лоренца (пунктирная линия) дает λZPL = 1569.831 ± 0.004 нм и FWHM = 0.078 ± 0.001 нм; c) Интенсивность фотолюминесценции как функция расстройки моды резонатора δ. Пунктирная линия служит визуальным ориентиром для отслеживания изменения δ.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование криогенных температур (8 К) необходимо для подавления фононного уширения и наблюдения узких спектральных линий C-центров.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для количественной оценки эффекта Парселла проводились измерения фотолюминесценции с временным разрешением (Рис. 3). Использовался импульсный лазер (780 нм, 100 кГц, 70 пс). Время жизни ансамбля центров в нанобалке без резонатора составило τ₀ = 1.45 ± 0.08 мкс. При настройке резонатора в резонанс (δ = 0 нм) время жизни сократилось до τon = 0.287 ± 0.002 мкс, что указывает на пятикратное ускорение спонтанного излучения. При расстройке (δ = -0.09 нм) время жизни возрастает до τ = 0.523 ± 0.005 мкс, а при δ = -0.83 нм — до τoff = 0.780 ± 0.030 мкс.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Резонансное взаимодействие с резонатором сокращает время жизни C-центра в 5 раз (с 1.45 мкс до 0.287 мкс), что подтверждает значительное усиление скорости спонтанного излучения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Фактор Парселла (F_P) — показатель того, во сколько раз резонатор увеличивает скорость излучения квантового объекта по сравнению со свободным пространством.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для расчета F_P использовалась формула (1), учитывающая фактор Дебая-Валлера (FDW = 0.2) и внутреннюю квантовую эффективность (&lt;span class=\"yfm-latex\" data-content=\"%5Ceta_%7BQE%7D%20%3D%200.482\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;). Расчетное значение составило F_P ≥ 33. Разница между τoff и τ₀ объясняется наличием дополнительных путей безызлучательной рекомбинации в наноструктуре.&lt;/p&gt;\n&lt;p&gt;Зависимость интенсивности излучения от мощности накачки (Рис. 4а) описывается моделью двухуровневой системы (уравнение 2). Аппроксимация дала интенсивность насыщения Isat = (7.68 ± 0.09) × 10³ имп/с и мощность насыщения Psat = 10.4 ± 0.3 мкВт. Для подтверждения того, что излучатель является одиночным дефектом, проведены измерения автокорреляционной функции второго порядка g⁽²⁾(τ) (Рис. 4b) при мощности 7 мкВт (0.67 Psat). Полученное значение g⁽²⁾(0) = 0.23 ± 0.01 (без коррекции на фон) доказывает природу одиночного фотонного излучателя.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/l-band-single-photon-generation-from-a-cavity-coupled-silico-f4.jpg\" alt=\"Рис. 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 4&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Значение g⁽²⁾(0) = 0.23 получено без вычета фонового излучения, что является прямым доказательством работы одиночного квантового излучателя.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Работа демонстрирует возможность интеграции C-центров в кремниевые фотонные кристаллы, что открывает путь к созданию масштабируемых квантовых сетей в телекоммуникационном L-диапазоне на базе стандартных SOI-платформ.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/l-band-single-photon-generation-from-a-cavity-coupled-silico-fS1.jpg\" alt=\"Рисунок S1: Спектр фотолюминесценции ансамбля C-центров в открытой нанобалке, показывающий линию C0 на ∼1570 нм и линию \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок S1: Спектр фотолюминесценции ансамбля C-центров в открытой нанобалке, показывающий линию C0 на ∼1570 нм и линию C1 на ∼1560 нм.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/l-band-single-photon-generation-from-a-cavity-coupled-silico-fS2.jpg\" alt=\"Рисунок S2: Интегральная площадь линии C0 как функция расстройки моды резонатора δ из рисунка 2c (точки). Пунктирная лин\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок S2: Интегральная площадь линии C0 как функция расстройки моды резонатора δ из рисунка 2c (точки). Пунктирная линия представляет аппроксимацию экспериментальных данных функцией Лоренца, дающую FWHM = 0.13 ± 0.01 нм и λC = 1569.831 ± 0.004 нм.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/l-band-single-photon-generation-from-a-cavity-coupled-silico-fS3.jpg\" alt=\"Рисунок S3: Время жизни C-центра как функция расстройки моды резонатора δ.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок S3: Время жизни C-центра как функция расстройки моды резонатора δ.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/l-band-single-photon-generation-from-a-cavity-coupled-silico-fS4.jpg\" alt=\"Рисунок S4: Значения g(2)(0) без коррекции фона (IB=0, зеленые точки) и с коррекцией фона (синие точки) как функция пада\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок S4: Значения g(2)(0) без коррекции фона (IB=0, зеленые точки) и с коррекцией фона (синие точки) как функция падающей мощности.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-02/l-band-single-photon-generation-from-a-cavity-coupled-silico.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;низкая яркость&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;C-центров в&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;кремнии&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;связь с&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;нанофотонным&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;резонатором&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;пятикратное&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ускорение&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;излучения&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;масштабируемые&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;квантовые сети&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт не проходил рецензирование. Выводы предварительные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-02/l-band-single-photon-generation-from-a-ca
