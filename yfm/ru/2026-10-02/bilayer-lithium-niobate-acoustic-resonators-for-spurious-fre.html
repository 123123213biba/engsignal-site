            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"168\" cy=\"66\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"572\" cy=\"284\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · COMPOSITES   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Двухслойный ниобат лития:&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;как избавиться от паразитных&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;мод в фильтрах 6 ГГц&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre-f1.jpg\" alt=\"Рис. 1. Архитектуры объемных акустических резонаторов с толщинно-сдвиговой модой и их типичные характеристики. a Трехмер\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1. Архитектуры объемных акустических резонаторов с толщинно-сдвиговой модой и их типичные характеристики. a Трехмерная схема предлагаемого устройства, состоящего из алюминиевых встречно-штыревых преобразователей (IDT), сформированных на подвесной…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. 1. Архитектуры объемных акустических резонаторов с толщинно-сдвиговой модой и их типичные характеристики. a Трехмерная схема предлагаемого устройства, состоящего из алюминиевых встречно-штыревых преобразователей (IDT), сформированных на подвесной мембране из LiNbO3. Поперечное сечение вдоль A-A подчеркивает подвесную структуру и плавающий нижний электрод, обеспечивающий толщинно-сдвиговое возбуждение. b Стек однослойного X-среза резонатора из LiNbO3. c Адмитансная характеристика толщинно-сдвигового BAW-резонатора из X-среза LiNbO3 с сильной связью медленной моды SH1, сопровождаемой паразитной быстрой модой SH1. d Предлагаемый двухслойный стек резонатора, состоящий из соединенных слоев X-среза и -X-среза LiNbO3 с оптимизированным углом соединения θ. e Типичные адмитансные характеристики, демонстрирующие селективное возбуждение медленных мод SH1 и SH2 при частоте около 4,5 ГГц, а также подавление внутриполосных быстрых сдвиговых мод. Это достигается за счет использования различных толщин слоев LiNbO3 и углов соединения.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Развитие сетей 5G и Wi-Fi 6E требует фильтров, работающих на частотах выше 5 ГГц с широкой полосой пропускания. Традиционные резонаторы сталкиваются с литографическими ограничениями и появлением паразитных мод. Новая архитектура на основе двухслойного X-среза ниобата лития (LiNbO3) решает эту проблему через инженерное управление симметрией слоев.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Двухслойная структура LiNbO3 позволяет селективно возбуждать SH2-моду.&lt;/li&gt;\n&lt;li&gt;Коэффициент электромеханической связи k2eff достигает 35% на частоте 6 ГГц.&lt;/li&gt;\n&lt;li&gt;Угол склейки 294° обеспечивает подавление паразитных быстрых мод.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Исследователи предложили конструкцию, состоящую из двух вертикально соединенных тонких пленок LiNbO3 с точно подобранным углом склейки. В такой структуре возбуждается вторая мода сдвига по толщине (SH2, slow), при этом быстрые моды сдвига, характерные для обычного X-среза, эффективно подавляются. Это достигается за счет того, что разворот кристаллографических осей слоев меняет знаки пьезоэлектрических коэффициентов, обеспечивая конструктивную интерференцию для нужной моды.&lt;/p&gt;\n&lt;p&gt;Экспериментальные образцы, работающие на частоте около 6 ГГц, показали коэффициент электромеханической связи (k2eff) на уровне 35%. Оптимальный угол склейки θ = 294° позволил добиться чистого спектрального отклика без паразитных колебаний внутри полосы. Прототипы лестничных фильтров продемонстрировали относительную полосу пропускания 18,6%, что подтверждает высокую эффективность предложенного метода для систем радиочастотной фильтрации следующего поколения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование ограничено лабораторными прототипами; требуется проверка масштабируемости процесса прецизионной склейки пленок для массового производства.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Развитие стандартов беспроводной связи в сторону повышения частот и расширения полосы пропускания ставит новые задачи перед технологиями акустических фильтров. Традиционные резонаторы при работе на частотах выше 5 ГГц сталкиваются с серьезными ограничениями: технологическими сложностями литографии, снижением коэффициента электромеханической связи (k²eff) и возбуждением нежелательных паразитных мод, что затрудняет их практическое применение.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Коэффициент электромеханической связи (k²eff) определяет эффективность преобразования электрической энергии в акустическую и обратно; чем он выше, тем шире полоса пропускания фильтра.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторы предлагают архитектуру двухслойного объемного акустического резонатора на основе X-среза ниобата лития (LiNbO₃), работающего на моде сдвига по толщине. В основе метода лежит инженерное управление симметрией: два пьезоэлектрических тонкопленочных слоя располагаются вертикально друг над другом с заданным углом сопряжения. Такая конфигурация позволяет селективно возбуждать вторую моду сдвига по толщине (SH₂, медленная мода).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование двухслойной структуры с управляемой симметрией позволяет подавить быстрые моды сдвига, обеспечивая чистоту спектра без паразитных резонансов в полосе пропускания.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Экспериментальные образцы, настроенные на частоту около 6 ГГц, показали коэффициент k²eff на уровне 35%, что практически совпадает с результатами конечно-элементного моделирования и подтверждает эффективность выбранного механизма селекции мод. Макетные образцы лестничных фильтров продемонстрировали относительную ширину полосы пропускания 18,6%.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Результаты получены на экспериментальных макетах (proof-of-concept), что требует дальнейшей отработки технологии для массового производства.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Данная архитектура позволяет масштабировать частоту за счет изменения толщины слоев, сохраняя при этом высокий уровень связи и спектральную чистоту, что делает её перспективной платформой для широкополосных радиочастотных фильтров в системах связи следующего поколения.&lt;/p&gt;\n&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;h4 id=\"evolyuciya-radiochastotnyh-filtrov-v-setyah-5g-i-vyshe\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#evolyuciya-radiochastotnyh-filtrov-v-setyah-5g-i-vyshe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эволюция радиочастотных фильтров в сетях 5G и выше&lt;/span&gt;&lt;/a&gt;Эволюция радиочастотных фильтров в сетях 5G и выше&lt;/h4&gt;\n&lt;p&gt;Развитие беспроводных сетей пятого поколения (5G) и перспективных стандартов связи диктует переход к более высоким рабочим частотам и расширению полос пропускания для борьбы с перегрузкой спектра. В диапазоне FR1 (ниже 6 ГГц) ключевые полосы n77 (3,3–4,2 ГГц), n78 (3,3–3,8 ГГц) и n79 (4,4–5 ГГц) обеспечивают повышенную пропускную способность, превосходя возможности систем 4G LTE. Дополнительно, выделение 1200 МГц в диапазоне 6 ГГц для Wi-Fi 6E требует от радиочастотных (РЧ) фронтендов работы с более широкими каналами.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Переход к 5G и Wi-Fi 6E требует фильтров, способных эффективно работать в расширенных диапазонах частот при сохранении высокой пропускной способности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Технологии акустических фильтров остаются «узким местом» в архитектуре РЧ-трактов. Традиционные фильтры на поверхностных (SAW) и объемных (BAW) акустических волнах успешно применялись ранее, но сталкиваются с ограничениями при масштабировании. Для SAW-устройств рост частоты требует уменьшения длины волны и размеров электродов, что упирается в пределы возможностей литографии. Технология IHP-SAW (высокопроизводительные SAW) частично решает эту проблему, улучшая локализацию энергии, добротность и коэффициент электромеханической связи (k²eff).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;k²eff (коэффициент электромеханической связи) — параметр, определяющий эффективность преобразования электрической энергии в акустическую и обратно; чем он выше, тем шире полоса пропускания фильтра.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В отличие от SAW, частота BAW-резонаторов определяется толщиной пленки, что снимает ограничения по латеральному масштабированию. В коммерческих решениях доминируют нитрид алюминия (AlN) и нитрид алюминия-скандия (AlScN), причем последний значительно повышает k²eff. Современные разработки, такие как эпитаксиальный AlN и архитектуры с периодически поляризованными пьезоэлектрическими пленками (P3F), позволяют возбуждать моды высших порядков и работать в X и Ku диапазонах. Тем не менее, одновременное достижение сверхвысоких частот и высокого k²eff для обеспечения широкой относительной полосы пропускания остается сложной инженерной задачей.&lt;/p&gt;\n&lt;h4 id=\"perspektivy-ispolzovaniya-linbo3-v-vysokochastotnyh-rezonatorah\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#perspektivy-ispolzovaniya-linbo3-v-vysokochastotnyh-rezonatorah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Перспективы использования LiNbO3 в высокочастотных резонаторах&lt;/span&gt;&lt;/a&gt;Перспективы использования LiNbO3 в высокочастотных резонаторах&lt;/h4&gt;\n&lt;p&gt;Высокий коэффициент электромеханической связи ниобата лития (LiNbO3) делает его перспективным материалом для создания эффективных акустических фильтров. Интеграция тонких пленок LiNbO3 на подложки с высокой скоростью звука, например, SiC, позволяет достичь рабочих частот выше 3 ГГц при улучшенных показателях добротности и связи. Использование подвесных мембранных структур дополнительно повышает локализацию акустической энергии, что позволяет достичь коэффициента эффективной связи k²eff &amp;gt; 30%. При этом для симметричных, сдвиговых горизонтальных и объемных сдвиговых мод частота резонанса сильно зависит от латеральных размеров, что ограничивает возможности масштабирования по частоте.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование подвесных структур LiNbO3 позволяет достичь k²eff &amp;gt; 30%, однако латеральная зависимость частоты требует перехода к модам, зависящим от толщины пленки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для преодоления ограничений по размерам применяются высшие моды Лэмба (например, A1) или объемные акустические резонаторы с латеральным возбуждением (XBAR). Альтернативный подход — возбуждение электрическим полем по толщине пленки, как в FBAR-резонаторах. Особый интерес представляет X-срез LiNbO3, поддерживающий фундаментальную медленную сдвиговую моду (SH1, slow) с k²eff ≈ 40%. Однако для работы в диапазоне Wi-Fi 6E (6–7 ГГц) требуется значительное уменьшение толщины пленки, что негативно сказывается на добротности и мощности. Архитектуры P3F (пьезоэлектрические многослойные структуры) позволяют возбуждать высшие моды сдвига по толщине, сохраняя достаточную толщину пьезоэлектрика.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;P3F (Piezoelectric-on-Piezoelectric) — это многослойная архитектура, где за счет инженерного управления симметрией слоев можно эффективно возбуждать нужные акустические моды без экстремального утоньшения материала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В данной работе представлен двухслойный резонатор на основе X-среза LiNbO3 для диапазона 6–7 ГГц. Архитектура объединяет слои +X и -X с заданным углом склейки, что позволяет селективно возбуждать моду SH2,slow. Это обеспечивает масштабирование частоты без критического уменьшения толщины и сохраняет k²eff ≈ 35%. Симметрия слоев подавляет паразитные быстрые сдвиговые моды, обеспечивая чистоту спектра. Работоспособность концепции подтверждена на примере лестничных фильтров (ladder-type filters).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эффективность метода напрямую зависит от точности соблюдения угла склейки слоев, что было подтверждено как численным моделированием, так и экспериментальными измерениями.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"dvuhslojnyj-tolshinno-sdvigovyj-obuemnyj-akusticheskij-rezonator\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#dvuhslojnyj-tolshinno-sdvigovyj-obuemnyj-akusticheskij-rezonator\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Двухслойный толщинно-сдвиговый объемный акустический резонатор&lt;/span&gt;&lt;/a&gt;Двухслойный толщинно-сдвиговый объемный акустический резонатор&lt;/h4&gt;\n&lt;p&gt;Подвесные резонаторы на объемных акустических волнах (BAW) из ниобата лития (LiNbO₃) представляют собой мембрану с металлическими встречно-штыревыми преобразователями (ВШП) на верхней грани и плавающим электродом на нижней (Рис. 1a). Такая геометрия создает преимущественно вертикальное электрическое поле с чередующейся полярностью, что возбуждает моды толщинного сдвига. Резонансная частота определяется толщиной пьезоэлектрического слоя, а шаг ВШП, апертура и параметры канавок позволяют настраивать статическую емкость, электрическое сопротивление и подавлять нежелательные моды Лэмба.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre-f1.jpg\" alt=\"Рис. 1. Архитектуры объемных акустических резонаторов с толщинно-сдвиговой модой и их типичные характеристики. a Трехмер\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1. Архитектуры объемных акустических резонаторов с толщинно-сдвиговой модой и их типичные характеристики. a Трехмерная схема предлагаемого устройства, состоящего из алюминиевых встречно-штыревых преобразователей (IDT), сформированных на подвесной…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. 1. Архитектуры объемных акустических резонаторов с толщинно-сдвиговой модой и их типичные характеристики. a Трехмерная схема предлагаемого устройства, состоящего из алюминиевых встречно-штыревых преобразователей (IDT), сформированных на подвесной мембране из LiNbO3. Поперечное сечение вдоль A-A подчеркивает подвесную структуру и плавающий нижний электрод, обеспечивающий толщинно-сдвиговое возбуждение. b Стек однослойного X-среза резонатора из LiNbO3. c Адмитансная характеристика толщинно-сдвигового BAW-резонатора из X-среза LiNbO3 с сильной связью медленной моды SH1, сопровождаемой паразитной быстрой модой SH1. d Предлагаемый двухслойный стек резонатора, состоящий из соединенных слоев X-среза и -X-среза LiNbO3 с оптимизированным углом соединения θ. e Типичные адмитансные характеристики, демонстрирующие селективное возбуждение медленных мод SH1 и SH2 при частоте около 4,5 ГГц, а также подавление внутриполосных быстрых сдвиговых мод. Это достигается за счет использования различных толщин слоев LiNbO3 и углов соединения.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ВШП (встречно-штыревой преобразователь) — это система металлических электродов, преобразующая электрический сигнал в механические колебания и наоборот.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В стандартной конфигурации используется один слой X-среза LiNbO₃ (Рис. 1b). Моделирование адмиттанса такой структуры (Рис. 1c) показывает сильную связь моды SH1, slow. Однако наличие дополнительной быстрой моды SH1, fast создает паразитные пульсации в полосе пропускания, что затрудняет создание фильтров (см. Рис. S1a). Для решения этой проблемы предложена двухслойная архитектура, состоящая из стека слоев X-среза и -X-среза LiNbO₃ (Рис. 1a, 1d).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre-fS1.jpg\" alt=\"Рис. S1. Моделируемые кривые замедления и адмитансные характеристики однослойных толщинно-сдвиговых FBAR-резонаторов из \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S1. Моделируемые кривые замедления и адмитансные характеристики однослойных толщинно-сдвиговых FBAR-резонаторов из X-среза, Y-среза и YX163° LiNbO3, работающих в диапазоне около 4,5 и 6 ГГц. a Упругие и пьезо-усиленные кривые замедления X-среза LiNbO3.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. S1. Моделируемые кривые замедления и адмитансные характеристики однослойных толщинно-сдвиговых FBAR-резонаторов из X-среза, Y-среза и YX163° LiNbO3, работающих в диапазоне около 4,5 и 6 ГГц. a Упругие и пьезо-усиленные кривые замедления X-среза LiNbO3. На врезке выделена ненулевая связь быстрой моды SH1. b Моделируемые адмитансные характеристики однослойных толщинно-сдвиговых FBAR-резонаторов из X-среза LiNbO3 толщиной 300 нм и 180 нм с алюминиевыми электродами толщиной 75 нм. Резонансы на частотах 4,42 и 6,03 ГГц демонстрируют быструю моду SH1, в то время как связь уменьшается с 41,5% до 34,5% по мере уменьшения толщины пьезоэлектрика. c Упругие и пьезо-усиленные кривые замедления Y-среза LiNbO3. На врезке выделена нулевая связь быстрой моды SH1. d Моделируемые адмитансные характеристики однослойных толщинно-сдвиговых FBAR-резонаторов из Y-среза LiNbO3 толщиной 300 нм и 180 нм с алюминиевыми электродами толщиной 75 нм. Резонансы на частотах 4,53 и 6,17 ГГц свободны от паразитных мод, но связь уменьшается до 26,1% для случая более тонкого пьезоэлектрического слоя. e Упругие и пьезо-усиленные кривые замедления YX163° LiNbO3. На врезке выделена нулевая связь быстрой моды SH1. f Моделируемые адмитансные характеристики однослойных толщинно-сдвиговых FBAR-резонаторов из YX163° LiNbO3 толщиной 300 нм и 180 нм с алюминиевыми электродами толщиной 75 нм. Резонансы на частотах 4,57 и 6,21 ГГц свободны от паразитных мод, но связь уменьшается до 26,7% для случая более тонкого пьезоэлектрического слоя.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Двухслойная структура позволяет селективно возбуждать моды SH1, slow или SH2, slow, подавляя паразитные быстрые сдвиговые моды без снижения коэффициента электромеханической связи k²eff.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Изменение кристаллографической ориентации одного из слоев меняет знак пьезоэлектрических коэффициентов, сохраняя упругие свойства. Это обеспечивает конструктивную интерференцию электромеханической связи по всей толщине стека. В зависимости от угла соединения и толщины слоев, такая архитектура позволяет эффективно возбуждать моду SH2, slow, подавляя нежелательные быстрые моды, что подтверждается данными на Рис. 1e.&lt;/p&gt;\n&lt;h4 id=\"ugol-skruchivaniya-dlya-vybora-mody\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#ugol-skruchivaniya-dlya-vybora-mody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Угол скручивания для выбора моды&lt;/span&gt;&lt;/a&gt;Угол скручивания для выбора моды&lt;/h4&gt;\n&lt;p&gt;Помимо толщины слоев, критическим параметром проектирования является угол соединения θ между двумя слоями LiNbO₃. Этот угол определяет кристаллографическую ориентацию слоев, что напрямую влияет на пьезоэлектрические коэффициенты. Ориентация слоев X-cut и -X-cut задается углами поворота в плоскости &lt;span class=\"yfm-latex\" data-content=\"%5Cphi_1\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; и &lt;span class=\"yfm-latex\" data-content=\"%5Cphi_2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (Рис. 2a). Коэффициент e₃₄ достигает максимума при &lt;span class=\"yfm-latex\" data-content=\"%5Cphi%20%5Capprox%2033%5E%5Ccirc\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, где слои X-cut и -X-cut имеют равные по модулю, но противоположные по знаку коэффициенты (Рис. 2b). Угол соединения определяется как $ heta = 360^\\circ - (\\phi_1 + \\phi_2)$ (Рис. 2c).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre-f2.jpg\" alt=\"Рис. 2. Концепция и поведение селективности мод двухслойного резонатора. a Схематическое представление кристаллографичес\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 2. Концепция и поведение селективности мод двухслойного резонатора. a Схематическое представление кристаллографических ориентаций отдельных слоев X-среза и -X-среза LiNbO3, определяемых углами поворота в плоскости φ1 и φ2 соответственно. b Эволюция…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. 2. Концепция и поведение селективности мод двухслойного резонатора. a Схематическое представление кристаллографических ориентаций отдельных слоев X-среза и -X-среза LiNbO3, определяемых углами поворота в плоскости φ1 и φ2 соответственно. b Эволюция пьезоэлектрического коэффициента e34 для X-среза и -X-среза LiNbO3 в зависимости от индивидуального угла поворота в плоскости φ. При φ ≈ 33° обе ориентации демонстрируют коэффициенты равной величины и противоположного знака. c Определение угла соединения θ как направленного угла между осями Y'cr нижнего слоя X-среза и верхнего слоя -X-среза LiNbO3, где θ = 360 – (φ1 + φ2). d Моделируемая адмитансная характеристика для выбранных конфигураций соединения: (i) θ = 0°, что соответствует выровненным осям Y, приводящим к более слабому возбуждению обеих мод; (ii) θ = 114°, максимизирующее связь медленной моды SH1 при подавлении медленной моды SH2; (iii) θ = 294° (эквивалентно -66°), приводящее к полному подавлению медленной моды SH1 и максимизации связи медленной моды SH2; (iv) θ = 66°, иллюстрирующее важность направления скручивания для селективного возбуждения только медленной моды SH2. Случаи (ii) и (iii) сопровождаются одним типичным компонентом внутриплоскостного смещения и одним компонентом сдвигового напряжения, которых достаточно для идентификации форм медленных мод SH1 и SH2 в зависимости от угла соединения. Быстрые сдвиговые моды подавлены для всех комбинаций скручивания. e Типичные компоненты внутриплоскостного смещения и сдвигового напряжения медленных мод SH1 и SH2 по толщине резонатора, иллюстрирующие их соответствующие симметрии мод. f Моделируемый коэффициент электромеханической связи k2eff медленных мод SH1 и SH2 в зависимости от угла соединения θ между двумя слоями LiNbO3. Все моделирования были выполнены с использованием симметричных толщин слоев ниобата лития 250 нм и толщин алюминиевых электродов 75 нм.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оптимальный угол θ = 294^° обеспечивает подавление моды SH₁ и максимизацию связи для моды SH₂ с keff² = 37%.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ четырех конфигураций (Рис. 2d) показывает: при θ = 0^° связь обеих мод ослаблена. При θ = 114^° возбуждается только медленная мода SH₁. При θ = 294^° (эквивалентно -66^°) достигается оптимальное состояние: коэффициенты e₃₄ имеют противоположные знаки, что создает конструктивную интерференцию для моды SH₂ и деструктивную для SH₁. Это позволяет получить резонанс на частоте 5,9 ГГц с keff² = 37%. При θ = 66^° эффективность связи падает, что подчеркивает важность направления соединения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Электромеханическая связь зависит от перекрытия поля напряжений и электрически индуцированной деформации. Противоположные знаки пьезокоэффициентов позволяют «выключать» нежелательные моды через деструктивную интерференцию.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Зависимость keff² от угла θ (Рис. 2f) показывает сдвиг фаз на 180^° между модами SH₁ и SH₂. Максимальная связь для SH₁ составляет 43%, для SH₂ — 37,2%. Двухслойная структура превосходит однослойный резонатор (34%) на 10% по эффективности связи. Быстрые сдвиговые моды подавляются независимо от угла θ, что объясняется ортогональностью условий возбуждения, а не отсутствием механических мод. Аналитическая модель, учитывающая непрерывность напряжений и смещений на границе раздела, подтверждает, что подавление происходит из-за нулевой связи с быстрыми модами.&lt;/p&gt;\n&lt;h4 id=\"harakteristika-ustrojstva\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#harakteristika-ustrojstva\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Характеристика устройства&lt;/span&gt;&lt;/a&gt;Характеристика устройства&lt;/h4&gt;\n&lt;p&gt;Двухслойные резонаторы изготавливаются на подложке LiNbO3 (ниобат лития) X-среза/-X-среза на кремнии. Процесс основан на технологии YBAR. На Рис. 3a представлен оптический микрограф устройства с подвесной мембраной LiNbO3 и плавающим электродом. Контроль толщины слоев после подгонки осуществлялся методом сканирующей электронной микроскопии (СЭМ) (Рис. 3b), показавшим значения 220 нм для нижнего и 250 нм для верхнего слоев. Глубина канавки составляет 300 нм.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre-f3.jpg\" alt=\"Рис. 3. Микрофотографии изготовленных двухслойных резонаторов, измеренная адмитансная характеристика и влияние симметрии\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 3. Микрофотографии изготовленных двухслойных резонаторов, измеренная адмитансная характеристика и влияние симметрии толщины двухслойной структуры. a Оптическая микрофотография изготовленного двухслойного устройства, выделяющая область подвесной мембраны…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. 3. Микрофотографии изготовленных двухслойных резонаторов, измеренная адмитансная характеристика и влияние симметрии толщины двухслойной структуры. a Оптическая микрофотография изготовленного двухслойного устройства, выделяющая область подвесной мембраны и тыльный плавающий электрод. b SEM-изображение поперечного сечения двухслойного стека, показывающее индивидуальные толщины LiNbO3 поверх кремниевой подложки. c Измеренные и моделируемые адмитансные характеристики изготовленного двухслойного резонатора. Доминирующий резонанс медленной моды SH2 измерен на частоте 6,04 ГГц с электромеханической связью 34,6%. Остаточная медленная мода SH1 наблюдается на частоте 4,16 ГГц с уменьшенной связью 0,9%, что согласуется с асимметрией толщин слоев. Моделируемая характеристика учитывает резистивные потери и согласуется с измеренной характеристикой. d Измеренные адмитансные характеристики двухслойных резонаторов, состоящих из нижнего слоя X-среза LiNbO3 толщиной около 220 нм в сочетании с верхними слоями -X-среза толщиной 350 нм, 290 нм и 250 нм. Постепенная подстройка верхнего слоя уменьшает возбуждение медленной моды SH1, одновременно усиливая связь медленной моды SH2. Моделируемая эволюция резонансных частот (e) и k2eff (f) обеих мод в зависимости от отношения толщин tLN,top/tLN,bot с представленными измеренными характеристиками. Измеренные характеристики показывают хорошее согласие с моделированием.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод СЭМ позволяет визуализировать структуру материала в нанометровом масштабе, что критично для проверки точности изготовления тонкопленочных мембран.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Измеренная адмиттансная характеристика резонатора BAW (объемные акустические волны) сравнивалась с моделированием, учитывающим последовательное сопротивление 2,6 Ом. Основной резонанс SH2 (медленная мода) зафиксирован на частоте 6,04 ГГц с коэффициентом электромеханической связи k²eff = 34,6%. Отношение импеданса превышает 2 декады, добротность Q_r = 65, Qar = 80, Bode Q ≈ 100. Остаточная мода SH1 наблюдается на 4,16 ГГц с k²eff ≈ 0,9%, что объясняется незначительной асимметрией толщин слоев.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эксперимент подтвердил концепцию симметричного двухслойного резонатора: при достижении баланса толщин селективно возбуждается мода SH2 с высокой эффективностью связи 34,6%.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Влияние отношения толщин tLN,top/tLN,bot исследовалось при фиксированной толщине нижнего слоя 220 нм и варьируемых толщинах верхнего слоя (350, 290 и 250 нм). При уменьшении асимметрии связь моды SH1 снижается с 8,13% до 0,9%, а SH2 — возрастает с 32,2% до 34,6%. Частоты резонанса растут при уменьшении общей толщины стека. Bode Q при этом снижается со 170 до 70. Результаты измерений (Рис. 3d, 3e, 3f) демонстрируют высокую сходимость с теоретическими моделями, подтверждая, что максимальная эффективность связи SH2 достигается при соотношении толщин, близком к единице.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Снижение добротности при утонении верхнего слоя обусловлено акустическими потерями в электродах и повреждениями поверхности, возникшими в процессе обработки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"rezultaty-filtracii\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#rezultaty-filtracii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты фильтрации&lt;/span&gt;&lt;/a&gt;Результаты фильтрации&lt;/h4&gt;\n&lt;p&gt;Для проверки применимости двухслойной платформы в радиочастотной фильтрации были созданы прототипы лестничных фильтров на основе резонаторов из LiNbO3. Целевой диапазон — Wi-Fi 6E (6 ГГц), где высокая связь и отсутствие паразитных мод в режиме SH2 позволяют достичь относительной полосы пропускания (FBW) более 20%. Изначально для последовательных и параллельных резонаторов планировались комбинации толщин X-cut / -X-cut слоев 250/185 нм и 250/335 нм соответственно. Однако в процессе производства возникли отклонения: анализ поперечных срезов показал, что нижний слой X-cut составил около 220 нм, а итоговые комбинации — 220/215 нм и 220/365 нм. Для компенсации дисбаланса мод на тыльную сторону нанесли слой Al толщиной 30 нм, что улучшило баланс, но привело к росту массовой нагрузки, снижению центральной частоты и небольшому падению коэффициента электромеханической связи.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Двухслойная платформа подтвердила работоспособность: фильтр 5-го порядка показал FBW 18,6% на частоте 5,8 ГГц, что близко к расчетным 18,2% на 6,1 ГГц.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;На Рис. 4a представлен микроснимок фильтра 5-го порядка. Синтезированная характеристика (Рис. 4b), учитывающая измеренное последовательное сопротивление 1,9 Ом, предсказывает центральную частоту 6,1 ГГц при FBW 18,2%. Экспериментальные данные (Рис. 4c) демонстрируют FBW 18,6% на частоте 5,8 ГГц. Увеличение полосы связано со сдвигом центральной частоты вниз, что ослабило влияние левого нуля передачи. Измеренные вносимые потери составили 4,9 дБ, что обусловлено умеренными значениями добротности (Q). Несмотря на технологические отклонения, работа впервые демонстрирует лестничный фильтр на основе вертикально возбуждаемых P3F LiNbO3 резонаторов сдвига по толщине.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre-f4.jpg\" alt=\"Рис. 4. Реализация фильтра с использованием двухслойных резонаторов. a Оптическая микрофотография изготовленного лестнич\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 4. Реализация фильтра с использованием двухслойных резонаторов. a Оптическая микрофотография изготовленного лестничного фильтра 5-го порядка.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. 4. Реализация фильтра с использованием двухслойных резонаторов. a Оптическая микрофотография изготовленного лестничного фильтра 5-го порядка. Верхний слой LiNbO3 был селективно подстроен для последовательных резонаторов для достижения требуемого частотного разделения. b Синтезированная характеристика лестничного фильтра 5-го порядка с использованием моделируемых двухслойных резонаторов с комбинациями толщин X-среза/-X-среза LiNbO3 220 нм/215 нм и 220 нм/365 нм, полученными путем экспериментального измерения толщин слоев. c Измеренная характеристика лестничного фильтра 5-го порядка, показывающая 18,6% относительной полосы пропускания (FBW) с центром около 5,8 ГГц. К измеренным результатам не применялось исключение влияния измерительной оснастки (de-embedding).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Лестничный фильтр (ladder-type filter) — это схема из последовательно и параллельно соединенных резонаторов, где чередование их резонансных частот формирует полосу пропускания сигнала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;h4 id=\"inzhenernoe-proektirovanie-simmetrii-p3f\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#inzhenernoe-proektirovanie-simmetrii-p3f\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Инженерное проектирование симметрии P3F&lt;/span&gt;&lt;/a&gt;Инженерное проектирование симметрии P3F&lt;/h4&gt;\n&lt;p&gt;Данная работа доказывает, что использование симметрии в структуре P3F (пьезоэлектрических пленок, ориентированных по принципу «полюс к полюсу») открывает новые возможности для проектирования объемных акустических резонаторов сдвига по толщине. В отличие от традиционных подходов, где основными параметрами являются выбор материала, ориентация кристалла и геометрия электродов, предложенный метод использует угол соединения между двумя слоями пьезоэлектрика как дополнительный рычаг управления возбуждением акустических мод. Это позволяет избирательно усиливать или подавлять медленные моды сдвига, расширяя границы проектирования по сравнению с однослойными резонаторами.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование двухслойной архитектуры с углом соединения позволяет достичь коэффициента электромеханической связи около 35% на частоте 6 ГГц, что превосходит показатели стандартных однослойных решений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Традиционные резонаторы на X-срезе LiNbO3 (YBAR/FBAR) возбуждают одновременно моды SH1,slow и SH1,fast, что затрудняет их использование в фильтрах. Хотя срезы Y и YX 163° обеспечивают более чистый спектр, их коэффициент связи на частоте 6 ГГц ограничен 26% (см. Рис. S1). Предложенная двухслойная архитектура сочетает высокую связь X-среза LiNbO3 с селективным возбуждением моды SH2,slow. Использование моды высшего порядка позволяет работать на высоких частотах без экстремального утоньшения пластин, что повышает механическую прочность и допустимую мощность.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Коэффициент электромеханической связи — это мера эффективности преобразования электрической энергии в механическую (и наоборот), определяющая ширину полосы пропускания фильтра.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"prakticheskaya-realizaciya-i-ogranicheniya\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#prakticheskaya-realizaciya-i-ogranicheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Практическая реализация и ограничения&lt;/span&gt;&lt;/a&gt;Практическая реализация и ограничения&lt;/h4&gt;\n&lt;p&gt;Экспериментальные лестничные фильтры подтвердили возможность получения широкой полосы пропускания (FBW), однако выявили высокую чувствительность к асимметрии стека. Остаточный отклик моды SH1,slow вызван нанометровыми отклонениями в толщине слоев, что подчеркивает критическую важность вертикальной симметрии. Снижение добротности при увеличении глубины подстройки частоты указывает на рост акустических потерь из-за повреждения поверхности или взаимодействия поля с электродами.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;На частоте 6 ГГц требования к точности изготовления возрастают, так как даже минимальные отклонения в толщине слоев нарушают симметрию и приводят к появлению паразитных мод.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Дальнейшее развитие технологии будет направлено на повышение точности контроля толщины слоев и оптимизацию геометрии электродов. Двухслойные резонаторы на X-срезе LiNbO3 представляют собой перспективную платформу для широкополосной фильтрации следующего поколения, а концепция управления симметрией может быть адаптирована для других срезов LiNbO3 и мод высшего порядка.&lt;/p&gt;\n&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;h4 id=\"materialy\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#materialy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Материалы&lt;/span&gt;&lt;/a&gt;Материалы&lt;/h4&gt;\n&lt;p&gt;Устройства изготавливались на двухслойных подложках из ниобата лития (LiNbO3), предоставленных компанией NGK Insulators. Структура включает слой X-среза толщиной 250 нм и слой -66°-X-среза толщиной 350 нм, соединенные с высокоомной кремниевой подложкой. Суммарная толщина пьезоэлектрического слоя по пластине варьировалась от 570 до 630 нм. На лицевой стороне были нанесены платиновые метки совмещения. Кремниевая подложка была утонена до 250 мкм, после чего на обратную сторону также нанесли платиновые метки перед резкой на отдельные чипы.&lt;/p&gt;\n&lt;h4 id=\"izgotovlenie-ustrojstv\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#izgotovlenie-ustrojstv\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Изготовление устройств&lt;/span&gt;&lt;/a&gt;Изготовление устройств&lt;/h4&gt;\n&lt;p&gt;Процесс основан на технологии однослойных YBAR-резонаторов с дополнительными этапами локального утонения верхнего слоя LiNbO3 и травления канавок. Асимметричный стек выбран для настройки резонансной частоты согласно конечно-элементному моделированию. Лицевая сторона: верхний слой LiNbO3 утонялся методом ионно-лучевого травления (IBE, Veeco Nexus IBE350) для снижения повреждений поверхности. Металлизация Cr/Al (5/75 нм) наносилась электронно-лучевым испарением (Bühler Alzenau LTE 700). Электроды формировались с помощью электронно-лучевой литографии (Raith EBPG5000+) с использованием резиста ZEP520A, после чего проводилось ионное травление металла и LiNbO3 на глубину 300 нм. Контактные площадки из алюминия толщиной 500 нм наносились методом взрывной литографии (lift-off) с использованием лазерной записи (Heidelberg MLA 150). Обратная сторона: после защиты лицевой стороны фоторезистом (5 мкм) и временного крепления на носитель воском QS135, проводилась фотолитография (резист Merck AZ10XT, 6 мкм) с лазерной записью и инфракрасным выравниванием. Кремний стравливался методом глубокого реактивного ионного травления (DRIE, Alcatel AMS 200 SE) по Бош-процессу для создания подвешенной мембраны. На обратную сторону наносился плавающий электрод Cr/Al (5/75 нм). Устройства высвобождались путем удаления резиста в нагретом растворителе Remover 1165 и промывки в изопропаноле (Рис. 3a).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Взрывная литография (lift-off) — метод формирования рисунка, при котором металл напыляется поверх слоя резиста, а затем лишний металл удаляется вместе с растворением самого резиста.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"elektricheskaya-harakterizaciya\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#elektricheskaya-harakterizaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Электрическая характеризация&lt;/span&gt;&lt;/a&gt;Электрическая характеризация&lt;/h4&gt;\n&lt;p&gt;Электрические параметры измерялись в воздушной среде с использованием GSG-зондов и векторного анализатора цепей (VNA) R&amp;amp;S®ZNB20 при мощности -15 дБм. Де-эмбеддинг не применялся. Параметры резонаторов извлекались путем аппроксимации адмитанса с помощью модифицированной модели Баттерворта-Ван Дайка (mBVD). Для фильтров использовалась двухпортовая конфигурация с измерением S21 и S11. Эффективный коэффициент электромеханической связи вычислялся по формуле &lt;span class=\"yfm-latex\" data-content=\"k_%7Beff%7D%5E2%20%3D%20%5Cfrac%7Bf_a%5E2%20-%20f_r%5E2%7D%7Bf_a%5E2%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, где f_r и f_a — частоты резонанса и антирезонанса.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre-fS2.jpg\" alt=\"Рис. S2 Анализ одномерного волнового уравнения для однослойных и двухслойных LiNbO₃ FBAR-резонаторов сдвига по толщине. \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S2 Анализ одномерного волнового уравнения для однослойных и двухслойных LiNbO₃ FBAR-резонаторов сдвига по толщине. a Аналитическая модель однослойной пластины X-среза LiNbO3 толщиной 300 нм со свободными от напряжений границами. b Аналитическая модель…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. S2 Анализ одномерного волнового уравнения для однослойных и двухслойных LiNbO₃ FBAR-резонаторов сдвига по толщине. a Аналитическая модель однослойной пластины X-среза LiNbO3 толщиной 300 нм со свободными от напряжений границами. b Аналитическая модель двухслойной структуры, состоящей из 300 нм X-среза LiNbO3 и 300 нм −X-среза LiNbO3, со свободными внешними границами и непрерывностью напряжений и смещений на границе раздела. c, d Сверху вниз: рассчитанная электрическая адмиттанса (сверху), обратное минимальное сингулярное число матрицы граничных условий, идентифицирующее механические резонансы (в центре), и нормализованная проекция, количественно определяющая электрическую возбудимость мод (снизу) для однослойной (c) и двухслойной (d) конфигураций соответственно.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre-fS3.jpg\" alt=\"Рис. S3 Аналитическая оценка возбудимости быстрых сдвиговых мод для различных ориентаций LiNbO3.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S3 Аналитическая оценка возбудимости быстрых сдвиговых мод для различных ориентаций LiNbO3.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. S3 Аналитическая оценка возбудимости быстрых сдвиговых мод для различных ориентаций LiNbO3. a, b Рассчитанная электрическая адмиттанса (сверху), обратное минимальное сингулярное число матрицы граничных условий (в центре) и нормализованная проекция электрической возбудимости (снизу) для резонаторов из LiNbO3 Y-среза (a) и YX 163° (b) толщиной 300 нм. В обоих случаях быстрая сдвиговая мода остается механически поддерживаемой, но электрически не возбудимой.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre-fS4.jpg\" alt=\"Рис. S4 Выраженность продольных и поперечных паразитных мод при вращении в плоскости. a Схематический вид сверху двухсло\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S4 Выраженность продольных и поперечных паразитных мод при вращении в плоскости. a Схематический вид сверху двухслойного FBAR резонатора сдвига по толщине с 2 плоскостями сечения, используемыми для 2D-моделирования: A-A выделяет продольные паразитные…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. S4 Выраженность продольных и поперечных паразитных мод при вращении в плоскости. a Схематический вид сверху двухслойного FBAR резонатора сдвига по толщине с 2 плоскостями сечения, используемыми для 2D-моделирования: A-A выделяет продольные паразитные моды, а B-B выделяет поперечные паразитные моды. b Моделируемые отклики адмиттансы, полученные с использованием сечений A-A и B-B, подчеркивающие слабые, но многочисленные продольные и поперечные паразитные моды. Кривые смещены для наглядности. c Иллюстрация метода количественной оценки паразитных мод. Аппроксимированный отклик основной моды вычитается из моделируемой адмиттансы для получения остаточного отклика, из которого извлекается выраженность внутриполосных паразитных мод. d Сумма извлеченной выраженности паразитных мод для продольного (A-A) и поперечного (B-B) направлений в зависимости от угла поворота резонатора в плоскости при фиксированном угле закручивания двухслойной структуры θ = 294°. График показывает угловую зависимость выраженности паразитных мод с фазовым сдвигом 180°, что означает, что минимизация продольных паразитных мод максимизирует поперечные, и наоборот.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre-fS5.jpg\" alt=\"Рис. S5 Влияние симметрии электродов на возбуждение сдвиговых мод в двухслойных объемных акустических резонаторах сдвига\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S5 Влияние симметрии электродов на возбуждение сдвиговых мод в двухслойных объемных акустических резонаторах сдвига по толщине. a Моделируемые резонансные частоты мод SH1,slow и SH2,slow в зависимости от отношения толщин LiNbO3 tLN,top/tLN,bot…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. S5 Влияние симметрии электродов на возбуждение сдвиговых мод в двухслойных объемных акустических резонаторах сдвига по толщине. a Моделируемые резонансные частоты мод SH1,slow и SH2,slow в зависимости от отношения толщин LiNbO3 tLN,top/tLN,bot, сравнивающие симметричную (75 нм/75 нм) и асимметричную (25 нм/75 нм) конфигурации электродов. b Соответствующие моделируемые коэффициенты электромеханической связи keff². Асимметрия электродов смещает отношение толщин, соответствующее максимальной связи SH2,slow и минимальной связи SH1,slow, и изменяет устойчивость модального отклика к дисбалансу толщины LiNbO3.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre-fS6.jpg\" alt=\"Рис. S6 Синтезированные и измеренные отклики лестничных фильтров 3-го и 5-го порядков на основе двухслойных LiNbO₃ FBAR-\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S6 Синтезированные и измеренные отклики лестничных фильтров 3-го и 5-го порядков на основе двухслойных LiNbO₃ FBAR-резонаторов сдвига по толщине. a Синтезированный отклик лестничного фильтра третьего порядка, полученный с помощью конечно-элементного…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. S6 Синтезированные и измеренные отклики лестничных фильтров 3-го и 5-го порядков на основе двухслойных LiNbO₃ FBAR-резонаторов сдвига по толщине. a Синтезированный отклик лестничного фильтра третьего порядка, полученный с помощью конечно-элементного моделирования и синтеза цепей на основе mBVD. b Измеренный отклик изготовленного лестничного фильтра третьего порядка. c Синтезированный отклик лестничного фильтра пятого порядка. d Измеренный отклик изготовленного лестничного фильтра пятого порядка. На врезках показаны полосы пропускания фильтров вместе с извлеченными вносимыми потерями, центральной частотой и относительной полосой пропускания.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ограничения ма&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сштабирования&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;фильтров&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;инженерия&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;симметрии двух&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;слоев LiNbO3&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;чистый отклик&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;и k2eff 35% на&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;6 ГГц&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;широкополосные&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;фильтры для 6G&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;и Wi-Fi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт не проходил рецензирование. Выводы предварительные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-02/bilayer-lithium-niobate-acoustic-resonators-for-spurious-fre.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;arXiv&lt;/td&gt;\n&lt;td&gt;composites&lt;/td&gt;\n&lt;td&gt;arxiv&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Florian Hartmann, Silvan Stettler, Luis Guillermo Villanueva&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a h
