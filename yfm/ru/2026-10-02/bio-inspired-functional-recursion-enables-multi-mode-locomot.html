        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"150\" cy=\"155\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"570\" cy=\"217\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · ROBOTICS   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Робот весом 140 мг: как&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;насекомые вдохновили&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;инженеров на создание&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;универсального механизма&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/bio-inspired-functional-recursion-enables-multi-mode-locomot-f1.jpg\" alt=\"Рис. 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Инженеры разработали 140-миллиграммового робота, способного передвигаться по воздуху, суше и воде. Вместо установки отдельных двигателей для каждой среды, авторы применили принцип функциональной рекурсии. H-образная рама из сплава с памятью формы меняет конфигурацию, выполняя разные задачи: от управления крыльями до изменения свойств лапок.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-02/bio-inspired-functional-recursion-enables-multi-mode-locomot.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Масса робота составляет всего 140 мг при длине 35 мм.&lt;/li&gt;\n&lt;li&gt;Применение SMA-мышц позволяет одной раме выполнять функции привода крыльев, ног и системы погружения.&lt;/li&gt;\n&lt;li&gt;Электросмачивание при 225 В обеспечивает активный переход с поверхности воды под воду.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-02/bio-inspired-functional-recursion-enables-multi-mode-locomot.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Основой конструкции служит H-образная рама, приводимая в действие искусственными мышцами на основе сплава с памятью формы (SMA) диаметром 48 мкм. Эти мышцы закреплены на расстоянии 160 мкм от нейтральной оси композитной подложки, что позволяет преобразовывать тепловое сокращение в изгибную деформацию. Для усиления передачи усилия использовано армирование натуральным шелком, обеспечивающее высокую прочность при минимальной массе.&lt;/p&gt;\n&lt;p&gt;Система использует киригами-структуры в лапках для управления смачиваемостью поверхности. При подаче напряжения 225 В происходит электросмачивание, которое разрушает поверхностное натяжение воды, позволяя роботу погружаться. В режиме плавания по поверхности робот развивает тягу за счет асимметричного взмаха крыльев, а при движении по суше использует анизотропное трение лапок, перемещаясь со скоростью 15,3 мм/с при частоте 8 Гц.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Демонстрация проводилась в режиме отдельных функциональных тестов, а не как единая автономная миссия с обратной связью.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-02/bio-inspired-functional-recursion-enables-multi-mode-locomot.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Насекомые эффективно перемещаются в различных средах, адаптируя механику своего тела и конечностей. В робототехнике масштаба насекомых воспроизведение такой гибкости при строгих ограничениях по массе остается сложной задачей. В данной работе представлен микроробот массой 140 мг, способный к взлету, управлению положением в воздухе, наземному ползанию, скольжению по поверхности воды и контролируемому погружению. Эти возможности продемонстрированы как отдельные функциональные тесты с разомкнутым контуром.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Робот массой 140 мг объединяет четыре типа локомоции, используя единую трансформируемую раму с приводами из сплава с памятью формы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В отличие от конструкций с множеством приводов, данный робот использует «структурный интеллект»: единый многофункциональный каркас, приводимый в действие искусственными мышцами из сплава с памятью формы (SMA). Трансформируемое тело меняет конфигурацию для выполнения различных задач: выступает в роли трансмиссии для асимметричного машущего полета, линейного осциллятора для ползания за счет анизотропного трения и деформируемого актуатора для настройки зазоров в опорах типа киригами.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Кинематика киригами — метод создания сложных 3D-структур из плоских листов путем точных прорезей и сгибов, что позволяет менять геометрию без лишних деталей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Регулировка опор позволяет реализовать активное электросмачивание: при подаче напряжения 225 В происходит разрыв поверхностного натяжения воды, что обеспечивает контролируемое погружение и увеличивает несущую способность до 1,7 от массы тела робота. Интеграция мягких приводов и структурной механики в одной платформе реализует принцип функциональной рекурсии, позволяя минимизировать массу при сохранении высокой функциональности.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Работа демонстрирует отдельные функциональные возможности в рамках испытаний, а не единую непрерывную автономную миссию.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Разработка роботов, способных перемещаться в воздушной, наземной и водной средах, является ключевой задачей, вдохновленной биологическими системами. Насекомые демонстрируют исключительную мультимодальность, используя единый опорно-двигательный аппарат для полета, ползания, плавания и прыжков. В данной работе предложена стратегия «функциональной рекурсии» — многократного переназначения одной и той же реконфигурируемой структуры для различных механических задач. В отличие от традиционных систем, где каждый модуль автономен, здесь H-образная рама, приводимая в действие мышцами из сплава с памятью формы (SMA), выступает центральным активным элементом. Она модулирует кинематику крыльев для управления полетом, генерирует походку для наземного передвижения и управляет смачиваемостью киригами-опор для перехода «вода-воздух».&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование единой морфирующей рамы с SMA-приводами позволяет преодолеть ограничения по массе и конфликтующие требования к плавучести и погружению.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Функциональная рекурсия — это инженерный подход, при котором одна физическая деталь выполняет несколько разных функций в зависимости от режима работы, что критически важно для миниатюрных роботов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Разработанный четырехкрылый робот имеет длину 35 мм и массу 140 мг (без учета внешней электроники и питания). Основу составляет H-образная рама, соединенная с приводами крыльев. Робот успешно продемонстрировал взлет, наземное ползание со скоростью 15,3 мм/с (при частоте 8 Гц), скольжение по поверхности воды и контролируемое погружение. Управление осуществляется в разомкнутом контуре: деформация рамы через SMA-мышцы меняет кинематику крыльев для коррекции курса (рыскание, тангаж, крен) и настраивает зазоры в киригами-опорах. Для погружения используется комбинация механической деформации и электросмачивания, снижающая поверхностное натяжение. В процессе погружения взмахи крыльев применяются для стабилизации положения тела.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование сфокусировано на демонстрации отдельных режимов в разомкнутом контуре; полноценная автономная миссия с обратной связью остается задачей для будущих разработок.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для создания роботов с мультимодальной локомоцией необходима компактная архитектура, объединяющая привод и несущую структуру. Авторы разработали искусственную мышцу на основе сплава с памятью формы (SMA), армированную шелком, для активной реконфигурации H-образной рамы. Это решение позволяет использовать один и тот же корпус для управления кинематикой крыльев, ползания и перехода через границы сред, избегая установки отдельных приводов для каждого режима.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование шелкового армирования позволило снизить массу конструкции на 408% по сравнению с PDMS-инкапсуляцией и увеличить изгибную деформацию на 325%.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Искусственная мышца состоит из подложки на основе эластомера, армированного углеволокном, слоев электроизоляции из стекловолокна и проволок SMA (диаметр 48 мкм), расположенных на 160 мкм выше нейтральной плоскости. Для усиления передачи деформации используется натуральный шелк, обладающий анизотропным модулем упругости 8,5 ГПа. При сокращении SMA проволока смещается, натягивая шелковый слой, что преобразует сокращение в изгиб (Рис. 3a, b).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/bio-inspired-functional-recursion-enables-multi-mode-locomot-f3.jpg\" alt=\"Рис. 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 3&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод фотолитографии позволяет точно позиционировать SMA-проволоки относительно волокон композита, обеспечивая предсказуемую деформацию.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Дифференциальная сканирующая калориметрия определила температуры фазовых переходов SMA: мартенситный (Mp) — 67 °C, аустенитный (Ap) — 88 °C. В ходе испытаний (n=5) средний угол изгиба составил 45° ± 3° при смещении наконечника 2,1 ± 0,2 мм. Насыщение характеристик происходит при мощности 70 мВт. Испытания на циклическую долговечность показали, что до 6000 циклов при 16 Гц смещение остается стабильным (1,55 ± 0,3 мм), однако после 10⁴ циклов наблюдается деградация структуры.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;При мощности 83 мВт достигается максимальное блокирующее усилие, но возникает риск разрушения конструкции в зоне зажима из-за концентрации напряжений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Частотные характеристики ограничены временем теплового цикла (нагрев/охлаждение). При 70 мВт активация занимает около 0,17 с, а охлаждение — 0,23 с. При увеличении частоты (от 1 до 16 Гц) из-за неполного охлаждения накапливается остаточное тепло, что приводит к смещению начальной позиции (displacement offset). Для компенсации этого эффекта оптимальный рабочий цикл (duty cycle) ШИМ-сигнала увеличивается с 7% при 1 Гц до 19% при 16 Гц.&lt;/p&gt;\n&lt;p&gt;Разработка полноценного роботизированного грудного отдела насекомых осложнена необходимостью интеграции множества функций в легкую конструкцию без нагромождения отдельных приводов. Вдохновленные биологическим прототипом пчел, где одни и те же мышцы отвечают за деформацию грудной клетки и управление крыльями, мы создали H-образную раму с искусственными мышцами. Эта конструкция выполняет роль несущего каркаса, регулирует кинематику крыла и адаптируется для наземного передвижения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;H-образная рама с искусственными мышцами обеспечивает многофункциональность, позволяя регулировать кинематику крыла и достигать тяговооруженности 1,2.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В качестве приводов выбраны электромагнитные актуаторы, обеспечивающие низкое рабочее напряжение и компактность, что критично для ограниченного объема грудного отдела. Миниатюризированные актуаторы соответствуют размерам груди насекомого. Согласно Рис. 4a, H-рама интегрирована с двумя системами передачи. Катушки актуаторов, закрепленные на трансмиссии (Рис. 4b), приводят крылья в движение через плоские четырехзвенные механизмы, преобразующие осевое смещение во вращательный взмах (см. Рис. S5).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/bio-inspired-functional-recursion-enables-multi-mode-locomot-f4.jpg\" alt=\"Рис. 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 4&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Четырехзвенный механизм — это кинематическая цепь из четырех стержней, преобразующая один тип движения (например, линейное) в другой (вращательное).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Искусственные мышцы, прикрепленные к точкам механизма, меняют геометрию трансмиссии, создавая асимметричное махание для управления ориентацией. Пассивное скручивание крыла (Рис. 4c) позволяет генерировать подъемную силу, составляющую 120% от веса тела, согласно аэродинамической модели. Летные испытания в разомкнутом контуре (Рис. 4d, Рис. S6, видео S4) подтвердили достижение отношения тяги к весу 1,2.&lt;/p&gt;\n&lt;p&gt;Математические модели подтверждают, что деформация искусственных мышц напрямую определяет кинематику взмахов крыльев. При синусоидальном питании линейное движение актуатора преобразуется в маховые движения. Каждая мышца независимо регулирует амплитуду взмаха левого или правого крыла. Учитывая малую кривизну траекторий наконечников мышц (дуга &amp;lt; 5°), смещение аппроксимируется как линейный управляющий сигнал. Согласно уравнению 48, входные сигналы управления δ_c = ± 300  мкм определяют модуляцию амплитуды взмаха. Нейтральное положение обеспечивает симметрию, тогда как направленные сигналы создают асимметрию, генерируя дифференциальную подъемную силу и крутящий момент (Рис. 4f).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Управляющее воздействие ± 300  мкм позволяет точно модулировать амплитуду взмаха крыльев, создавая необходимые моменты для маневрирования.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Робот использует деформируемую H-образную раму для управления полетом в разомкнутом контуре. Электромагнитные катушки обеспечивают высокую частоту взмахов (93 Гц), а деформация рамы задает геометрический сдвиг трансмиссии (Рис. 4a, b). Тангаж регулируется изменением амплитуды передних и задних крыльев, крен — асимметрией амплитуд левого и правого крыльев, а рыскание — разницей скоростей взмаха и лобового сопротивления (Рис. 4g–i).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Разомкнутый контур управления означает, что система выполняет команды без обратной связи от датчиков положения в реальном времени.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;При деформации актуаторов с одной стороны возникает асимметрия подъемной силы, вызывающая вращение вокруг оси y (тангаж). Дифференциальная деформация двусторонних актуаторов создает момент крена вокруг оси x. Для рыскания используется реактивная сила при взмахах: диагональная деформация мышц создает асимметрию сопротивления воздуха, что приводит к возникновению чистого крутящего момента вокруг оси z (Рис. 4i). Анализ видеозаписей после взлета показал повторяемость результатов: достижение тангажа около 40° за 0,7 с, крена 50° за 0,6 с и рыскания 160° за 1,0 с (Рис. 4j–l).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Полоса пропускания системы ограничена по сравнению с пьезоэлектрическими актуаторами, поэтому работа сфокусирована на демонстрации возможности управления, а не на высокодинамичной стабилизации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Исследована возможность использования H-образной рамы, приводимой в действие искусственными мышцами, для наземного передвижения. В отличие от традиционных роботов с многозвенными ногами, здесь используется принцип функциональной рекурсии: та же структура, что управляет крыльями в полете, создает периодические колебания рамы. Как показано на Рис. 5a, к концам рамы прикреплены упрощенные опоры с когтеобразными наконечниками, обладающими анизотропным трением. При симметричной осцилляции рамы возникает направленное движение: сопротивление при скольжении в одну сторону выше, чем в другую. Две искусственные мышцы обеспечивают реципрокный изгиб, заставляя передние и задние опоры двигаться в противофазе. В процессе перехода между состояниями (Рис. 5b) одна пара опор остается неподвижной из-за высокого статического трения, в то время как другая проскальзывает. Управление направлением движения осуществляется путем модуляции амплитуды и частоты деформации мышц. Скорость передвижения определяется как Δ X = 2δ, где δ — эффективное смещение. Тестирование проводилось на бумажной поверхности с шероховатостью Ra = 7,5 µ m.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/bio-inspired-functional-recursion-enables-multi-mode-locomot-f5.jpg\" alt=\"Рис. 5. Наземное ползание за счет деформации H-образной рамы и асимметричного трения. a Механический принцип ползания, о\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 5. Наземное ползание за счет деформации H-образной рамы и асимметричного трения. a Механический принцип ползания, основанный на анизотропном трении стоп о поверхность.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. 5. Наземное ползание за счет деформации H-образной рамы и асимметричного трения. a Механический принцип ползания, основанный на анизотропном трении стоп о поверхность. Передние и задние стопы испытывают зависящие от направления силы трения в течение одного цикла приведения в действие, которые преобразуют возвратно-поступательную деформацию корпуса в чистое поступательное движение и обеспечивают управление. b Два крайних состояния деформации трансформируемой H-образной рамы в течение одного цикла ползания. Чередующийся изгиб, управляемый SMA, изменяет относительное положение ног и вызывает периодическое удлинение и сокращение корпуса. c Составные последовательности изображений прямолинейного ползания при характерных частотах движения. Робот движется вперед за счет повторяющегося переключения между Состоянием 1 и Состоянием 2. d Скорость ползания как функция частоты движения при однонаправленном и двунаправленном изгибе H-образной рамы. Робот достигает максимальной скорости ползания 0,46 ± 0,02 BL/с на гладкой бумаге при оптимальной частоте движения 8 Гц. На врезке показаны соответствующие состояния деформации H-образной рамы, используемые для двух режимов движения. e Кинематическая модель ползания с асимметричным трением. Модель описывает положение корпуса, ориентацию корпуса, положения ног и изменяющиеся во времени смещения ног в течение одного цикла приведения в действие. f Измеренные траектории, показывающие прямолинейное ползание, поворот налево и поворот направо, созданные различными входными данными асимметричной деформации. На врезке показаны характерные скорости ног и корпуса в течение одного цикла ползания. g Характерные траектории ползания на четырех поверхностях с разной шероховатостью: стекло (#1, Ra = 0,01 мкм), гладкая бумага (#2, Ra = 7,5 мкм), бальзовое дерево (#3, Ra ≈ 15,3 мкм) и EPP (#4, Ra &amp;gt; 500 мкм). h Скорость ползания на поверхностях с разной шероховатостью. Погрешности указывают максимальные и минимальные значения по результатам трех повторных испытаний. Робот достигает наибольшей скорости на гладкой бумаге, в то время как скорость снижается на стекле и бальзовом дереве и почти падает до нуля на EPP. Данные представлены как среднее значение с диапазоном мин–макс (n = 3). Масштабные отрезки (c, g): 10 мм.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование анизотропного трения и реципрокной деформации рамы позволяет роботу двигаться без сложных механизмов привода ног.&lt;br /&gt;\n[!tip] Анизотропное трение — это различие коэффициентов трения в зависимости от направления движения, что позволяет преобразовывать колебания в поступательный ход.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для передвижения по воде и перехода через границу сред «воздух-вода» H-образная рама была дополнена перестраиваемыми опорами типа «киригами». Опоры состоят из подложки PDMS (толщина 200 µ m), металлического электрода (2 µ m) и гидрофобного покрытия PTFE (15 µ m). Гидрофобность и деформируемые зазоры киригами создают мениск, удерживающий робота на поверхности (Рис. 6a). При работе крыльев в режиме, аналогичном полетному, наклон плоскости взмаха создает горизонтальную тягу, обеспечивая скольжение по воде. Управление углом рыскания позволяет менять режимы движения. При частоте 90 Hz (вторая гармоника) робот развивает скорость 3–6,3 mm/s (Рис. 6b). Динамические характеристики, измеренные с помощью высокоскоростной съемки, показали пиковое ускорение 4,3 mm/s² (0,12 BL/s²) и максимальную скорость 6,3 ± 0,4 mm/s (n = 3 попытки) через 950 ms (Рис. 6c).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Интеграция киригами-опор и электросмачивания позволяет роботу эффективно балансировать между плавучестью и управляемым погружением.&lt;br /&gt;\n[!warning] Эксперименты проводились в контролируемых лабораторных условиях; малая выборка (n=3) требует осторожности при экстраполяции результатов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В ходе экспериментальных исследований была проанализирована зависимость между приложенным напряжением (V) в диапазоне от 0 до 3 В и последующими изменениями скорости (мм/с) и ускорения (мм/с²). При подаче напряжения зафиксированы колебания скорости в пределах от –2 до 4 мм/с, при этом разность частот (Гц) варьировалась в диапазоне от 2 до 6 Гц. Данные показатели позволяют оценить динамический отклик системы при различных режимах нагрузки (Fload), достигающей значений до 250 мН.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Разность частот — это показатель, характеризующий отклонение колебательной системы от резонанса, что критически важно для понимания стабильности объекта в жидкости.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;При изучении процесса погружения объекта в водную среду (Water surface) были получены профили распределения по осям x (0–10 мм) и z (0–140 мм). Установлено, что при «погружении ногами вперед» (Feet-first settling) углы ориентации (Attitude) по тангажу (Pitch) и крену (Roll) претерпевают изменения в диапазоне от –100° до 80°. Параметр 2δ (мм), характеризующий ширину зоны возмущения, был зафиксирован в процессе взаимодействия объекта с границей раздела сред воздух-вода.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Установлено, что при подаче напряжения до 3 В система демонстрирует контролируемое изменение скорости до 4 мм/с, а при погружении угловые отклонения достигают 100° в зависимости от глубины z.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Робот перемещается по водной глади, используя киригами-опоры с регулируемым зазором (Рис. 6a, b). Скорость скольжения зависит от разности частот взмахов передних и задних крыльев: при базовой частоте 80 Гц максимальная скорость составляет 6,3 ± 0,4 мм/с (n = 3). Опора, выполненная по принципу киригами, обладает отрицательным коэффициентом Пуассона: при вертикальном растяжении она расширяется в стороны. Деформация 2δ (где δ — боковое смещение) позволяет увеличить несущую способность за счет поверхностного натяжения, обеспечивая дополнительную грузоподъемность 242 ± 32 мг, что в 1,7 раза превышает массу самого робота (Рис. 6e).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Механизм киригами увеличивает несущую способность на 170% от массы робота, позволяя эффективно управлять плавучестью.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В исходном состоянии зазоры в структуре минимальны, а гидрофобная поверхность с перекрывающимися менисками препятствует проникновению воды. При подаче напряжения на металлизированный диэлектрический слой происходит электросмачивание: контактный угол уменьшается, вода заполняет зазоры, и робот погружается (Рис. 6f–h). Математическая модель CCE подтверждает, что более 70% нагрузки удерживается силами поверхностного натяжения, а не выталкивающей силой Архимеда. При напряжении 243,6 В высота мениска h_w стремится к нулю, и опора теряет эффективность.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Электросмачивание — это изменение смачиваемости поверхности (переход от гидрофобного к гидрофильному состоянию) под действием электрического поля.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для погружения требуется преодолеть порог поверхностного натяжения. При деформации опоры 2δ = 1 мм достаточно 225 В, тогда как при 2δ = 2 мм требуется 300 В (Рис. 6j). В процессе свободного погружения робот склонен к опрокидыванию. Для стабилизации применяется асимметричное взмахивание крыльями: это позволяет корректировать углы тангажа и крена, обеспечивая приземление «ногами вниз» (Рис. 6k–m).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Стабилизация осуществляется по разомкнутому контуру (open-loop), что требует предварительной настройки параметров взмаха для компенсации пассивной нестабильности при погружении.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Разработка роботов массой менее 1 грамма сталкивается с противоречием: миниатюризация требует предельной эффективности по массе, тогда как многофункциональность обычно вынуждает добавлять специализированные приводы. В данной работе предложена стратегия функциональной рекурсии, реализованная в роботе массой 140 мг. Его основа — H-образная рама с интегрированными искусственными мышцами из сплава с памятью формы (SMA). Эта единая переконфигурируемая структура обеспечивает полет (управление положением через деформацию рамы), наземное передвижение (асимметричное трение при возвратно-поступательном движении), скольжение по воде и контролируемое погружение (через деформацию киригами-опор и электросмачивание).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Робот массой 140 мг объединяет четыре типа передвижения, используя одну деформируемую структуру вместо набора отдельных приводов, что радикально повышает функциональную плотность.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ключевой синергией является координация мышц и рамы, имитирующая работу крыльев насекомых. Деформация рамы создает моменты тангажа, крена и рыскания. Асимметричное трение преобразует колебания рамы в направленное движение, а электросмачивание в сочетании с киригами-опорами позволяет переключаться между поддержкой на поверхности и погружением. Эксперименты показали зависимость напряжения от состояния структуры: при деформации опор 2δ = 1 мм погружение инициировалось при определенном напряжении, а при 2δ = 2 мм — при 300 В. Это доказывает, что требуемое напряжение зависит от сил поддержки поверхности.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Функциональная рекурсия — это подход, при котором одна и та же физическая деталь выполняет несколько разных задач за счет изменения своей формы, что позволяет избежать «нагромождения» лишних механизмов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Текущая конструкция имеет ограничения: тепловая инерция SMA-мышц снижает частоту отклика, что делает невозможным высокодинамичную стабилизацию полета. Электромагнитный механизм подъема выбран ради компактности, но уступает пьезоэлектрическим аналогам по удельной тяге. Также работа проводилась в спокойных условиях, а последовательность «полет–посадка–ползание–погружение» пока не реализована автономно. Будущие исследования направлены на гибридные приводы с высокой полосой пропускания и интеграцию бортового питания.&lt;/p&gt;\n&lt;p&gt;Для анализа способности робота держаться на воде используется модель связанной капиллярности и электросмачивания (CCE). В статическом состоянии вес, выталкивающая сила и поверхностное натяжение уравновешены. Горизонтальные компоненты натяжения компенсируют друг друга из-за симметрии мениска. Вертикальная несущая способность Fload определяется как векторная сумма выталкивающей силы F_b и вертикальной составляющей натяжения S_y:&lt;/p&gt;\n&lt;p&gt;&lt;span class=\"yfm-latex\" data-content=\"F_%7Bload%7D%20%3D%20%5Crho%20g%20b%20(S_1%20%2B%202S_2)%20%3D%20%5Crho%20a%20b%20h_w%20g%20-%202%5Cgamma%20(a%20%2B%20b)%20%5Ccos%20%20heta\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;&lt;/p&gt;\n&lt;p&gt;где &lt;span class=\"yfm-latex\" data-content=\"S_1%20%2B%202S_2%20%3D%20%5Cint_0%5Eh%20x%20dz%20%3D%20a%20h_w%20%2B%202(k-1)%20%5Csin%20%5Calpha\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (уравнение 1), &lt;span class=\"yfm-latex\" data-content=\"S_y%20%3D%20-2%5Cgamma%20(a%20%2B%20b)%20%5Ccos%20%20heta\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (уравнение 4), а &lt;span class=\"yfm-latex\" data-content=\"F_b%20%3D%20%5Crho%20a%20b%20h_w%20g\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (уравнение 5). Глубина прогиба мениска h выводится из геометрии контакта.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель предполагает идеальную гидрофобную поверхность и спокойную воду; при наличии волнения расчеты требуют коррекции на динамические возмущения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Высота мениска h_w определяется формулой &lt;span class=\"yfm-latex\" data-content=\"h_w%20%3D%20k_1%20%5Csqrt%7B2(1%20-%20%5Ccos%20%5Calpha)%20%2F%20%5Crho%20g%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, где α = θ - π/2. Здесь θ — краевой угол (гидрофобность при 90^° &amp;lt; θ &amp;lt; 180^°, гидрофильность при 0^° &amp;lt; θ &amp;lt; 90^°), γ = 0.0728  Н/м — коэффициент поверхностного натяжения воды, &lt;span class=\"yfm-latex\" data-content=\"%5Crho\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — плотность воды, g — ускорение свободного падения. Параметры a и b задают размеры опорной площадки, обладающей эффектом отрицательного коэффициента Пуассона при деформации.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Поверхностное натяжение обеспечивает более 70% несущей способности робота, а киригами-механизм увеличивает статическую грузоподъемность в 1.7 раза, позволяя нести дополнительный груз 242 мг.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Эксперименты подтверждают, что на масштабах насекомых плавучесть робота обусловлена именно поверхностным натяжением. При активации искусственных мышц площадка расширяется, увеличивая длину линии контакта и проекционную площадь, что усиливает как натяжение, так и выталкивающую силу. Однако чрезмерное расширение вызывает деформацию и продольный изгиб, что ведет к разрыву мениска и падению несущей способности.&lt;/p&gt;\n&lt;p&gt;Для описания системы с изменяемыми зазорами используется модифицированная модель электросмачивания. При подаче напряжения V краевой угол θ изменяется согласно уравнению Юнга-Липпмана: &lt;span class=\"yfm-latex\" data-content=\"%5Ccos%20%20heta%20%3D%20%5Ccos%20%20heta_0%20%2B%20%5Cfrac%7B%5Cepsilon_0%20%5Cepsilon_r%7D%7B2%20%5Cgamma%20d_H%7D%20V%5E2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, где ε₀ — диэлектрическая проницаемость вакуума, ε_r — относительная проницаемость, d_H — толщина покрытия. В зазорах обратной трапециевидной формы возникает капиллярный эффект, зависящий от угла наклона стенок α_g. Капиллярное давление &lt;span class=\"yfm-latex\" data-content=\"%5CDelta%20P%20%3D%202%20%5Cgamma%20%5Ccos(%20heta%20-%20%5Calpha_g)%20%2F%20W_%7Beff%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, где Weff — эффективная ширина зазора. Условие равновесия высоты подъема жидкости h_g определяется как &lt;span class=\"yfm-latex\" data-content=\"h_g%20%3D%202%20%5Cgamma%20%5Ccos(%20heta%20-%20%5Calpha_g)%20%2F%20%5Crho%20g%20W_%7Beff%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Электросмачивание — это изменение смачиваемости поверхности (краевого угла) под воздействием электрического поля, что позволяет управлять капиллярным подъемом жидкости в микрозазорах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Вертикальная составляющая силы поверхностного натяжения &lt;span class=\"yfm-latex\" data-content=\"S_y%20%3D%20%5Cgamma%20L%20%5Ccos(%20heta%20-%20%5Calpha_g)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; и выталкивающая сила &lt;span class=\"yfm-latex\" data-content=\"F_b%20%3D%20%5Crho%20g%20a%20b%20(h_w%20-%20w%20L%20%2F%202%20h_g)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; определяют общую несущую способность &lt;span class=\"yfm-latex\" data-content=\"F_%7Bload%7D%20%3D%20F_b%20-%202%20%5Cgamma%20L%20%5Ccos(%20heta%20-%20%5Calpha_g)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, которая напрямую зависит от напряжения и геометрии зазора.&lt;/p&gt;\n&lt;p&gt;Для валидации модели CCE измерялась вертикальная сила поддержки при различных напряжениях и ширине зазоров. Робот закреплялся на одноосном датчике силы, измерения проводились квазистатическим методом сближения/отрыва со скоростью 0.1  мм/с. Для каждого состояния проводилось три повтора, результаты представлены как средние значения с указанием диапазона (Рис. 6i). Процесс погружения инициировался программно: сначала деформировался зазор, затем подавалось напряжение, снижающее силу поддержки до отрицательных значений.&lt;/p&gt;\n&lt;p&gt;Процесс создания структуры начинался с лазерной абляции паттерна киригами с использованием твердотельного лазера с диодной накачкой (DPSS). Регулировка фокусного расстояния позволила получить трапециевидное поперечное сечение элементов. Для обеспечения адгезии поверхность PDMS-основы активировали, наклонив образец под углом 45°. Затем методом атомно-слоевого осаждения (ALD) нанесли адгезионный слой Al₂O₃ толщиной 10 нм. Процесс проводился в несколько циклов при том же угле наклона 45°. На следующем этапе методом магнетронного распыления нанесли золотой (Au) электрод толщиной 150 нм, также при наклоне подложки. Контактные площадки сформировали путем нанесения токопроводящей серебряной пасты с помощью высокоточного дозатора. Финальным этапом стало нанесение конформного защитного покрытия из парилена-C толщиной 15 мкм.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Атомно-слоевое осаждение (ALD) — метод нанесения тонких пленок, при котором реагенты подаются поочередно, позволяя контролировать толщину слоя с точностью до ангстрема.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование лазерной абляции с контролем фокуса и наклонного осаждения слоев Al₂O₃ (10 нм) и Au (150 нм) обеспечивает создание высокоточных электродов на деформируемой подложке.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Данная работа базируется на обширном анализе биоинспирированных технологий, охватывающих широкий спектр механизмов передвижения насекомых и их роботизированных аналогов. Исследовательская база включает изучение гидродинамики водомерок, механизмов полета пчел и мух, а также принципов прыжков на поверхности воды. Особое внимание уделено переходу между средами: от полета к плаванию и передвижению по твердым поверхностям. В статье рассматриваются как жесткие конструкции, так и мягкие робототехнические системы, использующие эластомерные приводы и электростатическую адгезию для обеспечения маневренности.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование объединяет принципы биомиметики и робототехники, опираясь на 37 ключевых источников, описывающих переходные режимы движения микророботов в различных средах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Методология исследования опирается на синтез данных о микромасштабных роботах, чья масса варьируется в диапазоне от 88 мг до более крупных систем. В работе анализируются методы управления полетом, прыжками и плаванием, включая использование мягких искусственных мышц и электроадгезивных механизмов. Статистическая достоверность выводов обеспечивается сопоставлением экспериментальных данных с теоретическими моделями гидродинамики и аэродинамики, характерными для насекомых. Применяемые приборы включают высокоскоростные системы захвата движения и датчики для оценки сил взаимодействия с поверхностью.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Биоинспирация — это подход в инженерии, при котором конструктивные решения и принципы управления заимствуются из биологических систем для повышения эффективности роботов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Представленный перечень литературы охватывает передовые разработки в области микроробототехники, вдохновленной биологическими объектами, за период 2016–2026 годов. Основное внимание уделено созданию многофункциональных систем, способных к сложным типам перемещения: полету, ползанию, прыжкам и переходу между средами (воздух-вода, земля-воздух). Ключевые исследования включают использование мягких приводов для обеспечения устойчивости к столкновениям [44], применение глубокого обучения для управления механикой крыльев насекомых [41] и реализацию сложных маневров с помощью робастного прогнозного управления [50].&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Биомиметический робот — это устройство, конструкция и принципы движения которого имитируют биологические прототипы (насекомых, птиц), что позволяет достичь высокой энергоэффективности и маневренности в малых масштабах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Значительный прогресс наблюдается в интеграции структурных элементов с механизмами привода, например, через использование оригами-технологий [48]. Развитие систем с изменяемой геометрией позволяет роботам адаптироваться к экстремальным условиям, включая глубоководные среды [49]. Исследования также фокусируются на стратегии безопасной посадки [45] и оптимизации переходных режимов движения, таких как непрерывный цикл «ползание–прыжок–планирование» [46].&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/bio-inspired-functional-recursion-enables-multi-mode-locomot-f1.jpg\" alt=\"Рис. 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/bio-inspired-functional-recursion-enables-multi-mode-locomot-f2.jpg\" alt=\"Рис. 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 2&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-02/bio-inspired-functional-recursion-enables-multi-mode-locomot.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Ограничение&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;массы при муль&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тимодальности&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Функциональная&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;рекурсия через&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;SMA-раму&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Робот летает,&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ползает и&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ныряет&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Новый стандарт&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;миниатюрных&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;роботов&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Статья опубликована в рецензируемом журнале Microsystems &amp;amp; nanoengineering. Но и опубликованный результат — одно исследование, а не окончательный вывод.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-02/bio-inspired-functional-recursion-enables-multi-mode-locomot.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Microsystems &amp;amp; nanoengineering (Europe PMC)&lt;/td&gt;\n&lt;td&gt;robotics&lt;/td&gt;\n&lt;td&gt;CC BY-NC-ND 4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Wang Y, Wang Z, Wang Z, Wu Y, Lu S, Zhang W, Guan Y, Zhi P, Geng Z, Xu H, Zhang J, Fu Y.&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a href=\"2026-10-02/bio-inspired-functional-recursion-enables-multi-mode-locomot.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Ссылка&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Страница статьи&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://europepmc.org/article/PMC/PMC13590654\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;europepmc.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Полный текст (PDF)&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://www.nature.com/articles/s41378-026-01449-0.pdf\" target=\"_blank
