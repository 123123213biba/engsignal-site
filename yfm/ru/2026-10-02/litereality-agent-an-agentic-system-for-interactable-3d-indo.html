        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"84\" cy=\"117\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"676\" cy=\"166\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · DIGITAL_TWIN   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;LiteReality-Agent:&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;превращаем сканы помещений в&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;код для симуляций&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-f1.jpg\" alt=\"Рис. 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;LiteReality-Agent переосмысляет 3D-реконструкцию интерьеров, переводя её из области графики в область программирования. Система создает &lt;a href=\"concepts/room-py.html\"&gt;исполняемый файл Room.py&lt;/a&gt;, который описывает геометрию, артикуляцию объектов и физические свойства пространства. Такой подход позволяет легко редактировать сцену и использовать её в симуляторах робототехники.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Реконструкция сцены как исполняемый Python-код&lt;/li&gt;\n&lt;li&gt;Цикл верификации через измерение и рендеринг&lt;/li&gt;\n&lt;li&gt;Полная совместимость с физическими симуляторами&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Система работает в два этапа: инициализация сцены и агентское редактирование. На первом этапе данные RGB-D сканирования обрабатываются «агентом планировки», который выявляет коллизии и устанавливает связи между объектами. Вся сцена представляется в виде графа, где стены и предметы имеют четкие физические атрибуты.&lt;/p&gt;\n&lt;p&gt;Основной цикл «наблюдение-редактирование-верификация» (observe-edit-verify) позволяет ИИ-агенту итеративно уточнять Room.py. Агент использует специализированные инструменты для измерения метрик, сравнения рендеров и проверки поддержки объектов. В отличие от статических сеток, итоговый код обеспечивает высокую геометрическую точность и готовность к физическому моделированию в среде &lt;a href=\"concepts/mujoco.html\"&gt;MuJoCo&lt;/a&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Качество итоговой модели напрямую зависит от точности исходных RGB-D данных и возможностей используемой языковой модели.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;h4 id=\"related-work\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#related-work\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RELATED WORK&lt;/span&gt;&lt;/a&gt;RELATED WORK&lt;/h4&gt;\n&lt;p&gt;Indoor Reconstruction and Real-to-Sim. Методы воссоздания интерьеров по реальным данным делятся на объектно-ориентированные, которые сопоставляют и выравнивают готовые CAD-модели с облаками точек (Avetisyan et al., 2019; Kuo et al., 2020; Gao et al., 2024), и методы на базе нейросетевых представлений (NeRF, &lt;a href=\"concepts/3d-gaussian-splatting.html\"&gt;3DGS&lt;/a&gt;), восстанавливающие внешний вид и геометрию сцены (Mildenhall et al., 2020; Kerbl et al., 2023; Ni et al., 2025). Системы LiteReality (Huang et al., 2025b) и MetaScenes (Yu et al., 2025) преобразуют результаты сканирования в интерактивные среды на основе ассетов. Проекты Video2Game (Xia et al., 2024), DRAWER (Xia et al., 2025b) и HoloScene (Xia et al., 2025a) воссоздают трехмерные миры непосредственно по видео, причем DRAWER дополнительно определяет сочленения (артикуляцию) подвижных частей. FIRE3D (Xia et al., 2026a) предсказывает компонентные ассеты сцены с помощью нейросети прямого распространения. В области обучения роботов Phone2Proc (Deitke et al., 2023) генерирует процедурные среды по мобильным снимкам, RialTo (Torne et al., 2024) строит цифровые двойники для дообучения стратегий управления, а PolaRiS (Jain et al., 2026) воссоздает окружение для их оценки. В свою очередь, ACDC (Dai et al., 2025) создает «цифровых кузенов» (digital cousins), используя похожие, но не идентичные ассеты.&lt;/p&gt;\n&lt;p&gt;Object Generation and &lt;a href=\"concepts/articulation.html\"&gt;Articulation&lt;/a&gt;. Методы генерации 3D-объектов по изображениям варьируются от многоракурсного синтеза (Liu et al., 2023b; 2024; 2023a; Long et al., 2024) до крупных реконструкционных и генеративных моделей (Hong et al., 2024; Xu et al., 2024; Xiang et al., 2026; Hunyuan3D et al., 2025; Chen et al., 2026b). CAST (Yao et al., 2025) выравнивает сгенерированные объекты внутри сцены, а URDFormer (Chen et al., 2024) воссоздает симуляционные среды с сочлененными объектами по изображениям. Real2Code (Mandi et al., 2025) предсказывает параметры сочленений в виде исполняемого кода, а Articulate-Anything (Le et al., 2025) итеративно генерирует и корректирует программы артикуляции. Articraft (Zhou et al., 2026) объединяет программную генерацию ассетов со специализированным SDK и средой валидации.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;&lt;a href=\"concepts/artikulyatsiya-articulation-v-trehmernom-modelirovanii.html\"&gt;Артикуляция (articulation) в трехмерном моделировании&lt;/a&gt; — это описание подвижных соединений объекта (например, дверцы шкафа или выдвижного ящика), определяющее степени свободы, оси вращения и пределы движения для физической симуляции.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Language-Guided Scene Authoring. Системы LayoutGPT (Feng et al., 2023) и Holodeck (Yang et al., 2024) генерируют планировки комнат на основе текстовых описаний. FirePlace (Huang et al., 2025a) и LayoutVLM (Sun et al., 2025b) оптимизируют размещение мебели за счет геометрической или визуальной обратной связи. Использование языковых моделей для программного создания 3D-сцен реализовано в 3D-GPT (Sun et al., 2025a), SceneCraft (Hu et al., 2024) и LL3M (Lu et al., 2025). Платформа The Scene Language (Zhang et al., 2025) объединяет код, текст и эмбеддинги для описания структуры и внешнего вида сцены. Системы SceneSmith (Pfaff et al., 2026), SAGE (Xia et al., 2026b) и SceneWeaver (Yang et al., 2025) организуют работу многоагентных конвейеров генерации сцен. Наконец, Blender-Alchemy (Huang et al., 2024) исследует редактирование сцен под визуальным контролем, а BlenderGym (Gu et al., 2025) служит бенчмарком для программного редактирования графики.&lt;/p&gt;\n&lt;p&gt;Agentic Inverse Graphics. Подходы SceneScript (Avetisyan et al., 2024) и IG-LLM (Kulits et al., 2024) извлекают структурированные описания сцен из визуальных данных. VIGA (Yin et al., 2026) итеративно работает в цикле «код — рендеринг — анализ результатов», а Thinking in Blender (He et al., 2026) настраивает параметры сцены в исполняемом коде по одному изображению. HARMONY (Sun et al., 2026) сочетает агентное размещение объектов с геометрическим уточнением для монокулярной реконструкции. Agentic Real2Sim (Chen et al., 2026a) задействует мультимодальных агентов для сборки физических симуляций по видеозаписям взаимодействия с объектами. В блоге AHa-3D (Xu et al., 2026) описан близкий рабочий процесс воссоздания симуляции по видео с использованием инструментов калибровки камер, измерений и контроля качества. Наш LiteReality-Agent решает задачу метрической RGB-D реконструкции комнат, объединяя подвижные ассеты и постоянную программу сцены с калиброванной многоракурсной верификацией, а также явными проверками на пересечения и наличие опоры.&lt;/p&gt;\n&lt;h4 id=\"litereality-agent\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#litereality-agent\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;LITEREALITY-AGENT&lt;/span&gt;&lt;/a&gt;LITEREALITY-AGENT&lt;/h4&gt;\n&lt;p&gt;LiteReality-Agent выполняет реконструкцию помещения в два этапа: сначала на этапе инициализации сцены определяются общая планировка и основные объекты, а затем на этапе агентного проектирования (agentic authoring) исполняемая программа сцены итеративно дорабатывается в цикле «наблюдение — редактирование — верификация» (Рис. 2). Подробности реализации и вспомогательные примеры приведены в Приложении B.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-f2.jpg\" alt=\"Рис. 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;3.1 INPUT: RGB–D SCANS AND DETECTION RESULTS&lt;/p&gt;\n&lt;p&gt;Входными данными для системы служат результаты RGB-D сканирования и детектирования объектов, полученные из приложения LiteRealityScan, включая геометрию стен комнаты и трехмерные ограничивающие рамки (bounding boxes) объектов.&lt;/p&gt;\n&lt;p&gt;3.2 SCENE INITIALISATION&lt;/p&gt;\n&lt;p&gt;Вслед за LiteReality (Huang et al., 2025b), мы раздельно анализируем каркас помещения и реконструируем объекты перед их финальной сборкой. Однако вместо поиска готовых ассетов в базе данных мы генерируем их непосредственно по изображениям из скана.&lt;/p&gt;\n&lt;p&gt;Layout Agent. Планировка представляется в виде графа сцены, содержащего структурные элементы, объекты и связи между ними: физическую опору, примыкание к стенам, функциональные группы и потенциальные пересечения. Эти связи позволяют отличить непосредственную физическую опору от ассоциативной связи (например, стул функционально относится к столу, но опирается на пол). Они также помогают разграничить недопустимые пересечения объектов и естественные наложения их габаритных рамок (например, когда стул задвинут под стол). &lt;a href=\"concepts/layout-agent.html\"&gt;Агент планировки&lt;/a&gt; (Layout Agent) исправляет зашумленные результаты детектирования до начала реконструкции объектов. С помощью геометрических проверок выявляются объекты, оказавшиеся за пределами комнаты, утопленные в стены, висящие в воздухе или недопустимо пересекающиеся друг с другом. Детерминированные алгоритмы вносят небольшие корректировки в положение и размеры объектов. В неоднозначных случаях (например, при неверном размере рамки или слиянии нескольких объектов в один) агент использует визуальный анализ изображений. Предложенные изменения принимаются только в том случае, если они улучшают геометрическую согласованность сцены и не выходят за рамки накопленной погрешности относительно исходного скана. Скорректированные габаритные рамки служат основой как для генерации ассетов, так и для их финального размещения, что предотвращает повторное появление ошибок детектирования при сборке сцены.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Агент планировки устраняет геометрические аномалии детектирования (пересечения, висящие объекты) на основе графа сцены до генерации ассетов, гарантируя, что финальная сборка базируется на физически корректных габаритных рамках.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Object reconstruction. Для каждого объекта выбираются наиболее информативные ракурсы из скана, которые обрабатываются генеративной моделью изображений для создания очищенного референсного кадра. Структурированные или подвижные (артикулированные) объекты направляются на процедурную генерацию, в то время как визуально сложные и преимущественно статичные объекты реконструируются с помощью модели TRELLIS.2 (Xiang et al., 2026). Сгенерированные полигональные сетки (&lt;a href=\"concepts/meshi.html\"&gt;меши&lt;/a&gt;) проходят автоматическую проверку на наличие дефектов геометрии, изолированных фрагментов и ошибок топологии. Алгоритм 1 описывает итеративный цикл работы агента на втором этапе, где он редактирует файл Room.py на основе наблюдений с помощью инструментов из Таблицы 1.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Алгоритм 1: Цикл агентного проектирования на этапе 2. Агент итеративно редактирует Room.py на основе наблюдений, используя инструменты из Таблицы 1.\n1: env, tools ← Room.py, defined_tools\n2: observations ← SCAN()\n3: history, turn, qc_passed ← [ ], 0, FALSE\n4: while turn &amp;lt; T and not qc_passed do\n5:     actions ← LLM(observations, env, tools, history)\n6:     result ← EXECUTE(actions, env, observations)\n7:     append (actions, result) to history\n8:     if result изменил окружение then\n9:         qc_passed, feedback ← QC(env, observations)\n10:        append feedback to history\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"128\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-128\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-128\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-128.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-f1.jpg\" alt=\"Рис. 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-f3.jpg\" alt=\"Рис. 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-f4.jpg\" alt=\"Рис. 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 4&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-f6.jpg\" alt=\"Рис. 6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 6&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS1.jpg\" alt=\"Рис. S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS2.jpg\" alt=\"Рис. S2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS3.jpg\" alt=\"Рис. S3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS4.jpg\" alt=\"Рис. S4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S4&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS5.jpg\" alt=\"Рис. S5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S5&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS6.jpg\" alt=\"Рис. S6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S6&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS7.jpg\" alt=\"Рис. S7\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S7&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS8.jpg\" alt=\"Рис. S8\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S8&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS9.jpg\" alt=\"Рис. S9\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S9&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;
