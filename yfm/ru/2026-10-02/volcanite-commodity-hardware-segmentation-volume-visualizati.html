        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"276\" cy=\"116\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"584\" cy=\"168\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · CAD_PARAMETRIC   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Volcanite: как&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;визуализировать терабайты&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;данных без суперкомпьютеров&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-f1.jpg\" alt=\"Рис. 1: Визуальная аннотация. a Наше интерактивное приложение Volcanite позволяет визуально исследовать большие сегменти\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1: Визуальная аннотация. a Наше интерактивное приложение Volcanite позволяет визуально исследовать большие сегментированные объемы на обычном оборудовании, используя современное сжатие без потерь. b Наш конвейер рендеринга на базе графического процессора…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. 1: Визуальная аннотация. a Наше интерактивное приложение Volcanite позволяет визуально исследовать большие сегментированные объемы на обычном оборудовании, используя современное сжатие без потерь. b Наш конвейер рендеринга на базе графического процессора (GPU) с точностью до вокселя распаковывает видимые области объема в кэш для быстрого доступа. Этот конвейер обеспечивает интерактивное исследование различных конфигураций рендеринга вплоть до изучения отдельных вокселей (справа). c Рендеринг является интерактивным со скоростью в миллисекунды на отрисованный кадр. Первые кадры имеют более высокие нагрузки на распаковку, которые быстро исчезают. d С помощью Volcanite мы можем интерактивно исследовать секцию объема сегментации белого вещества коры головного мозга человека H01 размером 2,2 ТБ с трассировкой путей Full-HD со скоростью 66 кадров в секунду на обычном аппаратном обеспечении с значительно более быстрым временем до первого кадра по сравнению с другими методами. Создание неточных сеток для визуализации в Neuroglancer занимает более недели, в то время как наша предварительная обработка создает значительно меньшие кодировки без потерь менее чем за два часа на нашей системе. e Режимы затенения в Volcanite можно переключать с быстрого локального затенения на высококачественную трассировку путей с немедленной обратной связью.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Современная томография и коннектомика генерируют терабайты данных, которые сложно обрабатывать из-за их объема. Существующие методы полагаются на упрощенные сетки или распределенные системы, что скрывает детали. Volcanite предлагает прямой рендеринг вокселей с использованием Vulkan, обеспечивая высокую точность без предварительной подготовки.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Рендеринг до 500 млрд вокселей при 100 FPS на обычном ПК.&lt;/li&gt;\n&lt;li&gt;Прямая визуализация без трудоемкого создания 3D-сеток.&lt;/li&gt;\n&lt;li&gt;Поддержка глобального освещения и теней для точного анализа.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Система Volcanite использует формат CSGV (Fast Compressed Segmentation Volumes) для эффективного хранения данных, что позволяет считывать их со скоростью гигабайтов в секунду. Рендеринг осуществляется на GPU через Vulkan-бэкенд, где данные декомпрессируются в кэш видеопамяти по требованию. Это исключает необходимость в создании промежуточных 3D-сеток, которые часто сглаживают критически важные дефекты, такие как ошибки сшивки слоев в микроскопии.&lt;/p&gt;\n&lt;p&gt;В тестах на наборе данных H01 (секция коры головного мозга объемом 2,2 ТБ) система достигла частоты 66 кадров в секунду с использованием трассировки путей. В отличие от VTK, который ограничен 32 метками и страдает от артефактов при выборке, Volcanite поддерживает миллионы меток и глобальное освещение. Препроцессинг данных занимает менее двух часов, что в разы быстрее, чем создание сеток в Neuroglancer, требующее до недели вычислений.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Производительность зависит от скорости чтения данных с диска, а начальные кадры требуют времени на заполнение кэша декомпрессии.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Современные методы визуализации генерируют сегментированные объемы терабайтного масштаба, где каждому вокселю присваивается метка объекта. Несмотря на высокую информативность, их огромный размер вынуждает исследователей использовать упрощенные методы: просмотр по срезам, создание аппроксимированных сеток или распределенные вычисления, что искажает пространственный контекст и скрывает дефекты на уровне вокселей. Традиционные подходы к рендерингу скалярных данных не подходят для сегментации из-за категориального характера значений и необходимости сохранения четких границ объектов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сегментация — это процесс разделения цифрового изображения на области, где каждый элемент (воксель) классифицируется как принадлежащий определенному объекту.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Представлена система Volcanite — фреймворк с открытым исходным кодом для прямого рендеринга плотных сегментированных данных на обычном оборудовании. Архитектура объединяет методы обработки данных с учетом сжатия, графический бэкенд на базе Vulkan и специализированные алгоритмы рендеринга. Это позволяет визуализировать до 0,5 триллиона вокселей с частотой 100 кадров в секунду на стандартном настольном ПК.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Volcanite обеспечивает интерактивный рендеринг терабайтных объемов без предварительного построения сеток, сохраняя точность вокселей и добавляя эффекты глобального освещения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Система ориентирована на работу с уже сегментированными данными и не заменяет этапы первичной обработки или сегментации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ключевые достижения включают отказ от длительных этапов подготовки данных (мешинга) и возможность работы с конфиденциальными данными локально. Проект предоставляет ученым инструмент для интерактивного анализа, превращая «теравоксельные» поля меток в наглядное доказательство для проверки гипотез.&lt;/p&gt;\n&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;p&gt;Сегментированные объемы представляют собой 3D-сетки, где каждому элементу (вокселю) присвоена метка объекта или экземпляра: V: N³ → N. Такие области, обычно непрерывные, сегментируют пространство, например, на отдельные нейроны в коннектоме. Мы представляем Volcanite — инструмент для рендеринга сегментированных объемов.&lt;/p&gt;\n&lt;h4 id=\"novaya-integrirovannaya-sreda-renderinga-segmentirovannyh-obuemov\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#novaya-integrirovannaya-sreda-renderinga-segmentirovannyh-obuemov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Новая интегрированная среда рендеринга сегментированных объемов&lt;/span&gt;&lt;/a&gt;Новая интегрированная среда рендеринга сегментированных объемов&lt;/h4&gt;\n&lt;p&gt;На Рис. 1 показан рабочий процесс визуализации с помощью Volcanite. Сначала система сжимает объем в формат Fast Compressed Segmentation Volumes (CSGV), который на текущий момент является наиболее эффективным методом сжатия без потерь. Скорость сжатия ограничена чтением данных с диска (Таблица A1), при этом пропускная способность кодирования достигает гигабайт в секунду. Весь процесс визуализации, за исключением потоковой передачи деталей, полностью реализован на GPU (Рис. 1b). Закодированные CSGV-данные хранятся в видеопамяти (VRAM), а видимые области распаковываются по требованию в кэш. Графическое приложение Volcanite (Рис. 1a) позволяет интерактивно исследовать данные с частотой кадров в миллисекундах (Рис. 1c).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-f1.jpg\" alt=\"Рис. 1: Визуальная аннотация. a Наше интерактивное приложение Volcanite позволяет визуально исследовать большие сегменти\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1: Визуальная аннотация. a Наше интерактивное приложение Volcanite позволяет визуально исследовать большие сегментированные объемы на обычном оборудовании, используя современное сжатие без потерь. b Наш конвейер рендеринга на базе графического процессора…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. 1: Визуальная аннотация. a Наше интерактивное приложение Volcanite позволяет визуально исследовать большие сегментированные объемы на обычном оборудовании, используя современное сжатие без потерь. b Наш конвейер рендеринга на базе графического процессора (GPU) с точностью до вокселя распаковывает видимые области объема в кэш для быстрого доступа. Этот конвейер обеспечивает интерактивное исследование различных конфигураций рендеринга вплоть до изучения отдельных вокселей (справа). c Рендеринг является интерактивным со скоростью в миллисекунды на отрисованный кадр. Первые кадры имеют более высокие нагрузки на распаковку, которые быстро исчезают. d С помощью Volcanite мы можем интерактивно исследовать секцию объема сегментации белого вещества коры головного мозга человека H01 размером 2,2 ТБ с трассировкой путей Full-HD со скоростью 66 кадров в секунду на обычном аппаратном обеспечении с значительно более быстрым временем до первого кадра по сравнению с другими методами. Создание неточных сеток для визуализации в Neuroglancer занимает более недели, в то время как наша предварительная обработка создает значительно меньшие кодировки без потерь менее чем за два часа на нашей системе. e Режимы затенения в Volcanite можно переключать с быстрого локального затенения на высококачественную трассировку путей с немедленной обратной связью.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Volcanite обеспечивает интерактивный рендеринг сегментированных объемов без потерь, храня данные в VRAM и используя формат CSGV для быстрой визуализации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В отличие от других инструментов, которые отображают большие объемы только в виде 2D-срезов или упрощенных 3D-сеток, Volcanite визуализирует данные «как есть», сохраняя доступ к каждому вокселю. Рендеринг высокого качества доступен как в интерактивном режиме, так и через интерфейс командной строки (CLI), что удобно для пакетной обработки или удаленного выполнения. Видео A1 демонстрирует офлайн-рендеринг объема Mouse L4, а Видео A2 — интерактивное исследование набора данных Cells.&lt;/p&gt;\n&lt;h4 id=\"nauchnye-insajty-cherez-rendering-segmentirovannyh-obuemov\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#nauchnye-insajty-cherez-rendering-segmentirovannyh-obuemov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Научные инсайты через рендеринг сегментированных объемов&lt;/span&gt;&lt;/a&gt;Научные инсайты через рендеринг сегментированных объемов&lt;/h4&gt;\n&lt;p&gt;На Рис. 2d представлен 3D-рендер сегментированных кровеносных сосудов мозга мыши. Volcanite оказался критически важным для диагностики ошибок сшивания 2D-микроскопических срезов. Благодаря воксельной точности, любые рассогласования видны как явные разрывы сосудов. В Neuroglancer эти ошибки менее заметны из-за упрощения мешей (параметры Igneous), которое сглаживает детали и может полностью удалять мелкие артефакты. Отсутствие глобального освещения в других инструментах также снижает пространственное восприятие. Volcanite позволяет работать с наборами данных объемом до 163 ГБ (1 бит/воксель), тогда как аналоги, такие как ParaView, не справляются с такими масштабами.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-f2.jpg\" alt=\"Рис. 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 2&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Меши — это аппроксимация поверхности объекта в виде сетки из треугольников, которая требует упрощения для снижения веса файла, в отличие от воксельного представления.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"effektivnyj-redaktor-materialov-segmentirovannyh-obuemov\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#effektivnyj-redaktor-materialov-segmentirovannyh-obuemov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эффективный редактор материалов сегментированных объемов&lt;/span&gt;&lt;/a&gt;Эффективный редактор материалов сегментированных объемов&lt;/h4&gt;\n&lt;p&gt;Функции передачи (transfer functions) в визуализации объемов сопоставляют значения данных с оптическими свойствами, такими как цвет и прозрачность. Существующие интерфейсы часто ограничены 32 метками (например, в VTK/ParaView). Volcanite позволяет сопоставлять номинальные метки &lt;span class=\"yfm-latex\" data-content=\"l%20%5Cin%20N\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; с вторичными атрибутами &lt;span class=\"yfm-latex\" data-content=\"A%3A%20l%20%20o%20(a_0%2C%20...%2C%20a_%7BN-1%7D)%20%5Cin%20R%5EN\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, что дает возможность визуализировать, например, плотность питательных веществ в клетках (Рис. 4c).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-f4.jpg\" alt=\"Рис. 4: a Пример назначения цветов вокселям.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 4: a Пример назначения цветов вокселям.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. 4: a Пример назначения цветов вокселям. Метки шести вокселей отображаются на два атрибута (возраст и тип) каждый. Первый материал, для которого атрибут фильтра попадает в указанный диапазон, назначается вокселю. Другой диапазон атрибутов может быть использован для назначения цветов из цветовой карты. b Объемы предварительно обрабатываются для хранения последовательных значений ID для эффективного отображения вокселей на атрибуты в памяти. d Редактор функции передачи задает материалы затенения на основе интервалов атрибутов меток. Для каждого материала интервал атрибутов фильтра определяет, для каких меток вокселей он актуален. Для этих меток значения свойства атрибута могут быть отображены в разные цвета. c Рендеринг клеток с тремя материалами: кровеносные сосуды красным цветом, плотность питательных веществ опухолевых клеток отображена с помощью цветовой карты viridis, внеклеточный матрикс (ECM) вырезан серым цветом.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"kollekciya-segmentirovannyh-obuemov-dlya-ocenki-vizualizacii\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#kollekciya-segmentirovannyh-obuemov-dlya-ocenki-vizualizacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Коллекция сегментированных объемов для оценки визуализации&lt;/span&gt;&lt;/a&gt;Коллекция сегментированных объемов для оценки визуализации&lt;/h4&gt;\n&lt;p&gt;Мы представляем набор данных для бенчмаркинга, охватывающий широкий спектр областей: от анализа растений и клеточных симуляций до композитных материалов и нейробиологии (Рис. 5a). Размеры варьируются от 72 МБ (8-бит, Fabric) до более 2 ТБ (32-бит, H01 human cortex).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-f5.jpg\" alt=\"Рис. 5: a Наша коллекция сегментированных объемов с различными свойствами для оценки визуализаций.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 5: a Наша коллекция сегментированных объемов с различными свойствами для оценки визуализаций.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. 5: a Наша коллекция сегментированных объемов с различными свойствами для оценки визуализаций. Хотя анализ коннектома (CONN) является основным приложением, многие области используют сегментированные объемы. b Наш формат CSGV сжимает сегментированные объемы как набор кодировок блоков. Каждый блок кодируется независимым потоком операций, которые реконструируют его в форме сетки с несколькими разрешениями. Малые коды операций предписывают узлам копировать свою метку от соседнего или родительского узла сетки, или из палитры 32-битных меток блока. c Это значительно снижает потребление памяти наборами данных, требуя в среднем значительно меньше 1 бита на воксель (бит/воксель). Volcanite использует это для хранения объемов размером в ТБ в видеопамяти GPU для полностью основанного на GPU конвейера визуализации. Кодирование уровня детализации (LOD) самого высокого качества может быть отделено в CSGV для потоковой передачи на GPU только по требованию во время рендеринга. Относительный размер этого уровня детализации LOD указан как Detail%.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"szhatie-segmentirovannyh-obuemov-csgv\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#szhatie-segmentirovannyh-obuemov-csgv\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сжатие сегментированных объемов CSGV&lt;/span&gt;&lt;/a&gt;Сжатие сегментированных объемов CSGV&lt;/h4&gt;\n&lt;p&gt;Конвейер рендеринга Volcanite полностью работает на GPU, используя формат сжатия CSGV. Как показано на Рис. 5c, метод обеспечивает сжатие без потерь, что позволяет обрабатывать терабайтные объемы данных на обычном графическом процессоре с ограниченным объемом видеопамяти (VRAM). Эффективность CSGV слабо зависит от общего количества меток в наборе данных (например, H01WM содержит более 13 миллионов меток), а определяется локальной плотностью меток в блоках данных. Сжатие менее эффективно для 8- или 16-битных данных, так как они изначально упакованы плотнее, чем 32-битные (Рис. 5c). Несмотря на затраты времени на сжатие, препроцессинг Volcanite значительно быстрее, чем в VTK или Neuroglancer, при меньших размерах хранимых данных (Рис. 3c) и минимальном времени до первого кадра (TTFF, Таблица A1). В отличие от Neuroglancer, который для экономии места хранит лишь аппроксимации сеток, CSGV обеспечивает сжатие без потерь.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-f3.jpg\" alt=\"Рис. 3: a Время кадров для воксельного рендеринга с помощью Volcanite (синий) и VTK (желтый) с локальным затенением от ф\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 3: a Время кадров для воксельного рендеринга с помощью Volcanite (синий) и VTK (желтый) с локальным затенением от фиксированной камеры (меньше — лучше).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. 3: a Время кадров для воксельного рендеринга с помощью Volcanite (синий) и VTK (желтый) с локальным затенением от фиксированной камеры (меньше — лучше). Большие данные не могут быть отрисованы из-за ограничений памяти. Время кадров для Neuroglancer недоступно. b AZBA, отрисованный с совпадающими перспективами и простым локальным затенением, как в a, в Volcanite и VTK, и в аналогичной конфигурации в Neuroglancer. Поскольку прямой объемный рендеринг сегментации VTK и Neuroglancer поддерживают только локальное затенение, мы сравниваем его с локальным затенением Volcanite в измерениях производительности, даже несмотря на то, что Volcanite поддерживает тени и непрямое освещение. c Даже без вторичного сжатия gzip, применяемого для Neuroglancer, Volcanite хранит наименьший объем данных и имеет самые короткие времена предварительной обработки в целом.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CSGV обеспечивает сжатие без потерь, позволяя визуализировать терабайтные объемы на стандартных GPU за счет потоковой передачи уровней детализации (LOD).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LOD (Level of Detail) — это метод оптимизации, при котором для объектов, находящихся дальше от камеры или требующих меньшей точности, используются упрощенные версии данных, что экономит ресурсы GPU.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;CSGV кодирует многоуровневые блоки объема как последовательные потоки операций копирования меток (Рис. 5b). Самый детальный LOD (занимающий 45–68% общего объема) передается на GPU по требованию. Каждый узел сетки содержит стоп-бит, позволяющий пропускать однородные дочерние узлы. Если метку нельзя скопировать из соседнего узла, она считывается из палитры блока. Для оптимизации мы заменили старую операцию ссылок на предыдущие записи палитры (с ограничением δ ≤ 16) на новый вариант с неограниченным δ, что позволяет создавать оптимальные длины палитр без дубликатов (Рис. A2b).&lt;/p&gt;\n&lt;h4 id=\"proizvoditelnost-renderinga-izobrazhenij-i-video\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#proizvoditelnost-renderinga-izobrazhenij-i-video\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Производительность рендеринга изображений и видео&lt;/span&gt;&lt;/a&gt;Производительность рендеринга изображений и видео&lt;/h4&gt;\n&lt;p&gt;На Рис. 6b представлены временные показатели рендеринга H01WM с тенями и статичной камерой. Volcanite использует прогрессивный рендеринг: качество изображения улучшается с накоплением кадров за счет сглаживания и увеличения числа выборок Монте-Карло. Система чередует этапы рендеринга и декомпрессии, декодируя только те блоки, которые видны в кадре, с таким уровнем детализации (LOD), чтобы один воксель соответствовал примерно одному пикселю на экране (Рис. 1b). Для малых наборов данных декодируются почти все блоки, тогда как для крупных (например, MouseL4, H01) чаще используются более грубые LOD, что повышает скорость. Время отрисовки кадра стабилизируется в диапазоне 2–29 мс. По сравнению с VTK, использующим алгоритмы ray marching, Volcanite показывает значительно более высокую производительность (Рис. 3a). При движении камеры (Рис. 6c) нагрузка на декомпрессию остается постоянной, обеспечивая интерактивную частоту кадров во всех сценариях.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-f6.jpg\" alt=\"Рис. 6: a Конвейер рендеринга Volcanite. Каждый этап представляет собой отдельную отправку шейдера.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 6: a Конвейер рендеринга Volcanite. Каждый этап представляет собой отдельную отправку шейдера.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. 6: a Конвейер рендеринга Volcanite. Каждый этап представляет собой отдельную отправку шейдера. Управление кэшем блоков разделено на несколько этапов (ср. потоковая передача атласа затенения (52) и (60)): Request освобождает области кэша больше не запрашиваемых блоков в стеки свободных LOD. Provision выделяет новые элементы из конца буфера кэша, если стека свободных недостаточно для выполнения всех запросов блоков. Assign назначает недавно запрошенные блоки в свободные области кэша, после чего Decode распаковывает их в кэш. Render выполняет один поток трассировки лучей на пиксель, обращаясь к кэшированным блокам для составления цветов, и запрашивает все видимые блоки. Resolve многократно выполняет наш фильтр A-trous для унифицированного шумоподавления и апсемплинга. b Время кадров для рендеринга объема Mouse L4 размером 927 ГБ (сырые данные) с неподвижной камерой на 16 ГБ GPU. Начальная потребность в распаковке высока, так как кэши изначально пусты. Более поздние кадры доминируют за счет рендеринга. c Время кадров для анимации (камера вращается вокруг и приближается к Mouse L4) с тенями. Более поздние кадры обращаются к данным в более высоком разрешении, что приводит к более затратной распаковке и рендерингу.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Приведенные показатели производительности зависят от аппаратного обеспечения и специфики сцены; при резкой смене ракурса возможны кратковременные пиковые нагрузки на декодер.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"rezhimy-zateneniya-volcanite\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#rezhimy-zateneniya-volcanite\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Режимы затенения Volcanite&lt;/span&gt;&lt;/a&gt;Режимы затенения Volcanite&lt;/h4&gt;\n&lt;p&gt;Система Volcanite поддерживает четыре режима затенения (Рис. 1e), варьирующихся от простой локальной модели отражения до полноценного глобального освещения с использованием трассировки путей (path tracing). Как показано на Рис. A7c, использование теней и окклюзии окружения (ambient occlusion) значительно улучшает восприятие пространственных структур. Хотя трассировка путей обеспечивает наивысшее визуальное качество, время рендеринга возрастает до 5,5 раз (Таблица A2). При глубоком прослеживании путей (Рис. A7a) система обращается к большему числу блоков данных. Даже при неподвижной камере случайные смещения лучей для сглаживания и вторичные лучи требуют обновления данных в каждом кадре. Переключение между режимами происходит мгновенно, что позволяет гибко выбирать баланс между скоростью исследования и качеством визуализации (Видео A2). В отличие от инструментов вроде Neuroglancer или VTK/ParaView, которые ограничены локальным затенением (Рис. 2a, 3b), Volcanite обеспечивает более глубокое пространственное восприятие.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Трассировка путей дает наилучшее качество, но увеличивает время рендеринга в 5,5 раз по сравнению с базовыми методами.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"konvejer-renderinga-na-baze-gpu\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#konvejer-renderinga-na-baze-gpu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Конвейер рендеринга на базе GPU&lt;/span&gt;&lt;/a&gt;Конвейер рендеринга на базе GPU&lt;/h4&gt;\n&lt;p&gt;Конвейер рендеринга (Рис. 6a) полностью реализован на GPU, что исключает синхронизацию с CPU внутри кадра и минимизирует задержки. Процесс кэширования включает четыре стадии: запрос (Request), выделение памяти (Provision), назначение блоков (Assign) и параллельную декомпрессию (Decompress). Стадия рендеринга (Render) вычисляет перенос света с использованием ray marching через воксельную сетку (Рис. 1b, A7a). Постобработка включает шумоподавление и апсемплинг. Поскольку весь объем данных хранится в видеопамяти (VRAM), необходимость потоковой передачи данных между CPU и GPU практически отсутствует. Управление кэшем использует атомарные операции и практически не влияет на время формирования кадра, даже при работе с терабайтными массивами (Рис. 6b, 6c). Основная нагрузка приходится на этапы декомпрессии и рендеринга. В отличие от VTK, который испытывает трудности с интерактивностью при визуализации больших объемов, или Neuroglancer с его серверной архитектурой, конвейер Volcanite обеспечивает минимальную задержку при взаимодействии.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ray marching — метод рендеринга объемных данных, при котором луч проходит через воксельную сетку, накапливая значения плотности или цвета.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Таблица 1.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-tT1.jpg\" alt=\"Таблица 1\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"kombinirovannyj-filtr-apsemplinga-i-shumopodavleniya\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#kombinirovannyj-filtr-apsemplinga-i-shumopodavleniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Комбинированный фильтр апсемплинга и шумоподавления&lt;/span&gt;&lt;/a&gt;Комбинированный фильтр апсемплинга и шумоподавления&lt;/h4&gt;\n&lt;p&gt;Производительность постобработки зависит от интерполяции пикселей. При малом количестве выборок шум удаляется путем смешивания с соседними точками (Рис. A1f). Опциональный субсемплинг (рендеринг 1/4, 1/16 или 1/64 пикселей) ускоряет процесс, а пропуски заполняются данными ближайших соседей (Рис. A1e). Мы модифицировали фильтр «à-trous» [16]: вместо хранения промежуточных результатов мы накапливаем цвета непосредственно в буферах (Denoise A/B), что снижает потребление памяти. Апсемплинг интегрирован в процесс шумоподавления: нерендеренные пиксели получают значения от ближайших соседей. Мы оптимизировали веса фильтрации для сегментированных объемов, используя специализированную структуру G-буфера (Рис. A1b), аналогичную билатеральной фильтрации. Метод работает быстро (Рис. A1d) при минимальных затратах памяти (три текстуры размером с изображение) и обеспечивает высокое качество при движении камеры. При статичном положении камеры фильтрация постепенно сходит на нет, обеспечивая несмещенное изображение.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;При использовании субсемплинга возможны временные артефакты, которые устраняются при накоплении достаточного количества выборок.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"optimizaciya-ispolzovaniya-videopamyati-gpu\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#optimizaciya-ispolzovaniya-videopamyati-gpu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оптимизация использования видеопамяти (GPU)&lt;/span&gt;&lt;/a&gt;Оптимизация использования видеопамяти (GPU)&lt;/h4&gt;\n&lt;p&gt;На рис. A2d представлены данные об общем потреблении видеопамяти (VRAM) при рендеринге фрагментов с высокой детализацией. При работе с небольшими объемами данных основную часть VRAM занимает кэш-память, что обусловлено высокой степенью сжатия CSGV. Однако для крупных массивов данных даже сжатый объем приближается к аппаратным ограничениям. Благодаря внедренным методам оптимизации, процесс рендеринга укладывается в лимит 16 GiB VRAM, установленный для нашей системы. В частности, для набора данных H01WM потоковая передача данных с минимальным уровнем детализации (LOD) позволяет сократить объем памяти, занимаемый CSGV, на 65,7%.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оптимизация позволила снизить потребление VRAM на 65,7% для H01WM, обеспечивая работу в пределах 16 GiB даже для крупных наборов данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Распаковка блоков в упакованный палитровый формат позволяет увеличить эффективный объем кэша при том же количестве вокселей за счет коэффициента упаковки (рис. A2a). В этом режиме кэш хранит упакованные индексы палитр блоков, доступные напрямую из кодировок, что кратно увеличивает полезную емкость кэша (см. «Packing» на рис. A2d и данные VRAM в табл. A3). Если объема кэш-буфера недостаточно для размещения всех необходимых блоков, система автоматически ограничивает запросы к блокам подмножеством пикселей экрана (рис. A2c). Хотя это требует большего количества кадров для получения финального изображения, такой подход предотвращает «блокировку кэша», при которой отдельные области экрана занимают весь объем памяти, не освобождая блоки.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Блокировка кэша (cache deadlock) — ситуация, когда все ресурсы памяти заняты данными, которые постоянно требуются для отрисовки, из-за чего новые данные не могут быть загружены.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Volcanite обеспечивает рендеринг терабайтных (TB) данных с мгновенным откликом и высоким качеством. В отличие от других воксельных 3D-рендереров, таких как VTK, которые требуют хранения всех данных в VRAM (рис. 3a), наш метод позволяет проводить интерактивный анализ крупномасштабных сегментированных объемов на обычном оборудовании, что критически важно для проверки научных гипотез.&lt;/p&gt;\n&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;h4 id=\"preimushestva-metoda-volcanite\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#preimushestva-metoda-volcanite\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Преимущества метода Volcanite&lt;/span&gt;&lt;/a&gt;Преимущества метода Volcanite&lt;/h4&gt;\n&lt;p&gt;Volcanite предлагает принципиально новый подход к визуализации плотных сегментаций, рассматривая их как категориальные данные, чувствительные к границам вокселей, а не как скалярные поля или предварительно рассчитанные поверхности. Это позволяет осуществлять интерактивный рендеринг объемов теравоксельного масштаба на обычном оборудовании, сохраняя точность на уровне отдельных вокселей. Система исключает необходимость генерации мешей, что сокращает время от получения результатов сегментации до их визуального анализа. Использование единого формата CSGV (Categorical Segmentation Grid Volume) обеспечивает сжатие без потерь и одновременно служит структурой ускорения для рендеринга, минимизируя затраты на конвертацию данных.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Volcanite сокращает путь от сегментации к визуализации, позволяя работать с теравоксельными объемами на стандартных ПК без генерации мешей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CSGV — это формат представления данных, который хранит метки сегментации как воксели, сохраняя их категориальную природу и границы, что критично для анализа сложных структур.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В задачах с высокой плотностью объектов, таких как нейронные сети или сосудистые системы, рендеринг с точностью до вокселя и использование глобального освещения позволяют выявлять ошибки сшивки и дефекты сегментации, которые часто скрыты в срезах или упрощенных 3D-моделях. Возможность локальной работы с данными упрощает обмен результатами и анализ конфиденциальной информации, так как исследователям не требуется удаленная инфраструктура. Метод универсален и применим к данным любого масштаба — от нескольких меток до миллионов объектов, независимо от области исследования.&lt;/p&gt;\n&lt;h4 id=\"sravnenie-s-sushestvuyushimi-metodami\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#sravnenie-s-sushestvuyushimi-metodami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сравнение с существующими методами&lt;/span&gt;&lt;/a&gt;Сравнение с существующими методами&lt;/h4&gt;\n&lt;p&gt;По сравнению с традиционными инструментами, Volcanite оптимизирует баланс между масштабом, точностью и скоростью итераций. Просмотрщики на основе срезов точны, но лишены 3D-контекста, а методы на основе мешей требуют сложной предобработки, которая может искажать мелкие детали. Системы потоковой передачи данных незаменимы для петабайтных наборов, но часто ограничивают область обзора или используют аппроксимации. Volcanite дополняет их, обеспечивая высокоточный осмотр выбранных регионов с быстрым локальным откликом.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Текущая реализация ограничена теравоксельным диапазоном; для работы с петабайтными данными потребуется интеграция механизмов потоковой передачи из CPU или удаленных серверов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Текущая версия системы эффективно обрабатывает теравоксельные объемы, что покрывает большинство современных биологических реконструкций. Дальнейшее развитие системы предполагает внедрение кэширования на GPU и динамической подгрузки данных, что позволит сохранить главное преимущество — прямое взаимодействие с воксельными сегментациями без потери точности.&lt;/p&gt;\n&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;h4 id=\"nastrojka-sredy-ocenki\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#nastrojka-sredy-ocenki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Настройка среды оценки&lt;/span&gt;&lt;/a&gt;Настройка среды оценки&lt;/h4&gt;\n&lt;p&gt;Производительность рендеринга тестировалась на стандартном аппаратном обеспечении: процессор AMD Ryzen 7 5800X, 48 ГБ оперативной памяти DDR4 и видеокарта RTX 4070 Ti Super с 16 ГБ видеопамяти (VRAM). Система работала на Ubuntu 24.04 с фиксированной частотой графического процессора. Входные данные считывались с NVMe-накопителя Lexar NM790 4 ТБ, а результаты сохранялись на Samsung EVO 970 1 ТБ. Для воспроизводимости предоставляются Python-скрипты для загрузки данных, запуска Volcanite в headless-режиме и автоматической генерации графиков.&lt;/p&gt;\n&lt;h4 id=\"parametry-szhatiya-i-renderinga\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#parametry-szhatiya-i-renderinga\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Параметры сжатия и рендеринга&lt;/span&gt;&lt;/a&gt;Параметры сжатия и рендеринга&lt;/h4&gt;\n&lt;p&gt;Базовый размер блока CSGV установлен на b = 32, однако для крупных наборов данных (MouseL4, H01BV, H01WM, Fabric) используется b = 64. Для датасетов Fiber и Polyamid, а также указанных выше, применяется метод «палетизации кэша» (декомпрессия вокселей в компактный формат) для оптимизации работы с памятью. Поскольку сжатый объем H01WM превышает доступный объем VRAM, для него реализована потоковая передача блоков самого высокого уровня детализации (LOD) по требованию. Для наборов Cells, MouseL4S, MouseL4, Liconn и H01WM включены неограниченные обратные ссылки палитры, для остальных — отключены.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Палетизация кэша — это метод сжатия данных, при котором повторяющиеся значения вокселей заменяются ссылками на палитру, что позволяет экономить видеопамять при работе с большими объемами.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Все изображения рендерятся в разрешении 1920×1080 с одним лучом на пиксель. Оценка качества включает 1024 кадра со статической камерой и временным сглаживанием (temporal supersampling), а видеооценка — 600 кадров с движением камеры вокруг фокуса.&lt;/p&gt;\n&lt;h4 id=\"sravnenie-s-vtk-i-neuroglancer\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#sravnenie-s-vtk-i-neuroglancer\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сравнение с VTK и Neuroglancer&lt;/span&gt;&lt;/a&gt;Сравнение с VTK и Neuroglancer&lt;/h4&gt;\n&lt;p&gt;Сравнение проводилось с VTK v9.5.0. Поскольку VTK ориентирован на полутоновые объемы, для сегментированных данных используется либо поверхностная визуализация (меши), либо воксельный рендеринг с ограничением до 32 категориальных меток. Для плотно размеченных объемов мы использовали GPU-рендеринг VTK, транслируя конфигурации Volcanite в функции передачи прозрачности (transfer functions). При этом VTK настраивался на локальное затенение с шагом луча 0,5 вокселя. Для Neuroglancer данные конвертировались в формат precomputed с размером чанка 64×64×64. Меши вычислялись параллельно через Igneous с упрощением через квадратичный коллапс ребер. Ввиду клиент-серверной архитектуры Neuroglancer, где данные подгружаются потоково, замеры времени кадра для него не проводились.&lt;/p&gt;\n&lt;h4 id=\"szhatie-segmentirovannyh-obuemov\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#szhatie-segmentirovannyh-obuemov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сжатие сегментированных объемов&lt;/span&gt;&lt;/a&gt;Сжатие сегментированных объемов&lt;/h4&gt;\n&lt;p&gt;Ключевым инструментом визуализатора для работы с крупномасштабными сегментированными объемами (V: N³ → N) на одиночных GPU является сжатие данных без потерь. Поскольку визуализация на GPU ограничена объемом памяти, мы используем метод CSGV с многоуровневым кодированием по блокам. Мы модифицировали оригинальный алгоритм, добавив возможность отключения операций, кроме базовой вставки и чтения палитры меток. Например, отказ от обратных ссылок (back references) в ряде случаев повышает коэффициент сжатия, так как снижает количество дубликатов в палитре ценой увеличения потока операций.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Обратные ссылки — это механизм в сжатии данных, позволяющий заменить повторяющиеся значения ссылкой на их предыдущее вхождение, что экономит место, но усложняет декодирование.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для оптимизации мы внедрили обратные ссылки произвольной длины. После кода операции считывается 4-битный элемент: 3 младших бита содержат часть значения δ, а последний бит указывает на наличие следующего элемента. Значение δ обновляется по формуле &lt;span class=\"yfm-latex\" data-content=\"%5Cdelta%20%5Cleftarrow%20(%5Cdelta%20%5Cll%203)%20%5Cmid%20(%20ext%7Bentry%7D%20%5C%26%20111_2)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Это позволяет кодировать произвольные расстояния, устраняя дубликаты 32-битных меток. Для блока 64³ теоретический максимум составляет 7 элементов по 4 бита (28 бит), что эффективнее вставки 32-битного дубликата. Сжатие выполняется на CPU с использованием OpenMP.&lt;/p&gt;\n&lt;h4 id=\"rendering-v-volcanite\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#rendering-v-volcanite\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Рендеринг в Volcanite&lt;/span&gt;&lt;/a&gt;Рендеринг в Volcanite&lt;/h4&gt;\n&lt;p&gt;Сжатый объем загружается в память GPU, где видимые области декодируются по требованию. Рендеринг осуществляется методом трассировки лучей (ray marching) с шагом в один воксель. Для каждого пикселя луч проходит через объем, считывая метку вокселя (Рис. A7a). Материалы затенения определяются на основе меток для формирования финального цвета (Рис. 4a).&lt;/p&gt;\n&lt;h4 id=\"rezhimy-zateneniya\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#rezhimy-zateneniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Режимы затенения&lt;/span&gt;&lt;/a&gt;Режимы затенения&lt;/h4&gt;\n&lt;p&gt;Режим затенения определяет, будут ли трассироваться отраженные лучи после столкновения с поверхностью. Расчет базируется на уравнении рендеринга:&lt;br /&gt;\n&lt;span class=\"yfm-latex\" data-content=\"L_o(x%2C%20%5Comega_o)%20%3D%20L_e(x%2C%20%5Comega_o)%20%2B%20%5Cint_%7B%5COmega%5E%2B%7D%20f(x%2C%20%5Comega_i%2C%20%5Comega_o)%20L_i(x%2C%20%5Comega_i)%20%5Ccos%20%20heta_i%20d%5Comega_i\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;&lt;/p&gt;\n&lt;p&gt;Режимы (от быстрого к медленному):&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Simple Local Shading: предполагает постоянную входящую радиацию L_i с одного направления ω_l. Дополнительные лучи не трассируются.&lt;/li&gt;\n&lt;li&gt;One Shadow Ray: аналогичен первому, но пускает один луч к источнику света для проверки затенения.&lt;/li&gt;\n&lt;li&gt;Ambient Occlusion: пускает один луч в случайном направлении &lt;span class=\"yfm-latex\" data-content=\"%5COmega%5E%2B\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; для аппроксимации затенения окружающими объектами.&lt;/li&gt;\n&lt;li&gt;Path Tracing: оценивает полное уравнение рендеринга методом Монте-Карло, учитывая непрямое освещение. Рекурсия завершается при выходе луча за пределы объема или при достижении порога глубины пути.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"prozrachnost\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#prozrachnost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Прозрачность&lt;/span&gt;&lt;/a&gt;Прозрачность&lt;/h4&gt;\n&lt;p&gt;В отличие от сеточных методов 3D-сегментации, наш воксельный рендеринг всегда обходит области и поверхности в строгом порядке: от ближайшей к камере до самой дальней. Это позволяет легко интегрировать полупрозрачность, несмотря на некоммутативность композиции полупрозрачных поверхностей (см. Mouse BA на Рис. A6). Пользователь назначает коэффициент непрозрачности σ для каждого типа меток. При прохождении луча через полупрозрачный материал его направление не меняется, но к накопленной яркости добавляется вклад модели Ламберта, а пропускная способность луча уменьшается на σ, что приводит к перекрытию последующих поверхностей.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод Ламберта — это модель освещения, при которой яркость поверхности не зависит от угла обзора, так как свет рассеивается равномерно во всех направлениях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мы протестировали модель поглощения-излучения для послойно-однородных объемов, но пришли к выводу, что использование только поверхностей дает более четкую визуализацию. В будущем планируется внедрение различных функций BRDF и улучшение модели переноса света, включая полное многократное рассеяние.&lt;/p&gt;\n&lt;h4 id=\"trassirovka-luchej-raymarching\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#trassirovka-luchej-raymarching\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Трассировка лучей (Raymarching)&lt;/span&gt;&lt;/a&gt;Трассировка лучей (Raymarching)&lt;/h4&gt;\n&lt;p&gt;Для определения вокселей и их меток вдоль пути луча используется метод Raymarching. Рендерер подбирает уровень детализации (LOD) так, чтобы один воксель кирпича соответствовал примерно одному пикселю на плоскости изображения. Поскольку метки внутри вокселей постоянны, мы применяем многоразрядный цифровой дифференциальный анализатор (DDA). Чтобы избежать численных ошибок при работе с большими объемами, мы используем декомпозицию позиции: целочисленный вектор &lt;span class=\"yfm-latex\" data-content=\"voxel%20%5Cin%20%5Cmathbb%7BN%7D%5E3\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; хранит индекс вокселя, а вектор с плавающей запятой &lt;span class=\"yfm-latex\" data-content=\"vpos%20%5Cin%20%5Cmathbb%7BR%7D%5E3\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — положение внутри вокселя в диапазоне [0, 1)³.&lt;/p&gt;\n&lt;p&gt;Для оптимизации работы GPU (архитектура SIMT) при масштабировании вокселей используется оператор модуля. Трассировка пути включает «русскую рулетку» для раннего завершения лучей (до 32 отскоков). Для борьбы с алиасингом (ступенчатостью) применяется временное сглаживание: субпиксельные смещения лучей дрожат на основе фильтра Блэкмана-Харриса. Поскольку в сегментированных объемах невозможно классическое Mip-mapping (фильтрация меток невозможна), мы используем иерархию CSGV, где на более грубых уровнях накапливается мода значений, а не среднее арифметическое.&lt;/p&gt;\n&lt;h4 id=\"postobrabotka\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#postobrabotka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Постобработка&lt;/span&gt;&lt;/a&gt;Постобработка&lt;/h4&gt;\n&lt;p&gt;Шум в начальных кадрах при использовании Ambient Occlusion или Path Tracing устраняется с помощью иерархического вейвлет-фильтра. Если производительность GPU ограничена, рендеринг выполняется для части пикселей, а пропущенные значения заполняются апсемплингом (Рис. A1e). Процесс реализован через конвейер вычислительных шейдеров (один поток на пиксель). Входными данными служат буферы накопления цвета и прозрачности (RGBA) и G-буфер, содержащий вспомогательную информацию для фильтрации. На финальной итерации выполняется тональная компрессия (tone mapping), коррекция яркости, контраста, гаммы и наложение фона.&lt;/p&gt;\n&lt;h4 id=\"bufer-geometrii-g-buffer\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#bufer-geometrii-g-buffer\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Буфер геометрии (G-Buffer)&lt;/span&gt;&lt;/a&gt;Буфер геометрии (G-Buffer)&lt;/h4&gt;\n&lt;p&gt;G-Buffer записывается на этапе рендеринга и содержит данные только для последнего кадра с глубиной 48 бит на пиксель. Для точки первого взаимодействия с поверхностью сохраняются следующие данные (Рис. A1b): нормаль поверхности (3 бита), ориентированная в одном из шести дискретных направлений; квантованная глубина (13 бит), вычисленная как нормализованное расстояние от поверхности до ограничивающей сферы всего набора данных (Рис. A3b); и метка точки (32 бита) для определения материала и цвета альбедо. Значения нормалей 011 указывают на отсутствие поверхности (только объемное взаимодействие), а 111 — на то, что пиксель еще не был отрендерен.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;G-Buffer — это промежуточный буфер, хранящий геометрические свойства сцены (нормали, глубину, материалы) для каждого пикселя, что позволяет выполнять постобработку без повторного обращения к сложной геометрии.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"podavlenie-shuma-shumopodavlenie\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#podavlenie-shuma-shumopodavlenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подавление шума (Шумоподавление)&lt;/span&gt;&lt;/a&gt;Подавление шума (Шумоподавление)&lt;/h4&gt;\n&lt;p&gt;Рендеринг накапливает максимум один сэмпл на пиксель за кадр. Используются два буфера (ping-pong), отслеживающие накопленную яркость/непрозрачность и количество сэмплов. Для подавления шума в ранних кадрах применяется фильтр «A-trous» (Рис. A1f), который размывает цвета, избегая краев. На каждой итерации i пиксель обрабатывает область 3×3 или 5×5 пикселей предыдущего результата (Рис. A1c) с шагом 2^i, что создает поле охвата 15×15 за 3 итерации (Рис. A1a). В отличие от классического подхода, здесь не используется восходящий проход, что экономит память. Итоговое значение пикселя p на итерации i+1 вычисляется как: &lt;span class=\"yfm-latex\" data-content=\"c_%7Bi%2B1%7D(p)%20%3D%20%5Cfrac%7B1%7D%7Bk%7D%20%5Csum_%7Bq%7D%20h_i(q)%20%5Ccdot%20w(q%2C%20p)%20%5Ccdot%20c_i(q)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Здесь h — пространственный фильтр Гаусса (1, 2, 1)⊗(1, 2, 1), а w — весовой коэффициент, зависящий от различий в G-Buffer (нормали, глубина и цвет в пространстве HSV). Если нормали n_p и n_q не совпадают, w=0. В противном случае &lt;span class=\"yfm-latex\" data-content=\"w%20%3D%20e%5E%7B-%5Clangle%20%5Crho_%5CDelta%2C%20%5Crho_%5CDelta%20%5Crangle%7D%20%5Ccdot%20e%5E%7B-%2Fd_p-d_q%2F%2F%5Cphi_d%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, где &lt;span class=\"yfm-latex\" data-content=\"%5Cphi_d\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — размер вокселя, а &lt;span class=\"yfm-latex\" data-content=\"%5Cphi_%5Crho%3D8\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; управляет влиянием различий альбедо.&lt;/p&gt;\n&lt;h4 id=\"uvelichenie-razresheniya-apsejpling\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#uvelichenie-razresheniya-apsejpling\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Увеличение разрешения (Апсейплинг)&lt;/span&gt;&lt;/a&gt;Увеличение разрешения (Апсейплинг)&lt;/h4&gt;\n&lt;p&gt;Для повышения производительности разрешение рендеринга может быть снижено до 1/4, 1/16 или 1/64 от общего числа пикселей. Пропуски заполняются методом апсемплинга, интегрированным в иерархическое накопление денойзера (Рис. A1e). Для нерендеренных пикселей (нормаль 111) буферы хранят 2D-смещение до ближайшего отрендеренного соседа. На каждой итерации i ищется сосед q с расстоянием 2^i, который либо сам является отрендеренным, либо содержит ссылку на таковой. Итоговое смещение o_p обновляется как &lt;span class=\"yfm-latex\" data-content=\"o_p%20%5Cleftarrow%20%5Cmin_%7Blength%7D%20%5Bo_p%2C%20o_q%20%2B%20(q%20-%20p)%5D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. После оценки ядра цвет копируется из найденного соседа. Метод напоминает алгоритм Jump-Flood для диаграмм Вороного. Стратифицированная выборка гарантирует, что один пиксель рендерится на блок 2², 4² или 8², а последовательности блоков смещаются по синему шуму (Рис. A1e).&lt;/p&gt;\n&lt;h4 id=\"primenenie-frejmvorka-volcanite\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#primenenie-frejmvorka-volcanite\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Применение фреймворка Volcanite&lt;/span&gt;&lt;/a&gt;Применение фреймворка Volcanite&lt;/h4&gt;\n&lt;p&gt;Помимо графического интерфейса (GUI), Volcanite поддерживает работу через CLI для автоматизации задач или на системах без графической оболочки с полным доступом ко всем параметрам (Рис. 1).&lt;/p&gt;\n&lt;h4 id=\"redaktor-materialov-i-funkcii-peredachi\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#redaktor-materialov-i-funkcii-peredachi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Редактор материалов и функции передачи&lt;/span&gt;&lt;/a&gt;Редактор материалов и функции передачи&lt;/h4&gt;\n&lt;p&gt;Правая часть графического интерфейса (Рис. 1a) содержит редактор материалов, управляющий функциями передачи для сопоставления меток (labels) с оптическими свойствами. Система использует многоуровневое отображение (Рис. 4a): материалы назначаются на основе фильтрации атрибутов по минимальному и максимальному значениям. Например, все метки с типом в диапазоне [5.2, 27] могут быть назначены левому материалу (Рис. 4d). Для каждой метки выбирается первый подходящий материал из списка. Этот материал определяет цвет, прозрачность и эмиссию. Цвета могут быть постоянными или задаваться цветовой картой [48, 69]. В последнем случае используется вторичный атрибут визуализации, независимый от фильтра (Attribute на Рис. 4d). Значения линейно отображаются на карту с возможностью ограничения (Clamp) или повторения (Repeat) диапазона (Рис. 4d), либо случайного назначения цветов (Random), что удобно для категориальных данных.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Функция передачи — это математическое правило, которое определяет, как числовые данные (метки) преобразуются в визуальные характеристики (цвет, прозрачность), позволяя выделять нужные структуры в объеме.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Атрибуты меток A_i: N → R хранятся в базе данных SQLite3 на стороне CPU, что позволяет создавать производные атрибуты через SQL-запросы. Всегда доступен фиктивный атрибут A₀(l) = l. Volcanite также вычисляет геометрические атрибуты (объем, площадь поверхности) для каждой метки в заданном CSGV-объеме. Атрибуты передаются на GPU как буферы чисел с плавающей запятой. Поскольку количество меток обычно на порядки меньше количества вокселей, это эффективно. Для обеспечения непрерывности индексов меток при использовании атрибутов, отличных от A₀, выполняется предварительная обработка: воксели обходятся вдоль 3D-кривой Мортона [50], а метки заменяются на возрастающие индексы. Это отображение сохраняется в базе данных для восстановления исходных меток.&lt;/p&gt;\n&lt;h4 id=\"interfejs-komandnoj-stroki\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#interfejs-komandnoj-stroki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Интерфейс командной строки&lt;/span&gt;&lt;/a&gt;Интерфейс командной строки&lt;/h4&gt;\n&lt;p&gt;Volcanite поддерживает работу в headless-режиме через CLI. Командная строка позволяет детально управлять всеми функциями, включая сжатие/декомпрессию объемов и рендеринг последовательностей. CLI открывает доступ к расширенным настройкам, отсутствующим в GUI, и позволяет использовать программу на серверах без графической оболочки, интегрируя её в скрипты bash или Python через файловую систему.&lt;/p&gt;\n&lt;h4 id=\"konvejer-renderinga-na-gpu\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#konvejer-renderinga-na-gpu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Конвейер рендеринга на GPU&lt;/span&gt;&lt;/a&gt;Конвейер рендеринга на GPU&lt;/h4&gt;\n&lt;p&gt;Volcanite реализован на C++ с использованием API Vulkan. Сжатие объемов выполняется на CPU с параллелизмом OpenMP [56], а рендеринг и декодирование — в шейдерах GLSL. Шейдеры компилируются «на лету» (JIT) для конкретного сжатого объема, что позволяет передавать параметры (размеры блоков, кэша, активные операции CSGV) как константы времени компиляции. Это исключает неиспользуемые ветки кода и оптимизирует использование регистров GPU. Рендерер использует кэш блоков (brick cache), куда распаковываются видимые данные CSGV. Управление кэшем адаптирует этапы запроса, назначения и обеспечения (streaming), назначая видимые блоки свободным ячейкам буфера (Рис. 6a). Внедрен двухэтапный процесс: разделение декомпрессии и назначения, а также многопроходный этап разрешения (denoising и upsampling через фильтр «A-trous»).&lt;/p&gt;\n&lt;p&gt;Процесс рендеринга: лучи проходят через объем, обращаясь к декодированным блокам или помечая новые как видимые. Блоки без видимых меток пропускаются. Этап запроса (request) выполняется в один поток на блок, помечая невидимые блоки и формируя стек запросов для новых блоков. В отличие от базовых методов, вычисление уровней детализации (LOD) перенесено из этапа рендеринга в этап запроса следующего кадра, что устраняет задержки и артефакты при движении камеры. Этап обеспечения (provision) проверяет наличие места в кэше; при нехватке памяти индекс в буфере увеличивается атомарно. После этого этап назначения (assign) привязывает блоки к слотам, а этап декодирования (decode) их распаковывает. В установившемся режиме время выполнения этапов, отличных от рендеринга, составляет менее 2 мс.&lt;/p&gt;\n&lt;h4 id=\"upravlenie-pamyatyu\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#upravlenie-pamyatyu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Управление памятью&lt;/span&gt;&lt;/a&gt;Управление памятью&lt;/h4&gt;\n&lt;p&gt;Объемы данных сегментации часто превышают лимиты видеопамяти (VRAM) потребительских GPU. Например, объем 2048³ с 32-битными метками занимает 32 ГиБ. Для оптимизации мы используем сжатие CSGV и потоковую передачу данных с CPU на GPU. Блоки (bricks) декодируются в кэш только по запросу. Рендерер запрашивает блоки в более низком разрешении (LOD) при удалении от камеры, что уменьшает объем кэша в 8 раз на каждый уровень LOD. Тем не менее, потребление VRAM остается высоким из-за буферов сжатых данных, метаданных кэша, атрибутов меток и параметров рендеринга (см. Рис. A3c). Если объем данных превышает VRAM, размер кэша блоков принудительно сокращается, а в крайнем случае часть данных считывается напрямую из сжатого представления в минимальном LOD.&lt;/p&gt;\n&lt;h4 id=\"optimizaciya-buferov-kodirovaniya\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#optimizaciya-buferov-kodirovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оптимизация буферов кодирования&lt;/span&gt;&lt;/a&gt;Оптимизация буферов кодирования&lt;/h4&gt;\n&lt;p&gt;При коэффициентах сжатия 1–3% большинство томов CSGV помещаются в VRAM. Чтобы обойти ограничение 32-битной индексации (лимит 16 ГиБ) и лимиты API (макс. 4 ГиБ на буфер), мы распределяем блоки по нескольким буферам. Количество блоков, превышающих целевой размер, определяется как &lt;span class=\"yfm-latex\" data-content=\"%5Ceta\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, а индексы блоков отображаются в буферы как &lt;span class=\"yfm-latex\" data-content=\"%5Clfloor%20bi%20%2F%20%5Ceta%20%5Crfloor\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Использование расширения Vulkan buffer device address позволяет GPU выполнять декомпрессию независимо от конкретного буфера.&lt;/p&gt;\n&lt;p&gt;Для потоковой передачи данных с CPU на GPU мы используем разделение: детализированные данные (finest LOD) хранятся отдельно (Brick Detail Encodings, Рис. A3c), а более грубые (32–55% памяти, Рис. 5c) загружаются полностью. Детализированные блоки запрашиваются через буфер Detail Requests, который считывается CPU. Асинхронный конвейер копирует данные в буфер для GPU, работая параллельно в течение нескольких кадров. Во время загрузки буфер помечается как «неконсистентный» для предотвращения ошибок доступа.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Паллетизация кэша — это метод сжатия данных в памяти, при котором вместо хранения полных значений меток хранятся индексы в небольшой таблице (палитре), что позволяет упаковать больше данных в тот же объем памяти.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для экономии места мы применяем паллетизацию кэша: вместо 32-битных меток хранятся упакованные индексы палитры. Количество бит на воксель &lt;span class=\"yfm-latex\" data-content=\"I%20%3D%20%5Clceil%20%5Clog_2(%2FP%2F_%7Bmax%7D)%20%5Crceil\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Мы храним &lt;span class=\"yfm-latex\" data-content=\"%5Clfloor%2032%20%2F%20I%20%5Crfloor\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; записей в 32-битном слове кэша (Рис. A2a). Это увеличивает эффективный объем кэша (Таблица A3), требуя лишь дополнительного обращения к памяти. Наш метод кодирования исключает дубликаты меток в палитрах, что повышает эффективность по сравнению с оригинальным CSGV.&lt;/p&gt;\n&lt;h4 id=\"defragmentaciya-kesha\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#defragmentaciya-kesha\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дефрагментация кэша&lt;/span&gt;&lt;/a&gt;Дефрагментация кэша&lt;/h4&gt;\n&lt;p&gt;Регионы кэша жестко привязаны к уровню LOD, что может приводить к фрагментации. При переполнении кэша мы выполняем его полную очистку (Рис. 6a). При смене LOD, если стек свободных регионов (емкостью 1 048 576 блоков) переполнен, мы принудительно переключаем LOD без возврата региона в стек, что создает «мертвое» пространство до следующей дефрагментации.&lt;/p&gt;\n&lt;h4 id=\"ogranichenie-zaprosov-k-kirpicham-brickrequestlimitation\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#ogranichenie-zaprosov-k-kirpicham-brickrequestlimitation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничение запросов к кирпичам (BrickRequestLimitation)&lt;/span&gt;&lt;/a&gt;Ограничение запросов к кирпичам (BrickRequestLimitation)&lt;/h4&gt;\n&lt;p&gt;Эффективность кэширования зависит от способности системы удерживать все необходимые блоки данных (bricks) в требуемых уровнях детализации (LOD). Если кэш переполняется из-за запросов от множества лучей, возникает конфликт. Для решения этой проблемы применяется ограничение запросов: рендерер разрешает запрашивать новые блоки только для ограниченной области пикселей (зеленая зона на Рис. A2c), что концентрирует ресурсы кэша на меньшем подмножестве лучей. Блоки, требуемые для пикселей вне этой зоны, принудительно освобождаются. Механизм активируется автоматически, если разница между минимальным и максимальным количеством выборок (samples) на пиксель превышает заданный порог. Размер зоны динамически регулируется контуром обратной связи в зависимости от интенсивности накопления выборок.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ограничение запросов — это метод приоритизации данных, при котором система «отсекает» менее важные запросы к памяти, чтобы гарантировать, что критически важные для текущего кадра данные всегда доступны в кэше.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;На Рис. A7a показано, что количество обращений к блокам объема растет с увеличением глубины трассировки лучей. Для первичных лучей (глубина ≤ 1) эффект минимален, но для длинных путей трассировки система может запрашивать распаковку целых блоков ради одного сэмпла. По умолчанию мы ограничиваем глубину запросов до 1. Если система обращается к еще не декодированному блоку, она использует метку из самого грубого уровня LOD, не отменяя уже накопленный цвет пикселя, так как влияние такой непрямой освещенности обычно незначительно.&lt;/p&gt;\n&lt;h4 id=\"generaciya-psevdosluchajnyh-chisel\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#generaciya-psevdosluchajnyh-chisel\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Генерация псевдослучайных чисел&lt;/span&gt;&lt;/a&gt;Генерация псевдослучайных чисел&lt;/h4&gt;\n&lt;p&gt;Случайные числа определяют направления лучей и смещения для сглаживания. Поскольку кэш блоков имеет задержку в один кадр (Рис. 6a), изменение случайных чисел в следующем кадре может привести к запросу новых, еще не декодированных данных. Чтобы этого избежать, мы используем детерминированный генератор случайных чисел для каждого потока пикселей, инициализируемый количеством накопленных валидных выборок. Это гарантирует, что пиксель будет просчитывать один и тот же путь луча до тех пор, пока данные не станут доступны. Для предотвращения блокировок (deadlocks) состояние генератора принудительно меняется каждые 256 кадров. Инициализация зависит от координат пикселя согласно паттерну blue noise (32x32) для оптимизации шума. В качестве генератора используется 2D PCG-хэширование. Итоговое начальное значение (seed) для пикселя p после f кадров вычисляется как: PCG2D(blueNoise32×32(p), (28⌊f / 256⌋) ⊕ s), где ⊕ — побитовое исключающее ИЛИ.&lt;/p&gt;\n&lt;h4 id=\"analiz-proizvoditelnosti-renderinga\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#analiz-proizvoditelnosti-renderinga\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ производительности рендеринга&lt;/span&gt;&lt;/a&gt;Анализ производительности рендеринга&lt;/h4&gt;\n&lt;p&gt;Исследование эффективности методов визуализации проводилось на наборе из 14 различных датасетов, включая такие объекты, как Polyamid, Fabric, MouseBA, Cells, Battery, AZBA, H01BV, H01WM, Plant, Liconn, Fiber, MouseL4S, Fabricval и MouseL4. Для каждого объекта оценивались четыре техники затенения: local (локальное), shadow (тени), ao (ambient occlusion — окклюзия окружения) и pt (path tracing — трассировка путей). Тестирование проводилось в двух режимах: для статической камеры (static camera) и для движущейся камеры (moving camera). Основными метриками выступали время отрисовки кадра (в мс) и статистические показатели (минимум, медиана, максимум).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ambient Occlusion (AO) и Path Tracing (PT) — это методы глобального освещения, которые требуют значительно больше вычислительных ресурсов, чем локальное затенение, так как учитывают взаимодействие света с геометрией сцены.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для статической камеры значения времени отрисовки варьировались от минимальных 1.2 мс (Battery, local) до пиковых 238.64 мс (H01BV, pt). В режиме движущейся камеры наблюдались более низкие показатели медианного времени, однако для сложных сцен, таких как H01BV, время отрисовки при использовании PT достигало 174.72 мс. Различия в производительности между методами затенения показывают, что переход от локального затенения к PT увеличивает нагрузку на систему в 3–10 раз в зависимости от сложности геометрии объекта.&lt;/p&gt;\n&lt;h4 id=\"optimizaciya-keshirovaniya-i-pamyati\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#optimizaciya-keshirovaniya-i-pamyati\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оптимизация кэширования и памяти&lt;/span&gt;&lt;/a&gt;Оптимизация кэширования и памяти&lt;/h4&gt;\n&lt;p&gt;Дополнительно оценивалась эффективность использования кэша (Cache Paletting) и влияние упаковки данных (Packing Factor). Использование кэширования позволило существенно сократить объем занимаемой памяти (Cache Used [MB]). Например, для датасета Polyamid объем памяти снизился с 4134.7 МБ до 516.84 МБ при включении кэширования. Коэффициент упаковки данных варьировался от 1.68 (Battery) до 20.5 (Fiber). Количество сэмплов на пиксель (SPP) поддерживалось в диапазоне от 1014 до 1023, что обеспечивает стабильное качество изображения при различных настройках производительности.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 3.&lt;/strong&gt; Сравнение коэффициента сжатия&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Категория&lt;/th&gt;\n&lt;th&gt;Коэффициент сжатия [%] (Без стоп-битов)&lt;/th&gt;\n&lt;th&gt;Коэффициент сжатия [%] (Со стоп-битами)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Fabricval&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Battery&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 4.&lt;/strong&gt; Сравнение коэффициента сжатия&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Категория&lt;/th&gt;\n&lt;th&gt;Коэффициент сжатия [%] (Без стоп-битов)&lt;/th&gt;\n&lt;th&gt;Коэффициент сжатия [%] (Со стоп-битами)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;AZBA&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Plant&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 5.&lt;/strong&gt; Сравнение коэффициента сжатия&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Категория&lt;/th&gt;\n&lt;th&gt;Коэффициент сжатия [%] (Без стоп-битов)&lt;/th&gt;\n&lt;th&gt;Коэффициент сжатия [%] (Со стоп-битами)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;MouseL4S&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;MouseBA&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;strong&gt;Таблица S1.&lt;/strong&gt; Время предварительной обработки Volcanite, VTK (C++ API) и Neuroglancer с размером файлов на диске&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Набор данных&lt;/th&gt;\n&lt;th&gt;Сжатие (с)&lt;/th&gt;\n&lt;th&gt;Файловый ввод/вывод (с)&lt;/th&gt;\n&lt;th&gt;Всего с вводом/выводом (с)&lt;/th&gt;\n&lt;th&gt;TTFF (с)&lt;/th&gt;\n&lt;th&gt;Размер (Direct) (ГБ)&lt;/th&gt;\n&lt;th&gt;Размер (gzip) (ГБ)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Volcanite&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;
