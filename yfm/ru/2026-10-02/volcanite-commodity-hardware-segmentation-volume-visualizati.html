d&gt;\n&lt;td&gt;5m04.1s&lt;/td&gt;\n&lt;td&gt;26m50.4s&lt;/td&gt;\n&lt;td&gt;31m54.5s&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;8.218&lt;/td&gt;\n&lt;td&gt;3.932&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Fabric&lt;/td&gt;\n&lt;td&gt;38m20.0s&lt;/td&gt;\n&lt;td&gt;10m41.4s&lt;/td&gt;\n&lt;td&gt;49m01.4s&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;3.663&lt;/td&gt;\n&lt;td&gt;0.796&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;MouseL4&lt;/td&gt;\n&lt;td&gt;1h26m23.1s&lt;/td&gt;\n&lt;td&gt;12h12m21.8s&lt;/td&gt;\n&lt;td&gt;13h38m44.9s&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;177.108&lt;/td&gt;\n&lt;td&gt;84.029&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;H01WM&lt;/td&gt;\n&lt;td&gt;2h47m35.5s&lt;/td&gt;\n&lt;td&gt;7d12m25.8s&lt;/td&gt;\n&lt;td&gt;7d3h01.3s&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;505.080&lt;/td&gt;\n&lt;td&gt;230.897&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Включая вторичное сжатие gzip. TTFF — время до первого кадра.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 2.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-tT2.jpg\" alt=\"Таблица 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 6.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-tT6.jpg\" alt=\"Таблица 6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 7.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-tT7.jpg\" alt=\"Таблица 7\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 8.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-tT8.jpg\" alt=\"Таблица 8\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS1.jpg\" alt=\"Рис. S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS2.jpg\" alt=\"Рис. A2: Управление памятью GPU. b Операция δ имеет решающее значение для ограничения максимальных размеров палитр блоко\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. A2: Управление памятью GPU. b Операция δ имеет решающее значение для ограничения максимальных размеров палитр блоков /P/, что влияет на коэффициенты упаковки кэша.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. A2: Управление памятью GPU. b Операция δ имеет решающее значение для ограничения максимальных размеров палитр блоков /P/, что влияет на коэффициенты упаковки кэша. Наш новый (неограниченный) δ устраняет дубликаты палитр. c Ограничение запросов блоков позволяет только определенным пикселям (зеленые) запрашивать кэш блоков. Это предотвращает взаимные блокировки при ограниченном объеме кэша за счет концентрации ресурсов вокруг пикселя с наименьшим количеством отрисованных выборок (красный). d Использование памяти GPU при рендеринге изображения с лучами теней. Для небольших данных кэш доминирует в потреблении памяти на нашем GPU с 16 ГиБ VRAM. Для больших данных, где эффективность памяти является обязательной, наш метод значительно ограничивает потребление памяти по сравнению с размерами необработанных данных. Для Polyamid, Fiber, H01BV, Fabric, MouseL4 и H01WM мы используем нашу палитру кэша для увеличения эффективного размера кэша с помощью коэффициента упаковки. Общее потребление VRAM включает другие данные.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS3.jpg\" alt=\"Рис. A3: a Конвейер постобработки для шумоподавления и апскейлинга накопленных кадров рендеринга.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. A3: a Конвейер постобработки для шумоподавления и апскейлинга накопленных кадров рендеринга.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. A3: a Конвейер постобработки для шумоподавления и апскейлинга накопленных кадров рендеринга. Два чередующихся буфера ping-pong содержат предыдущую (входную) и текущую (выходную) яркость RGBA (Accum.) и количество выборок (SampleCnt) на пиксель. Следующий конвейер разрешения работает с двумя чередующимися 16-битными текстурами RGBA и выходными данными G-буфера рендерера, которые остаются неизменными на протяжении всего конвейера. b В мировом пространстве набор данных масштабируется до размера 1 по своей наибольшей размерности и центрируется вокруг начала координат. Значения глубины для G-буфера вычисляются как ∥h − p∥, где p — это точка первого попадания в поверхность, спроецированная на сферу, которая охватывает единичный куб в направлении камеры. c Соответствующие буферы памяти и поток данных внутри архитектуры рендеринга. Кодировки блоков хранятся в нескольких больших буферах. Для очень больших наборов данных самое высокое разрешение блоков (детализация) передается на GPU по требованию. Во время рендеринга видимые блоки распаковываются в кэш GPU, возможно, в упакованном формате. d Конвейер CPU для создания буферов кодирования для самого высокого уровня детализации (LOD). Состояния конвейера белым цветом, процедуры синим цветом.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS6.jpg\" alt=\"Рис. A6: Время кадров для рендеринга изображений (первые 21 кадр, статичная камера) и видео с лучами теней. Для крупных \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. A6: Время кадров для рендеринга изображений (первые 21 кадр, статичная камера) и видео с лучами теней. Для крупных планов рендеринг доминирует во времени после того, как результаты начальных накладных расходов на декомпрессию кэшируются.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS6-2.jpg\" alt=\"Рис. S6 (продолжение 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S6 (продолжение 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS6-3.jpg\" alt=\"Рис. S6 (продолжение 3)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S6 (продолжение 3)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS6-4.jpg\" alt=\"Рис. S6 (продолжение 4)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S6 (продолжение 4)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS6-5.jpg\" alt=\"Рис. S6 (продолжение 5)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S6 (продолжение 5)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS6-6.jpg\" alt=\"Рис. S6 (продолжение 6)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S6 (продолжение 6)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS6-7.jpg\" alt=\"Рис. S6 (продолжение 7)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S6 (продолжение 7)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS7.jpg\" alt=\"Рис. A7: a Режимы затенения оценивают перенос света вдоль различных глубин (пронумерованы) и направлений путей лучей.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. A7: a Режимы затенения оценивают перенос света вдоль различных глубин (пронумерованы) и направлений путей лучей.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. A7: a Режимы затенения оценивают перенос света вдоль различных глубин (пронумерованы) и направлений путей лучей. Локальное затенение отслеживает только лучи обзора глубины 0 (черный). Опционально отслеживаются вторичные лучи теней (желтый) к источнику света. Окружающее затенение отслеживает 1 направление в произвольных направлениях (синий). Трассировка путей оценивает полный перенос вдоль произвольных глубин (красный). Режимы затенения получают доступ к увеличивающемуся количеству блоков в этом порядке (цветные). b Время кадров для стационарного изображения H01WM объемом 2,2 ТБ. Поскольку более продвинутое затенение обращается к большему количеству объемных блоков, производительность рендеринга снижается. c Рендеринг изображения H01WM после 1024 кадров сходимости. Режимы затенения можно менять с немедленной обратной связью. Хотя локальное затенение быстрое, тени или окружающее затенение улучшают визуальное восприятие структур. Трассировка путей обеспечивает наивысшую визуальную точность, например, оценивая непрямые отскоки света от оранжевых нейронов.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS8.jpg\" alt=\"Рис. S8\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S8&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati-fS8-2.jpg\" alt=\"Рис. S8 (продолжение 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S8 (продолжение 2)&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Сложность&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;анализа&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;терабайтных&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;данных&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Прямой&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;рендеринг&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;вокселей через&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Vulkan&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Интерактивная&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;визуализация&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;500 млрд&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;вокселей&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Ускорение&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;диагностики и&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;научных&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;открытий&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт не проходил рецензирование. Выводы предварительные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-02/volcanite-commodity-hardware-segmentation-volume-visualizati.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;arXiv&lt;/td&gt;\n&lt;td&gt;cad_parametri
