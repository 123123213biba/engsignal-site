        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"165\" cy=\"140\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"635\" cy=\"252\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     ENGSIGNAL · CEMENT_CHEM   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Цифровой двойник цемента:&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;как нейросети предсказывают&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;прочность бетона&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;Гидросиликат кальция (C-S-H) — главный компонент цементного камня, чья сложная структура десятилетиями оставалась загадкой для моделирования. Новый метод CSH-MLP использует машинное обучение для анализа более 50 000 конфигураций, полученных методами теории функционала плотности (DFT). Это позволяет проводить масштабные симуляции прочности и долговечности бетона в 30 раз быстрее существующих аналогов.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-02/machine-learning-potential-for-calcium-silicate-hydrates-wit.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;CSH-MLP обучен на 50 000+ конфигурациях с DFT-точностью.&lt;/li&gt;\n&lt;li&gt;Ускорение расчетов в 30 раз по сравнению с ReaxFF.&lt;/li&gt;\n&lt;li&gt;Модель охватывает широкий диапазон Ca/Si отношений от 0,83 до 2,5.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-02/machine-learning-potential-for-calcium-silicate-hydrates-wit.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Основная проблема моделирования C-S-H заключается в его наноразмерной неоднородности и аморфности. Традиционные силовые поля, такие как ClayFF или ReaxFF, либо не учитывают химическую реакционную способность, либо требуют огромных вычислительных затрат. Разработанный CSH-MLP обучался на датасете из 1890 оптимизированных DFT-структур, дополненных 9450 возмущенными конфигурациями и 39 057 состояниями из молекулярно-динамических траекторий.&lt;/p&gt;\n&lt;p&gt;Модель охватывает широкий диапазон отношений Ca/Si (от 0,83 до 2,5), что позволяет точно предсказывать механические свойства, включая модули упругости и поведение при высоких давлениях. Использование метода SOAP (Smooth Overlap of Atomic Positions) для анализа структуры подтвердило, что нейросеть успешно покрывает всё разнообразие конфигураций C-S-H. В результате CSH-MLP обеспечивает точность, сопоставимую с DFT, при значительном ускорении расчетов, что открывает путь к созданию экологически устойчивых строительных материалов нового поколения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель ограничена набором данных, использованных при обучении, и может терять точность при экстремальных условиях, не представленных в выборке.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-02/machine-learning-potential-for-calcium-silicate-hydrates-wit.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Цемент, материал, история которого насчитывает более 2000 лет, а промышленное производство — более 200 лет, является самым массовым продуктом человечества. Однако он также вносит значительный вклад в глобальные выбросы углерода, составляя почти 8% от общего объема. Снижение экологического следа цемента при удовлетворении растущего спроса на инфраструктуру требует глубокого прогностического понимания его характеристик на различных масштабных уровнях. Центральной связующей фазой в гидратированном цементном камне является гидросиликат кальция (C–S–H) — нанокристаллический и рентгеноаморфный гель с переменным составом и локальным разупорядочением, который в первую очередь отвечает за когезию, прочность и долговечность цементных материалов. Несмотря на его критическую роль, структура и механическое поведение C–S–H на атомном уровне остаются неясными, главным образом из-за его гетерогенной химии и слабой кристалличности. Эта сложность долгое время препятствовала экспериментальному определению его локальной структуры и прогнозированию свойств.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Атомистическое моделирование, в частности молекулярная динамика (МД) и ab initio расчеты, незаменимы для понимания структурных, механических и термодинамических свойств цемента, дополняя экспериментальные данные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ab initio методы (например, теория функционала плотности, DFT) — это высокоточные квантово-механические расчеты, которые считаются эталонными, но требуют огромных вычислительных затрат.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Классические силовые поля (ClayFF, CSH-FF, ReaxFF, ERICA FF) позволяют моделировать большие системы, но имеют ограничения: либо низкую точность воспроизведения механических свойств, либо неспособность описывать реакционную способность, либо высокую вычислительную сложность.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для преодоления пространственно-временных ограничений квантово-механических расчетов при сохранении их точности мощной альтернативой стали потенциалы машинного обучения (MLP) или межатомные потенциалы машинного обучения (MLIP). MLP обеспечивают точность, близкую к DFT, при значительно меньших затратах, позволяя моделировать большие и разупорядоченные системы на наносекундных интервалах. В данном исследовании мы представляем стратегию генерации данных для создания набора атомных структур C–S–H, охватывающего широкий диапазон отношений Ca/Si, топологий дефектов и состояний гидратации. На основе этого набора мы обучаем точный и обобщаемый MLP для C–S–H (CSH-MLP) и подтверждаем его точность путем сравнения структурных и механических прогнозов с результатами ab initio моделирования и существующими силовыми полями. Основной вклад данной работы заключается в разнообразии набора данных C–S–H и, как следствие, в композиционной и структурной обобщаемости CSH-MLP.&lt;/p&gt;\n&lt;p&gt;Предложенный CSH-MLP не только демонстрирует высокую точность в прогнозировании механических свойств и структурных особенностей C–S–H, но и достигает стехиометрической обобщаемости для почти 700 различных составов, масштабируемости до крупных систем и замечательной способности к экстраполяции на неизученные структуры. Примечательно, что CSH-MLP устраняет давние расхождения между измерениями рентгеновской дифракции при высоком давлении и моделями C–S–H, основанными на дефектах. Мы также показываем, что CSH-MLP обеспечивает ускорение вычислений до 30 раз по сравнению с ReaxFF, позволяя проводить крупномасштабное моделирование цементных материалов с точностью, близкой к DFT.&lt;/p&gt;\n&lt;p&gt;Точность и обобщаемость MLP сильно зависят от качества и разнообразия обучающей выборки. Однако на сегодняшний день не существует общедоступной базы данных, содержащей экспериментально полученные атомные структуры цемента из-за его нанокристаллической природы, гетерогенного состава и динамической химической среды. Чтобы заполнить этот пробел, мы разработали стратегию генерации данных для создания набора, размеченного с помощью DFT, который отражает уникальные характеристики структур C–S–H. Стратегия включает четыре основных этапа: (i) построение модели и контроль избыточности, (ii) оптимизация структуры, (iii) аугментация неравновесных данных и (iv) одноточечные расчеты DFT (Рис. 1).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Одноточечные расчеты DFT — это вычисление энергии и сил для фиксированной конфигурации атомов без изменения их координат, что необходимо для «обучения» потенциала машинного обучения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;На первом этапе с помощью программы pyCSH было сгенерировано около 500 000 суперячеек C–S–H, а процесс отбора сократил их до 1926 независимых структур, охватывающих 688 составов. На втором этапе выбранные модели были уравновешены с помощью МД-симуляций в ансамблях NVT и NPT, а затем оптимизированы на уровне DFT. Это привело к получению 1890 конфигураций. На третьем этапе была принята двухступенчатая стратегия аугментации, включающая структурные возмущения (9450 вариантов) и извлечение структур из 100 траекторий МД-уравновешивания (39 057 конфигураций) для выборки неравновесных и метастабильных состояний. Все конфигурации были размечены высокоточными расчетами DFT, составив итоговый набор данных C–S–H.&lt;/p&gt;\n&lt;p&gt;Структурное разнообразие внутри набора данных C–S–H было определено методом дескрипторов SOAP, а структурные признаки были спроецированы на двумерную плоскость с помощью алгоритма снижения размерности PCA. Рис. 2 отражает внутреннюю структурную информацию различных поднаборов. Результаты демонстрируют высокую степень дисперсии, подтверждая эффективность предложенного метода отбора в охвате широкого спектра конфигурационного пространства. Более того, отношения Ca/Si и 2H/Si оказывают существенное влияние на структурные параметры набора данных. Синхронная тенденция роста Ca/Si и 2H/Si хорошо согласуется с экспериментальными результатами.&lt;/p&gt;\n&lt;p&gt;Точность CSH-MLP была подтверждена путем сравнения атомной энергии и сил, предсказанных MLP, с результатами DFT. Рис. 3 демонстрирует сильную линейную корреляцию между результатами MLP и DFT как для обучающей, так и для тестовой выборок. Среднеквадратичные ошибки (RMSE) для атомных энергий составляют 1,18 и 1,50 мэВ/атом для обучающей и тестовой выборок соответственно. Для атомных сил значения RMSE составляют 0,092 и 0,102 эВ/Å соответственно. Эти значения находятся в нижней части диапазона ошибок для существующих MLP, что подтверждает высокую точность и надежность CSH-MLP.&lt;/p&gt;\n&lt;p&gt;Постоянные решетки структур тоберморита и модели C–S–H были оптимизированы с использованием MLMD и DFT-симуляций, а результаты были сравнены с данными ранее разработанных силовых полей (Таблица 1). Для эталонной модели C–S–H CSH-MLP демонстрирует превосходные характеристики с максимальным отклонением всего 0,23% и средним расхождением 0,14%, значительно превосходя другие силовые поля. Эти результаты подчеркивают выдающуюся способность CSH-MLP точно воспроизводить структурные характеристики нанокристаллических фаз, подобных C–S–H.&lt;/p&gt;\n&lt;p&gt;Для бенчмаркинга динамических свойств мы рассчитали среднеквадратичное смещение (MSD) различных атомных видов с использованием ClayFF, ReaxFF, csh_cp и CSH-MLP для DFT-оптимизированной эталонной модели C–S–H (Рис. 6a–d). Флуктуации MSD у CSH-MLP являются более согласованными и стабильными, чем у csh_cp, что свидетельствует о более слабых тепловых вибрациях C–S–H под потенциалом CSH-MLP. Эти результаты подтверждают, что CSH-MLP достигает более высокой точности и стабильности, чем ранее разработанные MLP на основе цемента.&lt;/p&gt;\n&lt;p&gt;Рис. 7a,b представляет тензор упругости эталонной модели C–S–H, предсказанный CSH-MLP и csh_cp, вместе с их отклонениями от DFT. По сравнению с csh_cp, CSH-MLP показывает большее согласие с DFT. Анализ нормальных компонент тензора упругости выявляет четкую немонотонную тенденцию в механическом отклике C–S–H. При увеличении Ca/Si от 1,3 до 1,5 значения C₁₁, C₂₂ и C₃₃ возрастают с 99,12 до 105,94 ГПа, с 96,71 до 100,02 ГПа и с 60,39 до 76,04 ГПа соответственно; при дальнейшем увеличении Ca/Si они падают до 95,15, 91,46 и 68,44 ГПа соответственно. Наши симуляции дают объяснение этого поведения на атомном уровне, связывая экспериментальные наблюдения со структурной эволюцией C–S–H.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-02/machine-learning-potential-for-calcium-silicate-hydrates-wit.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Сложность&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;моделирования&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;структуры&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;C-S-H&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Обучение&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;нейросети на&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;50к DFT-&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;моделях&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Точность DFT&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;при высокой&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;скорости&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8
